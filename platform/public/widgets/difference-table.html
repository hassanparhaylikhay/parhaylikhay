<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Difference Table</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:22px; }
  .formula { font-size:16px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .controls { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px 14px; margin-bottom:14px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] { flex:1; min-width:60px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:30px; text-align:right; color:#f0eeea; font-weight:600; }

  .table-wrap { padding:0 4px; }
  /* 12 equal columns + a leading label column. Each TERM cell spans 2
     columns (cols 2..13). Each 1st-diff cell spans 2 cols offset by 1
     (cols 3..12) so it sits visually CENTRED between two terms. Each
     2nd-diff cell offsets by 2 (cols 4..11). */
  .table-row {
    display:grid; grid-template-columns:max-content repeat(12, 1fr); gap:6px 4px;
    margin-bottom:6px; align-items:center;
  }
  .label { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; padding:6px 8px; grid-column: 1; }
  .cell {
    background:#07090d; border:1px solid #141e2a; border-radius:5px;
    padding:7px 0; text-align:center;
    font-family:'Geist Mono',monospace; font-size:13px;
  }
  .cell.terms { color:#f0eeea; border-color:#3a4a5a; }
  .cell.first { color:#fff067; border-color:rgba(255,240,103,0.32); }
  .cell.second { color:#0fee89; border-color:rgba(15,238,137,0.32); }

  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <div class="row"><span class="name">a</span><input type="range" id="a" min="-3" max="3" value="1" step="1"/><span class="val" id="va">1</span></div>
    <div class="row"><span class="name">b</span><input type="range" id="b" min="-5" max="5" value="0" step="1"/><span class="val" id="vb">0</span></div>
    <div class="row"><span class="name">c</span><input type="range" id="c" min="-5" max="5" value="0" step="1"/><span class="val" id="vc">0</span></div>
  </div>

  <div class="table-wrap">
    <div class="table-row" id="rowTerms">
      <div class="label" style="color:#c8c6be">terms</div>
    </div>
    <div class="table-row" id="rowFirst">
      <div class="label" style="color:#fff067">1st diff</div>
    </div>
    <div class="table-row" id="rowSecond">
      <div class="label" style="color:#0fee89">2nd diff</div>
    </div>
  </div>

  <p class="footer">2nd diff is constant for any quadratic; it equals 2a.</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var aVal = 1, bVal = 0, cVal = 0;

function fmtTerm(coef, suf) {
  if (coef === 0) return "";
  if (coef === 1 && suf !== "") return suf;
  if (coef === -1 && suf !== "") return "-" + suf;
  return coef + suf;
}

function fmtFormula(a, b, c) {
  // T_n = an^2 + bn + c, omitting zero terms but keeping leading sign
  var parts = [];
  if (a !== 0) parts.push(fmtTerm(a, "n^2"));
  if (b !== 0) {
    if (parts.length === 0) parts.push(fmtTerm(b, "n"));
    else parts.push((b < 0 ? " - " : " + ") + fmtTerm(Math.abs(b), "n"));
  }
  if (c !== 0) {
    if (parts.length === 0) parts.push(String(c));
    else parts.push((c < 0 ? " - " : " + ") + Math.abs(c));
  }
  if (parts.length === 0) parts.push("0");
  return "T_n = " + parts.join("");
}

function buildRow(rowId, values, cls, startCol) {
  // startCol = the grid-column at which the FIRST cell begins. Each cell
  // spans 2 columns. For the terms row, startCol = 2 (cells fill cols 2..13).
  // For 1st diff, startCol = 3 (cells fill cols 3..12, centred between
  // the term cells above). For 2nd diff, startCol = 4.
  var rowEl = document.getElementById(rowId);
  while (rowEl.children.length > 1) rowEl.removeChild(rowEl.lastChild);
  values.forEach(function(v, i) {
    var c = document.createElement("div");
    c.className = "cell " + cls;
    c.style.gridColumn = (startCol + i * 2) + " / span 2";
    c.textContent = v;
    rowEl.appendChild(c);
  });
}

function update() {
  tryRender(document.getElementById("formula"), fmtFormula(aVal, bVal, cVal));

  var terms = [];
  for (var n = 1; n <= 6; n++) {
    terms.push(aVal * n * n + bVal * n + cVal);
  }
  buildRow("rowTerms", terms, "terms", 2);

  var firstDiffs = [];
  for (var i = 1; i < terms.length; i++) firstDiffs.push(terms[i] - terms[i - 1]);
  buildRow("rowFirst", firstDiffs, "first", 3);

  var secondDiffs = [];
  for (var j = 1; j < firstDiffs.length; j++) secondDiffs.push(firstDiffs[j] - firstDiffs[j - 1]);
  buildRow("rowSecond", secondDiffs, "second", 4);
}

document.getElementById("a").addEventListener("input", function(e) {
  aVal = parseInt(e.target.value, 10);
  document.getElementById("va").textContent = aVal;
  update();
});
document.getElementById("b").addEventListener("input", function(e) {
  bVal = parseInt(e.target.value, 10);
  document.getElementById("vb").textContent = bVal;
  update();
});
document.getElementById("c").addEventListener("input", function(e) {
  cVal = parseInt(e.target.value, 10);
  document.getElementById("vc").textContent = cVal;
  update();
});
update();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
