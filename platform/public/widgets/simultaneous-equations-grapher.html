<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Simultaneous Equations Grapher</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:16px 18px 18px; }
  .wrap { max-width:480px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; gap:14px; min-height:22px; flex-wrap:wrap; }
  .formula-line { font-size:13px; }
  .formula-line .katex { font-size:1em; }
  .line1 { color:#fff067; }
  .line2 { color:#0fee89; }

  .controls { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px 14px; margin-bottom:14px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .slider-row { display:flex; align-items:center; gap:8px; min-width:0; }
  .slider-row .name { font-weight:600; min-width:24px; }
  .slider-row.l1 .name { color:#fff067; }
  .slider-row.l2 .name { color:#0fee89; }
  .slider-row input[type=range] { flex:1; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .slider-row.l1 input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .slider-row.l2 input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#0fee89; cursor:pointer; border:0; }
  .slider-row.l1 input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .slider-row.l2 input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#0fee89; cursor:pointer; border:0; }
  .slider-row .val { min-width:24px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .line-1 { stroke:#fff067; stroke-width:2; fill:none; }
  .line-2 { stroke:#0fee89; stroke-width:2; fill:none; }
  .ix-dot { fill:#00abfa; stroke:#0b1118; stroke-width:2; }

  .readout {
    margin-top:10px; padding:10px 12px;
    background:#07090d; border:1px solid #141e2a; border-radius:6px;
    font-family:'Geist Mono',monospace; font-size:13px; color:#f0eeea;
    text-align:center; min-height:30px;
  }
  .readout .ok { color:#00abfa; }
  .readout .none { color:#ff4670; }
  .readout .infinite { color:#fff067; }
  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula-line line1" id="formula1"></span>
    <span class="formula-line line2" id="formula2"></span>
  </div>

  <div class="controls">
    <div class="slider-row l1"><span class="name">m₁</span><input type="range" id="m1" min="-3" max="3" value="2" step="0.1"/><span class="val" id="vm1">2</span></div>
    <div class="slider-row l1"><span class="name">c₁</span><input type="range" id="c1" min="-5" max="5" value="-1" step="0.1"/><span class="val" id="vc1">-1</span></div>
    <div class="slider-row l2"><span class="name">m₂</span><input type="range" id="m2" min="-3" max="3" value="-1" step="0.1"/><span class="val" id="vm2">-1</span></div>
    <div class="slider-row l2"><span class="name">c₂</span><input type="range" id="c2" min="-5" max="5" value="5" step="0.1"/><span class="val" id="vc2">5</span></div>
  </div>

  <svg viewBox="0 0 360 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <line class="line-1" id="L1"/>
    <line class="line-2" id="L2"/>
    <circle class="ix-dot" id="ixDot" r="5" style="display:none"/>
  </svg>

  <div class="readout" id="readout"></div>
  <p class="footer">drag m or c to change each line. blue dot = solution.</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// =========================================================================
// COORDINATE MODEL — square plot with EQUAL pixel-per-unit on both axes.
// Without this the slopes lie to the student.
// =========================================================================
var XMIN = -6, XMAX = 6, YMIN = -6, YMAX = 6;   // 12 × 12 math units
var PX_LEFT = 30, PX_RIGHT = 330;               // plot box: 300 px wide
var PX_TOP  = 30, PX_BOT   = 330;               // plot box: 300 px tall
// 300 / 12 = 25 px per math unit, on BOTH axes.

function xPx(x) { return PX_LEFT + ((x - XMIN) / (XMAX - XMIN)) * (PX_RIGHT - PX_LEFT); }
function yPx(y) { return PX_BOT  - ((y - YMIN) / (YMAX - YMIN)) * (PX_BOT  - PX_TOP);  }

(function buildAxes() {
  var g = document.getElementById("grid");
  var t = document.getElementById("ticks");
  var x0 = xPx(0), y0 = yPx(0);
  document.getElementById("xAxis").setAttribute("x1", PX_LEFT);
  document.getElementById("xAxis").setAttribute("x2", PX_RIGHT);
  document.getElementById("xAxis").setAttribute("y1", y0);
  document.getElementById("xAxis").setAttribute("y2", y0);
  document.getElementById("yAxis").setAttribute("x1", x0);
  document.getElementById("yAxis").setAttribute("x2", x0);
  document.getElementById("yAxis").setAttribute("y1", PX_TOP);
  document.getElementById("yAxis").setAttribute("y2", PX_BOT);
  for (var x = XMIN; x <= XMAX; x++) {
    var px = xPx(x);
    if (x !== 0) {
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "grid-line");
      line.setAttribute("x1", px); line.setAttribute("x2", px);
      line.setAttribute("y1", PX_TOP); line.setAttribute("y2", PX_BOT);
      g.appendChild(line);
    }
    if (x !== 0 && x % 2 === 0) {
      var tl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tl.setAttribute("class", "axis-tick-label");
      tl.setAttribute("x", px); tl.setAttribute("y", y0 + 14);
      tl.setAttribute("text-anchor", "middle");
      tl.textContent = x;
      t.appendChild(tl);
    }
  }
  for (var y = YMIN; y <= YMAX; y++) {
    var py = yPx(y);
    if (y !== 0) {
      var gl = document.createElementNS("http://www.w3.org/2000/svg", "line");
      gl.setAttribute("class", "grid-line");
      gl.setAttribute("x1", PX_LEFT); gl.setAttribute("x2", PX_RIGHT);
      gl.setAttribute("y1", py); gl.setAttribute("y2", py);
      g.appendChild(gl);
    }
    if (y !== 0 && y % 2 === 0) {
      var tly = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tly.setAttribute("class", "axis-tick-label");
      tly.setAttribute("x", x0 - 6); tly.setAttribute("y", py + 3);
      tly.setAttribute("text-anchor", "end");
      tly.textContent = y;
      t.appendChild(tly);
    }
  }
})();

function clipLineToPlot(m, c) {
  // Find the segment of y = mx + c that fits inside the visible plot box.
  // For each side of the box, compute the intersection (if any), then keep
  // the two that fall inside the y range.
  var pts = [];
  // Left edge: x = XMIN
  var yL = m * XMIN + c;
  if (yL >= YMIN && yL <= YMAX) pts.push({ x: XMIN, y: yL });
  // Right edge: x = XMAX
  var yR = m * XMAX + c;
  if (yR >= YMIN && yR <= YMAX) pts.push({ x: XMAX, y: yR });
  // Bottom edge: y = YMIN
  if (m !== 0) {
    var xB = (YMIN - c) / m;
    if (xB > XMIN && xB < XMAX) pts.push({ x: xB, y: YMIN });
  }
  // Top edge: y = YMAX
  if (m !== 0) {
    var xT = (YMAX - c) / m;
    if (xT > XMIN && xT < XMAX) pts.push({ x: xT, y: YMAX });
  }
  if (pts.length < 2) return null;
  // dedupe and pick first two
  return { x1: pts[0].x, y1: pts[0].y, x2: pts[1].x, y2: pts[1].y };
}

function fmtCoef(c) {
  if (Math.abs(c) < 0.05) return "";
  var rounded = Math.round(c * 10) / 10;
  return (rounded < 0 ? " - " : " + ") + Math.abs(rounded);
}

function fmtSlope(m) {
  if (Math.abs(m) < 0.05) return "0";
  var rounded = Math.round(m * 10) / 10;
  if (rounded === 1) return "x";
  if (rounded === -1) return "-x";
  return rounded + "x";
}

// =========================================================================
// SPRING ANIMATION — target vs display split
// =========================================================================
// Target values are set instantly by sliders. Display values spring toward
// the targets each rAF frame. draw() always reads the display values.
var targetM1 = 2, targetC1 = -1, targetM2 = -1, targetC2 = 5;
var displayM1 = targetM1, displayC1 = targetC1;
var displayM2 = targetM2, displayC2 = targetC2;
var SPRING = 0.20;

function tick() {
  displayM1 += (targetM1 - displayM1) * SPRING;
  displayC1 += (targetC1 - displayC1) * SPRING;
  displayM2 += (targetM2 - displayM2) * SPRING;
  displayC2 += (targetC2 - displayC2) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  // Head formulas — show the TARGET values (snap to slider step).
  tryRender(document.getElementById("formula1"), "y = " + fmtSlope(targetM1) + fmtCoef(targetC1));
  tryRender(document.getElementById("formula2"), "y = " + fmtSlope(targetM2) + fmtCoef(targetC2));

  // Lines — use DISPLAY values for smooth motion.
  var s1 = clipLineToPlot(displayM1, displayC1);
  if (s1) {
    var L1 = document.getElementById("L1");
    L1.style.display = "";
    L1.setAttribute("x1", xPx(s1.x1));
    L1.setAttribute("y1", yPx(s1.y1));
    L1.setAttribute("x2", xPx(s1.x2));
    L1.setAttribute("y2", yPx(s1.y2));
  } else {
    document.getElementById("L1").style.display = "none";
  }
  var s2 = clipLineToPlot(displayM2, displayC2);
  if (s2) {
    var L2 = document.getElementById("L2");
    L2.style.display = "";
    L2.setAttribute("x1", xPx(s2.x1));
    L2.setAttribute("y1", yPx(s2.y1));
    L2.setAttribute("x2", xPx(s2.x2));
    L2.setAttribute("y2", yPx(s2.y2));
  } else {
    document.getElementById("L2").style.display = "none";
  }

  // Intersection — based on TARGET values so the readout snaps to the
  // student's choice (numbers don't lag the line motion).
  var readout = document.getElementById("readout");
  var dot = document.getElementById("ixDot");
  var dm = targetM1 - targetM2;
  if (Math.abs(dm) < 0.001) {
    dot.style.display = "none";
    if (Math.abs(targetC1 - targetC2) < 0.001) {
      readout.innerHTML = '<span class="infinite">SAME LINE · infinitely many solutions</span>';
    } else {
      readout.innerHTML = '<span class="none">PARALLEL · no solution</span>';
    }
    return;
  }
  var xi = (targetC2 - targetC1) / dm;
  var yi = targetM1 * xi + targetC1;
  // Position the dot using display values for smooth motion when sliders
  // animate; clamp to plot bounds for visual safety.
  var dxi = (displayC2 - displayC1) / (displayM1 - displayM2 || 0.0001);
  var dyi = displayM1 * dxi + displayC1;
  if (dxi >= XMIN && dxi <= XMAX && dyi >= YMIN && dyi <= YMAX) {
    dot.style.display = "";
    dot.setAttribute("cx", xPx(dxi));
    dot.setAttribute("cy", yPx(dyi));
  } else {
    dot.style.display = "none";
  }
  readout.innerHTML = '<span class="ok">SOLUTION:</span> x = ' + xi.toFixed(2) + ', y = ' + yi.toFixed(2);
}

// Slider wiring — update TARGET only. tick() handles drawing.
function fmtSliderVal(v) {
  var r = Math.round(v * 10) / 10;
  return (r === Math.floor(r)) ? r.toFixed(0) : r.toFixed(1);
}
document.getElementById("m1").addEventListener("input", function(e) {
  targetM1 = parseFloat(e.target.value);
  document.getElementById("vm1").textContent = fmtSliderVal(targetM1);
});
document.getElementById("c1").addEventListener("input", function(e) {
  targetC1 = parseFloat(e.target.value);
  document.getElementById("vc1").textContent = fmtSliderVal(targetC1);
});
document.getElementById("m2").addEventListener("input", function(e) {
  targetM2 = parseFloat(e.target.value);
  document.getElementById("vm2").textContent = fmtSliderVal(targetM2);
});
document.getElementById("c2").addEventListener("input", function(e) {
  targetC2 = parseFloat(e.target.value);
  document.getElementById("vc2").textContent = fmtSliderVal(targetC2);
});

// kick off the animation loop
tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
