<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cyclic Quad + Tangent Step Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:22px; gap:10px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .step-num { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }
  .stage-outer { width:100%; max-width:660px; margin:0 auto; aspect-ratio: 660 / 360; position:relative; }
  .stage { position:absolute; top:0; left:0; width:660px; height:360px; transform-origin: top left; overflow:hidden; border-radius:6px; }
  .draw-line { transition: width 0.7s cubic-bezier(0.4, 0.1, 0.4, 1); }
  .draw-fade { opacity:0; transition: opacity 0.35s ease; transition-delay: 0.35s; }
  .draw-fade.drawn { opacity:1; }
  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:80px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl:disabled { opacity:0.3; cursor:not-allowed; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">step 0: cyclic quad ABCD, ∠BAD = 95°, tangent at D = 40°</span>
    <span class="step-num" id="counter">0 / 2</span>
  </div>
  <div class="stage-outer" id="stage-outer">
    <div class="stage" id="stage"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="prev">← prev</button>
    <button class="ctl" id="next">next →</button>
  </div>
  <p class="footer">cyclic quadrilateral · opposite angles · alternate segment theorem</p>
</div>

<script>
"use strict";

// Geometry — left half x: 0..320 holds the diagram. Circle O = (160, 130),
// r = 90. Cyclic quad arcs: AB = DA = 85°, BC = 110°, CD = 80° (so the
// 95° at A and the 40° tangent-chord at D are self-consistent). Going
// CCW math from A: A 0°, B 85°, C 195°, D 275°.
var O = { x: 160, y: 130 };
var R_d = 90;
function ptOnCircle(deg) {
  var r = deg * Math.PI / 180;
  return { x: O.x + R_d * Math.cos(r), y: O.y + R_d * Math.sin(r) };
}
var A = ptOnCircle(  0); // (250, 130)
var B = ptOnCircle( 85); // (168, 220)
var C = ptOnCircle(195); // (73, 107)
var D = ptOnCircle(275); // (168,  40)

var stage      = document.getElementById("stage");
var stageOuter = document.getElementById("stage-outer");
var STAGE_W    = 660, STAGE_H = 360;
function fitStage() {
  var w = stageOuter.clientWidth;
  if (!w) return;
  stage.style.transform = "scale(" + (w / STAGE_W) + ")";
}
fitStage();
window.addEventListener("resize", fitStage);
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(stageOuter);

function setStyle(el, s) { for (var k in s) el.style[k] = s[k]; }
function makeNode(tag, style, dataStep, cls) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  setStyle(n, style);
  if (dataStep != null) n.dataset.step = String(dataStep);
  stage.appendChild(n);
  return n;
}
function lineEl(x1, y1, x2, y2, color, thickness, dashed, dataStep) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx*dx + dy*dy);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  var t = thickness || 2;
  var s = {
    position: "absolute",
    left: x1 + "px", top: y1 + "px",
    width: "0px", height: t + "px",
    transformOrigin: "0 50%",
    transform: "translateY(" + (-t/2) + "px) rotate(" + ang + "deg)"
  };
  if (dashed) {
    s.background = "transparent";
    s.borderTop = t + "px dashed " + color;
    s.height = "0px";
  } else {
    s.background = color;
  }
  var node = makeNode("div", s, dataStep, "draw-line");
  node._fullWidth = len;
  return node;
}
function dotEl(x, y, color, size, dataStep) {
  var sz = size || 7;
  return makeNode("div", {
    position: "absolute",
    left: (x - sz/2) + "px", top: (y - sz/2) + "px",
    width: sz + "px", height: sz + "px",
    borderRadius: "50%", background: color
  }, dataStep, "draw-fade");
}
function labelEl(x, y, text, color, fontSize, dataStep, opts) {
  opts = opts || {};
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px", top: y + "px",
    fontFamily: opts.font || "'Geist Mono', monospace",
    fontSize: (fontSize || 11) + "px",
    color: color, fontWeight: opts.weight || "700",
    whiteSpace: "nowrap", pointerEvents: "none"
  }, dataStep, "draw-fade");
  n.textContent = text;
  return n;
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function texEl(x, y, tex, color, fontSize, dataStep) {
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px", top: y + "px",
    fontSize: (fontSize || 14) + "px",
    color: color, whiteSpace: "nowrap", pointerEvents: "none"
  }, dataStep, "draw-fade");
  tryRender(n, tex);
  return n;
}
function wedgeEl(cx, cy, size, fromConicDeg, sweepDeg, color, dataStep) {
  var maskInner = (size / 2) - 4;
  var maskOuter = maskInner + 2;
  return makeNode("div", {
    position: "absolute",
    left: (cx - size/2) + "px", top: (cy - size/2) + "px",
    width: size + "px", height: size + "px",
    borderRadius: "50%",
    background: "conic-gradient(from " + fromConicDeg + "deg, " + color + " 0deg " + sweepDeg + "deg, transparent " + sweepDeg + "deg)",
    WebkitMask: "radial-gradient(circle, transparent " + (maskInner-1) + "px, #000 " + maskInner + "px, #000 " + maskOuter + "px, transparent " + (maskOuter+1) + "px)",
    mask: "radial-gradient(circle, transparent " + (maskInner-1) + "px, #000 " + maskInner + "px, #000 " + maskOuter + "px, transparent " + (maskOuter+1) + "px)",
    pointerEvents: "none"
  }, dataStep, "draw-fade");
}

// ===== Always visible — circle outline =================================
makeNode("div", {
  position: "absolute",
  left: (O.x - R_d) + "px", top: (O.y - R_d) + "px",
  width: (2*R_d) + "px", height: (2*R_d) + "px",
  borderRadius: "50%",
  border: "1.5px solid #1a2330",
  pointerEvents: "none"
});

// ===== Step 0 — given configuration ====================================
// Quad sides AB, BC, CD, DA (blue)
lineEl(A.x, A.y, B.x, B.y, "#00abfa", 2.5, false, 0);
lineEl(B.x, B.y, C.x, C.y, "#00abfa", 2.5, false, 0);
lineEl(C.x, C.y, D.x, D.y, "#00abfa", 2.5, false, 0);
lineEl(D.x, D.y, A.x, A.y, "#00abfa", 2.5, false, 0);

// Tangent at D — perpendicular to OD, drawn as a long orange line
// passing through D in both directions. OD direction (D-O)/r ≈ (0.087,
// −0.996); tangent perpendicular (0.996, 0.087). Draw 80 px each side.
(function() {
  var ux = 0.996, uy = 0.087;
  var x1 = D.x - 80*ux, y1 = D.y - 80*uy;
  var x2 = D.x + 80*ux, y2 = D.y + 80*uy;
  lineEl(x1, y1, x2, y2, "#ff822c", 2.5, false, 0);
})();

// 95° wedge at A between AB (conic 222.5°) and AD (conic 317.5°).
wedgeEl(A.x, A.y, 64, 222.5, 95, "#fff067", 0);
texEl(A.x - 50, A.y - 8, "95°", "#fff067", 13, 0);

// 40° wedge at D between chord-toward-C (conic 235°) and tangent-left
// (conic 275°). Visually the 40° wedge sits at the lower-left of D
// where the chord meets the tangent; this is the angle the alternate-
// segment theorem refers to.
wedgeEl(D.x, D.y, 44, 235, 40, "#fff067", 0);
texEl(D.x - 38, D.y + 8, "40°", "#fff067", 13, 0);

// Centre O (faint dot, no letter — the centre is incidental here)
dotEl(O.x, O.y, "#3a4a5a", 5, 0);

// Vertices
dotEl(A.x, A.y, "#fff067", 8, 0);
labelEl(A.x + 8, A.y - 6, "A", "#fff067", 14, 0);
dotEl(B.x, B.y, "#fff067", 8, 0);
labelEl(B.x - 4, B.y + 8, "B", "#fff067", 14, 0);
dotEl(C.x, C.y, "#fff067", 8, 0);
labelEl(C.x - 18, C.y - 6, "C", "#fff067", 14, 0);
dotEl(D.x, D.y, "#fff067", 8, 0);
labelEl(D.x - 4, D.y - 22, "D", "#fff067", 14, 0);

// ===== Step 1 — ∠BCD = 85° (cyclic quad opp angles) ====================
// 85° wedge at C between CD (conic 55°) and CB (conic 140°).
wedgeEl(C.x, C.y, 60, 55, 85, "#0fee89", 1);
texEl(C.x + 20, C.y + 14, "85°", "#0fee89", 13, 1);

// ===== Step 2 — ∠DBC = 40° (alternate segment theorem) =================
// Diagonal BD drawn (so ∠DBC reads visibly inside △DBC).
lineEl(B.x, B.y, D.x, D.y, "#0fee89", 1.6, true, 2);
// 40° wedge at B between BC (conic 320°) and BD (conic 0°/360°).
wedgeEl(B.x, B.y, 44, 320, 40, "#0fee89", 2);
texEl(B.x + 8, B.y - 28, "40°", "#0fee89", 13, 2);

// ===== Equation panel (RIGHT side) =====================================
texEl(360, 100,
  "\\angle BCD = 180\\degree - 95\\degree = 85\\degree",
  "#0fee89", 19, 1);
texEl(360, 152,
  "\\text{(opposite angles of cyclic quad)}",
  "#7a7875", 12, 1);
texEl(360, 215,
  "\\angle DBC = 40\\degree",
  "#0fee89", 19, 2);
texEl(360, 260,
  "\\text{(alternate segment theorem)}",
  "#7a7875", 12, 2);

// ===== Step controller =================================================
var STEPS = [
  "step 0: cyclic quad ABCD, ∠BAD = 95°, tangent at D = 40°",
  "step 1: ∠BCD via opposite angles",
  "step 2: ∠DBC via alternate segment"
];
var step = 0, maxStep = STEPS.length - 1;
var titleEl   = document.getElementById("title");
var counterEl = document.getElementById("counter");
var prevBtn   = document.getElementById("prev");
var nextBtn   = document.getElementById("next");
function setStep(n) {
  step = Math.max(0, Math.min(maxStep, n));
  titleEl.textContent = STEPS[step];
  counterEl.textContent = step + " / " + maxStep;
  var els = stage.querySelectorAll("[data-step]");
  for (var i = 0; i < els.length; i++) {
    var s = parseInt(els[i].dataset.step, 10);
    var el = els[i];
    if (s <= step) {
      el.classList.add("drawn");
      if (el._fullWidth != null) el.style.width = el._fullWidth + "px";
    } else {
      el.classList.remove("drawn");
      if (el._fullWidth != null) el.style.width = "0px";
    }
  }
  prevBtn.disabled = (step === 0);
  nextBtn.disabled = (step === maxStep);
}
prevBtn.onclick = function() { setStep(step - 1); };
nextBtn.onclick = function() { setStep(step + 1); };
setStep(0);

// ===== Height reporter =================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
