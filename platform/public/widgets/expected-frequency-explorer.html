<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Expected Frequency Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:16px 20px 18px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  .headline { display:flex; align-items:baseline; justify-content:center; gap:10px; flex-wrap:wrap; margin:8px 0 16px; padding:14px 8px; }
  .headline .col { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .headline .big { font-family:'Geist Mono',monospace; font-size:42px; font-weight:700; line-height:1; transition: color 0.3s ease; display:flex; align-items:center; justify-content:center; }
  .headline .big .katex { font-size:1em; }
  .headline .big.p   { color:#00abfa; min-width:80px; }
  .headline .big.n   { color:#fff067; min-width:80px; }
  .headline .big.exp { color:#0fee89; min-width:80px; }
  .headline .lab { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.5px; text-transform:uppercase; }
  .headline .op { font-family:'Geist Mono',monospace; font-size:24px; color:#3a4a5a; padding:0 4px; align-self:center; }

  .snap-row { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; align-items:center; }
  .snap-row .label-lead { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.5px; text-transform:uppercase; margin-right:6px; }
  .snap-btn { background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:5px 10px; border-radius:5px; cursor:pointer; transition: all 0.12s ease; min-width:42px; display:flex; align-items:center; justify-content:center; }
  .snap-btn:hover { color:#f0eeea; border-color:#3a4a5a; }
  .snap-btn.active.p   { color:#00abfa; border-color:#00abfa; background:rgba(0,171,250,0.08); }
  .snap-btn.active.n   { color:#fff067; border-color:#fff067; background:rgba(255,240,103,0.08); }
  .snap-btn .katex { font-size:1em; }

  .vis-panel { padding:14px; background:#070b10; border:1px solid #141e2a; border-radius:8px; margin-top:14px; min-height:96px; display:flex; align-items:center; justify-content:center; }
  .dots-grid { display:grid; gap:4px; width:100%; }
  .dot { aspect-ratio:1/1; border-radius:50%; transition: background 0.3s ease, opacity 0.3s ease; }
  .dot.success { background:#0fee89; }
  .dot.miss    { background:#3a4a5a; opacity:0.55; }
  .summary-bar { display:flex; gap:0; height:22px; border-radius:5px; overflow:hidden; width:100%; }
  .summary-bar .fill-success { background:#0fee89; transition: width 0.3s ease; display:flex; align-items:center; justify-content:center; color:#0b1118; font-family:'Geist Mono',monospace; font-size:11px; font-weight:700; }
  .summary-bar .fill-miss    { background:#3a4a5a; transition: width 0.3s ease; display:flex; align-items:center; justify-content:center; color:#c8c6be; font-family:'Geist Mono',monospace; font-size:11px; font-weight:700; }

  .footer { font-family:'Geist Mono',monospace; font-size:12px; color:#3a4a5a; text-align:center; margin-top:14px; line-height:1.5; }
  .footer .id { color:#7a7875; }
  .footer .id .katex { font-size:1em; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">EXPECTED COUNT</span>
    <span class="meta">tap a probability, tap a trial count</span>
  </div>

  <div class="headline">
    <span class="col">
      <span class="big p" id="p-display"></span>
      <span class="lab">probability</span>
    </span>
    <span class="op">×</span>
    <span class="col">
      <span class="big n" id="n-display">100</span>
      <span class="lab">trials</span>
    </span>
    <span class="op">=</span>
    <span class="col">
      <span class="big exp" id="exp-display"></span>
      <span class="lab">expected</span>
    </span>
  </div>

  <div class="snap-row" id="p-snaps">
    <span class="label-lead">p</span>
  </div>
  <div class="snap-row" id="n-snaps">
    <span class="label-lead">n</span>
  </div>

  <div class="vis-panel" id="vis-host"></div>

  <div class="footer">
    <span class="id" id="formula"></span>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:"#00abfa", pink:"#ff4670", yellow:"#fff067", green:"#0fee89",
  faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

var P_SNAPS = [
  { n:1,  d:10, label:"\\tfrac{1}{10}" },
  { n:1,  d:5,  label:"\\tfrac{1}{5}"  },
  { n:1,  d:4,  label:"\\tfrac{1}{4}"  },
  { n:1,  d:3,  label:"\\tfrac{1}{3}"  },
  { n:2,  d:5,  label:"\\tfrac{2}{5}"  },
  { n:1,  d:2,  label:"\\tfrac{1}{2}"  },
  { n:3,  d:5,  label:"\\tfrac{3}{5}"  },
  { n:2,  d:3,  label:"\\tfrac{2}{3}"  },
  { n:3,  d:4,  label:"\\tfrac{3}{4}"  },
  { n:4,  d:5,  label:"\\tfrac{4}{5}"  },
  { n:9,  d:10, label:"\\tfrac{9}{10}" }
];
var N_SNAPS = [10, 20, 50, 100, 200, 500, 1000];

var state = { pIdx: 5, nIdx: 3 };   // p = 1/2, n = 100

function pFrac(){ return P_SNAPS[state.pIdx]; }
function pVal(){ var f = pFrac(); return f.n / f.d; }
function nVal(){ return N_SNAPS[state.nIdx]; }

function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}

function gcd(a, b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a; }

function buildPSnaps(){
  var host = document.getElementById("p-snaps");
  host.innerHTML = '<span class="label-lead">p</span>';
  P_SNAPS.forEach(function(s, i){
    var b = document.createElement("button");
    b.className = "snap-btn" + (state.pIdx === i ? " active p" : "");
    var span = document.createElement("span");
    tryRender(span, s.label);
    b.appendChild(span);
    b.addEventListener("click", function(){
      state.pIdx = i;
      render();
    });
    host.appendChild(b);
  });
}
function buildNSnaps(){
  var host = document.getElementById("n-snaps");
  host.innerHTML = '<span class="label-lead">n</span>';
  N_SNAPS.forEach(function(v, i){
    var b = document.createElement("button");
    b.className = "snap-btn" + (state.nIdx === i ? " active n" : "");
    b.textContent = v.toLocaleString();
    b.addEventListener("click", function(){
      state.nIdx = i;
      render();
    });
    host.appendChild(b);
  });
}

function renderHeadline(){
  var p = pFrac();
  var n = nVal();
  var pEl = document.getElementById("p-display");
  var nEl = document.getElementById("n-display");
  var eEl = document.getElementById("exp-display");
  pEl.innerHTML = ""; eEl.innerHTML = "";
  tryRender(pEl, p.d === 1 ? String(p.n) : "\\tfrac{" + p.n + "}{" + p.d + "}");
  nEl.textContent = n.toLocaleString();
  // Expected = p * n. If divides evenly, integer; else fraction or decimal.
  var num = p.n * n;
  var den = p.d;
  if (num % den === 0){
    tryRender(eEl, String(num / den));
  } else {
    var g = gcd(num, den);
    if (g > 1){
      tryRender(eEl, "\\tfrac{" + (num/g) + "}{" + (den/g) + "}");
    } else {
      tryRender(eEl, "\\tfrac{" + num + "}{" + den + "}");
    }
  }
}

function renderVisual(){
  var host = document.getElementById("vis-host");
  host.innerHTML = "";
  var p = pVal();
  var n = nVal();
  var expected = p * n;
  var expRounded = Math.round(expected);
  if (n <= 200){
    var grid = document.createElement("div");
    grid.className = "dots-grid";
    var cols;
    if (n <= 25) cols = 5;
    else if (n <= 50) cols = 10;
    else if (n <= 100) cols = 10;
    else cols = 20;
    grid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    for (var i = 0; i < n; i++){
      var d = document.createElement("div");
      d.className = "dot " + (i < expRounded ? "success" : "miss");
      grid.appendChild(d);
    }
    host.appendChild(grid);
  } else {
    var bar = document.createElement("div");
    bar.className = "summary-bar";
    var pct = (p * 100).toFixed(1);
    var pctMiss = (100 - p * 100).toFixed(1);
    bar.innerHTML =
      '<div class="fill-success" style="width:' + pct + '%">' + (pct >= 8 ? expRounded.toLocaleString() : "") + '</div>' +
      '<div class="fill-miss" style="width:' + pctMiss + '%">' + (pctMiss >= 8 ? (n - expRounded).toLocaleString() : "") + '</div>';
    host.appendChild(bar);
  }
}

function renderFormula(){
  var p = pFrac();
  var n = nVal();
  var fEl = document.getElementById("formula");
  fEl.innerHTML = "";
  var pTex = p.d === 1 ? String(p.n) : "\\tfrac{" + p.n + "}{" + p.d + "}";
  var num = p.n * n, den = p.d;
  var expTex;
  if (num % den === 0) expTex = String(num / den);
  else {
    var g = gcd(num, den);
    expTex = g > 1 ? "\\tfrac{" + (num/g) + "}{" + (den/g) + "}" : "\\tfrac{" + num + "}{" + den + "}";
  }
  tryRender(fEl, "{\\color{#00abfa}" + pTex + "} \\times {\\color{#fff067}" + n + "} = {\\color{#0fee89}" + expTex + "}");
}

function render(){
  buildPSnaps();
  buildNSnaps();
  renderHeadline();
  renderVisual();
  renderFormula();
  notifyHeight();
}

function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

render();
setTimeout(notifyHeight, 200);
</script>
</body>
</html>
