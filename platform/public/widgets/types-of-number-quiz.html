<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Types of Number — Classification Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    background:#07090d;
    color:#c8c6be;
    font-family:'Geist','Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body {
    padding:24px 20px 28px;
    min-height:100vh;
  }
  .wrap { max-width:640px; margin:0 auto; }

  .head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .label {
    font-family:'Geist Mono',monospace;
    font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:#fff067;
  }
  .score {
    font-family:'Geist Mono',monospace;
    font-size:11px; color:#7a7875;
  }
  .score b { color:#f0eeea; font-weight:500; }
  .score .streak { color:#0fee89; }

  .card {
    background:#0b1118;
    border:1px solid #141e2a;
    border-radius:12px;
    padding:36px 28px 28px;
    position:relative;
    overflow:hidden;
  }

  .prompt {
    text-align:center;
    font-size:13px;
    color:#7a7875;
    margin-bottom:14px;
    letter-spacing:0.2px;
  }

  .number {
    text-align:center;
    font-family:'Geist',sans-serif;
    font-weight:700;
    font-size:54px;
    color:#f0eeea;
    letter-spacing:-1.5px;
    line-height:1;
    margin-bottom:8px;
    min-height:58px;
  }

  .number .frac {
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    vertical-align:middle;
    font-size:36px;
    line-height:1;
  }
  .number .frac .num { border-bottom:2px solid currentColor; padding:0 8px 2px; }
  .number .frac .den { padding:4px 8px 0; }

  .sqrt {
    display:inline-flex; align-items:stretch; gap:0;
    line-height:1;
  }
  .sqrt::before {
    content:'√';
    font-weight:500;
    margin-right:-2px;
  }
  .sqrt .radicand {
    border-top:2px solid currentColor;
    padding:2px 2px 0 5px;
    line-height:1;
  }
  .number .sqrt .radicand { border-top-width:2.5px; padding:3px 2px 0 6px; }

  .overline {
    border-top:2px solid currentColor;
    padding-top:1px;
    display:inline-block;
    line-height:1;
  }
  .number .overline { border-top-width:2.5px; padding-top:3px; }

  .number .exp {
    font-size:28px;
    vertical-align:top;
    margin-left:-2px;
    position:relative;
    top:-14px;
  }

  .eval {
    text-align:center;
    font-family:'Geist Mono',monospace;
    font-size:12px;
    color:#3a4a5a;
    margin-bottom:24px;
    min-height:14px;
  }

  .question {
    text-align:center;
    font-size:15px;
    color:#c8c6be;
    margin-bottom:22px;
    line-height:1.5;
  }
  .question b { color:#f0eeea; }

  .choices {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  @media (min-width:520px) { .choices { grid-template-columns:repeat(3,1fr); } }

  .choice {
    appearance:none;
    background:#07090d;
    border:1px solid #141e2a;
    border-radius:8px;
    padding:12px 10px;
    color:#c8c6be;
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
    letter-spacing:0.1px;
  }
  .choice:hover:not(:disabled) {
    border-color:#2a3a4a;
    background:#0b1118;
  }
  .choice:disabled { cursor:default; }

  .choice.correct {
    border-color:#0fee8955;
    background:#0fee8912;
    color:#0fee89;
  }
  .choice.wrong {
    border-color:#ff467055;
    background:#ff467012;
    color:#ff4670;
  }
  .choice.reveal {
    border-color:#0fee8955;
    color:#0fee89;
  }

  .feedback {
    border-top:1px solid #141e2a;
    padding-top:16px;
    margin-top:4px;
    font-size:13px;
    color:#7a7875;
    line-height:1.55;
    min-height:22px;
  }
  .feedback.show { padding-top:16px; }
  .feedback.ok { color:#0fee89; }
  .feedback.bad { color:#ff4670; }
  .feedback-detail {
    color:#7a7875;
    margin-top:6px;
    font-size:12px;
    line-height:1.55;
  }

  .next-row {
    display:flex; justify-content:flex-end;
    margin-top:14px;
  }
  .next-btn {
    appearance:none;
    background:#00abfa;
    border:none;
    color:#07090d;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    letter-spacing:0.1px;
    transition:opacity .15s;
  }
  .next-btn:hover { opacity:0.88; }
  .next-btn svg { display:block; }
  .next-btn.hidden { display:none; }

  .progress {
    display:flex; gap:3px;
    margin-top:20px;
    justify-content:center;
  }
  .pip {
    width:22px; height:3px;
    background:#141e2a;
    border-radius:2px;
    transition:background .2s;
  }
  .pip.done.ok   { background:#0fee89; }
  .pip.done.bad  { background:#ff4670; }
  .pip.active    { background:#00abfa; }

  .done-card {
    text-align:center;
  }
  .done-card .big {
    font-size:42px; font-weight:700;
    color:#f0eeea; letter-spacing:-1.5px;
    margin-bottom:6px;
  }
  .done-card .big .total { color:#3a4a5a; font-weight:500; }
  .done-card .msg { color:#7a7875; font-size:14px; margin-bottom:22px; }
  .done-card .again {
    appearance:none;
    background:transparent;
    border:1px solid #141e2a;
    color:#c8c6be;
    font-family:inherit;
    font-size:13px;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .done-card .again:hover { border-color:#2a3a4a; color:#f0eeea; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="label">Classification quiz</span>
    <span class="score">
      <b id="correct">0</b>/<span id="asked">0</span>
      <span class="streak" id="streak"></span>
    </span>
  </div>

  <div class="card" id="card">
    <!-- content injected -->
  </div>

  <div class="progress" id="progress"></div>
</div>

<script>
"use strict";

// Each question: a number (with HTML-rendered display), its plain-English eval,
// the property asked, the correct answer index, and marking-style feedback.
var QUESTIONS = [
  {
    display: '49',
    eval: '49 = 7²',
    asks: 'Is this a <b>square number</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. 49 = 7², so it is a square number.',
    bad: 'It is 7², so yes — 49 is a square number. Every perfect square appears as n² for some integer n.'
  },
  {
    display: '<span class="sqrt"><span class="radicand">169</span></span>',
    eval: '<span class="sqrt"><span class="radicand">169</span></span> = 13',
    asks: 'Is this <b>irrational</b>?',
    choices: ['Rational', 'Irrational'],
    correct: 0,
    good: 'Correct. <span class="sqrt"><span class="radicand">169</span></span> = 13, a whole number. Rational.',
    bad: 'Trap. <span class="sqrt"><span class="radicand">169</span></span> is 13, which is an integer — definitely rational. Always evaluate the square root first before deciding.'
  },
  {
    display: '<span class="sqrt"><span class="radicand">8</span></span>',
    eval: '<span class="sqrt"><span class="radicand">8</span></span> = 2<span class="sqrt"><span class="radicand">2</span></span> ≈ 2.828...',
    asks: 'Is this <b>irrational</b>?',
    choices: ['Rational', 'Irrational'],
    correct: 1,
    good: 'Correct. 8 is not a perfect square, so <span class="sqrt"><span class="radicand">8</span></span> cannot be written as a fraction. Irrational.',
    bad: '<span class="sqrt"><span class="radicand">8</span></span> = 2<span class="sqrt"><span class="radicand">2</span></span>. Since 8 is not a perfect square, it has a non-terminating, non-repeating decimal. It is irrational.'
  },
  {
    display: '1',
    eval: '',
    asks: 'Is this a <b>prime number</b>?',
    choices: ['Yes', 'No'],
    correct: 1,
    good: 'Correct. 1 is not prime — a prime must have exactly two factors (1 and itself). 1 has only one factor.',
    bad: '1 is NOT prime. The definition requires two distinct factors. 1 has only one factor: itself. Primes start at 2.'
  },
  {
    display: '27',
    eval: '27 = 3³',
    asks: 'Is this a <b>cube number</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. 27 = 3³, so it is a cube number.',
    bad: '27 = 3 × 3 × 3 = 3³. That is a cube number by definition.'
  },
  {
    display: '<span class="frac"><span class="num">12</span><span class="den">23</span></span>',
    eval: '12 and 23 are integers; 23 ≠ 0',
    asks: 'Is this <b>rational</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. Any number written as p/q with p, q integers and q ≠ 0 is rational.',
    bad: 'It is p/q with integers and a non-zero denominator, which is the definition of rational. Answer: yes.'
  },
  {
    display: '&pi;',
    eval: 'π = 3.14159265...',
    asks: 'Is this <b>rational</b>?',
    choices: ['Yes', 'No'],
    correct: 1,
    good: 'Correct. π cannot be written as a fraction of integers. Irrational.',
    bad: 'π has a non-repeating, non-terminating decimal — it cannot be written as p/q. Irrational.'
  },
  {
    display: '13',
    eval: '',
    asks: 'Is this a <b>factor of 26</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. 26 = 2 × 13, so 13 divides 26 exactly.',
    bad: '26 ÷ 13 = 2 with no remainder, so 13 is a factor of 26. (Factors of 26: 1, 2, 13, 26.)'
  },
  {
    display: '0.<span class="overline">3</span>',
    eval: '0.333... = 1/3',
    asks: 'Is this <b>rational</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. Every recurring decimal equals a fraction — here, 1/3.',
    bad: 'A recurring decimal always converts to a fraction of integers. 0.333... = 1/3. Rational.'
  },
  {
    display: '3<span class="exp">0</span>',
    eval: '3⁰ = 1',
    asks: 'Is this an <b>integer</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. Any non-zero number to the power 0 equals 1, and 1 is an integer.',
    bad: 'Law of indices: n⁰ = 1 for any non-zero n. So 3⁰ = 1, which is an integer.'
  },
  {
    display: '15',
    eval: '15 = 1 + 2 + 3 + 4 + 5',
    asks: 'Is this a <b>triangular number</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. 1+2+3+4+5 = 15 — the 5th triangular number.',
    bad: 'Triangular numbers are sums 1+2+...+n. 1+2+3+4+5 = 15. So yes, triangular.'
  },
  {
    display: '<span class="sqrt"><span class="radicand">0.25</span></span>',
    eval: '<span class="sqrt"><span class="radicand">0.25</span></span> = 0.5 = 1/2',
    asks: 'Is this <b>irrational</b>?',
    choices: ['Rational', 'Irrational'],
    correct: 0,
    good: 'Correct. <span class="sqrt"><span class="radicand">0.25</span></span> = 0.5 = 1/2 — a rational number.',
    bad: 'Check: 0.5 × 0.5 = 0.25. So <span class="sqrt"><span class="radicand">0.25</span></span> = 0.5 = 1/2. That is rational — do not let the root fool you.'
  }
];

// State
var idx = 0;
var correct = 0;
var streak = 0;
var best = 0;
var results = []; // 'ok' | 'bad' per question

var card = document.getElementById('card');
var progress = document.getElementById('progress');
var correctEl = document.getElementById('correct');
var askedEl = document.getElementById('asked');
var streakEl = document.getElementById('streak');

function updateHeader() {
  correctEl.textContent = correct;
  askedEl.textContent = Math.min(idx + 1, QUESTIONS.length);
  streakEl.textContent = streak >= 2 ? '  ·  streak ' + streak : '';
}

function renderProgress() {
  progress.innerHTML = '';
  for (var i = 0; i < QUESTIONS.length; i++) {
    var p = document.createElement('span');
    p.className = 'pip';
    if (i < results.length) p.classList.add('done', results[i]);
    else if (i === idx) p.classList.add('active');
    progress.appendChild(p);
  }
}

function render() {
  if (idx >= QUESTIONS.length) return renderDone();
  var q = QUESTIONS[idx];

  card.innerHTML =
    '<p class="prompt">The number is</p>' +
    '<div class="number">' + q.display + '</div>' +
    '<p class="eval">' + (q.eval || '&nbsp;') + '</p>' +
    '<p class="question">' + q.asks + '</p>' +
    '<div class="choices" id="choices"></div>' +
    '<div class="feedback" id="feedback">&nbsp;</div>' +
    '<div class="next-row"><button class="next-btn hidden" id="next">Next <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>';

  var choicesDiv = document.getElementById('choices');
  for (var i = 0; i < q.choices.length; i++) {
    (function(i){
      var btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = q.choices[i];
      btn.addEventListener('click', function(){ answer(i); });
      choicesDiv.appendChild(btn);
    })(i);
  }

  renderProgress();
  updateHeader();
}

function answer(chosen) {
  var q = QUESTIONS[idx];
  var buttons = document.querySelectorAll('.choice');
  for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;

  var isRight = chosen === q.correct;
  buttons[chosen].classList.add(isRight ? 'correct' : 'wrong');
  if (!isRight) buttons[q.correct].classList.add('reveal');

  if (isRight) {
    correct++;
    streak++;
    best = Math.max(best, streak);
    results.push('ok');
  } else {
    streak = 0;
    results.push('bad');
  }

  var fb = document.getElementById('feedback');
  fb.classList.add('show', isRight ? 'ok' : 'bad');
  fb.innerHTML = (isRight ? '✓ ' : '✗ ') + (isRight ? q.good : q.bad);

  document.getElementById('next').classList.remove('hidden');
  document.getElementById('next').addEventListener('click', next);
  renderProgress();
  updateHeader();
}

function next() {
  idx++;
  render();
}

function renderDone() {
  var pct = Math.round((correct / QUESTIONS.length) * 100);
  var msg;
  if (pct === 100) msg = 'Perfect. You have the classification rules locked in.';
  else if (pct >= 80) msg = 'Strong — the rules are solid. Review the ones you missed.';
  else if (pct >= 60) msg = 'Good start. Revisit the square-root traps and the HCF/LCM split.';
  else msg = 'Re-read the lesson, especially the section on irrationals vs square roots.';

  card.innerHTML =
    '<div class="done-card">' +
      '<p class="prompt" style="margin-bottom:18px">You got</p>' +
      '<div class="big">' + correct + '<span class="total"> / ' + QUESTIONS.length + '</span></div>' +
      '<p class="msg">' + msg + (best >= 3 ? '  Best streak: ' + best + '.' : '') + '</p>' +
      '<button class="again" id="again">Try again</button>' +
    '</div>';
  document.getElementById('again').addEventListener('click', reset);
  renderProgress();
  askedEl.textContent = QUESTIONS.length;
  streakEl.textContent = '';
}

function reset() {
  idx = 0; correct = 0; streak = 0; results = [];
  render();
}

render();
</script>
</body>
</html>
