<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Classification Quiz, Types of Number</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    background:#07090d;
    color:#c8c6be;
    font-family:'Geist','Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body {
    padding:24px 20px 28px;
    min-height:100vh;
  }
  .wrap { max-width:640px; margin:0 auto; }

  .head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .label {
    font-family:'Geist Mono',monospace;
    font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:#fff067;
  }
  .score {
    font-family:'Geist Mono',monospace;
    font-size:11px; color:#7a7875;
  }
  .score b { color:#f0eeea; font-weight:500; }
  .score .streak { color:#0fee89; }

  .card {
    background:#0b1118;
    border:1px solid #141e2a;
    border-radius:12px;
    padding:36px 28px 28px;
    position:relative;
    overflow:hidden;
  }

  .prompt {
    text-align:center;
    font-size:13px;
    color:#7a7875;
    margin-bottom:14px;
    letter-spacing:0.2px;
  }

  .number {
    text-align:center;
    font-family:'Geist',sans-serif;
    font-weight:700;
    font-size:54px;
    color:#f0eeea;
    letter-spacing:-1.5px;
    line-height:1;
    margin-bottom:8px;
    min-height:58px;
  }

  /* KaTeX scales to the parent font-size, which is 54px for .number and
     smaller for .eval/.feedback. Nothing custom needed for radicals/overlines. */
  .number .katex { font-size: 0.8em; color: #f0eeea; }
  .eval .katex { color: #3a4a5a; font-size: 1em; }
  .question .katex { color: #f0eeea; font-size: 0.95em; }
  .feedback .katex { color: inherit; font-size: 0.95em; }
  .choice .katex { color: inherit; font-size: 0.95em; }

  .eval {
    text-align:center;
    font-family:'Geist Mono',monospace;
    font-size:12px;
    color:#3a4a5a;
    margin-bottom:24px;
    min-height:14px;
  }

  .question {
    text-align:center;
    font-size:15px;
    color:#c8c6be;
    margin-bottom:22px;
    line-height:1.5;
  }
  .question b { color:#f0eeea; }

  .choices {
    display:grid;
    gap:10px;
    margin-bottom:18px;
    justify-content:center;
  }
  /* Two-option layout: narrower, centered. Three-option layout: three columns. */
  .choices.two { grid-template-columns:minmax(120px,180px) minmax(120px,180px); }
  .choices.three { grid-template-columns:1fr 1fr 1fr; width:100%; }
  @media (max-width:480px) {
    .choices.three { grid-template-columns:1fr 1fr; }
  }

  .choice {
    appearance:none;
    background:#07090d;
    border:1px solid #141e2a;
    border-radius:8px;
    padding:12px 10px;
    color:#c8c6be;
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
    letter-spacing:0.1px;
  }
  .choice:hover:not(:disabled) {
    border-color:#2a3a4a;
    background:#0b1118;
  }
  .choice:disabled { cursor:default; }

  .choice.correct {
    border-color:#0fee8955;
    background:#0fee8912;
    color:#0fee89;
  }
  .choice.wrong {
    border-color:#ff467055;
    background:#ff467012;
    color:#ff4670;
  }
  .choice.reveal {
    border-color:#0fee8955;
    color:#0fee89;
  }

  .feedback {
    border-top:1px solid #141e2a;
    padding-top:16px;
    margin-top:4px;
    font-size:13px;
    color:#7a7875;
    line-height:1.55;
    min-height:22px;
  }
  .feedback.show { padding-top:16px; }
  .feedback.ok { color:#0fee89; }
  .feedback.bad { color:#ff4670; }
  .feedback-detail {
    color:#7a7875;
    margin-top:6px;
    font-size:12px;
    line-height:1.55;
  }

  .next-row {
    display:flex; justify-content:flex-end;
    margin-top:14px;
  }
  .next-btn {
    appearance:none;
    background:#00abfa;
    border:none;
    color:#07090d;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    letter-spacing:0.1px;
    transition:opacity .15s;
  }
  .next-btn:hover { opacity:0.88; }
  .next-btn svg { display:block; }
  .next-btn.hidden { display:none; }

  .progress {
    display:flex; gap:3px;
    margin-top:20px;
    justify-content:center;
  }
  .pip {
    width:22px; height:3px;
    background:#141e2a;
    border-radius:2px;
    transition:background .2s;
  }
  .pip.done.ok   { background:#0fee89; }
  .pip.done.bad  { background:#ff4670; }
  .pip.active    { background:#00abfa; }

  .done-card {
    text-align:center;
  }
  .done-card .big {
    font-size:42px; font-weight:700;
    color:#f0eeea; letter-spacing:-1.5px;
    margin-bottom:6px;
  }
  .done-card .big .total { color:#3a4a5a; font-weight:500; }
  .done-card .msg { color:#7a7875; font-size:14px; margin-bottom:22px; }
  .done-card .again {
    appearance:none;
    background:transparent;
    border:1px solid #141e2a;
    color:#c8c6be;
    font-family:inherit;
    font-size:13px;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .done-card .again:hover { border-color:#2a3a4a; color:#f0eeea; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="label">Classification quiz</span>
    <span class="score">
      <b id="correct">0</b>/<span id="asked">0</span>
      <span class="streak" id="streak"></span>
    </span>
  </div>

  <div class="card" id="card">
    <!-- content injected -->
  </div>

  <div class="progress" id="progress"></div>
</div>

<script>
"use strict";

// Each question. Text marked with \(...\) is rendered as inline KaTeX;
// \[...\] is rendered as display KaTeX. We walk the injected DOM after
// each render() and replace those delimiters with real KaTeX HTML.
var QUESTIONS = [
  {
    display: '49',
    eval: '\\(49 = 7^2\\)',
    asks: 'Is this a <b>square number</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. \\(49 = 7^2\\), so it is a square number.',
    bad: 'It is \\(7^2\\), so yes, 49 is a square number. Every perfect square appears as \\(n^2\\) for some integer \\(n\\).'
  },
  {
    display: '\\(\\sqrt{169}\\)',
    eval: '\\(\\sqrt{169} = 13\\)',
    asks: 'Is this <b>irrational</b>?',
    choices: ['Rational', 'Irrational'],
    correct: 0,
    good: 'Correct. \\(\\sqrt{169} = 13\\), a whole number. Rational.',
    bad: 'Trap. \\(\\sqrt{169} = 13\\), which is an integer, definitely rational. Always work out the square root first.'
  },
  {
    display: '\\(\\sqrt{8}\\)',
    eval: '\\(\\sqrt{8} = 2\\sqrt{2} \\approx 2.828\\ldots\\)',
    asks: 'Is this <b>irrational</b>?',
    choices: ['Rational', 'Irrational'],
    correct: 1,
    good: 'Correct. 8 is not a perfect square, so \\(\\sqrt{8}\\) cannot be written as a fraction. Irrational.',
    bad: '\\(\\sqrt{8} = 2\\sqrt{2}\\). Since 8 is not a perfect square, its decimal goes on forever with no pattern. Irrational.'
  },
  {
    display: '1',
    eval: '',
    asks: 'Is this a <b>prime number</b>?',
    choices: ['Yes', 'No'],
    correct: 1,
    good: 'Correct. 1 is not prime. A prime must have exactly two factors (1 and itself). 1 has only one factor.',
    bad: '1 is NOT prime. The definition requires two different factors. 1 has only one factor: itself. Primes start at 2.'
  },
  {
    display: '27',
    eval: '\\(27 = 3^3\\)',
    asks: 'Is this a <b>cube number</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. \\(27 = 3^3\\), so it is a cube number.',
    bad: '\\(27 = 3 \\times 3 \\times 3 = 3^3\\). That is a cube number by definition.'
  },
  {
    display: '\\(\\dfrac{12}{23}\\)',
    eval: '12 and 23 are integers, 23 \\(\\neq\\) 0',
    asks: 'Is this <b>rational</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. Any number written as \\(\\tfrac{p}{q}\\) with \\(p, q\\) integers and \\(q \\neq 0\\) is rational.',
    bad: 'It is \\(\\tfrac{p}{q}\\) with integers and a non-zero denominator. That is the definition of rational. Answer: yes.'
  },
  {
    display: '\\(\\pi\\)',
    eval: '\\(\\pi = 3.14159265\\ldots\\)',
    asks: 'Is this <b>rational</b>?',
    choices: ['Yes', 'No'],
    correct: 1,
    good: 'Correct. \\(\\pi\\) cannot be written as a fraction of integers. Irrational.',
    bad: '\\(\\pi\\) has a non-repeating, non-terminating decimal. It cannot be written as \\(\\tfrac{p}{q}\\). Irrational.'
  },
  {
    display: '13',
    eval: '',
    asks: 'Is this a <b>factor of 26</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. \\(26 = 2 \\times 13\\), so 13 divides 26 exactly.',
    bad: '\\(26 \\div 13 = 2\\) with no remainder, so 13 is a factor of 26. (Factors of 26: 1, 2, 13, 26.)'
  },
  {
    display: '\\(0.\\overline{3}\\)',
    eval: '\\(0.333\\ldots = \\tfrac{1}{3}\\)',
    asks: 'Is this <b>rational</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. Every recurring decimal equals a fraction. Here, \\(\\tfrac{1}{3}\\).',
    bad: 'A recurring decimal always converts to a fraction of integers. \\(0.333\\ldots = \\tfrac{1}{3}\\). Rational.'
  },
  {
    display: '\\(\\dfrac{5}{1}\\)',
    eval: '\\(\\tfrac{5}{1} = 5\\)',
    asks: 'Is this an <b>integer</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. \\(\\tfrac{5}{1} = 5\\), a whole number. Every integer can be written as a fraction over 1.',
    bad: '\\(\\tfrac{5}{1}\\) is just 5. Any whole number divided by 1 stays the same. So yes, it is an integer.'
  },
  {
    display: '15',
    eval: '\\(15 = 1 + 2 + 3 + 4 + 5\\)',
    asks: 'Is this a <b>triangular number</b>?',
    choices: ['Yes', 'No'],
    correct: 0,
    good: 'Correct. \\(1+2+3+4+5 = 15\\), the 5th triangular number.',
    bad: 'Triangular numbers are sums \\(1+2+\\ldots+n\\). \\(1+2+3+4+5 = 15\\). So yes, triangular.'
  },
  {
    display: '\\(\\sqrt{0.25}\\)',
    eval: '\\(\\sqrt{0.25} = 0.5 = \\tfrac{1}{2}\\)',
    asks: 'Is this <b>irrational</b>?',
    choices: ['Rational', 'Irrational'],
    correct: 0,
    good: 'Correct. \\(\\sqrt{0.25} = 0.5 = \\tfrac{1}{2}\\), a rational number.',
    bad: 'Check: \\(0.5 \\times 0.5 = 0.25\\). So \\(\\sqrt{0.25} = 0.5 = \\tfrac{1}{2}\\), rational. Do not let the root fool you.'
  }
];

// State
var idx = 0;
var correct = 0;
var streak = 0;
var best = 0;
var results = []; // 'ok' | 'bad' per question

var card = document.getElementById('card');
var progress = document.getElementById('progress');
var correctEl = document.getElementById('correct');
var askedEl = document.getElementById('asked');
var streakEl = document.getElementById('streak');

function updateHeader() {
  correctEl.textContent = correct;
  askedEl.textContent = Math.min(idx + 1, QUESTIONS.length);
  streakEl.textContent = streak >= 2 ? '  ·  streak ' + streak : '';
}

function renderProgress() {
  progress.innerHTML = '';
  for (var i = 0; i < QUESTIONS.length; i++) {
    var p = document.createElement('span');
    p.className = 'pip';
    if (i < results.length) p.classList.add('done', results[i]);
    else if (i === idx) p.classList.add('active');
    progress.appendChild(p);
  }
}

function render() {
  if (idx >= QUESTIONS.length) return renderDone();
  var q = QUESTIONS[idx];

  card.innerHTML =
    '<p class="prompt">The number is</p>' +
    '<div class="number">' + q.display + '</div>' +
    '<p class="eval">' + (q.eval || '&nbsp;') + '</p>' +
    '<p class="question">' + q.asks + '</p>' +
    '<div class="choices ' + (q.choices.length === 2 ? 'two' : 'three') + '" id="choices"></div>' +
    '<div class="feedback" id="feedback">&nbsp;</div>' +
    '<div class="next-row"><button class="next-btn hidden" id="next">Next <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>';

  var choicesDiv = document.getElementById('choices');
  for (var i = 0; i < q.choices.length; i++) {
    (function(i){
      var btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = q.choices[i];
      btn.addEventListener('click', function(){ answer(i); });
      choicesDiv.appendChild(btn);
    })(i);
  }

  renderProgress();
  updateHeader();
  renderMath(card);
}

// Walk text nodes under `root` and replace \(...\) / \[...\] with KaTeX HTML.
function renderMath(root) {
  if (!root || typeof katex === 'undefined') return;
  var nodes = [];
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(function(tn) {
    var text = tn.nodeValue;
    if (!text || (text.indexOf('\\(') < 0 && text.indexOf('\\[') < 0)) return;
    var parent = tn.parentNode;
    if (!parent || (parent.closest && parent.closest('.katex'))) return;
    var frag = document.createDocumentFragment();
    var re = /\\\((.+?)\\\)|\\\[(.+?)\\\]/g;
    var last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var span = document.createElement('span');
      try {
        katex.render(m[1] || m[2], span, {
          displayMode: !!m[2],
          throwOnError: false,
          strict: false,
          output: 'html'
        });
      } catch (_) {
        span.textContent = m[0];
      }
      frag.appendChild(span);
      last = re.lastIndex;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    parent.replaceChild(frag, tn);
  });
}

function answer(chosen) {
  var q = QUESTIONS[idx];
  var buttons = document.querySelectorAll('.choice');
  for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;

  var isRight = chosen === q.correct;
  buttons[chosen].classList.add(isRight ? 'correct' : 'wrong');
  if (!isRight) buttons[q.correct].classList.add('reveal');

  if (isRight) {
    correct++;
    streak++;
    best = Math.max(best, streak);
    results.push('ok');
  } else {
    streak = 0;
    results.push('bad');
  }

  var fb = document.getElementById('feedback');
  fb.classList.add('show', isRight ? 'ok' : 'bad');
  fb.innerHTML = (isRight ? '✓ ' : '✗ ') + (isRight ? q.good : q.bad);
  renderMath(fb);

  document.getElementById('next').classList.remove('hidden');
  document.getElementById('next').addEventListener('click', next);
  renderProgress();
  updateHeader();
}

function next() {
  idx++;
  render();
}

function renderDone() {
  var pct = Math.round((correct / QUESTIONS.length) * 100);
  var msg;
  if (pct === 100) msg = 'Perfect. You have the classification rules locked in.';
  else if (pct >= 80) msg = 'Strong, the rules are solid. Review the ones you missed.';
  else if (pct >= 60) msg = 'Good start. Revisit the square-root traps and the HCF/LCM split.';
  else msg = 'Re-read the lesson, especially the section on irrationals vs square roots.';

  card.innerHTML =
    '<div class="done-card">' +
      '<p class="prompt" style="margin-bottom:18px">You got</p>' +
      '<div class="big">' + correct + '<span class="total"> / ' + QUESTIONS.length + '</span></div>' +
      '<p class="msg">' + msg + (best >= 3 ? '  Best streak: ' + best + '.' : '') + '</p>' +
      '<button class="again" id="again">Try again</button>' +
    '</div>';
  renderMath(card);
  document.getElementById('again').addEventListener('click', reset);
  renderProgress();
  askedEl.textContent = QUESTIONS.length;
  streakEl.textContent = '';
}

function reset() {
  idx = 0; correct = 0; streak = 0; results = [];
  render();
}

// Wait for KaTeX (loaded via defer) before first render.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', render);
} else {
  render();
}

// Auto-resize the hosting iframe. Critical: measure the actual content block,
// not document.body.scrollHeight. body.scrollHeight includes whatever height
// the iframe has been given, which creates a feedback loop (iframe grows ->
// body grows -> reports bigger -> iframe grows again).
var lastReported = 0;
var reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.querySelector('.wrap');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    // Height of content = bottom of wrap + body padding-bottom
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'pl-widget-resize', height: h }, '*');
    }
  });
}
// Observe the content wrap, not body. Growing the iframe doesn't grow the wrap.
var wrapEl = document.querySelector('.wrap');
if (wrapEl) {
  var ro = new ResizeObserver(reportHeight);
  ro.observe(wrapEl);
}
window.addEventListener('load', reportHeight);
// Extra fire on each render state change
var origRender = render;
render = function() { origRender.apply(this, arguments); reportHeight(); };
</script>
</body>
</html>
