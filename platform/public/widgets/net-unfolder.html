<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Net Unfolder</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; min-height:22px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .stage-outer {
    width:100%;
    max-width:480px;
    margin:0 auto;
    aspect-ratio: 480 / 360;
    position:relative;
  }
  .stage {
    position:absolute;
    inset:0;
    perspective:1200px;
    overflow:hidden;
    border-radius:6px;
  }
  .scene {
    position:absolute;
    left:50%; top:50%;
    width:0; height:0;
    transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1);
  }
  /* Per-solid 3D scene rotation. Pyramid apex points along +z so it
     needs more X-tilt to stand the apex up in screen. */
  .scene.solid-cube,
  .scene.solid-cuboid,
  .scene.solid-prism,
  .scene.solid-cylinder,
  .scene.solid-cone { transform: rotateX(-22deg) rotateY(28deg); }
  /* Pyramid: order matters. CSS applies right-to-left, so writing
     rotateY(15) rotateX(60) tilts the +z apex straight up FIRST (to
     -0.866 y), then twists by 15 deg around the world y-axis -- the
     apex stays centred horizontally instead of drifting right.
     Result: apex directly above base centre, base seen as a tilted
     parallelogram, two front faces visible. */
  .scene.solid-pyramid  { transform: rotateY(15deg) rotateX(60deg); }
  /* Net (flat) state: top-down view for every solid. */
  .stage.is-flat .scene { transform: rotateX(0deg) rotateY(0deg); }

  /* All hinges share preserve-3d + smooth transform transitions */
  .hinge {
    position:absolute;
    left:0; top:0;
    transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1);
  }

  /* All faces are absolutely positioned divs; the JS sets size + colour */
  .face {
    position:absolute;
    transform-style: preserve-3d;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
  }
  .face .face-label {
    position:absolute; left:50%; top:50%;
    transform: translate(-50%, -50%);
    font-family:'Geist Mono', monospace;
    font-size:11px;
    font-weight:600;
    color:rgba(11,17,24,0.75);
    pointer-events:none;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:120px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover { color:#fff067; border-color:#fff067; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">solid</span>
    <span class="meta" id="state">3D</span>
  </div>
  <div class="stage-outer">
    <div class="stage" id="stage">
      <div class="scene" id="scene"></div>
    </div>
  </div>
  <div class="controls">
    <button class="ctl" id="toggle">unfold →</button>
  </div>
  <p class="footer" id="footer">click to unfold the solid into its net</p>
</div>

<script>
"use strict";

var qs = new URLSearchParams(window.location.search);
var SOLID = (qs.get("solid") || "cube").toLowerCase();

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  grey:   "#3a4a5a",
  bg:     "#0b1118"
};

// Translucent fill for faces
function fillOf(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + ",0.18)";
}

var scene = document.getElementById("scene");
scene.classList.add("solid-" + SOLID);

function setStyle(el, s) {
  for (var k in s) {
    if (s[k] !== undefined) el.style[k] = s[k];
  }
}

// Make a rectangular face div centred at its parent's local origin.
// hingeAttach: which edge of the face is on the parent's transform-origin.
//   "bottom" -> face extends upward in -y from its bottom edge
//   "top"    -> face extends downward in +y
//   "left"   -> face extends rightward in +x
//   "right"  -> face extends leftward in -x
function rectFace(w, h, color, label, hingeAttach) {
  var el = document.createElement("div");
  el.className = "face";
  // Local positioning: place the face so its hinge edge is at (0, 0, 0).
  var off = { left: 0, top: 0 };
  if (hingeAttach === "bottom") { off.left = -w/2; off.top = -h; }
  else if (hingeAttach === "top") { off.left = -w/2; off.top = 0; }
  else if (hingeAttach === "left") { off.left = 0; off.top = -h/2; }
  else if (hingeAttach === "right") { off.left = -w; off.top = -h/2; }
  else { off.left = -w/2; off.top = -h/2; }  // centred
  setStyle(el, {
    width: w + "px",
    height: h + "px",
    left: off.left + "px",
    top: off.top + "px",
    background: fillOf(color),
    border: "1.5px solid " + color
  });
  if (label) {
    var lab = document.createElement("div");
    lab.className = "face-label";
    lab.textContent = label;
    lab.style.color = color;
    el.appendChild(lab);
  }
  return el;
}

// Triangle face: a wrapper div that is itself unclipped, containing
//   1) a clip-path filled div (the triangle's translucent fill),
//   2) three explicit edge lines along the triangle sides (so the
//      faces still have a clean stroke in 3D — clip-path on a div
//      clips its outline to the bounding box, leaving slanted edges
//      invisible).
function triFace(w, h, color, label, points, hingeAttach) {
  var wrapper = document.createElement("div");
  wrapper.className = "face";
  var off = { left: 0, top: 0 };
  if (hingeAttach === "bottom") { off.left = -w/2; off.top = -h; }
  else if (hingeAttach === "top") { off.left = -w/2; off.top = 0; }
  else if (hingeAttach === "left") { off.left = 0; off.top = -h/2; }
  else if (hingeAttach === "right") { off.left = -w; off.top = -h/2; }
  else { off.left = -w/2; off.top = -h/2; }
  setStyle(wrapper, {
    width: w + "px",
    height: h + "px",
    left: off.left + "px",
    top: off.top + "px"
  });

  // Translucent fill, clipped to the polygon shape
  var fill = document.createElement("div");
  setStyle(fill, {
    position: "absolute",
    left: "0",
    top: "0",
    width: "100%",
    height: "100%",
    background: fillOf(color),
    clipPath: "polygon(" + points + ")"
  });
  wrapper.appendChild(fill);

  // Parse `points` into pixel-space vertex coords and add 3 edge lines
  var verts = points.split(",").map(function(p) {
    var parts = p.trim().split(/\s+/);
    return {
      x: parseFloat(parts[0]) / 100 * w,
      y: parseFloat(parts[1]) / 100 * h
    };
  });
  for (var i = 0; i < verts.length; i++) {
    var a = verts[i], b = verts[(i + 1) % verts.length];
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var line = document.createElement("div");
    setStyle(line, {
      position: "absolute",
      left: a.x + "px",
      top: a.y + "px",
      width: len + "px",
      height: "1.5px",
      background: color,
      transformOrigin: "0 50%",
      transform: "translateY(-0.75px) rotate(" + ang + "deg)",
      pointerEvents: "none"
    });
    wrapper.appendChild(line);
  }

  if (label) {
    var lab = document.createElement("div");
    lab.className = "face-label";
    lab.textContent = label;
    lab.style.color = color;
    wrapper.appendChild(lab);
  }
  return wrapper;
}

// Make a hinge wrapper. Fold angle = the rotation when in folded (3D) state.
// In flat state, the hinge always rotates to 0deg.
function hinge(parent, folded, axis, x, y, z) {
  var h = document.createElement("div");
  h.className = "hinge";
  h.dataset.foldedRotate = "rotate" + axis + "(" + folded + "deg)";
  setStyle(h, {
    transform: "translate3d(" + (x||0) + "px," + (y||0) + "px," + (z||0) + "px) " + h.dataset.foldedRotate
  });
  (parent || scene).appendChild(h);
  return h;
}

function setHingeFolded(h) {
  var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
  h.style.transform = (pos ? pos[0] : "") + " " + h.dataset.foldedRotate;
}
function setHingeFlat(h) {
  var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
  h.style.transform = (pos ? pos[0] : "") + " rotate3d(0,0,0,0deg)";
}

var allHinges = [];
function trackHinge(h) { allHinges.push(h); return h; }

// === SOLID BUILDERS ===================================================

function buildCube() {
  document.getElementById("title").textContent = "CUBE";
  document.getElementById("footer").textContent = "6 square faces unfold into a cross-shaped net";
  var s = 100;
  var c = COL.blue;
  // Front face: anchor at scene origin, in the xy plane (z=0)
  var front = rectFace(s, s, c, "front");
  scene.appendChild(front);

  // Top: hinge at front's top edge (y = -s/2), folded by rotating -90 about x
  // (rotating UP toward viewer in CSS y-down means rotateX(+90) brings top up)
  var hTop = trackHinge(hinge(scene, -90, "X", 0, -s/2, 0));
  hTop.appendChild(rectFace(s, s, c, "top", "bottom"));

  // Bottom: hinge at front's bottom edge, fold +90
  var hBot = trackHinge(hinge(scene, 90, "X", 0, s/2, 0));
  hBot.appendChild(rectFace(s, s, c, "bottom", "top"));

  // Left: hinge at front's left edge, fold +90 about y
  var hLeft = trackHinge(hinge(scene, 90, "Y", -s/2, 0, 0));
  hLeft.appendChild(rectFace(s, s, c, "left", "right"));

  // Right: hinge at front's right edge, fold -90 about y
  var hRight = trackHinge(hinge(scene, -90, "Y", s/2, 0, 0));
  hRight.appendChild(rectFace(s, s, c, "right", "left"));

  // Back: hinge at right's outer edge (after right is in cube position)
  // In the right face's local frame, after rotation the outer edge is at (s, 0, 0)
  // relative to the hinge. The back face hinges there with a -90 fold.
  var hBack = trackHinge(hinge(hRight, -90, "Y", s, 0, 0));
  hBack.appendChild(rectFace(s, s, c, "back", "left"));
}

function buildCuboid() {
  document.getElementById("title").textContent = "CUBOID";
  document.getElementById("footer").textContent = "3 pairs of rectangles: 2 of 5x4, 2 of 5x3, 2 of 4x3";
  var L = 115, W = 90, H = 70;  // length, width, height in px
  var c = COL.yellow;
  // Front face: L wide, H tall, in xy plane at z=0
  var front = rectFace(L, H, c, L + " x " + H);
  scene.appendChild(front);

  // Top: above front. Width L x depth W.
  var hTop = trackHinge(hinge(scene, -90, "X", 0, -H/2, 0));
  hTop.appendChild(rectFace(L, W, c, L + " x " + W, "bottom"));

  // Bottom
  var hBot = trackHinge(hinge(scene, 90, "X", 0, H/2, 0));
  hBot.appendChild(rectFace(L, W, c, L + " x " + W, "top"));

  // Left: H tall, W deep
  var hLeft = trackHinge(hinge(scene, 90, "Y", -L/2, 0, 0));
  hLeft.appendChild(rectFace(W, H, c, W + " x " + H, "right"));

  // Right: H tall, W deep
  var hRight = trackHinge(hinge(scene, -90, "Y", L/2, 0, 0));
  hRight.appendChild(rectFace(W, H, c, W + " x " + H, "left"));

  // Back: hinged on right's outer edge
  var hBack = trackHinge(hinge(hRight, -90, "Y", W, 0, 0));
  hBack.appendChild(rectFace(L, H, c, L + " x " + H, "left"));
}

function buildPrism() {
  document.getElementById("title").textContent = "TRIANGULAR PRISM";
  // Cross-section legs and prism length in cm (URL-configurable).
  var aCm = parseFloat(qs.get("a")) || 5;   // a-leg (vertical)
  var bCm = parseFloat(qs.get("b")) || 8;   // b-leg (horizontal)
  var Lcm = parseFloat(qs.get("L")) || 12;  // prism length
  var hCm = Math.sqrt(aCm * aCm + bCm * bCm);
  // Auto-scale so the unfolded net (width = L + 2a, height = b + a + hyp) fits
  // the 480x360 stage with ~15% margin.
  var netWcm = Lcm + 2 * aCm;
  var netHcm = bCm + aCm + hCm;
  var scale = Math.min(420 / netWcm, 320 / netHcm);
  var a = aCm * scale, b = bCm * scale, L = Lcm * scale, hyp = hCm * scale;
  document.getElementById("footer").textContent =
    "2 triangles (" + aCm + "-" + bCm + "-" + Math.round(hCm) +
    ") + 3 rectangles (length " + Lcm + ")";
  var c = COL.green;

  // The net extends upward from the bottom rectangle by (a + hyp). To keep
  // the whole figure visually centred in the stage, translate everything
  // DOWN by (a + hyp)/2 so the bounding box of the net spans symmetrically
  // around the scene origin.
  var yOff = (a + hyp) / 2;

  // Bottom (b-leg side) rectangle: anchor in xy plane at z=0
  var bottomEl = rectFace(L, b, c, Lcm + " x " + bCm);
  bottomEl.style.top = (-b/2 + yOff) + "px";
  scene.appendChild(bottomEl);

  // a-leg side: hinged at bottom's TOP edge (y = -b/2 + yOff). Folds back -90 about x.
  var hSide1 = trackHinge(hinge(scene, -90, "X", 0, -b/2 + yOff, 0));
  hSide1.appendChild(rectFace(L, a, c, Lcm + " x " + aCm, "bottom"));

  // Hypotenuse side: hinged at the top edge of the a-leg side. Wrap angle =
  // 180 - top-vertex-angle of the cross-section (= 180 - acos(a/hyp)).
  var wrapDeg = 180 - Math.acos(a / hyp) * 180 / Math.PI;
  var hSide2 = document.createElement("div");
  hSide2.className = "hinge";
  hSide2.dataset.foldedRotate = "rotateX(-" + wrapDeg + "deg)";
  hSide2.style.transform = "translate3d(0px," + (-a) + "px,0px) " + hSide2.dataset.foldedRotate;
  hSide1.appendChild(hSide2);
  allHinges.push(hSide2);
  hSide2.appendChild(rectFace(L, hyp, c, Lcm + " x " + Math.round(hCm), "bottom"));

  // Caps: triangle in cross-section (right angle between a and b legs).
  // Hinges at the bottom rectangle's left and right edges (y = yOff).
  var capLabel = aCm + "-" + bCm + "-" + Math.round(hCm);
  var hCapL = trackHinge(hinge(scene, 90, "Y", -L/2, yOff, 0));
  hCapL.appendChild(triFace(a, b, c, capLabel, "100% 0%, 100% 100%, 0% 0%", "right"));

  var hCapR = trackHinge(hinge(scene, -90, "Y", L/2, yOff, 0));
  hCapR.appendChild(triFace(a, b, c, capLabel, "0% 0%, 0% 100%, 100% 0%", "left"));
}

function buildCylinder() {
  document.getElementById("title").textContent = "CYLINDER";
  document.getElementById("footer").textContent = "2 circular ends + a rectangle of width = circumference 2πr";
  var r = 48;
  var H = 110;
  var circ = 2 * Math.PI * r;
  var c = COL.pink;

  // The curved side is approximated by N slats. Each slat smoothly animates
  // between its circumferential position (folded state) and a position along
  // the unrolled flat rectangle (flat state). CSS transitions interpolate the
  // transform matrix so the slats sweep open from cylinder to flat strip.
  var N = 28;
  var slatW = (circ / N) + 1;  // small overlap to avoid hairline gaps
  var cylinderSlats = [];
  for (var i = 0; i < N; i++) {
    var theta = (i / N) * 360;
    var rad = theta * Math.PI / 180;
    var slat = document.createElement("div");
    slat.className = "face cylinder-slat";
    setStyle(slat, {
      position: "absolute",
      left: (-slatW / 2) + "px",
      top: (-H / 2) + "px",
      width: slatW + "px",
      height: H + "px",
      background: fillOf(c),
      borderLeft: "0.5px solid " + c,
      borderRight: "0.5px solid " + c,
      transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
    });
    // Folded: at angular position theta around cylinder axis (axis = y), facing outward.
    slat.dataset.folded3d =
      "translate3d(" + (Math.cos(rad) * r) + "px,0px," + (Math.sin(rad) * r) + "px) " +
      "rotateY(" + (90 - theta) + "deg)";
    // Flat: along the unrolled rectangle's width, in xy plane.
    var xFlat = (i / N) * circ - circ / 2 + slatW / 2;
    slat.dataset.flat3d = "translate3d(" + xFlat + "px,0px,0px) rotateY(0deg)";
    slat.style.transform = slat.dataset.folded3d;
    scene.appendChild(slat);
    cylinderSlats.push(slat);
  }

  // Top circle: animate directly between two states (no hinge wrapper, since
  // the geometry of capping the cylinder vs sitting above the rectangle isn't
  // a single rotation about an edge).
  var topCircle = document.createElement("div");
  topCircle.className = "face cyl-cap-top";
  setStyle(topCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: (-r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    background: fillOf(c),
    border: "1.5px solid " + c,
    borderRadius: "50%",
    transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
  });
  topCircle.dataset.folded3d = "translate3d(0px," + (-H / 2) + "px,0px) rotateX(90deg)";
  topCircle.dataset.flat3d   = "translate3d(0px," + (-H / 2 - r) + "px,0px) rotateX(0deg)";
  topCircle.style.transform = topCircle.dataset.folded3d;
  scene.appendChild(topCircle);

  var botCircle = document.createElement("div");
  botCircle.className = "face cyl-cap-bot";
  setStyle(botCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: (-r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    background: fillOf(c),
    border: "1.5px solid " + c,
    borderRadius: "50%",
    transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
  });
  botCircle.dataset.folded3d = "translate3d(0px," + (H / 2) + "px,0px) rotateX(-90deg)";
  botCircle.dataset.flat3d   = "translate3d(0px," + (H / 2 + r) + "px,0px) rotateX(0deg)";
  botCircle.style.transform = botCircle.dataset.folded3d;
  scene.appendChild(botCircle);
}

function buildPyramid() {
  document.getElementById("title").textContent = "SQUARE-BASED PYRAMID";
  document.getElementById("footer").textContent = "1 square base + 4 triangular faces meeting at the apex";
  var s = 100;
  var H = 110;
  var slant = Math.sqrt((s/2)*(s/2) + H*H);
  var c = COL.orange;
  // Fold angle for each side: 180 - atan2(H, s/2). The face has to rotate PAST
  // 90 degrees because for H > s/2 the face leans inward toward the apex.
  // Verified: with foldDeg = 180 - atan2(H, s/2) all four apexes converge at
  // (0, 0, H) — the pyramid apex above the base centre.
  var foldDeg = 180 - Math.atan2(H, s/2) * 180 / Math.PI;

  // Base square anchor
  scene.appendChild(rectFace(s, s, c, "base " + s));

  // Top side (north): triangle width=s, height=slant, apex at top, base at bottom.
  // Hinge attaches face's bottom edge to base's top edge.
  var hN = trackHinge(hinge(scene, -foldDeg, "X", 0, -s/2, 0));
  hN.appendChild(triFace(s, slant, c, "side", "50% 0%, 0% 100%, 100% 100%", "bottom"));

  // Bottom side (south): triangle apex at the bottom-centre (pointing AWAY from base).
  // hingeAttach="top" means face top edge is at hinge -> base of triangle (top of clip)
  // sits on the base square's bottom edge.
  var hS = trackHinge(hinge(scene, foldDeg, "X", 0, s/2, 0));
  hS.appendChild(triFace(s, slant, c, "side", "0% 0%, 100% 0%, 50% 100%", "top"));

  // Left side (west): triangle width=slant, height=s, apex at left-centre
  // pointing outward to the left. Base of triangle is the right edge.
  var hW = trackHinge(hinge(scene, foldDeg, "Y", -s/2, 0, 0));
  hW.appendChild(triFace(slant, s, c, "side", "0% 50%, 100% 0%, 100% 100%", "right"));

  // Right side (east): apex at right-centre.
  var hE = trackHinge(hinge(scene, -foldDeg, "Y", s/2, 0, 0));
  hE.appendChild(triFace(slant, s, c, "side", "100% 50%, 0% 0%, 0% 100%", "left"));
}

function buildCone() {
  document.getElementById("title").textContent = "CONE";
  // Cone parameters: base radius r, vertical height h
  var rCm = parseFloat(qs.get("r")) || 4;
  var hCm = parseFloat(qs.get("h")) || 9;
  var slantCm = Math.sqrt(rCm * rCm + hCm * hCm);
  // Net spans: sector ~ 2*slant wide and slant tall, plus base circle 2r below it.
  // Auto-scale so it fits the 480x320 stage.
  var scale = Math.min(420 / (2 * slantCm), 320 / (slantCm + 2 * rCm + 10));
  var r = rCm * scale, H = hCm * scale, slant = slantCm * scale;
  document.getElementById("footer").textContent =
    "1 circular base (r=" + rCm + ") + 1 sector (radius = slant " + Math.round(slantCm) + ")";
  var c = COL.blue;

  // Cone half-angle (between axis and slant edge) — the slat tilt from vertical.
  var alphaCone = Math.atan2(r, H) * 180 / Math.PI;
  var sectorAngleDeg = (2 * Math.PI * r / slant) * 180 / Math.PI;

  // Centre the net vertically: net y range is [-yOff, -yOff + slant + 2r].
  var yOff = (slant + 2 * r) / 2;

  var N = 36;
  var slatW = 2 * Math.PI * r / N + 1.5;
  for (var i = 0; i < N; i++) {
    var thetaDeg = (i + 0.5) / N * 360;             // 3D angle around cone axis
    var thetaRad = thetaDeg * Math.PI / 180;
    var alphaDeg = (i + 0.5) / N * sectorAngleDeg - sectorAngleDeg / 2;  // flat-sector angle from central axis
    var alphaRad = alphaDeg * Math.PI / 180;

    var slat = document.createElement("div");
    slat.className = "face cone-slat";
    setStyle(slat, {
      position: "absolute",
      left: (-slatW / 2) + "px",
      top: (-slant / 2) + "px",
      width: slatW + "px",
      height: slant + "px",
      background: fillOf(c),
      clipPath: "polygon(50% 0%, 0% 100%, 100% 100%)",
      outline: "0.5px solid " + c,
      outlineOffset: "-0.5px",
      transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
    });

    // Folded transform: bbox centre at midpoint between cone apex (0,-H/2,0) and base
    // mid (r*cos,H/2,r*sin). Rotation: rotateY(-theta) rotateZ(-alphaCone) so the
    // slat's local +y aligns with apex->base direction.
    var foldedTx = r * Math.cos(thetaRad) / 2;
    var foldedTz = r * Math.sin(thetaRad) / 2;
    slat.dataset.folded3d =
      "translate3d(" + foldedTx + "px,0px," + foldedTz + "px) " +
      "rotateY(" + (-thetaDeg) + "deg) rotateZ(" + (-alphaCone) + "deg)";

    // Flat transform: sector centred at scene (0, -yOff, 0), arc opens DOWNWARD.
    // bbox centre at midpoint between apex (0,-yOff,0) and base mid
    // (sin(alpha)*slant, -yOff+cos(alpha)*slant, 0).
    var flatTx = Math.sin(alphaRad) * slant / 2;
    var flatTy = -yOff + Math.cos(alphaRad) * slant / 2;
    slat.dataset.flat3d =
      "translate3d(" + flatTx + "px," + flatTy + "px,0px) rotateZ(" + (-alphaDeg) + "deg)";

    slat.style.transform = slat.dataset.folded3d;
    scene.appendChild(slat);
  }

  // Base circle: animates between cone base position (xz plane at y=H/2) and flat
  // net position (below the sector, in xy plane).
  var baseCircle = document.createElement("div");
  baseCircle.className = "face cone-base";
  setStyle(baseCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: (-r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    borderRadius: "50%",
    border: "1.5px solid " + c,
    background: fillOf(c),
    transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
  });
  baseCircle.dataset.folded3d = "translate3d(0px," + (H / 2) + "px,0px) rotateX(90deg)";
  baseCircle.dataset.flat3d = "translate3d(0px," + (-yOff + slant + r) + "px,0px) rotateX(0deg)";
  baseCircle.style.transform = baseCircle.dataset.folded3d;
  scene.appendChild(baseCircle);
}

// Apply the requested solid
var BUILDERS = {
  cube: buildCube,
  cuboid: buildCuboid,
  prism: buildPrism,
  cylinder: buildCylinder,
  pyramid: buildPyramid,
  cone: buildCone
};
(BUILDERS[SOLID] || buildCube)();

// === Toggle controller ===============================================

var stage = document.getElementById("stage");
var toggleBtn = document.getElementById("toggle");
var stateEl = document.getElementById("state");
var isFlat = false;

function updateView() {
  if (isFlat) {
    stage.classList.add("is-flat");
    toggleBtn.textContent = "← refold";
    stateEl.textContent = "NET";
    // Reset every hinge to identity rotation (flat)
    for (var i = 0; i < allHinges.length; i++) {
      var h = allHinges[i];
      var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
      h.style.transform = (pos ? pos[0] : "") + " rotate3d(0,0,0,0deg)";
    }
    // Elements with their own folded/flat transforms (e.g. cylinder slats + caps)
    var dual = scene.querySelectorAll("[data-flat3d]");
    for (var d = 0; d < dual.length; d++) {
      dual[d].style.transform = dual[d].dataset.flat3d;
    }
  } else {
    stage.classList.remove("is-flat");
    toggleBtn.textContent = "unfold →";
    stateEl.textContent = "3D";
    for (var k = 0; k < allHinges.length; k++) {
      var hh = allHinges[k];
      var pos2 = (hh.style.transform || "").match(/translate3d\([^)]*\)/);
      hh.style.transform = (pos2 ? pos2[0] : "") + " " + hh.dataset.foldedRotate;
    }
    var dual2 = scene.querySelectorAll("[data-folded3d]");
    for (var d2 = 0; d2 < dual2.length; d2++) {
      dual2[d2].style.transform = dual2[d2].dataset.folded3d;
    }
  }
}

toggleBtn.onclick = function() {
  isFlat = !isFlat;
  updateView();
};
updateView();

// === Stage scaling ===================================================
var stageOuter = document.querySelector(".stage-outer");
function fitStage() {
  // Stage is 480x360 inside .stage-outer which uses aspect-ratio 480/360.
  // The scene is centred via left:50%; top:50%, so we don't need transform-scale —
  // it scales naturally with the parent.
}
window.addEventListener("resize", fitStage);

// === Height reporter ================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
