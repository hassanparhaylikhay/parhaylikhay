<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Net Unfolder</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; min-height:22px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .stage-outer {
    width:100%;
    max-width:480px;
    margin:0 auto;
    aspect-ratio: 480 / 360;
    position:relative;
  }
  .stage {
    position:absolute;
    inset:0;
    perspective:1200px;
    overflow:hidden;
    border-radius:6px;
  }
  .scene {
    position:absolute;
    left:50%; top:50%;
    width:0; height:0;
    transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1);
  }
  /* Per-solid 3D scene rotation. Pyramid apex points along +z so it
     needs more X-tilt to stand the apex up in screen. */
  .scene.solid-cube,
  .scene.solid-cuboid,
  .scene.solid-prism,
  .scene.solid-cylinder,
  .scene.solid-cone { transform: rotateX(-22deg) rotateY(28deg); }
  /* Pyramid: order matters. CSS applies right-to-left, so writing
     rotateY(15) rotateX(60) tilts the +z apex straight up FIRST (to
     -0.866 y), then twists by 15 deg around the world y-axis -- the
     apex stays centred horizontally instead of drifting right.
     Result: apex directly above base centre, base seen as a tilted
     parallelogram, two front faces visible. */
  .scene.solid-pyramid  { transform: rotateY(15deg) rotateX(60deg); }
  /* Net (flat) state: top-down view for every solid. */
  .stage.is-flat .scene { transform: rotateX(0deg) rotateY(0deg); }

  /* All hinges share preserve-3d + smooth transform transitions */
  .hinge {
    position:absolute;
    left:0; top:0;
    transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1);
  }

  /* All faces are absolutely positioned divs; the JS sets size + colour */
  .face {
    position:absolute;
    transform-style: preserve-3d;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
  }
  .face-label {
    position:absolute; left:50%; top:50%;
    transform: translate(-50%, -50%);
    font-size:14px;
    font-weight:600;
    pointer-events:none;
    line-height:1;
    opacity:0;
    transition: opacity 0.35s ease;
    text-shadow: 0 0 6px rgba(11,17,24,0.7);
  }
  .face-label .katex { font-size: 1em; }
  .stage.is-flat .face-label {
    opacity: 1;
    transition: opacity 0.45s ease 1.4s;
  }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:120px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover { color:#fff067; border-color:#fff067; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">solid</span>
    <span class="meta" id="state">3D</span>
  </div>
  <div class="stage-outer">
    <div class="stage" id="stage">
      <div class="scene" id="scene"></div>
    </div>
  </div>
  <div class="controls">
    <select id="cross-sel" style="display:none;background:#0b1118;border:1px solid #141e2a;color:#f0eeea;font-family:'Geist Mono',monospace;font-size:12px;padding:7px 22px 7px 12px;border-radius:6px;cursor:pointer">
      <option value="triangle" selected>triangle</option>
      <option value="trapezium">trapezium</option>
      <option value="rectangle">rectangle</option>
    </select>
    <button class="ctl" id="toggle">unfold →</button>
  </div>
  <p class="footer" id="footer">click to unfold the solid into its net</p>
</div>

<script>
"use strict";

var qs = new URLSearchParams(window.location.search);
var SOLID = (qs.get("solid") || "cube").toLowerCase();

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  grey:   "#3a4a5a",
  bg:     "#0b1118"
};

// Translucent fill for faces
function fillOf(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + ",0.18)";
}

var scene = document.getElementById("scene");
scene.classList.add("solid-" + SOLID);

function setStyle(el, s) {
  for (var k in s) {
    if (s[k] !== undefined) el.style[k] = s[k];
  }
}

// KaTeX render helper. Falls back to plain text if KaTeX is not yet loaded.
function tryRenderKaTeX(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRenderKaTeX(target, tex); }, 50);
  }
}

// Build a face label that renders KaTeX inside a positioned div. Used as the
// 4th argument to rectFace / triFace builders (they call this to materialise
// the label DOM). Pass null to skip labelling.
function makeKaTeXLabel(tex, color) {
  if (!tex) return null;
  var lab = document.createElement("div");
  lab.className = "face-label";
  lab.style.color = color;
  tryRenderKaTeX(lab, tex);
  return lab;
}

// Make a rectangular face div centred at its parent's local origin.
// hingeAttach: which edge of the face is on the parent's transform-origin.
//   "bottom" -> face extends upward in -y from its bottom edge
//   "top"    -> face extends downward in +y
//   "left"   -> face extends rightward in +x
//   "right"  -> face extends leftward in -x
// 4th argument is now a KaTeX string (or null). The label appears AFTER unfold
// (CSS controls visibility) and shows the area formula for that face.
function rectFace(w, h, color, tex, hingeAttach) {
  var el = document.createElement("div");
  el.className = "face";
  // Local positioning: place the face so its hinge edge is at (0, 0, 0).
  var off = { left: 0, top: 0 };
  if (hingeAttach === "bottom") { off.left = -w/2; off.top = -h; }
  else if (hingeAttach === "top") { off.left = -w/2; off.top = 0; }
  else if (hingeAttach === "left") { off.left = 0; off.top = -h/2; }
  else if (hingeAttach === "right") { off.left = -w; off.top = -h/2; }
  else { off.left = -w/2; off.top = -h/2; }  // centred
  setStyle(el, {
    width: w + "px",
    height: h + "px",
    left: off.left + "px",
    top: off.top + "px",
    background: fillOf(color),
    border: "1.5px solid " + color
  });
  var lab = makeKaTeXLabel(tex, color);
  if (lab) el.appendChild(lab);
  return el;
}

// Triangle face: a wrapper div that is itself unclipped, containing
//   1) a clip-path filled div (the triangle's translucent fill),
//   2) three explicit edge lines along the triangle sides (so the
//      faces still have a clean stroke in 3D — clip-path on a div
//      clips its outline to the bounding box, leaving slanted edges
//      invisible).
function triFace(w, h, color, tex, points, hingeAttach) {
  var wrapper = document.createElement("div");
  wrapper.className = "face";
  var off = { left: 0, top: 0 };
  if (hingeAttach === "bottom") { off.left = -w/2; off.top = -h; }
  else if (hingeAttach === "top") { off.left = -w/2; off.top = 0; }
  else if (hingeAttach === "left") { off.left = 0; off.top = -h/2; }
  else if (hingeAttach === "right") { off.left = -w; off.top = -h/2; }
  else { off.left = -w/2; off.top = -h/2; }
  setStyle(wrapper, {
    width: w + "px",
    height: h + "px",
    left: off.left + "px",
    top: off.top + "px"
  });

  // Translucent fill, clipped to the polygon shape
  var fill = document.createElement("div");
  setStyle(fill, {
    position: "absolute",
    left: "0",
    top: "0",
    width: "100%",
    height: "100%",
    background: fillOf(color),
    clipPath: "polygon(" + points + ")"
  });
  wrapper.appendChild(fill);

  // Parse `points` into pixel-space vertex coords and add 3 edge lines
  var verts = points.split(",").map(function(p) {
    var parts = p.trim().split(/\s+/);
    return {
      x: parseFloat(parts[0]) / 100 * w,
      y: parseFloat(parts[1]) / 100 * h
    };
  });
  for (var i = 0; i < verts.length; i++) {
    var a = verts[i], b = verts[(i + 1) % verts.length];
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var line = document.createElement("div");
    setStyle(line, {
      position: "absolute",
      left: a.x + "px",
      top: a.y + "px",
      width: len + "px",
      height: "1.5px",
      background: color,
      transformOrigin: "0 50%",
      transform: "translateY(-0.75px) rotate(" + ang + "deg)",
      pointerEvents: "none"
    });
    wrapper.appendChild(line);
  }

  var lab = makeKaTeXLabel(tex, color);
  if (lab) wrapper.appendChild(lab);
  return wrapper;
}

// Make a hinge wrapper. Fold angle = the rotation when in folded (3D) state.
// In flat state, the hinge always rotates to 0deg.
function hinge(parent, folded, axis, x, y, z) {
  var h = document.createElement("div");
  h.className = "hinge";
  h.dataset.foldedRotate = "rotate" + axis + "(" + folded + "deg)";
  setStyle(h, {
    transform: "translate3d(" + (x||0) + "px," + (y||0) + "px," + (z||0) + "px) " + h.dataset.foldedRotate
  });
  (parent || scene).appendChild(h);
  return h;
}

function setHingeFolded(h) {
  var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
  h.style.transform = (pos ? pos[0] : "") + " " + h.dataset.foldedRotate;
}
function setHingeFlat(h) {
  var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
  h.style.transform = (pos ? pos[0] : "") + " rotate3d(0,0,0,0deg)";
}

var allHinges = [];
function trackHinge(h) { allHinges.push(h); return h; }

// === SOLID BUILDERS ===================================================

function buildCube() {
  document.getElementById("title").textContent = "CUBE";
  document.getElementById("footer").textContent = "6 squares of area s² · total SA = 6s²";
  var s = 100;
  var c = COL.blue;
  var tex = "s^{2}";
  scene.appendChild(rectFace(s, s, c, tex));
  var hTop = trackHinge(hinge(scene, -90, "X", 0, -s/2, 0));
  hTop.appendChild(rectFace(s, s, c, tex, "bottom"));
  var hBot = trackHinge(hinge(scene, 90, "X", 0, s/2, 0));
  hBot.appendChild(rectFace(s, s, c, tex, "top"));
  var hLeft = trackHinge(hinge(scene, 90, "Y", -s/2, 0, 0));
  hLeft.appendChild(rectFace(s, s, c, tex, "right"));
  var hRight = trackHinge(hinge(scene, -90, "Y", s/2, 0, 0));
  hRight.appendChild(rectFace(s, s, c, tex, "left"));
  var hBack = trackHinge(hinge(hRight, -90, "Y", s, 0, 0));
  hBack.appendChild(rectFace(s, s, c, tex, "left"));
}

function buildCuboid() {
  document.getElementById("title").textContent = "CUBOID";
  document.getElementById("footer").textContent = "3 pairs of rectangles · SA = 2(lw + lh + wh)";
  var L = 115, W = 90, H = 70;
  // Match the cuboid-explorer's palette: front/back blue, top/bottom pink, left/right orange.
  var cFB = COL.blue;
  var cTB = COL.pink;
  var cLR = COL.orange;
  // Front: lh (blue)
  scene.appendChild(rectFace(L, H, cFB, "lh"));
  // Top: lw (pink)
  var hTop = trackHinge(hinge(scene, -90, "X", 0, -H/2, 0));
  hTop.appendChild(rectFace(L, W, cTB, "lw", "bottom"));
  // Bottom: lw (pink)
  var hBot = trackHinge(hinge(scene, 90, "X", 0, H/2, 0));
  hBot.appendChild(rectFace(L, W, cTB, "lw", "top"));
  // Left: wh (orange)
  var hLeft = trackHinge(hinge(scene, 90, "Y", -L/2, 0, 0));
  hLeft.appendChild(rectFace(W, H, cLR, "wh", "right"));
  // Right: wh (orange)
  var hRight = trackHinge(hinge(scene, -90, "Y", L/2, 0, 0));
  hRight.appendChild(rectFace(W, H, cLR, "wh", "left"));
  // Back: lh (blue)
  var hBack = trackHinge(hinge(hRight, -90, "Y", W, 0, 0));
  hBack.appendChild(rectFace(L, H, cFB, "lh", "left"));
}

function buildPrism() {
  // Read cross-section choice from URL or in-widget selector
  var cross = (qs.get("cross") || (document.getElementById("cross-sel") && document.getElementById("cross-sel").value) || "triangle").toLowerCase();
  if (cross === "trapezium") return buildTrapezoidalPrism();
  if (cross === "rectangle") return buildRectangularPrism();
  return buildTriangularPrism();
}

function buildTriangularPrism() {
  document.getElementById("title").textContent = "TRIANGULAR PRISM";
  var aCm = 5, bCm = 8, Lcm = 12;
  var hCm = Math.sqrt(aCm * aCm + bCm * bCm);
  var netWcm = Lcm + 2 * aCm;
  var netHcm = bCm + aCm + hCm;
  var scale = Math.min(420 / netWcm, 320 / netHcm);
  var a = aCm * scale, b = bCm * scale, L = Lcm * scale, hyp = hCm * scale;
  document.getElementById("footer").textContent = "2 triangle caps (½bh) + 3 side rectangles";
  // Match the prism-explorer: cross-section caps in blue, side rectangles in orange.
  var cCap  = COL.blue;
  var cSide = COL.orange;
  var yOff = (a + hyp) / 2;

  var bottomEl = rectFace(L, b, cSide, "bL");
  bottomEl.style.top = (-b/2 + yOff) + "px";
  scene.appendChild(bottomEl);

  var hSide1 = trackHinge(hinge(scene, -90, "X", 0, -b/2 + yOff, 0));
  hSide1.appendChild(rectFace(L, a, cSide, "aL", "bottom"));

  var wrapDeg = 180 - Math.acos(a / hyp) * 180 / Math.PI;
  var hSide2 = document.createElement("div");
  hSide2.className = "hinge";
  hSide2.dataset.foldedRotate = "rotateX(-" + wrapDeg + "deg)";
  hSide2.style.transform = "translate3d(0px," + (-a) + "px,0px) " + hSide2.dataset.foldedRotate;
  hSide1.appendChild(hSide2);
  allHinges.push(hSide2);
  hSide2.appendChild(rectFace(L, hyp, cSide, "cL", "bottom"));

  // Triangle caps with the area formula (cross-section colour)
  var hCapL = trackHinge(hinge(scene, 90, "Y", -L/2, yOff, 0));
  var capL = triFace(a, b, cCap, "\\tfrac{1}{2}bh", "100% 0%, 100% 100%, 0% 0%", "right");
  hCapL.appendChild(capL);

  var hCapR = trackHinge(hinge(scene, -90, "Y", L/2, yOff, 0));
  var capR = triFace(a, b, cCap, "\\tfrac{1}{2}bh", "0% 0%, 0% 100%, 100% 0%", "left");
  hCapR.appendChild(capR);
}

function buildTrapezoidalPrism() {
  document.getElementById("title").textContent = "TRAPEZOIDAL PRISM";
  // Isosceles trapezium cross-section: parallel sides a (top) and b (bottom > a),
  // perpendicular height h. Slant side length s.
  var aCm = 5, bCm = 9, hCm = 5, Lcm = 11;
  var sCm = Math.sqrt(((bCm - aCm) / 2) * ((bCm - aCm) / 2) + hCm * hCm);
  // Auto-scale so the unrolled net (width L + 2b for caps; height b+2s+a stacked
  // rectangles) fits the 480×360 stage with a margin.
  var netWcm = Lcm + 2 * bCm;
  var netHcm = bCm + 2 * sCm + aCm;
  var scale = Math.min(380 / netWcm, 300 / netHcm);
  var a = aCm * scale, b = bCm * scale, h = hCm * scale, L = Lcm * scale, s = sCm * scale;
  document.getElementById("footer").textContent = "2 trapezium caps (½(a+b)h) + 4 side rectangles";
  // Match the prism-explorer: cross-section caps in blue, side rectangles in orange.
  var cCap  = COL.blue;
  var cSide = COL.orange;

  // Centre the unrolled rectangle stack vertically. Total upward extent from
  // the bottom rectangle's centre = (b/2 + s + a + s + b/2 - b) = s + a + s + b/2.
  // Simpler: tower height = b + s + a + s; centre tower around scene y=0 by
  // shifting the bottom rectangle DOWN by (s + a + s) / 2.
  var towerH = b + 2 * s + a;
  var bottomCY = (towerH - b) / 2;  // y of the bottom rectangle's centre (positive = below origin)

  // Bottom (b-side) rectangle
  var bottomEl = rectFace(L, b, cSide, "bL");
  bottomEl.style.top = (-b/2 + bottomCY) + "px";
  scene.appendChild(bottomEl);

  // alpha = interior angle at the bottom-right vertex of the trapezium
  // = angle between the b-side and the slant side. For b > a:
  //   alpha = arctan(h / ((b-a)/2))
  // For b == a (rectangle) it is 90°.
  var alpha;
  if (bCm > aCm) alpha = Math.atan2(hCm, (bCm - aCm) / 2) * 180 / Math.PI;
  else alpha = 90;
  var wrap1 = 180 - alpha;  // bottom→slant fold
  var wrap2 = alpha;        // slant→top fold

  // First slant rectangle (sL): hinged at bottom rect's top edge.
  var hSlant1 = trackHinge(hinge(scene, -wrap1, "X", 0, -b/2 + bottomCY, 0));
  hSlant1.appendChild(rectFace(L, s, cSide, "sL", "bottom"));

  // Top rectangle (aL): hinged at slant1's top edge.
  var hTop = document.createElement("div");
  hTop.className = "hinge";
  hTop.dataset.foldedRotate = "rotateX(-" + wrap2 + "deg)";
  hTop.style.transform = "translate3d(0px," + (-s) + "px,0px) " + hTop.dataset.foldedRotate;
  hSlant1.appendChild(hTop);
  allHinges.push(hTop);
  hTop.appendChild(rectFace(L, a, cSide, "aL", "bottom"));

  // Second slant rectangle (sL): hinged at top's top edge.
  var hSlant2 = document.createElement("div");
  hSlant2.className = "hinge";
  hSlant2.dataset.foldedRotate = "rotateX(-" + wrap2 + "deg)";
  hSlant2.style.transform = "translate3d(0px," + (-a) + "px,0px) " + hSlant2.dataset.foldedRotate;
  hTop.appendChild(hSlant2);
  allHinges.push(hSlant2);
  hSlant2.appendChild(rectFace(L, s, cSide, "sL", "bottom"));

  // Caps: trapezium clipped from an h×b bounding box (width = perpendicular
  // height of the trapezium, height = the b-side). The b-side runs along ONE
  // of the bbox's vertical edges; that edge is the hinge edge so when the cap
  // folds up around the y-axis, the b-side stays vertical and aligns with the
  // bottom rectangle's left/right short edge.
  //
  // Vertex coords in pct of the h×b bbox (origin top-left, y-down):
  //   left cap (hinge on RIGHT edge):
  //     (100%, 0%)            top-right (top end of b-side)
  //     (100%, 100%)           bottom-right (bottom end of b-side)
  //     (0%, (b+a)/(2b)*100%)  bottom-left of a-side
  //     (0%, (b-a)/(2b)*100%)  top-left of a-side
  //   right cap (hinge on LEFT edge): mirror of the above.
  var aSideTopPct = ((b - a) / (2 * b) * 100).toFixed(2);
  var aSideBotPct = ((b + a) / (2 * b) * 100).toFixed(2);

  var leftCapClip  = "100% 0%, 100% 100%, 0% " + aSideBotPct + "%, 0% " + aSideTopPct + "%";
  var rightCapClip = "0% 0%, 0% 100%, 100% " + aSideBotPct + "%, 100% " + aSideTopPct + "%";

  // LEFT cap: hinges at bottom rect's LEFT short edge.
  var hCapL = trackHinge(hinge(scene, 90, "Y", -L/2, bottomCY, 0));
  var capL = triFace(h, b, cCap, "\\tfrac{1}{2}(a+b)h", leftCapClip, "right");
  hCapL.appendChild(capL);

  // RIGHT cap: hinges at bottom rect's RIGHT short edge.
  var hCapR = trackHinge(hinge(scene, -90, "Y", L/2, bottomCY, 0));
  var capR = triFace(h, b, cCap, "\\tfrac{1}{2}(a+b)h", rightCapClip, "left");
  hCapR.appendChild(capR);
}

function buildRectangularPrism() {
  // A rectangular prism is just a cuboid — reuse that builder.
  buildCuboid();
  document.getElementById("title").textContent = "RECTANGULAR PRISM (CUBOID)";
}

function buildCylinder() {
  document.getElementById("title").textContent = "CYLINDER";
  document.getElementById("footer").textContent = "2 circles (πr²) + 1 rectangle (2πrh)";
  var r = 48;
  var H = 110;
  var circ = 2 * Math.PI * r;
  // Match the cylinder-explorer: side surface in blue, end circles in pink.
  var cSide = COL.blue;
  var cCap  = COL.pink;

  var N = 28;
  var slatW = (circ / N) + 1;
  var cylinderSlats = [];
  for (var i = 0; i < N; i++) {
    var theta = (i / N) * 360;
    var rad = theta * Math.PI / 180;
    var slat = document.createElement("div");
    slat.className = "face cylinder-slat";
    setStyle(slat, {
      position: "absolute",
      left: (-slatW / 2) + "px",
      top: (-H / 2) + "px",
      width: slatW + "px",
      height: H + "px",
      background: fillOf(cSide),
      borderLeft: "0.5px solid " + cSide,
      borderRight: "0.5px solid " + cSide,
      transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
    });
    // Folded: at angular position theta around cylinder axis (axis = y), facing outward.
    slat.dataset.folded3d =
      "translate3d(" + (Math.cos(rad) * r) + "px,0px," + (Math.sin(rad) * r) + "px) " +
      "rotateY(" + (90 - theta) + "deg)";
    // Flat: along the unrolled rectangle's width, in xy plane.
    var xFlat = (i / N) * circ - circ / 2 + slatW / 2;
    slat.dataset.flat3d = "translate3d(" + xFlat + "px,0px,0px) rotateY(0deg)";
    slat.style.transform = slat.dataset.folded3d;
    scene.appendChild(slat);
    cylinderSlats.push(slat);
  }

  // Top circle (cap colour)
  var topCircle = document.createElement("div");
  topCircle.className = "face cyl-cap-top";
  setStyle(topCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: (-r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    background: fillOf(cCap),
    border: "1.5px solid " + cCap,
    borderRadius: "50%",
    transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
  });
  topCircle.dataset.folded3d = "translate3d(0px," + (-H / 2) + "px,0px) rotateX(90deg)";
  topCircle.dataset.flat3d   = "translate3d(0px," + (-H / 2 - r) + "px,0px) rotateX(0deg)";
  topCircle.style.transform = topCircle.dataset.folded3d;
  topCircle.appendChild(makeKaTeXLabel("\\pi r^{2}", cCap));
  scene.appendChild(topCircle);

  var botCircle = document.createElement("div");
  botCircle.className = "face cyl-cap-bot";
  setStyle(botCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: (-r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    background: fillOf(cCap),
    border: "1.5px solid " + cCap,
    borderRadius: "50%",
    transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
  });
  botCircle.dataset.folded3d = "translate3d(0px," + (H / 2) + "px,0px) rotateX(-90deg)";
  botCircle.dataset.flat3d   = "translate3d(0px," + (H / 2 + r) + "px,0px) rotateX(0deg)";
  botCircle.style.transform = botCircle.dataset.folded3d;
  botCircle.appendChild(makeKaTeXLabel("\\pi r^{2}", cCap));
  scene.appendChild(botCircle);

  // Side label for the curved surface (side colour)
  var sideLabel = document.createElement("div");
  sideLabel.className = "face-label";
  sideLabel.style.position = "absolute";
  sideLabel.style.left = "0";
  sideLabel.style.top = "0";
  sideLabel.style.transform = "translate(-50%, -50%)";
  sideLabel.style.color = cSide;
  tryRenderKaTeX(sideLabel, "2\\pi r h");
  scene.appendChild(sideLabel);
}

function buildPyramid() {
  document.getElementById("title").textContent = "SQUARE-BASED PYRAMID";
  document.getElementById("footer").textContent = "1 square base (s²) + 4 triangle sides (½sl)";
  var s = 100;
  var H = 110;
  var slant = Math.sqrt((s/2)*(s/2) + H*H);
  // Pair with the cone palette since both share the p5 page: base yellow, sides blue.
  var cBase = COL.yellow;
  var cSide = COL.blue;
  var foldDeg = 180 - Math.atan2(H, s/2) * 180 / Math.PI;

  // Base square: s² (yellow)
  scene.appendChild(rectFace(s, s, cBase, "s^{2}"));
  var triTex = "\\tfrac{1}{2} s l";

  // 4 triangular sides (blue)
  var hN = trackHinge(hinge(scene, -foldDeg, "X", 0, -s/2, 0));
  hN.appendChild(triFace(s, slant, cSide, triTex, "50% 0%, 0% 100%, 100% 100%", "bottom"));

  var hS = trackHinge(hinge(scene, foldDeg, "X", 0, s/2, 0));
  hS.appendChild(triFace(s, slant, cSide, triTex, "0% 0%, 100% 0%, 50% 100%", "top"));

  var hW = trackHinge(hinge(scene, foldDeg, "Y", -s/2, 0, 0));
  hW.appendChild(triFace(slant, s, cSide, triTex, "0% 50%, 100% 0%, 100% 100%", "right"));

  var hE = trackHinge(hinge(scene, -foldDeg, "Y", s/2, 0, 0));
  hE.appendChild(triFace(slant, s, cSide, triTex, "100% 50%, 0% 0%, 0% 100%", "left"));
}

function buildCone() {
  document.getElementById("title").textContent = "CONE";
  // Cone parameters: base radius r, vertical height h
  var rCm = parseFloat(qs.get("r")) || 4;
  var hCm = parseFloat(qs.get("h")) || 9;
  var slantCm = Math.sqrt(rCm * rCm + hCm * hCm);
  // Net spans: sector ~ 2*slant wide and slant tall, plus base circle 2r below it.
  // Auto-scale so it fits the 480x320 stage.
  var scale = Math.min(420 / (2 * slantCm), 320 / (slantCm + 2 * rCm + 10));
  var r = rCm * scale, H = hCm * scale, slant = slantCm * scale;
  document.getElementById("footer").textContent =
    "1 circular base (πr²) + 1 sector (curved SA = πrl)";
  // Match the cone-explorer: curved surface in blue, base circle in yellow.
  var cSide = COL.blue;
  var cBase = COL.yellow;
  var c = cSide; // legacy variable used for the slat fills below

  // Cone half-angle (between axis and slant edge) — the slat tilt from vertical.
  var alphaCone = Math.atan2(r, H) * 180 / Math.PI;
  var sectorAngleDeg = (2 * Math.PI * r / slant) * 180 / Math.PI;

  // Centre the net vertically: net y range is [-yOff, -yOff + slant + 2r].
  var yOff = (slant + 2 * r) / 2;

  var N = 36;
  var slatW = 2 * Math.PI * r / N + 1.5;
  for (var i = 0; i < N; i++) {
    var thetaDeg = (i + 0.5) / N * 360;             // 3D angle around cone axis
    var thetaRad = thetaDeg * Math.PI / 180;
    var alphaDeg = (i + 0.5) / N * sectorAngleDeg - sectorAngleDeg / 2;  // flat-sector angle from central axis
    var alphaRad = alphaDeg * Math.PI / 180;

    var slat = document.createElement("div");
    slat.className = "face cone-slat";
    setStyle(slat, {
      position: "absolute",
      left: (-slatW / 2) + "px",
      top: (-slant / 2) + "px",
      width: slatW + "px",
      height: slant + "px",
      background: fillOf(c),
      clipPath: "polygon(50% 0%, 0% 100%, 100% 100%)",
      outline: "0.5px solid " + c,
      outlineOffset: "-0.5px",
      transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
    });

    // Folded transform: bbox centre at midpoint between cone apex (0,-H/2,0) and base
    // mid (r*cos,H/2,r*sin). Rotation: rotateY(-theta) rotateZ(-alphaCone) so the
    // slat's local +y aligns with apex->base direction.
    var foldedTx = r * Math.cos(thetaRad) / 2;
    var foldedTz = r * Math.sin(thetaRad) / 2;
    slat.dataset.folded3d =
      "translate3d(" + foldedTx + "px,0px," + foldedTz + "px) " +
      "rotateY(" + (-thetaDeg) + "deg) rotateZ(" + (-alphaCone) + "deg)";

    // Flat transform: sector centred at scene (0, -yOff, 0), arc opens DOWNWARD.
    // bbox centre at midpoint between apex (0,-yOff,0) and base mid
    // (sin(alpha)*slant, -yOff+cos(alpha)*slant, 0).
    var flatTx = Math.sin(alphaRad) * slant / 2;
    var flatTy = -yOff + Math.cos(alphaRad) * slant / 2;
    slat.dataset.flat3d =
      "translate3d(" + flatTx + "px," + flatTy + "px,0px) rotateZ(" + (-alphaDeg) + "deg)";

    slat.style.transform = slat.dataset.folded3d;
    scene.appendChild(slat);
  }

  // Base circle (yellow — matches cone-explorer's base-front)
  var baseCircle = document.createElement("div");
  baseCircle.className = "face cone-base";
  setStyle(baseCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: (-r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    borderRadius: "50%",
    border: "1.5px solid " + cBase,
    background: fillOf(cBase),
    transition: "transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1)"
  });
  baseCircle.dataset.folded3d = "translate3d(0px," + (H / 2) + "px,0px) rotateX(90deg)";
  baseCircle.dataset.flat3d = "translate3d(0px," + (-yOff + slant + r) + "px,0px) rotateX(0deg)";
  baseCircle.style.transform = baseCircle.dataset.folded3d;
  baseCircle.appendChild(makeKaTeXLabel("\\pi r^{2}", cBase));
  scene.appendChild(baseCircle);

  // Sector label (blue — matches the curved surface)
  var sectorLabel = document.createElement("div");
  sectorLabel.className = "face-label";
  sectorLabel.style.position = "absolute";
  sectorLabel.style.left = "0";
  sectorLabel.style.top = (-yOff + slant * 0.55) + "px";
  sectorLabel.style.transform = "translate(-50%, -50%)";
  sectorLabel.style.color = cSide;
  tryRenderKaTeX(sectorLabel, "\\pi r l");
  scene.appendChild(sectorLabel);
}

// Apply the requested solid
var BUILDERS = {
  cube: buildCube,
  cuboid: buildCuboid,
  prism: buildPrism,
  cylinder: buildCylinder,
  pyramid: buildPyramid,
  cone: buildCone
};

function rebuildSolid() {
  scene.innerHTML = "";
  allHinges = [];
  (BUILDERS[SOLID] || buildCube)();
}

// Show the cross-section selector when solid=prism, and rebuild on change.
var crossSelEl = document.getElementById("cross-sel");
if (SOLID === "prism") {
  crossSelEl.style.display = "inline-block";
  // Pre-set from URL ?cross= if provided
  var initialCross = (qs.get("cross") || "triangle").toLowerCase();
  if (["triangle", "trapezium", "rectangle"].indexOf(initialCross) !== -1) {
    crossSelEl.value = initialCross;
  }
  crossSelEl.addEventListener("change", function() {
    rebuildSolid();
    // Re-apply the current fold state after rebuild
    updateView();
  });
}

rebuildSolid();

// === Toggle controller ===============================================

var stage = document.getElementById("stage");
var toggleBtn = document.getElementById("toggle");
var stateEl = document.getElementById("state");
var isFlat = false;

function updateView() {
  if (isFlat) {
    stage.classList.add("is-flat");
    toggleBtn.textContent = "← refold";
    stateEl.textContent = "NET";
    // Reset every hinge to identity rotation (flat)
    for (var i = 0; i < allHinges.length; i++) {
      var h = allHinges[i];
      var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
      h.style.transform = (pos ? pos[0] : "") + " rotate3d(0,0,0,0deg)";
    }
    // Elements with their own folded/flat transforms (e.g. cylinder slats + caps)
    var dual = scene.querySelectorAll("[data-flat3d]");
    for (var d = 0; d < dual.length; d++) {
      dual[d].style.transform = dual[d].dataset.flat3d;
    }
  } else {
    stage.classList.remove("is-flat");
    toggleBtn.textContent = "unfold →";
    stateEl.textContent = "3D";
    for (var k = 0; k < allHinges.length; k++) {
      var hh = allHinges[k];
      var pos2 = (hh.style.transform || "").match(/translate3d\([^)]*\)/);
      hh.style.transform = (pos2 ? pos2[0] : "") + " " + hh.dataset.foldedRotate;
    }
    var dual2 = scene.querySelectorAll("[data-folded3d]");
    for (var d2 = 0; d2 < dual2.length; d2++) {
      dual2[d2].style.transform = dual2[d2].dataset.folded3d;
    }
  }
}

toggleBtn.onclick = function() {
  isFlat = !isFlat;
  updateView();
};
updateView();

// === Stage scaling ===================================================
var stageOuter = document.querySelector(".stage-outer");
function fitStage() {
  // Stage is 480x360 inside .stage-outer which uses aspect-ratio 480/360.
  // The scene is centred via left:50%; top:50%, so we don't need transform-scale —
  // it scales naturally with the parent.
}
window.addEventListener("resize", fitStage);

// === Height reporter ================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
