<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Net Unfolder</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; min-height:22px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .stage-outer {
    width:100%;
    max-width:480px;
    margin:0 auto;
    aspect-ratio: 480 / 360;
    position:relative;
  }
  .stage {
    position:absolute;
    inset:0;
    perspective:1200px;
    overflow:hidden;
    border-radius:6px;
  }
  .scene {
    position:absolute;
    left:50%; top:50%;
    width:0; height:0;
    transform-style: preserve-3d;
    transform: rotateX(-22deg) rotateY(28deg);
    transition: transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1);
  }
  .stage.is-flat .scene { transform: rotateX(0deg) rotateY(0deg); }

  /* All hinges share preserve-3d + smooth transform transitions */
  .hinge {
    position:absolute;
    left:0; top:0;
    transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(0.4, 0.1, 0.4, 1);
  }

  /* All faces are absolutely positioned divs; the JS sets size + colour */
  .face {
    position:absolute;
    transform-style: preserve-3d;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
  }
  .face .face-label {
    position:absolute; left:50%; top:50%;
    transform: translate(-50%, -50%);
    font-family:'Geist Mono', monospace;
    font-size:11px;
    font-weight:600;
    color:rgba(11,17,24,0.75);
    pointer-events:none;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:120px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover { color:#fff067; border-color:#fff067; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">solid</span>
    <span class="meta" id="state">3D</span>
  </div>
  <div class="stage-outer">
    <div class="stage" id="stage">
      <div class="scene" id="scene"></div>
    </div>
  </div>
  <div class="controls">
    <button class="ctl" id="toggle">unfold →</button>
  </div>
  <p class="footer" id="footer">click to unfold the solid into its net</p>
</div>

<script>
"use strict";

var qs = new URLSearchParams(window.location.search);
var SOLID = (qs.get("solid") || "cube").toLowerCase();

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  grey:   "#3a4a5a",
  bg:     "#0b1118"
};

// Translucent fill for faces
function fillOf(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + ",0.18)";
}

var scene = document.getElementById("scene");

function setStyle(el, s) {
  for (var k in s) {
    if (s[k] !== undefined) el.style[k] = s[k];
  }
}

// Make a rectangular face div centred at its parent's local origin.
// hingeAttach: which edge of the face is on the parent's transform-origin.
//   "bottom" -> face extends upward in -y from its bottom edge
//   "top"    -> face extends downward in +y
//   "left"   -> face extends rightward in +x
//   "right"  -> face extends leftward in -x
function rectFace(w, h, color, label, hingeAttach) {
  var el = document.createElement("div");
  el.className = "face";
  // Local positioning: place the face so its hinge edge is at (0, 0, 0).
  var off = { left: 0, top: 0 };
  if (hingeAttach === "bottom") { off.left = -w/2; off.top = -h; }
  else if (hingeAttach === "top") { off.left = -w/2; off.top = 0; }
  else if (hingeAttach === "left") { off.left = 0; off.top = -h/2; }
  else if (hingeAttach === "right") { off.left = -w; off.top = -h/2; }
  else { off.left = -w/2; off.top = -h/2; }  // centred
  setStyle(el, {
    width: w + "px",
    height: h + "px",
    left: off.left + "px",
    top: off.top + "px",
    background: fillOf(color),
    border: "1.5px solid " + color
  });
  if (label) {
    var lab = document.createElement("div");
    lab.className = "face-label";
    lab.textContent = label;
    lab.style.color = color;
    el.appendChild(lab);
  }
  return el;
}

// Triangle face via clip-path. Vertices given as percentages.
// hinge edge is the bottom edge (y=100%, x from 0 to 100%).
function triFace(w, h, color, label, points, hingeAttach) {
  var el = document.createElement("div");
  el.className = "face";
  var off = { left: 0, top: 0 };
  if (hingeAttach === "bottom") { off.left = -w/2; off.top = -h; }
  else if (hingeAttach === "top") { off.left = -w/2; off.top = 0; }
  else if (hingeAttach === "left") { off.left = 0; off.top = -h/2; }
  else if (hingeAttach === "right") { off.left = -w; off.top = -h/2; }
  else { off.left = -w/2; off.top = -h/2; }
  setStyle(el, {
    width: w + "px",
    height: h + "px",
    left: off.left + "px",
    top: off.top + "px",
    background: fillOf(color),
    clipPath: "polygon(" + points + ")",
    outline: "1.5px solid " + color,
    outlineOffset: "-1px"
  });
  if (label) {
    var lab = document.createElement("div");
    lab.className = "face-label";
    lab.textContent = label;
    lab.style.color = color;
    el.appendChild(lab);
  }
  return el;
}

// Make a hinge wrapper. Fold angle = the rotation when in folded (3D) state.
// In flat state, the hinge always rotates to 0deg.
function hinge(parent, folded, axis, x, y, z) {
  var h = document.createElement("div");
  h.className = "hinge";
  h.dataset.foldedRotate = "rotate" + axis + "(" + folded + "deg)";
  setStyle(h, {
    transform: "translate3d(" + (x||0) + "px," + (y||0) + "px," + (z||0) + "px) " + h.dataset.foldedRotate
  });
  (parent || scene).appendChild(h);
  return h;
}

function setHingeFolded(h) {
  var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
  h.style.transform = (pos ? pos[0] : "") + " " + h.dataset.foldedRotate;
}
function setHingeFlat(h) {
  var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
  h.style.transform = (pos ? pos[0] : "") + " rotate3d(0,0,0,0deg)";
}

var allHinges = [];
function trackHinge(h) { allHinges.push(h); return h; }

// === SOLID BUILDERS ===================================================

function buildCube() {
  document.getElementById("title").textContent = "CUBE";
  document.getElementById("footer").textContent = "6 square faces unfold into a cross-shaped net";
  var s = 90;
  var c = COL.blue;
  // Front face: anchor at scene origin, in the xy plane (z=0)
  var front = rectFace(s, s, c, "front");
  scene.appendChild(front);

  // Top: hinge at front's top edge (y = -s/2), folded by rotating -90 about x
  // (rotating UP toward viewer in CSS y-down means rotateX(+90) brings top up)
  var hTop = trackHinge(hinge(scene, -90, "X", 0, -s/2, 0));
  hTop.appendChild(rectFace(s, s, c, "top", "bottom"));

  // Bottom: hinge at front's bottom edge, fold +90
  var hBot = trackHinge(hinge(scene, 90, "X", 0, s/2, 0));
  hBot.appendChild(rectFace(s, s, c, "bottom", "top"));

  // Left: hinge at front's left edge, fold +90 about y
  var hLeft = trackHinge(hinge(scene, 90, "Y", -s/2, 0, 0));
  hLeft.appendChild(rectFace(s, s, c, "left", "right"));

  // Right: hinge at front's right edge, fold -90 about y
  var hRight = trackHinge(hinge(scene, -90, "Y", s/2, 0, 0));
  hRight.appendChild(rectFace(s, s, c, "right", "left"));

  // Back: hinge at right's outer edge (after right is in cube position)
  // In the right face's local frame, after rotation the outer edge is at (s, 0, 0)
  // relative to the hinge. The back face hinges there with a -90 fold.
  var hBack = trackHinge(hinge(hRight, -90, "Y", s, 0, 0));
  hBack.appendChild(rectFace(s, s, c, "back", "left"));
}

function buildCuboid() {
  document.getElementById("title").textContent = "CUBOID";
  document.getElementById("footer").textContent = "3 pairs of rectangles: 2 of 5x4, 2 of 5x3, 2 of 4x3";
  var L = 100, W = 80, H = 60;  // length, width, height in px
  var c = COL.yellow;
  // Front face: L wide, H tall, in xy plane at z=0
  var front = rectFace(L, H, c, L + " x " + H);
  scene.appendChild(front);

  // Top: above front. Width L x depth W.
  var hTop = trackHinge(hinge(scene, -90, "X", 0, -H/2, 0));
  hTop.appendChild(rectFace(L, W, c, L + " x " + W, "bottom"));

  // Bottom
  var hBot = trackHinge(hinge(scene, 90, "X", 0, H/2, 0));
  hBot.appendChild(rectFace(L, W, c, L + " x " + W, "top"));

  // Left: H tall, W deep
  var hLeft = trackHinge(hinge(scene, 90, "Y", -L/2, 0, 0));
  hLeft.appendChild(rectFace(W, H, c, W + " x " + H, "right"));

  // Right: H tall, W deep
  var hRight = trackHinge(hinge(scene, -90, "Y", L/2, 0, 0));
  hRight.appendChild(rectFace(W, H, c, W + " x " + H, "left"));

  // Back: hinged on right's outer edge
  var hBack = trackHinge(hinge(hRight, -90, "Y", W, 0, 0));
  hBack.appendChild(rectFace(L, H, c, L + " x " + H, "left"));
}

function buildPrism() {
  document.getElementById("title").textContent = "TRIANGULAR PRISM";
  document.getElementById("footer").textContent = "2 triangles + 3 rectangles wrap around the cross-section";
  // Right-angled triangle 3-4-5 cross-section, prism length 10
  // Use the 3 and 4 legs as the cross-section (right angle at one corner)
  var a = 60, b = 80;       // legs (3 and 4 cm scaled)
  var L = 110;              // prism length (10 cm scaled)
  var hyp = Math.sqrt(a*a + b*b);  // hypotenuse = 100 (5 cm scaled)
  var c = COL.green;

  // Anchor: front rectangle (the b-side rectangle along the bottom).
  // We orient the prism so its axis is along x; cross-section in yz plane.
  // The "bottom" rectangle (b x L) lies in the xy plane at z=0.
  var bottom = rectFace(L, b, c, L + " x " + b);
  scene.appendChild(bottom);

  // Front cap (triangle, attached to left edge of bottom rectangle)
  // Triangle has legs a (vertical) and b (horizontal), with right angle at top-left
  // hingeAttach: right (so it pivots about its right edge to fold up)
  var hCapL = trackHinge(hinge(scene, 90, "Y", -L/2, 0, 0));
  hCapL.appendChild(triFace(b, b * a / b, c, "tri", "0% 100%, 100% 100%, 100% 0%", "right"));

  // Back cap (right edge of bottom rectangle)
  var hCapR = trackHinge(hinge(scene, -90, "Y", L/2, 0, 0));
  hCapR.appendChild(triFace(b, b * a / b, c, "tri", "0% 100%, 100% 100%, 0% 0%", "left"));

  // Side rectangle 1 (a x L): attached to bottom's top edge, folds up
  var hSide1 = trackHinge(hinge(scene, -90, "X", 0, -b/2, 0));
  hSide1.appendChild(rectFace(L, a, c, L + " x " + a, "bottom"));

  // Side rectangle 2 (hypotenuse x L): attached to side1's top edge
  // After side1 is up (rotated -90), its top edge is at y = -b/2 in scene, z = -a.
  // In side1's local frame after attachment, its top edge is at the local y=0 of its hinge child.
  var hSide2 = trackHinge(hinge(hSide1, -180 + (Math.atan2(b, a) * 180 / Math.PI) * 2, "X", 0, -a, 0));
  // Actually for a prism, side2 wraps around to meet the bottom on the other side.
  // Use the actual wrap angle: after side1 is up at 90 from bottom, side2 should rotate
  // by (180 - acute angle of triangle at top) to meet the other side.
  // The angle at the top of the cross-section between side1 and side2 is the angle opposite the hypotenuse-projection... let me just compute.
  // For a right triangle with legs a, b and right angle between them, the angle between
  // side1 (length a, vertical) and side2 (hypotenuse) is atan(b/a).
  // So side2 folds by (180 - atan(b/a)*2)? Let me think again.
  // When unfolded flat, side1 is along the top edge of bottom (in plane z=0).
  // When folded into prism, side1 rotates -90 about its hinge so it's vertical (in -y direction).
  // Then side2 is attached to side1's top edge (in side1's local frame, at y=-a relative to side1's hinge).
  // Side2 needs to rotate to meet bottom's other edge (top edge at y=+b/2). The angle to rotate is...
  // Actually: in 3D the prism has cross-section of an a-b-hyp right triangle. With vertical side a meeting horizontal side b at a corner, and the hypotenuse closing the triangle.
  // Side2 (hypotenuse rectangle) tilts at an angle determined by the triangle geometry.
  // When the bottom is in the xy plane and side1 stands vertical at -y direction, the
  // hypotenuse goes from side1's top edge down to bottom's far edge. The angle of side2
  // RELATIVE TO side1 is (180 - angle at the top vertex of the triangle), where the top
  // vertex is between side1 and hypotenuse.
  // Top vertex angle = atan(b/a) (since the triangle has legs a vertical and b horizontal,
  // and the top vertex is where vertical leg meets the hypotenuse). The angle at top is
  // opposite to side b in the triangle, so by sin rule or simple geometry: atan(b/a).
  // Wait the angle at the top vertex is the angle between the vertical leg (a) and the
  // hypotenuse. The hypotenuse points from top-left down to bottom-right (from (0,0) to (b, a) in coord).
  // Vertical leg points from (0,0) down to (0, a), direction (0, 1).
  // Hypotenuse from (0, 0) to (b, a), direction (b, a)/hyp = (b/hyp, a/hyp).
  // Angle between (0,1) and (b/hyp, a/hyp) = acos((0*b/hyp + 1*a/hyp)) = acos(a/hyp).
  // So top vertex angle = acos(a/hyp). For a=60, b=80, hyp=100: acos(0.6) ~ 53.13 deg.
  // Side2 fold angle relative to side1 = 180 - 53.13 = 126.87 deg.
  // In CSS, folding side2 about its hinge (top of side1) by +126.87 (or maybe -126.87, depending on direction).
  hSide2.dataset.foldedRotate = "rotateX(" + (180 - Math.acos(a/hyp) * 180 / Math.PI) + "deg)";
  hSide2.style.transform = "translate3d(0px," + (-a) + "px,0px) " + hSide2.dataset.foldedRotate;
  hSide2.appendChild(rectFace(L, hyp, c, L + " x " + Math.round(hyp), "bottom"));
}

function buildCylinder() {
  document.getElementById("title").textContent = "CYLINDER";
  document.getElementById("footer").textContent = "2 circular ends + a rectangle of width = circumference 2πr";
  var r = 50;
  var H = 100;
  var circ = 2 * Math.PI * r;  // circumference
  var c = COL.pink;

  // Anchor: the curved-side rectangle (width=circ, height=H), in xy plane at z=0
  // It's the "unrolled" curved surface in net state.
  // In folded state, it wraps around to form the cylinder side.
  var sideEl = rectFace(circ, H, c, "2π · r  x  H");
  scene.appendChild(sideEl);

  // For folded-cylinder visualisation, we approximate the curved side with N slats
  // each at angular position around the cylinder axis. Each slat is a thin rectangle.
  // In flat state, they all sit side by side as a single strip of width circ.
  // In folded state, they wrap into a cylinder.
  // For simplicity (and to keep this tractable), we DON'T simulate the slats animation
  // and instead toggle the slats and the flat rectangle - showing the flat rect when
  // unfolded, and showing the slats wrapped in 3D when folded.

  // Hide the flat rectangle in the folded view, and make slats visible.
  // We'll do this with a simple approach: in folded state, the slats' wrapper shows;
  // in flat state, the rectangle shows. Both sit in the same scene.
  var slats = document.createElement("div");
  slats.className = "hinge cylinder-slats";
  slats.style.transformStyle = "preserve-3d";
  slats.style.transform = "translate3d(0,0,0)";
  scene.appendChild(slats);
  var N = 28;
  for (var i = 0; i < N; i++) {
    var theta = (i / N) * 360;
    var rad = theta * Math.PI / 180;
    var slatW = (circ / N) + 2;
    var slat = document.createElement("div");
    slat.className = "face";
    setStyle(slat, {
      position: "absolute",
      left: (-slatW/2) + "px",
      top: (-H/2) + "px",
      width: slatW + "px",
      height: H + "px",
      background: fillOf(c),
      borderLeft: "0.5px solid " + c,
      borderRight: "0.5px solid " + c,
      transform: "translate3d(" + (Math.cos(rad)*r) + "px,0px," + (Math.sin(rad)*r) + "px) rotateY(" + (90 - theta) + "deg)"
    });
    slats.appendChild(slat);
  }

  // Top circle - hinged at top edge of the curved-side rectangle
  // In flat state: circle sits ABOVE the rectangle, attached at the rect's top edge midpoint
  // In folded state: circle rotates 90 to become the top of the cylinder
  var hTop = trackHinge(hinge(scene, -90, "X", 0, -H/2, 0));
  var topCircle = document.createElement("div");
  topCircle.className = "face";
  setStyle(topCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: (-2*r) + "px",
    width: (2*r) + "px",
    height: (2*r) + "px",
    background: fillOf(c),
    border: "1.5px solid " + c,
    borderRadius: "50%"
  });
  hTop.appendChild(topCircle);

  // Bottom circle
  var hBot = trackHinge(hinge(scene, 90, "X", 0, H/2, 0));
  var botCircle = document.createElement("div");
  botCircle.className = "face";
  setStyle(botCircle, {
    position: "absolute",
    left: (-r) + "px",
    top: 0 + "px",
    width: (2*r) + "px",
    height: (2*r) + "px",
    background: fillOf(c),
    border: "1.5px solid " + c,
    borderRadius: "50%"
  });
  hBot.appendChild(botCircle);

  // Hide/show the flat rectangle vs the slats based on stage state.
  // We toggle their opacity via class on the stage.
  sideEl.style.opacity = "0";
  sideEl.style.transition = "opacity 0.6s ease 0.6s";
  slats.style.transition = "opacity 0.6s ease";
  // Initial state: solid, so slats visible, flat rect hidden
  // After unfold: slats hidden, flat rect visible
  sideEl.dataset.toggleOnFlat = "1";
  slats.dataset.toggleOnFolded = "1";
}

function buildPyramid() {
  document.getElementById("title").textContent = "SQUARE-BASED PYRAMID";
  document.getElementById("footer").textContent = "1 square base + 4 triangular faces meeting at the apex";
  var s = 80;            // base side
  var H = 90;            // pyramid height
  var slant = Math.sqrt((s/2)*(s/2) + H*H);  // slant height
  var c = COL.orange;

  // Base square anchor in xy plane
  var base = rectFace(s, s, c, "base " + s);
  scene.appendChild(base);

  // For each side (front, right, back, left): a triangular face hinged at the
  // corresponding base edge. Folded angle = the dihedral angle between base
  // and side.
  // The dihedral angle can be derived: each face's apex sits H above the
  // base centre, so its inward tilt from vertical is atan(H / (s/2)) — wait
  // let me recompute. The triangular face's apex is at the centre top
  // (above base centre). The face's base edge is at the base perimeter.
  // The angle the face makes with the base (dihedral) is the angle between
  // the base plane and the face plane.
  // A line from the midpoint of a base edge to the apex has length slant.
  // Its horizontal component is s/2 (apothem of square) and vertical H.
  // The angle from vertical (slant from horizontal): tan(theta) = H / (s/2).
  // The face tilts back by (90 - theta) from horizontal? Hmm.
  // Actually: when the face is FLAT (lying on the table), its plane = base plane.
  // When folded UP into pyramid, the face rotates about its base edge by some angle.
  // The angle is: angle between flat plane and the face's "up" direction.
  // The face's "up" direction (toward apex) goes from base-edge midpoint
  // to apex. Apex relative to base-edge midpoint: (0, -H, -s/2) where the
  // base-edge midpoint is at (0, 0, +s/2) from the centre, and apex is at
  // (0, -H, 0) from the centre. So relative: apex - midpoint = (0, -H, -s/2).
  // Length = slant. Angle from horizontal (xz plane) = atan2(H, s/2).
  // So fold angle = atan(H/(s/2)) measured from flat. For s=80, H=90:
  // atan(90/40) = atan(2.25) = 66.04 deg.
  var foldDeg = Math.atan2(H, s/2) * 180 / Math.PI;
  var triH = slant;  // the triangle's height (from base to apex)
  var triPoints = "50% 0%, 0% 100%, 100% 100%";  // apex at top, base at bottom

  var hF = trackHinge(hinge(scene, -foldDeg, "X", 0, -s/2, 0));
  hF.appendChild(triFace(s, triH, c, "side", triPoints, "bottom"));

  var hB = trackHinge(hinge(scene, foldDeg, "X", 0, s/2, 0));
  hB.appendChild(triFace(s, triH, c, "side", triPoints, "top"));

  var hL = trackHinge(hinge(scene, foldDeg, "Y", -s/2, 0, 0));
  hL.appendChild(triFace(s, triH, c, "side", triPoints, "right"));
  // The triangle for left/right is rotated 90 in its local frame (so its apex points in the +y direction relative to the hinge axis). Easier: define triangle with apex at the side opposite the hinge.

  var hR = trackHinge(hinge(scene, -foldDeg, "Y", s/2, 0, 0));
  hR.appendChild(triFace(s, triH, c, "side", triPoints, "left"));
}

// Apply the requested solid
var BUILDERS = {
  cube: buildCube,
  cuboid: buildCuboid,
  prism: buildPrism,
  cylinder: buildCylinder,
  pyramid: buildPyramid
};
(BUILDERS[SOLID] || buildCube)();

// === Toggle controller ===============================================

var stage = document.getElementById("stage");
var toggleBtn = document.getElementById("toggle");
var stateEl = document.getElementById("state");
var isFlat = false;

function updateView() {
  if (isFlat) {
    stage.classList.add("is-flat");
    toggleBtn.textContent = "← refold";
    stateEl.textContent = "NET";
    // Reset every hinge to identity rotation (flat)
    for (var i = 0; i < allHinges.length; i++) {
      var h = allHinges[i];
      var pos = (h.style.transform || "").match(/translate3d\([^)]*\)/);
      h.style.transform = (pos ? pos[0] : "") + " rotate3d(0,0,0,0deg)";
    }
    // Toggle visibility for elements with dataset flags
    var flatToggles = scene.querySelectorAll("[data-toggle-on-flat]");
    for (var i2 = 0; i2 < flatToggles.length; i2++) flatToggles[i2].style.opacity = "1";
    var foldedToggles = scene.querySelectorAll("[data-toggle-on-folded]");
    for (var j = 0; j < foldedToggles.length; j++) foldedToggles[j].style.opacity = "0";
  } else {
    stage.classList.remove("is-flat");
    toggleBtn.textContent = "unfold →";
    stateEl.textContent = "3D";
    for (var k = 0; k < allHinges.length; k++) {
      var hh = allHinges[k];
      var pos2 = (hh.style.transform || "").match(/translate3d\([^)]*\)/);
      hh.style.transform = (pos2 ? pos2[0] : "") + " " + hh.dataset.foldedRotate;
    }
    var flatToggles2 = scene.querySelectorAll("[data-toggle-on-flat]");
    for (var l = 0; l < flatToggles2.length; l++) flatToggles2[l].style.opacity = "0";
    var foldedToggles2 = scene.querySelectorAll("[data-toggle-on-folded]");
    for (var m = 0; m < foldedToggles2.length; m++) foldedToggles2[m].style.opacity = "1";
  }
}

toggleBtn.onclick = function() {
  isFlat = !isFlat;
  updateView();
};
updateView();

// === Stage scaling ===================================================
var stageOuter = document.querySelector(".stage-outer");
function fitStage() {
  // Stage is 480x360 inside .stage-outer which uses aspect-ratio 480/360.
  // The scene is centred via left:50%; top:50%, so we don't need transform-scale —
  // it scales naturally with the parent.
}
window.addEventListener("resize", fitStage);

// === Height reporter ================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
