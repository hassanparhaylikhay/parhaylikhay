<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Polygon Angle Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:14px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }
  .ext-cue {
    display:none; align-items:center; justify-content:center; gap:10px;
    margin:6px auto 8px; padding:6px 12px;
    background:rgba(255,70,112,0.06); border:1px solid rgba(255,70,112,0.2); border-radius:6px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#f0eeea;
  }
  .ext-cue.on { display:inline-flex; }
  .ext-cue svg { display:block; }
  .ext-cue .total { color:#ff4670; font-weight:700; }

  .controls { display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:18px; text-align:right; color:#f0eeea; font-weight:600; }

  .mode-row { display:flex; align-items:center; gap:8px; }
  .mode-row .name { color:#fff067; font-weight:600; }
  .mode-row select { background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px; padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer; }
  .mode-row select:focus { border-color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .poly-side { stroke:#00abfa; stroke-width:2.5; fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .poly-vertex { fill:#fff067; }
  .interior-arc { fill:#0fee8920; stroke:#0fee89; stroke-width:1.5; }
  .exterior-arc { fill:#ff467020; stroke:#ff4670; stroke-width:1.5; }
  .ext-extension { stroke:#7a7875; stroke-width:1; stroke-dasharray:3 3; fill:none; }
  .interior-label { font-family:'Geist Mono',monospace; font-size:10px; fill:#0fee89; font-weight:600; }
  .exterior-label { font-family:'Geist Mono',monospace; font-size:10px; fill:#ff4670; font-weight:600; }

  .tally { margin-top:6px; font-family:'Geist Mono',monospace; font-size:11px; color:#c8c6be; text-align:center; padding:0 4px; word-break:break-word; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fSum"></span>
    <span class="formula" id="fInt"></span>
    <span class="formula" id="fExt"></span>
  </div>

  <div class="ext-cue" id="extCue">
    <span id="extCueSvgWrap"></span>
    <span>n &times; <span id="extCueEach"></span> = <span class="total">360&deg;</span></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">n</span>
      <input type="range" id="nSlider" min="3" max="12" value="5" step="1"/>
      <span class="val" id="nVal">5</span>
    </div>
    <div class="mode-row">
      <span class="name">show</span>
      <select id="mode">
        <option value="interior">interior angles</option>
        <option value="exterior">exterior angles</option>
        <option value="both" selected>both</option>
      </select>
    </div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <g id="extensions"></g>
    <g id="extArcs"></g>
    <g id="intArcs"></g>
    <polygon id="poly" class="poly-side"/>
    <g id="vertices"></g>
    <g id="intLabels"></g>
    <g id="extLabels"></g>
  </svg>

  <p class="tally" id="tally"></p>

  <p class="footer">drag n: from triangle (n=3) to dodecagon (n=12)</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var SVG_NS = "http://www.w3.org/2000/svg";
var CX = 240, CY = 165, R = 100;
var ARC_R_INT = 22;
var ARC_R_EXT = 18;
var LBL_R_INT = 32;
var LBL_R_EXT = 36;
var EXT_LEN = 30;

// URL params: ?mode=interior|exterior|both, ?n=3..12, ?lock=1 (hides mode dropdown)
var qp = new URLSearchParams(window.location.search);
var qpMode = qp.get("mode");
var qpN = parseInt(qp.get("n"), 10);
var qpLock = qp.get("lock") === "1";

var n = (qpN >= 3 && qpN <= 12) ? qpN : 5;
var mode = (qpMode === "interior" || qpMode === "exterior" || qpMode === "both") ? qpMode : "both";

// Format number cleanly: no trailing .0, at most 1 decimal place
function fmt(v) {
  var rounded = Math.round(v * 10) / 10;
  if (Math.abs(rounded - Math.round(rounded)) < 1e-9) return String(Math.round(rounded));
  return rounded.toFixed(1);
}

// Vertex positions for a regular polygon with the given (possibly fractional) n.
// We use floor(n) integer vertices for drawing/labels, but the radius/positions
// are interpolated smoothly via displayN by holding n fixed at targetN once
// the slider settles. To keep counts consistent, we always render exactly
// targetN vertices and let displayN govern only the apparent scale/spacing.
function vertices(nInt, radius) {
  var pts = [];
  var step = 2 * Math.PI / nInt;
  var start = -Math.PI / 2;
  for (var i = 0; i < nInt; i++) {
    var theta = start + i * step;
    pts.push({
      x: CX + radius * Math.cos(theta),
      y: CY + radius * Math.sin(theta),
      theta: theta
    });
  }
  return pts;
}

// Build a pie-slice arc starting at angle `a1`, sweeping by `sweep` radians
// (signed). Positive sweep = CW in screen (CCW math, since y is flipped).
function arcPathSigned(cx, cy, r, a1, sweep) {
  var x1 = cx + r * Math.cos(a1);
  var y1 = cy + r * Math.sin(a1);
  var a2 = a1 + sweep;
  var x2 = cx + r * Math.cos(a2);
  var y2 = cy + r * Math.sin(a2);
  var largeArc = Math.abs(sweep) > Math.PI ? 1 : 0;
  var sweepFlag = sweep > 0 ? 1 : 0;
  return "M " + cx + " " + cy +
         " L " + x1.toFixed(2) + " " + y1.toFixed(2) +
         " A " + r + " " + r + " 0 " + largeArc + " " + sweepFlag + " " +
         x2.toFixed(2) + " " + y2.toFixed(2) + " Z";
}

// Compute the signed sweep from a1 to a2 that goes through the side
// indicated by the unit direction (dirX, dirY). Robust against polygon
// winding: if the SHORT signed sweep's midpoint is on the wanted side,
// use it; otherwise take the LONG sweep (= shortSweep - 2π or + 2π).
function sweepThrough(a1, a2, dirX, dirY) {
  var d = a2 - a1;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d <= -Math.PI) d += 2 * Math.PI;
  var midA = a1 + d / 2;
  var dot = Math.cos(midA) * dirX + Math.sin(midA) * dirY;
  if (dot >= 0) return d;
  return d > 0 ? d - 2 * Math.PI : d + 2 * Math.PI;
}

function clearChildren(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function makeEl(tag, attrs) {
  var el = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
  return el;
}

// Live "exterior angles sum to 360°" cue: a small full circle filled with
// the n exterior sectors, each shown as a pink boundary ray + an arc.
// Shape and proportions update on every redraw, matching the 4.6 P1 pattern.
function buildExteriorCue(anglesRad) {
  var pw = 56, ph = 56, cx = pw / 2, cy = ph / 2, R = 22;
  var svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + pw + " " + ph);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("width", String(pw));
  svg.setAttribute("height", String(ph));
  var COL = "#ff4670";
  var ang = -Math.PI / 2; // start at top
  for (var j = 0; j < anglesRad.length; j++) {
    var a1 = ang;
    var a2 = ang + anglesRad[j];
    svg.appendChild(makeEl("line", {
      x1: cx, y1: cy,
      x2: (cx + Math.cos(a1) * R).toFixed(2),
      y2: (cy + Math.sin(a1) * R).toFixed(2),
      stroke: COL, "stroke-width": "1.2", "stroke-linecap": "round"
    }));
    var sx = cx + Math.cos(a1) * R, sy = cy + Math.sin(a1) * R;
    var ex = cx + Math.cos(a2) * R, ey = cy + Math.sin(a2) * R;
    var rad = a2 - a1;
    var largeArc = rad > Math.PI ? 1 : 0;
    svg.appendChild(makeEl("path", {
      d: "M " + sx.toFixed(2) + " " + sy.toFixed(2) +
         " A " + R + " " + R + " 0 " + largeArc + " 1 " + ex.toFixed(2) + " " + ey.toFixed(2),
      fill: "none", stroke: COL, "stroke-width": "1.7", "stroke-linecap": "round"
    }));
    ang = a2;
  }
  svg.appendChild(makeEl("circle", { cx: cx, cy: cy, r: "1.6", fill: "#7a7875" }));
  return svg;
}

function draw() {
  var interior = (n - 2) * 180 / n;
  var exterior = 360 / n;
  var sumInterior = (n - 2) * 180;

  // Update KaTeX formulas
  tryRender(
    document.getElementById("fSum"),
    "\\text{Sum of interior} = (n-2) \\times 180\\degree = \\textcolor{#0fee89}{" + sumInterior + "\\degree}"
  );
  tryRender(
    document.getElementById("fInt"),
    "\\text{Each interior (regular)} = \\textcolor{#0fee89}{" + fmt(interior) + "\\degree}"
  );
  tryRender(
    document.getElementById("fExt"),
    "\\text{Each exterior} = \\frac{360\\degree}{n} = \\textcolor{#ff4670}{" + fmt(exterior) + "\\degree}"
  );

  // Live 360° cue: visible only when the user is looking at exterior info.
  var extCue = document.getElementById("extCue");
  if (mode === "interior") {
    extCue.classList.remove("on");
  } else {
    extCue.classList.add("on");
    var anglesRad = [];
    for (var ee = 0; ee < n; ee++) anglesRad.push(2 * Math.PI / n);
    var wrap = document.getElementById("extCueSvgWrap");
    clearChildren(wrap);
    wrap.appendChild(buildExteriorCue(anglesRad));
    document.getElementById("extCueEach").textContent = fmt(exterior) + "°";
  }

  var pts = vertices(n, R);

  // Polygon outline
  var polyEl = document.getElementById("poly");
  var ptsAttr = pts.map(function(p) { return p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" ");
  polyEl.setAttribute("points", ptsAttr);

  // Vertices
  var vg = document.getElementById("vertices");
  clearChildren(vg);
  for (var i = 0; i < pts.length; i++) {
    vg.appendChild(makeEl("circle", {
      cx: pts[i].x, cy: pts[i].y, r: 4, class: "poly-vertex"
    }));
  }

  // Interior and exterior arcs/labels
  var intArcG = document.getElementById("intArcs");
  var extArcG = document.getElementById("extArcs");
  var extG = document.getElementById("extensions");
  var intLG = document.getElementById("intLabels");
  var extLG = document.getElementById("extLabels");
  clearChildren(intArcG);
  clearChildren(extArcG);
  clearChildren(extG);
  clearChildren(intLG);
  clearChildren(extLG);

  var showInterior = (mode === "interior" || mode === "both");
  var showExterior = (mode === "exterior" || mode === "both");

  for (var j = 0; j < n; j++) {
    var prev = pts[(j - 1 + n) % n];
    var cur  = pts[j];
    var next = pts[(j + 1) % n];

    // Side directions from cur
    var ax = prev.x - cur.x, ay = prev.y - cur.y;
    var bx = next.x - cur.x, by = next.y - cur.y;
    var aLen = Math.hypot(ax, ay), bLen = Math.hypot(bx, by);
    var aNx = ax / aLen, aNy = ay / aLen;
    var bNx = bx / bLen, bNy = by / bLen;
    var aAng = Math.atan2(aNy, aNx);
    var bAng = Math.atan2(bNy, bNx);

    // Inward direction at this vertex of a regular polygon centred at
    // (CX, CY) is exactly toward the centre. This is rock-solid regardless
    // of how prev/next sit, so it never flips on slider edges.
    var inX = (CX - cur.x), inY = (CY - cur.y);
    var inLen = Math.hypot(inX, inY) || 1;
    var inNx = inX / inLen, inNy = inY / inLen;
    var outNx = -inNx, outNy = -inNy;

    if (showInterior) {
      var sweepInt = sweepThrough(aAng, bAng, inNx, inNy);
      intArcG.appendChild(makeEl("path", {
        d: arcPathSigned(cur.x, cur.y, ARC_R_INT, aAng, sweepInt),
        class: "interior-arc"
      }));
      var lx = cur.x + inNx * LBL_R_INT;
      var ly = cur.y + inNy * LBL_R_INT + 3;
      var lblI = makeEl("text", {
        x: lx.toFixed(2), y: ly.toFixed(2),
        "text-anchor": "middle",
        class: "interior-label"
      });
      lblI.textContent = fmt(interior) + "°";
      intLG.appendChild(lblI);
    }

    if (showExterior) {
      // Continue the prev→cur side past cur by EXT_LEN
      var extDx = -aNx, extDy = -aNy;
      var ex = cur.x + extDx * EXT_LEN;
      var ey = cur.y + extDy * EXT_LEN;
      extG.appendChild(makeEl("line", {
        x1: cur.x, y1: cur.y, x2: ex.toFixed(2), y2: ey.toFixed(2),
        class: "ext-extension"
      }));
      var extAng = Math.atan2(extDy, extDx);
      // Reference: bisector of the SHORT sweep between extDir and bDir.
      // The outward radial direction is perpendicular to this bisector, so
      // using outNx/outNy here is degenerate and floating-point flipped the
      // sign on some vertices, picking the long (~315°) sweep.
      var refX = extDx + bNx, refY = extDy + bNy;
      var refLen = Math.hypot(refX, refY) || 1;
      var refNx = refX / refLen, refNy = refY / refLen;
      var sweepExt = sweepThrough(extAng, bAng, refNx, refNy);
      extArcG.appendChild(makeEl("path", {
        d: arcPathSigned(cur.x, cur.y, ARC_R_EXT, extAng, sweepExt),
        class: "exterior-arc"
      }));
      var lxE = cur.x + refNx * LBL_R_EXT;
      var lyE = cur.y + refNy * LBL_R_EXT + 3;
      var lblE = makeEl("text", {
        x: lxE.toFixed(2), y: lyE.toFixed(2),
        "text-anchor": "middle",
        class: "exterior-label"
      });
      lblE.textContent = fmt(exterior) + "°";
      extLG.appendChild(lblE);
    }
  }

  // Tally text below SVG
  var tallyEl = document.getElementById("tally");
  if (mode === "interior") {
    var parts = [];
    for (var k = 0; k < n; k++) parts.push(fmt(interior) + "°");
    tallyEl.innerHTML = "<span style=\"color:#0fee89\">Interior sum:</span> " +
      parts.join(" + ") + " = " + sumInterior + "°";
  } else if (mode === "exterior") {
    var partsE = [];
    for (var m = 0; m < n; m++) partsE.push(fmt(exterior) + "°");
    tallyEl.innerHTML = "<span style=\"color:#ff4670\">Exterior sum:</span> " +
      partsE.join(" + ") + " = 360°";
  } else {
    tallyEl.innerHTML =
      "<span style=\"color:#0fee89\">Interior sum:</span> " +
      n + " × " + fmt(interior) + "° = " + sumInterior + "°" +
      "  ·  " +
      "<span style=\"color:#ff4670\">Exterior sum:</span> " +
      n + " × " + fmt(exterior) + "° = 360°";
  }
}

document.getElementById("nSlider").addEventListener("input", function(e) {
  n = parseInt(e.target.value, 10);
  document.getElementById("nVal").textContent = String(n);
  draw();
  reportHeight();
});

document.getElementById("mode").addEventListener("change", function(e) {
  mode = e.target.value;
  draw();
});

// Apply URL params to controls before first draw.
document.getElementById("nSlider").value = String(n);
document.getElementById("nVal").textContent = String(n);
document.getElementById("mode").value = mode;
if (qpLock) {
  var modeRow = document.querySelector(".mode-row");
  if (modeRow) modeRow.style.display = "none";
}

draw();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
// KaTeX renders async (deferred script); the load event fires before the
// formulas have laid out their final size. ResizeObserver catches the
// post-render reflow so the iframe never opens with the bottom cut off.
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
}
</script>
</body>
</html>
