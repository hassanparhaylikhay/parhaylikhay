<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Polygon Angle Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:14px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls { display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:18px; text-align:right; color:#f0eeea; font-weight:600; }

  .mode-row { display:flex; align-items:center; gap:8px; }
  .mode-row .name { color:#fff067; font-weight:600; }
  .mode-row select { background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px; padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer; }
  .mode-row select:focus { border-color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .poly-side { stroke:#00abfa; stroke-width:2.5; fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .poly-vertex { fill:#fff067; }
  .interior-arc { fill:#0fee8920; stroke:#0fee89; stroke-width:1.5; }
  .exterior-arc { fill:#ff467020; stroke:#ff4670; stroke-width:1.5; }
  .ext-extension { stroke:#7a7875; stroke-width:1; stroke-dasharray:3 3; fill:none; }
  .interior-label { font-family:'Geist Mono',monospace; font-size:11px; fill:#0fee89; font-weight:600; }
  .exterior-label { font-family:'Geist Mono',monospace; font-size:11px; fill:#ff4670; font-weight:600; }

  .tally { margin-top:6px; font-family:'Geist Mono',monospace; font-size:11px; color:#c8c6be; text-align:center; padding:0 4px; word-break:break-word; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fSum"></span>
    <span class="formula" id="fInt"></span>
    <span class="formula" id="fExt"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">n</span>
      <input type="range" id="nSlider" min="3" max="12" value="5" step="1"/>
      <span class="val" id="nVal">5</span>
    </div>
    <div class="mode-row">
      <span class="name">show</span>
      <select id="mode">
        <option value="interior">interior angles</option>
        <option value="exterior">exterior angles</option>
        <option value="both" selected>both</option>
      </select>
    </div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <g id="extensions"></g>
    <g id="extArcs"></g>
    <g id="intArcs"></g>
    <polygon id="poly" class="poly-side"/>
    <g id="vertices"></g>
    <g id="intLabels"></g>
    <g id="extLabels"></g>
  </svg>

  <p class="tally" id="tally"></p>

  <p class="footer">drag n: from triangle (n=3) to dodecagon (n=12)</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var SVG_NS = "http://www.w3.org/2000/svg";
var CX = 240, CY = 165, R = 100;
var ARC_R_INT = 22;
var ARC_R_EXT = 18;
var LBL_R_INT = 50;
var LBL_R_EXT = 38;
var EXT_LEN = 30;

var targetN = 5;
var displayN = 5;
var mode = "both";
var SPRING = 0.18;

// Format number cleanly: no trailing .0, at most 1 decimal place
function fmt(v) {
  var rounded = Math.round(v * 10) / 10;
  if (Math.abs(rounded - Math.round(rounded)) < 1e-9) return String(Math.round(rounded));
  return rounded.toFixed(1);
}

// Vertex positions for a regular polygon with the given (possibly fractional) n.
// We use floor(n) integer vertices for drawing/labels, but the radius/positions
// are interpolated smoothly via displayN by holding n fixed at targetN once
// the slider settles. To keep counts consistent, we always render exactly
// targetN vertices and let displayN govern only the apparent scale/spacing.
function vertices(nInt, radius) {
  var pts = [];
  var step = 2 * Math.PI / nInt;
  var start = -Math.PI / 2;
  for (var i = 0; i < nInt; i++) {
    var theta = start + i * step;
    pts.push({
      x: CX + radius * Math.cos(theta),
      y: CY + radius * Math.sin(theta),
      theta: theta
    });
  }
  return pts;
}

// Build small SVG arc path between two unit directions about a vertex.
// dir1, dir2 are unit vectors (angles a1, a2 in radians). We draw an arc
// from a1 to a2 going the short way (signed sweep we control explicitly).
function arcPath(cx, cy, r, a1, a2, sweepFlag) {
  var x1 = cx + r * Math.cos(a1);
  var y1 = cy + r * Math.sin(a1);
  var x2 = cx + r * Math.cos(a2);
  var y2 = cy + r * Math.sin(a2);
  // delta needed to determine large-arc-flag; we always take the minor arc
  var delta = a2 - a1;
  while (delta > Math.PI) delta -= 2 * Math.PI;
  while (delta < -Math.PI) delta += 2 * Math.PI;
  var largeArc = 0;
  // Build the path: a pie-slice (filled wedge), since we want
  // a pie slice: M cx,cy L x1,y1 A r,r 0 largeArc,sweepFlag x2,y2 Z
  return "M " + cx + " " + cy +
         " L " + x1 + " " + y1 +
         " A " + r + " " + r + " 0 " + largeArc + " " + sweepFlag + " " + x2 + " " + y2 +
         " Z";
}

function clearChildren(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function makeEl(tag, attrs) {
  var el = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
  return el;
}

function tick() {
  displayN += (targetN - displayN) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  var n = targetN;
  var interior = (n - 2) * 180 / n;
  var exterior = 360 / n;
  var sumInterior = (n - 2) * 180;

  // Update KaTeX formulas
  tryRender(
    document.getElementById("fSum"),
    "\\text{Sum of interior} = (n-2) \\times 180\\degree = \\textcolor{#0fee89}{" + sumInterior + "\\degree}"
  );
  tryRender(
    document.getElementById("fInt"),
    "\\text{Each interior (regular)} = \\textcolor{#0fee89}{" + fmt(interior) + "\\degree}"
  );
  tryRender(
    document.getElementById("fExt"),
    "\\text{Each exterior} = \\frac{360\\degree}{n} = \\textcolor{#ff4670}{" + fmt(exterior) + "\\degree}"
  );

  // Spring the radius slightly so changes feel smooth even though we snap n
  // The vertices themselves are at integer n = targetN; we scale them by
  // a smoothing factor so the polygon "settles" after each n change.
  var snapDist = Math.abs(displayN - targetN);
  var settleScale = 1 - Math.min(0.06, snapDist * 0.05); // tiny breathing
  var radius = R * settleScale;

  var pts = vertices(n, radius);

  // Polygon outline
  var polyEl = document.getElementById("poly");
  var ptsAttr = pts.map(function(p) { return p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" ");
  polyEl.setAttribute("points", ptsAttr);

  // Vertices
  var vg = document.getElementById("vertices");
  clearChildren(vg);
  for (var i = 0; i < pts.length; i++) {
    vg.appendChild(makeEl("circle", {
      cx: pts[i].x, cy: pts[i].y, r: 4, class: "poly-vertex"
    }));
  }

  // Interior and exterior arcs/labels
  var intArcG = document.getElementById("intArcs");
  var extArcG = document.getElementById("extArcs");
  var extG = document.getElementById("extensions");
  var intLG = document.getElementById("intLabels");
  var extLG = document.getElementById("extLabels");
  clearChildren(intArcG);
  clearChildren(extArcG);
  clearChildren(extG);
  clearChildren(intLG);
  clearChildren(extLG);

  var showInterior = (mode === "interior" || mode === "both");
  var showExterior = (mode === "exterior" || mode === "both");

  for (var j = 0; j < n; j++) {
    var prev = pts[(j - 1 + n) % n];
    var cur  = pts[j];
    var next = pts[(j + 1) % n];

    // Direction vectors from vertex along each adjacent side
    var ax = prev.x - cur.x, ay = prev.y - cur.y;       // toward previous vertex
    var bx = next.x - cur.x, by = next.y - cur.y;       // toward next vertex
    var aLen = Math.hypot(ax, ay), bLen = Math.hypot(bx, by);
    var aNx = ax / aLen, aNy = ay / aLen;
    var bNx = bx / bLen, bNy = by / bLen;
    var aAng = Math.atan2(aNy, aNx);
    var bAng = Math.atan2(bNy, bNx);

    // Inward bisector direction (points into the polygon)
    var bisX = aNx + bNx;
    var bisY = aNy + bNy;
    var bisLen = Math.hypot(bisX, bisY);
    if (bisLen < 1e-6) { bisX = 0; bisY = 0; bisLen = 1; }
    var bisNx = bisX / bisLen, bisNy = bisY / bisLen;

    if (showInterior) {
      // Pie-slice arc from aAng to bAng, going the way that contains the bisector.
      // We pick the sweep flag that makes the arc lie on the inward side.
      // Try both sweeps and pick the one whose midpoint aligns with the bisector.
      var midA1 = midAngle(aAng, bAng, 0);
      var midA2 = midAngle(aAng, bAng, 1);
      var dot1 = Math.cos(midA1) * bisNx + Math.sin(midA1) * bisNy;
      var dot2 = Math.cos(midA2) * bisNx + Math.sin(midA2) * bisNy;
      var sweep = (dot1 > dot2) ? 0 : 1;
      var d = arcPath(cur.x, cur.y, ARC_R_INT, aAng, bAng, sweep);
      intArcG.appendChild(makeEl("path", { d: d, class: "interior-arc" }));

      // Interior label, placed along inward bisector
      var lx = cur.x + bisNx * LBL_R_INT;
      var ly = cur.y + bisNy * LBL_R_INT + 3;
      var lblI = makeEl("text", {
        x: lx.toFixed(2), y: ly.toFixed(2),
        "text-anchor": "middle",
        class: "interior-label"
      });
      lblI.textContent = fmt(interior) + "°";
      intLG.appendChild(lblI);
    }

    if (showExterior) {
      // Extend the previous side outward beyond the current vertex.
      // The extension goes from cur, in the direction OPPOSITE the previous vertex
      // (i.e. continuing the line prev -> cur past cur).
      var extDx = -aNx, extDy = -aNy;
      var ex = cur.x + extDx * EXT_LEN;
      var ey = cur.y + extDy * EXT_LEN;
      extG.appendChild(makeEl("line", {
        x1: cur.x, y1: cur.y, x2: ex.toFixed(2), y2: ey.toFixed(2),
        class: "ext-extension"
      }));

      // Exterior arc: between extension direction (extDx,extDy) and next-side direction (bNx,bNy),
      // sweeping the short way (the exterior angle is less than 180 for convex polygons).
      var extAng = Math.atan2(extDy, extDx);
      var nextAng = Math.atan2(bNy, bNx);
      // Pick sweep so the arc is the minor arc (always < 180 for convex regular polygon)
      var midE1 = midAngle(extAng, nextAng, 0);
      var midE2 = midAngle(extAng, nextAng, 1);
      // The exterior angle opens away from the polygon interior, i.e. along
      // OUTWARD bisector = -bisN. Pick the midpoint with greater dot to outward.
      var outX = -bisNx, outY = -bisNy;
      var dotE1 = Math.cos(midE1) * outX + Math.sin(midE1) * outY;
      var dotE2 = Math.cos(midE2) * outX + Math.sin(midE2) * outY;
      var sweepE = (dotE1 > dotE2) ? 0 : 1;
      var dE = arcPath(cur.x, cur.y, ARC_R_EXT, extAng, nextAng, sweepE);
      extArcG.appendChild(makeEl("path", { d: dE, class: "exterior-arc" }));

      // Exterior label, placed outward along outward bisector
      var lxE = cur.x + outX * LBL_R_EXT;
      var lyE = cur.y + outY * LBL_R_EXT + 3;
      var lblE = makeEl("text", {
        x: lxE.toFixed(2), y: lyE.toFixed(2),
        "text-anchor": "middle",
        class: "exterior-label"
      });
      lblE.textContent = fmt(exterior) + "°";
      extLG.appendChild(lblE);
    }
  }

  // Tally text below SVG
  var tallyEl = document.getElementById("tally");
  if (mode === "interior") {
    var parts = [];
    for (var k = 0; k < n; k++) parts.push(fmt(interior) + "°");
    tallyEl.innerHTML = "<span style=\"color:#0fee89\">Interior sum:</span> " +
      parts.join(" + ") + " = " + sumInterior + "°";
  } else if (mode === "exterior") {
    var partsE = [];
    for (var m = 0; m < n; m++) partsE.push(fmt(exterior) + "°");
    tallyEl.innerHTML = "<span style=\"color:#ff4670\">Exterior sum:</span> " +
      partsE.join(" + ") + " = 360°";
  } else {
    tallyEl.innerHTML =
      "<span style=\"color:#0fee89\">Interior sum:</span> " +
      n + " × " + fmt(interior) + "° = " + sumInterior + "°" +
      "  ·  " +
      "<span style=\"color:#ff4670\">Exterior sum:</span> " +
      n + " × " + fmt(exterior) + "° = 360°";
  }
}

// Given two angles a1, a2 (radians), return the midpoint angle of one of the
// two possible arcs between them. flag=0 picks the arc going counter-clockwise
// from a1 to a2, flag=1 picks the other.
function midAngle(a1, a2, flag) {
  var d = a2 - a1;
  while (d <= 0) d += 2 * Math.PI;
  // d is now in (0, 2pi]
  if (flag === 0) return a1 + d / 2;
  return a1 + d / 2 + Math.PI;
}

document.getElementById("nSlider").addEventListener("input", function(e) {
  targetN = parseInt(e.target.value, 10);
  document.getElementById("nVal").textContent = String(targetN);
  // nudge displayN slightly so the spring kicks in
  displayN = targetN + 0.5 * Math.sign(displayN - targetN || 1);
  reportHeight();
});

document.getElementById("mode").addEventListener("change", function(e) {
  mode = e.target.value;
});

tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
