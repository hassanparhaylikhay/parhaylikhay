<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cuboid Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:14.5px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls {
    display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .row { display:flex; align-items:center; gap:8px; min-width:170px; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] {
    flex:1; min-width:60px; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .row .val { min-width:30px; text-align:right; color:#f0eeea; font-weight:600; }

  .stage {
    width:100%; max-width:340px; margin:6px auto 0;
    aspect-ratio: 1.15; perspective: 800px; perspective-origin: 50% 38%;
    position:relative;
  }
  .cuboid {
    position:absolute; left:50%; top:50%;
    transform-style: preserve-3d;
    transform: translate(-50%, -50%) rotateX(-22deg) rotateY(-32deg);
    will-change: transform, width, height;
  }
  .face {
    position:absolute; inset:0;
    border: 1.5px solid #00abfa;
    background: rgba(0,171,250,0.10);
    transform-origin: 50% 50%;
  }
  /* Each face translates to ±half its perpendicular dimension. The
     perpendicular distance is set inline from JS because sliders change
     the cuboid extents. */
  .face.front  { background: rgba(0,171,250,0.12); }
  .face.back   { background: rgba(0,171,250,0.04); }
  .face.right  { background: rgba(255,240,103,0.08); border-color:#fff067; }
  .face.left   { background: rgba(255,240,103,0.04); border-color:#fff067; }
  .face.top    { background: rgba(15,238,137,0.10); border-color:#0fee89; }
  .face.bottom { background: rgba(15,238,137,0.04); border-color:#0fee89; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fV"></span>
    <span class="formula" id="fSA"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">l</span>
      <input type="range" id="lSlider" min="2" max="14" value="8" step="0.5"/>
      <span class="val" id="lVal">8</span>
    </div>
    <div class="row">
      <span class="name">w</span>
      <input type="range" id="wSlider" min="2" max="10" value="5" step="0.5"/>
      <span class="val" id="wVal">5</span>
    </div>
    <div class="row">
      <span class="name">h</span>
      <input type="range" id="hSlider" min="2" max="10" value="6" step="0.5"/>
      <span class="val" id="hVal">6</span>
    </div>
  </div>

  <div class="stage">
    <div class="cuboid" id="cuboid">
      <div class="face front"  id="ff"></div>
      <div class="face back"   id="fb"></div>
      <div class="face right"  id="fr"></div>
      <div class="face left"   id="fl"></div>
      <div class="face top"    id="ft"></div>
      <div class="face bottom" id="fbot"></div>
    </div>
  </div>

  <p class="footer">drag the sliders · the cuboid morphs in 3D · V and SA update live</p>
</div>

<script>
"use strict";

var SCALE = 9;       // px per cm of physical length
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005, rafScheduled = false;

function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var state = {
  params:  { l: 8,   w: 5,   h: 6 },
  display: { l: 8,   w: 5,   h: 6 }
};

function startSpring() { if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(springTick); } }
function springTick() {
  var moving = false;
  ["l","w","h"].forEach(function(k) {
    var d = state.params[k] - state.display[k];
    if (Math.abs(d) > SPRING_EPS) { state.display[k] += d * SPRING_FACTOR; moving = true; }
    else { state.display[k] = state.params[k]; }
  });
  render();
  if (moving) requestAnimationFrame(springTick);
  else rafScheduled = false;
}

var fV  = document.getElementById("fV");
var fSA = document.getElementById("fSA");
var cube = document.getElementById("cuboid");
var ff = document.getElementById("ff"), fb = document.getElementById("fb");
var fr = document.getElementById("fr"), fl = document.getElementById("fl");
var ft = document.getElementById("ft"), fbot = document.getElementById("fbot");

function render() {
  var l = state.display.l, w = state.display.w, h = state.display.h;
  var lp = l * SCALE, wp = w * SCALE, hp = h * SCALE;

  // The .cuboid container has zero size; it just provides a transform
  // origin for the assembly. Each face is placed by translate3d from
  // that origin then rotated to face outward.
  cube.style.width = "0";
  cube.style.height = "0";

  resetFace(ff,   lp, hp, [0,    0,     wp/2 ], [0,   0,   0]); // front
  resetFace(fb,   lp, hp, [0,    0,    -wp/2 ], [0, 180,   0]); // back
  resetFace(fr,   wp, hp, [ lp/2, 0,    0    ], [0,  90,   0]); // right
  resetFace(fl,   wp, hp, [-lp/2, 0,    0    ], [0, -90,   0]); // left
  resetFace(ft,   lp, wp, [0,   -hp/2,  0    ], [-90, 0,   0]); // top
  resetFace(fbot, lp, wp, [0,    hp/2,  0    ], [ 90, 0,   0]); // bottom

  // KaTeX formula bar
  var V  = l * w * h;
  var SA = 2 * (l*w + l*h + w*h);
  tryRender(fV,
    "{\\color{#0fee89}V} = l \\times w \\times h = " +
    fmtNum(l) + " \\times " + fmtNum(w) + " \\times " + fmtNum(h) +
    " = {\\color{#0fee89}" + fmtNum(V) + "}\\;\\text{cm}^{3}");
  tryRender(fSA,
    "{\\color{#fff067}\\text{SA}} = 2(lw + lh + wh) = " +
    "{\\color{#fff067}" + fmtNum(SA) + "}\\;\\text{cm}^{2}");
}

// Place a face: dims = (width, height); pos = [x,y,z] of CENTRE relative to cuboid centre;
// rot = [rotateX, rotateY, rotateZ] in degrees.
function resetFace(el, w, h, pos, rot) {
  el.style.width = w + "px";
  el.style.height = h + "px";
  el.style.left = "50%";
  el.style.top = "50%";
  el.style.transformOrigin = "50% 50%";
  el.style.transform =
    "translate(-50%, -50%) " +
    "translate3d(" + pos[0] + "px," + pos[1] + "px," + pos[2] + "px) " +
    "rotateX(" + rot[0] + "deg) rotateY(" + rot[1] + "deg) rotateZ(" + rot[2] + "deg)";
}

// Wire sliders
function bind(id, key, valEl) {
  var slider = document.getElementById(id);
  var val = document.getElementById(valEl);
  slider.addEventListener("input", function() {
    state.params[key] = parseFloat(slider.value);
    val.textContent = fmtNum(state.params[key]);
    startSpring();
  });
}
bind("lSlider", "l", "lVal");
bind("wSlider", "w", "wVal");
bind("hSlider", "h", "hVal");

render();

// Height reporter
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
