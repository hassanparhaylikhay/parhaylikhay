<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chart Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:16px 20px 18px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  .headline { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:8px 0 12px; padding:8px 8px; }
  .headline .col { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .headline .big { font-family:'Geist Mono',monospace; font-size:36px; font-weight:700; line-height:1; color:#fff067; min-width:80px; text-align:center; }
  .headline .lab { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.5px; text-transform:uppercase; }
  .headline .mode-toggle { display:flex; gap:0; border:1px solid #141e2a; border-radius:6px; overflow:hidden; align-self:center; }
  .headline .mode-toggle .opt { padding:8px 14px; font-family:'Geist Mono',monospace; font-size:10.5px; letter-spacing:0.5px; font-weight:600; color:#7a7875; cursor:pointer; background:#0b1118; transition: all 0.12s ease; }
  .headline .mode-toggle .opt.active { color:#fff067; background:rgba(255,240,103,0.06); }
  .headline .mode-toggle .opt:hover:not(.active) { color:#c8c6be; }

  #chart { display:block; width:100%; height:auto; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .cats { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:12px; }
  .cpill { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); }
  .cpill .lhs { display:flex; flex-direction:column; gap:2px; }
  .cpill .lab { font-family:'Geist Mono',monospace; font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase; font-weight:600; }
  .cpill .count { font-family:'Geist Mono',monospace; font-size:17px; font-weight:700; line-height:1; color:#f0eeea; }
  .cpill .btns { display:flex; gap:2px; }
  .cpill .btn { background:transparent; border:0; color:inherit; font-family:'Geist Mono',monospace; font-size:13px; font-weight:700; line-height:1; padding:4px 8px; border-radius:4px; cursor:pointer; opacity:0.5; transition: opacity 0.12s ease; }
  .cpill .btn:hover:not(:disabled) { opacity:1; }
  .cpill .btn:disabled { opacity:0.15; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">CHART · CHOOSE A VIEW</span>
    <span class="meta">use +/- to change category counts</span>
  </div>

  <div class="headline">
    <span class="col">
      <span class="big" id="total-val">15</span>
      <span class="lab">total</span>
    </span>
    <div class="mode-toggle">
      <div class="opt active" data-mode="bar">BAR</div>
      <div class="opt" data-mode="pie">PIE</div>
    </div>
  </div>

  <svg id="chart" viewBox="0 0 480 240" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-chart"></g>
    <g id="g-labels"></g>
  </svg>

  <div class="cats" id="cats"></div>
</div>

<script>
"use strict";

var COL = {
  blue:"#00abfa", pink:"#ff4670", yellow:"#fff067", green:"#0fee89",
  orange:"#ff822c", faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

var CATS = [
  { id:"a", label:"Red",    colour:"#ff4670" },
  { id:"b", label:"Blue",   colour:"#00abfa" },
  { id:"c", label:"Green",  colour:"#0fee89" },
  { id:"d", label:"Yellow", colour:"#fff067" }
];

var state = { a:5, b:3, c:4, d:3, mode: "bar" };
var MAX_PER = 12;

function total(){ var s = 0; CATS.forEach(function(c){ s += state[c.id]; }); return s; }

function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}
function svgKaTeXLabel(parent, x, y, tex, color, align, width){
  align = align || "center";
  width = width || 100;
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - width/2); fo.setAttribute("y", y - 11);
  fo.setAttribute("width", width); fo.setAttribute("height", 22);
  fo.style.overflow = "visible"; fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px"; div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host"; div.style.color = color || COL.off;
  fo.appendChild(div); parent.appendChild(fo);
  tryRender(div, tex);
}
function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function drawBar(){
  var g = document.getElementById("g-chart");
  var gl = document.getElementById("g-labels");
  clear(g); clear(gl);
  var pad_l = 36, pad_r = 12, pad_t = 14, pad_b = 32;
  var w = 480 - pad_l - pad_r, h = 240 - pad_t - pad_b;
  var maxVal = Math.max(MAX_PER, 5);  // y-axis goes to MAX_PER
  // y-axis
  var yax = document.createElementNS("http://www.w3.org/2000/svg","line");
  yax.setAttribute("x1", pad_l); yax.setAttribute("x2", pad_l);
  yax.setAttribute("y1", pad_t); yax.setAttribute("y2", pad_t + h);
  yax.setAttribute("stroke", "#3a4a5a"); yax.setAttribute("stroke-width", 1);
  g.appendChild(yax);
  // y-axis grid + labels at 0, 3, 6, 9, 12
  for (var v = 0; v <= maxVal; v += 3){
    var yy = pad_t + h - (v / maxVal) * h;
    var gl_ = document.createElementNS("http://www.w3.org/2000/svg","line");
    gl_.setAttribute("x1", pad_l); gl_.setAttribute("x2", pad_l + w);
    gl_.setAttribute("y1", yy); gl_.setAttribute("y2", yy);
    gl_.setAttribute("stroke", "#141e2a"); gl_.setAttribute("stroke-width", 0.6);
    g.appendChild(gl_);
    var t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", pad_l - 6); t.setAttribute("y", yy + 3);
    t.setAttribute("text-anchor", "end");
    t.setAttribute("fill", "#7a7875"); t.setAttribute("font-size", "10");
    t.setAttribute("font-family", "Geist Mono, monospace");
    t.textContent = v;
    g.appendChild(t);
  }
  // bars
  var bw = w / CATS.length;
  var pad = 14;
  CATS.forEach(function(c, i){
    var x = pad_l + i * bw + pad / 2;
    var bWidth = bw - pad;
    var val = state[c.id];
    var bh = (val / maxVal) * h;
    var by = pad_t + h - bh;
    var r = document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x", x); r.setAttribute("y", by);
    r.setAttribute("width", bWidth); r.setAttribute("height", bh);
    r.setAttribute("rx", 4);
    r.setAttribute("fill", c.colour);
    r.setAttribute("fill-opacity", "0.7");
    r.setAttribute("stroke", c.colour); r.setAttribute("stroke-width", 1.5);
    g.appendChild(r);
    // category label below bar
    var t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", x + bWidth / 2); t.setAttribute("y", pad_t + h + 18);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("fill", c.colour); t.setAttribute("font-size", "10.5");
    t.setAttribute("font-family", "Geist Mono, monospace");
    t.setAttribute("font-weight", "600");
    t.textContent = c.label;
    g.appendChild(t);
    // count label above bar
    if (val > 0){
      var tc = document.createElementNS("http://www.w3.org/2000/svg","text");
      tc.setAttribute("x", x + bWidth / 2); tc.setAttribute("y", by - 5);
      tc.setAttribute("text-anchor", "middle");
      tc.setAttribute("fill", c.colour); tc.setAttribute("font-size", "11");
      tc.setAttribute("font-family", "Geist Mono, monospace");
      tc.setAttribute("font-weight", "700");
      tc.textContent = val;
      g.appendChild(tc);
    }
  });
}

function drawPie(){
  var g = document.getElementById("g-chart");
  var gl = document.getElementById("g-labels");
  clear(g); clear(gl);
  var cx = 240, cy = 110, r = 88;
  var tot = total();
  if (tot === 0){
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r);
    c.setAttribute("fill", "#141e2a"); c.setAttribute("stroke", "#3a4a5a");
    g.appendChild(c);
    return;
  }
  var startAng = -90;  // start at top
  CATS.forEach(function(c){
    var v = state[c.id];
    if (v === 0) return;
    var sweep = (v / tot) * 360;
    var endAng = startAng + sweep;
    var p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", slicePath(cx, cy, r, startAng, endAng));
    p.setAttribute("fill", c.colour);
    p.setAttribute("fill-opacity", "0.78");
    p.setAttribute("stroke", "#0b1118"); p.setAttribute("stroke-width", 1.5);
    g.appendChild(p);
    // Slice label: angle in degrees if sweep is meaningful
    var midAng = (startAng + endAng) / 2;
    var rad = midAng * Math.PI / 180;
    var lx = cx + (r * 0.62) * Math.cos(rad);
    var ly = cy + (r * 0.62) * Math.sin(rad);
    if (sweep >= 22){
      var t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x", lx); t.setAttribute("y", ly);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("fill", "#0b1118");
      t.setAttribute("font-size", "11");
      t.setAttribute("font-family", "Geist Mono, monospace");
      t.setAttribute("font-weight", "700");
      t.textContent = sweep.toFixed(0) + "°";
      g.appendChild(t);
    }
    startAng = endAng;
  });
  // Legend on the right
  var legX = 360;
  CATS.forEach(function(c, i){
    var v = state[c.id];
    var legY = 36 + i * 28;
    var swatch = document.createElementNS("http://www.w3.org/2000/svg","rect");
    swatch.setAttribute("x", legX); swatch.setAttribute("y", legY - 7);
    swatch.setAttribute("width", 14); swatch.setAttribute("height", 14);
    swatch.setAttribute("rx", 3);
    swatch.setAttribute("fill", c.colour);
    g.appendChild(swatch);
    var t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", legX + 22); t.setAttribute("y", legY + 4);
    t.setAttribute("fill", c.colour); t.setAttribute("font-size", "10.5");
    t.setAttribute("font-family", "Geist Mono, monospace");
    t.setAttribute("font-weight", "600");
    t.textContent = c.label + " · " + v;
    g.appendChild(t);
  });
}

function slicePath(cx, cy, r, startDeg, endDeg){
  var s = startDeg * Math.PI / 180;
  var e = endDeg * Math.PI / 180;
  var x1 = cx + r * Math.cos(s), y1 = cy + r * Math.sin(s);
  var x2 = cx + r * Math.cos(e), y2 = cy + r * Math.sin(e);
  var large = (endDeg - startDeg) > 180 ? 1 : 0;
  if (Math.abs(endDeg - startDeg) >= 359.99){
    // Full circle case (shouldn't happen with multiple categories, but be safe)
    return "M " + (cx + r) + " " + cy +
      " A " + r + " " + r + " 0 1 1 " + (cx - r) + " " + cy +
      " A " + r + " " + r + " 0 1 1 " + (cx + r) + " " + cy + " Z";
  }
  return "M " + cx + " " + cy +
         " L " + x1.toFixed(2) + " " + y1.toFixed(2) +
         " A " + r + " " + r + " 0 " + large + " 1 " + x2.toFixed(2) + " " + y2.toFixed(2) +
         " Z";
}

function buildCats(){
  var host = document.getElementById("cats");
  host.innerHTML = "";
  CATS.forEach(function(c){
    var pill = document.createElement("div");
    pill.className = "cpill";
    pill.style.color = c.colour;
    pill.innerHTML =
      '<span class="lhs">' +
        '<span class="lab" style="color:' + c.colour + '">' + c.label + '</span>' +
        '<span class="count">' + state[c.id] + '</span>' +
      '</span>' +
      '<span class="btns">' +
        '<button class="btn" data-c="' + c.id + '" data-act="minus">−</button>' +
        '<button class="btn" data-c="' + c.id + '" data-act="plus">+</button>' +
      '</span>';
    host.appendChild(pill);
  });
  host.querySelectorAll(".btn").forEach(function(b){
    b.addEventListener("click", function(){
      var c = b.dataset.c;
      if (b.dataset.act === "plus"){
        if (state[c] < MAX_PER){ state[c]++; render(); }
      } else {
        if (state[c] > 0){ state[c]--; render(); }
      }
    });
  });
}

function render(){
  document.getElementById("total-val").textContent = total();
  if (state.mode === "bar") drawBar();
  else drawPie();
  buildCats();
  notifyHeight();
}

document.querySelectorAll(".mode-toggle .opt").forEach(function(o){
  o.addEventListener("click", function(){
    document.querySelectorAll(".mode-toggle .opt").forEach(function(x){ x.classList.remove("active"); });
    o.classList.add("active");
    state.mode = o.dataset.mode;
    render();
  });
});

// URL param for mode lock
(function(){
  var p = new URLSearchParams(window.location.search);
  var m = p.get("mode");
  if (m === "bar" || m === "pie"){
    state.mode = m;
    document.querySelectorAll(".mode-toggle .opt").forEach(function(x){
      x.classList.toggle("active", x.dataset.mode === m);
    });
  }
})();

function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

render();
setTimeout(notifyHeight, 200);
</script>
</body>
</html>
