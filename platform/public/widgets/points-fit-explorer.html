<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Points & Fit Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding:14px 18px 16px; overflow-x:hidden; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:18px 20px 20px; }

  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title {
    font-family:'Geist Mono',monospace; font-size:11px;
    letter-spacing:1.6px; text-transform:uppercase; color:#fff067; font-weight:600;
  }
  .counter { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; }

  .hint {
    font-family:'Geist Mono',monospace; font-size:10.5px; color:#3a4a5a;
    text-align:center; margin-bottom:14px; letter-spacing:0.5px;
  }

  .graph-wrap { position:relative; }
  svg { display:block; width:100%; height:auto; user-select:none; touch-action:none; }
  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; }
  .grid-line.minor { stroke:#141e2a; stroke-dasharray: 2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#3a4a5a; }
  .pt-mark line { stroke:#fff067; stroke-width:1.8; stroke-linecap:round; }
  .pt-mark { cursor:pointer; }
  .pt-mark:hover line { stroke:#ff4670; }
  .fit-curve { fill:none; stroke:#0fee89; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #clickArea { cursor:crosshair; }

  /* Fit picker */
  .fit-row {
    display:flex; gap:6px; flex-wrap:wrap; margin-top:14px;
    padding:10px 12px; background:#07090d; border:1px solid #141e2a; border-radius:8px;
    align-items:center;
  }
  .fit-row .lbl {
    font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875;
    letter-spacing:1px; text-transform:uppercase; margin-right:4px;
  }
  .fit-pill {
    background:transparent; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:600;
    padding:6px 10px; border-radius:14px; cursor:pointer;
    letter-spacing:0.4px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .fit-pill:hover { color:#0fee89; border-color:#3a4a5a; }
  .fit-pill.active { color:#0fee89; border-color:#0fee89; background:rgba(15,238,137,0.08); }

  /* Equation readout */
  .eqn-row {
    margin-top:10px; padding:10px 14px;
    background:#0a1a14; border:1px solid rgba(15,238,137,0.18); border-radius:6px;
    display:flex; flex-direction:column; gap:3px; min-height:46px;
    justify-content:center;
  }
  .eqn-row .formula {
    font-family:'Geist Mono',monospace; font-size:14px; color:#0fee89;
    font-weight:600; word-break:break-word;
  }
  .eqn-row .stat {
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
  }
  .eqn-row.warn { background:#1a1a0e; border-color:rgba(255,240,103,0.2); }
  .eqn-row.warn .formula { color:#fff067; }
  .eqn-row.idle { background:#07090d; border-color:#141e2a; }
  .eqn-row.idle .formula { color:#7a7875; }

  /* Points table */
  .points-section { margin-top:14px; }
  .sec-hdr {
    font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875;
    letter-spacing:1.6px; text-transform:uppercase; margin-bottom:8px;
  }
  .table {
    background:#07090d; border:1px solid #141e2a; border-radius:8px;
    padding:8px 12px;
  }
  .row {
    display:grid; grid-template-columns: 26px 1fr 1fr 28px;
    gap:8px; align-items:center; padding:4px 0;
  }
  .row.head {
    font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875;
    letter-spacing:0.4px; padding:2px 0 6px; border-bottom:1px solid #141e2a; margin-bottom:4px;
  }
  .row.head span { padding-left:10px; }
  .row .idx {
    font-family:'Geist Mono',monospace; font-size:11px; color:#3a4a5a;
    text-align:right;
  }
  .row input {
    appearance:none; -webkit-appearance:none; -moz-appearance:textfield;
    background:#0b1118; border:1px solid #141e2a; border-radius:5px;
    color:#f0eeea; font-family:'Geist Mono',monospace; font-size:13px;
    padding:5px 8px; outline:none; width:100%;
    transition: border-color 0.12s;
  }
  .row input::-webkit-outer-spin-button,
  .row input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .row input:focus { border-color:#00abfa; }
  .row input.invalid { border-color:#ff4670; }
  .row .del {
    background:transparent; border:0; color:#3a4a5a; cursor:pointer;
    font-family:'Geist Mono',monospace; font-size:14px;
    padding:2px 6px; border-radius:4px;
    transition: color 0.12s;
  }
  .row .del:hover { color:#ff4670; }
  .empty-tbl {
    text-align:center; padding:14px 8px;
    font-family:'Geist Mono',monospace; font-size:11px; color:#3a4a5a;
    letter-spacing:0.4px;
  }
  .table-actions {
    display:flex; gap:14px; padding-top:8px; align-items:center;
  }
  .table-actions button {
    background:transparent; border:0; cursor:pointer;
    font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:600;
    padding:6px 0; letter-spacing:0.4px;
    transition: color 0.12s;
  }
  .table-actions .add { color:#00abfa; }
  .table-actions .add:hover { color:#fff067; }
  .table-actions .clear { color:#7a7875; margin-left:auto; }
  .table-actions .clear:hover { color:#ff4670; }

  .footer {
    margin-top:14px; font-family:'Geist Mono',monospace; font-size:10px;
    color:#3a4a5a; text-align:center; letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="title">POINTS &amp; FIT</span>
    <span class="counter" id="counter">0 points</span>
  </div>
  <p class="hint">tap the grid to add a point · click a point to remove it · or type values below</p>

  <div class="graph-wrap" id="graphWrap">
    <svg id="svg" viewBox="0 0 720 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="plot-clip">
          <rect x="30" y="14" width="660" height="360"/>
        </clipPath>
      </defs>
      <g id="grid"></g>
      <line class="axis-line" id="xAxis"/>
      <line class="axis-line" id="yAxis"/>
      <g id="ticks"></g>
      <text class="axis-title" x="700" y="392" text-anchor="end">x</text>
      <text class="axis-title" x="24" y="22" text-anchor="end">y</text>
      <g id="fitLayer" clip-path="url(#plot-clip)"></g>
      <rect id="clickArea" x="30" y="14" width="660" height="360" fill="transparent"/>
      <g id="ptLayer"></g>
    </svg>
  </div>

  <div class="fit-row" id="fitRow">
    <span class="lbl">FIT</span>
    <button class="fit-pill active" data-fit="smooth">smooth</button>
    <button class="fit-pill" data-fit="linear">linear</button>
    <button class="fit-pill" data-fit="quadratic">quadratic</button>
    <button class="fit-pill" data-fit="cubic">cubic</button>
    <button class="fit-pill" data-fit="exp">exponential</button>
    <button class="fit-pill" data-fit="recip">reciprocal</button>
    <button class="fit-pill" data-fit="none">none</button>
  </div>

  <div class="eqn-row idle" id="eqnRow">
    <div class="formula" id="formula">add some points</div>
    <div class="stat" id="stat"></div>
  </div>

  <div class="points-section">
    <div class="sec-hdr">POINTS</div>
    <div class="table" id="pointsTable">
      <div class="row head"><span></span><span>x</span><span>y</span><span></span></div>
      <div id="pointRows"></div>
      <div class="table-actions">
        <button class="add" id="addBtn">+ add point</button>
        <button class="clear" id="clearBtn">clear all</button>
      </div>
    </div>
  </div>

  <p class="footer">tap grid · type values · pick a fit · green curve = best fit</p>
</div>

<script>
"use strict";

// ===== Constants ========================================================
var SVG_W = 720, SVG_H = 400;
var PLOT = { x: 30, y: 14, w: 660, h: 360 };
var XMIN = -11, XMAX = 11, YMIN = -6, YMAX = 6;
var SNAP_STEP = 0.5;

function xPx(x) { return PLOT.x + (x - XMIN) / (XMAX - XMIN) * PLOT.w; }
function yPx(y) { return PLOT.y + (1 - (y - YMIN) / (YMAX - YMIN)) * PLOT.h; }
function pxX(px) { return XMIN + (px - PLOT.x) / PLOT.w * (XMAX - XMIN); }
function pxY(py) { return YMIN + (1 - (py - PLOT.y) / PLOT.h) * (YMAX - YMIN); }

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}

function signedTerm(coef, varStr) {
  // " + 2.5x" or " − 3x" or "" if zero
  var v = Math.round(coef * 100) / 100;
  if (v === 0) return "";
  var sign = v < 0 ? " − " : " + ";
  var mag = Math.abs(v);
  var magStr = (mag === 1 && varStr) ? "" : fmtNum(mag);
  return sign + magStr + varStr;
}

function leadingTerm(coef, varStr) {
  var v = Math.round(coef * 100) / 100;
  if (v === 0) return "0";
  var sign = v < 0 ? "−" : "";
  var mag = Math.abs(v);
  var magStr = (mag === 1 && varStr) ? "" : fmtNum(mag);
  return sign + magStr + varStr;
}

// ===== Range helpers ===================================================
// Aspect of the plot region (px). Both axes share the same px/unit, so
// xrange : yrange must always equal this ratio.
var ASPECT_RATIO = PLOT.w / PLOT.h;  // 660/360 = 11/6

function tickStep(halfRange) {
  if (halfRange <= 12) return 2;
  if (halfRange <= 25) return 5;
  if (halfRange <= 60) return 10;
  return 20;
}

// Recompute XMIN/XMAX/YMIN/YMAX so all current points fit (with a small
// buffer) AND the aspect stays locked so grid cells remain square. Never
// shrinks below the default frame.
var DEFAULT_X_HALF = 11, DEFAULT_Y_HALF = 6;

function expandRangeToFit() {
  var xMaxAbs = DEFAULT_X_HALF;
  var yMaxAbs = DEFAULT_Y_HALF;
  for (var i = 0; i < STATE.points.length; i++) {
    var p = STATE.points[i];
    if (!isFinite(p.x) || !isFinite(p.y)) continue;
    if (Math.abs(p.x) + 1 > xMaxAbs) xMaxAbs = Math.abs(p.x) + 1;
    if (Math.abs(p.y) + 1 > yMaxAbs) yMaxAbs = Math.abs(p.y) + 1;
  }
  // Lock aspect: take whichever demand is larger and let the other axis
  // follow. Then snap x up to its tick step so the label nearest the edge
  // sits on a clean number.
  var xHalf = Math.max(xMaxAbs, yMaxAbs * ASPECT_RATIO);
  var step  = tickStep(xHalf);
  xHalf = Math.ceil(xHalf / step) * step;
  var yHalf = xHalf / ASPECT_RATIO;
  XMIN = -xHalf; XMAX = xHalf;
  YMIN = -yHalf; YMAX = yHalf;
}

function rebuildAxes() {
  var grid  = document.getElementById("grid");
  var ticks = document.getElementById("ticks");
  grid.innerHTML = ""; ticks.innerHTML = "";

  var xAxis = document.getElementById("xAxis");
  var yAxis = document.getElementById("yAxis");
  xAxis.setAttribute("x1", PLOT.x); xAxis.setAttribute("x2", PLOT.x + PLOT.w);
  xAxis.setAttribute("y1", yPx(0)); xAxis.setAttribute("y2", yPx(0));
  yAxis.setAttribute("x1", xPx(0)); yAxis.setAttribute("x2", xPx(0));
  yAxis.setAttribute("y1", PLOT.y); yAxis.setAttribute("y2", PLOT.y + PLOT.h);

  var xHalf = (XMAX - XMIN) / 2, yHalf = (YMAX - YMIN) / 2;
  var xStep = tickStep(xHalf), yStep = tickStep(yHalf);

  for (var x = Math.ceil(XMIN / xStep) * xStep; x <= XMAX + 1e-9; x += xStep) {
    if (Math.abs(x) < 1e-9) continue;
    var px = xPx(x);
    grid.appendChild(svgEl("line", {
      "class": "grid-line" + (Math.abs(x) % (xStep * 5) < 1e-6 ? "" : " minor"),
      x1: px, x2: px, y1: PLOT.y, y2: PLOT.y + PLOT.h
    }));
    var t = svgEl("text", {
      "class": "axis-tick-label",
      x: px, y: yPx(0) + 14, "text-anchor": "middle"
    });
    t.textContent = parseFloat(x.toFixed(2));
    ticks.appendChild(t);
  }
  for (var y = Math.ceil(YMIN / yStep) * yStep; y <= YMAX + 1e-9; y += yStep) {
    if (Math.abs(y) < 1e-9) continue;
    var py = yPx(y);
    grid.appendChild(svgEl("line", {
      "class": "grid-line" + (Math.abs(y) % (yStep * 5) < 1e-6 ? "" : " minor"),
      x1: PLOT.x, x2: PLOT.x + PLOT.w, y1: py, y2: py
    }));
    var ty = svgEl("text", {
      "class": "axis-tick-label",
      x: xPx(0) - 6, y: py + 3, "text-anchor": "end"
    });
    ty.textContent = parseFloat(y.toFixed(2));
    ticks.appendChild(ty);
  }
}

// ===== Fits =============================================================
function fitLinear(points) {
  var N = points.length;
  if (N < 2) return null;
  var sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (var i = 0; i < N; i++) {
    sx += points[i].x; sy += points[i].y;
    sxy += points[i].x * points[i].y;
    sxx += points[i].x * points[i].x;
  }
  var det = N * sxx - sx * sx;
  if (Math.abs(det) < 1e-12) return null;
  var m = (N * sxy - sx * sy) / det;
  var c = (sy - m * sx) / N;
  return {
    fn: function(x) { return m * x + c; },
    eqn: "y = " + leadingTerm(m, "x") + signedTerm(c, ""),
    coefs: { m: m, c: c }
  };
}

function solveLinearSystem(A, b) {
  var n = A.length;
  var M = [];
  for (var i = 0; i < n; i++) {
    M.push(A[i].slice());
    M[i].push(b[i]);
  }
  for (var k = 0; k < n; k++) {
    var maxRow = k;
    for (var r = k + 1; r < n; r++) {
      if (Math.abs(M[r][k]) > Math.abs(M[maxRow][k])) maxRow = r;
    }
    if (Math.abs(M[maxRow][k]) < 1e-12) return null;
    var tmp = M[k]; M[k] = M[maxRow]; M[maxRow] = tmp;
    for (var r2 = k + 1; r2 < n; r2++) {
      var factor = M[r2][k] / M[k][k];
      for (var c = k; c <= n; c++) M[r2][c] -= factor * M[k][c];
    }
  }
  var x = new Array(n);
  for (var i2 = n - 1; i2 >= 0; i2--) {
    var s = M[i2][n];
    for (var j = i2 + 1; j < n; j++) s -= M[i2][j] * x[j];
    x[i2] = s / M[i2][i2];
  }
  return x;
}

function fitPolynomial(points, degree) {
  var N = points.length;
  if (N < degree + 1) return null;
  var d = degree;
  var sums = []; for (var k = 0; k <= 2 * d; k++) sums.push(0);
  var sumsxy = []; for (var k2 = 0; k2 <= d; k2++) sumsxy.push(0);
  for (var i = 0; i < N; i++) {
    var xi = points[i].x, yi = points[i].y;
    var xpow = 1;
    for (var kk = 0; kk <= 2 * d; kk++) {
      sums[kk] += xpow;
      if (kk <= d) sumsxy[kk] += xpow * yi;
      xpow *= xi;
    }
  }
  var A = [];
  for (var ii = 0; ii <= d; ii++) {
    var row = [];
    for (var jj = 0; jj <= d; jj++) row.push(sums[ii + jj]);
    A.push(row);
  }
  return solveLinearSystem(A, sumsxy.slice());
}

function fitQuadratic(points) {
  var c = fitPolynomial(points, 2);
  if (!c) return null;
  var a = c[2], b = c[1], cc = c[0];
  return {
    fn: function(x) { return a*x*x + b*x + cc; },
    eqn: "y = " + leadingTerm(a, "x²") + signedTerm(b, "x") + signedTerm(cc, ""),
    coefs: { a: a, b: b, c: cc }
  };
}

function fitCubic(points) {
  var c = fitPolynomial(points, 3);
  if (!c) return null;
  var a = c[3], b = c[2], cc = c[1], d = c[0];
  return {
    fn: function(x) { return a*x*x*x + b*x*x + cc*x + d; },
    eqn: "y = " + leadingTerm(a, "x³") + signedTerm(b, "x²") + signedTerm(cc, "x") + signedTerm(d, ""),
    coefs: { a: a, b: b, c: cc, d: d }
  };
}

function fitExponential(points) {
  var pos = points.filter(function(p) { return p.y > 0; });
  if (pos.length < 2) return null;
  var loged = pos.map(function(p) { return { x: p.x, y: Math.log(p.y) }; });
  var lin = fitLinear(loged);
  if (!lin) return null;
  var a = Math.exp(lin.coefs.c);
  var r = Math.exp(lin.coefs.m);
  if (!isFinite(a) || !isFinite(r) || r <= 0) return null;
  return {
    fn: function(x) { return a * Math.pow(r, x); },
    eqn: "y = " + fmtNum(a) + " × " + fmtNum(r) + "^x",
    coefs: { a: a, r: r }
  };
}

function fitReciprocal(points) {
  var ok = points.filter(function(p) { return Math.abs(p.x) > 1e-9; });
  if (ok.length < 2) return null;
  var trans = ok.map(function(p) { return { x: 1/p.x, y: p.y }; });
  var lin = fitLinear(trans);
  if (!lin) return null;
  var a = lin.coefs.m, b = lin.coefs.c;
  return {
    fn: function(x) { return a/x + b; },
    eqn: "y = " + fmtNum(a) + " / x" + signedTerm(b, ""),
    coefs: { a: a, b: b }
  };
}

// Catmull-Rom smooth path through sorted points
function smoothPath(points) {
  if (points.length < 2) return null;
  var P = points.slice().sort(function(a, b) { return a.x - b.x; });
  var d = "M" + xPx(P[0].x).toFixed(1) + " " + yPx(P[0].y).toFixed(1);
  for (var i = 0; i < P.length - 1; i++) {
    var p0 = P[Math.max(0, i - 1)];
    var p1 = P[i];
    var p2 = P[i + 1];
    var p3 = P[Math.min(P.length - 1, i + 2)];
    var c1x = p1.x + (p2.x - p0.x) / 6;
    var c1y = p1.y + (p2.y - p0.y) / 6;
    var c2x = p2.x - (p3.x - p1.x) / 6;
    var c2y = p2.y - (p3.y - p1.y) / 6;
    d += " C" + xPx(c1x).toFixed(1) + " " + yPx(c1y).toFixed(1) +
         " " + xPx(c2x).toFixed(1) + " " + yPx(c2y).toFixed(1) +
         " " + xPx(p2.x).toFixed(1) + " " + yPx(p2.y).toFixed(1);
  }
  return d;
}

function rSquared(points, fn) {
  if (points.length < 2) return null;
  var meanY = 0;
  for (var i = 0; i < points.length; i++) meanY += points[i].y;
  meanY /= points.length;
  var ssTot = 0, ssRes = 0;
  for (var j = 0; j < points.length; j++) {
    var p = points[j];
    var pred = fn(p.x);
    if (!isFinite(pred)) return null;
    ssRes += (p.y - pred) * (p.y - pred);
    ssTot += (p.y - meanY) * (p.y - meanY);
  }
  if (ssTot < 1e-12) return null;
  return 1 - ssRes / ssTot;
}

// ===== State ============================================================
var STATE = {
  points: [],
  fit: "smooth",
  nextId: 1
};

// ===== Render ===========================================================
var fitLayer  = document.getElementById("fitLayer");
var ptLayer   = document.getElementById("ptLayer");
var counterEl = document.getElementById("counter");
var formulaEl = document.getElementById("formula");
var statEl    = document.getElementById("stat");
var eqnRow    = document.getElementById("eqnRow");
var pointRows = document.getElementById("pointRows");
var svg       = document.getElementById("svg");

function renderPoints() {
  ptLayer.innerHTML = "";
  for (var i = 0; i < STATE.points.length; i++) {
    var p = STATE.points[i];
    if (!isFinite(p.x) || !isFinite(p.y)) continue;
    var px = xPx(p.x), py = yPx(p.y);
    if (px < PLOT.x - 8 || px > PLOT.x + PLOT.w + 8) continue;
    if (py < PLOT.y - 8 || py > PLOT.y + PLOT.h + 8) continue;
    var size = 5;
    var g = svgEl("g", { "class": "pt-mark", "data-id": String(p.id) });
    g.appendChild(svgEl("line", { x1: px - size, y1: py - size, x2: px + size, y2: py + size }));
    g.appendChild(svgEl("line", { x1: px - size, y1: py + size, x2: px + size, y2: py - size }));
    (function(id) {
      g.addEventListener("click", function(e) { e.stopPropagation(); deletePoint(id); });
    })(p.id);
    ptLayer.appendChild(g);
  }
}

function renderCounter() {
  var n = STATE.points.length;
  counterEl.textContent = n + " point" + (n === 1 ? "" : "s");
}

function renderFit() {
  fitLayer.innerHTML = "";
  if (STATE.fit === "none") {
    formulaEl.textContent = STATE.points.length === 0 ? "add some points" : "no fit selected";
    statEl.textContent = "";
    eqnRow.className = "eqn-row idle";
    return;
  }
  if (STATE.points.length === 0) {
    formulaEl.textContent = "add some points";
    statEl.textContent = "";
    eqnRow.className = "eqn-row idle";
    return;
  }

  if (STATE.fit === "smooth") {
    var d = smoothPath(STATE.points);
    if (d) {
      fitLayer.appendChild(svgEl("path", { "class": "fit-curve", d: d }));
      formulaEl.textContent = "smooth curve through " + STATE.points.length + " point" + (STATE.points.length === 1 ? "" : "s");
      statEl.textContent = "Catmull-Rom interpolation · use this when the question says \"draw a smooth curve\"";
      eqnRow.className = "eqn-row";
    } else {
      formulaEl.textContent = "need at least 2 points";
      statEl.textContent = "";
      eqnRow.className = "eqn-row warn";
    }
    return;
  }

  var result = null, minN = 2, hint = "";
  switch (STATE.fit) {
    case "linear":    result = fitLinear(STATE.points);     minN = 2; break;
    case "quadratic": result = fitQuadratic(STATE.points);  minN = 3; break;
    case "cubic":     result = fitCubic(STATE.points);      minN = 4; break;
    case "exp":       result = fitExponential(STATE.points); minN = 2; hint = "positive-y "; break;
    case "recip":     result = fitReciprocal(STATE.points); minN = 2; hint = "non-zero-x "; break;
  }

  if (!result) {
    formulaEl.textContent = "need at least " + minN + " " + hint + "point" + (minN === 1 ? "" : "s");
    statEl.textContent = "";
    eqnRow.className = "eqn-row warn";
    return;
  }

  // Render the fit curve
  var pathD = "";
  var prevValid = false;
  var SAMPLES = 720;
  for (var i = 0; i <= SAMPLES; i++) {
    var x = XMIN + (XMAX - XMIN) * i / SAMPLES;
    var y;
    try { y = result.fn(x); } catch (e) { prevValid = false; continue; }
    if (!isFinite(y) || y < YMIN - 12 || y > YMAX + 12) { prevValid = false; continue; }
    pathD += (prevValid ? "L" : "M") + xPx(x).toFixed(1) + " " + yPx(y).toFixed(1) + " ";
    prevValid = true;
  }
  if (pathD) fitLayer.appendChild(svgEl("path", { "class": "fit-curve", d: pathD }));

  formulaEl.textContent = result.eqn;
  var r2 = rSquared(STATE.points, result.fn);
  statEl.textContent = r2 != null ? "R² = " + fmtNum(r2) + " · 1.00 = perfect fit" : "";
  eqnRow.className = "eqn-row";
}

function renderTable() {
  pointRows.innerHTML = "";
  if (STATE.points.length === 0) {
    var empty = document.createElement("div");
    empty.className = "empty-tbl";
    empty.textContent = "no points yet — tap the grid or use \"+ add point\"";
    pointRows.appendChild(empty);
    return;
  }
  for (var i = 0; i < STATE.points.length; i++) {
    var p = STATE.points[i];
    var row = document.createElement("div");
    row.className = "row";
    var idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = (i + 1) + ".";
    var inX = document.createElement("input");
    inX.type = "number"; inX.step = "any"; inX.value = p.x;
    var inY = document.createElement("input");
    inY.type = "number"; inY.step = "any"; inY.value = p.y;
    var del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.title = "delete";
    (function(point, ix, iy, db) {
      ix.addEventListener("input", function() {
        var v = parseFloat(ix.value);
        if (isFinite(v)) { point.x = v; ix.classList.remove("invalid"); rerenderGraph(); }
        else { ix.classList.add("invalid"); }
      });
      iy.addEventListener("input", function() {
        var v = parseFloat(iy.value);
        if (isFinite(v)) { point.y = v; iy.classList.remove("invalid"); rerenderGraph(); }
        else { iy.classList.add("invalid"); }
      });
      db.addEventListener("click", function() { deletePoint(point.id); });
    })(p, inX, inY, del);
    row.appendChild(idx); row.appendChild(inX); row.appendChild(inY); row.appendChild(del);
    pointRows.appendChild(row);
  }
}

function rerenderAll() {
  expandRangeToFit();
  rebuildAxes();
  renderPoints();
  renderCounter();
  renderFit();
  renderTable();
  reportHeight();
}

function rerenderGraph() {
  expandRangeToFit();
  rebuildAxes();
  renderPoints();
  renderCounter();
  renderFit();
}

// ===== Mutations ========================================================
function snap(v) { return Math.round(v / SNAP_STEP) * SNAP_STEP; }

function addPoint(x, y) {
  STATE.points.push({ id: STATE.nextId++, x: x, y: y });
  rerenderAll();
}

function deletePoint(id) {
  STATE.points = STATE.points.filter(function(p) { return p.id !== id; });
  rerenderAll();
}

function clearAll() {
  STATE.points = [];
  rerenderAll();
}

// ===== Interactions =====================================================
var clickArea = document.getElementById("clickArea");
clickArea.addEventListener("click", function(e) {
  var rect = svg.getBoundingClientRect();
  var sx = (e.clientX - rect.left) / rect.width * SVG_W;
  var sy = (e.clientY - rect.top)  / rect.height * SVG_H;
  if (sx < PLOT.x || sx > PLOT.x + PLOT.w || sy < PLOT.y || sy > PLOT.y + PLOT.h) return;
  var x = snap(pxX(sx)), y = snap(pxY(sy));
  // Avoid stacking duplicates
  if (STATE.points.some(function(p) { return p.x === x && p.y === y; })) return;
  addPoint(x, y);
});

document.getElementById("fitRow").addEventListener("click", function(e) {
  var btn = e.target.closest(".fit-pill[data-fit]");
  if (!btn) return;
  STATE.fit = btn.dataset.fit;
  document.querySelectorAll(".fit-pill").forEach(function(b) {
    b.classList.toggle("active", b === btn);
  });
  renderFit();
});

document.getElementById("addBtn").addEventListener("click", function() {
  // Pick a tidy default x: smallest free integer in [-5, 5]
  var taken = {};
  STATE.points.forEach(function(p) { taken[p.x] = true; });
  var x = 0;
  for (var i = 0; i <= 10; i++) {
    if (!taken[i]) { x = i; break; }
    if (!taken[-i]) { x = -i; break; }
  }
  addPoint(x, 0);
});
document.getElementById("clearBtn").addEventListener("click", clearAll);

// ===== Initial state — quadratic-ish sample ============================
[{x: -3, y: 5}, {x: -1, y: -1}, {x: 1, y: -1}, {x: 3, y: 5}].forEach(function(p) {
  STATE.points.push({ id: STATE.nextId++, x: p.x, y: p.y });
});
rerenderAll();

// ===== Height reporter ==================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
