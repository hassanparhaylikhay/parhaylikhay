<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Circle Theorems Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:24px; padding:0 4px; text-align:center; }
  .formula { font-size:15px; color:#f0eeea; line-height:1.5; }
  .formula .katex { font-size:1em; }

  .controls { display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .controls .name { color:#fff067; font-weight:600; }
  select.mode {
    flex:1;
    appearance:none; -webkit-appearance:none;
    background:#141e2a; color:#f0eeea;
    border:1px solid #3a4a5a; border-radius:6px;
    padding:6px 10px;
    font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:500;
    cursor:pointer; outline:none;
  }
  select.mode:focus { border-color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; touch-action:none; }

  .circle-stroke { stroke:#3a4a5a; stroke-width:1.5; fill:none; }
  .chord { stroke:#00abfa; stroke-width:2; fill:none; stroke-linecap:round; }
  .chord-faded { stroke:#7a7875; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-dasharray:4 4; }
  .tangent { stroke:#7a7875; stroke-width:1.5; fill:none; stroke-linecap:round; }

  .arc-yellow { stroke:#fff067; stroke-width:2; fill:none; }
  .arc-green { stroke:#0fee89; stroke-width:2; fill:none; }
  .arc-pink  { stroke:#ff4670; stroke-width:2; fill:none; }
  .right-marker { stroke:#ff4670; stroke-width:2; fill:none; }

  .lbl { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; }
  .lbl-yellow { fill:#fff067; }
  .lbl-green  { fill:#0fee89; }
  .lbl-pink   { fill:#ff4670; }

  .pt-fixed { fill:#7a7875; }
  .pt-fixed-label { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; fill:#c8c6be; }
  .pt-centre { fill:#7a7875; }
  .pt-centre-label { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; fill:#7a7875; }

  .pt-drag { fill:#fff067; cursor:grab; }
  .pt-drag.grabbing { cursor:grabbing; }
  .pt-drag-glow { fill:rgba(255,240,103,0.18); pointer-events:none; }
  .pt-drag-label { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; fill:#0b1118; pointer-events:none; }

  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <span class="name">mode</span>
    <select class="mode" id="mode">
      <option value="semicircle">Angle in semicircle = 90 deg</option>
      <option value="centre">Angle at centre = 2 x angle at circumference</option>
      <option value="segment">Angles in same segment are equal</option>
      <option value="cyclic">Cyclic quadrilateral: opposite angles sum to 180 deg</option>
      <option value="alternate">Alternate segment theorem</option>
      <option value="tangent">Tangent perpendicular to radius</option>
    </select>
  </div>

  <svg viewBox="0 0 480 340" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <circle id="mainCircle" class="circle-stroke" cx="240" cy="170" r="130"/>
    <g id="scene"></g>
  </svg>

  <p class="footer">drag the yellow points on the circle</p>
</div>

<script>
"use strict";

var SVG_NS = "http://www.w3.org/2000/svg";
var CX = 240, CY = 170, R = 130;

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// ---------- vector / angle helpers ----------
function ptOnCircle(theta) {
  return { x: CX + R * Math.cos(theta), y: CY + R * Math.sin(theta) };
}
function thetaOf(p) { return Math.atan2(p.y - CY, p.x - CX); }
function dist(a, b) { var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

// Angle ABC (at vertex B), returned as positive radians in [0, pi]
function angleAt(B, A, C) {
  var v1x = A.x - B.x, v1y = A.y - B.y;
  var v2x = C.x - B.x, v2y = C.y - B.y;
  var dot = v1x * v2x + v1y * v2y;
  var m1 = Math.sqrt(v1x*v1x + v1y*v1y);
  var m2 = Math.sqrt(v2x*v2x + v2y*v2y);
  var c = dot / (m1 * m2);
  if (c >  1) c =  1;
  if (c < -1) c = -1;
  return Math.acos(c);
}

// Signed angle from vector BA to vector BC measured CCW. Returns [-pi, pi].
function signedAngle(B, A, C) {
  var a1 = Math.atan2(A.y - B.y, A.x - B.x);
  var a2 = Math.atan2(C.y - B.y, C.x - B.x);
  var d = a2 - a1;
  while (d >  Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

// Build an arc path from angle a1 to a2 (radians, atan2 frame) sweeping the
// SHORT way, centred at vertex V at distance r. Used for angle-arc markers.
function arcMarkerPath(V, A, C, r) {
  var a1 = Math.atan2(A.y - V.y, A.x - V.x);
  var a2 = Math.atan2(C.y - V.y, C.x - V.x);
  var d = a2 - a1;
  while (d >  Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  var sweep = d > 0 ? 1 : 0;
  var large = 0; // always short way for marker
  var p1 = { x: V.x + r * Math.cos(a1), y: V.y + r * Math.sin(a1) };
  var p2 = { x: V.x + r * Math.cos(a2), y: V.y + r * Math.sin(a2) };
  return "M " + p1.x + " " + p1.y + " A " + r + " " + r + " 0 " + large + " " + sweep + " " + p2.x + " " + p2.y;
}

// Arc for a REFLEX angle (centre theorem when P is on minor arc the centre angle becomes reflex);
// here we always use the non-reflex marker which suits Cambridge diagrams.

// Position to place a label slightly outside the arc midpoint
function labelPos(V, A, C, r) {
  var a1 = Math.atan2(A.y - V.y, A.x - V.x);
  var a2 = Math.atan2(C.y - V.y, C.x - V.x);
  var d = a2 - a1;
  while (d >  Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  var mid = a1 + d / 2;
  return { x: V.x + r * Math.cos(mid), y: V.y + r * Math.sin(mid) + 4 };
}

function el(tag, attrs) {
  var n = document.createElementNS(SVG_NS, tag);
  if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

// ---------- mode state ----------
var STATE = {
  mode: "semicircle",
  // each mode keeps its own free-point thetas so switching back restores them
  semicircle: { thP: -Math.PI / 2 },
  centre:     { thP: -Math.PI / 2,
                thA: Math.PI * 220 / 180,
                thB: Math.PI * 320 / 180 },
  segment:    { thP: -Math.PI * 0.75, thQ: -Math.PI * 0.25 },
  cyclic:     { thA: Math.PI * 200 / 180, // fixed
                thB: Math.PI * 295 / 180, // drag
                thC: Math.PI *  20 / 180, // fixed
                thD: Math.PI * 115 / 180 }, // drag
  alternate:  { thT: Math.PI / 2,    // fixed bottom
                thA: -Math.PI * 0.18, // fixed
                thB: -Math.PI * 0.78 }, // drag (free, on opposite side of chord)
  tangent:    { thT: -Math.PI / 2 }   // drag the touch point T around the circle
};

// ---------- DOM ----------
var scene = document.getElementById("scene");
var formulaEl = document.getElementById("formula");
var modeSel = document.getElementById("mode");
var svg = document.getElementById("svg");

modeSel.addEventListener("change", function() {
  STATE.mode = modeSel.value;
  rebuild();
});

// ---------- pointer / drag plumbing ----------
var dragging = null; // { thetaKey: "thP", constrain: function, target: <SVGElement> }

function svgPoint(evt) {
  var rect = svg.getBoundingClientRect();
  var clientX, clientY;
  if (evt.touches && evt.touches.length) {
    clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
  } else if (evt.changedTouches && evt.changedTouches.length) {
    clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY;
  } else {
    clientX = evt.clientX; clientY = evt.clientY;
  }
  var vb = svg.viewBox.baseVal;
  var x = (clientX - rect.left) / rect.width  * vb.width;
  var y = (clientY - rect.top)  / rect.height * vb.height;
  return { x: x, y: y };
}

function onPointerMove(evt) {
  if (!dragging) return;
  evt.preventDefault();
  var p = svgPoint(evt);
  var th = thetaOf(p);
  if (dragging.constrain) th = dragging.constrain(th);
  STATE[STATE.mode][dragging.thetaKey] = th;
  draw();
}
function onPointerUp() {
  if (!dragging) return;
  if (dragging.target) dragging.target.classList.remove("grabbing");
  dragging = null;
  document.removeEventListener("mousemove", onPointerMove);
  document.removeEventListener("mouseup", onPointerUp);
  document.removeEventListener("touchmove", onPointerMove);
  document.removeEventListener("touchend", onPointerUp);
}
function attachDrag(target, thetaKey, constrain) {
  target.addEventListener("mousedown", function(e) {
    e.preventDefault();
    dragging = { thetaKey: thetaKey, constrain: constrain || null, target: target };
    target.classList.add("grabbing");
    document.addEventListener("mousemove", onPointerMove);
    document.addEventListener("mouseup", onPointerUp);
  });
  target.addEventListener("touchstart", function(e) {
    e.preventDefault();
    dragging = { thetaKey: thetaKey, constrain: constrain || null, target: target };
    target.classList.add("grabbing");
    document.addEventListener("touchmove", onPointerMove, { passive: false });
    document.addEventListener("touchend", onPointerUp);
  }, { passive: false });
}

// ---------- drawing primitives ----------
function drawFixedPoint(p, label, labelOffset) {
  var off = labelOffset || { dx: 0, dy: -10 };
  var c = el("circle", { cx: p.x, cy: p.y, r: 5, class: "pt-fixed" });
  scene.appendChild(c);
  if (label) {
    var t = el("text", { x: p.x + off.dx, y: p.y + off.dy, "text-anchor": "middle", class: "pt-fixed-label" });
    t.textContent = label;
    scene.appendChild(t);
  }
}
function drawDragPoint(p, label, thetaKey, constrain) {
  var glow = el("circle", { cx: p.x, cy: p.y, r: 10, class: "pt-drag-glow" });
  scene.appendChild(glow);
  var c = el("circle", { cx: p.x, cy: p.y, r: 7, class: "pt-drag" });
  scene.appendChild(c);
  if (label) {
    var t = el("text", { x: p.x, y: p.y + 4, "text-anchor": "middle", class: "pt-drag-label" });
    t.textContent = label;
    scene.appendChild(t);
  }
  attachDrag(c, thetaKey, constrain);
  attachDrag(glow, thetaKey, constrain); // glow is invisible-ish but intercepts
  // Make the glow capture pointer events for an easier grab area
  glow.style.pointerEvents = "all";
}
function drawCentre() {
  var c = el("circle", { cx: CX, cy: CY, r: 3, class: "pt-centre" });
  scene.appendChild(c);
  var t = el("text", { x: CX + 9, y: CY - 6, class: "pt-centre-label" });
  t.textContent = "O";
  scene.appendChild(t);
}
function drawChord(a, b, faded) {
  var l = el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: faded ? "chord-faded" : "chord" });
  scene.appendChild(l);
}
function drawArcMarker(V, A, C, r, cls) {
  var p = el("path", { d: arcMarkerPath(V, A, C, r), class: cls });
  scene.appendChild(p);
}
function drawArcLabel(V, A, C, r, text, cls) {
  var pos = labelPos(V, A, C, r + 10);
  var t = el("text", { x: pos.x, y: pos.y, "text-anchor": "middle", class: "lbl " + cls });
  t.textContent = text;
  scene.appendChild(t);
}
function drawRightAngleMarker(V, A, C, size) {
  // small square at vertex V, oriented along VA and VC
  var s = size || 12;
  var u1x = (A.x - V.x), u1y = (A.y - V.y);
  var m1 = Math.sqrt(u1x*u1x + u1y*u1y);
  u1x /= m1; u1y /= m1;
  var u2x = (C.x - V.x), u2y = (C.y - V.y);
  var m2 = Math.sqrt(u2x*u2x + u2y*u2y);
  u2x /= m2; u2y /= m2;
  var p1 = { x: V.x + u1x * s, y: V.y + u1y * s };
  var p2 = { x: V.x + u1x * s + u2x * s, y: V.y + u1y * s + u2y * s };
  var p3 = { x: V.x + u2x * s, y: V.y + u2y * s };
  var d = "M " + p1.x + " " + p1.y + " L " + p2.x + " " + p2.y + " L " + p3.x + " " + p3.y;
  var path = el("path", { d: d, class: "right-marker" });
  scene.appendChild(path);
}

// ---------- per-mode renderers ----------
function deg(rad) { return rad * 180 / Math.PI; }
function fmt(d) { return Math.round(d) + "°"; } // ° = degree sign

// Cambridge-style colour usage:
//   yellow #fff067 = focus / centre angle / tangent-chord angle
//   green  #0fee89 = matching circumference angles
//   pink   #ff4670 = right angle / opposite-pair in cyclic quad

function drawSemicircle() {
  var s = STATE.semicircle;
  // diameter endpoints
  var A = { x: 110, y: 170 };
  var B = { x: 370, y: 170 };
  var P = ptOnCircle(s.thP);

  drawChord(A, B);  // diameter shown as blue chord
  drawChord(A, P);
  drawChord(B, P);

  drawRightAngleMarker(P, A, B, 14);

  drawCentre();
  drawFixedPoint(A, "A", { dx: -10, dy: 4 });
  drawFixedPoint(B, "B", { dx:  12, dy: 4 });
  drawDragPoint(P, "P", "thP");

  var ang = deg(angleAt(P, A, B));
  tryRender(formulaEl,
    "\\angle APB = \\textcolor{#ff4670}{" + fmt(ang).replace("°","^\\circ") + "} = 90^\\circ"
  );
}

function drawCentre_Mode() {
  var s = STATE.centre;
  var A = ptOnCircle(s.thA);
  var B = ptOnCircle(s.thB);
  var P = ptOnCircle(s.thP);

  // chord AB faded
  drawChord(A, B, true);
  // OA, OB
  drawChord({ x: CX, y: CY }, A);
  drawChord({ x: CX, y: CY }, B);
  // PA, PB
  drawChord(A, P);
  drawChord(B, P);

  // angle AOB at centre: the arc on the side of P (the minor side facing P)
  // To make the arc face the same side as P, choose order so that arcMarkerPath
  // sweeps short way through P-side. We use angleAt for magnitude; the arc
  // marker draws the shorter way which is what we want for non-reflex centre angle.
  drawArcMarker({ x: CX, y: CY }, A, B, 26, "arc-yellow");
  // angle APB at circumference
  drawArcMarker(P, A, B, 22, "arc-green");

  var aoB = deg(angleAt({ x: CX, y: CY }, A, B));
  var apB = deg(angleAt(P, A, B));
  drawArcLabel({ x: CX, y: CY }, A, B, 26, fmt(aoB), "lbl-yellow");
  drawArcLabel(P, A, B, 22, fmt(apB), "lbl-green");

  drawCentre();
  drawFixedPoint(A, "A", { dx: -12, dy: 4 });
  drawFixedPoint(B, "B", { dx:  12, dy: 4 });
  drawDragPoint(P, "P", "thP");

  tryRender(formulaEl,
    "\\textcolor{#fff067}{\\angle AOB} = 2 \\times \\textcolor{#0fee89}{\\angle APB} \\quad " +
    "\\textcolor{#fff067}{" + fmt(aoB).replace("°","^\\circ") + "} = 2 \\times \\textcolor{#0fee89}{" + fmt(apB).replace("°","^\\circ") + "}"
  );
}

function drawSegment() {
  var s = STATE.segment;
  // fixed chord A=(115,250), B=(365,250): but these need to be on the circle.
  // Using the project spec: place at given pixel positions. They lie on circle?
  // (115-240)^2 + (250-170)^2 = 15625 + 6400 = 22025; sqrt ~ 148.4 (not exactly 130).
  // Recompute on-circle endpoints with the same horizontal y if possible.
  // y = 250 means dy = 80; dx = sqrt(R^2 - 80^2) = sqrt(16900 - 6400) = sqrt(10500) = 102.47
  // So on-circle A = (240 - 102.47, 250), B = (240 + 102.47, 250).
  var dx = Math.sqrt(R*R - 80*80);
  var A = { x: CX - dx, y: 250 };
  var B = { x: CX + dx, y: 250 };
  var P = ptOnCircle(s.thP);
  var Q = ptOnCircle(s.thQ);

  drawChord(A, B, true);
  drawChord(A, P);
  drawChord(B, P);
  drawChord(A, Q);
  drawChord(B, Q);

  drawArcMarker(P, A, B, 22, "arc-green");
  drawArcMarker(Q, A, B, 22, "arc-green");

  var apB = deg(angleAt(P, A, B));
  var aqB = deg(angleAt(Q, A, B));
  drawArcLabel(P, A, B, 22, fmt(apB), "lbl-green");
  drawArcLabel(Q, A, B, 22, fmt(aqB), "lbl-green");

  drawCentre();
  drawFixedPoint(A, "A", { dx: -12, dy: 4 });
  drawFixedPoint(B, "B", { dx:  12, dy: 4 });
  // constrain P and Q to the major arc (above the chord, i.e. y < 250 - small pad)
  // The chord endpoints have sin(th) = 80/130; allowed band has sin(th) < that.
  function aboveOnly(th) {
    var sinLimit = 80 / R - 0.04; // small pad so points stay above the chord
    var s = Math.sin(th);
    if (s <= sinLimit) return th;
    // snap to nearest boundary in the allowed arc
    var thRight = Math.asin(sinLimit);             // ~ 0.61 rad, x>0 side
    var thLeft  = Math.PI - thRight;                // x<0 side
    // wrap th into [-pi, pi]
    var t = th;
    while (t >  Math.PI) t -= 2 * Math.PI;
    while (t < -Math.PI) t += 2 * Math.PI;
    // pick whichever boundary is closer along the top arc
    return Math.cos(t) >= 0 ? thRight : thLeft;
  }
  drawDragPoint(P, "P", "thP", aboveOnly);
  drawDragPoint(Q, "Q", "thQ", aboveOnly);

  tryRender(formulaEl,
    "\\textcolor{#0fee89}{\\angle APB} = \\textcolor{#0fee89}{\\angle AQB} \\quad " +
    "\\textcolor{#0fee89}{" + fmt(apB).replace("°","^\\circ") + "} = \\textcolor{#0fee89}{" + fmt(aqB).replace("°","^\\circ") + "}"
  );
}

function drawCyclic() {
  var s = STATE.cyclic;
  var A = ptOnCircle(s.thA);
  var B = ptOnCircle(s.thB);
  var C = ptOnCircle(s.thC);
  var D = ptOnCircle(s.thD);

  // Draw quadrilateral ABCD in order
  drawChord(A, B);
  drawChord(B, C);
  drawChord(C, D);
  drawChord(D, A);

  // Angles A and C in green; B and D in pink
  drawArcMarker(A, D, B, 22, "arc-green");
  drawArcMarker(C, B, D, 22, "arc-green");
  drawArcMarker(B, A, C, 22, "arc-pink");
  drawArcMarker(D, C, A, 22, "arc-pink");

  var aA = deg(angleAt(A, D, B));
  var aB = deg(angleAt(B, A, C));
  var aC = deg(angleAt(C, B, D));
  var aD = deg(angleAt(D, C, A));
  drawArcLabel(A, D, B, 22, fmt(aA), "lbl-green");
  drawArcLabel(C, B, D, 22, fmt(aC), "lbl-green");
  drawArcLabel(B, A, C, 22, fmt(aB), "lbl-pink");
  drawArcLabel(D, C, A, 22, fmt(aD), "lbl-pink");

  drawCentre();
  drawFixedPoint(A, "A", { dx: -12, dy: 4 });
  drawFixedPoint(C, "C", { dx:  12, dy: -4 });

  // B is dragged but constrained to stay between A and C going clockwise.
  // Parametrise: A is at thA, C is at thC. Going CCW from A to B to C through
  // theta-decreasing direction (since A=200deg, C=20deg, going CCW through 295/0 lands at C).
  // We just clamp B to (thC, thA) modulo 2pi on the "lower" arc, and D to the upper arc.
  function clampArc(thRaw, lo, hi) {
    // Move into the arc segment from lo (exclusive) going CCW to hi (exclusive)
    function norm(x) { while (x <= -Math.PI) x += 2*Math.PI; while (x > Math.PI) x -= 2*Math.PI; return x; }
    function mod(x) { x = x % (2*Math.PI); if (x < 0) x += 2*Math.PI; return x; }
    var th = mod(thRaw), lo2 = mod(lo), hi2 = mod(hi);
    // sweep CCW from lo2 to hi2
    var sweep = mod(hi2 - lo2);
    var rel = mod(th - lo2);
    var pad = 0.08; // ~4.5deg padding so vertices don't collide
    if (rel < pad) rel = pad;
    if (rel > sweep - pad) rel = sweep - pad;
    return norm(lo2 + rel);
  }
  // B stays between C (going CCW) and A. CCW from thC goes 20 -> 90 -> 180 -> ... -> thA(200).
  // But we want B on the BOTTOM arc (between A and C going clockwise through 270deg).
  // So B's allowed arc is from thA CCW to thC: 200 -> 270 -> 360/0 -> 20.
  function constrainB(th) { return clampArc(th, s.thA, s.thC); }
  // D's allowed arc is from thC CCW to thA: 20 -> 90 -> 180 -> 200.
  function constrainD(th) { return clampArc(th, s.thC, s.thA); }

  drawDragPoint(B, "B", "thB", constrainB);
  drawDragPoint(D, "D", "thD", constrainD);

  var sumAC = fmt(Math.round(aA) + Math.round(aC)).replace("°","^\\circ");
  var sumBD = fmt(Math.round(aB) + Math.round(aD)).replace("°","^\\circ");
  tryRender(formulaEl,
    "\\textcolor{#0fee89}{" + fmt(aA).replace("°","^\\circ") + " + " + fmt(aC).replace("°","^\\circ") + " = " + sumAC + "}" +
    " \\quad " +
    "\\textcolor{#ff4670}{" + fmt(aB).replace("°","^\\circ") + " + " + fmt(aD).replace("°","^\\circ") + " = " + sumBD + "}"
  );
}

function drawAlternate() {
  var s = STATE.alternate;
  // T at bottom of circle, fixed
  var T = ptOnCircle(s.thT); // (240, 300)
  var A = ptOnCircle(s.thA); // upper-right
  var B = ptOnCircle(s.thB); // free, must be on opposite side of chord TA from the tangent's "alternate" segment

  // Tangent at T: perpendicular to radius OT.
  // OT direction = (T - O) normalised. Tangent direction is perpendicular to that.
  var rx = T.x - CX, ry = T.y - CY;
  var rmag = Math.sqrt(rx*rx + ry*ry);
  var tx = -ry / rmag, ty = rx / rmag; // tangent unit vector
  var TANLEN = 150;
  var Tleft  = { x: T.x - tx * TANLEN, y: T.y - ty * TANLEN };
  var Tright = { x: T.x + tx * TANLEN, y: T.y + ty * TANLEN };
  var tanLine = el("line", { x1: Tleft.x, y1: Tleft.y, x2: Tright.x, y2: Tright.y, class: "tangent" });
  scene.appendChild(tanLine);

  // chord TA fixed
  drawChord(T, A);
  // chord TB
  drawChord(T, B);
  // chord AB (closes the inscribed angle TBA)
  drawChord(A, B);

  // Mark angle between tangent (the side AWAY from B) and chord TA in yellow.
  // Choose tangent endpoint on opposite side of chord TA from B so the marked
  // angle is the one in the "other" segment (alternate to where B sits).
  function sideOf(P, U, V) {
    return (V.x - U.x) * (P.y - U.y) - (V.y - U.y) * (P.x - U.x);
  }
  var sB = sideOf(B, T, A);
  var sL = sideOf(Tleft,  T, A);
  var sR = sideOf(Tright, T, A);
  var Talt = (sL * sB < 0) ? Tleft : Tright; // tangent endpoint OPPOSITE to B

  drawArcMarker(T, Talt, A, 22, "arc-yellow");
  drawArcMarker(B, T, A, 22, "arc-yellow");

  var angTan = deg(angleAt(T, Talt, A));
  var angInscribed = deg(angleAt(B, T, A));
  drawArcLabel(T, Talt, A, 22, fmt(angTan), "lbl-yellow");
  drawArcLabel(B, T, A, 22, fmt(angInscribed), "lbl-yellow");

  drawCentre();
  drawFixedPoint(T, "T", { dx: 0, dy: 18 });
  drawFixedPoint(A, "A", { dx: 12, dy: -4 });
  // constrain B to the arc on the same side of chord TA as the original B
  // (i.e. B stays in the alternate segment from the marked tangent angle).
  // sB was computed above using the current B position, which is valid.
  // If a drag would cross the chord, snap B to the nearest endpoint of its arc.
  var thT = thetaOf(T), thA_ = thetaOf(A);
  function constrainB(th) {
    var p = ptOnCircle(th);
    var sP = sideOf(p, T, A);
    if (sP === 0 || sP * sB < 0) {
      // snap to whichever chord endpoint angle is closer
      function norm(x) { while (x > Math.PI) x -= 2*Math.PI; while (x < -Math.PI) x += 2*Math.PI; return x; }
      var dT = Math.abs(norm(th - thT));
      var dA = Math.abs(norm(th - thA_));
      var pad = 0.06;
      // step a bit AWAY from the chord into the allowed arc (toward the side where sB lives)
      // achieved by choosing the boundary endpoint and offsetting along the sign of sB
      var base = dT < dA ? thT : thA_;
      // tiny offset in either direction; pick the one whose ptOnCircle has sP * sB > 0
      var off1 = norm(base + pad), off2 = norm(base - pad);
      var s1 = sideOf(ptOnCircle(off1), T, A);
      return s1 * sB > 0 ? off1 : off2;
    }
    return th;
  }
  drawDragPoint(B, "B", "thB", constrainB);

  tryRender(formulaEl,
    "\\text{tangent-chord }\\angle = \\angle\\text{ in alt. segment} \\quad " +
    "\\textcolor{#fff067}{" + fmt(angTan).replace("°","^\\circ") + "} = \\textcolor{#fff067}{" + fmt(angInscribed).replace("°","^\\circ") + "}"
  );
}

// ---------- main draw ----------
function clearScene() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
}
function rebuild() { clearScene(); draw(); reportHeight(); }
function draw() {
  clearScene();
  switch (STATE.mode) {
    case "semicircle": drawSemicircle(); break;
    case "centre":     drawCentre_Mode(); break;
    case "segment":    drawSegment(); break;
    case "cyclic":     drawCyclic(); break;
    case "alternate":  drawAlternate(); break;
    case "tangent":    drawTangentRadius(); break;
  }
}

function drawTangentRadius() {
  var s = STATE.tangent;
  var T = ptOnCircle(s.thT);
  // Tangent unit direction (perpendicular to OT)
  var tx = -Math.sin(s.thT), ty = Math.cos(s.thT);
  var tangLen = 110;

  // Radius OT (blue) drawn as a chord from centre to T
  drawChord({ x: CX, y: CY }, T);

  // Tangent line (orange) extending both ways from T
  var tangent = el("line", {
    x1: T.x - tx * tangLen, y1: T.y - ty * tangLen,
    x2: T.x + tx * tangLen, y2: T.y + ty * tangLen,
    stroke: "#ff822c", "stroke-width": 2.5, "stroke-linecap": "round"
  });
  scene.appendChild(tangent);

  // Tangent label (pushed slightly to one side of T along the tangent direction)
  var labT = el("text", {
    x: T.x + tx * tangLen * 0.6, y: T.y + ty * tangLen * 0.6 - 6,
    "text-anchor": "middle", fill: "#ff822c", "font-family": "'Geist Mono', monospace",
    "font-size": "11", "font-weight": "600"
  });
  labT.textContent = "tangent";
  scene.appendChild(labT);

  // Right-angle square at T (radius direction + tangent direction)
  var rxh = (CX - T.x), ryh = (CY - T.y);
  var rlen = Math.hypot(rxh, ryh); rxh /= rlen; ryh /= rlen;
  var sq = 12;
  var p1 = { x: T.x + rxh * sq, y: T.y + ryh * sq };
  var p2 = { x: T.x + rxh * sq + tx * sq, y: T.y + ryh * sq + ty * sq };
  var p3 = { x: T.x + tx * sq, y: T.y + ty * sq };
  var rmark = el("path", {
    d: "M " + p1.x + " " + p1.y + " L " + p2.x + " " + p2.y + " L " + p3.x + " " + p3.y,
    class: "right-marker"
  });
  scene.appendChild(rmark);

  // "90°" label slightly inside the square
  var lblR = el("text", {
    x: T.x + (rxh + tx) * sq * 1.5, y: T.y + (ryh + ty) * sq * 1.5 + 3,
    "text-anchor": "middle", fill: "#ff4670",
    "font-family": "'Geist Mono', monospace", "font-size": "11", "font-weight": "700"
  });
  lblR.textContent = "90°";
  scene.appendChild(lblR);

  drawCentre();
  drawDragPoint(T, "T", "thT");

  tryRender(formulaEl,
    "\\textcolor{#00abfa}{\\text{radius}} \\perp \\textcolor{#ff822c}{\\text{tangent}} \\Rightarrow \\textcolor{#ff4670}{\\angle = 90^\\circ}"
  );
}

// ---------- spring-smoothed draw on tick (kept simple: redraw on demand only) ----------
// We redraw on every drag movemove via draw(); rAF tick is here for parity with
// the reference scaffold and to debounce label re-renders.
function tick() {
  // nothing to spring-smooth right now (drag is direct); kept for future use.
  requestAnimationFrame(tick);
}

// ---------- height reporter ----------
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop    = parseFloat(getComputedStyle(document.body).paddingTop)    || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}

window.addEventListener("load", function() {
  draw();
  tick();
  reportHeight();
});
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
