<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Venn Probability Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:16px 20px 18px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  .headline { display:flex; align-items:baseline; justify-content:center; gap:8px; flex-wrap:wrap; margin:8px 0 16px; padding:14px 4px; }
  .headline .col { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:84px; }
  .headline .big { font-family:'Geist Mono',monospace; font-size:30px; font-weight:700; line-height:1; transition: color 0.3s ease; display:flex; align-items:center; justify-content:center; min-height:34px; }
  .headline .big .katex { font-size:1em; }
  .headline .big.pa  { color:#00abfa; }
  .headline .big.pb  { color:#ff4670; }
  .headline .big.pab { color:#fff067; }
  .headline .big.pu  { color:#0fee89; }
  .headline .lab { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.5px; text-transform:uppercase; }
  .headline .lab .katex { font-size:1em; }
  .headline .op { font-family:'Geist Mono',monospace; font-size:22px; color:#3a4a5a; padding:0 2px; align-self:center; }

  #stage { display:block; width:100%; height:auto; }
  .lbl-host { font-family:'Geist Mono',monospace; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .regions { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:10px; }
  .rpill { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); }
  .rpill .lhs { display:flex; flex-direction:column; gap:2px; }
  .rpill .lab { font-family:'Geist Mono',monospace; font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase; font-weight:600; }
  .rpill .count { font-family:'Geist Mono',monospace; font-size:17px; font-weight:700; line-height:1; color:#f0eeea; }
  .rpill .btns { display:flex; gap:2px; }
  .rpill .btn { background:transparent; border:0; color:inherit; font-family:'Geist Mono',monospace; font-size:13px; font-weight:700; line-height:1; padding:4px 8px; border-radius:4px; cursor:pointer; opacity:0.5; transition: opacity 0.12s ease; }
  .rpill .btn:hover:not(:disabled) { opacity:1; }
  .rpill .btn:disabled { opacity:0.15; cursor:not-allowed; }

  .footer { font-family:'Geist Mono',monospace; font-size:11.5px; color:#3a4a5a; text-align:center; margin-top:14px; line-height:1.6; }
  .footer .id { color:#7a7875; }
  .footer .id .katex { font-size:1em; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">VENN · TWO EVENTS</span>
    <span class="meta">use +/- on each region</span>
  </div>

  <div class="headline">
    <span class="col">
      <span class="big pa" id="pa-val"></span>
      <span class="lab" id="pa-lab"></span>
    </span>
    <span class="op">+</span>
    <span class="col">
      <span class="big pb" id="pb-val"></span>
      <span class="lab" id="pb-lab"></span>
    </span>
    <span class="op">−</span>
    <span class="col">
      <span class="big pab" id="pab-val"></span>
      <span class="lab" id="pab-lab"></span>
    </span>
    <span class="op">=</span>
    <span class="col">
      <span class="big pu" id="pu-val"></span>
      <span class="lab" id="pu-lab"></span>
    </span>
  </div>

  <svg id="stage" viewBox="0 0 480 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-rect"></g>
    <g id="g-circles"></g>
    <g id="g-labels"></g>
    <g id="g-counts"></g>
    <g id="g-total"></g>
  </svg>

  <div class="regions" id="regions"></div>

  <div class="footer">
    <span class="id" id="footer-line"></span>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:"#00abfa", pink:"#ff4670", yellow:"#fff067", green:"#0fee89",
  faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

var REGIONS = [
  { id:"aOnly",   label:"A only",   colour:"#00abfa" },
  { id:"both",    label:"A ∩ B",    colour:"#fff067" },
  { id:"bOnly",   label:"B only",   colour:"#ff4670" },
  { id:"neither", label:"neither",  colour:"#7a7875" }
];

var state = { aOnly:5, both:3, bOnly:4, neither:2 };
var MAX_PER = 12;

function total(){ return state.aOnly + state.both + state.bOnly + state.neither; }
function countA(){ return state.aOnly + state.both; }
function countB(){ return state.bOnly + state.both; }
function countUnion(){ return state.aOnly + state.both + state.bOnly; }

function gcd(a, b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a; }
function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}
function svgKaTeXLabel(parent, x, y, tex, color, align, width){
  align = align || "center";
  width = width || 100;
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - width/2); fo.setAttribute("y", y - 11);
  fo.setAttribute("width", width); fo.setAttribute("height", 22);
  fo.style.overflow = "visible"; fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px"; div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host"; div.style.color = color || COL.off;
  fo.appendChild(div); parent.appendChild(fo);
  tryRender(div, tex);
}
function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function fracTex(num, den){
  if (den === 0) return "\\text{—}";
  if (num === 0) return "0";
  if (num === den) return "1";
  var g = gcd(num, den);
  return "\\tfrac{" + (num/g) + "}{" + (den/g) + "}";
}

// ---- Venn diagram ----
function drawVenn(){
  var gR = document.getElementById("g-rect");
  var gC = document.getElementById("g-circles");
  var gL = document.getElementById("g-labels");
  var gN = document.getElementById("g-counts");
  var gT = document.getElementById("g-total");
  clear(gR); clear(gC); clear(gL); clear(gN); clear(gT);

  var W = 480, H = 200;
  var BOX_X = 30, BOX_Y = 20, BOX_W = 420, BOX_H = 160;
  var rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
  rect.setAttribute("x", BOX_X); rect.setAttribute("y", BOX_Y);
  rect.setAttribute("width", BOX_W); rect.setAttribute("height", BOX_H);
  rect.setAttribute("rx", 10);
  rect.setAttribute("fill", "none");
  rect.setAttribute("stroke", "#3a4a5a"); rect.setAttribute("stroke-width", 1.2);
  gR.appendChild(rect);
  svgKaTeXLabel(gT, BOX_X + BOX_W - 22, BOX_Y + 10, "\\Omega = " + total(), "#7a7875", "right", 60);

  // Geometry: pick centre-to-centre distance < 2*R so the circles actually overlap.
  // With R = 78 the circles need centres ≤ 156 apart; we use 120 → ~36px-wide lens.
  var cy = BOX_Y + BOX_H / 2 + 4;
  var R = 78;
  var rAx = BOX_X + 150;
  var rBx = BOX_X + 270;

  var cA = document.createElementNS("http://www.w3.org/2000/svg","circle");
  cA.setAttribute("cx", rAx); cA.setAttribute("cy", cy); cA.setAttribute("r", R);
  cA.setAttribute("fill", "rgba(0,171,250,0.12)");
  cA.setAttribute("stroke", "#00abfa"); cA.setAttribute("stroke-width", 1.5);
  gC.appendChild(cA);
  var cB = document.createElementNS("http://www.w3.org/2000/svg","circle");
  cB.setAttribute("cx", rBx); cB.setAttribute("cy", cy); cB.setAttribute("r", R);
  cB.setAttribute("fill", "rgba(255,70,112,0.12)");
  cB.setAttribute("stroke", "#ff4670"); cB.setAttribute("stroke-width", 1.5);
  gC.appendChild(cB);

  svgKaTeXLabel(gL, rAx - R + 12, cy - R + 4, "A", COL.blue, "center", 30);
  svgKaTeXLabel(gL, rBx + R - 12, cy - R + 4, "B", COL.pink, "center", 30);

  function bigCount(g, x, y, value, color){
    var t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("fill", color);
    t.setAttribute("font-family", "Geist Mono, monospace");
    t.setAttribute("font-size", "20");
    t.setAttribute("font-weight", "700");
    t.textContent = String(value);
    g.appendChild(t);
  }
  // Labels: "A only" sits in the left crescent, "A∩B" in the lens, "B only" in the right crescent.
  bigCount(gN, rAx - 42, cy, state.aOnly, COL.blue);
  bigCount(gN, (rAx + rBx) / 2, cy, state.both, COL.yellow);
  bigCount(gN, rBx + 42, cy, state.bOnly, COL.pink);
  bigCount(gN, BOX_X + 24, BOX_Y + BOX_H - 22, state.neither, COL.grey);
}

// ---- headline (inclusion-exclusion live) ----
function renderHeadline(){
  var N = total();
  var pa = countA(), pb = countB(), pab = state.both, pu = countUnion();
  function setBig(id, num){
    var el = document.getElementById(id);
    el.innerHTML = "";
    if (N === 0){ tryRender(el, "\\text{—}"); return; }
    tryRender(el, fracTex(num, N));
  }
  function setLab(id, tex){
    var el = document.getElementById(id);
    el.innerHTML = "";
    tryRender(el, tex);
  }
  setBig("pa-val",  pa);
  setBig("pb-val",  pb);
  setBig("pab-val", pab);
  setBig("pu-val",  pu);
  setLab("pa-lab",  "P(A)");
  setLab("pb-lab",  "P(B)");
  setLab("pab-lab", "P(A \\cap B)");
  setLab("pu-lab",  "P(A \\cup B)");
}

// ---- region pills ----
function buildRegions(){
  var host = document.getElementById("regions");
  host.innerHTML = "";
  REGIONS.forEach(function(r){
    var pill = document.createElement("div");
    pill.className = "rpill";
    pill.style.color = r.colour;
    pill.innerHTML =
      '<span class="lhs">' +
        '<span class="lab" style="color:' + r.colour + '">' + r.label + '</span>' +
        '<span class="count">' + state[r.id] + '</span>' +
      '</span>' +
      '<span class="btns">' +
        '<button class="btn" data-r="' + r.id + '" data-act="minus">−</button>' +
        '<button class="btn" data-r="' + r.id + '" data-act="plus">+</button>' +
      '</span>';
    host.appendChild(pill);
  });
  host.querySelectorAll(".btn").forEach(function(b){
    b.addEventListener("click", function(){
      var r = b.dataset.r;
      var act = b.dataset.act;
      if (act === "plus"){
        if (state[r] < MAX_PER){ state[r]++; render(); }
      } else {
        if (state[r] > 0){ state[r]--; render(); }
      }
    });
  });
}

// ---- footer (sanity check / extras) ----
function renderFooter(){
  var N = total();
  var pa = countA(), pb = countB(), pab = state.both;
  var fEl = document.getElementById("footer-line");
  fEl.innerHTML = "";
  if (N === 0){
    tryRender(fEl, "\\text{empty sample space}");
    return;
  }
  // Show P(A') and P(neither) as the two extras
  var paPrime = N - pa;
  var pNeither = state.neither;
  tryRender(fEl, "P(A') = " + fracTex(paPrime, N) + " \\quad \\cdot \\quad P(\\text{neither}) = " + fracTex(pNeither, N));
}

function render(){
  drawVenn();
  buildRegions();
  renderHeadline();
  renderFooter();
  notifyHeight();
}

function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

render();
setTimeout(notifyHeight, 200);
</script>
</body>
</html>
