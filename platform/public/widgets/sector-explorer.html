<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sector Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:14.5px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls {
    display:flex; align-items:center; gap:14px; margin-bottom:8px; padding:0 4px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .row { display:flex; align-items:center; gap:8px; min-width:180px; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] {
    flex:1; min-width:80px; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .row .val { min-width:36px; text-align:right; color:#f0eeea; font-weight:600; }

  .toggle-row { display:flex; align-items:center; gap:8px; }
  .toggle-row .name { color:#fff067; font-weight:600; }
  .toggle-row select {
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px;
    padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer;
  }
  .toggle-row select:focus { border-color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .circle-outline { fill:none; stroke:#3a4a5a; stroke-width:1.2; stroke-dasharray:3 3; }
  .sector-fill   { fill:rgba(0,171,250,0.16); stroke:#00abfa; stroke-width:2; stroke-linejoin:round; }
  .arc-stroke    { fill:none; stroke:#00abfa; stroke-width:3.5; stroke-linecap:round; }
  .radius-line   { stroke:#fff067; stroke-width:2; }
  .angle-marker  { fill:none; stroke:#0fee89; stroke-width:1.5; }
  .lbl { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; }
  .lbl-r  { fill:#fff067; }
  .lbl-th { fill:#0fee89; }
  .centre-dot   { fill:#7a7875; }
  .centre-label { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; fill:#7a7875; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fArc"></span>
    <span class="formula" id="fArea"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">r</span>
      <input type="range" id="rSlider" min="1" max="9" value="5" step="0.1"/>
      <span class="val" id="rVal">5</span>
    </div>
    <div class="row">
      <span class="name">θ</span>
      <input type="range" id="tSlider" min="10" max="359" value="90" step="1"/>
      <span class="val" id="tVal">90°</span>
    </div>
    <div class="toggle-row">
      <span class="name">show</span>
      <select id="mode">
        <option value="pi" selected>in terms of π</option>
        <option value="dec">decimal</option>
      </select>
    </div>
  </div>

  <svg id="svg" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="layer-circle"></g>
    <g id="layer-sector"></g>
    <g id="layer-overlay"></g>
  </svg>

  <p class="footer">drag the radius and the angle · the highlighted sector is the one being measured</p>
</div>

<script>
"use strict";

var SVG_W = 480, SVG_H = 300;
var SVG_CX = SVG_W / 2, SVG_CY = SVG_H / 2 + 4;
var SCALE = 21;

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function texCoefPi(coef) {
  var v = Math.round(coef * 1000) / 1000;
  if (v === 0) return "0";
  if (v === 1) return "\\pi";
  if (v === -1) return "-\\pi";
  return parseFloat(v.toFixed(3)).toString() + "\\pi";
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// ===== State + spring ==================================================
var state = {
  params:  { r: 5, theta: 90 },
  display: { r: 5, theta: 90 },
  mode:    "pi"
};
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.02, rafScheduled = false;
function startSpring() { if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(springTick); } }
function springTick() {
  var moving = false;
  ["r", "theta"].forEach(function(k) {
    var d = state.params[k] - state.display[k];
    if (Math.abs(d) > SPRING_EPS) { state.display[k] += d * SPRING_FACTOR; moving = true; }
    else if (state.display[k] !== state.params[k]) { state.display[k] = state.params[k]; }
  });
  render();
  if (moving) requestAnimationFrame(springTick);
  else rafScheduled = false;
}

// ===== Geometry helpers ================================================
function ptOnCircle(cx, cy, r, deg) {
  var rad = deg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}
function sectorPath(cx, cy, rPx, startDeg, endDeg) {
  var p1 = ptOnCircle(cx, cy, rPx, startDeg);
  var p2 = ptOnCircle(cx, cy, rPx, endDeg);
  var sweep = endDeg - startDeg; if (sweep < 0) sweep += 360;
  var largeArc = (sweep > 180) ? 1 : 0;
  return "M" + cx.toFixed(2) + " " + cy.toFixed(2) +
         " L" + p1.x.toFixed(2) + " " + p1.y.toFixed(2) +
         " A" + rPx.toFixed(2) + " " + rPx.toFixed(2) +
         " 0 " + largeArc + " 0 " + p2.x.toFixed(2) + " " + p2.y.toFixed(2) + " Z";
}
function arcOnlyPath(cx, cy, rPx, startDeg, endDeg) {
  var p1 = ptOnCircle(cx, cy, rPx, startDeg);
  var p2 = ptOnCircle(cx, cy, rPx, endDeg);
  var sweep = endDeg - startDeg; if (sweep < 0) sweep += 360;
  var largeArc = (sweep > 180) ? 1 : 0;
  return "M" + p1.x.toFixed(2) + " " + p1.y.toFixed(2) +
         " A" + rPx.toFixed(2) + " " + rPx.toFixed(2) +
         " 0 " + largeArc + " 0 " + p2.x.toFixed(2) + " " + p2.y.toFixed(2);
}

// ===== Render ==========================================================
var fArc  = document.getElementById("fArc");
var fArea = document.getElementById("fArea");
var lcEl = document.getElementById("layer-circle");
var lsEl = document.getElementById("layer-sector");
var loEl = document.getElementById("layer-overlay");

function render() {
  var r = state.display.r;
  var theta = state.display.theta;
  var rPx = r * SCALE;

  lcEl.innerHTML = ""; lsEl.innerHTML = ""; loEl.innerHTML = "";

  // Faint full-circle outline
  lcEl.appendChild(svgEl("circle", {
    "class": "circle-outline", cx: SVG_CX, cy: SVG_CY, r: rPx
  }));

  // The highlighted sector starts at the top (90°) and sweeps clockwise
  // through θ degrees. Whatever θ the user picks is the sector being measured.
  var startDeg = 90;
  var endDeg   = 90 - theta;

  lsEl.appendChild(svgEl("path", {
    "class": "sector-fill",
    d: sectorPath(SVG_CX, SVG_CY, rPx, endDeg, startDeg)
  }));
  lsEl.appendChild(svgEl("path", {
    "class": "arc-stroke",
    d: arcOnlyPath(SVG_CX, SVG_CY, rPx, endDeg, startDeg)
  }));

  // Two radii to the sector boundary
  var pStart = ptOnCircle(SVG_CX, SVG_CY, rPx, startDeg);
  var pEnd   = ptOnCircle(SVG_CX, SVG_CY, rPx, endDeg);
  loEl.appendChild(svgEl("line", { "class": "radius-line",
    x1: SVG_CX, y1: SVG_CY, x2: pStart.x, y2: pStart.y }));
  loEl.appendChild(svgEl("line", { "class": "radius-line",
    x1: SVG_CX, y1: SVG_CY, x2: pEnd.x, y2: pEnd.y }));

  // Angle marker arc at centre — only show when θ ≤ 180° (otherwise it
  // wraps around and visually duplicates the sector itself)
  if (theta <= 180) {
    var markerR = Math.min(28, rPx * 0.4);
    loEl.appendChild(svgEl("path", {
      "class": "angle-marker",
      d: arcOnlyPath(SVG_CX, SVG_CY, markerR, endDeg, startDeg)
    }));
  }

  // r label on the top radius
  var rLbl = svgEl("text", {
    "class": "lbl lbl-r",
    x: SVG_CX + 6, y: (SVG_CY + pStart.y) / 2 + 4, "text-anchor": "start"
  });
  rLbl.textContent = "r = " + fmtNum(r);
  loEl.appendChild(rLbl);

  // θ label placed in the middle of the highlighted angle
  var midDeg = startDeg - theta / 2;
  var midRad = midDeg * Math.PI / 180;
  var tLblR  = (theta <= 180) ? Math.min(28, rPx * 0.4) + 14 : Math.min(rPx * 0.55, 70);
  var tLblX  = SVG_CX + tLblR * Math.cos(midRad);
  var tLblY  = SVG_CY - tLblR * Math.sin(midRad);
  var tLbl = svgEl("text", {
    "class": "lbl lbl-th",
    x: tLblX, y: tLblY + 4, "text-anchor": "middle"
  });
  tLbl.textContent = fmtNum(theta) + "°";
  loEl.appendChild(tLbl);

  // Centre dot + O label
  loEl.appendChild(svgEl("circle", { "class": "centre-dot", cx: SVG_CX, cy: SVG_CY, r: 3 }));
  var oLbl = svgEl("text", {
    "class": "centre-label", x: SVG_CX - 10, y: SVG_CY + 4, "text-anchor": "end"
  });
  oLbl.textContent = "O";
  loEl.appendChild(oLbl);

  // ===== KaTeX formulas with live values ==============================
  var arcCoef  = (theta / 360) * 2 * r;
  var areaCoef = (theta / 360) * r * r;
  var theNum = fmtNum(theta);

  if (state.mode === "pi") {
    tryRender(fArc,
      "{\\color{#00abfa}\\text{arc}} = \\dfrac{" + theNum + "}{360} \\times 2\\pi r = " +
      "{\\color{#00abfa}" + texCoefPi(arcCoef) + "}\\;\\text{cm}");
    tryRender(fArea,
      "{\\color{#0fee89}A} = \\dfrac{" + theNum + "}{360} \\times \\pi r^{2} = " +
      "{\\color{#0fee89}" + texCoefPi(areaCoef) + "}\\;\\text{cm}^{2}");
  } else {
    tryRender(fArc,
      "{\\color{#00abfa}\\text{arc}} = \\dfrac{" + theNum + "}{360} \\times 2\\pi r = " +
      "{\\color{#00abfa}" + fmtNum(arcCoef * Math.PI) + "}\\;\\text{cm}");
    tryRender(fArea,
      "{\\color{#0fee89}A} = \\dfrac{" + theNum + "}{360} \\times \\pi r^{2} = " +
      "{\\color{#0fee89}" + fmtNum(areaCoef * Math.PI) + "}\\;\\text{cm}^{2}");
  }
}

// ===== Wire controls ===================================================
var rSlider = document.getElementById("rSlider");
var rValEl  = document.getElementById("rVal");
var tSlider = document.getElementById("tSlider");
var tValEl  = document.getElementById("tVal");

rSlider.addEventListener("input", function() {
  state.params.r = parseFloat(rSlider.value);
  rValEl.textContent = fmtNum(state.params.r);
  startSpring();
});
tSlider.addEventListener("input", function() {
  state.params.theta = parseFloat(tSlider.value);
  tValEl.textContent = fmtNum(state.params.theta) + "°";
  startSpring();
});

document.getElementById("mode").addEventListener("change", function(e) {
  state.mode = e.target.value;
  render();
});

render();

// ===== Height reporter ==================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
