<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Perpendicular Bisector of a Chord</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:8px; min-height:24px; text-align:center; }
  .formula { font-size:15px; color:#f0eeea; }
  .formula .katex { font-size:1em; }
  .canvas-holder { display:flex; justify-content:center; }
  canvas { display:block; cursor:default; max-width:100%; height:auto; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.3px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="canvas-holder"><canvas id="c" width="560" height="380"></canvas></div>

  <p class="footer">drag A or B: the perpendicular bisector of any chord always passes through the centre O</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 560, H = 380;
var DPR = window.devicePixelRatio || 1;
canvas.width = W * DPR;
canvas.height = H * DPR;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

var CX = W / 2, CY = H / 2 - 4, R = 130;
function N(a) { return ((a % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI); }
function P(t) { return { x: CX + R*Math.cos(t), y: CY - R*Math.sin(t) }; }

// Initial chord. tA on the upper-left, tB on the upper-right so the
// perpendicular bisector dramatically passes through the centre.
var tA = N(150 * Math.PI / 180);
var tB = N( 30 * Math.PI / 180);

var MIN_SEP = 14 * Math.PI / 180;
function setAngle(which, t) {
  t = N(t);
  var partner = (which === 'A') ? tB : tA;
  var d = N(t - partner); if (d > Math.PI) d = 2*Math.PI - d;
  if (d < MIN_SEP) return;
  if (which === 'A') tA = t; else tB = t;
}

function hexAlpha(hex, a) {
  var r = parseInt(hex.slice(1,3),16),
      g = parseInt(hex.slice(3,5),16),
      b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function dot(cx, cy, color, r, glowing) {
  if (glowing) {
    ctx.fillStyle = hexAlpha(color, 0.18);
    ctx.beginPath(); ctx.arc(cx, cy, r + 9, 0, 2*Math.PI); ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, glowing ? r + 1.5 : r, 0, 2*Math.PI); ctx.fill();
}

function plainLabel(x, y, text, color, size) {
  size = size || 13;
  ctx.font = '700 ' + size + 'px Geist, -apple-system, sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function pillLabel(x, y, text, color, size) {
  size = size || 12;
  ctx.font = '600 ' + size + 'px Geist, -apple-system, sans-serif';
  var tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(11,17,24,0.86)';
  ctx.fillRect(x - tw/2 - 5, y - size/2 - 4, tw + 10, size + 8);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

var dragging = null, hovering = null, HIT = 18;

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b1118';
  ctx.fillRect(0, 0, W, H);

  var BLUE = '#00abfa', GREEN = '#0fee89', YEL = '#fff067',
      PINK = '#ff4670', GREY = '#7a7875', FAINT = '#3a4a5a';

  var A = P(tA), B = P(tB);
  var Mx = (A.x + B.x) / 2, My = (A.y + B.y) / 2;
  var dx = B.x - A.x, dy = B.y - A.y;
  var chordLen = Math.sqrt(dx*dx + dy*dy);
  var ux = dx / chordLen, uy = dy / chordLen;     // unit along chord
  var nx = -uy, ny = ux;                          // unit perpendicular

  // 1. Circle outline (faint).
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2*Math.PI);
  ctx.strokeStyle = FAINT;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);
  ctx.stroke();

  // 2. Chord AB (blue).
  ctx.strokeStyle = BLUE;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.stroke();

  // 3. Perpendicular bisector — extend through the entire diagram so
  // students can see it clearly cuts through the centre regardless of
  // where the chord is.
  var BIS_LEN = 280;
  var b1x = Mx - nx * BIS_LEN, b1y = My - ny * BIS_LEN;
  var b2x = Mx + nx * BIS_LEN, b2y = My + ny * BIS_LEN;
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = 1.8;
  ctx.setLineDash([7, 5]);
  ctx.beginPath();
  ctx.moveTo(b1x, b1y);
  ctx.lineTo(b2x, b2y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 4. Equal-half tick marks on each side of the chord midpoint.
  function tickMark(px, py, size, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px - nx*size, py - ny*size);
    ctx.lineTo(px + nx*size, py + ny*size);
    ctx.stroke();
  }
  // place ticks at 1/4 and 3/4 along the chord (midpoint of each half)
  var qx = A.x + dx*0.25, qy = A.y + dy*0.25;
  var rx = A.x + dx*0.75, ry = A.y + dy*0.75;
  tickMark(qx - ux*3, qy - uy*3, 5, GREEN);
  tickMark(qx + ux*3, qy + uy*3, 5, GREEN);
  tickMark(rx - ux*3, ry - uy*3, 5, GREEN);
  tickMark(rx + ux*3, ry + uy*3, 5, GREEN);

  // 5. Right-angle L-marker at midpoint M. The L sits between the chord
  // (along +ux) and the perpendicular toward O (along the side of n
  // that points toward the centre).
  var sideToO = ((CX - Mx) * nx + (CY - My) * ny) >= 0 ? 1 : -1;
  var armSize = 9;
  var c1x = Mx + ux*armSize,                   c1y = My + uy*armSize;
  var c2x = Mx + nx*armSize*sideToO,           c2y = My + ny*armSize*sideToO;
  var c3x = c1x + nx*armSize*sideToO,          c3y = c1y + ny*armSize*sideToO;
  ctx.strokeStyle = PINK;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(c1x, c1y);
  ctx.lineTo(c3x, c3y);
  ctx.lineTo(c2x, c2y);
  ctx.stroke();

  // 6. Centre O dot
  dot(CX, CY, GREY, 5, false);
  plainLabel(CX - 14, CY - 14, 'O', GREY, 13);

  // 7. Midpoint M dot
  dot(Mx, My, YEL, 5, false);
  // M label offset away from the chord (along −n on the side facing O,
  // unless that overlaps O — then offset to the other side).
  var mLabelOff = 14;
  pillLabel(Mx - nx*mLabelOff*sideToO, My - ny*mLabelOff*sideToO, 'M', YEL, 11);

  // 8. Endpoint dots and letter labels just outside the circle.
  dot(A.x, A.y, BLUE, 7, dragging === 'A' || hovering === 'A');
  dot(B.x, B.y, BLUE, 7, dragging === 'B' || hovering === 'B');
  var lo = R + 18;
  plainLabel(CX + Math.cos(tA)*lo, CY - Math.sin(tA)*lo, 'A', BLUE, 14);
  plainLabel(CX + Math.cos(tB)*lo, CY - Math.sin(tB)*lo, 'B', BLUE, 14);

  // 9. "perpendicular bisector" caption near one end of the bisector.
  var capDist = 110;
  var capX = Mx + nx*sideToO*capDist;
  var capY = My + ny*sideToO*capDist;
  // Push slightly along the chord so it doesn't sit on the bisector line.
  pillLabel(capX + ux*4, capY + uy*4, 'perp. bisector', GREEN, 10);

  // 10. Heading formula reinforces the theorem — always true.
  tryRender(
    document.getElementById('formula'),
    "\\text{perp. bisector of a chord} \\;\\Rightarrow\\; \\text{passes through centre } \\textcolor{#7a7875}{O}"
  );
}

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var ev = e.touches ? e.touches[0] : e;
  return {
    x: (ev.clientX - rect.left) * (W / rect.width),
    y: (ev.clientY - rect.top)  * (H / rect.height)
  };
}
function nearPoint(px, py, t) {
  var p = P(t);
  var dx = px - p.x, dy = py - p.y;
  return Math.sqrt(dx*dx + dy*dy) < HIT;
}
function angleFromPos(px, py) { return Math.atan2(CY - py, px - CX); }

canvas.addEventListener('mousedown', function(e) {
  var p = getPos(e);
  if      (nearPoint(p.x, p.y, tA)) dragging = 'A';
  else if (nearPoint(p.x, p.y, tB)) dragging = 'B';
  if (dragging) e.preventDefault();
});
canvas.addEventListener('mousemove', function(e) {
  var p = getPos(e);
  if (dragging) {
    setAngle(dragging, angleFromPos(p.x, p.y));
    draw();
  } else {
    var prev = hovering;
    if      (nearPoint(p.x, p.y, tA)) hovering = 'A';
    else if (nearPoint(p.x, p.y, tB)) hovering = 'B';
    else hovering = null;
    canvas.style.cursor = hovering ? 'grab' : 'default';
    if (hovering !== prev) draw();
  }
});
canvas.addEventListener('mouseup',    function() { dragging = null; });
canvas.addEventListener('mouseleave', function() {
  if (dragging || hovering) {
    dragging = hovering = null;
    canvas.style.cursor = 'default';
    draw();
  }
});

canvas.addEventListener('touchstart', function(e) {
  var p = getPos(e);
  if      (nearPoint(p.x, p.y, tA)) dragging = 'A';
  else if (nearPoint(p.x, p.y, tB)) dragging = 'B';
  if (dragging) e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', function(e) {
  if (!dragging) return;
  e.preventDefault();
  var p = getPos(e);
  setAngle(dragging, angleFromPos(p.x, p.y));
  draw();
}, { passive: false });
canvas.addEventListener('touchend', function() { dragging = null; });

draw();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById('wrap');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: 'pl-widget-resize', height: h }, '*');
  });
}
window.addEventListener('load', reportHeight);
window.addEventListener('resize', reportHeight);
</script>
</body>
</html>
