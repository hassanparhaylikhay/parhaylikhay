<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Function Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:18px 18px 16px; }

  .controls { display:flex; gap:12px; align-items:center; margin-bottom:18px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .controls .name { color:#fff067; font-weight:600; min-width:46px; }
  .controls input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .controls input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .controls input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .controls .val { min-width:40px; text-align:right; color:#f0eeea; font-weight:600; }

  .machine-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; padding:6px 4px 14px; }
  .pill { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; min-width:80px; padding:14px 18px; border-radius:10px; }
  .pill .lbl { font-family:'Geist Mono',monospace; font-size:9.5px; color:#7a7875; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px; }
  .pill .val { font-size:18px; font-weight:600; color:#f0eeea; }
  .pill .val .katex { font-size:1em; }
  .pill.input { background:rgba(0,171,250,0.10); border:1px solid #00abfa; }
  .pill.input .lbl { color:#00abfa; }
  .pill.input .val { color:#00abfa; }
  .pill.rule { background:rgba(255,240,103,0.08); border:1px solid #fff067; min-width:120px; }
  .pill.rule .lbl { color:#fff067; }
  .pill.rule .val { color:#fff067; }
  .pill.output { background:rgba(15,238,137,0.10); border:1px solid #0fee89; }
  .pill.output .lbl { color:#0fee89; }
  .pill.output .val { color:#0fee89; }
  .arrow { color:#7a7875; font-size:24px; line-height:1; user-select:none; }

  .working {
    margin-top:10px; padding:12px 14px;
    background:#07090d; border:1px solid #141e2a; border-radius:8px;
    font-family:'Geist Mono',monospace; font-size:13px; color:#c8c6be;
    text-align:center; line-height:1.6;
  }
  .working .katex { font-size:1em; color:#f0eeea; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div id="root"></div>
  <p class="footer" id="footer"></p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// Predefined functions. Each has: f (numeric), texFn (TeX), workingFn (TeX showing substitution).
const FUNCS = {
  lin1:  { f: x => 3*x - 5,    tex: "3x - 5",         workingFn: x => "3(" + x + ") - 5 = " + (3*x) + " - 5 = " + (3*x - 5) },
  lin2:  { f: x => 2*x + 9,    tex: "2x + 9",         workingFn: x => "2(" + x + ") + 9 = " + (2*x) + " + 9 = " + (2*x + 9) },
  lin3:  { f: x => x + 4,      tex: "x + 4",          workingFn: x => "(" + x + ") + 4 = " + (x + 4) },
  double: { f: x => 2*x,       tex: "2x",             workingFn: x => "2(" + x + ") = " + (2*x) },
  quad1: { f: x => x*x + 1,    tex: "x^2 + 1",        workingFn: x => "(" + x + ")^2 + 1 = " + (x*x) + " + 1 = " + (x*x + 1) },
  inv1:  { f: x => (x + 5) / 3, tex: "\\dfrac{x + 5}{3}", workingFn: x => "\\dfrac{(" + x + ") + 5}{3} = \\dfrac{" + (x + 5) + "}{3} = " + ((x + 5) / 3) }
};

const params = new URLSearchParams(window.location.search);
const layout = params.get("layout") || "single";
const fnId = params.get("f") || "lin1";
const gnId = params.get("g") || "double";
const inputDefault = parseFloat(params.get("input") || "4");

const root = document.getElementById("root");

function makePill(cls, lblText, valTex) {
  const pill = document.createElement("div");
  pill.className = "pill " + cls;
  const lbl = document.createElement("div");
  lbl.className = "lbl"; lbl.textContent = lblText;
  const val = document.createElement("div");
  val.className = "val";
  pill.appendChild(lbl); pill.appendChild(val);
  if (valTex) tryRender(val, valTex);
  return { pill: pill, val: val };
}

function makeArrow() {
  const a = document.createElement("span");
  a.className = "arrow"; a.textContent = "→";
  return a;
}

function buildSingle() {
  const fn = FUNCS[fnId];
  if (!fn) { root.innerHTML = "<p>unknown function</p>"; return; }

  // Slider
  const ctrl = document.createElement("div");
  ctrl.className = "controls";
  ctrl.innerHTML = '<span class="name">input x</span><input type="range" id="x0" min="-5" max="10" value="' + inputDefault + '" step="1"/><span class="val" id="vx">' + inputDefault + '</span>';
  root.appendChild(ctrl);

  // Machine row
  const row = document.createElement("div");
  row.className = "machine-row";
  const inP = makePill("input", "INPUT", String(inputDefault));
  const arr1 = makeArrow();
  const ruleP = makePill("rule", "RULE: f(x) =", fn.tex);
  const arr2 = makeArrow();
  const outP = makePill("output", "OUTPUT", String(fn.f(inputDefault)));
  row.appendChild(inP.pill); row.appendChild(arr1); row.appendChild(ruleP.pill);
  row.appendChild(arr2); row.appendChild(outP.pill);
  root.appendChild(row);

  // Working
  const working = document.createElement("div");
  working.className = "working";
  working.id = "working";
  root.appendChild(working);
  function updateWorking(x) {
    tryRender(working, "f(" + x + ") = " + fn.workingFn(x));
  }
  updateWorking(inputDefault);

  document.getElementById("x0").addEventListener("input", function(e) {
    const v = parseFloat(e.target.value);
    document.getElementById("vx").textContent = v;
    inP.val.textContent = v;
    outP.val.textContent = fn.f(v);
    updateWorking(v);
  });

  document.getElementById("footer").textContent = "drag the input · the output and working update live";
}

function buildSeries() {
  const fn = FUNCS[fnId];
  const gn = FUNCS[gnId];
  if (!fn || !gn) { root.innerHTML = "<p>unknown function</p>"; return; }

  const ctrl = document.createElement("div");
  ctrl.className = "controls";
  ctrl.innerHTML = '<span class="name">input x</span><input type="range" id="x0" min="-5" max="10" value="' + inputDefault + '" step="1"/><span class="val" id="vx">' + inputDefault + '</span>';
  root.appendChild(ctrl);

  const row = document.createElement("div");
  row.className = "machine-row";
  const inP = makePill("input", "INPUT", String(inputDefault));
  const arr1 = makeArrow();
  const fP = makePill("rule", "f(x) =", fn.tex);
  const arr2 = makeArrow();
  const midP = makePill("input", "f(x)", String(fn.f(inputDefault)));
  const arr3 = makeArrow();
  const gP = makePill("rule", "g(x) =", gn.tex);
  const arr4 = makeArrow();
  const outP = makePill("output", "OUTPUT g(f(x))", String(gn.f(fn.f(inputDefault))));
  row.appendChild(inP.pill); row.appendChild(arr1); row.appendChild(fP.pill);
  row.appendChild(arr2); row.appendChild(midP.pill); row.appendChild(arr3);
  row.appendChild(gP.pill); row.appendChild(arr4); row.appendChild(outP.pill);
  root.appendChild(row);

  const working = document.createElement("div");
  working.className = "working";
  working.id = "working";
  root.appendChild(working);
  function updateWorking(x) {
    const fx = fn.f(x);
    const gfx = gn.f(fx);
    tryRender(working,
      "gf(" + x + ") = g(f(" + x + ")) = g(" + fx + ") = " + gfx
    );
  }
  updateWorking(inputDefault);

  document.getElementById("x0").addEventListener("input", function(e) {
    const v = parseFloat(e.target.value);
    document.getElementById("vx").textContent = v;
    const fx = fn.f(v);
    inP.val.textContent = v;
    midP.val.textContent = fx;
    outP.val.textContent = gn.f(fx);
    updateWorking(v);
  });

  document.getElementById("footer").textContent = "two machines in series · output of f feeds into g";
}

if (layout === "series") buildSeries();
else buildSingle();

let lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    const wrap = document.getElementById("wrap");
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    const padTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const padBot = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const h = Math.ceil(rect.height + padTop + padBot);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
setTimeout(reportHeight, 200);
setTimeout(reportHeight, 600);
</script>
</body>
</html>
