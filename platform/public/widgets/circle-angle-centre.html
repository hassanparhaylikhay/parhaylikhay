<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Angle at Centre</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:22px; }
  .formula { font-size:16px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .canvas-holder { display:flex; justify-content:center; }
  canvas { display:block; cursor:default; max-width:100%; height:auto; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="canvas-holder">
    <canvas id="c" width="560" height="380"></canvas>
  </div>

  <p class="footer">drag A, B, or P: angle at centre is always 2 x the inscribed angle on the same arc</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var canvas = document.getElementById('c');
var ctx    = canvas.getContext('2d');
var W = 560, H = 380;

var DPR = window.devicePixelRatio || 1;
canvas.width        = W * DPR;
canvas.height       = H * DPR;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

// Coordinate system
var CX = W / 2;
var CY = H / 2 + 4;
var R  = 3;
var S  = 50; // pixels per math unit -> circle radius = 150px

function toC(mx, my)   { return { x: CX + mx * S,   y: CY - my * S }; }
function fromC(cx, cy) { return { mx: (cx - CX) / S, my: (CY - cy) / S }; }
function ptOnCircle(t) { return { x: R * Math.cos(t), y: R * Math.sin(t) }; }

function N(a) { return ((a % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI); }

// Initial point angles
var tA = N(145 * Math.PI / 180);
var tB = N( 35 * Math.PI / 180);
var tP = N(255 * Math.PI / 180);

function minorIsCCW() {
  return N(tB - tA) <= Math.PI;
}

function isOnMinorArc(t) {
  t = N(t);
  var a = N(tA), b = N(tB), d = N(b - a);
  return d <= Math.PI
    ? N(t - a) < d
    : N(t - b) < (2*Math.PI - d);
}

function minorMidAngle() {
  var a = N(tA), b = N(tB), d = N(b - a);
  return d <= Math.PI ? N(a + d / 2) : N(b + (2*Math.PI - d) / 2);
}

function clampP(t) {
  t = N(t);
  if (!isOnMinorArc(t)) return t;
  var EPS = 0.13;
  var a = N(tA), b = N(tB);
  var da = N(t - a); if (da > Math.PI) da = 2*Math.PI - da;
  var db = N(t - b); if (db > Math.PI) db = 2*Math.PI - db;
  var ccw = minorIsCCW();
  if (da <= db) return ccw ? N(a - EPS) : N(a + EPS);
  else          return ccw ? N(b + EPS) : N(b - EPS);
}

var MIN_SEP = 20 * Math.PI / 180;

function setA(t) {
  var d = N(t - tB); if (d > Math.PI) d = 2*Math.PI - d;
  if (d >= MIN_SEP) { tA = N(t); tP = clampP(tP); }
}
function setB(t) {
  var d = N(t - tA); if (d > Math.PI) d = 2*Math.PI - d;
  if (d >= MIN_SEP) { tB = N(t); tP = clampP(tP); }
}
function setP(t) { tP = clampP(N(t)); }

function computeAngles() {
  var A = ptOnCircle(tA), B = ptOnCircle(tB), P = ptOnCircle(tP);

  var d = N(tB - tA);
  var central = d <= Math.PI ? d : 2*Math.PI - d;

  var PAx = A.x - P.x, PAy = A.y - P.y;
  var PBx = B.x - P.x, PBy = B.y - P.y;
  var dot  = PAx*PBx + PAy*PBy;
  var mag  = Math.sqrt(PAx*PAx + PAy*PAy) * Math.sqrt(PBx*PBx + PBy*PBy);
  var inscribed = mag > 0 ? Math.acos(Math.max(-1, Math.min(1, dot / mag))) : 0;

  return { central: central, inscribed: inscribed };
}

// Draw shorter arc between two canvas angles
function arcBetween(cx, cy, r, ca, cb) {
  var cw = ((cb - ca) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  ctx.beginPath();
  ctx.arc(cx, cy, r, ca, cb, cw > Math.PI);
  ctx.stroke();
}

function hexAlpha(hex, a) {
  var r = parseInt(hex.slice(1,3),16),
      g = parseInt(hex.slice(3,5),16),
      b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function dot(cx, cy, color, r, glowing) {
  if (glowing) {
    ctx.fillStyle = hexAlpha(color, 0.18);
    ctx.beginPath(); ctx.arc(cx, cy, r + 9, 0, 2*Math.PI); ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, glowing ? r + 1 : r, 0, 2*Math.PI); ctx.fill();
}

function label(x, y, text, color, size) {
  size = size || 12;
  ctx.font = '600 ' + size + "px 'Geist Mono', ui-monospace, monospace";
  var tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(11,17,24,0.85)';
  ctx.fillRect(x - tw/2 - 5, y - size/2 - 4, tw + 10, size + 8);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b1118';
  ctx.fillRect(0, 0, W, H);

  var A  = ptOnCircle(tA), B  = ptOnCircle(tB), P  = ptOnCircle(tP);
  var Ac = toC(A.x, A.y),  Bc = toC(B.x, B.y),  Pc = toC(P.x, P.y);
  var ang = computeAngles();
  var cDeg = Math.round(ang.central  * 180 / Math.PI);
  var iDeg = Math.round(ang.inscribed * 180 / Math.PI);
  var mm   = minorMidAngle();

  // 1. Full circle outline
  ctx.beginPath();
  ctx.arc(CX, CY, R * S, 0, 2*Math.PI);
  ctx.strokeStyle = '#3a4a5a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 2. Minor arc highlight (yellow)
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = '#fff067';
  arcBetween(CX, CY, R * S, -tA, -tB);

  // 3. Dashed lines: O->A and O->B (blue)
  ctx.strokeStyle = 'rgba(0,171,250,0.55)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(CX, CY); ctx.lineTo(Ac.x, Ac.y);
  ctx.moveTo(CX, CY); ctx.lineTo(Bc.x, Bc.y);
  ctx.stroke();

  // 4. Dashed lines: P->A and P->B (green)
  ctx.strokeStyle = 'rgba(15,238,137,0.55)';
  ctx.beginPath();
  ctx.moveTo(Pc.x, Pc.y); ctx.lineTo(Ac.x, Ac.y);
  ctx.moveTo(Pc.x, Pc.y); ctx.lineTo(Bc.x, Bc.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 5. Solid blue arc at O (radius 44)
  ctx.strokeStyle = '#00abfa';
  ctx.lineWidth = 2.5;
  arcBetween(CX, CY, 44, -tA, -tB);

  // 6. Solid green arc at P (radius 34)
  var dPA = Math.atan2(Ac.y - Pc.y, Ac.x - Pc.x);
  var dPB = Math.atan2(Bc.y - Pc.y, Bc.x - Pc.x);
  ctx.strokeStyle = '#0fee89';
  ctx.lineWidth = 2.5;
  arcBetween(Pc.x, Pc.y, 34, dPA, dPB);

  // 7. Centre dot (yellow)
  ctx.fillStyle = '#fff067';
  ctx.beginPath(); ctx.arc(CX, CY, 5, 0, 2*Math.PI); ctx.fill();

  // 8. Draggable points
  dot(Ac.x, Ac.y, '#00abfa', 7, dragging === 'A' || hovering === 'A');
  dot(Bc.x, Bc.y, '#00abfa', 7, dragging === 'B' || hovering === 'B');
  dot(Pc.x, Pc.y, '#0fee89', 7, dragging === 'P' || hovering === 'P');

  // 9. Letter labels just outside circle
  var lo = R * S + 20;
  ctx.font = "700 14px 'Geist', sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#00abfa';
  ctx.fillText('A', CX + Math.cos(tA) * lo, CY - Math.sin(tA) * lo);
  ctx.fillText('B', CX + Math.cos(tB) * lo, CY - Math.sin(tB) * lo);
  ctx.fillStyle = '#0fee89';
  ctx.fillText('P', CX + Math.cos(tP) * lo, CY - Math.sin(tP) * lo);
  ctx.fillStyle = '#fff067';
  ctx.fillText('O', CX + 11, CY - 10);

  // 10. Angle value labels
  // Central: near O toward minor arc midpoint
  var cLx = CX + Math.cos(mm) * 78;
  var cLy = CY - Math.sin(mm) * 78;
  label(cLx, cLy, '∠AOB = ' + cDeg + '°', '#00abfa', 12);

  // Inscribed: near P, toward centre
  var iLx = Pc.x - Math.cos(tP) * 56;
  var iLy = Pc.y + Math.sin(tP) * 56;
  label(iLx, iLy, '∠APB = ' + iDeg + '°', '#0fee89', 12);

  // 11. Bottom banner (green box, translucent green border)
  var rel = cDeg + '°  =  2 ×  ' + iDeg + '°';
  ctx.font = "600 12px 'Geist Mono', ui-monospace, monospace";
  var rw = ctx.measureText(rel).width;
  var bx = W/2 - rw/2 - 14, by = H - 28, bw = rw + 28, bh = 22;
  ctx.fillStyle = 'rgba(15,238,137,0.08)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = 'rgba(15,238,137,0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  ctx.fillStyle = '#0fee89';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(rel, W/2, by + bh/2 + 0.5);

  // KaTeX heading with live values
  var tex = "\\textcolor{#00abfa}{\\angle AOB}"
          + " = 2 \\times \\textcolor{#0fee89}{\\angle APB}"
          + " \\;\\;\\Rightarrow\\;\\; "
          + "\\textcolor{#00abfa}{" + cDeg + "^\\circ}"
          + " = 2 \\times \\textcolor{#0fee89}{" + iDeg + "^\\circ}";
  tryRender(document.getElementById("formula"), tex);
}

// Interaction
var dragging = null, hovering = null;
var HIT = 18;

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var ev   = e.touches ? e.touches[0] : e;
  return {
    x: (ev.clientX - rect.left) * (W / rect.width),
    y: (ev.clientY - rect.top)  * (H / rect.height)
  };
}

function nearPoint(px, py, t) {
  var c = toC(R * Math.cos(t), R * Math.sin(t));
  var dx = px - c.x, dy = py - c.y;
  return Math.sqrt(dx*dx + dy*dy) < HIT;
}

function angleFromPos(px, py) {
  var m = fromC(px, py);
  return Math.atan2(m.my, m.mx);
}

canvas.addEventListener('mousedown', function(e) {
  var p = getPos(e);
  if      (nearPoint(p.x, p.y, tA)) dragging = 'A';
  else if (nearPoint(p.x, p.y, tB)) dragging = 'B';
  else if (nearPoint(p.x, p.y, tP)) dragging = 'P';
  if (dragging) e.preventDefault();
});

canvas.addEventListener('mousemove', function(e) {
  var p = getPos(e);
  if (dragging) {
    var t = angleFromPos(p.x, p.y);
    if      (dragging === 'A') setA(t);
    else if (dragging === 'B') setB(t);
    else if (dragging === 'P') setP(t);
    draw();
  } else {
    var prev = hovering;
    if      (nearPoint(p.x, p.y, tA)) hovering = 'A';
    else if (nearPoint(p.x, p.y, tB)) hovering = 'B';
    else if (nearPoint(p.x, p.y, tP)) hovering = 'P';
    else hovering = null;
    canvas.style.cursor = hovering ? 'grab' : 'default';
    if (hovering !== prev) draw();
  }
});

canvas.addEventListener('mouseup',    function() { dragging = null; });
canvas.addEventListener('mouseleave', function() {
  if (dragging || hovering) {
    dragging = hovering = null;
    canvas.style.cursor = 'default';
    draw();
  }
});

canvas.addEventListener('touchstart', function(e) {
  var p = getPos(e);
  if      (nearPoint(p.x, p.y, tA)) dragging = 'A';
  else if (nearPoint(p.x, p.y, tB)) dragging = 'B';
  else if (nearPoint(p.x, p.y, tP)) dragging = 'P';
  if (dragging) e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  if (!dragging) return;
  e.preventDefault();
  var p = getPos(e);
  var t = angleFromPos(p.x, p.y);
  if      (dragging === 'A') setA(t);
  else if (dragging === 'B') setB(t);
  else if (dragging === 'P') setP(t);
  draw();
}, { passive: false });

canvas.addEventListener('touchend', function() { dragging = null; });

// Initial render (also retry once KaTeX loads)
draw();
window.addEventListener('load', draw);

// postMessage resize hook
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
