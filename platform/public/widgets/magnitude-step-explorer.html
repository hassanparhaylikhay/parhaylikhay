<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Magnitude · Step Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .panel { display:flex; flex-direction:column; gap:8px; padding:14px 4px 4px; border-top:1px solid #141e2a; margin-top:10px; min-height:120px; }
  .eq-row { font-size:15px; line-height:1.5; color:#f0eeea; }
  .eq-row.tag { font-family:'Geist Mono',monospace; font-size:10.5px; color:#fff067; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:2px; font-weight:600; }
  .eq-row.ans { font-weight:700; font-size:16.5px; }
  .eq-row .katex { font-size:1em; }
  .eq-row.fade-in { animation: fade-up 0.42s ease forwards; opacity:0; }
  @keyframes fade-up { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  .nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; padding-top:10px; border-top:1px solid #141e2a; }
  .nav-btn { background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:6px 12px; border-radius:5px; cursor:pointer; transition: all 0.12s ease; }
  .nav-btn:hover:not(:disabled) { color:#fff067; border-color:#3a4a5a; }
  .nav-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .step-count { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }
  .step-count .cur { color:#fff067; }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 1.5px currentColor); }
    50%      { filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 10px currentColor); }
  }
  .glow { animation: pulse-glow 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">WORKED EXAMPLE</span>
    <span class="meta" id="meta"></span>
  </div>

  <svg id="stage" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-grid"></g>
    <g id="g-axes"></g>
    <g id="g-ticks"></g>
    <g id="g-legs"></g>
    <g id="g-vector"></g>
    <g id="g-points"></g>
    <g id="g-labels"></g>
  </svg>

  <div class="panel" id="panel"></div>

  <div class="nav">
    <button class="nav-btn" id="prev">← prev</button>
    <span class="step-count"><span class="cur" id="cur">1</span> / <span id="tot">5</span></span>
    <button class="nav-btn" id="next">next →</button>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  faint:  "#3a4a5a",
  grey:   "#7a7875",
  off:    "#f0eeea"
};

// Each preset describes a vector or a pair of points, and a list of steps.
// Step config keys (all optional):
//   tag         : monospace yellow header
//   lines       : array of TeX/text strings (rendered through KaTeX odd-segments style if $..$ present)
//   ans, marks  : final step convenience
//   show        : array of element ids visible this step. ids:
//                 "A", "B", "vector", "hLeg", "vLeg", "rightAngle",
//                 "legLabelX", "legLabelY", "hypLabel", "squares"
//   hypLabel    : TeX for the hypotenuse label (e.g. "|\\mathbf{a}|", "|\\vec{AB}|", "5")
//   legLabelX   : TeX
//   legLabelY   : TeX
//
// Geometry: A is the start point, B is the end. Vector = B - A.
// In "from-origin" presets, A = (0, 0).

var PRESETS = {
  "p1-magnitude-3-4": {
    title: "WORKED EXAMPLE · MAGNITUDE FROM A COLUMN",
    A: { x: 0, y: 0 },
    B: { x: 3, y: 4 },
    range: { xmin: -2, xmax: 7, ymin: -2, ymax: 6 },
    aLabel: "O",
    bLabel: "P",
    bColor: COL.pink,
    steps: [
      {
        tag: "STEP 1 · WHAT WE'RE GIVEN",
        lines: [
          "The vector $\\mathbf{a} = \\begin{pmatrix} 3 \\\\ 4 \\end{pmatrix}$ starts at the origin and ends at $P(3, 4)$.",
          "We want $|\\mathbf{a}|$: the length of the yellow arrow."
        ],
        show: ["A", "B", "vector"]
      },
      {
        tag: "STEP 2 · DROP A RIGHT TRIANGLE UNDER IT",
        lines: [
          "Drop a horizontal leg (blue) and a vertical leg (orange).",
          "The vector itself is the hypotenuse. A right angle sits where the legs meet."
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY"],
        legLabelX: "{\\color{#00abfa}3}",
        legLabelY: "{\\color{#ff822c}4}",
        hypLabel: "|\\mathbf{a}|"
      },
      {
        tag: "STEP 3 · APPLY PYTHAGORAS",
        lines: [
          "$|\\mathbf{a}|^{2} = 3^{2} + 4^{2}$",
          "$|\\mathbf{a}|^{2} = 9 + 16 = 25$"
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}3}",
        legLabelY: "{\\color{#ff822c}4}",
        hypLabel: "|\\mathbf{a}|"
      },
      {
        tag: "STEP 4 · TAKE THE SQUARE ROOT",
        lines: [
          "$|\\mathbf{a}| = \\sqrt{25} = 5$",
          "The arrow is exactly $5$ units long."
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}3}",
        legLabelY: "{\\color{#ff822c}4}",
        hypLabel: "{\\color{#fff067}5}"
      },
      {
        tag: "ANSWER",
        ans: "|\\mathbf{a}| = \\boxed{5}",
        marks: "[M1 for $\\sqrt{3^{2} + 4^{2}}$; A1 for $5$]",
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}3}",
        legLabelY: "{\\color{#ff822c}4}",
        hypLabel: "{\\color{#fff067}5}"
      }
    ]
  },

  "p1-magnitude-negatives": {
    title: "WORKED EXAMPLE · MAGNITUDE WITH NEGATIVES",
    A: { x: 0, y: 0 },
    B: { x: -1, y: -6 },
    range: { xmin: -4, xmax: 4, ymin: -7, ymax: 1 },
    aLabel: "O",
    bLabel: "P",
    bColor: COL.pink,
    steps: [
      {
        tag: "STEP 1 · WHAT WE'RE GIVEN",
        lines: [
          "$\\mathbf{v} = \\begin{pmatrix} -1 \\\\ -6 \\end{pmatrix}$, drawn from the origin.",
          "Find $|\\mathbf{v}|$."
        ],
        show: ["A", "B", "vector"]
      },
      {
        tag: "STEP 2 · DROP A RIGHT TRIANGLE",
        lines: [
          "Horizontal leg of length $1$ (left), vertical leg of length $6$ (down).",
          "The direction does not matter for length: a leg of $-1$ is still $1$ unit long."
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY"],
        legLabelX: "{\\color{#00abfa}-1}",
        legLabelY: "{\\color{#ff822c}-6}"
      },
      {
        tag: "STEP 3 · APPLY PYTHAGORAS",
        lines: [
          "$|\\mathbf{v}|^{2} = (-1)^{2} + (-6)^{2}$",
          "$(-1)^{2} = 1$ and $(-6)^{2} = 36$, so",
          "$|\\mathbf{v}|^{2} = 1 + 36 = 37$"
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}-1}",
        legLabelY: "{\\color{#ff822c}-6}",
        hypLabel: "|\\mathbf{v}|"
      },
      {
        tag: "STEP 4 · SQUARE ROOT",
        lines: [
          "$|\\mathbf{v}| = \\sqrt{37}$",
          "$\\sqrt{37} = 6.0827\\ldots$ which rounds to $6.08$ ($3$ s.f.)."
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}-1}",
        legLabelY: "{\\color{#ff822c}-6}",
        hypLabel: "{\\color{#fff067}6.08}"
      },
      {
        tag: "ANSWER",
        ans: "|\\mathbf{v}| = \\boxed{6.08}",
        marks: "[M1 for $\\sqrt{(-1)^{2} + (-6)^{2}}$; A1 for $6.08$ or better]",
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}-1}",
        legLabelY: "{\\color{#ff822c}-6}",
        hypLabel: "{\\color{#fff067}6.08}"
      }
    ]
  },

  "p2-distance-two-points": {
    title: "WORKED EXAMPLE · DISTANCE BETWEEN TWO POINTS",
    A: { x: 2, y: 3 },
    B: { x: 7, y: 9 },
    range: { xmin: 0, xmax: 9, ymin: 1, ymax: 10 },
    aLabel: "A",
    bLabel: "B",
    aColor: COL.blue,
    bColor: COL.pink,
    steps: [
      {
        tag: "STEP 1 · WHAT WE'RE GIVEN",
        lines: [
          "Points $A(2, 3)$ and $B(7, 9)$. Find the distance between them, i.e. $|\\vec{AB}|$."
        ],
        show: ["A", "B"]
      },
      {
        tag: "STEP 2 · FIND THE COLUMN VECTOR AB",
        lines: [
          "Image minus object, top then bottom.",
          "$\\vec{AB} = \\begin{pmatrix} 7 - 2 \\\\ 9 - 3 \\end{pmatrix} = \\begin{pmatrix} 5 \\\\ 6 \\end{pmatrix}$"
        ],
        show: ["A", "B", "vector"]
      },
      {
        tag: "STEP 3 · DROP A RIGHT TRIANGLE",
        lines: [
          "From $A$, go $5$ across (blue) and $6$ up (orange).",
          "$\\vec{AB}$ is the hypotenuse."
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY"],
        legLabelX: "{\\color{#00abfa}5}",
        legLabelY: "{\\color{#ff822c}6}"
      },
      {
        tag: "STEP 4 · APPLY PYTHAGORAS",
        lines: [
          "$|\\vec{AB}|^{2} = 5^{2} + 6^{2} = 25 + 36 = 61$",
          "$|\\vec{AB}| = \\sqrt{61} = 7.8102\\ldots$"
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}5}",
        legLabelY: "{\\color{#ff822c}6}",
        hypLabel: "|\\vec{AB}|"
      },
      {
        tag: "ANSWER",
        ans: "|\\vec{AB}| = \\boxed{7.81}",
        marks: "[M1 for $\\sqrt{5^{2} + 6^{2}}$; A1 for $7.81$ or $\\sqrt{61}$]",
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}5}",
        legLabelY: "{\\color{#ff822c}6}",
        hypLabel: "{\\color{#fff067}7.81}"
      }
    ]
  },

  "review-comprehensive": {
    title: "COMPREHENSIVE WORKED EXAMPLE",
    A: { x: -3, y: 5 },
    B: { x: 1, y: -3 },
    range: { xmin: -5, xmax: 5, ymin: -5, ymax: 7 },
    aLabel: "A",
    bLabel: "B",
    aColor: COL.blue,
    bColor: COL.pink,
    steps: [
      {
        tag: "STEP 1 · WHAT WE'RE GIVEN",
        lines: [
          "Points $A(-3, 5)$ and $B(1, -3)$.",
          "Part (a): find the column vector $\\vec{AB}$.",
          "Part (b): find $|\\vec{AB}|$, the distance from $A$ to $B$."
        ],
        show: ["A", "B"]
      },
      {
        tag: "STEP 2 · COLUMN VECTOR AB",
        lines: [
          "$\\vec{AB} = B - A = \\begin{pmatrix} 1 - (-3) \\\\ -3 - 5 \\end{pmatrix} = \\begin{pmatrix} 4 \\\\ -8 \\end{pmatrix}$",
          "So $\\vec{AB} = \\begin{pmatrix} 4 \\\\ -8 \\end{pmatrix}$."
        ],
        show: ["A", "B", "vector"]
      },
      {
        tag: "STEP 3 · RIGHT TRIANGLE FROM A",
        lines: [
          "Walk $4$ across to the right (blue), then $8$ down (orange).",
          "The vector is the hypotenuse."
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY"],
        legLabelX: "{\\color{#00abfa}4}",
        legLabelY: "{\\color{#ff822c}-8}"
      },
      {
        tag: "STEP 4 · PYTHAGORAS FOR THE MAGNITUDE",
        lines: [
          "$|\\vec{AB}|^{2} = 4^{2} + (-8)^{2} = 16 + 64 = 80$",
          "$|\\vec{AB}| = \\sqrt{80} = 8.944\\ldots$"
        ],
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}4}",
        legLabelY: "{\\color{#ff822c}-8}",
        hypLabel: "|\\vec{AB}|"
      },
      {
        tag: "ANSWER",
        ans: "\\vec{AB} = \\begin{pmatrix} 4 \\\\ -8 \\end{pmatrix},\\quad |\\vec{AB}| = \\boxed{8.94}",
        marks: "(a) [B2 for both components, B1 for one] · (b) [M1 for $\\sqrt{4^{2} + (-8)^{2}}$; A1 for $8.94$ or $\\sqrt{80}$ or $4\\sqrt{5}$]",
        show: ["A", "B", "vector", "hLeg", "vLeg", "rightAngle", "legLabelX", "legLabelY", "hypLabel"],
        legLabelX: "{\\color{#00abfa}4}",
        legLabelY: "{\\color{#ff822c}-8}",
        hypLabel: "{\\color{#fff067}8.94}"
      }
    ]
  }
};

function getPreset(){
  var params = new URLSearchParams(window.location.search);
  var key = params.get("preset") || "p1-magnitude-3-4";
  return PRESETS[key] || PRESETS["p1-magnitude-3-4"];
}

var PRESET = getPreset();
var STEP = 0;

// world (per preset)
var SVG_W = 480, SVG_H = 320;
var X_MIN = PRESET.range.xmin, X_MAX = PRESET.range.xmax;
var Y_MIN = PRESET.range.ymin, Y_MAX = PRESET.range.ymax;
var pxPerX = SVG_W / (X_MAX - X_MIN);
var pxPerY = SVG_H / (Y_MAX - Y_MIN);
var UNIT = Math.min(pxPerX, pxPerY);
var ORIGIN_PX = {
  x: (SVG_W - (X_MAX - X_MIN) * UNIT) / 2 - X_MIN * UNIT,
  y: SVG_H - (-Y_MIN) * UNIT - (SVG_H - (Y_MAX - Y_MIN) * UNIT) / 2
};
function toSx(x){ return ORIGIN_PX.x + x * UNIT; }
function toSy(y){ return ORIGIN_PX.y - y * UNIT; }

// KaTeX
function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}
function svgKaTeXLabel(parent, x, y, tex, color, align){
  align = align || "center";
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - 50); fo.setAttribute("y", y - 11);
  fo.setAttribute("width", 100); fo.setAttribute("height", 22);
  fo.style.overflow = "visible"; fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px"; div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host"; div.style.color = color || COL.off;
  fo.appendChild(div); parent.appendChild(fo);
  tryRender(div, tex);
}

function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function drawGridAxes(){
  var gG = document.getElementById("g-grid");
  var gA = document.getElementById("g-axes");
  var gT = document.getElementById("g-ticks");
  clear(gG); clear(gA); clear(gT);
  for (var x = Math.ceil(X_MIN); x <= X_MAX; x++){
    var l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1", toSx(x)); l.setAttribute("x2", toSx(x));
    l.setAttribute("y1", toSy(Y_MIN)); l.setAttribute("y2", toSy(Y_MAX));
    l.setAttribute("stroke", "#141e2a"); l.setAttribute("stroke-width", 0.7);
    gG.appendChild(l);
  }
  for (var y = Math.ceil(Y_MIN); y <= Y_MAX; y++){
    var l2 = document.createElementNS("http://www.w3.org/2000/svg","line");
    l2.setAttribute("y1", toSy(y)); l2.setAttribute("y2", toSy(y));
    l2.setAttribute("x1", toSx(X_MIN)); l2.setAttribute("x2", toSx(X_MAX));
    l2.setAttribute("stroke", "#141e2a"); l2.setAttribute("stroke-width", 0.7);
    gG.appendChild(l2);
  }
  if (Y_MIN <= 0 && Y_MAX >= 0){
    var ax = document.createElementNS("http://www.w3.org/2000/svg","line");
    ax.setAttribute("x1", toSx(X_MIN)); ax.setAttribute("x2", toSx(X_MAX));
    ax.setAttribute("y1", toSy(0)); ax.setAttribute("y2", toSy(0));
    ax.setAttribute("stroke", COL.faint); ax.setAttribute("stroke-width", 1.2);
    gA.appendChild(ax);
  }
  if (X_MIN <= 0 && X_MAX >= 0){
    var ay = document.createElementNS("http://www.w3.org/2000/svg","line");
    ay.setAttribute("y1", toSy(Y_MIN)); ay.setAttribute("y2", toSy(Y_MAX));
    ay.setAttribute("x1", toSx(0)); ay.setAttribute("x2", toSx(0));
    ay.setAttribute("stroke", COL.faint); ay.setAttribute("stroke-width", 1.2);
    gA.appendChild(ay);
  }
  for (var xt = Math.ceil(X_MIN); xt <= X_MAX; xt++){
    if (xt === 0) continue;
    var yAxis = (Y_MIN <= 0 && Y_MAX >= 0) ? 0 : Y_MIN;
    svgKaTeXLabel(gT, toSx(xt), toSy(yAxis) + 11, String(xt), COL.grey);
  }
  for (var yt = Math.ceil(Y_MIN); yt <= Y_MAX; yt++){
    if (yt === 0) continue;
    var xAxis = (X_MIN <= 0 && X_MAX >= 0) ? 0 : X_MIN;
    svgKaTeXLabel(gT, toSx(xAxis) - 12, toSy(yt), String(yt), COL.grey);
  }
}

function drawArrow(g, fromPt, toPt, color, width){
  var x1 = toSx(fromPt.x), y1 = toSy(fromPt.y);
  var x2 = toSx(toPt.x),   y2 = toSy(toPt.y);
  var dx = x2 - x1, dy = y2 - y1;
  var L = Math.sqrt(dx*dx + dy*dy);
  if (L < 4) return;
  var ux = dx / L, uy = dy / L;
  var head = 11;
  var bx = x2 - ux * head, by = y2 - uy * head;
  var ln = document.createElementNS("http://www.w3.org/2000/svg","line");
  ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
  ln.setAttribute("x2", bx); ln.setAttribute("y2", by);
  ln.setAttribute("stroke", color); ln.setAttribute("stroke-width", width);
  ln.setAttribute("stroke-linecap", "round");
  g.appendChild(ln);
  var w = 6;
  var tri = document.createElementNS("http://www.w3.org/2000/svg","path");
  tri.setAttribute("d", "M " + x2 + " " + y2 +
    " L " + (x2 - ux*head + uy*w) + " " + (y2 - uy*head - ux*w) +
    " L " + (x2 - ux*head - uy*w) + " " + (y2 - uy*head + ux*w) + " Z");
  tri.setAttribute("fill", color);
  g.appendChild(tri);
}

function drawRightAngleMarker(g, cx, cy, dxSign, dySign){
  var s = 10;
  var hx = dxSign * s, hy = -dySign * s;
  var path = "M " + (cx + hx) + " " + cy +
             " L " + (cx + hx) + " " + (cy + hy) +
             " L " + cx + " " + (cy + hy);
  var p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", path);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", COL.grey);
  p.setAttribute("stroke-width", 1.3);
  p.setAttribute("opacity", 0.9);
  g.appendChild(p);
}

function drawScene(){
  var gLegs = document.getElementById("g-legs");
  var gVec = document.getElementById("g-vector");
  var gPts = document.getElementById("g-points");
  var gLab = document.getElementById("g-labels");
  clear(gLegs); clear(gVec); clear(gPts); clear(gLab);

  var step = PRESET.steps[STEP];
  var show = (step.show || []).reduce(function(a, k){ a[k] = true; return a; }, {});
  var A = PRESET.A, B = PRESET.B;
  var dx = B.x - A.x, dy = B.y - A.y;
  var corner = { x: A.x + dx, y: A.y };

  // Legs
  if (show.hLeg && Math.abs(dx) > 0.1){
    var hLeg = document.createElementNS("http://www.w3.org/2000/svg","line");
    hLeg.setAttribute("x1", toSx(A.x)); hLeg.setAttribute("y1", toSy(A.y));
    hLeg.setAttribute("x2", toSx(corner.x)); hLeg.setAttribute("y2", toSy(corner.y));
    hLeg.setAttribute("stroke", COL.blue);
    hLeg.setAttribute("stroke-width", 2);
    hLeg.setAttribute("stroke-dasharray", "5 4");
    gLegs.appendChild(hLeg);
  }
  if (show.vLeg && Math.abs(dy) > 0.1){
    var vLeg = document.createElementNS("http://www.w3.org/2000/svg","line");
    vLeg.setAttribute("x1", toSx(corner.x)); vLeg.setAttribute("y1", toSy(corner.y));
    vLeg.setAttribute("x2", toSx(B.x)); vLeg.setAttribute("y2", toSy(B.y));
    vLeg.setAttribute("stroke", COL.orange);
    vLeg.setAttribute("stroke-width", 2);
    vLeg.setAttribute("stroke-dasharray", "5 4");
    gLegs.appendChild(vLeg);
  }
  if (show.rightAngle && Math.abs(dx) > 0.4 && Math.abs(dy) > 0.4){
    drawRightAngleMarker(gLegs, toSx(corner.x), toSy(corner.y),
      dx >= 0 ? -1 : 1, dy >= 0 ? 1 : -1);
  }

  // Leg labels
  if (show.legLabelX && step.legLabelX){
    svgKaTeXLabel(gLab, toSx((A.x + corner.x) / 2),
      toSy(A.y) + (dy >= 0 ? 14 : -14),
      step.legLabelX, COL.blue, "center");
  }
  if (show.legLabelY && step.legLabelY){
    svgKaTeXLabel(gLab, toSx(corner.x) + (dx >= 0 ? 16 : -16),
      toSy((corner.y + B.y) / 2),
      step.legLabelY, COL.orange, "center");
  }

  // Vector (hypotenuse) arrow
  if (show.vector){
    drawArrow(gVec, A, B, COL.yellow, 2.8);
  }

  // Hypotenuse label
  if (show.hypLabel && step.hypLabel){
    var midx = (A.x + B.x) / 2, midy = (A.y + B.y) / 2;
    var L = Math.sqrt(dx*dx + dy*dy);
    var nx = -dy / L, ny = dx / L;
    var towardCorner = { x: corner.x - midx, y: corner.y - midy };
    if (nx * towardCorner.x + ny * towardCorner.y > 0){ nx = -nx; ny = -ny; }
    var off = 0.62;
    svgKaTeXLabel(gLab, toSx(midx + nx * off), toSy(midy + ny * off),
      step.hypLabel, COL.yellow, "center");
  }

  // Points
  function drawPt(host, pt, color, label){
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
    c.setAttribute("r", 6); c.setAttribute("fill", color);
    c.setAttribute("stroke", "#0b1118"); c.setAttribute("stroke-width", 1.5);
    host.appendChild(c);
    // Label sits away from the corner of the right triangle
    var off = 16;
    var lblX = toSx(pt.x);
    var lblY = toSy(pt.y);
    if (pt === A){
      lblX -= (dx >= 0 ? off : -off);
      lblY += (dy >= 0 ? off : -off);
    } else {
      lblX += (dx >= 0 ? off : -off);
      lblY -= (dy >= 0 ? off : -off);
    }
    var lblText = (label === "O") ? "O" : label + "(" + pt.x + ",\\, " + pt.y + ")";
    svgKaTeXLabel(host, lblX, lblY, lblText, color, "center");
  }

  if (show.A){
    drawPt(gPts, A, PRESET.aColor || COL.grey, PRESET.aLabel);
  }
  if (show.B){
    drawPt(gPts, B, PRESET.bColor || COL.pink, PRESET.bLabel);
  }
}

function renderMixed(target, str){
  // split on $ delimiters; even indices = text, odd = TeX
  target.innerHTML = "";
  var parts = String(str).split("$");
  for (var i = 0; i < parts.length; i++){
    if (i % 2 === 0){
      target.appendChild(document.createTextNode(parts[i]));
    } else {
      var span = document.createElement("span");
      tryRender(span, parts[i]);
      target.appendChild(span);
    }
  }
}

function renderPanel(){
  var panel = document.getElementById("panel");
  panel.innerHTML = "";
  var step = PRESET.steps[STEP];
  if (step.tag){
    var t = document.createElement("div");
    t.className = "eq-row tag fade-in";
    t.textContent = step.tag;
    panel.appendChild(t);
  }
  var delay = 60;
  if (step.lines){
    step.lines.forEach(function(line, i){
      var d = document.createElement("div");
      d.className = "eq-row fade-in";
      d.style.animationDelay = (delay + i * 60) + "ms";
      renderMixed(d, line);
      panel.appendChild(d);
    });
    delay += step.lines.length * 60;
  }
  if (step.ans){
    var a = document.createElement("div");
    a.className = "eq-row ans fade-in";
    a.style.animationDelay = delay + "ms";
    tryRender(a, step.ans);
    panel.appendChild(a);
    delay += 60;
  }
  if (step.marks){
    var m = document.createElement("div");
    m.className = "eq-row fade-in";
    m.style.animationDelay = delay + "ms";
    m.style.color = "#7a7875";
    m.style.fontSize = "12.5px";
    renderMixed(m, step.marks);
    panel.appendChild(m);
  }
}

function render(){
  drawScene();
  renderPanel();
  document.getElementById("cur").textContent = (STEP + 1);
  document.getElementById("prev").disabled = (STEP === 0);
  document.getElementById("next").disabled = (STEP === PRESET.steps.length - 1);
  notifyHeight();
}

document.getElementById("prev").addEventListener("click", function(){
  if (STEP > 0){ STEP--; render(); }
});
document.getElementById("next").addEventListener("click", function(){
  if (STEP < PRESET.steps.length - 1){ STEP++; render(); }
});

document.getElementById("title").textContent = PRESET.title;
document.getElementById("tot").textContent = PRESET.steps.length;

function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

drawGridAxes();
render();
setTimeout(notifyHeight, 200);
</script>
