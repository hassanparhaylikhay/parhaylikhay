<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Volume Cube</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:24px 22px 20px; }

  .header {
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
    letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:14px;
  }

  /* The cube is a fixed-pixel size (S × S × S) so translateZ uses pixel
     values (translateZ percentages are invalid CSS). The .cube-stage
     wrapper provides a responsive viewport with perspective. */
  .cube-stage {
    width:100%; max-width:300px; margin:0 auto; aspect-ratio: 1.05;
    perspective: 900px; perspective-origin: 50% 35%;
    position:relative; cursor:pointer; user-select:none;
  }
  .cube {
    position:absolute; left:50%; top:50%;
    width:180px; height:180px;
    transform-style: preserve-3d;
    transform: translate(-50%, -50%) rotateX(-23deg) rotateY(-30deg);
    transition: transform 0.25s ease;
  }
  .cube-stage:hover .cube { transform: translate(-50%, -50%) rotateX(-23deg) rotateY(-26deg); }
  .face {
    position:absolute; inset:0;
    border: 1.5px solid #00abfa;
    background: rgba(0,171,250,0.06);
  }
  .face .grid {
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.7s ease;
  }
  .face .grid.shown { opacity:1; }

  /* S = 180 px; faces translate ±S/2 = 90 px into / out of their plane. */
  .face.front  { transform: translateZ(90px); }
  .face.right  { transform: rotateY(90deg) translateZ(90px); background: rgba(0,171,250,0.10); }
  .face.top    { transform: rotateX(90deg) translateZ(90px); background: rgba(0,171,250,0.04); }

  .center-overlay {
    position:absolute; left:50%; top:62%; transform:translate(-50%,-50%);
    font-family:'Geist Mono',monospace; font-size:13px; font-weight:700;
    color:#7a7875; letter-spacing:1px; pointer-events:none;
    text-align:center; line-height:1.4;
    transition: opacity 0.4s ease;
  }
  .cube-stage.gridded .center-overlay { opacity:0; }

  .equation-line {
    text-align:center; margin-top:14px;
    font-family:'Geist Mono',monospace; font-size:15px; color:#f0eeea;
    line-height:1.6; min-height:24px;
  }
  .equation-line .ans { color:#0fee89; font-weight:700; }
  .equation-line .small { display:block; font-size:11px; color:#7a7875; margin-top:4px; letter-spacing:0.4px; }

  .pair-row {
    display:flex; gap:6px; justify-content:center; margin-top:18px; flex-wrap:wrap;
  }
  .pair-row .pair {
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
    padding:6px 12px; border-radius:14px;
    border:1px solid #141e2a; background:transparent;
    cursor:pointer; user-select:none; letter-spacing:0.4px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .pair-row .pair:hover { color:#00abfa; border-color:#3a4a5a; }
  .pair-row .pair.active { color:#00abfa; border-color:#00abfa; background: rgba(0,171,250,0.08); }

  .footer {
    margin-top:14px; font-family:'Geist Mono',monospace; font-size:10px;
    color:#3a4a5a; text-align:center; letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="header">VOLUME = LENGTH CUBED</div>
  <div class="cube-stage" id="stage">
    <div class="cube">
      <div class="face front"><div class="grid" data-face="front"></div></div>
      <div class="face right"><div class="grid" data-face="right"></div></div>
      <div class="face top"><div class="grid" data-face="top"></div></div>
    </div>
    <div class="center-overlay" id="overlay">tap to reveal</div>
  </div>
  <div class="equation-line" id="equation"></div>
  <div class="pair-row" id="pairRow">
    <span class="pair" data-pair="mm-cm">mm³ ↔ cm³</span>
    <span class="pair active" data-pair="cm-m">cm³ ↔ m³</span>
  </div>
  <div class="footer">tap the cube to reveal the grid</div>
</div>

<script>
"use strict";

var PAIRS = {
  "mm-cm": {
    big: "1 cm³",
    linearFactor: 10,
    gridLines: 10,
    afterEquation: '1 cm³ = 10 × 10 × 10 = <span class="ans">1000 mm³</span>',
    smallCount: 1000,
    smallUnit: "mm³"
  },
  "cm-m": {
    big: "1 m³",
    linearFactor: 100,
    gridLines: 100,
    afterEquation: '1 m³ = 100 × 100 × 100 = <span class="ans">1,000,000 cm³</span>',
    smallCount: 1000000,
    smallUnit: "cm³"
  }
};

var state = { pair: "cm-m", revealed: false, animToken: 0 };

var stage      = document.getElementById("stage");
var overlay    = document.getElementById("overlay");
var equationEl = document.getElementById("equation");
var pairRow    = document.getElementById("pairRow");
var grids      = document.querySelectorAll(".grid");

function applyPair() {
  var p = PAIRS[state.pair];
  // Grid pattern
  for (var i = 0; i < grids.length; i++) {
    grids[i].style.background =
      "linear-gradient(to right, rgba(0,171,250,0.45) 1px, transparent 1px)," +
      "linear-gradient(to bottom, rgba(0,171,250,0.45) 1px, transparent 1px)";
    grids[i].style.backgroundSize = (100 / p.gridLines) + "% " + (100 / p.gridLines) + "%";
    grids[i].classList.remove("shown");
  }
  state.revealed = false;
  stage.classList.remove("gridded");
  overlay.textContent = "tap to reveal";
  overlay.style.opacity = "1";
  renderEquation(0);
  var btns = pairRow.querySelectorAll(".pair");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("active", btns[i].dataset.pair === state.pair);
  }
  reportHeight();
}

function renderEquation(count) {
  var p = PAIRS[state.pair];
  if (count === 0) {
    equationEl.innerHTML = '<span style="color:#3a4a5a">' + p.big + ' = ?</span>';
  } else {
    equationEl.innerHTML = p.afterEquation +
      '<span class="small">small ' + p.smallUnit + ' counted: ' + count.toLocaleString() + '</span>';
  }
}

function animateTicker(target, durationMs) {
  state.animToken++;
  var token = state.animToken;
  var start = performance.now();
  function tick(now) {
    if (token !== state.animToken) return;
    var t = Math.min(1, (now - start) / durationMs);
    var eased = 1 - Math.pow(1 - t, 3);
    var v = Math.floor(target * eased);
    renderEquation(v);
    if (t < 1) requestAnimationFrame(tick); else renderEquation(target);
  }
  requestAnimationFrame(tick);
}

function toggleReveal() {
  state.revealed = !state.revealed;
  if (state.revealed) {
    for (var i = 0; i < grids.length; i++) grids[i].classList.add("shown");
    stage.classList.add("gridded");
    animateTicker(PAIRS[state.pair].smallCount, 1100);
  } else {
    for (var i = 0; i < grids.length; i++) grids[i].classList.remove("shown");
    stage.classList.remove("gridded");
    state.animToken++;
    renderEquation(0);
  }
}

stage.addEventListener("click", toggleReveal);
pairRow.addEventListener("click", function(e) {
  var pairEl = e.target.closest("[data-pair]");
  if (!pairEl) return;
  state.pair = pairEl.dataset.pair;
  applyPair();
});

applyPair();

// === Height reporter ====================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
