<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Volume Cube</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:12px; }
  .formula { font-size:14.5px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .toggles {
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:0 4px; margin-bottom:12px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .toggle-row { display:flex; align-items:center; gap:8px; }
  .toggle-row .name { color:#fff067; font-weight:600; }
  .toggle-row select {
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px;
    padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer;
  }
  .toggle-row select:focus { border-color:#00abfa; }

  .cube-stage {
    width:100%; max-width:280px; margin:0 auto; aspect-ratio: 1.05;
    perspective: 900px; perspective-origin: 50% 35%;
    position:relative; cursor:pointer; user-select:none;
  }
  .cube {
    position:absolute; left:50%; top:50%;
    width:170px; height:170px;
    transform-style: preserve-3d;
    transform: translate(-50%, -50%) rotateX(-23deg) rotateY(-30deg);
    transition: transform 0.25s ease;
  }
  .cube-stage:hover .cube { transform: translate(-50%, -50%) rotateX(-23deg) rotateY(-26deg); }
  .face {
    position:absolute; inset:0;
    border: 1.5px solid #00abfa;
    background: rgba(0,171,250,0.08);
  }
  .face .grid {
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.7s ease;
  }
  .face .grid.shown { opacity:1; }

  /* S = 170 px; faces translate ±S/2 = 85 px into / out of their plane. */
  .face.front  { transform: translateZ(85px); }
  .face.right  { transform: rotateY(90deg) translateZ(85px); background: rgba(0,171,250,0.14); }
  .face.top    { transform: rotateX(90deg) translateZ(85px); background: rgba(0,171,250,0.05); }

  .center-overlay {
    position:absolute; left:50%; top:62%; transform:translate(-50%,-50%);
    pointer-events:none; text-align:center; line-height:1.4;
    transition: opacity 0.4s ease;
  }
  .center-overlay .big { font-size:18px; }
  .center-overlay .big .katex { color:#00abfa; font-size:1em; }
  .center-overlay .small {
    display:block; font-family:'Geist Mono',monospace; font-size:10.5px;
    color:#7a7875; font-weight:500; letter-spacing:1px; margin-top:8px;
  }
  .cube-stage.gridded .center-overlay { opacity:0; }

  .equation-line {
    text-align:center; margin-top:14px; min-height:24px;
    font-size:14.5px; color:#f0eeea; line-height:1.55;
  }
  .equation-line .katex { font-size:1em; }
  .equation-line .small {
    display:block; font-family:'Geist Mono',monospace; font-size:10.5px;
    color:#7a7875; margin-top:4px; letter-spacing:0.4px;
  }

  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fHeader"></span>
  </div>

  <div class="toggles">
    <div class="toggle-row">
      <span class="name">pair</span>
      <select id="pairSel">
        <option value="mm-cm">mm³ ↔ cm³</option>
        <option value="cm-m" selected>cm³ ↔ m³</option>
      </select>
    </div>
  </div>

  <div class="cube-stage" id="stage">
    <div class="cube">
      <div class="face front"><div class="grid" data-face="front"></div></div>
      <div class="face right"><div class="grid" data-face="right"></div></div>
      <div class="face top"><div class="grid" data-face="top"></div></div>
    </div>
    <div class="center-overlay" id="overlay">
      <span class="big" id="overlayBig"></span>
      <span class="small">tap to reveal</span>
    </div>
  </div>

  <div class="equation-line" id="equation"></div>

  <p class="footer">tap the cube to reveal the grid</p>
</div>

<script>
"use strict";

var PAIRS = {
  "mm-cm": {
    bigTex: "1\\;\\text{cm}^{3}",
    headerTex: "1\\;\\text{cm}^{3} = 10 \\times 10 \\times 10 = 1000\\;\\text{mm}^{3}",
    afterTex: "1\\;\\text{cm}^{3} = 10 \\times 10 \\times 10 = {\\color{#0fee89}1000\\;\\text{mm}^{3}}",
    gridLines: 10,
    smallCount: 1000,
    smallUnit: "mm³"
  },
  "cm-m": {
    bigTex: "1\\;\\text{m}^{3}",
    headerTex: "1\\;\\text{m}^{3} = 100 \\times 100 \\times 100 = 1{,}000{,}000\\;\\text{cm}^{3}",
    afterTex: "1\\;\\text{m}^{3} = 100 \\times 100 \\times 100 = {\\color{#0fee89}1{,}000{,}000\\;\\text{cm}^{3}}",
    gridLines: 100,
    smallCount: 1000000,
    smallUnit: "cm³"
  }
};

var state = { pair: "cm-m", revealed: false, animToken: 0 };

var fHeader    = document.getElementById("fHeader");
var stage      = document.getElementById("stage");
var overlayBig = document.getElementById("overlayBig");
var equationEl = document.getElementById("equation");
var pairSel    = document.getElementById("pairSel");
var grids      = document.querySelectorAll(".grid");

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

function applyPair() {
  var p = PAIRS[state.pair];
  tryRender(fHeader, p.headerTex);
  tryRender(overlayBig, p.bigTex);
  for (var i = 0; i < grids.length; i++) {
    grids[i].style.background =
      "linear-gradient(to right, rgba(0,171,250,0.45) 1px, transparent 1px)," +
      "linear-gradient(to bottom, rgba(0,171,250,0.45) 1px, transparent 1px)";
    grids[i].style.backgroundSize = (100 / p.gridLines) + "% " + (100 / p.gridLines) + "%";
    grids[i].classList.remove("shown");
  }
  state.revealed = false;
  stage.classList.remove("gridded");
  renderEquation(0);
  reportHeight();
}

function renderEquation(count) {
  var p = PAIRS[state.pair];
  if (count === 0) {
    equationEl.innerHTML = '<span class="katex-host"></span>';
    var host = equationEl.querySelector(".katex-host");
    tryRender(host, "{\\color{#3a4a5a}" + p.bigTex + " = ?}");
  } else {
    equationEl.innerHTML =
      '<span class="katex-host"></span>' +
      '<span class="small">small ' + p.smallUnit + ' counted: ' + count.toLocaleString() + '</span>';
    var host2 = equationEl.querySelector(".katex-host");
    tryRender(host2, p.afterTex);
  }
}

function animateTicker(target, durationMs) {
  state.animToken++;
  var token = state.animToken;
  var start = performance.now();
  function tick(now) {
    if (token !== state.animToken) return;
    var t = Math.min(1, (now - start) / durationMs);
    var eased = 1 - Math.pow(1 - t, 3);
    var v = Math.floor(target * eased);
    renderEquation(v);
    if (t < 1) requestAnimationFrame(tick); else renderEquation(target);
  }
  requestAnimationFrame(tick);
}

function toggleReveal() {
  state.revealed = !state.revealed;
  if (state.revealed) {
    for (var i = 0; i < grids.length; i++) grids[i].classList.add("shown");
    stage.classList.add("gridded");
    animateTicker(PAIRS[state.pair].smallCount, 1100);
  } else {
    for (var i = 0; i < grids.length; i++) grids[i].classList.remove("shown");
    stage.classList.remove("gridded");
    state.animToken++;
    renderEquation(0);
  }
}

stage.addEventListener("click", toggleReveal);
pairSel.addEventListener("change", function() {
  state.pair = pairSel.value;
  applyPair();
});

applyPair();

// === Height reporter ====================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
