<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Angles in the Same Segment</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:22px; }
  .formula { font-size:16px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .canvas-holder { display:flex; justify-content:center; }
  canvas { display:block; cursor:default; max-width:100%; height:auto; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="canvas-holder">
    <canvas id="c" width="560" height="380"></canvas>
  </div>

  <p class="footer">drag A, B, P, or Q: P and Q stay in the same segment, both angles always equal</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var canvas = document.getElementById('c');
var ctx    = canvas.getContext('2d');
var W = 560, H = 380;

var DPR = window.devicePixelRatio || 1;
canvas.width        = W * DPR;
canvas.height       = H * DPR;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

var CX = W / 2;
var CY = H / 2 + 4;
var R  = 3;
var S  = 50;

function toC(mx, my)   { return { x: CX + mx * S,   y: CY - my * S }; }
function fromC(cx, cy) { return { mx: (cx - CX) / S, my: (CY - cy) / S }; }
function ptOnCircle(t) { return { x: R * Math.cos(t), y: R * Math.sin(t) }; }

function N(a) { return ((a % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI); }

// Initial point angles. A and B form the chord (lower).
// P and Q both on the major-arc side (upper).
var tA = N(200 * Math.PI / 180);
var tB = N(340 * Math.PI / 180);
var tP = N(120 * Math.PI / 180);
var tQ = N( 55 * Math.PI / 180);

// "Major arc" here is the one NOT between A and B going through the minor arc.
// For the same-segment widget, we treat one side of chord AB as "the segment"
// where P and Q must live. We define the segment as the longer arc (major arc).
function minorIsCCW() { return N(tB - tA) <= Math.PI; }

function isOnMinorArc(t) {
  t = N(t);
  var a = N(tA), b = N(tB), d = N(b - a);
  return d <= Math.PI
    ? N(t - a) < d
    : N(t - b) < (2*Math.PI - d);
}

// Clamp a point t to the major-arc side (off the minor-arc side, with a buffer).
function clampToMajor(t) {
  t = N(t);
  if (!isOnMinorArc(t)) return t;
  var EPS = 0.13;
  var a = N(tA), b = N(tB);
  var da = N(t - a); if (da > Math.PI) da = 2*Math.PI - da;
  var db = N(t - b); if (db > Math.PI) db = 2*Math.PI - db;
  var ccw = minorIsCCW();
  if (da <= db) return ccw ? N(a - EPS) : N(a + EPS);
  else          return ccw ? N(b + EPS) : N(b - EPS);
}

// Signed angular distance along the major arc starting from one chord endpoint.
// We use this to compare P vs Q ordering along the major arc and enforce min sep.
function majorArcParam(t) {
  // Returns parameter in [0, majorLen) measuring distance along the major arc
  // starting from the "start" endpoint of the major arc.
  // The major arc goes from A to B the long way round (or B to A, equivalent).
  var a = N(tA), b = N(tB), d = N(b - a);
  // Major arc length:
  var majorLen = d <= Math.PI ? (2*Math.PI - d) : d;
  // Major arc starts at b if minor goes CCW (a -> b), so major goes b -> a CCW.
  // If minor goes CW (i.e. a -> b CCW is the LONG way), then major goes a -> b CCW.
  var ccwMinor = d <= Math.PI;
  if (ccwMinor) {
    // major: from b CCW to a
    var s = N(t - b);
    return Math.min(s, majorLen); // clamp visually
  } else {
    // major: from a CCW to b
    var s = N(t - a);
    return Math.min(s, majorLen);
  }
}

var MIN_SEP = 20 * Math.PI / 180; // A,B
var PQ_SEP  = 10 * Math.PI / 180; // P,Q

function setA(t) {
  var d = N(t - tB); if (d > Math.PI) d = 2*Math.PI - d;
  if (d >= MIN_SEP) {
    tA = N(t);
    tP = clampToMajor(tP);
    tQ = clampToMajor(tQ);
    enforcePQ();
  }
}
function setB(t) {
  var d = N(t - tA); if (d > Math.PI) d = 2*Math.PI - d;
  if (d >= MIN_SEP) {
    tB = N(t);
    tP = clampToMajor(tP);
    tQ = clampToMajor(tQ);
    enforcePQ();
  }
}

// Try to set P to the new angle; if too close to Q, slide it minimally.
function setP(t) {
  var nt = clampToMajor(N(t));
  // If too close to Q, push away
  var d = N(nt - tQ); if (d > Math.PI) d = 2*Math.PI - d;
  if (d < PQ_SEP) {
    // Decide push direction along major arc by checking which side keeps it major.
    var pushed = pushAway(nt, tQ, PQ_SEP);
    nt = clampToMajor(pushed);
  }
  tP = nt;
}
function setQ(t) {
  var nt = clampToMajor(N(t));
  var d = N(nt - tP); if (d > Math.PI) d = 2*Math.PI - d;
  if (d < PQ_SEP) {
    var pushed = pushAway(nt, tP, PQ_SEP);
    nt = clampToMajor(pushed);
  }
  tQ = nt;
}

// Push t away from anchor by at least sep, choosing the direction
// that stays on the major arc.
function pushAway(t, anchor, sep) {
  var cand1 = N(anchor + sep);
  var cand2 = N(anchor - sep);
  var c1Major = !isOnMinorArc(cand1);
  var c2Major = !isOnMinorArc(cand2);
  if (c1Major && !c2Major) return cand1;
  if (c2Major && !c1Major) return cand2;
  // Both valid (or both invalid): pick the one closer to t
  function d(x, y) { var v = N(x - y); if (v > Math.PI) v = 2*Math.PI - v; return v; }
  return d(cand1, t) < d(cand2, t) ? cand1 : cand2;
}

function enforcePQ() {
  // After moving A or B, ensure P and Q are still at least PQ_SEP apart.
  var d = N(tP - tQ); if (d > Math.PI) d = 2*Math.PI - d;
  if (d < PQ_SEP) {
    var pushed = pushAway(tP, tQ, PQ_SEP);
    tP = clampToMajor(pushed);
  }
}

function inscribedAngle(P, A, B) {
  var PAx = A.x - P.x, PAy = A.y - P.y;
  var PBx = B.x - P.x, PBy = B.y - P.y;
  var dot  = PAx*PBx + PAy*PBy;
  var mag  = Math.sqrt(PAx*PAx + PAy*PAy) * Math.sqrt(PBx*PBx + PBy*PBy);
  return mag > 0 ? Math.acos(Math.max(-1, Math.min(1, dot / mag))) : 0;
}

function arcBetween(cx, cy, r, ca, cb) {
  var cw = ((cb - ca) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  ctx.beginPath();
  ctx.arc(cx, cy, r, ca, cb, cw > Math.PI);
  ctx.stroke();
}

function hexAlpha(hex, a) {
  var r = parseInt(hex.slice(1,3),16),
      g = parseInt(hex.slice(3,5),16),
      b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function dot(cx, cy, color, r, glowing) {
  if (glowing) {
    ctx.fillStyle = hexAlpha(color, 0.18);
    ctx.beginPath(); ctx.arc(cx, cy, r + 9, 0, 2*Math.PI); ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, glowing ? r + 1 : r, 0, 2*Math.PI); ctx.fill();
}

function label(x, y, text, color, size) {
  size = size || 12;
  ctx.font = '600 ' + size + "px 'Geist Mono', ui-monospace, monospace";
  var tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(11,17,24,0.85)';
  ctx.fillRect(x - tw/2 - 5, y - size/2 - 4, tw + 10, size + 8);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b1118';
  ctx.fillRect(0, 0, W, H);

  var A  = ptOnCircle(tA), B  = ptOnCircle(tB),
      P  = ptOnCircle(tP), Q  = ptOnCircle(tQ);
  var Ac = toC(A.x, A.y),  Bc = toC(B.x, B.y),
      Pc = toC(P.x, P.y),  Qc = toC(Q.x, Q.y);

  var aP = inscribedAngle(P, A, B);
  var aQ = inscribedAngle(Q, A, B);
  // Round both to nearest deg; they should match exactly in theory.
  var pDeg = Math.round(aP * 180 / Math.PI);
  var qDeg = Math.round(aQ * 180 / Math.PI);
  // Keep them visually equal — guard against off-by-one drift
  if (Math.abs(pDeg - qDeg) <= 1) { qDeg = pDeg; }

  // 1. Circle outline
  ctx.beginPath();
  ctx.arc(CX, CY, R * S, 0, 2*Math.PI);
  ctx.strokeStyle = '#3a4a5a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 2. Chord AB faded blue
  ctx.strokeStyle = 'rgba(0,171,250,0.4)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(Ac.x, Ac.y); ctx.lineTo(Bc.x, Bc.y);
  ctx.stroke();

  // 3. PA, PB, QA, QB in green
  ctx.strokeStyle = '#0fee89';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Pc.x, Pc.y); ctx.lineTo(Ac.x, Ac.y);
  ctx.moveTo(Pc.x, Pc.y); ctx.lineTo(Bc.x, Bc.y);
  ctx.moveTo(Qc.x, Qc.y); ctx.lineTo(Ac.x, Ac.y);
  ctx.moveTo(Qc.x, Qc.y); ctx.lineTo(Bc.x, Bc.y);
  ctx.stroke();

  // 4. Angle arc at P (radius 28, green)
  var dPA = Math.atan2(Ac.y - Pc.y, Ac.x - Pc.x);
  var dPB = Math.atan2(Bc.y - Pc.y, Bc.x - Pc.x);
  ctx.strokeStyle = '#0fee89';
  ctx.lineWidth = 2.5;
  arcBetween(Pc.x, Pc.y, 28, dPA, dPB);

  // 5. Angle arc at Q (radius 28, green)
  var dQA = Math.atan2(Ac.y - Qc.y, Ac.x - Qc.x);
  var dQB = Math.atan2(Bc.y - Qc.y, Bc.x - Qc.x);
  arcBetween(Qc.x, Qc.y, 28, dQA, dQB);

  // 6. Draggable points
  dot(Ac.x, Ac.y, '#00abfa', 7, dragging === 'A' || hovering === 'A');
  dot(Bc.x, Bc.y, '#00abfa', 7, dragging === 'B' || hovering === 'B');
  dot(Pc.x, Pc.y, '#0fee89', 7, dragging === 'P' || hovering === 'P');
  dot(Qc.x, Qc.y, '#0fee89', 7, dragging === 'Q' || hovering === 'Q');

  // 7. Letter labels just outside circle
  var lo = R * S + 20;
  ctx.font = "700 14px 'Geist', sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#00abfa';
  ctx.fillText('A', CX + Math.cos(tA) * lo, CY - Math.sin(tA) * lo);
  ctx.fillText('B', CX + Math.cos(tB) * lo, CY - Math.sin(tB) * lo);
  ctx.fillStyle = '#0fee89';
  ctx.fillText('P', CX + Math.cos(tP) * lo, CY - Math.sin(tP) * lo);
  ctx.fillText('Q', CX + Math.cos(tQ) * lo, CY - Math.sin(tQ) * lo);

  // 8. Angle value labels near each apex, pushed away from chord
  // Direction from apex toward midpoint of (A,B) gives "into the angle"; we
  // place the label in that direction so it sits inside the green wedge.
  function placeLabel(apex, pa, pb, text) {
    var mx = (pa.x + pb.x) / 2;
    var my = (pa.y + pb.y) / 2;
    var dx = mx - apex.x, dy = my - apex.y;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    var off = 50;
    label(apex.x + dx/len * off, apex.y + dy/len * off, text, '#0fee89', 12);
  }
  placeLabel(Pc, Ac, Bc, '∠APB = ' + pDeg + '°');
  placeLabel(Qc, Ac, Bc, '∠AQB = ' + qDeg + '°');

  // 9. Bottom banner (green box)
  var rel = '∠APB  =  ∠AQB    (' + pDeg + '°  =  ' + qDeg + '°)';
  ctx.font = "600 12px 'Geist Mono', ui-monospace, monospace";
  var rw = ctx.measureText(rel).width;
  var bx = W/2 - rw/2 - 14, by = H - 28, bw = rw + 28, bh = 22;
  ctx.fillStyle = 'rgba(15,238,137,0.08)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = 'rgba(15,238,137,0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  ctx.fillStyle = '#0fee89';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(rel, W/2, by + bh/2 + 0.5);

  // KaTeX heading with live values
  var tex = "\\textcolor{#0fee89}{\\angle APB} = \\textcolor{#0fee89}{\\angle AQB}"
          + " \\;\\;\\Rightarrow\\;\\; "
          + "\\textcolor{#0fee89}{" + pDeg + "^\\circ}"
          + " = \\textcolor{#0fee89}{" + qDeg + "^\\circ}";
  tryRender(document.getElementById("formula"), tex);
}

// Interaction
var dragging = null, hovering = null;
var HIT = 18;

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var ev   = e.touches ? e.touches[0] : e;
  return {
    x: (ev.clientX - rect.left) * (W / rect.width),
    y: (ev.clientY - rect.top)  * (H / rect.height)
  };
}

function nearPoint(px, py, t) {
  var c = toC(R * Math.cos(t), R * Math.sin(t));
  var dx = px - c.x, dy = py - c.y;
  return Math.sqrt(dx*dx + dy*dy) < HIT;
}

function angleFromPos(px, py) {
  var m = fromC(px, py);
  return Math.atan2(m.my, m.mx);
}

function pickAt(p) {
  if      (nearPoint(p.x, p.y, tA)) return 'A';
  else if (nearPoint(p.x, p.y, tB)) return 'B';
  else if (nearPoint(p.x, p.y, tP)) return 'P';
  else if (nearPoint(p.x, p.y, tQ)) return 'Q';
  return null;
}

function applySet(name, t) {
  if      (name === 'A') setA(t);
  else if (name === 'B') setB(t);
  else if (name === 'P') setP(t);
  else if (name === 'Q') setQ(t);
}

canvas.addEventListener('mousedown', function(e) {
  var p = getPos(e);
  dragging = pickAt(p);
  if (dragging) e.preventDefault();
});

canvas.addEventListener('mousemove', function(e) {
  var p = getPos(e);
  if (dragging) {
    var t = angleFromPos(p.x, p.y);
    applySet(dragging, t);
    draw();
  } else {
    var prev = hovering;
    hovering = pickAt(p);
    canvas.style.cursor = hovering ? 'grab' : 'default';
    if (hovering !== prev) draw();
  }
});

canvas.addEventListener('mouseup',    function() { dragging = null; });
canvas.addEventListener('mouseleave', function() {
  if (dragging || hovering) {
    dragging = hovering = null;
    canvas.style.cursor = 'default';
    draw();
  }
});

canvas.addEventListener('touchstart', function(e) {
  var p = getPos(e);
  dragging = pickAt(p);
  if (dragging) e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  if (!dragging) return;
  e.preventDefault();
  var p = getPos(e);
  var t = angleFromPos(p.x, p.y);
  applySet(dragging, t);
  draw();
}, { passive: false });

canvas.addEventListener('touchend', function() { dragging = null; });

draw();
window.addEventListener('load', draw);

// postMessage resize hook
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
