<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Parts of Circles Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:14.5px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls {
    display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .row { display:flex; align-items:center; gap:8px; min-width:200px; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] {
    flex:1; min-width:80px; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .row .val { min-width:28px; text-align:right; color:#f0eeea; font-weight:600; }
  .toggle-row { display:flex; align-items:center; gap:8px; }
  .toggle-row .name { color:#fff067; font-weight:600; }
  .toggle-row select {
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px;
    padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer;
  }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fA"></span>
    <span class="formula" id="fP"></span>
  </div>

  <div class="controls">
    <div class="toggle-row">
      <span class="name">part</span>
      <select id="partSel">
        <option value="semi" selected>semicircle</option>
        <option value="quad">quadrant</option>
        <option value="sector">sector (drag θ)</option>
        <option value="segment">segment</option>
      </select>
    </div>
    <div class="row">
      <span class="name">r</span>
      <input type="range" id="rSlider" min="2" max="8" value="5" step="0.1"/>
      <span class="val" id="rVal">5</span>
    </div>
    <div class="row" id="thetaRow" style="display:none">
      <span class="name">θ</span>
      <input type="range" id="tSlider" min="20" max="340" value="120" step="1"/>
      <span class="val" id="tVal">120°</span>
    </div>
  </div>

  <svg id="svg" viewBox="0 0 480 280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-part"></g>
  </svg>

  <p class="footer">drag the radius (and angle) · the curved arc + straight edges = full perimeter</p>
</div>

<script>
"use strict";

var SVG_W = 480, SVG_H = 280;
// Auto-scale: pick px-per-cm so the largest possible circle (r_max = 8 cm)
// still fits inside the SVG with margin. r_max * SCALE + margin <= SVG_H/2.
var SCALE = Math.min(15, (SVG_H - 60) / 16);

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function texCoefPi(coef) {
  var v = Math.round(coef * 1000) / 1000;
  if (v === 0) return "0";
  if (v === 1) return "\\pi";
  return parseFloat(v.toFixed(3)).toString() + "\\pi";
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, alignment) {
  var fo = svgEl("foreignObject", {
    x: (x - 50), y: (y - 12), width: 100, height: 24,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "lbl-host";
  div.style.color = color || "#f0eeea";
  div.style.width = "100%"; div.style.height = "100%";
  div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = (alignment === "left" ? "flex-start" : alignment === "right" ? "flex-end" : "center");
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}

var COL = {
  blue: "#00abfa", yellow: "#fff067", orange: "#ff822c",
  green: "#0fee89", pink: "#ff4670", grey: "#7a7875", faint: "#3a4a5a"
};

var state = {
  part: "semi",
  params: { r: 5, theta: 120 },
  display: { r: 5, theta: 120 }
};
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005, rafScheduled = false;
function startSpring() { if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(springTick); } }
function springTick() {
  var moving = false;
  ["r","theta"].forEach(function(k) {
    var d = state.params[k] - state.display[k];
    if (Math.abs(d) > SPRING_EPS) { state.display[k] += d * SPRING_FACTOR; moving = true; }
    else state.display[k] = state.params[k];
  });
  render();
  if (moving) requestAnimationFrame(springTick);
  else rafScheduled = false;
}

var fA = document.getElementById("fA");
var fP = document.getElementById("fP");
var gPart = document.getElementById("g-part");

function ptOnCircle(cx, cy, r, deg) {
  var rad = deg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

function render() {
  var r = state.display.r;
  var theta = state.display.theta;
  var rPx = r * SCALE;
  var cx = SVG_W/2, cy = SVG_H/2 + 10;

  gPart.innerHTML = "";

  // Faint full-circle outline
  gPart.appendChild(svgEl("circle", {
    cx: cx, cy: cy, r: rPx, fill: "none",
    stroke: COL.faint, "stroke-width": 1, "stroke-dasharray": "3 3"
  }));

  var areaTex, areaCoef, perimTex, perimCustom;

  if (state.part === "semi") {
    // Top semicircle
    var leftX = cx - rPx, rightX = cx + rPx;
    var d = "M " + leftX + " " + cy +
            " A " + rPx + " " + rPx + " 0 0 1 " + rightX + " " + cy + " Z";
    gPart.appendChild(svgEl("path", {
      d: d, fill: "rgba(0,171,250,0.20)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
    }));
    // Diameter line in pink
    gPart.appendChild(svgEl("line", {
      x1: leftX, y1: cy, x2: rightX, y2: cy, stroke: COL.pink, "stroke-width": 2
    }));
    // r label inside
    svgKaTeXLabel(gPart, cx + rPx*0.4, cy - rPx*0.42, "r = " + fmtNum(r), COL.yellow, "center");
    // diameter label
    svgKaTeXLabel(gPart, cx, cy + 16, "2r = " + fmtNum(2*r), COL.pink, "center");
    areaTex = "\\tfrac{1}{2}\\pi r^{2}";
    areaCoef = 0.5 * r * r;
    perimTex = "\\pi r + 2r";
    perimCustom = { rational: 2*r, pi: r };
  } else if (state.part === "quad") {
    // Top-right quadrant
    var pTop = ptOnCircle(cx, cy, rPx, 90);
    var pRight = ptOnCircle(cx, cy, rPx, 0);
    var d = "M " + cx + " " + cy +
            " L " + pTop.x + " " + pTop.y +
            " A " + rPx + " " + rPx + " 0 0 1 " + pRight.x + " " + pRight.y + " Z";
    gPart.appendChild(svgEl("path", {
      d: d, fill: "rgba(0,171,250,0.20)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
    }));
    // Two radii in pink
    gPart.appendChild(svgEl("line", { x1: cx, y1: cy, x2: pTop.x, y2: pTop.y, stroke: COL.pink, "stroke-width": 2 }));
    gPart.appendChild(svgEl("line", { x1: cx, y1: cy, x2: pRight.x, y2: pRight.y, stroke: COL.pink, "stroke-width": 2 }));
    svgKaTeXLabel(gPart, (cx + pRight.x)/2, cy + 16, "r = " + fmtNum(r), COL.pink, "center");
    svgKaTeXLabel(gPart, cx - 14, (cy + pTop.y)/2, "r", COL.pink, "right");
    areaTex = "\\tfrac{1}{4}\\pi r^{2}";
    areaCoef = 0.25 * r * r;
    perimTex = "\\tfrac{\\pi r}{2} + 2r";
    perimCustom = { rational: 2*r, pi: r/2 };
  } else if (state.part === "sector") {
    // Sector with angle θ at the top, sweeping clockwise from the top
    var startDeg = 90;
    var endDeg = 90 - theta;
    var pStart = ptOnCircle(cx, cy, rPx, startDeg);
    var pEnd = ptOnCircle(cx, cy, rPx, endDeg);
    var large = (theta > 180) ? 1 : 0;
    var d = "M " + cx + " " + cy +
            " L " + pEnd.x + " " + pEnd.y +
            " A " + rPx + " " + rPx + " 0 " + large + " 0 " + pStart.x + " " + pStart.y + " Z";
    gPart.appendChild(svgEl("path", {
      d: d, fill: "rgba(0,171,250,0.20)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
    }));
    // Two radii in pink
    gPart.appendChild(svgEl("line", { x1: cx, y1: cy, x2: pStart.x, y2: pStart.y, stroke: COL.pink, "stroke-width": 2 }));
    gPart.appendChild(svgEl("line", { x1: cx, y1: cy, x2: pEnd.x, y2: pEnd.y, stroke: COL.pink, "stroke-width": 2 }));
    // θ label inside
    var midDeg = startDeg - theta/2;
    var midRad = midDeg * Math.PI / 180;
    var lblR = Math.min(28, rPx*0.4) + 14;
    svgKaTeXLabel(gPart,
      cx + lblR * Math.cos(midRad), cy - lblR * Math.sin(midRad),
      fmtNum(theta) + "°", COL.green, "center");
    svgKaTeXLabel(gPart, cx + 8, cy - rPx/2, "r = " + fmtNum(r), COL.pink, "left");
    areaTex = "\\dfrac{" + fmtNum(theta) + "}{360}\\pi r^{2}";
    areaCoef = (theta/360) * r * r;
    perimTex = "\\dfrac{" + fmtNum(theta) + "}{360}(2\\pi r) + 2r";
    perimCustom = { rational: 2*r, pi: (theta/360) * 2 * r };
  } else if (state.part === "segment") {
    // Segment: sector minus triangle. Use angle θ.
    var startDeg = 90;
    var endDeg = 90 - theta;
    var pStart = ptOnCircle(cx, cy, rPx, startDeg);
    var pEnd = ptOnCircle(cx, cy, rPx, endDeg);
    var large = (theta > 180) ? 1 : 0;
    // Segment bounded by chord and arc
    var d = "M " + pStart.x + " " + pStart.y +
            " A " + rPx + " " + rPx + " 0 " + large + " 0 " + pEnd.x + " " + pEnd.y +
            " Z";
    gPart.appendChild(svgEl("path", {
      d: d, fill: "rgba(255,130,44,0.22)", stroke: COL.orange, "stroke-width": 2, "stroke-linejoin": "round"
    }));
    // The chord stroke (dashed pink)
    gPart.appendChild(svgEl("line", {
      x1: pStart.x, y1: pStart.y, x2: pEnd.x, y2: pEnd.y,
      stroke: COL.pink, "stroke-width": 2
    }));
    // Triangle (faint) for the decomposition reminder
    var triD = "M " + cx + " " + cy +
               " L " + pStart.x + " " + pStart.y +
               " L " + pEnd.x + " " + pEnd.y + " Z";
    gPart.appendChild(svgEl("path", {
      d: triD, fill: "none",
      stroke: COL.faint, "stroke-width": 1, "stroke-dasharray": "3 3"
    }));
    // θ angle marker at centre
    var midDeg = startDeg - theta/2;
    var midRad = midDeg * Math.PI / 180;
    svgKaTeXLabel(gPart,
      cx + 18 * Math.cos(midRad), cy - 18 * Math.sin(midRad),
      fmtNum(theta) + "°", COL.green, "center");
    svgKaTeXLabel(gPart, cx + 8, cy - rPx/2, "r = " + fmtNum(r), COL.pink, "left");
    // chord length: 2r sin(θ/2)
    var chord = 2 * r * Math.sin(theta * Math.PI / 360);
    // arc length: (θ/360) * 2πr
    var arcCoefPi = (theta/360) * 2 * r;
    // segment area = sector area - triangle area = (θ/360)πr² - (1/2)r²sin(θ)
    var sectorArea = (theta/360) * r * r;  // coefficient of π
    var triArea = 0.5 * r * r * Math.sin(theta * Math.PI/180);
    areaTex = "\\dfrac{" + fmtNum(theta) + "}{360}\\pi r^{2} - \\tfrac{1}{2}r^{2}\\sin\\theta";
    // Mixed: pi part is sectorArea, rational part is -triArea
    areaCoef = { rational: -triArea, pi: sectorArea };
    perimTex = "\\text{arc} + \\text{chord}";
    perimCustom = { rational: chord, pi: arcCoefPi };
  }

  // Centre dot
  gPart.appendChild(svgEl("circle", { cx: cx, cy: cy, r: 2.5, fill: COL.grey }));

  // Render formulas
  var areaValueTex;
  if (typeof areaCoef === "object") {
    areaValueTex = (areaCoef.rational !== 0 ? fmtNum(areaCoef.rational) : "") +
                   (areaCoef.pi !== 0 ? (areaCoef.pi > 0 && areaCoef.rational !== 0 ? " + " : "") + texCoefPi(areaCoef.pi) : "");
    if (areaValueTex.startsWith(" + ")) areaValueTex = areaValueTex.slice(3);
    if (areaValueTex === "") areaValueTex = "0";
  } else {
    areaValueTex = texCoefPi(areaCoef);
  }
  tryRender(fA,
    "{\\color{#00abfa}A} = " + areaTex + " = {\\color{#00abfa}" + areaValueTex + "}\\;\\text{cm}^{2}");

  var perimValueTex = (perimCustom.rational !== 0 ? fmtNum(perimCustom.rational) : "") +
                      (perimCustom.pi !== 0 ? (perimCustom.pi > 0 && perimCustom.rational !== 0 ? " + " : "") + texCoefPi(perimCustom.pi) : "");
  if (perimValueTex.startsWith(" + ")) perimValueTex = perimValueTex.slice(3);
  if (perimValueTex === "") perimValueTex = "0";
  tryRender(fP,
    "{\\color{#fff067}P} = " + perimTex + " = {\\color{#fff067}" + perimValueTex + "}\\;\\text{cm}");
}

function updateThetaVisibility() {
  var thetaRow = document.getElementById("thetaRow");
  thetaRow.style.display = (state.part === "sector" || state.part === "segment") ? "flex" : "none";
}

document.getElementById("partSel").addEventListener("change", function() {
  state.part = this.value;
  updateThetaVisibility();
  render();
});
document.getElementById("rSlider").addEventListener("input", function() {
  state.params.r = parseFloat(this.value);
  document.getElementById("rVal").textContent = fmtNum(state.params.r);
  startSpring();
});
document.getElementById("tSlider").addEventListener("input", function() {
  state.params.theta = parseFloat(this.value);
  document.getElementById("tVal").textContent = fmtNum(state.params.theta) + "°";
  startSpring();
});

updateThetaVisibility();
render();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
