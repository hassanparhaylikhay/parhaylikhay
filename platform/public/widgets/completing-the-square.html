<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Completing the Square</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:16px 18px 18px; }
  .wrap {
    max-width:520px; margin:0 auto;
    border:1px solid #141e2a; border-radius:10px;
    background:#0b1118;
    padding:14px 16px 16px;
  }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; gap:10px; min-height:22px; }
  .formula { font-size:14px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .controls { display:flex; align-items:center; gap:14px; margin-bottom:14px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:12px; color:#7a7875; }
  .controls .name { color:#fff067; font-weight:600; }
  .controls input[type=range] { flex:1; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .controls input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .controls input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .controls .val { min-width:18px; text-align:right; color:#f0eeea; font-weight:600; }
  .controls .stage-toggle { display:flex; gap:6px; }
  .controls .stage-btn {
    appearance:none; cursor:pointer; font-family:inherit; font-size:11px; font-weight:600;
    padding:4px 8px; border-radius:4px; border:1px solid #141e2a; background:#0b1118; color:#7a7875;
  }
  .controls .stage-btn.on { border-color:#00abfa; color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; }

  .formula-line {
    margin-top:10px; padding:10px 12px;
    background:#07090d; border:1px solid #141e2a; border-radius:6px;
    font-family:'Geist Mono',monospace; font-size:13px; color:#f0eeea;
    text-align:center; min-height:30px;
  }
  .formula-line .katex { font-size:1em; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <span class="name">b</span>
    <input type="range" id="sb" min="2" max="8" value="6" step="2"/>
    <span class="val" id="vb">6</span>
    <div class="stage-toggle">
      <button class="stage-btn on" id="stage-l">L-shape</button>
      <button class="stage-btn" id="stage-s">complete</button>
    </div>
  </div>

  <svg viewBox="0 0 360 240" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <!-- the x-by-x square (always shown) -->
    <rect id="rXX" fill="rgba(0,171,250,0.10)" stroke="#00abfa" stroke-width="1.5"/>
    <text id="lXX" font-family="Geist Mono,monospace" font-size="18" fill="#00abfa" font-weight="700" text-anchor="middle">x²</text>
    <!-- the bx rectangle (L-shape mode) -->
    <rect id="rBX" fill="rgba(255,240,103,0.10)" stroke="#fff067" stroke-width="1.5"/>
    <text id="lBX" font-family="Geist Mono,monospace" font-size="14" fill="#fff067" font-weight="700" text-anchor="middle">bx</text>
    <!-- the two half-strips (complete mode) -->
    <rect id="rH1" fill="rgba(255,240,103,0.10)" stroke="#fff067" stroke-width="1.5"/>
    <text id="lH1" font-family="Geist Mono,monospace" font-size="11" fill="#fff067" font-weight="600" text-anchor="middle"></text>
    <rect id="rH2" fill="rgba(255,240,103,0.10)" stroke="#fff067" stroke-width="1.5"/>
    <text id="lH2" font-family="Geist Mono,monospace" font-size="11" fill="#fff067" font-weight="600" text-anchor="middle"></text>
    <!-- the missing corner (complete mode) -->
    <rect id="rCC" fill="rgba(15,238,137,0.18)" stroke="#0fee89" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text id="lCC" font-family="Geist Mono,monospace" font-size="11" fill="#0fee89" font-weight="700" text-anchor="middle"></text>
    <!-- side labels -->
    <text id="lSideX1" font-family="Geist Mono,monospace" font-size="11" fill="#7a7875" text-anchor="middle">x</text>
    <text id="lSideX2" font-family="Geist Mono,monospace" font-size="11" fill="#7a7875" text-anchor="middle">x</text>
    <text id="lSideHalf1" font-family="Geist Mono,monospace" font-size="11" fill="#7a7875" text-anchor="middle"></text>
    <text id="lSideHalf2" font-family="Geist Mono,monospace" font-size="11" fill="#7a7875" text-anchor="middle"></text>
  </svg>

  <div class="formula-line" id="formula-line"></div>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

(function renderHeadFormula() {
  tryRender(document.getElementById("formula"), "x^2 + bx = (x + \\tfrac{b}{2})^2 - (\\tfrac{b}{2})^2");
})();

// Geometry constants
// SVG viewBox 360x240. The x-by-x square is fixed at (40, 40), side 110.
// In L-shape mode, bx rectangle attaches to the right of the square.
// In complete mode, half-strips sit on right and bottom, with the corner square in the bottom-right.
var X_PX = 110; // pixel size representing x = 1 unit (scaled visually)
var SQ_X = 40, SQ_Y = 40; // top-left of x² square

var stage = "L"; // "L" or "S"
var bVal = 6;

// element refs
var rXX = document.getElementById("rXX");
var lXX = document.getElementById("lXX");
var rBX = document.getElementById("rBX");
var lBX = document.getElementById("lBX");
var rH1 = document.getElementById("rH1");
var lH1 = document.getElementById("lH1");
var rH2 = document.getElementById("rH2");
var lH2 = document.getElementById("lH2");
var rCC = document.getElementById("rCC");
var lCC = document.getElementById("lCC");
var lSideX1 = document.getElementById("lSideX1");
var lSideX2 = document.getElementById("lSideX2");
var lSideHalf1 = document.getElementById("lSideHalf1");
var lSideHalf2 = document.getElementById("lSideHalf2");

function show(el, on) { el.style.display = on ? "" : "none"; }

function update() {
  document.getElementById("vb").textContent = bVal;
  // We pick a visual scale so x = 1 unit maps to X_PX pixels, and b/2 maps proportionally.
  // To keep the figure inside the viewBox, scale b/2 to no more than ~50 px.
  var halfBPx = Math.min(50, X_PX * (bVal / 2) / 5); // capped scaling
  // Use a uniform scale where 1 unit = SCALE px, but x contributes X_PX, b half contributes halfBPx
  // Simpler: x² square is fixed-size; bx rectangle width scales with b.

  // Position the x² square
  rXX.setAttribute("x", SQ_X);
  rXX.setAttribute("y", SQ_Y);
  rXX.setAttribute("width", X_PX);
  rXX.setAttribute("height", X_PX);
  lXX.setAttribute("x", SQ_X + X_PX / 2);
  lXX.setAttribute("y", SQ_Y + X_PX / 2 + 7);

  // side labels for the x² square
  lSideX1.setAttribute("x", SQ_X + X_PX / 2);
  lSideX1.setAttribute("y", SQ_Y - 6);
  lSideX2.setAttribute("x", SQ_X - 8);
  lSideX2.setAttribute("y", SQ_Y + X_PX / 2 + 4);

  if (stage === "L") {
    // L-shape: bx rectangle attached to the right of the x² square.
    // Width = halfBPx * 2 (full b in viz), height = X_PX.
    var bxW = halfBPx * 2;
    show(rBX, true); show(lBX, true);
    show(rH1, false); show(lH1, false);
    show(rH2, false); show(lH2, false);
    show(rCC, false); show(lCC, false);
    show(lSideHalf1, false); show(lSideHalf2, false);

    rBX.setAttribute("x", SQ_X + X_PX);
    rBX.setAttribute("y", SQ_Y);
    rBX.setAttribute("width", bxW);
    rBX.setAttribute("height", X_PX);
    lBX.setAttribute("x", SQ_X + X_PX + bxW / 2);
    lBX.setAttribute("y", SQ_Y + X_PX / 2 + 5);
    lBX.textContent = bVal + "x";

    // Update formula line
    var sqAdd = (bVal / 2) * (bVal / 2);
    var tex = "x^2 + " + bVal + "x \\;=\\; (x + " + (bVal / 2) + ")^2 - " + sqAdd;
    tryRender(document.getElementById("formula-line"), tex);
  } else {
    // Complete mode: x² square + half strip on right + half strip on bottom + corner square.
    // Each half strip has dimension X_PX × halfBPx.
    // Corner square has dimension halfBPx × halfBPx.
    show(rBX, false); show(lBX, false);
    show(rH1, true); show(lH1, true);
    show(rH2, true); show(lH2, true);
    show(rCC, true); show(lCC, true);
    show(lSideHalf1, true); show(lSideHalf2, true);

    // Right half strip
    rH1.setAttribute("x", SQ_X + X_PX);
    rH1.setAttribute("y", SQ_Y);
    rH1.setAttribute("width", halfBPx);
    rH1.setAttribute("height", X_PX);
    lH1.setAttribute("x", SQ_X + X_PX + halfBPx / 2);
    lH1.setAttribute("y", SQ_Y + X_PX / 2 + 4);
    lH1.textContent = (bVal / 2) + "x";

    // Bottom half strip
    rH2.setAttribute("x", SQ_X);
    rH2.setAttribute("y", SQ_Y + X_PX);
    rH2.setAttribute("width", X_PX);
    rH2.setAttribute("height", halfBPx);
    lH2.setAttribute("x", SQ_X + X_PX / 2);
    lH2.setAttribute("y", SQ_Y + X_PX + halfBPx / 2 + 4);
    lH2.textContent = (bVal / 2) + "x";

    // Corner square (the "added piece")
    rCC.setAttribute("x", SQ_X + X_PX);
    rCC.setAttribute("y", SQ_Y + X_PX);
    rCC.setAttribute("width", halfBPx);
    rCC.setAttribute("height", halfBPx);
    lCC.setAttribute("x", SQ_X + X_PX + halfBPx / 2);
    lCC.setAttribute("y", SQ_Y + X_PX + halfBPx / 2 + 4);
    var sqAddVal = (bVal / 2) * (bVal / 2);
    lCC.textContent = sqAddVal;

    // half-strip side labels
    lSideHalf1.setAttribute("x", SQ_X + X_PX + halfBPx / 2);
    lSideHalf1.setAttribute("y", SQ_Y - 6);
    lSideHalf1.textContent = (bVal / 2);
    lSideHalf2.setAttribute("x", SQ_X - 12);
    lSideHalf2.setAttribute("y", SQ_Y + X_PX + halfBPx / 2 + 4);
    lSideHalf2.textContent = (bVal / 2);

    // Update formula line
    var sqAdd2 = (bVal / 2) * (bVal / 2);
    var tex = "x^2 + " + bVal + "x + \\textcolor{#0fee89}{" + sqAdd2 + "} \\;=\\; (x + " + (bVal / 2) + ")^2";
    tryRender(document.getElementById("formula-line"), tex);
  }
}

document.getElementById("sb").addEventListener("input", function(e) {
  bVal = parseInt(e.target.value, 10);
  update();
});

document.getElementById("stage-l").addEventListener("click", function() {
  stage = "L";
  document.getElementById("stage-l").classList.add("on");
  document.getElementById("stage-s").classList.remove("on");
  update();
});
document.getElementById("stage-s").addEventListener("click", function() {
  stage = "S";
  document.getElementById("stage-s").classList.add("on");
  document.getElementById("stage-l").classList.remove("on");
  update();
});

update();

// auto-resize
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
