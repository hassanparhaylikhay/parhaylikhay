<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Circle Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:15px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls {
    display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .row { display:flex; align-items:center; gap:8px; min-width:180px; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] {
    flex:1; min-width:80px; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .row .val { min-width:32px; text-align:right; color:#f0eeea; font-weight:600; }

  .mode-row { display:flex; align-items:center; gap:8px; }
  .mode-row .name { color:#fff067; font-weight:600; }
  .mode-row select {
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px;
    padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer;
  }
  .mode-row select:focus { border-color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .circle-fill { fill:rgba(0,171,250,0.10); stroke:#00abfa; stroke-width:2; }
  .radius-line { stroke:#fff067; stroke-width:2; }
  .radius-label { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; fill:#fff067; }
  .centre-dot { fill:#7a7875; }
  .centre-label { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; fill:#7a7875; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fC"></span>
    <span class="formula" id="fA"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">r</span>
      <input type="range" id="rSlider" min="0.5" max="9" value="5" step="0.1"/>
      <span class="val" id="rVal">5</span>
    </div>
    <div class="mode-row">
      <span class="name">show</span>
      <select id="mode">
        <option value="pi" selected>in terms of π</option>
        <option value="dec">decimal</option>
      </select>
    </div>
  </div>

  <svg id="svg" viewBox="0 0 480 280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="circle"></g>
    <g id="overlays"></g>
  </svg>

  <p class="footer">drag the radius · circumference and area update live</p>
</div>

<script>
"use strict";

var SVG_W = 480, SVG_H = 280;
var SVG_CX = SVG_W / 2, SVG_CY = SVG_H / 2;
var SCALE = 22;

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function texCoefPi(coef) {
  var v = Math.round(coef * 1000) / 1000;
  if (v === 0) return "0";
  if (v === 1) return "\\pi";
  if (v === -1) return "-\\pi";
  return parseFloat(v.toFixed(3)).toString() + "\\pi";
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// ===== State + spring ==================================================
var state = { params: { r: 5 }, display: { r: 5 }, mode: "pi" };
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005, rafScheduled = false;
function startSpring() { if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(springTick); } }
function springTick() {
  var d = state.params.r - state.display.r;
  if (Math.abs(d) > SPRING_EPS) {
    state.display.r += d * SPRING_FACTOR;
    render();
    requestAnimationFrame(springTick);
  } else {
    state.display.r = state.params.r;
    render();
    rafScheduled = false;
  }
}

// ===== Render ==========================================================
var fC = document.getElementById("fC");
var fA = document.getElementById("fA");
var circleG = document.getElementById("circle");
var overlaysG = document.getElementById("overlays");

function render() {
  var r = state.display.r;
  var rPx = r * SCALE;

  circleG.innerHTML = "";
  circleG.appendChild(svgEl("circle", {
    "class": "circle-fill", cx: SVG_CX, cy: SVG_CY, r: rPx
  }));

  overlaysG.innerHTML = "";
  overlaysG.appendChild(svgEl("line", {
    "class": "radius-line",
    x1: SVG_CX, y1: SVG_CY, x2: SVG_CX + rPx, y2: SVG_CY
  }));
  var rLbl = svgEl("text", {
    "class": "radius-label",
    x: SVG_CX + rPx / 2, y: SVG_CY - 8, "text-anchor": "middle"
  });
  rLbl.textContent = "r = " + fmtNum(r);
  overlaysG.appendChild(rLbl);
  overlaysG.appendChild(svgEl("circle", {
    "class": "centre-dot", cx: SVG_CX, cy: SVG_CY, r: 3
  }));
  var oLbl = svgEl("text", {
    "class": "centre-label", x: SVG_CX - 12, y: SVG_CY + 4, "text-anchor": "end"
  });
  oLbl.textContent = "O";
  overlaysG.appendChild(oLbl);

  // KaTeX formulas with live values
  var cCoef = 2 * r;
  var aCoef = r * r;
  if (state.mode === "pi") {
    tryRender(fC,
      "{\\color{#00abfa}C} = 2\\pi r = " +
      "{\\color{#00abfa}" + texCoefPi(cCoef) + "}\\;\\text{cm}");
    tryRender(fA,
      "{\\color{#0fee89}A} = \\pi r^{2} = " +
      "{\\color{#0fee89}" + texCoefPi(aCoef) + "}\\;\\text{cm}^{2}");
  } else {
    tryRender(fC,
      "{\\color{#00abfa}C} = 2\\pi r = " +
      "{\\color{#00abfa}" + fmtNum(cCoef * Math.PI) + "}\\;\\text{cm}");
    tryRender(fA,
      "{\\color{#0fee89}A} = \\pi r^{2} = " +
      "{\\color{#0fee89}" + fmtNum(aCoef * Math.PI) + "}\\;\\text{cm}^{2}");
  }
}

// ===== Wire controls ===================================================
var slider = document.getElementById("rSlider");
var rValEl = document.getElementById("rVal");
slider.addEventListener("input", function() {
  state.params.r = parseFloat(slider.value);
  rValEl.textContent = fmtNum(state.params.r);
  startSpring();
});

document.getElementById("mode").addEventListener("change", function(e) {
  state.mode = e.target.value;
  render();
});

render();

// ===== Height reporter ==================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
