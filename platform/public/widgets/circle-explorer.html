<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Circle Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding:14px 18px 16px; overflow-x:hidden; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:22px 24px 20px; }

  .head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .title { font-family:'Geist Mono',monospace; font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:#fff067; font-weight:600; }
  .counter { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; }

  .pi-toggle {
    display:flex; gap:6px; padding:4px;
    background:#07090d; border:1px solid #141e2a; border-radius:14px;
    margin: 12px auto 4px; width:max-content;
  }
  .pi-toggle button {
    background:transparent; border:0; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11px; font-weight:600;
    padding:5px 12px; border-radius:10px; cursor:pointer;
    letter-spacing:0.4px;
    transition: color 0.12s, background 0.12s;
  }
  .pi-toggle button.active { color:#0b1118; background:#fff067; }

  .stage-wrap { display:flex; justify-content:center; padding:10px 0 4px; }
  svg { display:block; max-width:100%; height:auto; }
  .circle-fill { fill:rgba(0,171,250,0.10); stroke:#00abfa; stroke-width:2; }
  .radius-line { stroke:#fff067; stroke-width:2; }
  .radius-label { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; fill:#fff067; }
  .centre-dot { fill:#7a7875; }

  .metrics { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:18px; }
  .metric {
    background:#07090d; border:1px solid #141e2a; border-radius:8px;
    padding:12px 14px; display:flex; flex-direction:column; gap:2px;
  }
  .metric .lbl { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:1.4px; text-transform:uppercase; }
  .metric .v {
    font-family:'Geist Mono',monospace; font-size:22px; font-weight:600;
    color:#fff067; letter-spacing:-0.4px;
  }
  .metric .v .unit { font-size:13px; color:#7a7875; font-weight:500; margin-left:2px; }
  .metric .formula { font-family:'Geist Mono',monospace; font-size:11px; color:#3a4a5a; margin-top:2px; }

  .sliders { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .slider-row { display:grid; grid-template-columns: 90px 1fr 50px; gap:12px; align-items:center; }
  .slider-row .name { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }
  .slider-row input[type=range] {
    appearance:none; -webkit-appearance:none;
    width:100%; height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#00abfa; cursor:pointer; border:0;
  }
  .slider-row input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border-radius:50%; background:#00abfa; cursor:pointer; border:0;
  }
  .slider-row .v {
    text-align:right;
    font-family:'Geist Mono',monospace; font-size:13px; font-weight:600; color:#f0eeea;
  }

  .footer { margin-top:14px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.5px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="title">CIRCLE</span>
    <span class="counter" id="counter"></span>
  </div>

  <div class="pi-toggle" id="piToggle">
    <button data-mode="pi" class="active">in terms of π</button>
    <button data-mode="dec">decimal</button>
  </div>

  <div class="stage-wrap">
    <svg id="svg" viewBox="0 0 480 280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <g id="circle"></g>
      <g id="overlays"></g>
    </svg>
  </div>

  <div class="metrics">
    <div class="metric">
      <span class="lbl">Circumference</span>
      <span class="v"><span id="cVal">—</span> <span class="unit" id="cUnit">cm</span></span>
      <span class="formula">C = 2πr</span>
    </div>
    <div class="metric">
      <span class="lbl">Area</span>
      <span class="v"><span id="aVal">—</span> <span class="unit" id="aUnit">cm²</span></span>
      <span class="formula">A = πr²</span>
    </div>
  </div>

  <div class="sliders" id="sliders"></div>

  <p class="footer">drag the radius · circumference and area update live</p>
</div>

<script>
"use strict";

var SVG_W = 480, SVG_H = 280;
var SVG_CX = SVG_W / 2, SVG_CY = SVG_H / 2;
var SCALE = 22;  // px per cm

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function fmtPi(coef) {
  // Format "n π" cleanly: 1π → π, 2π → 2π, 3.5π → 3.5π
  var v = Math.round(coef * 100) / 100;
  if (v === 0) return "0";
  if (v === 1) return "π";
  if (v === -1) return "−π";
  return parseFloat(v.toFixed(2)).toString() + "π";
}

// ===== State ===========================================================
var state = {
  params:  { r: 5 },
  display: { r: 5 },
  mode: "pi"  // "pi" or "dec"
};

// ===== Spring animation ================================================
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005;
var rafScheduled = false;
function startSpring() {
  if (rafScheduled) return;
  rafScheduled = true;
  requestAnimationFrame(springTick);
}
function springTick() {
  var d = state.params.r - state.display.r;
  if (Math.abs(d) > SPRING_EPS) {
    state.display.r += d * SPRING_FACTOR;
    render();
    requestAnimationFrame(springTick);
  } else {
    state.display.r = state.params.r;
    render();
    rafScheduled = false;
  }
}

// ===== Render ==========================================================
var counterEl = document.getElementById("counter");
var cValEl    = document.getElementById("cVal");
var aValEl    = document.getElementById("aVal");
var cUnitEl   = document.getElementById("cUnit");
var aUnitEl   = document.getElementById("aUnit");
var circleG   = document.getElementById("circle");
var overlaysG = document.getElementById("overlays");

function render() {
  var r = state.display.r;
  var rPx = r * SCALE;

  // Draw circle
  circleG.innerHTML = "";
  circleG.appendChild(svgEl("circle", {
    "class": "circle-fill", cx: SVG_CX, cy: SVG_CY, r: rPx
  }));

  // Radius line + label + centre dot
  overlaysG.innerHTML = "";
  // Draw radius from centre to right edge
  overlaysG.appendChild(svgEl("line", {
    "class": "radius-line",
    x1: SVG_CX, y1: SVG_CY, x2: SVG_CX + rPx, y2: SVG_CY
  }));
  var rLbl = svgEl("text", {
    "class": "radius-label",
    x: SVG_CX + rPx / 2, y: SVG_CY - 8, "text-anchor": "middle"
  });
  rLbl.textContent = "r = " + fmtNum(r) + " cm";
  overlaysG.appendChild(rLbl);
  overlaysG.appendChild(svgEl("circle", {
    "class": "centre-dot", cx: SVG_CX, cy: SVG_CY, r: 3
  }));

  // Compute and display values
  var cExact = 2 * r;       // coefficient of π for circumference
  var aExact = r * r;       // coefficient of π for area
  if (state.mode === "pi") {
    cValEl.textContent = fmtPi(cExact);
    aValEl.textContent = fmtPi(aExact);
  } else {
    cValEl.textContent = fmtNum(cExact * Math.PI);
    aValEl.textContent = fmtNum(aExact * Math.PI);
  }
  // Counter line uses params (the user's chosen r) for stable readout
  var pr = state.params.r;
  counterEl.textContent = "r = " + fmtNum(pr) + " cm";
}

// ===== Build sliders ===================================================
function buildSliders() {
  var slidersEl = document.getElementById("sliders");
  slidersEl.innerHTML = "";
  var SLIDERS = [
    { key: "r", label: "radius r", min: 0.5, max: 9, step: 0.1 }
  ];
  SLIDERS.forEach(function(s) {
    var row = document.createElement("div");
    row.className = "slider-row";
    var name = document.createElement("span");
    name.className = "name"; name.textContent = s.label;
    var slider = document.createElement("input");
    slider.type = "range"; slider.min = s.min; slider.max = s.max; slider.step = s.step;
    slider.value = state.params[s.key];
    var val = document.createElement("span");
    val.className = "v"; val.textContent = fmtNum(state.params[s.key]);
    slider.addEventListener("input", function() {
      state.params[s.key] = parseFloat(slider.value);
      val.textContent = fmtNum(state.params[s.key]);
      startSpring();
    });
    row.appendChild(name); row.appendChild(slider); row.appendChild(val);
    slidersEl.appendChild(row);
  });
}

// ===== π toggle ========================================================
document.getElementById("piToggle").addEventListener("click", function(e) {
  var btn = e.target.closest("button[data-mode]");
  if (!btn) return;
  state.mode = btn.dataset.mode;
  document.querySelectorAll("#piToggle button").forEach(function(b) {
    b.classList.toggle("active", b === btn);
  });
  render();
});

buildSliders();
render();

// ===== Height reporter ==================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
