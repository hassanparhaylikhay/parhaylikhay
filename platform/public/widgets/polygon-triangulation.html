<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Polygon Triangulation</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:14px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls { display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:18px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .poly-side { stroke:#00abfa; stroke-width:2.5; fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .poly-vertex { fill:#fff067; }
  .poly-vertex-anchor { fill:#fff06738; stroke:#fff067; stroke-width:2; }
  .diagonal { stroke:#7a7875; stroke-width:1.2; stroke-dasharray:4 4; }
  .triangle-label { font-family:'Geist Mono',monospace; font-size:11px; fill:#f0eeea; font-weight:600; }

  .tally { margin-top:6px; font-family:'Geist Mono',monospace; font-size:11px; color:#c8c6be; text-align:center; padding:0 4px; word-break:break-word; }
  .markers {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end;
    gap:10px 14px; margin-top:8px; padding:6px 4px 0;
  }
  .marker { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .marker-svg { display:block; width:50px; height:30px; }
  .marker-label { font-family:'Geist Mono',monospace; font-size:9.5px; color:#7a7875; }
  .marker-baseline { stroke:#7a7875; stroke-width:1; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fSum"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">n</span>
      <input type="range" id="nSlider" min="3" max="10" value="6" step="1"/>
      <span class="val" id="nVal">6</span>
    </div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <g id="triangles"></g>
    <g id="diagonals"></g>
    <polygon id="poly" class="poly-side"/>
    <g id="vertices"></g>
    <g id="triangleLabels"></g>
  </svg>

  <div class="markers" id="markers"></div>
  <p class="tally" id="tally"></p>
  <p class="footer">drag n: from triangle (n=3) to decagon (n=10) · each marker = one triangle's three angles laid flat</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var SVG_NS = "http://www.w3.org/2000/svg";
var CX = 240, CY = 165, R = 110;

// Faint tints in the brand palette, alternated across triangles.
var TRI_FILLS = [
  "#00abfa22",
  "#fff06722",
  "#0fee8922",
  "#ff467022",
  "#ff822c22"
];

var n = 6;

function makeEl(tag, attrs) {
  var el = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
  return el;
}
function clearChildren(el) { while (el.firstChild) el.removeChild(el.firstChild); }

// Compute the three interior angles (in radians) of triangle (P, A, B).
// Returns [angAtP, angAtA, angAtB], all positive, summing to π.
function triangleAngles(P, A, B) {
  function ang(v, u1, u2) {
    var d1x = u1.x - v.x, d1y = u1.y - v.y;
    var d2x = u2.x - v.x, d2y = u2.y - v.y;
    var dot = d1x * d2x + d1y * d2y;
    var mag = Math.hypot(d1x, d1y) * Math.hypot(d2x, d2y) || 1;
    var c = dot / mag;
    if (c > 1) c = 1; if (c < -1) c = -1;
    return Math.acos(c);
  }
  return [ang(P, A, B), ang(A, P, B), ang(B, P, A)];
}

// SVG path for a pie slice from center (cx,cy) of radius r, sweeping
// math angle a1 -> a2 (radians). Sign of (a2-a1) controls sweep flag.
function pieSlice(cx, cy, r, a1, a2) {
  var x1 = cx + r * Math.cos(a1);
  var y1 = cy + r * Math.sin(a1);
  var x2 = cx + r * Math.cos(a2);
  var y2 = cy + r * Math.sin(a2);
  var sweep = a2 - a1;
  var largeArc = Math.abs(sweep) > Math.PI ? 1 : 0;
  var sweepFlag = sweep > 0 ? 1 : 0;
  return "M" + cx + "," + cy +
         "L" + x1.toFixed(2) + "," + y1.toFixed(2) +
         "A" + r + "," + r + " 0 " + largeArc + " " + sweepFlag + " " +
         x2.toFixed(2) + "," + y2.toFixed(2) + "Z";
}

// Tints used inside each 180° marker: yellow / green / orange — matches
// the colour cue from 4.6 P1 (triangle-angle rearrangement).
var MARKER_COLORS = ["#fff067", "#0fee89", "#ff822c"];

function buildMarker(anglesRad) {
  var svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "marker-svg");
  svg.setAttribute("viewBox", "0 0 50 30");
  // Center at (25, 26), half-disc opens upward.
  // In screen y-down, math angles 180° -> 270° -> 360° trace the upper arc.
  var cx = 25, cy = 26, r = 22;
  var cumulative = 0;
  for (var i = 0; i < 3; i++) {
    var a1 = Math.PI + cumulative;
    var a2 = a1 + anglesRad[i];
    cumulative += anglesRad[i];
    var path = makeEl("path", {
      d: pieSlice(cx, cy, r, a1, a2),
      fill: MARKER_COLORS[i] + "44",
      stroke: MARKER_COLORS[i],
      "stroke-width": "1.2",
      "stroke-linejoin": "round"
    });
    svg.appendChild(path);
  }
  // baseline
  svg.appendChild(makeEl("line", {
    x1: 2, y1: 26, x2: 48, y2: 26, class: "marker-baseline"
  }));
  return svg;
}

function vertices(nInt, radius) {
  var pts = [];
  var step = 2 * Math.PI / nInt;
  var start = -Math.PI / 2;
  for (var i = 0; i < nInt; i++) {
    var theta = start + i * step;
    pts.push({
      x: CX + radius * Math.cos(theta),
      y: CY + radius * Math.sin(theta)
    });
  }
  return pts;
}

function draw() {
  var sumInterior = (n - 2) * 180;

  tryRender(
    document.getElementById("fSum"),
    "(n - 2) \\times 180\\degree \\;=\\; (\\textcolor{#fff067}{" + n + "} - 2) \\times 180\\degree \\;=\\; \\textcolor{#0fee89}{" + sumInterior + "\\degree}"
  );

  var pts = vertices(n, R);

  document.getElementById("poly").setAttribute(
    "points", pts.map(function(p) { return p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" ")
  );

  var vg = document.getElementById("vertices");
  clearChildren(vg);
  for (var i = 0; i < pts.length; i++) {
    var isAnchor = (i === 0);
    vg.appendChild(makeEl("circle", {
      cx: pts[i].x, cy: pts[i].y,
      r: isAnchor ? 5.5 : 4,
      class: isAnchor ? "poly-vertex-anchor" : "poly-vertex"
    }));
  }

  var triG = document.getElementById("triangles");
  var diagG = document.getElementById("diagonals");
  var labG = document.getElementById("triangleLabels");
  clearChildren(triG); clearChildren(diagG); clearChildren(labG);

  var markersEl = document.getElementById("markers");
  clearChildren(markersEl);

  var v0 = pts[0];
  // Fan triangulation: triangles (v0, v_k, v_{k+1}) for k = 1 .. n-2
  for (var k = 1; k < n - 1; k++) {
    var vk = pts[k], vkp1 = pts[k+1];
    var fill = TRI_FILLS[(k - 1) % TRI_FILLS.length];

    triG.appendChild(makeEl("polygon", {
      points: v0.x.toFixed(2) + "," + v0.y.toFixed(2) + " " +
              vk.x.toFixed(2) + "," + vk.y.toFixed(2) + " " +
              vkp1.x.toFixed(2) + "," + vkp1.y.toFixed(2),
      fill: fill,
      stroke: "none"
    }));

    // Draw the diagonal from v0 to vk (skip k=1 since v0-v1 is a polygon side already)
    if (k > 1) {
      diagG.appendChild(makeEl("line", {
        x1: v0.x, y1: v0.y, x2: vk.x.toFixed(2), y2: vk.y.toFixed(2),
        class: "diagonal"
      }));
    }

    // Label "180°" at the centroid of each triangle
    var cx = (v0.x + vk.x + vkp1.x) / 3;
    var cy = (v0.y + vk.y + vkp1.y) / 3;
    var lbl = makeEl("text", {
      x: cx.toFixed(2),
      y: (cy + 4).toFixed(2),
      "text-anchor": "middle",
      class: "triangle-label"
    });
    lbl.textContent = "180°";
    labG.appendChild(lbl);

    // Inline 180° marker: this triangle's three angles laid flat along a baseline.
    var angles = triangleAngles(v0, vk, vkp1);
    var markerWrap = document.createElement("div");
    markerWrap.className = "marker";
    markerWrap.appendChild(buildMarker(angles));
    var markerLbl = document.createElement("span");
    markerLbl.className = "marker-label";
    markerLbl.textContent = "180°";
    markerWrap.appendChild(markerLbl);
    markersEl.appendChild(markerWrap);
  }

  document.getElementById("tally").innerHTML =
    "<span style=\"color:#0fee89\">" + (n - 2) + " triangles</span> &middot; " +
    (n - 2) + " &times; 180&deg; = " + sumInterior + "&deg;";
}

document.getElementById("nSlider").addEventListener("input", function(e) {
  n = parseInt(e.target.value, 10);
  document.getElementById("nVal").textContent = String(n);
  draw();
  reportHeight();
});

draw();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
}
</script>
</body>
</html>
