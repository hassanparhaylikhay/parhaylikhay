<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Unit Circle: where sin, cos, tan come from</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; touch-action:none; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .controls { display:flex; flex-direction:column; gap:8px; padding:14px 4px 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; border-top:1px solid #141e2a; margin-top:6px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .name { font-weight:600; min-width:60px; color:#f0eeea; }
  .row input[type=range] {
    flex:1; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%; cursor:pointer; border:0; background:#fff067;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; cursor:pointer; border:0; background:#fff067;
  }
  .row .val { min-width:46px; text-align:right; color:#f0eeea; font-weight:600; font-size:12.5px; }

  .vertex-handle { cursor:grab; transition: r 0.15s ease; }
  .vertex-handle:active { cursor:grabbing; }
  .vertex-handle:hover { r:11; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">UNIT CIRCLE · WHERE SIN, COS, TAN COME FROM</span>
    <span class="meta">drag the point · or use the slider</span>
  </div>

  <svg id="stage" viewBox="0 0 660 380" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-grid"></g>
    <g id="g-wave-static"></g>
    <g id="g-wave-trace"></g>
    <g id="g-figure"></g>
    <g id="g-labels"></g>
    <g id="g-handles"></g>
  </svg>

  <div class="controls">
    <div class="row">
      <span class="name">angle θ</span>
      <input type="range" id="thetaSlider" min="0" max="360" step="1" value="35"/>
      <span class="val" id="thetaVal"></span>
    </div>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  faint:  "#3a4a5a",
  grey:   "#7a7875",
  off:    "#f0eeea"
};

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n, dp) {
  if (!isFinite(n)) return "—";
  if (dp == null) dp = 3;
  var v = +n.toFixed(dp);
  return parseFloat(v.toFixed(dp)).toString();
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, alignment, fontSizePx) {
  var W = 120, H = 26;
  var fo = svgEl("foreignObject", {
    x: (x - W/2), y: (y - H/2), width: W, height: H,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "lbl-host";
  if (fontSizePx) div.style.fontSize = fontSizePx + "px";
  div.style.color = color || COL.off;
  div.style.width = "100%"; div.style.height = "100%";
  div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = (alignment === "left" ? "flex-start" : alignment === "right" ? "flex-end" : "center");
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}

// ===== Geometry =====
// CRITICAL: WSCALE === R so the wave panel and the unit circle use the
// SAME px-per-unit. That makes the dashed connecting line meaningful —
// the height on the circle equals the height on the wave panel.
var SVG_W = 660, SVG_H = 380;
var CX = 110, CY = 190, R = 90;        // circle centre + radius (px)
// Wave panel — right of the circle, y=0 baseline at WCY, full ±WMAX_Y range
var WX = 230, WW = 410;                // panel x extent
var WCY = CY;                          // y=0 baseline ALIGNED with circle centre
var WSCALE = R;                        // px per unit on y-axis = circle radius (matched scales)
var WMAX_Y = 2;                        // clip tan beyond this (panel y range = ±2 units)
var WY = WCY - WMAX_Y * WSCALE;        // top of panel
var WH = 2 * WMAX_Y * WSCALE;          // panel height

// State
var params  = { theta: 35 };  // degrees
var display = { theta: 35 };
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005;

var stage = document.getElementById("stage");
var gGrid = document.getElementById("g-grid");
var gWaveStatic = document.getElementById("g-wave-static");
var gWaveTrace  = document.getElementById("g-wave-trace");
var gFig  = document.getElementById("g-figure");
var gLbl  = document.getElementById("g-labels");
var gHnd  = document.getElementById("g-handles");

// θ-deg → x in wave panel (0° to 360°)
function xWave(thetaDeg) { return WX + (thetaDeg / 360) * WW; }
// y-value → y in wave panel
function yWave(v) { return WCY - v * WSCALE; }

function renderStaticGrid() {
  gGrid.innerHTML = "";
  // ===== Unit-circle side: axes =====
  gGrid.appendChild(svgEl("line", {
    x1: CX - R - 22, y1: CY, x2: CX + R + 22, y2: CY,
    stroke: COL.faint, "stroke-width": 1
  }));
  gGrid.appendChild(svgEl("line", {
    x1: CX, y1: CY - R - 22, x2: CX, y2: CY + R + 22,
    stroke: COL.faint, "stroke-width": 1
  }));
  // ±1 axis ticks
  svgKaTeXLabel(gGrid, CX + R, CY + 14, "1",   COL.grey, "center", 10);
  svgKaTeXLabel(gGrid, CX - R, CY + 14, "-1",  COL.grey, "center", 10);
  svgKaTeXLabel(gGrid, CX - 14, CY - R, "1",   COL.grey, "center", 10);
  svgKaTeXLabel(gGrid, CX - 14, CY + R, "-1",  COL.grey, "center", 10);

  // Unit circle
  gGrid.appendChild(svgEl("circle", {
    cx: CX, cy: CY, r: R,
    fill: "rgba(255,240,103,0.03)", stroke: COL.faint, "stroke-width": 1.4
  }));
}

function renderStaticWavePanel() {
  gWaveStatic.innerHTML = "";

  // Panel border
  gWaveStatic.appendChild(svgEl("rect", {
    x: WX, y: WY, width: WW, height: WH,
    fill: "rgba(15,30,46,0.35)", stroke: COL.faint, "stroke-width": 1
  }));

  // y=0 baseline (centre of panel, aligned with circle's x-axis)
  gWaveStatic.appendChild(svgEl("line", {
    x1: WX, y1: WCY, x2: WX + WW, y2: WCY,
    stroke: COL.faint, "stroke-width": 1
  }));
  // y=±1 dashed reference lines
  gWaveStatic.appendChild(svgEl("line", {
    x1: WX, y1: yWave(1), x2: WX + WW, y2: yWave(1),
    stroke: COL.faint, "stroke-width": 0.7, "stroke-dasharray": "3 3", opacity: 0.5
  }));
  gWaveStatic.appendChild(svgEl("line", {
    x1: WX, y1: yWave(-1), x2: WX + WW, y2: yWave(-1),
    stroke: COL.faint, "stroke-width": 0.7, "stroke-dasharray": "3 3", opacity: 0.5
  }));

  // x-axis tick marks at 0, 90, 180, 270, 360
  [0, 90, 180, 270, 360].forEach(function(deg) {
    var x = xWave(deg);
    gWaveStatic.appendChild(svgEl("line", {
      x1: x, y1: WCY - 4, x2: x, y2: WCY + 5,
      stroke: COL.faint, "stroke-width": 1
    }));
    var t = svgEl("text", {
      x: x, y: WCY + 16, "text-anchor": "middle",
      "font-family": "Geist Mono, monospace", "font-size": "10", fill: COL.grey
    });
    t.textContent = deg + "°";
    gWaveStatic.appendChild(t);
  });
  // 90°/270° vertical guides where tan asymptotes — extra-faint
  [90, 270].forEach(function(deg) {
    var x = xWave(deg);
    gWaveStatic.appendChild(svgEl("line", {
      x1: x, y1: WY, x2: x, y2: WY + WH,
      stroke: COL.faint, "stroke-width": 0.6, "stroke-dasharray": "2 4", opacity: 0.35
    }));
  });

  // y-axis labels (±1)
  svgKaTeXLabel(gWaveStatic, WX - 12, yWave(1),  "1",  COL.grey, "center", 10);
  svgKaTeXLabel(gWaveStatic, WX - 14, yWave(-1), "-1", COL.grey, "center", 10);

  // ===== Static (faint) full-range curves over 0-360° =====
  function buildCurvePath(fn) {
    var d = "";
    var first = true, lastValid = false;
    var STEPS = 720;  // 0.5° resolution
    for (var i = 0; i <= STEPS; i++) {
      var deg = (i / STEPS) * 360;
      var rad = deg * Math.PI / 180;
      var v = fn(rad);
      if (!isFinite(v) || Math.abs(v) > WMAX_Y) {
        lastValid = false;
        continue;
      }
      var x = xWave(deg), y = yWave(v);
      if (first || !lastValid) { d += "M " + x + " " + y + " "; first = false; }
      else d += "L " + x + " " + y + " ";
      lastValid = true;
    }
    return d;
  }

  gWaveStatic.appendChild(svgEl("path", {
    d: buildCurvePath(Math.sin),
    fill: "none", stroke: COL.orange, "stroke-width": 1.3, opacity: 0.22
  }));
  gWaveStatic.appendChild(svgEl("path", {
    d: buildCurvePath(Math.cos),
    fill: "none", stroke: COL.blue, "stroke-width": 1.3, opacity: 0.22
  }));
  gWaveStatic.appendChild(svgEl("path", {
    d: buildCurvePath(Math.tan),
    fill: "none", stroke: COL.yellow, "stroke-width": 1.3, opacity: 0.18
  }));

  // Curve legends in upper-left of panel
  var legendX = WX + 10, legendY0 = WY + 14;
  function legend(label, color, dy) {
    var t = svgEl("text", {
      x: legendX, y: legendY0 + dy,
      "font-family": "Geist Mono, monospace", "font-size": "11",
      "font-weight": "700", fill: color
    });
    t.textContent = label;
    gWaveStatic.appendChild(t);
  }
  legend("sin θ", COL.orange, 0);
  legend("cos θ", COL.blue, 14);
  legend("tan θ", COL.yellow, 28);
}

renderStaticGrid();
renderStaticWavePanel();

function render() {
  gFig.innerHTML = "";
  gLbl.innerHTML = "";
  gHnd.innerHTML = "";
  gWaveTrace.innerHTML = "";

  var theta = display.theta;
  var thetaRad = theta * Math.PI / 180;
  var sinV = Math.sin(thetaRad);
  var cosV = Math.cos(thetaRad);
  var tanV = Math.tan(thetaRad);

  // Point P on the unit circle (SVG y inverted)
  var Px = CX + R * cosV;
  var Py = CY - R * sinV;
  // Foot of perpendicular from P to x-axis
  var Fx = Px;
  var Fy = CY;

  // ===== cos θ segment (blue, horizontal from origin to foot) =====
  gFig.appendChild(svgEl("line", {
    x1: CX, y1: CY, x2: Fx, y2: Fy,
    stroke: COL.blue, "stroke-width": 5, "stroke-linecap": "round"
  }));
  // ===== sin θ segment (orange, vertical from foot to P) =====
  gFig.appendChild(svgEl("line", {
    x1: Fx, y1: Fy, x2: Px, y2: Py,
    stroke: COL.orange, "stroke-width": 5, "stroke-linecap": "round"
  }));
  // ===== Radius (pink, hypotenuse of the inner right triangle) =====
  gFig.appendChild(svgEl("line", {
    x1: CX, y1: CY, x2: Px, y2: Py,
    stroke: COL.pink, "stroke-width": 3, "stroke-linecap": "round"
  }));

  // Right-angle marker at the foot, quadrant-aware (L points INTO the triangle)
  // Direction from foot toward origin (along cos segment) and toward P (along sin segment)
  var raLen = 9;
  // Need to nudge the L corner inward by raLen along both directions, then draw the two arms
  // Direction toward origin from foot: sign of (CX - Fx)
  var towardOrgX = (cosV >= 0) ? -1 : 1;  // if foot is to the right of origin, "toward origin" is -x
  // Direction toward P from foot: sign of (Py - Fy) inverted because SVG y-down → "up screen" = -y
  var towardPY = (sinV >= 0) ? -1 : 1;     // if P is above x-axis, "toward P" in SVG is -y
  if (Math.abs(sinV) > 0.05 && Math.abs(cosV) > 0.05) {
    var corner = { x: Fx + towardOrgX * raLen, y: Fy + towardPY * raLen };
    gFig.appendChild(svgEl("path", {
      d: "M " + (Fx + towardOrgX * raLen) + " " + Fy +
         " L " + corner.x + " " + corner.y +
         " L " + Fx + " " + (Fy + towardPY * raLen),
      fill: "none", stroke: COL.yellow, "stroke-width": 1.4, opacity: 0.7
    }));
  }

  // Angle arc at origin — sweep from positive x-axis CCW to current θ
  var arcR = 26;
  var arcEndX = CX + arcR * cosV;
  var arcEndY = CY - arcR * sinV;
  // For SVG arc with y-down: sweep-flag 0 traces CCW visually (which matches math CCW for positive θ)
  // large-arc-flag = 1 when |θ| > 180°
  var largeArc = (theta > 180 || theta < -180) ? 1 : 0;
  gFig.appendChild(svgEl("path", {
    d: "M " + (CX + arcR) + " " + CY +
       " A " + arcR + " " + arcR + " 0 " + largeArc + " 0 " + arcEndX + " " + arcEndY,
    fill: "none", stroke: COL.yellow, "stroke-width": 2.2
  }));
  // θ label — position at the angular midpoint, offset outward
  var midA = thetaRad / 2;
  var labR = arcR + 18;
  svgKaTeXLabel(gLbl, CX + labR * Math.cos(midA), CY - labR * Math.sin(midA),
    "{\\color{" + COL.yellow + "}\\theta = " + Math.round(theta) + "°}", null, "center", 12);

  // Side labels — placed OUTSIDE the segments (won't render if the segment is too short)
  if (Math.abs(cosV) > 0.18) {
    svgKaTeXLabel(gLbl, (CX + Fx) / 2, Fy + (sinV >= 0 ? 18 : -18),
      "{\\color{" + COL.blue + "}\\cos\\theta = " + fmtNum(cosV, 3) + "}", null, "center", 11);
  }
  if (Math.abs(sinV) > 0.18) {
    svgKaTeXLabel(gLbl, Fx + (cosV >= 0 ? 50 : -50), (Fy + Py) / 2,
      "{\\color{" + COL.orange + "}\\sin\\theta = " + fmtNum(sinV, 3) + "}", null, "center", 11);
  }

  // Point P (yellow, draggable)
  gHnd.appendChild(svgEl("circle", {
    "class": "vertex-handle", id: "handle-p",
    cx: Px, cy: Py, r: 8,
    fill: COL.yellow, stroke: "#0b1118", "stroke-width": 2
  }));

  // ===== Wave panel: traced (bright) portion of each curve from 0 to current θ =====
  function tracePath(fn) {
    var d = "";
    var first = true, lastValid = false;
    var STEPS = Math.max(16, Math.ceil(theta * 2));
    for (var i = 0; i <= STEPS; i++) {
      var deg = (i / STEPS) * theta;
      var rad = deg * Math.PI / 180;
      var v = fn(rad);
      if (!isFinite(v) || Math.abs(v) > WMAX_Y) { lastValid = false; continue; }
      var x = xWave(deg), y = yWave(v);
      if (first || !lastValid) { d += "M " + x + " " + y + " "; first = false; }
      else d += "L " + x + " " + y + " ";
      lastValid = true;
    }
    return d;
  }
  gWaveTrace.appendChild(svgEl("path", {
    d: tracePath(Math.sin),
    fill: "none", stroke: COL.orange, "stroke-width": 2.5, opacity: 0.95
  }));
  gWaveTrace.appendChild(svgEl("path", {
    d: tracePath(Math.cos),
    fill: "none", stroke: COL.blue, "stroke-width": 2.5, opacity: 0.95
  }));
  gWaveTrace.appendChild(svgEl("path", {
    d: tracePath(Math.tan),
    fill: "none", stroke: COL.yellow, "stroke-width": 2.5, opacity: 0.95
  }));

  // Cursor: vertical line at current θ
  var cursorX = xWave(theta);
  gWaveTrace.appendChild(svgEl("line", {
    x1: cursorX, y1: WY, x2: cursorX, y2: WY + WH,
    stroke: COL.faint, "stroke-width": 0.8, "stroke-dasharray": "3 3", opacity: 0.6
  }));

  // Dashed connecting lines from the circle's point to the wave panel
  // (matched scales mean these go horizontally across at the same y)
  var sinDotY = yWave(sinV);
  gWaveTrace.appendChild(svgEl("line", {
    x1: Px, y1: Py, x2: cursorX, y2: sinDotY,
    stroke: COL.orange, "stroke-width": 0.8, "stroke-dasharray": "2 4", opacity: 0.4
  }));

  // Dots at the current value of each curve
  function dot(x, y, color) {
    gWaveTrace.appendChild(svgEl("circle", {
      cx: x, cy: y, r: 4,
      fill: color, stroke: "#0b1118", "stroke-width": 1.5
    }));
  }
  dot(cursorX, sinDotY, COL.orange);
  dot(cursorX, yWave(cosV), COL.blue);
  if (Math.abs(tanV) <= WMAX_Y) {
    dot(cursorX, yWave(tanV), COL.yellow);
  }
}

// Slider wiring
var thetaSlider = document.getElementById("thetaSlider");
var thetaVal = document.getElementById("thetaVal");

function syncLabels() {
  thetaVal.textContent = fmtNum(display.theta, 0) + "°";
}
thetaSlider.addEventListener("input", function() {
  params.theta = parseFloat(thetaSlider.value);
  kickSpring();
});

// Spring loop
var rafId = null;
function kickSpring() { if (rafId) return; rafId = requestAnimationFrame(tick); }
function tick() {
  display.theta += (params.theta - display.theta) * SPRING_FACTOR;
  if (Math.abs(params.theta - display.theta) < SPRING_EPS) display.theta = params.theta;
  render();
  syncLabels();
  if (display.theta !== params.theta) {
    rafId = requestAnimationFrame(tick);
  } else {
    rafId = null;
  }
}

// Drag the point P directly
var dragging = false;
function svgPointFromEvent(evt) {
  var rect = stage.getBoundingClientRect();
  var clientX = evt.clientX != null ? evt.clientX : (evt.touches && evt.touches[0].clientX);
  var clientY = evt.clientY != null ? evt.clientY : (evt.touches && evt.touches[0].clientY);
  var x = (clientX - rect.left) * (SVG_W / rect.width);
  var y = (clientY - rect.top)  * (SVG_H / rect.height);
  return { x: x, y: y };
}
stage.addEventListener("pointerdown", function(evt) {
  if (evt.target.id === "handle-p") {
    dragging = true;
    stage.setPointerCapture(evt.pointerId);
  }
});
stage.addEventListener("pointermove", function(evt) {
  if (!dragging) return;
  var pt = svgPointFromEvent(evt);
  var dx = pt.x - CX, dy = -(pt.y - CY);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  if (ang < 0) ang += 360;  // 0 to 360 (CCW from positive x-axis)
  params.theta = ang;
  display.theta = ang;
  thetaSlider.value = ang;
  render();
  syncLabels();
});
stage.addEventListener("pointerup",   function() { dragging = false; });
stage.addEventListener("pointercancel",function() { dragging = false; });

render();
syncLabels();

// Height reporter
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
