<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Complement Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:16px 20px 18px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  .headline { display:flex; align-items:baseline; justify-content:center; gap:14px; flex-wrap:wrap; margin: 8px 0 16px; padding: 14px 8px; }
  .headline .col { display:flex; align-items:baseline; gap:8px; }
  .headline .big { font-family:'Geist Mono',monospace; font-size:42px; font-weight:700; line-height:1; min-width:110px; transition: color 0.3s ease; display:flex; align-items:center; justify-content:center; }
  .headline .big .katex { font-size:1em; }
  .headline .big.pa  { color:#00abfa; justify-content:flex-end; }
  .headline .big.pac { color:#ff4670; justify-content:flex-start; }
  .headline .lab { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.5px; text-transform:uppercase; }
  .headline .arrow { font-family:'Geist Mono',monospace; font-size:24px; color:#3a4a5a; padding:0 4px; }

  #stage { display:block; width:100%; height:auto; user-select:none; overflow:visible; touch-action:none; cursor:default; }
  #stage.grabbing { cursor:grabbing; }
  #stage.hover-grab { cursor:grab; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; justify-content:center; }
  .act-btn { background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:6px 12px; border-radius:5px; cursor:pointer; transition: all 0.12s ease; }
  .act-btn:hover { color:#fff067; border-color:#3a4a5a; }
  .act-btn.active { color:#fff067; border-color:#fff067; background:rgba(255,240,103,0.06); }

  .footer { font-family:'Geist Mono',monospace; font-size:12px; color:#7a7875; text-align:center; margin-top:14px; line-height:1.5; }
  .footer .id { color:#0fee89; font-weight:600; }
  .footer .id .katex { font-size:1em; }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 1.5px currentColor); }
    50%      { filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 10px currentColor); }
  }
  .handle { animation: pulse-glow 1.8s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">EVENT A AND ITS COMPLEMENT</span>
    <span class="meta">drag, or tap a snap value</span>
  </div>

  <div class="headline">
    <span class="col">
      <span class="big pa" id="pa-display"></span>
      <span class="lab">P(A)</span>
    </span>
    <span class="arrow">+</span>
    <span class="col">
      <span class="big pac" id="pac-display"></span>
      <span class="lab">P(A')</span>
    </span>
    <span class="arrow">=</span>
    <span class="col">
      <span class="big" style="color:#0fee89" id="sum-display">1</span>
      <span class="lab">always</span>
    </span>
  </div>

  <svg id="stage" viewBox="0 0 480 140" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-bg"></g>
    <g id="g-regions"></g>
    <g id="g-labels"></g>
    <g id="g-divider"></g>
  </svg>

  <div class="actions" id="snap-actions"></div>

  <div class="footer">
    <span class="id" id="identity"></span>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:"#00abfa", pink:"#ff4670", yellow:"#fff067", green:"#0fee89",
  faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

var SVG_W = 480, SVG_H = 140;
var BOX_LEFT = 30, BOX_RIGHT = 450, BOX_TOP = 16, BOX_BOT = 116;
var BOX_W = BOX_RIGHT - BOX_LEFT;

var SNAPS = [
  { n:0, d:1, label:"0"        },
  { n:1, d:4, label:"\\tfrac{1}{4}" },
  { n:1, d:3, label:"\\tfrac{1}{3}" },
  { n:2, d:5, label:"\\tfrac{2}{5}" },
  { n:1, d:2, label:"\\tfrac{1}{2}" },
  { n:3, d:5, label:"\\tfrac{3}{5}" },
  { n:2, d:3, label:"\\tfrac{2}{3}" },
  { n:3, d:4, label:"\\tfrac{3}{4}" },
  { n:1, d:1, label:"1"        }
];
// Broader snap pool the divider can rest on (richer than the buttons)
var FRACTIONS = [
  {n:0, d:1}, {n:1, d:10}, {n:1, d:5}, {n:1, d:4}, {n:3, d:10},
  {n:1, d:3}, {n:2, d:5}, {n:1, d:2}, {n:3, d:5}, {n:2, d:3},
  {n:7, d:10}, {n:3, d:4}, {n:4, d:5}, {n:9, d:10}, {n:1, d:1}
];

var P = { p: 2/5 };
var D = { p: 2/5 };
var SPRING = 0.22, EPS = 0.0008;
var raf = null;

function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}
function svgKaTeXLabel(parent, x, y, tex, color, align, width){
  align = align || "center";
  width = width || 100;
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - width/2); fo.setAttribute("y", y - 11);
  fo.setAttribute("width", width); fo.setAttribute("height", 22);
  fo.style.overflow = "visible"; fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px"; div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host"; div.style.color = color || COL.off;
  fo.appendChild(div); parent.appendChild(fo);
  tryRender(div, tex);
}
function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function snapFraction(p){
  var best = FRACTIONS[0], dBest = Math.abs(p - 0);
  for (var i = 1; i < FRACTIONS.length; i++){
    var v = FRACTIONS[i].n / FRACTIONS[i].d;
    var d = Math.abs(p - v);
    if (d < dBest){ dBest = d; best = FRACTIONS[i]; }
  }
  return best;
}

function matchSnapIndex(p){
  // Return the index of the snap button whose value is closest to p, or -1 if none is exact
  for (var i = 0; i < SNAPS.length; i++){
    var v = SNAPS[i].n / SNAPS[i].d;
    if (Math.abs(v - p) < 1e-6) return i;
  }
  return -1;
}

// ----- background -----
function drawBackground(){
  var g = document.getElementById("g-bg");
  clear(g);
  var r = document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x", BOX_LEFT); r.setAttribute("y", BOX_TOP);
  r.setAttribute("width", BOX_W); r.setAttribute("height", BOX_BOT - BOX_TOP);
  r.setAttribute("rx", 8);
  r.setAttribute("fill", "none");
  r.setAttribute("stroke", "#3a4a5a"); r.setAttribute("stroke-width", 1.2);
  g.appendChild(r);
  // Ω at top-right corner
  svgKaTeXLabel(g, BOX_RIGHT - 12, BOX_TOP - 8, "\\Omega", "#7a7875", "right", 30);
}

function drawRegions(){
  var g = document.getElementById("g-regions");
  clear(g);
  var p = D.p;
  var x = BOX_LEFT + p * BOX_W;
  if (p > 0.001){
    var a = document.createElementNS("http://www.w3.org/2000/svg","path");
    a.setAttribute("d", roundedLeft(BOX_LEFT, BOX_TOP, x - BOX_LEFT, BOX_BOT - BOX_TOP, 8));
    a.setAttribute("fill", "rgba(0,171,250,0.22)");
    g.appendChild(a);
  }
  if (p < 0.999){
    var ac = document.createElementNS("http://www.w3.org/2000/svg","path");
    ac.setAttribute("d", roundedRight(x, BOX_TOP, BOX_RIGHT - x, BOX_BOT - BOX_TOP, 8));
    ac.setAttribute("fill", "rgba(255,70,112,0.18)");
    g.appendChild(ac);
  }
}
function roundedLeft(x, y, w, h, r){
  r = Math.min(r, w, h / 2);
  return "M " + (x + r) + " " + y +
         " L " + (x + w) + " " + y +
         " L " + (x + w) + " " + (y + h) +
         " L " + (x + r) + " " + (y + h) +
         " Q " + x + " " + (y + h) + " " + x + " " + (y + h - r) +
         " L " + x + " " + (y + r) +
         " Q " + x + " " + y + " " + (x + r) + " " + y + " Z";
}
function roundedRight(x, y, w, h, r){
  r = Math.min(r, w, h / 2);
  return "M " + x + " " + y +
         " L " + (x + w - r) + " " + y +
         " Q " + (x + w) + " " + y + " " + (x + w) + " " + (y + r) +
         " L " + (x + w) + " " + (y + h - r) +
         " Q " + (x + w) + " " + (y + h) + " " + (x + w - r) + " " + (y + h) +
         " L " + x + " " + (y + h) + " Z";
}

function drawLabels(){
  var g = document.getElementById("g-labels");
  clear(g);
  var p = D.p;
  if (p > 0.08){
    var aMid = BOX_LEFT + (p * BOX_W) / 2;
    svgKaTeXLabel(g, aMid, (BOX_TOP + BOX_BOT) / 2, "A", "#00abfa", "center", 40);
  }
  if (p < 0.92){
    var acMid = BOX_LEFT + p * BOX_W + ((1 - p) * BOX_W) / 2;
    svgKaTeXLabel(g, acMid, (BOX_TOP + BOX_BOT) / 2, "A'", "#ff4670", "center", 40);
  }
}

function drawDivider(){
  var g = document.getElementById("g-divider");
  clear(g);
  var x = BOX_LEFT + D.p * BOX_W;
  var l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1", x); l.setAttribute("x2", x);
  l.setAttribute("y1", BOX_TOP - 6); l.setAttribute("y2", BOX_BOT + 6);
  l.setAttribute("stroke", "#fff067"); l.setAttribute("stroke-width", 2);
  l.setAttribute("opacity", 0.85);
  g.appendChild(l);
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", x); c.setAttribute("cy", (BOX_TOP + BOX_BOT) / 2);
  c.setAttribute("r", 8);
  c.setAttribute("fill", "#fff067");
  c.setAttribute("stroke", "#0b1118"); c.setAttribute("stroke-width", 2);
  c.setAttribute("class", "handle"); c.style.color = "#fff067";
  g.appendChild(c);
}

function fmtFraction(p){
  if (p === 0) return "0";
  if (p === 1) return "1";
  var fr = snapFraction(p);
  if (fr.d === 1) return String(fr.n);
  return "\\dfrac{" + fr.n + "}{" + fr.d + "}";
}

function renderHeadline(){
  var p = P.p;
  var paEl = document.getElementById("pa-display");
  var pacEl = document.getElementById("pac-display");
  paEl.innerHTML = ""; pacEl.innerHTML = "";
  tryRender(paEl, fmtFraction(p));
  tryRender(pacEl, fmtFraction(1 - p));
}

function buildSnapActions(){
  var host = document.getElementById("snap-actions");
  host.innerHTML = "";
  SNAPS.forEach(function(s, i){
    var b = document.createElement("button");
    b.className = "act-btn";
    b.dataset.idx = i;
    var span = document.createElement("span");
    tryRender(span, s.label);
    b.appendChild(span);
    b.addEventListener("click", function(){
      P.p = s.n / s.d;
      kick();
    });
    host.appendChild(b);
  });
}

function paintActiveSnap(){
  var idx = matchSnapIndex(P.p);
  document.querySelectorAll(".act-btn").forEach(function(b, i){
    b.classList.toggle("active", i === idx);
  });
}

function renderIdentity(){
  var p = P.p;
  var fEl = document.getElementById("identity");
  fEl.innerHTML = "";
  var paTex = fmtFraction(p);
  var pacTex = fmtFraction(1 - p);
  tryRender(fEl, "{\\color{#00abfa}P(A)} + {\\color{#ff4670}P(A')} = " + paTex + " + " + pacTex + " = {\\color{#0fee89}1}");
}

function refresh(){
  drawRegions();
  drawLabels();
  drawDivider();
  renderHeadline();
  renderIdentity();
  paintActiveSnap();
}

// drag
var stage = document.getElementById("stage");
var dragging = false;
function svgPt(e){
  var pt = stage.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}
function withinHandle(m){
  var x = BOX_LEFT + D.p * BOX_W;
  var cy = (BOX_TOP + BOX_BOT) / 2;
  return Math.abs(m.x - x) < 14 && Math.abs(m.y - cy) < 24;
}
function withinBox(m){
  return m.x >= BOX_LEFT - 12 && m.x <= BOX_RIGHT + 12 &&
         m.y >= BOX_TOP - 12  && m.y <= BOX_BOT + 12;
}
stage.addEventListener("pointerdown", function(e){
  var m = svgPt(e);
  if (!withinBox(m)) return;
  e.preventDefault();
  dragging = true;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("grabbing");
  applyDrag(m);
});
stage.addEventListener("pointermove", function(e){
  var m = svgPt(e);
  if (!dragging){
    if (withinHandle(m)) stage.classList.add("hover-grab");
    else stage.classList.remove("hover-grab");
    return;
  }
  e.preventDefault();
  applyDrag(m);
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  try { stage.releasePointerCapture(e.pointerId); } catch(_){}
  stage.classList.remove("grabbing");
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", function(){ stage.classList.remove("hover-grab"); });

function applyDrag(m){
  var p = Math.max(0, Math.min(1, (m.x - BOX_LEFT) / BOX_W));
  var fr = snapFraction(p);
  P.p = fr.n / fr.d;
  kick();
}

function settled(){ return Math.abs(P.p - D.p) < EPS; }
function step(){
  D.p += (P.p - D.p) * SPRING;
  refresh();
  if (!settled()) raf = requestAnimationFrame(step);
  else {
    raf = null;
    D.p = P.p;
    refresh();
  }
}
function kick(){ if (raf == null) raf = requestAnimationFrame(step); notifyHeight(); }

function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

drawBackground();
buildSnapActions();
refresh();
setTimeout(notifyHeight, 200);
</script>
</body>
</html>
