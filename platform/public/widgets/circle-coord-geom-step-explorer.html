<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Coord Geometry Circle Step Explorer (4.8)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:22px; gap:10px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .step-num { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }
  .stage-outer { width:100%; max-width:660px; margin:0 auto; aspect-ratio: 660 / 360; position:relative; }
  .stage { position:absolute; top:0; left:0; width:660px; height:360px; transform-origin: top left; overflow:hidden; border-radius:6px; }
  .draw-line { transition: width 0.7s cubic-bezier(0.4, 0.1, 0.4, 1); }
  .draw-fade { opacity:0; transition: opacity 0.35s ease; transition-delay: 0.35s; }
  .draw-fade.drawn { opacity:1; }
  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:80px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl:disabled { opacity:0.3; cursor:not-allowed; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">step 0: A(2,1), B(8,1), C(8,9) lie on a circle</span>
    <span class="step-num" id="counter">0 / 4</span>
  </div>
  <div class="stage-outer" id="stage-outer">
    <div class="stage" id="stage"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="prev">← prev</button>
    <button class="ctl" id="next">next →</button>
  </div>
  <p class="footer">find centre · radius · tangent length OP</p>
</div>

<script>
"use strict";

// Coord-geometry sketch (left half of stage). Origin at screen point
// ORIG = (50, 280). Scale 22 px per unit. (xu, yu) → (50 + 22 xu, 280 − 22 yu).
//   A(2,1) → (94, 258)   B(8,1) → (226, 258)   C(8,9) → (226, 82)
//   Midpoint AB (5,1) → (160, 258)
//   Midpoint BC (8,5) → (226, 170)
//   Centre O = (5,5) → (160, 170). Radius 5 units → 110 px.
var ORIG = { x: 50, y: 280 };
var S = 22;
function pt(xu, yu) { return { x: ORIG.x + S*xu, y: ORIG.y - S*yu }; }
var A = pt(2, 1);
var B = pt(8, 1);
var C = pt(8, 9);
var O = pt(5, 5);
var Mab = pt(5, 1);
var Mbc = pt(8, 5);
var R_d = 5 * S;

var stage      = document.getElementById("stage");
var stageOuter = document.getElementById("stage-outer");
var STAGE_W    = 660, STAGE_H = 360;
function fitStage() {
  var w = stageOuter.clientWidth;
  if (!w) return;
  stage.style.transform = "scale(" + (w / STAGE_W) + ")";
}
fitStage();
window.addEventListener("resize", fitStage);
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(stageOuter);

function setStyle(el, s) { for (var k in s) el.style[k] = s[k]; }
function makeNode(tag, style, dataStep, cls) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  setStyle(n, style);
  if (dataStep != null) n.dataset.step = String(dataStep);
  stage.appendChild(n);
  return n;
}
function lineEl(x1, y1, x2, y2, color, thickness, dashed, dataStep) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx*dx + dy*dy);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  var t = thickness || 2;
  var s = {
    position: "absolute",
    left: x1 + "px", top: y1 + "px",
    width: "0px", height: t + "px",
    transformOrigin: "0 50%",
    transform: "translateY(" + (-t/2) + "px) rotate(" + ang + "deg)"
  };
  if (dashed) {
    s.background = "transparent";
    s.borderTop = t + "px dashed " + color;
    s.height = "0px";
  } else {
    s.background = color;
  }
  var node = makeNode("div", s, dataStep, "draw-line");
  node._fullWidth = len;
  return node;
}
function dotEl(x, y, color, size, dataStep) {
  var sz = size || 7;
  return makeNode("div", {
    position: "absolute",
    left: (x - sz/2) + "px", top: (y - sz/2) + "px",
    width: sz + "px", height: sz + "px",
    borderRadius: "50%", background: color
  }, dataStep, "draw-fade");
}
function labelEl(x, y, text, color, fontSize, dataStep, opts) {
  opts = opts || {};
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px", top: y + "px",
    fontFamily: opts.font || "'Geist Mono', monospace",
    fontSize: (fontSize || 11) + "px",
    color: color, fontWeight: opts.weight || "700",
    whiteSpace: "nowrap", pointerEvents: "none"
  }, dataStep, "draw-fade");
  n.textContent = text;
  return n;
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function texEl(x, y, tex, color, fontSize, dataStep) {
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px", top: y + "px",
    fontSize: (fontSize || 14) + "px",
    color: color, whiteSpace: "nowrap", pointerEvents: "none"
  }, dataStep, "draw-fade");
  tryRender(n, tex);
  return n;
}

// ===== Step 0 — origin tick + faint circle outline + chords + vertices =
// Origin tick (cross at (50, 280)) and (0,0) label
makeNode("div", {
  position: "absolute",
  left: ORIG.x + "px", top: (ORIG.y - 0.75) + "px",
  width: "10px", height: "1.5px", background: "#3a4a5a",
  pointerEvents: "none"
});
makeNode("div", {
  position: "absolute",
  left: (ORIG.x - 0.75) + "px", top: (ORIG.y - 5) + "px",
  width: "1.5px", height: "10px", background: "#3a4a5a",
  pointerEvents: "none"
});
labelEl(ORIG.x - 18, ORIG.y + 6, "(0,0)", "#3a4a5a", 10, 0);

// Faint circle outline (always visible — three points DO lie on a circle)
makeNode("div", {
  position: "absolute",
  left: (O.x - R_d) + "px", top: (O.y - R_d) + "px",
  width: (2*R_d) + "px", height: (2*R_d) + "px",
  borderRadius: "50%",
  border: "1.5px solid #1a2330",
  pointerEvents: "none"
});

// Chords AB and BC drawn in blue (the two we'll bisect)
lineEl(A.x, A.y, B.x, B.y, "#00abfa", 2.5, false, 0);
lineEl(B.x, B.y, C.x, C.y, "#00abfa", 2.5, false, 0);

// Vertices A, B, C with coord labels
dotEl(A.x, A.y, "#fff067", 8, 0);
labelEl(A.x - 28, A.y + 8, "A(2,1)", "#fff067", 12, 0);

dotEl(B.x, B.y, "#fff067", 8, 0);
labelEl(B.x + 8, B.y + 8, "B(8,1)", "#fff067", 12, 0);

dotEl(C.x, C.y, "#fff067", 8, 0);
labelEl(C.x + 8, C.y - 16, "C(8,9)", "#fff067", 12, 0);

// ===== Step 1 — midpoints + perpendicular bisectors ====================
// Midpoint of AB at (5,1) → (160, 258); midpoint of BC at (8,5) → (226, 170).
dotEl(Mab.x, Mab.y, "#0fee89", 6, 1);
labelEl(Mab.x - 12, Mab.y + 8, "(5,1)", "#0fee89", 10, 1);

dotEl(Mbc.x, Mbc.y, "#0fee89", 6, 1);
labelEl(Mbc.x + 8, Mbc.y - 6, "(8,5)", "#0fee89", 10, 1);

// Perpendicular bisector of AB: vertical dashed line at x = 5 (screen 160).
lineEl(160, 60, 160, 290, "#0fee89", 1.6, true, 1);
labelEl(166, 48, "x = 5", "#0fee89", 11, 1);

// Perpendicular bisector of BC: horizontal dashed line at y = 5 (screen 170).
lineEl(50, 170, 290, 170, "#0fee89", 1.6, true, 1);
labelEl(296, 164, "y = 5", "#0fee89", 11, 1);

// ===== Step 2 — centre O at intersection (pink) ========================
dotEl(O.x, O.y, "#ff4670", 10, 2);
labelEl(O.x + 10, O.y - 18, "O(5,5)", "#ff4670", 12, 2);

// ===== Step 3 — radius from O to A drawn (pink) ========================
lineEl(O.x, O.y, A.x, A.y, "#ff4670", 2.5, false, 3);
// "5" label at the midpoint of OA, offset outward.
// Midpoint of OA = ((160+94)/2, (170+258)/2) = (127, 214). OA direction
// (-0.6, 0.8); outward perpendicular = (-0.8, -0.6); place "r=5" at
// (127 - 22, 214 - 18) ≈ (105, 196).
labelEl(105, 198, "r = 5", "#ff4670", 12, 3);

// ===== Equation panel (RIGHT side) =====================================
// (a) Find centre =======================================================
texEl(360,  18, "\\text{(a) Find centre}",                "#7a7875", 13, 1);
texEl(360,  40, "\\text{midpt }AB = (5, 1) \\Rightarrow x = 5",
                                                          "#0fee89", 14, 1);
texEl(360,  72, "\\text{midpt }BC = (8, 5) \\Rightarrow y = 5",
                                                          "#0fee89", 14, 1);
texEl(360, 108, "O = (5,\\, 5)",                          "#ff4670", 19, 2);

// (b) Radius ============================================================
texEl(360, 144, "\\text{(b) Radius (use }O \\text{ to }A\\text{)}",
                                                          "#7a7875", 13, 3);
texEl(360, 166, "r = \\sqrt{(5-2)^2 + (5-1)^2}",          "#fff067", 14, 3);
texEl(360, 196, "r = \\sqrt{9 + 16} = \\sqrt{25} = 5",    "#0fee89", 17, 3);

// (c) Tangent length OP =================================================
texEl(360, 232, "\\text{(c) Tangent }PT = 12,\\ \\angle OTP = 90\\degree",
                                                          "#7a7875", 13, 4);
texEl(360, 254, "OP^2 = 5^2 + 12^2 = 25 + 144 = 169",      "#fff067", 14, 4);
texEl(360, 286, "OP = \\sqrt{169} = 13\\ \\text{cm}",      "#0fee89", 19, 4);
texEl(360, 322, "\\text{(tangent} \\perp \\text{radius at point of contact)}",
                                                          "#7a7875", 11, 4);

// ===== Step controller =================================================
var STEPS = [
  "step 0: A(2,1), B(8,1), C(8,9) lie on a circle",
  "step 1 (a): midpoints + perpendicular bisectors",
  "step 2 (a): centre O at intersection",
  "step 3 (b): radius = distance from O to A",
  "step 4 (c): tangent length OP via Pythagoras"
];
var step = 0, maxStep = STEPS.length - 1;
var titleEl   = document.getElementById("title");
var counterEl = document.getElementById("counter");
var prevBtn   = document.getElementById("prev");
var nextBtn   = document.getElementById("next");
function setStep(n) {
  step = Math.max(0, Math.min(maxStep, n));
  titleEl.textContent = STEPS[step];
  counterEl.textContent = step + " / " + maxStep;
  var els = stage.querySelectorAll("[data-step]");
  for (var i = 0; i < els.length; i++) {
    var s = parseInt(els[i].dataset.step, 10);
    var el = els[i];
    if (s <= step) {
      el.classList.add("drawn");
      if (el._fullWidth != null) el.style.width = el._fullWidth + "px";
    } else {
      el.classList.remove("drawn");
      if (el._fullWidth != null) el.style.width = "0px";
    }
  }
  prevBtn.disabled = (step === 0);
  nextBtn.disabled = (step === maxStep);
}
prevBtn.onclick = function() { setStep(step - 1); };
nextBtn.onclick = function() { setStep(step + 1); };
setStep(0);

// ===== Height reporter =================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
