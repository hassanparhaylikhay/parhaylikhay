<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gradient Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }
  .head { display:flex; align-items:center; justify-content:center; min-height:24px; margin-bottom:10px; }
  .head .formula { font-size:15px; color:#0fee89; }
  .head .formula .katex { font-size:1em; }

  .controls { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px 14px; margin-bottom:8px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:6px; min-width:0; }
  .row .name { font-weight:600; min-width:24px; }
  .row.A .name { color:#fff067; }
  .row.B .name { color:#ff4670; }
  .row input[type=range] { flex:1; min-width:50px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row.A input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row.A input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row.B input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#ff4670; cursor:pointer; border:0; }
  .row.B input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#ff4670; cursor:pointer; border:0; }
  .row .val { min-width:24px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .line { stroke:#00abfa; stroke-width:2.4; fill:none; }
  .rise-run { stroke:#7a7875; stroke-width:1.4; stroke-dasharray:4 4; }
  .rise-run-lbl { font-family:'Geist Mono',monospace; font-size:11px; fill:#7a7875; }
  .pt-A { fill:#fff067; }
  .pt-B { fill:#ff4670; }

  .readout { margin-top:10px; padding:10px 14px; background:#07090d; border:1px solid #141e2a; border-radius:8px; text-align:center; font-family:'Geist Mono',monospace; font-size:13px; color:#f0eeea; }
  .readout .step { color:#7a7875; }
  .readout .grad { color:#0fee89; font-weight:700; font-size:15px; }
  .readout .infinity { color:#ff4670; font-weight:700; }
  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>
  <div class="controls">
    <div class="row A"><span class="name">A x</span><input type="range" id="ax" min="-6" max="6" value="-2" step="1"/><span class="val" id="vax">-2</span></div>
    <div class="row A"><span class="name">A y</span><input type="range" id="ay" min="-4" max="4" value="-1" step="1"/><span class="val" id="vay">-1</span></div>
    <div class="row B"><span class="name">B x</span><input type="range" id="bx" min="-6" max="6" value="3" step="1"/><span class="val" id="vbx">3</span></div>
    <div class="row B"><span class="name">B y</span><input type="range" id="by" min="-4" max="4" value="3" step="1"/><span class="val" id="vby">3</span></div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <line class="line" id="lineEl"/>
    <line class="rise-run" id="runLine"/>
    <line class="rise-run" id="riseLine"/>
    <text class="rise-run-lbl" id="runLbl"></text>
    <text class="rise-run-lbl" id="riseLbl"></text>
    <circle class="pt-A" id="ptA" r="5"/>
    <circle class="pt-B" id="ptB" r="5"/>
    <text class="rise-run-lbl" id="aLbl" fill="#fff067">A</text>
    <text class="rise-run-lbl" id="bLbl" fill="#ff4670">B</text>
  </svg>

  <div class="readout" id="readout"></div>
  <p class="footer">drag A and B · the dashed triangle shows rise (vertical) and run (horizontal)</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

const PLOT = { xMin: -6, xMax: 6, yMin: -4, yMax: 4, pxPerUnit: 35, ml: 40, mr: 30, mt: 20, mb: 30 };
function plotW() { return (PLOT.xMax - PLOT.xMin) * PLOT.pxPerUnit; }
function plotH() { return (PLOT.yMax - PLOT.yMin) * PLOT.pxPerUnit; }
function xPx(x) { return PLOT.ml + (x - PLOT.xMin) * PLOT.pxPerUnit; }
function yPx(y) { return PLOT.mt + plotH() - (y - PLOT.yMin) * PLOT.pxPerUnit; }

(function buildAxes() {
  const NS = "http://www.w3.org/2000/svg";
  const grid = document.getElementById("grid");
  const ticks = document.getElementById("ticks");
  for (let xi = Math.ceil(PLOT.xMin); xi <= Math.floor(PLOT.xMax); xi++) {
    if (xi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(xi)); ln.setAttribute("x2", xPx(xi));
    ln.setAttribute("y1", yPx(PLOT.yMax)); ln.setAttribute("y2", yPx(PLOT.yMin));
    grid.appendChild(ln);
  }
  for (let yi = Math.ceil(PLOT.yMin); yi <= Math.floor(PLOT.yMax); yi++) {
    if (yi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(PLOT.xMin)); ln.setAttribute("x2", xPx(PLOT.xMax));
    ln.setAttribute("y1", yPx(yi)); ln.setAttribute("y2", yPx(yi));
    grid.appendChild(ln);
  }
  document.getElementById("xAxis").setAttribute("x1", xPx(PLOT.xMin));
  document.getElementById("xAxis").setAttribute("x2", xPx(PLOT.xMax));
  document.getElementById("xAxis").setAttribute("y1", yPx(0));
  document.getElementById("xAxis").setAttribute("y2", yPx(0));
  document.getElementById("yAxis").setAttribute("x1", xPx(0));
  document.getElementById("yAxis").setAttribute("x2", xPx(0));
  document.getElementById("yAxis").setAttribute("y1", yPx(PLOT.yMax));
  document.getElementById("yAxis").setAttribute("y2", yPx(PLOT.yMin));
  for (let xi = Math.ceil(PLOT.xMin); xi <= Math.floor(PLOT.xMax); xi++) {
    if (xi === 0) continue;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "axis-tick-label"); t.setAttribute("text-anchor", "middle");
    t.setAttribute("x", xPx(xi)); t.setAttribute("y", yPx(0) + 14);
    t.textContent = String(xi);
    ticks.appendChild(t);
  }
  for (let yi = Math.ceil(PLOT.yMin); yi <= Math.floor(PLOT.yMax); yi++) {
    if (yi === 0) continue;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "axis-tick-label"); t.setAttribute("text-anchor", "end");
    t.setAttribute("x", xPx(0) - 6); t.setAttribute("y", yPx(yi) + 3);
    t.textContent = String(yi);
    ticks.appendChild(t);
  }
})();

let tA = { x: -2, y: -1 }, tB = { x: 3, y: 3 };
let dA = { x: -2, y: -1 }, dB = { x: 3, y: 3 };
const SPRING = 0.22;

function fmt(v) {
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  return String(Math.round(v * 100) / 100);
}

function tick() {
  dA.x += (tA.x - dA.x) * SPRING; dA.y += (tA.y - dA.y) * SPRING;
  dB.x += (tB.x - dB.x) * SPRING; dB.y += (tB.y - dB.y) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function clipLine(x1, y1, x2, y2) {
  // Extend the line through (A, B) to the plot edges. If A.x === B.x the line is vertical.
  if (Math.abs(x2 - x1) < 1e-6) {
    return { x1: x1, y1: PLOT.yMin, x2: x1, y2: PLOT.yMax };
  }
  const m = (y2 - y1) / (x2 - x1);
  const c = y1 - m * x1;
  return { x1: PLOT.xMin, y1: m * PLOT.xMin + c, x2: PLOT.xMax, y2: m * PLOT.xMax + c };
}

function draw() {
  const aPx = { x: xPx(dA.x), y: yPx(dA.y) };
  const bPx = { x: xPx(dB.x), y: yPx(dB.y) };
  document.getElementById("ptA").setAttribute("cx", aPx.x);
  document.getElementById("ptA").setAttribute("cy", aPx.y);
  document.getElementById("ptB").setAttribute("cx", bPx.x);
  document.getElementById("ptB").setAttribute("cy", bPx.y);
  document.getElementById("aLbl").setAttribute("x", aPx.x + 7);
  document.getElementById("aLbl").setAttribute("y", aPx.y - 7);
  document.getElementById("bLbl").setAttribute("x", bPx.x + 7);
  document.getElementById("bLbl").setAttribute("y", bPx.y - 7);

  const seg = clipLine(dA.x, dA.y, dB.x, dB.y);
  document.getElementById("lineEl").setAttribute("x1", xPx(seg.x1));
  document.getElementById("lineEl").setAttribute("y1", yPx(seg.y1));
  document.getElementById("lineEl").setAttribute("x2", xPx(seg.x2));
  document.getElementById("lineEl").setAttribute("y2", yPx(seg.y2));

  // Rise/run dashed triangle, anchored at A → corner (B.x, A.y) → B
  const cornerPx = { x: bPx.x, y: aPx.y };
  document.getElementById("runLine").setAttribute("x1", aPx.x);
  document.getElementById("runLine").setAttribute("y1", aPx.y);
  document.getElementById("runLine").setAttribute("x2", cornerPx.x);
  document.getElementById("runLine").setAttribute("y2", aPx.y);
  document.getElementById("riseLine").setAttribute("x1", cornerPx.x);
  document.getElementById("riseLine").setAttribute("y1", aPx.y);
  document.getElementById("riseLine").setAttribute("x2", cornerPx.x);
  document.getElementById("riseLine").setAttribute("y2", bPx.y);

  document.getElementById("runLbl").setAttribute("x", (aPx.x + cornerPx.x) / 2);
  document.getElementById("runLbl").setAttribute("y", aPx.y + 14);
  document.getElementById("runLbl").setAttribute("text-anchor", "middle");
  document.getElementById("runLbl").textContent = "run = " + fmt(tB.x - tA.x);
  document.getElementById("riseLbl").setAttribute("x", cornerPx.x + 6);
  document.getElementById("riseLbl").setAttribute("y", (aPx.y + bPx.y) / 2);
  document.getElementById("riseLbl").textContent = "rise = " + fmt(tB.y - tA.y);

  // Readout
  const dx = tB.x - tA.x, dy = tB.y - tA.y;
  let gradTex;
  if (dx === 0) {
    gradTex = "\\text{undefined (vertical)}";
    document.getElementById("readout").innerHTML =
      '<span class="step">rise / run = </span><span class="step">' + dy + ' / 0 = </span>' +
      '<span class="infinity" id="gradVal">undefined</span>';
  } else {
    const g = dy / dx;
    document.getElementById("readout").innerHTML =
      '<span class="step">rise / run = </span><span class="step">\\dfrac{' + dy + '}{' + dx + '} = </span>' +
      '<span class="grad" id="gradVal">' + fmt(g) + '</span>';
    // Render the fraction part with KaTeX
    const r = document.getElementById("readout");
    r.innerHTML =
      '<span class="step">slope = </span>' +
      '<span class="step" id="rrTex"></span>' +
      ' <span class="step">= </span>' +
      '<span class="grad">' + fmt(g) + '</span>';
    tryRender(document.getElementById("rrTex"), "\\dfrac{\\text{rise}}{\\text{run}} = \\dfrac{" + dy + "}{" + dx + "}");
  }

  tryRender(document.getElementById("formula"),
    "A(" + tA.x + ",\\;" + tA.y + ") \\quad B(" + tB.x + ",\\;" + tB.y + ")");
}

document.getElementById("ax").addEventListener("input", e => { tA.x = parseInt(e.target.value, 10); document.getElementById("vax").textContent = tA.x; });
document.getElementById("ay").addEventListener("input", e => { tA.y = parseInt(e.target.value, 10); document.getElementById("vay").textContent = tA.y; });
document.getElementById("bx").addEventListener("input", e => { tB.x = parseInt(e.target.value, 10); document.getElementById("vbx").textContent = tB.x; });
document.getElementById("by").addEventListener("input", e => { tB.y = parseInt(e.target.value, 10); document.getElementById("vby").textContent = tB.y; });

tick();

let lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    const wrap = document.getElementById("wrap");
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    const padTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const padBot = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const h = Math.ceil(rect.height + padTop + padBot);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
setTimeout(reportHeight, 200);
</script>
</body>
</html>
