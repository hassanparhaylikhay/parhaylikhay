<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cyclic Quadrilateral</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:8px; min-height:22px; }
  .formula { font-size:15px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  canvas { display:block; width:100%; height:auto; user-select:none; touch-action:none; }

  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <canvas id="c"></canvas>

  <p class="footer">drag any vertex: opposite angles always sum to 180 degrees</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 560, H = 380;

function setupCanvas() {
  var DPR = window.devicePixelRatio || 1;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  canvas.style.aspectRatio = W + ' / ' + H;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(DPR, DPR);
}
setupCanvas();

var CX = W / 2;
var CY = H / 2 + 4;
var R_PX = 138;

function ptOnCircle(t) {
  return { x: CX + Math.cos(t) * R_PX, y: CY + Math.sin(t) * R_PX };
}

function N(a) { return ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); }

// Initial angles: A, B, C, D in clockwise canvas-y order (canvas y is down).
// Using math angle where 0 = right, increasing CCW in math, but canvas y flips
// so on screen, increasing math angle goes CCW visually as well.
// We keep theta in [0, 2pi) and enforce strict ordering tA < tB < tC < tD.
var tA = N(200 * Math.PI / 180);
var tB = N(290 * Math.PI / 180);
var tC = N( 20 * Math.PI / 180);
var tD = N(120 * Math.PI / 180);

var PAD = 5 * Math.PI / 180;

// Ordering invariant: the four points appear in order A, B, C, D as we
// sweep CCW from tA. So N(tB - tA), N(tC - tB), N(tD - tC), N(tA - tD)
// should all be positive and sum to 2 pi.
function setVertex(name, t) {
  t = N(t);
  // Each vertex is clamped to stay strictly between its two neighbours.
  // For vertex X with prev P and next Q (CCW order), we need
  // N(t - tP) >= PAD and N(tQ - t) >= PAD.
  var prev, next;
  if (name === 'A') { prev = tD; next = tB; }
  else if (name === 'B') { prev = tA; next = tC; }
  else if (name === 'C') { prev = tB; next = tD; }
  else { prev = tC; next = tA; }
  var gap = N(next - prev);
  // available range from prev+PAD to next-PAD
  var offset = N(t - prev);
  if (offset < PAD) offset = PAD;
  if (offset > gap - PAD) offset = gap - PAD;
  var newT = N(prev + offset);
  if (name === 'A') tA = newT;
  else if (name === 'B') tB = newT;
  else if (name === 'C') tC = newT;
  else tD = newT;
}

// Interior angle at vertex V given the two neighbour vertices U and W.
// Interior angle = angle between vectors VU and VW.
function interiorAngle(V, U, W) {
  var ux = U.x - V.x, uy = U.y - V.y;
  var wx = W.x - V.x, wy = W.y - V.y;
  var dot = ux * wx + uy * wy;
  var mag = Math.sqrt(ux * ux + uy * uy) * Math.sqrt(wx * wx + wy * wy);
  if (mag === 0) return 0;
  var c = dot / mag;
  if (c > 1) c = 1; if (c < -1) c = -1;
  return Math.acos(c);
}

// Draw a small angle arc at vertex V, sweeping from the direction toward U
// to the direction toward W, picking the inner (smaller) sweep so it lands
// inside the quadrilateral.
function drawAngleArc(V, U, W, radius, color) {
  var a1 = Math.atan2(U.y - V.y, U.x - V.x);
  var a2 = Math.atan2(W.y - V.y, W.x - V.x);
  // Determine the arc that goes the SHORT way (interior, < 180 deg).
  var diff = ((a2 - a1) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  var anticlockwise = diff > Math.PI;
  ctx.beginPath();
  ctx.arc(V.x, V.y, radius, a1, a2, anticlockwise);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // return the bisector direction (canvas-space) for label placement
  var midAng;
  if (anticlockwise) {
    midAng = a1 - (((a1 - a2) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI)) / 2;
  } else {
    midAng = a1 + diff / 2;
  }
  return midAng;
}

function backedLabel(x, y, text, color, size) {
  size = size || 12;
  ctx.font = '600 ' + size + "px 'Geist Mono', monospace";
  var tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(11,17,24,0.88)';
  ctx.fillRect(x - tw / 2 - 5, y - size / 2 - 4, tw + 10, size + 8);
  ctx.strokeStyle = '#141e2a';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - tw / 2 - 5, y - size / 2 - 4, tw + 10, size + 8);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function dot(x, y, color, r, glowing) {
  if (glowing) {
    ctx.fillStyle = hexAlpha(color, 0.20);
    ctx.beginPath(); ctx.arc(x, y, r + 9, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, glowing ? r + 1.5 : r, 0, 2 * Math.PI); ctx.fill();
}

function hexAlpha(hex, a) {
  var r = parseInt(hex.slice(1, 3), 16),
      g = parseInt(hex.slice(3, 5), 16),
      b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

var dragging = null, hovering = null;
var HIT = 18;

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var ev = e.touches ? e.touches[0] : e;
  return {
    x: (ev.clientX - rect.left) * (W / rect.width),
    y: (ev.clientY - rect.top) * (H / rect.height)
  };
}

function nearPoint(px, py, t) {
  var p = ptOnCircle(t);
  var dx = px - p.x, dy = py - p.y;
  return Math.sqrt(dx * dx + dy * dy) < HIT;
}

function angleFromPos(px, py) {
  return Math.atan2(py - CY, px - CX);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b1118';
  ctx.fillRect(0, 0, W, H);

  var A = ptOnCircle(tA), B = ptOnCircle(tB), C = ptOnCircle(tC), D = ptOnCircle(tD);

  // 1. Circle outline
  ctx.beginPath();
  ctx.arc(CX, CY, R_PX, 0, 2 * Math.PI);
  ctx.strokeStyle = '#3a4a5a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 2. Quadrilateral sides AB, BC, CD, DA in BLUE
  ctx.strokeStyle = '#00abfa';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.lineTo(D.x, D.y);
  ctx.closePath();
  ctx.stroke();

  // 3. Centre dot
  ctx.fillStyle = '#7a7875';
  ctx.beginPath(); ctx.arc(CX, CY, 3, 0, 2 * Math.PI); ctx.fill();

  // 4. Interior angle arcs and angles
  // A: between D and B
  var angA = interiorAngle(A, D, B);
  // B: between A and C
  var angB = interiorAngle(B, A, C);
  // C: between B and D
  var angC = interiorAngle(C, B, D);
  // D: between C and A
  var angD = interiorAngle(D, C, A);

  var midA = drawAngleArc(A, D, B, 22, '#0fee89');
  var midB = drawAngleArc(B, A, C, 22, '#ff4670');
  var midC = drawAngleArc(C, B, D, 22, '#0fee89');
  var midD = drawAngleArc(D, C, A, 22, '#ff4670');

  // Angle labels at midbisector direction, slightly inside vertex.
  var labelOff = 38;
  backedLabel(A.x + Math.cos(midA) * labelOff, A.y + Math.sin(midA) * labelOff,
              Math.round(angA * 180 / Math.PI) + ' deg', '#0fee89', 11);
  backedLabel(B.x + Math.cos(midB) * labelOff, B.y + Math.sin(midB) * labelOff,
              Math.round(angB * 180 / Math.PI) + ' deg', '#ff4670', 11);
  backedLabel(C.x + Math.cos(midC) * labelOff, C.y + Math.sin(midC) * labelOff,
              Math.round(angC * 180 / Math.PI) + ' deg', '#0fee89', 11);
  backedLabel(D.x + Math.cos(midD) * labelOff, D.y + Math.sin(midD) * labelOff,
              Math.round(angD * 180 / Math.PI) + ' deg', '#ff4670', 11);

  // 5. Vertex dots and outer letters
  dot(A.x, A.y, '#0fee89', 7, dragging === 'A' || hovering === 'A');
  dot(B.x, B.y, '#ff4670', 7, dragging === 'B' || hovering === 'B');
  dot(C.x, C.y, '#0fee89', 7, dragging === 'C' || hovering === 'C');
  dot(D.x, D.y, '#ff4670', 7, dragging === 'D' || hovering === 'D');

  // Outer letters just outside the circle along the radial direction
  var outR = R_PX + 18;
  ctx.font = "700 14px 'Geist', sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0fee89';
  ctx.fillText('A', CX + Math.cos(tA) * outR, CY + Math.sin(tA) * outR);
  ctx.fillStyle = '#ff4670';
  ctx.fillText('B', CX + Math.cos(tB) * outR, CY + Math.sin(tB) * outR);
  ctx.fillStyle = '#0fee89';
  ctx.fillText('C', CX + Math.cos(tC) * outR, CY + Math.sin(tC) * outR);
  ctx.fillStyle = '#ff4670';
  ctx.fillText('D', CX + Math.cos(tD) * outR, CY + Math.sin(tD) * outR);

  // 6. Bottom banner
  var degA = Math.round(angA * 180 / Math.PI);
  var degB = Math.round(angB * 180 / Math.PI);
  var degC = Math.round(angC * 180 / Math.PI);
  var degD = Math.round(angD * 180 / Math.PI);
  var sumAC = degA + degC;
  var sumBD = degB + degD;

  var bannerY = H - 32;
  var bannerH = 26;
  var bannerW = 360;
  var bx = (W - bannerW) / 2;
  ctx.fillStyle = 'rgba(15,238,137,0.06)';
  ctx.fillRect(bx, bannerY, bannerW, bannerH);
  ctx.strokeStyle = 'rgba(15,238,137,0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, bannerY, bannerW, bannerH);

  ctx.font = "600 12px 'Geist Mono', monospace";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var midY = bannerY + bannerH / 2;
  // Two halves
  ctx.fillStyle = '#0fee89';
  ctx.fillText('A + C = ' + sumAC + ' deg', bx + bannerW * 0.27, midY);
  ctx.fillStyle = '#ff4670';
  ctx.fillText('B + D = ' + sumBD + ' deg', bx + bannerW * 0.73, midY);
  // separator
  ctx.strokeStyle = 'rgba(58,74,90,0.6)';
  ctx.beginPath();
  ctx.moveTo(bx + bannerW * 0.5, bannerY + 4);
  ctx.lineTo(bx + bannerW * 0.5, bannerY + bannerH - 4);
  ctx.stroke();

  // KaTeX heading
  var headTex =
    "\\textcolor{#0fee89}{\\angle A + \\angle C} = " + sumAC + "\\degree \\quad " +
    "\\textcolor{#ff4670}{\\angle B + \\angle D} = " + sumBD + "\\degree";
  tryRender(document.getElementById("formula"), headTex);
}

// ── Input handling ─────────────────────────────────────────────────────────

canvas.addEventListener('mousedown', function(e) {
  var p = getPos(e);
  if (nearPoint(p.x, p.y, tA)) dragging = 'A';
  else if (nearPoint(p.x, p.y, tB)) dragging = 'B';
  else if (nearPoint(p.x, p.y, tC)) dragging = 'C';
  else if (nearPoint(p.x, p.y, tD)) dragging = 'D';
  if (dragging) e.preventDefault();
});

canvas.addEventListener('mousemove', function(e) {
  var p = getPos(e);
  if (dragging) {
    var t = angleFromPos(p.x, p.y);
    setVertex(dragging, t);
    draw();
  } else {
    var prev = hovering;
    hovering = null;
    if (nearPoint(p.x, p.y, tA)) hovering = 'A';
    else if (nearPoint(p.x, p.y, tB)) hovering = 'B';
    else if (nearPoint(p.x, p.y, tC)) hovering = 'C';
    else if (nearPoint(p.x, p.y, tD)) hovering = 'D';
    canvas.style.cursor = hovering ? 'grab' : 'default';
    if (hovering !== prev) draw();
  }
});

canvas.addEventListener('mouseup', function() { dragging = null; });
canvas.addEventListener('mouseleave', function() {
  if (dragging || hovering) {
    dragging = hovering = null;
    canvas.style.cursor = 'default';
    draw();
  }
});

canvas.addEventListener('touchstart', function(e) {
  var p = getPos(e);
  if (nearPoint(p.x, p.y, tA)) dragging = 'A';
  else if (nearPoint(p.x, p.y, tB)) dragging = 'B';
  else if (nearPoint(p.x, p.y, tC)) dragging = 'C';
  else if (nearPoint(p.x, p.y, tD)) dragging = 'D';
  if (dragging) e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  if (!dragging) return;
  e.preventDefault();
  var p = getPos(e);
  var t = angleFromPos(p.x, p.y);
  setVertex(dragging, t);
  draw();
}, { passive: false });

canvas.addEventListener('touchend', function() { dragging = null; });

draw();

// ── postMessage resize ─────────────────────────────────────────────────────
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", function() { setupCanvas(); draw(); reportHeight(); });
setTimeout(reportHeight, 200);
</script>
</body>
</html>
