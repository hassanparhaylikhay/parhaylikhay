<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Enlargement Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  #stage { display:block; width:100%; height:auto; aspect-ratio: 480 / 320; user-select:none; overflow:hidden; touch-action:none; cursor:default; }
  #stage.grabbing { cursor:grabbing; }
  #stage.hover-grab { cursor:grab; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .ms-strip { display:flex; align-items:center; gap:14px; padding:10px 14px; margin-top:10px; background:rgba(255,240,103,0.04); border:1px solid rgba(255,240,103,0.18); border-radius:8px; }
  .ms-strip .tag { font-family:'Geist Mono',monospace; font-size:10px; color:#fff067; letter-spacing:0.5px; text-transform:uppercase; font-weight:600; }
  .ms-strip .eq { font-size:15px; color:#f0eeea; }
  .ms-strip .eq .katex { font-size:1em; }

  .controls { display:flex; gap:6px; flex-wrap:wrap; padding:10px 0 4px; }
  .preset-btn { background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:5px 10px; border-radius:4px; cursor:pointer; transition: all 0.12s ease; }
  .preset-btn:hover { color:#f0eeea; border-color:#3a4a5a; }
  .preset-btn.active { background:rgba(255,240,103,0.06); color:#fff067; border-color:#fff067; }
  .reset-btn { margin-left:auto; background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:5px 10px; border-radius:4px; cursor:pointer; }
  .reset-btn:hover { color:#f0eeea; border-color:#3a4a5a; }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 1.5px currentColor); }
    50%      { filter: drop-shadow(0 0 5px currentColor) drop-shadow(0 0 8px currentColor); }
  }
  .handle { animation: pulse-glow 1.8s ease-in-out infinite; }

  /* Lesson Mode shell: html/body are transparent so the React-side iframe
     element can carry the card background + border. Internal mark-scheme
     strip hidden — side panel hosts the live readout instead. */
  html.lesson-mode, body.lesson-mode { background: transparent; padding: 0; }
  body.lesson-mode .wrap { border: 0; background: transparent; padding: 0; max-width: none; }
  body.lesson-mode .head { display: none; }
  body.lesson-mode .controls { display: none; }
  body.lesson-mode .ms-strip { display: none; }
</style>
</head>
<body>
<script>(function(){try{if(new URLSearchParams(location.search).get("lessonMode")==="1"){document.documentElement.classList.add("lesson-mode");document.body.classList.add("lesson-mode");}}catch(e){}})();</script>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">ENLARGEMENT</span>
    <span class="meta">drag the centre, then drag A' along the ray</span>
  </div>

  <svg id="stage" viewBox="0 0 480 320" width="480" height="320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-grid"></g>
    <g id="g-axes"></g>
    <g id="g-ticks"></g>
    <g id="g-rays"></g>
    <g id="g-object"></g>
    <g id="g-image"></g>
    <g id="g-handles"></g>
  </svg>

  <div class="ms-strip">
    <span class="tag">mark scheme</span>
    <span class="eq" id="eq-display"></span>
  </div>

  <div id="controls" class="controls"></div>
</div>

<script>
"use strict";

// Lesson Mode params first — used by the world-coordinate block below.
var URL_PARAMS = new URLSearchParams(window.location.search);
var LESSON_MODE = URL_PARAMS.get("lessonMode") === "1";
var NO_OUTLINE = URL_PARAMS.get("noOutline") === "1";
var TARGET = (function(){
  var t = URL_PARAMS.get("target");
  if (!t) return null;
  var p = t.split(",").map(parseFloat);
  if (p.length < 1 || !isFinite(p[0])) return null;
  return { k: p[0], cx: isFinite(p[1]) ? p[1] : null, cy: isFinite(p[2]) ? p[2] : null };
})();
var SOLVED = false;
if (LESSON_MODE) { document.body.classList.add("lesson-mode"); document.documentElement.classList.add("lesson-mode"); }

var COL = {
  blue:"#00abfa", yellow:"#fff067", orange:"#ff822c", green:"#0fee89",
  pink:"#ff4670", faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

// world
var SVG_W = 480, SVG_H = 320;
var X_MIN = -7, X_MAX = 9, Y_MIN = -5, Y_MAX = 5;
// Lesson mode pads the grid inside the card so it matches ClickOnGrid.
// Revision notes embed (no lesson mode) keeps the original full-bleed grid.
var GRID_PAD = LESSON_MODE ? 28 : 0;
var pxPerX = (SVG_W - 2*GRID_PAD) / (X_MAX - X_MIN);
var pxPerY = (SVG_H - 2*GRID_PAD) / (Y_MAX - Y_MIN);
var UNIT = Math.min(pxPerX, pxPerY);
var ORIGIN_PX = {
  x: (SVG_W - (X_MAX - X_MIN) * UNIT) / 2 - X_MIN * UNIT,
  y: SVG_H - (-Y_MIN) * UNIT - (SVG_H - (Y_MAX - Y_MIN) * UNIT) / 2
};
function toSx(x){ return ORIGIN_PX.x + x * UNIT; }
function toSy(y){ return ORIGIN_PX.y - y * UNIT; }
function fromSx(sx){ return (sx - ORIGIN_PX.x) / UNIT; }
function fromSy(sy){ return (ORIGIN_PX.y - sy) / UNIT; }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function clampMath(p){ return { x: clamp(p.x, X_MIN + 0.5, X_MAX - 0.5), y: clamp(p.y, Y_MIN + 0.5, Y_MAX - 0.5) }; }
function snapInt(v){ return Math.round(v); }
function snapQuarter(v){ return Math.round(v * 4) / 4; }

// object (small enough that x3 still fits the plot)
var OBJ = [ {x:2,y:1}, {x:4,y:1}, {x:2,y:2} ];
var LABELS = ['A','B','C'];

// ----- state ----- (Lesson Mode with target starts at k=1 so the student has to FIND the value)
var INIT = (LESSON_MODE && TARGET) ? { cx: TARGET.cx != null ? TARGET.cx : 0, cy: TARGET.cy != null ? TARGET.cy : 0, k: 1 } : { cx: 0, cy: 0, k: 2 };
var P = { cx: INIT.cx, cy: INIT.cy, k: INIT.k };
var D = { cx: INIT.cx, cy: INIT.cy, k: INIT.k };
var DEFAULTS = { cx: INIT.cx, cy: INIT.cy, k: INIT.k };
var SPRING = 0.22, EPS = 0.005;
var raf = null;

function enlargePt(p, cx, cy, k){
  return { x: cx + k * (p.x - cx), y: cy + k * (p.y - cy) };
}
function dist2(a, b){ var dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; }

function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}
function svgKaTeXLabel(parent, x, y, tex, color, align){
  // Plain SVG <text> instead of foreignObject + KaTeX. iOS Safari
  // positions foreignObject HTML content at unscaled CSS coordinates
  // rather than viewBox-transformed coordinates, which made labels
  // drift off-anchor on phones and iPads. Simple labels render the
  // same with SVG text and scale reliably on every browser.
  align = align || "center";
  var t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x", x);
  t.setAttribute("y", y);
  t.setAttribute("fill", color || COL.off);
  t.setAttribute("font-family", "'Geist Mono', ui-monospace, monospace");
  t.setAttribute("font-size", "12");
  t.setAttribute("font-weight", "600");
  t.setAttribute("dominant-baseline", "middle");
  t.setAttribute("text-anchor", align === "left" ? "start" : (align === "right" ? "end" : "middle"));
  t.setAttribute("pointer-events", "none");
  t.textContent = String(tex);
  parent.appendChild(t);
}

function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function drawGridAxes(){
  var gG = document.getElementById("g-grid");
  var gA = document.getElementById("g-axes");
  var gT = document.getElementById("g-ticks");
  clear(gG); clear(gA); clear(gT);
  for (var x = Math.ceil(X_MIN); x <= X_MAX; x++){
    var l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1", toSx(x)); l.setAttribute("x2", toSx(x));
    l.setAttribute("y1", toSy(Y_MIN)); l.setAttribute("y2", toSy(Y_MAX));
    l.setAttribute("stroke", "#141e2a"); l.setAttribute("stroke-width", 0.7);
    gG.appendChild(l);
  }
  for (var y = Math.ceil(Y_MIN); y <= Y_MAX; y++){
    var l2 = document.createElementNS("http://www.w3.org/2000/svg","line");
    l2.setAttribute("y1", toSy(y)); l2.setAttribute("y2", toSy(y));
    l2.setAttribute("x1", toSx(X_MIN)); l2.setAttribute("x2", toSx(X_MAX));
    l2.setAttribute("stroke", "#141e2a"); l2.setAttribute("stroke-width", 0.7);
    gG.appendChild(l2);
  }
  var ax = document.createElementNS("http://www.w3.org/2000/svg","line");
  ax.setAttribute("x1", toSx(X_MIN)); ax.setAttribute("x2", toSx(X_MAX));
  ax.setAttribute("y1", toSy(0)); ax.setAttribute("y2", toSy(0));
  ax.setAttribute("stroke", COL.faint); ax.setAttribute("stroke-width", 1.2);
  gA.appendChild(ax);
  var ay = document.createElementNS("http://www.w3.org/2000/svg","line");
  ay.setAttribute("y1", toSy(Y_MIN)); ay.setAttribute("y2", toSy(Y_MAX));
  ay.setAttribute("x1", toSx(0)); ay.setAttribute("x2", toSx(0));
  ay.setAttribute("stroke", COL.faint); ay.setAttribute("stroke-width", 1.2);
  gA.appendChild(ay);
  for (var xt = Math.ceil(X_MIN); xt <= X_MAX; xt++){
    if (xt === 0) continue;
    svgKaTeXLabel(gT, toSx(xt), toSy(0) + 11, String(xt), COL.grey);
  }
  for (var yt = Math.ceil(Y_MIN); yt <= Y_MAX; yt++){
    if (yt === 0) continue;
    svgKaTeXLabel(gT, toSx(0) - 12, toSy(yt), String(yt), COL.grey);
  }
}
function drawPoly(g, pts, fillCol, strokeCol, w){
  var d = "M " + toSx(pts[0].x) + " " + toSy(pts[0].y);
  for (var i = 1; i < pts.length; i++) d += " L " + toSx(pts[i].x) + " " + toSy(pts[i].y);
  d += " Z";
  var path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d", d); path.setAttribute("fill", fillCol);
  path.setAttribute("stroke", strokeCol); path.setAttribute("stroke-width", w || 2);
  path.setAttribute("stroke-linejoin","round");
  g.appendChild(path);
}
function drawVertexDot(g, pt, color, label, primeFlag){
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
  c.setAttribute("r", 3.5); c.setAttribute("fill", color);
  g.appendChild(c);
  svgKaTeXLabel(g, toSx(pt.x) + (primeFlag ? 14 : -14), toSy(pt.y) - 10, label, color, "center");
}

function drawScene(){
  var gR = document.getElementById("g-rays");
  var gO = document.getElementById("g-object");
  var gI = document.getElementById("g-image");
  var gH = document.getElementById("g-handles");
  clear(gR); clear(gO); clear(gI); clear(gH);

  // rays through centre and each object vertex (extended both ways)
  OBJ.forEach(function(p){
    var dx = p.x - D.cx, dy = p.y - D.cy;
    var len = Math.sqrt(dx*dx + dy*dy);
    if (len < 0.01) return;
    var ext = 16;
    var ux = dx / len, uy = dy / len;
    var ray = document.createElementNS("http://www.w3.org/2000/svg","line");
    ray.setAttribute("x1", toSx(D.cx - ext * ux));
    ray.setAttribute("y1", toSy(D.cy - ext * uy));
    ray.setAttribute("x2", toSx(D.cx + ext * ux));
    ray.setAttribute("y2", toSy(D.cy + ext * uy));
    ray.setAttribute("stroke", COL.yellow);
    ray.setAttribute("stroke-width", 1);
    ray.setAttribute("stroke-dasharray", "4 4");
    ray.setAttribute("opacity", 0.45);
    gR.appendChild(ray);
  });

  // Lesson Mode target outline (hidden when noOutline=1 so student works blind)
  if (LESSON_MODE && TARGET && !NO_OUTLINE){
    var TGT = OBJ.map(function(p){ return enlargePt(p, TARGET.cx != null ? TARGET.cx : D.cx, TARGET.cy != null ? TARGET.cy : D.cy, TARGET.k); });
    var tpts = TGT.map(function(p){ return toSx(p.x) + "," + toSy(p.y); }).join(" ");
    var ghost = document.createElementNS("http://www.w3.org/2000/svg","polygon");
    ghost.setAttribute("points", tpts);
    ghost.setAttribute("fill", "none");
    ghost.setAttribute("stroke", SOLVED ? COL.green : COL.pink);
    ghost.setAttribute("stroke-width", "1.6");
    ghost.setAttribute("stroke-dasharray", "5 4");
    ghost.setAttribute("opacity", SOLVED ? "0.4" : "0.7");
    ghost.style.transition = "stroke 300ms, opacity 300ms";
    gI.appendChild(ghost);
  }

  drawPoly(gO, OBJ, "rgba(0,171,250,0.10)", COL.blue, 2);
  var IMG = OBJ.map(function(p){ return enlargePt(p, D.cx, D.cy, D.k); });
  drawPoly(gI, IMG, "rgba(255,70,112,0.10)", COL.pink, 2);
  OBJ.forEach(function(p,i){ drawVertexDot(gO, p, COL.blue, LABELS[i], false); });
  IMG.forEach(function(p,i){ drawVertexDot(gI, p, COL.pink, LABELS[i] + "'", true); });

  // centre handle
  var cc = document.createElementNS("http://www.w3.org/2000/svg","circle");
  cc.setAttribute("cx", toSx(D.cx)); cc.setAttribute("cy", toSy(D.cy));
  cc.setAttribute("r", 7); cc.setAttribute("fill", COL.yellow);
  cc.setAttribute("stroke", "#0b1118"); cc.setAttribute("stroke-width", 1.5);
  cc.setAttribute("class", "handle"); cc.style.color = COL.yellow;
  gH.appendChild(cc);
  // A' handle (yellow with pink ring)
  var aPrime = enlargePt(OBJ[0], D.cx, D.cy, D.k);
  var ah = document.createElementNS("http://www.w3.org/2000/svg","circle");
  ah.setAttribute("cx", toSx(aPrime.x)); ah.setAttribute("cy", toSy(aPrime.y));
  ah.setAttribute("r", 7); ah.setAttribute("fill", COL.yellow);
  ah.setAttribute("stroke", COL.pink); ah.setAttribute("stroke-width", 2);
  ah.setAttribute("class", "handle"); ah.style.color = COL.yellow;
  gH.appendChild(ah);
}

function fmtK(v){
  var r = Math.round(v * 100) / 100;
  if (Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
  if (Math.abs(r * 2 - Math.round(r * 2)) < 0.01) {
    // halves
    var num = r * 2;
    return (r < 0 ? "-" : "") + "\\dfrac{" + Math.abs(num) + "}{2}";
  }
  if (Math.abs(r * 4 - Math.round(r * 4)) < 0.01){
    var n4 = r * 4;
    return (r < 0 ? "-" : "") + "\\dfrac{" + Math.abs(n4) + "}{4}";
  }
  return r.toFixed(2);
}
function fmtInt(v){ return String(Math.round(v)); }

function renderMS(){
  var el = document.getElementById("eq-display");
  el.innerHTML = "";
  // Use TARGET (P) values so the readout snaps with the user, not the spring.
  var tex = "\\text{Enlargement, scale factor } " + fmtK(P.k) + ",\\ \\text{centre } (" + fmtInt(P.cx) + ", " + fmtInt(P.cy) + ")";
  tryRender(el, tex);
  if (LESSON_MODE && window.parent && window.parent !== window){
    window.parent.postMessage({
      type: "pl-lesson-readout",
      label: "current",
      tex: "k = " + fmtK(P.k) + ",\\ \\text{centre } (" + fmtInt(P.cx) + ", " + fmtInt(P.cy) + ")"
    }, "*");
  }
}

// hit-test
function hitTest(m){
  var aP = enlargePt(OBJ[0], D.cx, D.cy, D.k);
  if (dist2(m, aP) < 0.6 * 0.6) return { kind: "aprime" };
  if (dist2(m, { x: D.cx, y: D.cy }) < 0.6 * 0.6) return { kind: "centre" };
  return null;
}
function applyDrag(info, m){
  if (info.kind === "centre"){
    var c = clampMath({ x: snapInt(m.x), y: snapInt(m.y) });
    P.cx = c.x; P.cy = c.y;
  } else if (info.kind === "aprime"){
    var dx = OBJ[0].x - P.cx, dy = OBJ[0].y - P.cy;
    var len2 = dx*dx + dy*dy;
    if (len2 < 1e-6) return;
    var t = ((m.x - P.cx) * dx + (m.y - P.cy) * dy) / len2;
    P.k = clamp(snapQuarter(t), -3, 3);
  }
  updateActivePreset(); kick();
}

var stage = document.getElementById("stage");
var dragInfo = null;
function svgPt(e){
  var pt = stage.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}
function evMath(e){ var sp = svgPt(e); return { x: fromSx(sp.x), y: fromSy(sp.y) }; }
stage.addEventListener("pointerdown", function(e){
  if (SOLVED) return;     // lock the manipulative once the puzzle is solved
  var info = hitTest(evMath(e));
  if (!info) return;
  e.preventDefault();
  dragInfo = info;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("grabbing");
});
stage.addEventListener("pointermove", function(e){
  if (!dragInfo){
    var hit = hitTest(evMath(e));
    if (hit) stage.classList.add("hover-grab"); else stage.classList.remove("hover-grab");
    return;
  }
  e.preventDefault();
  applyDrag(dragInfo, evMath(e));
});
function endDrag(e){
  if (!dragInfo) return;
  dragInfo = null;
  try { stage.releasePointerCapture(e.pointerId); } catch(_){}
  stage.classList.remove("grabbing");
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", function(){ stage.classList.remove("hover-grab"); });

function settled(){
  return Math.abs(P.cx - D.cx) < EPS && Math.abs(P.cy - D.cy) < EPS && Math.abs(P.k - D.k) < EPS;
}
function step(){
  D.cx += (P.cx - D.cx) * SPRING;
  D.cy += (P.cy - D.cy) * SPRING;
  D.k += (P.k - D.k) * SPRING;
  drawScene(); renderMS();
  if (!settled()) raf = requestAnimationFrame(step);
  else { raf = null; D.cx = P.cx; D.cy = P.cy; D.k = P.k; drawScene(); renderMS(); }
}
function kick(){ if (raf == null) raf = requestAnimationFrame(step); notifyHeight(); checkLessonSuccess(); }

function checkLessonSuccess(){
  if (!LESSON_MODE || !TARGET || SOLVED) return;
  if (Math.abs(P.k - TARGET.k) > 0.01) return;
  if (TARGET.cx != null && Math.abs(P.cx - TARGET.cx) > 0.01) return;
  if (TARGET.cy != null && Math.abs(P.cy - TARGET.cy) > 0.01) return;
  SOLVED = true;
  document.body.classList.add("solved");
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-lesson-success", widget: "enlargement", value: { k: P.k, cx: P.cx, cy: P.cy } }, "*");
  }
  drawScene();
}

var PRESETS = [
  ["2","SF = 2"], ["3","SF = 3"], ["0.5","SF = ½"], ["-1","SF = −1"], ["-2","SF = −2"]
];
function renderControls(){
  var c = document.getElementById("controls");
  c.innerHTML = "";
  PRESETS.forEach(function(pair){
    var b = document.createElement("button");
    b.className = "preset-btn" + (Math.abs(parseFloat(pair[0]) - P.k) < 0.01 ? " active" : "");
    b.textContent = pair[1];
    b.dataset.preset = pair[0];
    b.onclick = function(){ P.k = parseFloat(pair[0]); updateActivePreset(); kick(); };
    c.appendChild(b);
  });
  var r = document.createElement("button");
  r.className = "reset-btn"; r.textContent = "↻ reset";
  r.onclick = function(){ P.cx = DEFAULTS.cx; P.cy = DEFAULTS.cy; P.k = DEFAULTS.k; updateActivePreset(); kick(); };
  c.appendChild(r);
}
function updateActivePreset(){
  document.querySelectorAll(".preset-btn").forEach(function(b){
    if (Math.abs(parseFloat(b.dataset.preset) - P.k) < 0.01) b.classList.add("active");
    else b.classList.remove("active");
  });
}

function syncStageHeight(){
  // iOS Safari doesn't reliably compute SVG height from viewBox + width:100%;
  // setting style.height directly from clientWidth is rock-solid across browsers.
  var s = document.getElementById("stage");
  if (s && s.clientWidth > 0){
    s.style.height = (s.clientWidth * SVG_H / SVG_W) + "px";
  }
}
function notifyHeight(){
  syncStageHeight();
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

syncStageHeight();
drawGridAxes();
renderControls();
drawScene();
renderMS();
setTimeout(notifyHeight, 200);
</script>
</body>
</html>
