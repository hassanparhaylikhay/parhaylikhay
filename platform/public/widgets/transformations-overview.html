<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Transformations · Overview</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .mode-tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .mode-tab {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11px; font-weight:600;
    padding:6px 12px; border-radius:5px; cursor:pointer;
    transition: all 0.15s ease; text-transform:uppercase; letter-spacing:0.4px;
  }
  .mode-tab:hover { color:#f0eeea; border-color:#3a4a5a; }
  .mode-tab.active { background:rgba(255,240,103,0.06); color:#fff067; border-color:#fff067; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; touch-action:none; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .controls { display:flex; flex-direction:column; gap:8px; padding:10px 4px 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .name { font-weight:600; min-width:60px; }
  .row input[type=range] { flex:1; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; cursor:pointer; border:0; background:#fff067; }
  .row input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; cursor:pointer; border:0; background:#fff067; }
  .row .val { min-width:46px; text-align:right; color:#f0eeea; font-weight:600; font-size:12.5px; }

  .preset-row { display:flex; gap:6px; flex-wrap:wrap; padding:6px 0 4px; }
  .preset-btn {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:4px; cursor:pointer;
    transition: all 0.12s ease;
  }
  .preset-btn:hover { color:#f0eeea; border-color:#3a4a5a; }
  .preset-btn.active { background:rgba(0,171,250,0.06); color:#00abfa; border-color:#00abfa; }

  .mark-scheme {
    margin-top:10px; padding:10px 12px; border-radius:6px;
    background:rgba(15,238,137,0.04); border:1px solid rgba(15,238,137,0.18);
    color:#f0eeea; font-size:14px; line-height:1.5;
  }
  .mark-scheme .tag {
    display:block; font-family:'Geist Mono',monospace; font-size:10px;
    color:#0fee89; letter-spacing:0.5px; text-transform:uppercase;
    font-weight:600; margin-bottom:4px;
  }
  .mark-scheme .body .katex { font-size:1em; }

  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">FOUR TRANSFORMATIONS · ONE TRIANGLE</span>
    <span class="meta" id="meta">drag a control to move the image</span>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="translate">Translate</button>
    <button class="mode-tab" data-mode="reflect">Reflect</button>
    <button class="mode-tab" data-mode="rotate">Rotate</button>
    <button class="mode-tab" data-mode="enlarge">Enlarge</button>
  </div>

  <svg id="stage" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-grid"></g>
    <g id="g-axes"></g>
    <g id="g-ticks"></g>
    <g id="g-overlays"></g>
    <g id="g-object"></g>
    <g id="g-image"></g>
    <g id="g-controls"></g>
    <g id="g-labels"></g>
  </svg>

  <div id="controls" class="controls"></div>

  <div class="mark-scheme">
    <span class="tag">what the mark scheme wants</span>
    <div class="body" id="ms-body"></div>
  </div>

  <p class="footer">positive angles = anticlockwise · negative scale factor flips through the centre</p>
</div>

<script>
"use strict";

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  faint:  "#3a4a5a",
  grey:   "#7a7875",
  off:    "#f0eeea"
};

// ----- world coordinates -----
var SVG_W = 480, SVG_H = 320;
var X_MIN = -7, X_MAX = 9, Y_MIN = -5, Y_MAX = 5;
var pxPerX = SVG_W / (X_MAX - X_MIN);
var pxPerY = SVG_H / (Y_MAX - Y_MIN);
// Equal px/unit: take the smaller
var UNIT = Math.min(pxPerX, pxPerY);
var ORIGIN_PX = { x: -X_MIN * UNIT, y: SVG_H + Y_MIN * UNIT };
// recenter the plot horizontally if there is extra room
ORIGIN_PX.x = (SVG_W - (X_MAX - X_MIN) * UNIT) / 2 - X_MIN * UNIT;
ORIGIN_PX.y = SVG_H - (-Y_MIN) * UNIT - (SVG_H - (Y_MAX - Y_MIN) * UNIT) / 2;

function toSx(x){ return ORIGIN_PX.x + x * UNIT; }
function toSy(y){ return ORIGIN_PX.y - y * UNIT; }

// ----- object triangle (constant across modes) -----
var OBJ = [ {x:1,y:1}, {x:4,y:1}, {x:2,y:3} ];
var LABELS = ['A','B','C'];

// ----- state per mode -----
var mode = "translate";
// translate: tx, ty (column vector)
var T = { tx: 3, ty: -2 };
// reflect: which preset line
var R = { preset: "yx" }; // y=x by default
// rotate: angle (90 steps), centre
var ROT = { angle: 90, cx: 0, cy: 0 };
// enlarge: SF, centre
var ENL = { k: 2, cx: 0, cy: 0 };

// ----- math helpers -----
function reflectPt(p, mirror){
  // mirror = { type: "y0"|"x0"|"yx"|"ynx"|"y1"|"x2" }
  switch(mirror.preset){
    case "y0":  return { x: p.x,  y: -p.y };
    case "x0":  return { x: -p.x, y: p.y };
    case "yx":  return { x: p.y,  y: p.x };
    case "ynx": return { x: -p.y, y: -p.x };
    case "y1":  return { x: p.x,  y: 2 - p.y };
    case "x2":  return { x: 4 - p.x, y: p.y };
  }
  return p;
}
function rotatePt(p, cx, cy, deg){
  var th = deg * Math.PI / 180;
  var dx = p.x - cx, dy = p.y - cy;
  return { x: cx + dx * Math.cos(th) - dy * Math.sin(th),
           y: cy + dx * Math.sin(th) + dy * Math.cos(th) };
}
function enlargePt(p, cx, cy, k){
  return { x: cx + k * (p.x - cx), y: cy + k * (p.y - cy) };
}
function translatePt(p, tx, ty){ return { x: p.x + tx, y: p.y + ty }; }

function imagePoints(){
  if (mode === "translate") return OBJ.map(function(p){ return translatePt(p, T.tx, T.ty); });
  if (mode === "reflect")   return OBJ.map(function(p){ return reflectPt(p, R); });
  if (mode === "rotate")    return OBJ.map(function(p){ return rotatePt(p, ROT.cx, ROT.cy, ROT.angle); });
  if (mode === "enlarge")   return OBJ.map(function(p){ return enlargePt(p, ENL.cx, ENL.cy, ENL.k); });
  return OBJ.slice();
}

// ----- KaTeX helpers -----
function tryRender(target, tex){
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else {
    setTimeout(function(){ tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, align){
  align = align || "center";
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - 50);
  fo.setAttribute("y", y - 11);
  fo.setAttribute("width", 100);
  fo.setAttribute("height", 22);
  fo.style.overflow = "visible";
  fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px";
  div.style.display = "flex";
  div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host";
  div.style.color = color || COL.off;
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
}

// ----- drawing -----
function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function drawGridAxes(){
  var gGrid = document.getElementById("g-grid");
  var gAxes = document.getElementById("g-axes");
  var gTicks = document.getElementById("g-ticks");
  clear(gGrid); clear(gAxes); clear(gTicks);

  for (var x = Math.ceil(X_MIN); x <= X_MAX; x++){
    var line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", toSx(x)); line.setAttribute("x2", toSx(x));
    line.setAttribute("y1", toSy(Y_MIN)); line.setAttribute("y2", toSy(Y_MAX));
    line.setAttribute("stroke", "#141e2a"); line.setAttribute("stroke-width", 0.7);
    gGrid.appendChild(line);
  }
  for (var y = Math.ceil(Y_MIN); y <= Y_MAX; y++){
    var line2 = document.createElementNS("http://www.w3.org/2000/svg","line");
    line2.setAttribute("y1", toSy(y)); line2.setAttribute("y2", toSy(y));
    line2.setAttribute("x1", toSx(X_MIN)); line2.setAttribute("x2", toSx(X_MAX));
    line2.setAttribute("stroke", "#141e2a"); line2.setAttribute("stroke-width", 0.7);
    gGrid.appendChild(line2);
  }
  // axes
  var ax = document.createElementNS("http://www.w3.org/2000/svg","line");
  ax.setAttribute("x1", toSx(X_MIN)); ax.setAttribute("x2", toSx(X_MAX));
  ax.setAttribute("y1", toSy(0)); ax.setAttribute("y2", toSy(0));
  ax.setAttribute("stroke", COL.faint); ax.setAttribute("stroke-width", 1.2);
  gAxes.appendChild(ax);
  var ay = document.createElementNS("http://www.w3.org/2000/svg","line");
  ay.setAttribute("y1", toSy(Y_MIN)); ay.setAttribute("y2", toSy(Y_MAX));
  ay.setAttribute("x1", toSx(0)); ay.setAttribute("x2", toSx(0));
  ay.setAttribute("stroke", COL.faint); ay.setAttribute("stroke-width", 1.2);
  gAxes.appendChild(ay);
  // ticks
  for (var xt = Math.ceil(X_MIN); xt <= X_MAX; xt++){
    if (xt === 0) continue;
    svgKaTeXLabel(gTicks, toSx(xt), toSy(0) + 11, String(xt), COL.grey);
  }
  for (var yt = Math.ceil(Y_MIN); yt <= Y_MAX; yt++){
    if (yt === 0) continue;
    svgKaTeXLabel(gTicks, toSx(0) - 12, toSy(yt), String(yt), COL.grey);
  }
}

function drawPoly(g, pts, fillCol, strokeCol, strokeW){
  var d = "M " + toSx(pts[0].x) + " " + toSy(pts[0].y);
  for (var i = 1; i < pts.length; i++) d += " L " + toSx(pts[i].x) + " " + toSy(pts[i].y);
  d += " Z";
  var path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d", d);
  path.setAttribute("fill", fillCol);
  path.setAttribute("stroke", strokeCol);
  path.setAttribute("stroke-width", strokeW || 2);
  path.setAttribute("stroke-linejoin","round");
  g.appendChild(path);
}

function drawVertexDot(g, pt, color, label, primeFlag){
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
  c.setAttribute("r", 3.5); c.setAttribute("fill", color);
  g.appendChild(c);
  var lblX = toSx(pt.x) + (primeFlag ? 12 : -12);
  var lblY = toSy(pt.y) - 10;
  svgKaTeXLabel(g, lblX, lblY, label, color, primeFlag ? "left" : "right");
}

function drawObjectAndImage(){
  var gObj = document.getElementById("g-object");
  var gImg = document.getElementById("g-image");
  clear(gObj); clear(gImg);
  drawPoly(gObj, OBJ, "rgba(0,171,250,0.10)", COL.blue, 2);
  var IMG = imagePoints();
  drawPoly(gImg, IMG, "rgba(255,70,112,0.10)", COL.pink, 2);
  OBJ.forEach(function(p,i){ drawVertexDot(gObj, p, COL.blue, LABELS[i], false); });
  IMG.forEach(function(p,i){ drawVertexDot(gImg, p, COL.pink, LABELS[i] + "'", true); });
}

// ----- overlays per mode -----
function drawTranslateOverlay(){
  var g = document.getElementById("g-overlays");
  clear(g);
  // Yellow arrow from each object vertex to its image vertex
  OBJ.forEach(function(p,i){
    var q = translatePt(p, T.tx, T.ty);
    drawArrow(g, p, q, COL.yellow, 1.6, true, false);
  });
}

function drawReflectOverlay(){
  var g = document.getElementById("g-overlays");
  clear(g);
  // Draw mirror line as dashed blue across the plot
  var line = mirrorLineForPreset(R.preset);
  var lineEl = document.createElementNS("http://www.w3.org/2000/svg","line");
  lineEl.setAttribute("x1", toSx(line.a.x));
  lineEl.setAttribute("y1", toSy(line.a.y));
  lineEl.setAttribute("x2", toSx(line.b.x));
  lineEl.setAttribute("y2", toSy(line.b.y));
  lineEl.setAttribute("stroke", COL.yellow);
  lineEl.setAttribute("stroke-width", 1.8);
  lineEl.setAttribute("stroke-dasharray", "6 5");
  g.appendChild(lineEl);
  // Perpendicular bisectors (faint) for each vertex
  OBJ.forEach(function(p){
    var q = reflectPt(p, R);
    var bis = document.createElementNS("http://www.w3.org/2000/svg","line");
    bis.setAttribute("x1", toSx(p.x)); bis.setAttribute("y1", toSy(p.y));
    bis.setAttribute("x2", toSx(q.x)); bis.setAttribute("y2", toSy(q.y));
    bis.setAttribute("stroke", "rgba(240,238,234,0.18)");
    bis.setAttribute("stroke-width", 1);
    bis.setAttribute("stroke-dasharray", "3 4");
    g.appendChild(bis);
  });
}

function drawRotateOverlay(){
  var g = document.getElementById("g-overlays");
  clear(g);
  // Centre marker (yellow)
  var cMark = document.createElementNS("http://www.w3.org/2000/svg","circle");
  cMark.setAttribute("cx", toSx(ROT.cx)); cMark.setAttribute("cy", toSy(ROT.cy));
  cMark.setAttribute("r", 6); cMark.setAttribute("fill", COL.yellow);
  cMark.setAttribute("stroke", "#0b1118"); cMark.setAttribute("stroke-width", 1.5);
  g.appendChild(cMark);
  // Arc trail for each vertex
  OBJ.forEach(function(p){
    var r = Math.sqrt((p.x - ROT.cx)*(p.x - ROT.cx) + (p.y - ROT.cy)*(p.y - ROT.cy));
    if (r < 0.05) return;
    var startMath = Math.atan2(p.y - ROT.cy, p.x - ROT.cx);
    var endMath = startMath + ROT.angle * Math.PI / 180;
    var startScreen = -startMath;
    var endScreen = -endMath;
    var sweep = ROT.angle > 0 ? 0 : 1; // anticlockwise = sweep 0 in svg y-down
    var largeArc = Math.abs(ROT.angle) > 180 ? 1 : 0;
    var rPx = r * UNIT;
    var sx = toSx(ROT.cx) + rPx * Math.cos(startScreen);
    var sy = toSy(ROT.cy) + rPx * Math.sin(startScreen);
    var ex = toSx(ROT.cx) + rPx * Math.cos(endScreen);
    var ey = toSy(ROT.cy) + rPx * Math.sin(endScreen);
    var arc = document.createElementNS("http://www.w3.org/2000/svg","path");
    arc.setAttribute("d", "M " + sx + " " + sy + " A " + rPx + " " + rPx + " 0 " + largeArc + " " + sweep + " " + ex + " " + ey);
    arc.setAttribute("fill", "none");
    arc.setAttribute("stroke", COL.yellow);
    arc.setAttribute("stroke-width", 1.4);
    arc.setAttribute("opacity", 0.55);
    g.appendChild(arc);
  });
}

function drawEnlargeOverlay(){
  var g = document.getElementById("g-overlays");
  clear(g);
  // Centre marker
  var cMark = document.createElementNS("http://www.w3.org/2000/svg","circle");
  cMark.setAttribute("cx", toSx(ENL.cx)); cMark.setAttribute("cy", toSy(ENL.cy));
  cMark.setAttribute("r", 6); cMark.setAttribute("fill", COL.yellow);
  cMark.setAttribute("stroke", "#0b1118"); cMark.setAttribute("stroke-width", 1.5);
  g.appendChild(cMark);
  // Rays through centre, object vertex, image vertex
  OBJ.forEach(function(p){
    var q = enlargePt(p, ENL.cx, ENL.cy, ENL.k);
    var dx = p.x - ENL.cx, dy = p.y - ENL.cy;
    var len = Math.sqrt(dx*dx + dy*dy);
    if (len < 0.01) return;
    var ext = 16;
    var ux = dx / len, uy = dy / len;
    var ray = document.createElementNS("http://www.w3.org/2000/svg","line");
    ray.setAttribute("x1", toSx(ENL.cx - ext * ux));
    ray.setAttribute("y1", toSy(ENL.cy - ext * uy));
    ray.setAttribute("x2", toSx(ENL.cx + ext * ux));
    ray.setAttribute("y2", toSy(ENL.cy + ext * uy));
    ray.setAttribute("stroke", COL.yellow);
    ray.setAttribute("stroke-width", 1);
    ray.setAttribute("stroke-dasharray", "4 4");
    ray.setAttribute("opacity", 0.45);
    g.appendChild(ray);
    void q;
  });
}

function drawArrow(g, fromPt, toPt, color, width, withHead, dashed){
  var x1 = toSx(fromPt.x), y1 = toSy(fromPt.y);
  var x2 = toSx(toPt.x),   y2 = toSy(toPt.y);
  var dx = x2 - x1, dy = y2 - y1;
  var L = Math.sqrt(dx*dx + dy*dy);
  if (L < 4) return;
  var ux = dx / L, uy = dy / L;
  var head = withHead ? 9 : 0;
  var bx = x2 - ux * head;
  var by = y2 - uy * head;
  var ln = document.createElementNS("http://www.w3.org/2000/svg","line");
  ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
  ln.setAttribute("x2", bx); ln.setAttribute("y2", by);
  ln.setAttribute("stroke", color); ln.setAttribute("stroke-width", width);
  if (dashed) ln.setAttribute("stroke-dasharray", "5 4");
  ln.setAttribute("stroke-linecap", "round");
  g.appendChild(ln);
  if (withHead){
    var w = 5;
    var tri = document.createElementNS("http://www.w3.org/2000/svg","path");
    tri.setAttribute("d", "M " + x2 + " " + y2 +
      " L " + (x2 - ux*head + uy*w) + " " + (y2 - uy*head - ux*w) +
      " L " + (x2 - ux*head - uy*w) + " " + (y2 - uy*head + ux*w) + " Z");
    tri.setAttribute("fill", color);
    g.appendChild(tri);
  }
}

// ----- mirror line geometry for each preset -----
function mirrorLineForPreset(p){
  switch (p){
    case "y0":  return { a: {x: X_MIN, y: 0}, b: {x: X_MAX, y: 0}, label: "y = 0 (x\\text{-axis})" };
    case "x0":  return { a: {x: 0, y: Y_MIN}, b: {x: 0, y: Y_MAX}, label: "x = 0 (y\\text{-axis})" };
    case "yx":  return { a: {x: -6, y: -6}, b: {x: 6, y: 6}, label: "y = x" };
    case "ynx": return { a: {x: -6, y: 6}, b: {x: 6, y: -6}, label: "y = -x" };
    case "y1":  return { a: {x: X_MIN, y: 1}, b: {x: X_MAX, y: 1}, label: "y = 1" };
    case "x2":  return { a: {x: 2, y: Y_MIN}, b: {x: 2, y: Y_MAX}, label: "x = 2" };
  }
  return null;
}

// ----- mark scheme text -----
function fmtNum(v){
  var r = Math.round(v * 10) / 10;
  if (Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
  return r.toFixed(1);
}
function renderMarkScheme(){
  var body = document.getElementById("ms-body");
  body.innerHTML = "";
  if (mode === "translate"){
    var tex = "\\text{Translation by } \\begin{pmatrix} " + fmtNum(T.tx) + " \\\\ " + fmtNum(T.ty) + " \\end{pmatrix}";
    tryRender(body, tex);
  } else if (mode === "reflect"){
    var L = mirrorLineForPreset(R.preset);
    tryRender(body, "\\text{Reflection in } " + L.label);
  } else if (mode === "rotate"){
    var dir = ROT.angle >= 0 ? "anticlockwise" : "clockwise";
    var degT = Math.abs(ROT.angle);
    tryRender(body, "\\text{Rotation, } " + degT + "° \\text{ " + dir + ", centre } (" + fmtNum(ROT.cx) + ", " + fmtNum(ROT.cy) + ")");
  } else if (mode === "enlarge"){
    tryRender(body, "\\text{Enlargement, scale factor } " + fmtNum(ENL.k) + ", \\text{ centre } (" + fmtNum(ENL.cx) + ", " + fmtNum(ENL.cy) + ")");
  }
}

// ----- controls per mode -----
function renderControls(){
  var c = document.getElementById("controls");
  c.innerHTML = "";
  if (mode === "translate"){
    c.appendChild(makeSlider("tx", "x-shift", -6, 6, 1, T.tx, function(v){ T.tx = v; refresh(); }));
    c.appendChild(makeSlider("ty", "y-shift", -4, 4, 1, T.ty, function(v){ T.ty = v; refresh(); }));
  } else if (mode === "reflect"){
    var row = document.createElement("div"); row.className = "preset-row";
    [
      ["y0","y = 0"],["x0","x = 0"],["yx","y = x"],
      ["ynx","y = −x"],["y1","y = 1"],["x2","x = 2"]
    ].forEach(function(pair){
      var b = document.createElement("button");
      b.className = "preset-btn" + (R.preset === pair[0] ? " active" : "");
      b.textContent = pair[1];
      b.onclick = function(){ R.preset = pair[0]; refresh(); };
      row.appendChild(b);
    });
    c.appendChild(row);
  } else if (mode === "rotate"){
    var pr = document.createElement("div"); pr.className = "preset-row";
    [["90","90° ACW"],["180","180°"],["-90","90° CW"],["-180","−180°"]].forEach(function(pair){
      var b = document.createElement("button");
      b.className = "preset-btn" + (String(ROT.angle) === pair[0] ? " active" : "");
      b.textContent = pair[1];
      b.onclick = function(){ ROT.angle = parseInt(pair[0],10); refresh(); };
      pr.appendChild(b);
    });
    c.appendChild(pr);
    c.appendChild(makeSlider("cx", "centre x", -4, 4, 1, ROT.cx, function(v){ ROT.cx = v; refresh(); }));
    c.appendChild(makeSlider("cy", "centre y", -3, 3, 1, ROT.cy, function(v){ ROT.cy = v; refresh(); }));
  } else if (mode === "enlarge"){
    c.appendChild(makeSlider("k", "scale", -2, 3, 0.5, ENL.k, function(v){ ENL.k = v; refresh(); }));
    c.appendChild(makeSlider("cx", "centre x", -4, 4, 1, ENL.cx, function(v){ ENL.cx = v; refresh(); }));
    c.appendChild(makeSlider("cy", "centre y", -3, 3, 1, ENL.cy, function(v){ ENL.cy = v; refresh(); }));
  }
}
function makeSlider(id, label, min, max, step, val, onInput){
  var row = document.createElement("div"); row.className = "row";
  var name = document.createElement("span"); name.className = "name"; name.style.color = COL.yellow; name.textContent = label;
  var input = document.createElement("input"); input.type = "range";
  input.min = min; input.max = max; input.step = step; input.value = val;
  var v = document.createElement("span"); v.className = "val"; v.textContent = fmtNum(val);
  input.oninput = function(){
    var nv = parseFloat(input.value);
    v.textContent = fmtNum(nv);
    onInput(nv);
  };
  row.appendChild(name); row.appendChild(input); row.appendChild(v);
  return row;
}

// ----- refresh full picture -----
function refresh(){
  drawObjectAndImage();
  if (mode === "translate") drawTranslateOverlay();
  if (mode === "reflect")   drawReflectOverlay();
  if (mode === "rotate")    drawRotateOverlay();
  if (mode === "enlarge")   drawEnlargeOverlay();
  renderMarkScheme();
  renderControls();
  notifyHeight();
}

// ----- tab wiring -----
document.querySelectorAll(".mode-tab").forEach(function(t){
  t.addEventListener("click", function(){
    document.querySelectorAll(".mode-tab").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    mode = t.getAttribute("data-mode");
    refresh();
  });
});

// ----- height post-message -----
function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

// ----- init -----
drawGridAxes();
refresh();
setTimeout(notifyHeight, 200);
</script>
