<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shape Area &amp; Perimeter Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:15px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }
  .formula .label-A { color:#0fee89; }
  .formula .label-P { color:#fff067; }

  .controls {
    display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .row { display:flex; align-items:center; gap:8px; min-width:140px; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] {
    flex:1; min-width:60px; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .row .val { min-width:32px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .shape-fill { fill:rgba(0,171,250,0.10); stroke:#00abfa; stroke-width:2; stroke-linejoin:round; }
  .side-lbl { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; fill:#00abfa; }
  .perp-height { stroke:#ff4670; stroke-width:1.4; stroke-dasharray:4 3; }
  .perp-label { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; fill:#ff4670; }
  .l-marker { stroke:#ff4670; stroke-width:1.2; fill:none; }
  .vertex { fill:#fff067; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fA"></span>
    <span class="formula" id="fP"></span>
  </div>

  <div class="controls" id="controls"></div>

  <svg id="svg" viewBox="0 0 480 280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="shape"></g>
    <g id="overlays"></g>
  </svg>

  <p class="footer" id="footer">drag the sliders · area and perimeter update live</p>
</div>

<script>
"use strict";

var SVG_W = 480, SVG_H = 280;
var SVG_CX = SVG_W / 2, SVG_CY = SVG_H / 2;
var SCALE = 20;  // px per cm

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// ===== Shape definitions ===============================================
var SHAPES = {
  rectangle: {
    sliders: [
      { key: "l", min: 1, max: 14, step: 0.5, default: 8 },
      { key: "w", min: 1, max: 10, step: 0.5, default: 5 }
    ],
    area:        function(p) { return p.l * p.w; },
    perimeter:   function(p) { return 2 * (p.l + p.w); },
    geom: function(p) {
      var lp = p.l * SCALE, wp = p.w * SCALE;
      var x0 = SVG_CX - lp / 2, y0 = SVG_CY - wp / 2;
      return {
        polygon: [[x0, y0], [x0 + lp, y0], [x0 + lp, y0 + wp], [x0, y0 + wp]],
        sideLabels: [
          { x: x0 + lp / 2, y: y0 - 8,           anchor: "middle", text: "l = " + fmtNum(p.l) },
          { x: x0 + lp + 12, y: y0 + wp / 2 + 4, anchor: "start",  text: "w = " + fmtNum(p.w) }
        ]
      };
    }
  },

  triangle: {
    sliders: [
      { key: "b",      min: 2,  max: 14, step: 0.5, default: 8 },
      { key: "h",      min: 1,  max: 10, step: 0.5, default: 6 },
      { key: "xshift", min: -4, max: 4,  step: 0.5, default: 0 }
    ],
    area:      function(p) { return 0.5 * p.b * p.h; },
    perimeter: function(p) {
      var L = Math.sqrt(Math.pow(p.b/2 + p.xshift, 2) + p.h*p.h);
      var R = Math.sqrt(Math.pow(p.b/2 - p.xshift, 2) + p.h*p.h);
      return p.b + L + R;
    },
    geom: function(p) {
      var bp = p.b * SCALE, hp = p.h * SCALE;
      var by = SVG_CY + hp / 2, ty = SVG_CY - hp / 2;
      var ax = SVG_CX + p.xshift * SCALE;
      var lx = SVG_CX - bp / 2, rx = SVG_CX + bp / 2;
      var L = Math.sqrt(Math.pow(p.b/2 + p.xshift, 2) + p.h*p.h);
      var R = Math.sqrt(Math.pow(p.b/2 - p.xshift, 2) + p.h*p.h);
      return {
        polygon: [[lx, by], [rx, by], [ax, ty]],
        sideLabels: [
          { x: (lx + rx) / 2,        y: by + 18, anchor: "middle", text: "b = " + fmtNum(p.b) },
          { x: (lx + ax) / 2 - 12,   y: (by + ty) / 2 + 4, anchor: "end",    text: fmtNum(L) },
          { x: (rx + ax) / 2 + 12,   y: (by + ty) / 2 + 4, anchor: "start",  text: fmtNum(R) }
        ],
        perpHeight: {
          x1: ax, y1: ty, x2: ax, y2: by,
          label: { x: ax + 8, y: SVG_CY + 4, text: "h = " + fmtNum(p.h) },
          foot:  { x: ax, y: by, baseDir: { x: 1, y: 0 }, perpDir: { x: 0, y: -1 } }
        }
      };
    }
  },

  parallelogram: {
    sliders: [
      { key: "b",     min: 3,  max: 12, step: 0.5, default: 8 },
      { key: "h",     min: 1,  max: 8,  step: 0.5, default: 5 },
      { key: "slant", min: -4, max: 4,  step: 0.5, default: 2.5 }
    ],
    area:      function(p) { return p.b * p.h; },
    perimeter: function(p) { var s = Math.sqrt(p.slant*p.slant + p.h*p.h); return 2 * (p.b + s); },
    geom: function(p) {
      var bp = p.b * SCALE, hp = p.h * SCALE, sp = p.slant * SCALE;
      var by = SVG_CY + hp / 2, ty = SVG_CY - hp / 2;
      var x0 = SVG_CX - bp / 2 - sp / 2;
      var pts = [[x0, by], [x0 + bp, by], [x0 + bp + sp, ty], [x0 + sp, ty]];
      var s = Math.sqrt(p.slant*p.slant + p.h*p.h);
      var topLeft = pts[3];
      var footX = topLeft[0];
      return {
        polygon: pts,
        sideLabels: [
          { x: x0 + bp / 2, y: by + 18,                    anchor: "middle", text: "b = " + fmtNum(p.b) },
          { x: x0 + bp + sp / 2 + (p.slant >= 0 ? 14 : -14), y: SVG_CY + 4, anchor: p.slant >= 0 ? "start" : "end", text: fmtNum(s) }
        ],
        perpHeight: {
          x1: footX, y1: ty, x2: footX, y2: by,
          label: { x: footX + (p.slant >= 0 ? -16 : 8), y: SVG_CY + 4, anchor: p.slant >= 0 ? "end" : "start", text: "h = " + fmtNum(p.h) },
          foot:  { x: footX, y: by, baseDir: { x: 1, y: 0 }, perpDir: { x: 0, y: -1 } }
        }
      };
    }
  },

  trapezium: {
    sliders: [
      { key: "a",   min: 1,  max: 10, step: 0.5, default: 4 },
      { key: "b",   min: 3,  max: 14, step: 0.5, default: 9 },
      { key: "h",   min: 1,  max: 8,  step: 0.5, default: 5 },
      { key: "off", min: -3, max: 5,  step: 0.5, default: 1 }
    ],
    area:      function(p) { return 0.5 * (p.a + p.b) * p.h; },
    perimeter: function(p) {
      var lS = Math.sqrt(p.off*p.off + p.h*p.h);
      var rS = Math.sqrt(Math.pow(p.b - p.off - p.a, 2) + p.h*p.h);
      return p.a + p.b + lS + rS;
    },
    geom: function(p) {
      var ap = p.a * SCALE, bp = p.b * SCALE, hp = p.h * SCALE, op = p.off * SCALE;
      var by = SVG_CY + hp / 2, ty = SVG_CY - hp / 2;
      var x0 = SVG_CX - bp / 2;
      var pts = [[x0, by], [x0 + bp, by], [x0 + op + ap, ty], [x0 + op, ty]];
      return {
        polygon: pts,
        sideLabels: [
          { x: x0 + bp / 2,       y: by + 18, anchor: "middle", text: "b = " + fmtNum(p.b) },
          { x: x0 + op + ap / 2,  y: ty - 8,  anchor: "middle", text: "a = " + fmtNum(p.a) }
        ],
        perpHeight: {
          x1: x0 + op, y1: ty, x2: x0 + op, y2: by,
          label: { x: x0 + op + 8, y: SVG_CY + 4, anchor: "start", text: "h = " + fmtNum(p.h) },
          foot:  { x: x0 + op, y: by, baseDir: { x: 1, y: 0 }, perpDir: { x: 0, y: -1 } }
        }
      };
    }
  }
};

// TeX templates for the formulas at the top. Coloured \text labels match
// the SVG palette: green for area, yellow for perimeter, red for height.
var FORMULA_TEX = {
  rectangle: {
    A: "{\\color{#0fee89}A} = l \\times w",
    P: "{\\color{#fff067}P} = 2(l + w)"
  },
  triangle: {
    A: "{\\color{#0fee89}A} = \\tfrac{1}{2} \\times b \\times {\\color{#ff4670}h}",
    P: "{\\color{#fff067}P} = a + b + c"
  },
  parallelogram: {
    A: "{\\color{#0fee89}A} = b \\times {\\color{#ff4670}h}",
    P: "{\\color{#fff067}P} = 2(b + s)"
  },
  trapezium: {
    A: "{\\color{#0fee89}A} = \\tfrac{1}{2}(a + b) \\times {\\color{#ff4670}h}",
    P: "{\\color{#fff067}P} = a + b + s_1 + s_2"
  }
};

// ===== State ===========================================================
var qs = new URLSearchParams(location.search);
var shapeKey = qs.get("shape");
if (!shapeKey || !SHAPES[shapeKey]) shapeKey = "rectangle";

var state = { params: {}, display: {} };
SHAPES[shapeKey].sliders.forEach(function(s) {
  state.params[s.key] = s.default;
  state.display[s.key] = s.default;
});

// Soft-spring animation (params target → display lerp)
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005;
var rafScheduled = false;
function startSpring() {
  if (rafScheduled) return;
  rafScheduled = true;
  requestAnimationFrame(springTick);
}
function springTick() {
  var moving = false;
  SHAPES[shapeKey].sliders.forEach(function(s) {
    var k = s.key;
    var d = state.params[k] - state.display[k];
    if (Math.abs(d) > SPRING_EPS) {
      state.display[k] += d * SPRING_FACTOR;
      moving = true;
    } else if (state.display[k] !== state.params[k]) {
      state.display[k] = state.params[k];
    }
  });
  render();
  if (moving) requestAnimationFrame(springTick);
  else rafScheduled = false;
}

// ===== Render ==========================================================
var fA       = document.getElementById("fA");
var fP       = document.getElementById("fP");
var shapeG   = document.getElementById("shape");
var overlaysG = document.getElementById("overlays");

function render() {
  var shape = SHAPES[shapeKey];
  var p = state.display;
  var area = shape.area(p);
  var perim = shape.perimeter(p);

  // Top formulas — substitute live values into the same TeX shape.
  var areaTex = FORMULA_TEX[shapeKey].A +
                "\\;=\\;{\\color{#0fee89}" + fmtNum(area) + "}\\;\\text{cm}^{2}";
  var perimTex = FORMULA_TEX[shapeKey].P +
                "\\;=\\;{\\color{#fff067}" + fmtNum(perim) + "}\\;\\text{cm}";
  tryRender(fA, areaTex);
  tryRender(fP, perimTex);

  // SVG figure
  shapeG.innerHTML = "";
  overlaysG.innerHTML = "";
  var g = shape.geom(p);
  var pointsStr = g.polygon.map(function(pt) {
    return pt[0].toFixed(1) + "," + pt[1].toFixed(1);
  }).join(" ");
  shapeG.appendChild(svgEl("polygon", { "class": "shape-fill", points: pointsStr }));

  g.polygon.forEach(function(pt) {
    overlaysG.appendChild(svgEl("circle", {
      "class": "vertex", cx: pt[0].toFixed(1), cy: pt[1].toFixed(1), r: 3
    }));
  });

  g.sideLabels.forEach(function(lbl) {
    var t = svgEl("text", {
      "class": "side-lbl", x: lbl.x, y: lbl.y, "text-anchor": lbl.anchor || "middle"
    });
    t.textContent = lbl.text;
    overlaysG.appendChild(t);
  });

  if (g.perpHeight) {
    var ph = g.perpHeight;
    overlaysG.appendChild(svgEl("line", {
      "class": "perp-height", x1: ph.x1, y1: ph.y1, x2: ph.x2, y2: ph.y2
    }));
    if (ph.foot) {
      var foot = ph.foot, sz = 8;
      var p1x = foot.x + foot.baseDir.x * sz, p1y = foot.y + foot.baseDir.y * sz;
      var fx  = foot.x + foot.baseDir.x * sz + foot.perpDir.x * sz;
      var fy  = foot.y + foot.baseDir.y * sz + foot.perpDir.y * sz;
      var p2x = foot.x + foot.perpDir.x * sz, p2y = foot.y + foot.perpDir.y * sz;
      overlaysG.appendChild(svgEl("polyline", {
        "class": "l-marker",
        points: p1x + "," + p1y + " " + fx + "," + fy + " " + p2x + "," + p2y
      }));
    }
    if (ph.label) {
      var hl = svgEl("text", {
        "class": "perp-label", x: ph.label.x, y: ph.label.y,
        "text-anchor": ph.label.anchor || "start"
      });
      hl.textContent = ph.label.text;
      overlaysG.appendChild(hl);
    }
  }
}

// ===== Build sliders ===================================================
function buildSliders() {
  var ctrl = document.getElementById("controls");
  ctrl.innerHTML = "";
  SHAPES[shapeKey].sliders.forEach(function(s) {
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<span class="name">' + s.key + '</span>' +
      '<input type="range" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + state.params[s.key] + '"/>' +
      '<span class="val"></span>';
    var slider = row.querySelector("input");
    var val    = row.querySelector(".val");
    val.textContent = fmtNum(state.params[s.key]);
    slider.addEventListener("input", function() {
      state.params[s.key] = parseFloat(slider.value);
      val.textContent = fmtNum(state.params[s.key]);
      startSpring();
    });
    ctrl.appendChild(row);
  });
}

buildSliders();
render();

// ===== Height reporter ==================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
