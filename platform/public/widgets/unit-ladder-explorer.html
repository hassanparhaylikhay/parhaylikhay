<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Unit Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:28px 28px 24px; }

  .header {
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
    letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:32px;
  }

  .row { display:flex; align-items:flex-end; justify-content:space-around; gap:0; }
  .cell {
    flex:1; min-width:0; cursor:pointer; user-select:none;
    text-align:center; padding:6px 4px; border-radius:8px;
    transition: background 0.18s;
  }
  .cell:hover { background:rgba(255,255,255,0.02); }
  .cell .value {
    font-family:'Geist Mono',monospace; font-size:26px; font-weight:600;
    color:#7a7875; letter-spacing:-0.5px; line-height:1.1;
    transition: color 0.18s;
  }
  .cell.active .value { color:var(--brand); }
  .cell .unit {
    font-family:'Geist Mono',monospace; font-size:11px; color:#3a4a5a;
    letter-spacing:1.5px; text-transform:uppercase; margin-top:8px;
    transition: color 0.18s;
  }
  .cell.active .unit { color:var(--brand); }

  .slider-row { margin:34px 4px 14px; }
  input[type="range"] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:18px; background:transparent; outline:none;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height:2px; background:#1a2330; border-radius:1px;
  }
  input[type="range"]::-moz-range-track {
    height:2px; background:#1a2330; border-radius:1px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:18px; height:18px; border-radius:50%;
    background:var(--brand); border:0;
    margin-top:-8px; cursor:grab;
    transition: transform 0.12s;
  }
  input[type="range"]::-webkit-slider-thumb:active { cursor:grabbing; transform:scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width:18px; height:18px; border-radius:50%;
    background:var(--brand); border:0; cursor:grab;
  }

  .legend {
    font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a;
    letter-spacing:0.6px; text-align:center; margin-top:6px;
  }

  @media (max-width: 520px) {
    .cell .value { font-size: 20px; }
    .wrap { padding:22px 18px 18px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="header" id="header">LENGTH</div>
  <div class="row" id="row"></div>
  <div class="slider-row">
    <input type="range" id="slider" min="0" max="100" step="0.001" value="50"/>
  </div>
  <div class="legend">click any unit · drag the slider</div>
</div>

<script>
"use strict";

var qs = new URLSearchParams(location.search);
var type = qs.get("type") || "length";

// factorToBase = how many "base" units in 1 of this unit (length base = m, mass base = g).
var TYPES = {
  length: {
    brand: "#00abfa",
    title: "LENGTH",
    units: [
      { key: "km", label: "km", factorToBase: 1000 },
      { key: "m",  label: "m",  factorToBase: 1 },
      { key: "cm", label: "cm", factorToBase: 0.01 },
      { key: "mm", label: "mm", factorToBase: 0.001 }
    ],
    initial: { unit: "m", value: 4.5 },
    sliderRange: { km: [0, 10], m: [0, 1000], cm: [0, 100000], mm: [0, 1000000] }
  },
  mass: {
    brand: "#ff822c",
    title: "MASS",
    units: [
      { key: "kg", label: "kg", factorToBase: 1000 },
      { key: "g",  label: "g",  factorToBase: 1 }
    ],
    initial: { unit: "kg", value: 2.5 },
    sliderRange: { kg: [0, 10], g: [0, 10000] }
  }
};

var T = TYPES[type] || TYPES.length;
document.documentElement.style.setProperty("--brand", T.brand);
document.getElementById("header").textContent = T.title;

var row    = document.getElementById("row");
var slider = document.getElementById("slider");

var state = { active: T.initial.unit, value: T.initial.value };

function findUnit(key) { for (var i = 0; i < T.units.length; i++) if (T.units[i].key === key) return T.units[i]; return T.units[0]; }
function valueIn(unit) { return state.value * findUnit(state.active).factorToBase / unit.factorToBase; }

function fmt(n) {
  if (!isFinite(n)) return "—";
  if (n === 0) return "0";
  var abs = Math.abs(n);
  if (abs >= 1000000) {
    // 4500000 -> "4.5M"
    return parseFloat((n/1000000).toFixed(2)) + "M";
  }
  if (abs >= 10000) {
    // 45000 -> "45,000"
    return Math.round(n).toLocaleString();
  }
  if (abs >= 1) return parseFloat(n.toFixed(3)).toString();
  if (abs >= 0.001) return parseFloat(n.toFixed(5)).toString();
  return n.toExponential(2);
}

function build() {
  row.innerHTML = "";
  for (var i = 0; i < T.units.length; i++) {
    var u = T.units[i];
    var cell = document.createElement("div");
    cell.className = "cell" + (u.key === state.active ? " active" : "");
    cell.dataset.unit = u.key;
    cell.innerHTML =
      '<div class="value">' + fmt(valueIn(u)) + '</div>' +
      '<div class="unit">' + u.label + '</div>';
    (function(key) {
      cell.addEventListener("click", function() { setActive(key); });
    })(u.key);
    row.appendChild(cell);
  }
}

function syncSliderRange() {
  var range = T.sliderRange[state.active];
  slider.min = String(range[0]);
  slider.max = String(range[1]);
  slider.step = String((range[1] - range[0]) / 1000);
  slider.value = String(state.value);
}

function setActive(unitKey) {
  var oldUnit = findUnit(state.active);
  var bv = state.value * oldUnit.factorToBase;
  var newUnit = findUnit(unitKey);
  state.active = unitKey;
  state.value = bv / newUnit.factorToBase;
  syncSliderRange();
  build();
  reportHeight();
}

slider.addEventListener("input", function() {
  state.value = parseFloat(slider.value);
  build();
});

syncSliderRange();
build();

// === Height reporter ====================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
