<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Unit Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:14px; }
  .formula { font-size:14.5px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .row { display:flex; align-items:flex-end; justify-content:space-around; gap:0; margin-bottom:14px; }
  .cell {
    flex:1; min-width:0; cursor:pointer; user-select:none;
    text-align:center; padding:10px 4px; border-radius:8px;
    transition: background 0.18s;
  }
  .cell:hover { background:rgba(255,255,255,0.02); }
  .cell .value {
    font-family:'Geist Mono',monospace; font-size:22px; font-weight:600;
    color:#7a7875; letter-spacing:-0.3px; line-height:1.1;
    transition: color 0.18s;
    min-height:26px;
  }
  .cell.active .value { color:#0fee89; }
  .cell .unit {
    font-size:11.5px; color:#3a4a5a;
    margin-top:8px;
    transition: color 0.18s;
  }
  .cell .unit .katex { font-size:1em; }
  .cell.active .unit { color:#fff067; }

  .controls {
    display:flex; align-items:center; gap:10px; padding:0 4px; margin-top:6px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875;
  }
  .controls .name { color:#fff067; font-weight:600; min-width:38px; }
  .controls input[type=range] {
    flex:1; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .controls input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .controls input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }

  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }

  @media (max-width: 520px) {
    .cell .value { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fRule"></span>
  </div>

  <div class="row" id="row"></div>

  <div class="controls">
    <span class="name" id="sliderName"></span>
    <input type="range" id="slider" min="0" max="100" step="0.001" value="50"/>
  </div>

  <p class="footer">click any unit · drag the slider</p>
</div>

<script>
"use strict";

var qs = new URLSearchParams(location.search);
var type = qs.get("type") || "length";

var TYPES = {
  length: {
    title: "length",
    rule: "1\\;\\text{km} = 1000\\;\\text{m} \\quad 1\\;\\text{m} = 100\\;\\text{cm} \\quad 1\\;\\text{cm} = 10\\;\\text{mm}",
    units: [
      { key: "km", tex: "\\text{km}", factorToBase: 1000 },
      { key: "m",  tex: "\\text{m}",  factorToBase: 1 },
      { key: "cm", tex: "\\text{cm}", factorToBase: 0.01 },
      { key: "mm", tex: "\\text{mm}", factorToBase: 0.001 }
    ],
    initial: { unit: "m", value: 4.5 },
    sliderRange: { km: [0, 10], m: [0, 1000], cm: [0, 100000], mm: [0, 1000000] }
  },
  mass: {
    title: "mass",
    rule: "1\\;\\text{kg} = 1000\\;\\text{g}",
    units: [
      { key: "kg", tex: "\\text{kg}", factorToBase: 1000 },
      { key: "g",  tex: "\\text{g}",  factorToBase: 1 }
    ],
    initial: { unit: "kg", value: 2.5 },
    sliderRange: { kg: [0, 10], g: [0, 10000] }
  }
};

var T = TYPES[type] || TYPES.length;

var fRule       = document.getElementById("fRule");
var row         = document.getElementById("row");
var slider      = document.getElementById("slider");
var sliderName  = document.getElementById("sliderName");

var state = { active: T.initial.unit, value: T.initial.value };

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function findUnit(key) { for (var i = 0; i < T.units.length; i++) if (T.units[i].key === key) return T.units[i]; return T.units[0]; }
function valueIn(unit) { return state.value * findUnit(state.active).factorToBase / unit.factorToBase; }

function fmt(n) {
  if (!isFinite(n)) return "—";
  if (n === 0) return "0";
  var abs = Math.abs(n);
  if (abs >= 1000000) return parseFloat((n/1000000).toFixed(2)) + "M";
  if (abs >= 10000) return Math.round(n).toLocaleString();
  if (abs >= 1) return parseFloat(n.toFixed(3)).toString();
  if (abs >= 0.001) return parseFloat(n.toFixed(5)).toString();
  return n.toExponential(2);
}

function build() {
  row.innerHTML = "";
  for (var i = 0; i < T.units.length; i++) {
    var u = T.units[i];
    var cell = document.createElement("div");
    cell.className = "cell" + (u.key === state.active ? " active" : "");
    cell.dataset.unit = u.key;
    var valDiv  = document.createElement("div");
    valDiv.className = "value";
    valDiv.textContent = fmt(valueIn(u));
    var unitDiv = document.createElement("div");
    unitDiv.className = "unit";
    cell.appendChild(valDiv);
    cell.appendChild(unitDiv);
    tryRender(unitDiv, u.tex);
    (function(key) {
      cell.addEventListener("click", function() { setActive(key); });
    })(u.key);
    row.appendChild(cell);
  }
}

function syncSliderRange() {
  var range = T.sliderRange[state.active];
  slider.min = String(range[0]);
  slider.max = String(range[1]);
  slider.step = String((range[1] - range[0]) / 1000);
  slider.value = String(state.value);
  tryRender(sliderName, findUnit(state.active).tex);
}

function setActive(unitKey) {
  var oldUnit = findUnit(state.active);
  var bv = state.value * oldUnit.factorToBase;
  var newUnit = findUnit(unitKey);
  state.active = unitKey;
  state.value = bv / newUnit.factorToBase;
  syncSliderRange();
  build();
  reportHeight();
}

slider.addEventListener("input", function() {
  state.value = parseFloat(slider.value);
  build();
});

tryRender(fRule, T.rule);
syncSliderRange();
build();

// === Height reporter ====================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
