<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Translation Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  #stage { display:block; width:100%; height:auto; user-select:none; overflow:visible; touch-action:none; cursor:default; }
  #stage.grabbing { cursor:grabbing; }
  #stage.hover-grab { cursor:grab; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .vector-strip {
    display:flex; align-items:center; gap:14px; padding:10px 14px; margin-top:10px;
    background:rgba(255,240,103,0.04); border:1px solid rgba(255,240,103,0.18); border-radius:8px;
  }
  .vector-strip .tag {
    font-family:'Geist Mono',monospace; font-size:10px; color:#fff067;
    letter-spacing:0.5px; text-transform:uppercase; font-weight:600;
  }
  .vector-strip .col { font-size:18px; color:#f0eeea; }
  .vector-strip .col .katex { font-size:1em; }

  .controls { display:flex; gap:6px; flex-wrap:wrap; padding:10px 0 4px; }
  .preset-btn {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:4px; cursor:pointer;
    transition: all 0.12s ease;
  }
  .preset-btn:hover { color:#f0eeea; border-color:#3a4a5a; }
  .preset-btn.active { background:rgba(255,240,103,0.06); color:#fff067; border-color:#fff067; }
  .reset-btn {
    margin-left:auto; background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:4px; cursor:pointer;
  }
  .reset-btn:hover { color:#f0eeea; border-color:#3a4a5a; }

  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 1.5px currentColor); }
    50%      { filter: drop-shadow(0 0 5px currentColor) drop-shadow(0 0 8px currentColor); }
  }
  .handle { animation: pulse-glow 1.8s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">TRANSLATION</span>
    <span class="meta">drag the pink triangle or the yellow tip</span>
  </div>

  <svg id="stage" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-grid"></g>
    <g id="g-axes"></g>
    <g id="g-ticks"></g>
    <g id="g-guides"></g>
    <g id="g-vec"></g>
    <g id="g-object"></g>
    <g id="g-image"></g>
    <g id="g-handles"></g>
  </svg>

  <div class="vector-strip">
    <span class="tag">column vector</span>
    <span class="col" id="col-display"></span>
  </div>

  <div id="controls" class="controls"></div>
</div>

<script>
"use strict";

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  faint:  "#3a4a5a",
  grey:   "#7a7875",
  off:    "#f0eeea"
};

// ----- world coordinates -----
var SVG_W = 480, SVG_H = 320;
var X_MIN = -7, X_MAX = 9, Y_MIN = -5, Y_MAX = 5;
var pxPerX = SVG_W / (X_MAX - X_MIN);
var pxPerY = SVG_H / (Y_MAX - Y_MIN);
var UNIT = Math.min(pxPerX, pxPerY);
var ORIGIN_PX = {
  x: (SVG_W - (X_MAX - X_MIN) * UNIT) / 2 - X_MIN * UNIT,
  y: SVG_H - (-Y_MIN) * UNIT - (SVG_H - (Y_MAX - Y_MIN) * UNIT) / 2
};
function toSx(x){ return ORIGIN_PX.x + x * UNIT; }
function toSy(y){ return ORIGIN_PX.y - y * UNIT; }
function fromSx(sx){ return (sx - ORIGIN_PX.x) / UNIT; }
function fromSy(sy){ return (ORIGIN_PX.y - sy) / UNIT; }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function snapHalf(v){ return Math.round(v * 2) / 2; }

// ----- object triangle -----
var OBJ = [ {x:1,y:1}, {x:4,y:1}, {x:2,y:3} ];
var LABELS = ['A','B','C'];

// ----- state -----
var P = { tx: 3, ty: -2 };
var D = { tx: 3, ty: -2 };
var DEFAULTS = { tx: 3, ty: -2 };
var SPRING = 0.22, EPS = 0.005;
var raf = null;

// ----- KaTeX helpers -----
function tryRender(target, tex){
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else {
    setTimeout(function(){ tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, align){
  align = align || "center";
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - 50);
  fo.setAttribute("y", y - 11);
  fo.setAttribute("width", 100);
  fo.setAttribute("height", 22);
  fo.style.overflow = "visible";
  fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px";
  div.style.display = "flex";
  div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host";
  div.style.color = color || COL.off;
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
}

// ----- drawing -----
function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function drawGridAxes(){
  var gGrid = document.getElementById("g-grid");
  var gAxes = document.getElementById("g-axes");
  var gTicks = document.getElementById("g-ticks");
  clear(gGrid); clear(gAxes); clear(gTicks);
  for (var x = Math.ceil(X_MIN); x <= X_MAX; x++){
    var l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1", toSx(x)); l.setAttribute("x2", toSx(x));
    l.setAttribute("y1", toSy(Y_MIN)); l.setAttribute("y2", toSy(Y_MAX));
    l.setAttribute("stroke", "#141e2a"); l.setAttribute("stroke-width", 0.7);
    gGrid.appendChild(l);
  }
  for (var y = Math.ceil(Y_MIN); y <= Y_MAX; y++){
    var l2 = document.createElementNS("http://www.w3.org/2000/svg","line");
    l2.setAttribute("y1", toSy(y)); l2.setAttribute("y2", toSy(y));
    l2.setAttribute("x1", toSx(X_MIN)); l2.setAttribute("x2", toSx(X_MAX));
    l2.setAttribute("stroke", "#141e2a"); l2.setAttribute("stroke-width", 0.7);
    gGrid.appendChild(l2);
  }
  var ax = document.createElementNS("http://www.w3.org/2000/svg","line");
  ax.setAttribute("x1", toSx(X_MIN)); ax.setAttribute("x2", toSx(X_MAX));
  ax.setAttribute("y1", toSy(0)); ax.setAttribute("y2", toSy(0));
  ax.setAttribute("stroke", COL.faint); ax.setAttribute("stroke-width", 1.2);
  gAxes.appendChild(ax);
  var ay = document.createElementNS("http://www.w3.org/2000/svg","line");
  ay.setAttribute("y1", toSy(Y_MIN)); ay.setAttribute("y2", toSy(Y_MAX));
  ay.setAttribute("x1", toSx(0)); ay.setAttribute("x2", toSx(0));
  ay.setAttribute("stroke", COL.faint); ay.setAttribute("stroke-width", 1.2);
  gAxes.appendChild(ay);
  for (var xt = Math.ceil(X_MIN); xt <= X_MAX; xt++){
    if (xt === 0) continue;
    svgKaTeXLabel(gTicks, toSx(xt), toSy(0) + 11, String(xt), COL.grey);
  }
  for (var yt = Math.ceil(Y_MIN); yt <= Y_MAX; yt++){
    if (yt === 0) continue;
    svgKaTeXLabel(gTicks, toSx(0) - 12, toSy(yt), String(yt), COL.grey);
  }
}

function drawArrow(g, fromPt, toPt, color, width, withHead, dashed){
  var x1 = toSx(fromPt.x), y1 = toSy(fromPt.y);
  var x2 = toSx(toPt.x),   y2 = toSy(toPt.y);
  var dx = x2 - x1, dy = y2 - y1;
  var L = Math.sqrt(dx*dx + dy*dy);
  if (L < 4) return;
  var ux = dx / L, uy = dy / L;
  var head = withHead ? 10 : 0;
  var bx = x2 - ux * head, by = y2 - uy * head;
  var ln = document.createElementNS("http://www.w3.org/2000/svg","line");
  ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
  ln.setAttribute("x2", bx); ln.setAttribute("y2", by);
  ln.setAttribute("stroke", color); ln.setAttribute("stroke-width", width);
  if (dashed) ln.setAttribute("stroke-dasharray", "5 4");
  ln.setAttribute("stroke-linecap", "round");
  g.appendChild(ln);
  if (withHead){
    var w = 5.5;
    var tri = document.createElementNS("http://www.w3.org/2000/svg","path");
    tri.setAttribute("d", "M " + x2 + " " + y2 +
      " L " + (x2 - ux*head + uy*w) + " " + (y2 - uy*head - ux*w) +
      " L " + (x2 - ux*head - uy*w) + " " + (y2 - uy*head + ux*w) + " Z");
    tri.setAttribute("fill", color);
    g.appendChild(tri);
  }
}

function drawPoly(g, pts, fillCol, strokeCol, strokeW){
  var d = "M " + toSx(pts[0].x) + " " + toSy(pts[0].y);
  for (var i = 1; i < pts.length; i++) d += " L " + toSx(pts[i].x) + " " + toSy(pts[i].y);
  d += " Z";
  var path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d", d);
  path.setAttribute("fill", fillCol);
  path.setAttribute("stroke", strokeCol);
  path.setAttribute("stroke-width", strokeW || 2);
  path.setAttribute("stroke-linejoin","round");
  g.appendChild(path);
  return path;
}
function drawVertexDot(g, pt, color, label, primeFlag){
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
  c.setAttribute("r", 3.5); c.setAttribute("fill", color);
  g.appendChild(c);
  var lblX = toSx(pt.x) + (primeFlag ? 12 : -12);
  var lblY = toSy(pt.y) - 10;
  svgKaTeXLabel(g, lblX, lblY, label, color, primeFlag ? "left" : "right");
}

function drawScene(){
  // origin dot, big yellow vector arrow, faint guide arrows on each vertex
  var gVec = document.getElementById("g-vec");
  var gGuides = document.getElementById("g-guides");
  clear(gVec); clear(gGuides);

  // ghost arrows from each object vertex to its image vertex (faint yellow)
  OBJ.forEach(function(p){
    var q = { x: p.x + D.tx, y: p.y + D.ty };
    drawArrow(gGuides, p, q, "rgba(255,240,103,0.32)", 1.4, true, true);
  });

  // origin dot
  var oc = document.createElementNS("http://www.w3.org/2000/svg","circle");
  oc.setAttribute("cx", toSx(0)); oc.setAttribute("cy", toSy(0));
  oc.setAttribute("r", 3); oc.setAttribute("fill", COL.faint);
  gVec.appendChild(oc);

  // primary translation arrow: origin → (tx, ty)
  if (Math.abs(D.tx) > 0.001 || Math.abs(D.ty) > 0.001){
    drawArrow(gVec, {x:0,y:0}, {x:D.tx, y:D.ty}, COL.yellow, 2.5, true, false);
  }

  // object + image triangles
  var gObj = document.getElementById("g-object");
  var gImg = document.getElementById("g-image");
  clear(gObj); clear(gImg);
  drawPoly(gObj, OBJ, "rgba(0,171,250,0.10)", COL.blue, 2);
  var IMG = OBJ.map(function(p){ return { x: p.x + D.tx, y: p.y + D.ty }; });
  drawPoly(gImg, IMG, "rgba(255,70,112,0.10)", COL.pink, 2);
  OBJ.forEach(function(p,i){ drawVertexDot(gObj, p, COL.blue, LABELS[i], false); });
  IMG.forEach(function(p,i){ drawVertexDot(gImg, p, COL.pink, LABELS[i] + "'", true); });

  // yellow draggable handle at vector tip
  var gH = document.getElementById("g-handles");
  clear(gH);
  var h = document.createElementNS("http://www.w3.org/2000/svg","circle");
  h.setAttribute("cx", toSx(D.tx)); h.setAttribute("cy", toSy(D.ty));
  h.setAttribute("r", 7);
  h.setAttribute("fill", COL.yellow);
  h.setAttribute("stroke", "#0b1118");
  h.setAttribute("stroke-width", 1.5);
  h.setAttribute("class", "handle");
  h.style.color = COL.yellow;
  gH.appendChild(h);
}

// ----- mark scheme / column display -----
function fmtNum(v){
  var r = Math.round(v * 10) / 10;
  if (Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
  return r.toFixed(1);
}
function renderColumn(){
  var el = document.getElementById("col-display");
  el.innerHTML = "";
  var tex = "\\begin{pmatrix} {\\color{#00abfa}" + fmtNum(D.tx) + "} \\\\ {\\color{#ff822c}" + fmtNum(D.ty) + "} \\end{pmatrix}";
  tryRender(el, tex);
}

// ----- point-in-polygon -----
function pointInPoly(p, poly){
  var inside = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++){
    var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    var intersect = ((yi > p.y) !== (yj > p.y)) &&
      (p.x < (xj - xi) * (p.y - yi) / ((yj - yi) || 1e-9) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
function dist2(a, b){ var dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; }

// ----- hit-test -----
function hitTest(m){
  // 1. yellow tip handle (display position)
  if (dist2(m, { x: D.tx, y: D.ty }) < 0.6*0.6){
    return { kind: "tip" };
  }
  // 2. pink triangle
  var IMG = OBJ.map(function(p){ return { x: p.x + D.tx, y: p.y + D.ty }; });
  if (pointInPoly(m, IMG)){
    var cx = (IMG[0].x + IMG[1].x + IMG[2].x) / 3;
    var cy = (IMG[0].y + IMG[1].y + IMG[2].y) / 3;
    return { kind: "shape", grab: { x: m.x - cx, y: m.y - cy } };
  }
  return null;
}
function applyDrag(info, m){
  if (info.kind === "tip"){
    P.tx = clamp(snapHalf(m.x), -8, 8);
    P.ty = clamp(snapHalf(m.y), -6, 6);
  } else if (info.kind === "shape"){
    var ocx = (OBJ[0].x + OBJ[1].x + OBJ[2].x) / 3;
    var ocy = (OBJ[0].y + OBJ[1].y + OBJ[2].y) / 3;
    P.tx = clamp(snapHalf(m.x - info.grab.x - ocx), -8, 8);
    P.ty = clamp(snapHalf(m.y - info.grab.y - ocy), -6, 6);
  }
  updateActivePresetButtons();
  kick();
}

// ----- stage pointer dispatch -----
var stage = document.getElementById("stage");
var dragInfo = null;
function svgPtFromEvent(e){
  var pt = stage.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}
function evMath(e){
  var sp = svgPtFromEvent(e);
  return { x: fromSx(sp.x), y: fromSy(sp.y) };
}
stage.addEventListener("pointerdown", function(e){
  var info = hitTest(evMath(e));
  if (!info) return;
  e.preventDefault();
  dragInfo = info;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("grabbing");
});
stage.addEventListener("pointermove", function(e){
  if (!dragInfo){
    var hit = hitTest(evMath(e));
    if (hit) stage.classList.add("hover-grab");
    else stage.classList.remove("hover-grab");
    return;
  }
  e.preventDefault();
  applyDrag(dragInfo, evMath(e));
});
function endDrag(e){
  if (!dragInfo) return;
  dragInfo = null;
  try { stage.releasePointerCapture(e.pointerId); } catch(_){}
  stage.classList.remove("grabbing");
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", function(){ stage.classList.remove("hover-grab"); });

// ----- spring loop -----
function settled(){ return Math.abs(P.tx - D.tx) < EPS && Math.abs(P.ty - D.ty) < EPS; }
function step(){
  D.tx += (P.tx - D.tx) * SPRING;
  D.ty += (P.ty - D.ty) * SPRING;
  drawScene();
  renderColumn();
  if (!settled()){
    raf = requestAnimationFrame(step);
  } else {
    raf = null;
    D.tx = P.tx; D.ty = P.ty;
    drawScene(); renderColumn();
  }
}
function kick(){ if (raf == null) raf = requestAnimationFrame(step); notifyHeight(); }

// ----- preset buttons -----
function renderControls(){
  var c = document.getElementById("controls");
  c.innerHTML = "";
  [["3,-2","[3, -2]"],["-4,3","[-4, 3]"],["5,0","[5, 0]"],["0,-3","[0, -3]"],["-2,-2","[-2, -2]"]].forEach(function(pair){
    var b = document.createElement("button");
    var v = pair[0].split(",").map(parseFloat);
    b.className = "preset-btn" + (v[0] === P.tx && v[1] === P.ty ? " active" : "");
    b.textContent = pair[1];
    b.dataset.preset = pair[0];
    b.onclick = function(){ P.tx = v[0]; P.ty = v[1]; updateActivePresetButtons(); kick(); };
    c.appendChild(b);
  });
  var reset = document.createElement("button");
  reset.className = "reset-btn";
  reset.textContent = "↻ reset";
  reset.onclick = function(){ P.tx = DEFAULTS.tx; P.ty = DEFAULTS.ty; updateActivePresetButtons(); kick(); };
  c.appendChild(reset);
}
function updateActivePresetButtons(){
  document.querySelectorAll(".preset-btn").forEach(function(b){
    var v = b.dataset.preset.split(",").map(parseFloat);
    if (v[0] === P.tx && v[1] === P.ty) b.classList.add("active");
    else b.classList.remove("active");
  });
}

// ----- post-message -----
function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

// ----- init -----
drawGridAxes();
renderControls();
drawScene();
renderColumn();
setTimeout(notifyHeight, 200);
</script>
</body>
</html>
