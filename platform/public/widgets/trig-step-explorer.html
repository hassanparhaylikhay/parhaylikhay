<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Trig Step Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:14px; flex-wrap:wrap; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .layout { display:grid; grid-template-columns: 1fr; gap:18px; align-items:start; }
  @media (min-width: 560px) { .layout { grid-template-columns: 320px 1fr; gap:22px; } }

  .stage-outer { width:100%; max-width:340px; margin:0 auto; aspect-ratio: 320 / 300; position:relative; }
  svg { display:block; width:100%; height:100%; user-select:none; overflow:visible; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:13px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .equations { display:flex; flex-direction:column; gap:14px; padding:4px 2px; min-height:240px; }
  .eq-group { display:flex; flex-direction:column; gap:5px; }
  .eq-line { line-height:1.35; }
  .eq-line[data-kind="tag"]    { font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; letter-spacing:0.5px; }
  .eq-line[data-kind="hint"]   { font-style:italic; font-size:14.5px; color:#fff067; }
  .eq-line[data-kind="main"]   { font-size:16.5px; color:#f0eeea; }
  .eq-line[data-kind="ans"]    { font-size:19px; color:#f0eeea; font-weight:700; }
  .eq-line[data-kind="note"]   { font-size:12.5px; color:#7a7875; margin-top:4px; }
  .eq-line .katex { font-size:1em; }

  .controls { display:flex; gap:8px; align-items:center; margin-top:14px; padding-top:10px; border-top:1px solid #141e2a; }
  .controls .left { display:flex; gap:8px; }
  .controls .right { margin-left:auto; font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:7px 16px; border-radius:6px; cursor:pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl:disabled { opacity:0.35; cursor:not-allowed; }

  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 10px currentColor); }
    50%      { filter: drop-shadow(0 0 7px currentColor) drop-shadow(0 0 14px currentColor); }
  }
  .shape-part { transition: opacity 0.5s ease, fill 0.5s ease, stroke 0.5s ease, transform 0.4s ease; }
  .shape-part.faded { opacity: 0.18; }
  .shape-part.highlight { animation: pulse-glow 1.6s ease-in-out infinite; }
  .shape-part.hidden { opacity: 0; pointer-events:none; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">TRIG · STEP EXPLORER</span>
    <span class="meta" id="meta"></span>
  </div>

  <div class="layout">
    <div class="stage-outer">
      <svg id="stage" viewBox="0 0 320 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g id="g-shape"></g>
        <g id="g-labels"></g>
      </svg>
    </div>
    <div class="equations" id="equations"></div>
  </div>

  <div class="controls">
    <div class="left">
      <button class="ctl" id="prev">← back</button>
      <button class="ctl" id="next">next →</button>
    </div>
    <div class="right" id="counter">1 / 1</div>
  </div>

  <p class="footer" id="footer"></p>
</div>

<script>
"use strict";

var COL = {
  blue:"#00abfa", yellow:"#fff067", orange:"#ff822c",
  green:"#0fee89", pink:"#ff4670", faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n, dp) {
  if (!isFinite(n)) return "—";
  if (dp == null) dp = 2;
  var v = +n.toFixed(dp);
  return parseFloat(v.toFixed(dp)).toString();
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, alignment, fontSizePx) {
  var W = 120, H = 26;
  var fo = svgEl("foreignObject", {
    x: (x - W/2), y: (y - H/2), width: W, height: H,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "lbl-host";
  if (fontSizePx) div.style.fontSize = fontSizePx + "px";
  div.style.color = color || COL.off;
  div.style.width = "100%"; div.style.height = "100%";
  div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = (alignment === "left" ? "flex-start" : alignment === "right" ? "flex-end" : "center");
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}

var SVG_W = 320, SVG_H = 300;

function clearShape() {
  document.getElementById("g-shape").innerHTML = "";
  document.getElementById("g-labels").innerHTML = "";
}

// ============================================================
// BUILDER: right triangle with angle θ at bottom-left
//   p: { theta, hyp, oppLabel, adjLabel, hypLabel }
//   - theta in degrees (the angle at bottom-left)
//   - hyp is a numeric value used for placement only (display size)
//   - labels override the auto-computed numeric display
// ============================================================
function buildRightTriangle(p) {
  clearShape();
  var g = document.getElementById("g-shape");
  var gl = document.getElementById("g-labels");

  var thetaRad = p.theta * Math.PI / 180;
  var TOP_PAD = 30, BOT_PAD = 36, L_PAD = 38, R_PAD = 38;
  var availW = SVG_W - L_PAD - R_PAD;
  var availH = SVG_H - TOP_PAD - BOT_PAD;
  // Choose hypotenuse pixel length so the triangle fits available area.
  // adj = L*cos(theta), opp = L*sin(theta). Constrain both.
  var L = Math.min(availW / Math.cos(thetaRad), availH / Math.sin(thetaRad));
  var adj = L * Math.cos(thetaRad);
  var opp = L * Math.sin(thetaRad);

  var Pl = { x: (SVG_W - adj) / 2, y: (SVG_H + opp) / 2 };  // bottom-left (angle θ)
  var Pr = { x: Pl.x + adj,        y: Pl.y };               // bottom-right (right angle)
  var Pt = { x: Pr.x,              y: Pr.y - opp };         // top-right

  // Triangle interior fill
  g.appendChild(svgEl("path", {
    "class": "shape-part",
    d: "M " + Pl.x + " " + Pl.y + " L " + Pr.x + " " + Pr.y + " L " + Pt.x + " " + Pt.y + " Z",
    fill: "rgba(255,240,103,0.06)", stroke: "none"
  }));

  // adj (blue, bottom)
  var adjLine = svgEl("line", {
    "class": "shape-part",
    x1: Pl.x, y1: Pl.y, x2: Pr.x, y2: Pr.y,
    stroke: COL.blue, "stroke-width": 4, "stroke-linecap": "round"
  });
  adjLine.style.color = COL.blue;
  g.appendChild(adjLine);

  // opp (orange, vertical right)
  var oppLine = svgEl("line", {
    "class": "shape-part",
    x1: Pr.x, y1: Pr.y, x2: Pt.x, y2: Pt.y,
    stroke: COL.orange, "stroke-width": 4, "stroke-linecap": "round"
  });
  oppLine.style.color = COL.orange;
  g.appendChild(oppLine);

  // hyp (pink, diagonal)
  var hypLine = svgEl("line", {
    "class": "shape-part",
    x1: Pl.x, y1: Pl.y, x2: Pt.x, y2: Pt.y,
    stroke: COL.pink, "stroke-width": 4, "stroke-linecap": "round"
  });
  hypLine.style.color = COL.pink;
  g.appendChild(hypLine);

  // Right-angle marker at P_R
  var raSize = 10;
  g.appendChild(svgEl("path", {
    "class": "shape-part",
    d: "M " + (Pr.x - raSize) + " " + Pr.y +
       " L " + (Pr.x - raSize) + " " + (Pr.y - raSize) +
       " L " + Pr.x + " " + (Pr.y - raSize),
    fill: "none", stroke: COL.yellow, "stroke-width": 1.4, opacity: 0.7
  }));

  // Angle arc at P_L
  var arcR = Math.min(26, adj * 0.32);
  var arcEndX = Pl.x + arcR * Math.cos(thetaRad);
  var arcEndY = Pl.y - arcR * Math.sin(thetaRad);
  var arcEl = svgEl("path", {
    "class": "shape-part",
    d: "M " + (Pl.x + arcR) + " " + Pl.y +
       " A " + arcR + " " + arcR + " 0 0 0 " + arcEndX + " " + arcEndY,
    fill: "none", stroke: COL.yellow, "stroke-width": 2.2
  });
  arcEl.style.color = COL.yellow;
  g.appendChild(arcEl);

  // θ label inside arc
  var labMidX = Pl.x + (arcR + 16) * Math.cos(thetaRad / 2);
  var labMidY = Pl.y - (arcR + 16) * Math.sin(thetaRad / 2);
  svgKaTeXLabel(gl, labMidX, labMidY,
    "{\\color{" + COL.yellow + "}" + (p.thetaLabel || (p.theta + "°")) + "}", null, "center", 13);

  // Side labels (or "?" or named)
  if (p.adjLabel != null) {
    svgKaTeXLabel(gl, (Pl.x + Pr.x) / 2, Pr.y + 18,
      "{\\color{" + COL.blue + "}" + p.adjLabel + "}", null, "center", 13);
  }
  if (p.oppLabel != null) {
    svgKaTeXLabel(gl, Pr.x + 30, (Pr.y + Pt.y) / 2,
      "{\\color{" + COL.orange + "}" + p.oppLabel + "}", null, "center", 13);
  }
  if (p.hypLabel != null) {
    var midH = { x: (Pl.x + Pt.x) / 2, y: (Pl.y + Pt.y) / 2 };
    var hypVec = { x: Pt.x - Pl.x, y: Pt.y - Pl.y };
    var hypLen = Math.sqrt(hypVec.x*hypVec.x + hypVec.y*hypVec.y) || 1;
    var outX = hypVec.y / hypLen, outY = -hypVec.x / hypLen;
    var toPrX = Pr.x - midH.x, toPrY = Pr.y - midH.y;
    if (outX * toPrX + outY * toPrY > 0) { outX = -outX; outY = -outY; }
    svgKaTeXLabel(gl, midH.x + outX * 22, midH.y + outY * 22,
      "{\\color{" + COL.pink + "}" + p.hypLabel + "}", null, "center", 13);
  }

  // Optional vertex labels at the three corners (e.g. A, B, C for a named triangle)
  if (p.vertices) {
    if (p.vertices.left) {
      svgKaTeXLabel(gl, Pl.x - 14, Pl.y + 12,
        "{\\color{" + COL.grey + "}" + p.vertices.left + "}", null, "center", 13);
    }
    if (p.vertices.right) {
      svgKaTeXLabel(gl, Pr.x + 14, Pr.y + 12,
        "{\\color{" + COL.grey + "}" + p.vertices.right + "}", null, "center", 13);
    }
    if (p.vertices.top) {
      svgKaTeXLabel(gl, Pt.x + 14, Pt.y - 12,
        "{\\color{" + COL.grey + "}" + p.vertices.top + "}", null, "center", 13);
    }
  }

  return { adj: adjLine, opp: oppLine, hyp: hypLine, arc: arcEl };
}

// ============================================================
// PRESETS
// ============================================================
var PRESETS = {
  "find-opp-sin": {
    title: "Find the opposite — using sin",
    builder: buildRightTriangle,
    params: { theta: 35, oppLabel: "x = ?", adjLabel: null, hypLabel: "12" },
    footer: "When hyp and an angle are given, sin tells you about opp.",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: WHAT'S GIVEN" },
          { kind: "hint", text: "θ = 35°, hypotenuse = 12. Find the opposite side x." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","hyp","arc"], fade: ["adj"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "we want opp; we know hyp and θ. The pairing opp + hyp is sin." },
          { kind: "main", tex: "\\sin\\theta = \\dfrac{{\\color{#ff822c}\\text{opp}}}{{\\color{#ff4670}\\text{hyp}}}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp"], fade: ["adj"],
        eqs: [
          { kind: "tag", text: "STEP 3: SUBSTITUTE AND SOLVE" },
          { kind: "main", tex: "\\sin 35° = \\dfrac{x}{12}" },
          { kind: "main", tex: "x = 12 \\sin 35°" },
          { kind: "ans", tex: "{\\color{#ff822c}x \\approx 6.88\\;\\text{cm}}" }
        ] }
    ]
  },
  "find-adj-cos": {
    title: "Find the adjacent — using cos",
    builder: buildRightTriangle,
    params: { theta: 40, oppLabel: null, adjLabel: "x = ?", hypLabel: "10" },
    footer: "When hyp and an angle are given, cos tells you about adj.",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: WHAT'S GIVEN" },
          { kind: "hint", text: "θ = 40°, hypotenuse = 10. Find the adjacent side x." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["adj","hyp","arc"], fade: ["opp"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "we want adj; we know hyp and θ. The pairing adj + hyp is cos." },
          { kind: "main", tex: "\\cos\\theta = \\dfrac{{\\color{#00abfa}\\text{adj}}}{{\\color{#ff4670}\\text{hyp}}}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["adj"], fade: ["opp"],
        eqs: [
          { kind: "tag", text: "STEP 3: SUBSTITUTE AND SOLVE" },
          { kind: "main", tex: "\\cos 40° = \\dfrac{x}{10}" },
          { kind: "main", tex: "x = 10 \\cos 40°" },
          { kind: "ans", tex: "{\\color{#00abfa}x \\approx 7.66\\;\\text{cm}}" }
        ] }
    ]
  },
  "find-opp-tan": {
    title: "Find the opposite — using tan",
    builder: buildRightTriangle,
    params: { theta: 28, oppLabel: "x = ?", adjLabel: "8", hypLabel: null },
    footer: "When adj and an angle are given (no hyp), tan is the right tool.",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: WHAT'S GIVEN" },
          { kind: "hint", text: "θ = 28°, adjacent = 8. Find the opposite side x." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","adj","arc"], fade: ["hyp"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "opp and adj — that pairing is tan." },
          { kind: "main", tex: "\\tan\\theta = \\dfrac{{\\color{#ff822c}\\text{opp}}}{{\\color{#00abfa}\\text{adj}}}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp"], fade: ["hyp"],
        eqs: [
          { kind: "tag", text: "STEP 3: SUBSTITUTE AND SOLVE" },
          { kind: "main", tex: "\\tan 28° = \\dfrac{x}{8}" },
          { kind: "main", tex: "x = 8 \\tan 28°" },
          { kind: "ans", tex: "{\\color{#ff822c}x \\approx 4.25\\;\\text{cm}}" }
        ] }
    ]
  },
  "find-hyp-from-opp": {
    title: "Find the hypotenuse — rearrange sin",
    builder: buildRightTriangle,
    params: { theta: 30, oppLabel: "5", adjLabel: null, hypLabel: "x = ?" },
    footer: "When the unknown is in the denominator, multiply across.",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: WHAT'S GIVEN" },
          { kind: "hint", text: "θ = 30°, opp = 5. Find the hypotenuse x." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","hyp","arc"], fade: ["adj"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "opp + hyp pairing → sin." },
          { kind: "main", tex: "\\sin 30° = \\dfrac{5}{x}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["hyp"], fade: ["adj"],
        eqs: [
          { kind: "tag", text: "STEP 3: REARRANGE" },
          { kind: "hint", text: "the unknown is in the denominator — multiply both sides by x, then divide by sin 30°." },
          { kind: "main", tex: "x = \\dfrac{5}{\\sin 30°} = \\dfrac{5}{0.5}" },
          { kind: "ans", tex: "{\\color{#ff4670}x = 10\\;\\text{cm}}" }
        ] }
    ]
  },
  "find-angle-tan": {
    title: "Find the angle — given two legs",
    builder: buildRightTriangle,
    params: { theta: 36.87, oppLabel: "3", adjLabel: "4", hypLabel: null, thetaLabel: "\\theta = ?" },
    footer: "Two legs given → tan → arctan to recover the angle.",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: WHAT'S GIVEN" },
          { kind: "hint", text: "opp = 3, adj = 4. Find the angle θ." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","adj"], fade: ["hyp"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "opp + adj → tan." },
          { kind: "main", tex: "\\tan\\theta = \\dfrac{3}{4}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["arc"],
        eqs: [
          { kind: "tag", text: "STEP 3: INVERSE TAN" },
          { kind: "main", tex: "\\theta = \\tan^{-1}\\left(\\tfrac{3}{4}\\right)" },
          { kind: "ans", tex: "{\\color{#fff067}\\theta \\approx 36.9°}" },
          { kind: "note", text: "this triangle is the (3, 4, 5) Pythagorean triple — the angles are ≈ 36.9° and 53.1°" }
        ] }
    ]
  },
  "find-angle-sin": {
    title: "Find the angle — given opp and hyp",
    builder: buildRightTriangle,
    params: { theta: 30, oppLabel: "5", adjLabel: null, hypLabel: "10", thetaLabel: "\\theta = ?" },
    footer: "Inverse sin recovers the angle from a known opp/hyp ratio.",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: WHAT'S GIVEN" },
          { kind: "hint", text: "opp = 5, hyp = 10. Find the angle θ." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","hyp"], fade: ["adj"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "opp + hyp → sin." },
          { kind: "main", tex: "\\sin\\theta = \\dfrac{5}{10} = 0.5" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["arc"],
        eqs: [
          { kind: "tag", text: "STEP 3: INVERSE SIN" },
          { kind: "main", tex: "\\theta = \\sin^{-1}(0.5)" },
          { kind: "ans", tex: "{\\color{#fff067}\\theta = 30°}" }
        ] }
    ]
  },
  "label-sides": {
    title: "Naming the sides",
    builder: buildRightTriangle,
    params: { theta: 35, oppLabel: "opp", adjLabel: "adj", hypLabel: "hyp" },
    footer: "opp = across from θ; adj = next to θ; hyp = across from the right angle.",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: NAME THE SIDES" },
          { kind: "hint", text: "labels are RELATIVE to the chosen angle θ. Move the angle to the other vertex and they swap." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["hyp"],
        eqs: [
          { kind: "tag", text: "STEP 2: HYPOTENUSE" },
          { kind: "hint", text: "always opposite the right angle. Always the longest side. Doesn't change with θ." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp"],
        eqs: [
          { kind: "tag", text: "STEP 3: OPPOSITE" },
          { kind: "hint", text: "the side ACROSS from θ — you can draw a line from θ that doesn't touch the side." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["adj"],
        eqs: [
          { kind: "tag", text: "STEP 4: ADJACENT" },
          { kind: "hint", text: "the side NEXT to θ that isn't the hypotenuse. The two non-hypotenuse legs are the adj and opp." }
        ] }
    ]
  },

  // === Worked-example presets ===
  "compute-ratios-5-12-13": {
    title: "Computing sin, cos, tan from sides",
    builder: buildRightTriangle,
    params: { theta: 22.62, oppLabel: "5", adjLabel: "12", hypLabel: "13", thetaLabel: "\\theta" },
    footer: "(5, 12, 13) is a Pythagorean triple — sides come out clean",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: THE TRIANGLE" },
          { kind: "hint", text: "right triangle with sides 5, 12, 13. The angle θ sits between the 12 and the 13." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","hyp"],
        eqs: [
          { kind: "tag", text: "STEP 2: SIN θ = OPP / HYP" },
          { kind: "main", tex: "\\sin\\theta = \\dfrac{{\\color{#ff822c}5}}{{\\color{#ff4670}13}}" },
          { kind: "ans", tex: "{\\color{#ff822c}\\sin\\theta = \\tfrac{5}{13}}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["adj","hyp"],
        eqs: [
          { kind: "tag", text: "STEP 3: COS θ = ADJ / HYP" },
          { kind: "main", tex: "\\cos\\theta = \\dfrac{{\\color{#00abfa}12}}{{\\color{#ff4670}13}}" },
          { kind: "ans", tex: "{\\color{#00abfa}\\cos\\theta = \\tfrac{12}{13}}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","adj"],
        eqs: [
          { kind: "tag", text: "STEP 4: TAN θ = OPP / ADJ" },
          { kind: "main", tex: "\\tan\\theta = \\dfrac{{\\color{#ff822c}5}}{{\\color{#00abfa}12}}" },
          { kind: "ans", tex: "{\\color{#fff067}\\tan\\theta = \\tfrac{5}{12}}" }
        ] }
    ]
  },
  "tree-shadow-58": {
    title: "Tree shadow — find the height",
    builder: buildRightTriangle,
    params: { theta: 58, oppLabel: "h = ?", adjLabel: "9\\,\\text{m}", hypLabel: null },
    footer: "Tree is the opposite, shadow is the adjacent, line of sight is the hypotenuse",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: THE SCENE" },
          { kind: "hint", text: "9 m shadow, 58° angle of elevation. Find the tree height h." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","adj"], fade: ["hyp"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "we have adj (9) and want opp (h). adj + opp pair → tan." },
          { kind: "main", tex: "\\tan 58° = \\dfrac{h}{9}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp"],
        eqs: [
          { kind: "tag", text: "STEP 3: SOLVE" },
          { kind: "main", tex: "h = 9 \\tan 58° \\approx 9 \\times 1.6003" },
          { kind: "ans", tex: "{\\color{#ff822c}h \\approx 14.4\\;\\text{m}}" }
        ] }
    ]
  },
  "ramp-cos-12": {
    title: "Ramp length — find the hypotenuse",
    builder: buildRightTriangle,
    params: { theta: 12, oppLabel: null, adjLabel: "4.5\\,\\text{m}", hypLabel: "x = ?" },
    footer: "Unknown in the denominator — divide instead of multiply",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: THE SCENE" },
          { kind: "hint", text: "ramp rising at 12° over 4.5 m horizontal. Find the ramp length x." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["adj","hyp"], fade: ["opp"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "have adj, want hyp → cos." },
          { kind: "main", tex: "\\cos 12° = \\dfrac{4.5}{x}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["hyp"], fade: ["opp"],
        eqs: [
          { kind: "tag", text: "STEP 3: REARRANGE AND SOLVE" },
          { kind: "hint", text: "the unknown is in the denominator. Multiply both sides by x, then divide by cos 12°." },
          { kind: "main", tex: "x = \\dfrac{4.5}{\\cos 12°} \\approx \\dfrac{4.5}{0.9781}" },
          { kind: "ans", tex: "{\\color{#ff4670}x \\approx 4.60\\;\\text{m}}" }
        ] }
    ]
  },
  "ramp-angle-find": {
    title: "Wheelchair ramp — find the angle",
    builder: buildRightTriangle,
    params: { theta: 6.84, oppLabel: "0.6\\,\\text{m}", adjLabel: "5\\,\\text{m}", hypLabel: null, thetaLabel: "\\theta = ?" },
    footer: "opp + adj → tan, then inverse tan to recover the angle",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: THE SCENE" },
          { kind: "hint", text: "ramp rises 0.6 m over 5 m horizontal. Find the angle of the ramp with the ground." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","adj"], fade: ["hyp"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK THE RATIO" },
          { kind: "hint", text: "two legs given → tan." },
          { kind: "main", tex: "\\tan\\theta = \\dfrac{0.6}{5} = 0.12" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["arc"],
        eqs: [
          { kind: "tag", text: "STEP 3: INVERSE TAN" },
          { kind: "main", tex: "\\theta = \\tan^{-1}(0.12) \\approx 6.84°" },
          { kind: "ans", tex: "{\\color{#fff067}\\theta \\approx 6.8°}" }
        ] }
    ]
  },
  "find-angle-5-12-13": {
    title: "Angle in a 5-12-13 triangle",
    builder: buildRightTriangle,
    params: { theta: 22.62, oppLabel: "5", adjLabel: "12", hypLabel: "13", thetaLabel: "\\alpha = ?" },
    footer: "All three sides given — pick any pair and use inverse trig",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: THE TRIANGLE" },
          { kind: "hint", text: "all three sides given: 5, 12, 13. Find the angle α opposite the side 5." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","hyp"], fade: ["adj"],
        eqs: [
          { kind: "tag", text: "STEP 2: PICK A RATIO" },
          { kind: "hint", text: "use opp = 5 and hyp = 13 → sin." },
          { kind: "main", tex: "\\sin\\alpha = \\dfrac{5}{13} \\approx 0.3846" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["arc"],
        eqs: [
          { kind: "tag", text: "STEP 3: INVERSE SIN" },
          { kind: "main", tex: "\\alpha = \\sin^{-1}(0.3846) \\approx 22.62°" },
          { kind: "ans", tex: "{\\color{#fff067}\\alpha \\approx 22.6°}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["arc"],
        eqs: [
          { kind: "tag", text: "STEP 4: THE OTHER ACUTE ANGLE" },
          { kind: "hint", text: "the two acute angles sum to 90°." },
          { kind: "ans", tex: "{\\color{#fff067}\\beta = 90° - 22.6° \\approx 67.4°}" }
        ] }
    ]
  },
  "triangle-abc-comprehensive": {
    title: "Triangle ABC — multi-part",
    builder: buildRightTriangle,
    params: { theta: 38, oppLabel: "BC", adjLabel: "AB = 6.2", hypLabel: "AC", thetaLabel: "38°", vertices: { left: "A", right: "B", top: "C" } },
    footer: "Right angle at B; angle BAC = 38°",
    steps: [
      { show: ["adj","opp","hyp","arc"],
        eqs: [
          { kind: "tag", text: "STEP 1: THE TRIANGLE" },
          { kind: "hint", text: "right-angled at B. AB = 6.2 cm and angle BAC = 38°. Find BC, AC, and angle BCA." }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["opp","adj"], fade: ["hyp"],
        eqs: [
          { kind: "tag", text: "STEP 2: PART (A) — FIND BC" },
          { kind: "hint", text: "from A, AB is adjacent and BC is opposite. Use tan." },
          { kind: "main", tex: "\\tan 38° = \\dfrac{BC}{6.2}" },
          { kind: "ans", tex: "{\\color{#ff822c}BC = 6.2\\tan 38° \\approx 4.84\\;\\text{cm}}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["adj","hyp"], fade: ["opp"],
        eqs: [
          { kind: "tag", text: "STEP 3: PART (B) — FIND AC" },
          { kind: "hint", text: "AB is adjacent, AC is hypotenuse. Use cos." },
          { kind: "main", tex: "\\cos 38° = \\dfrac{6.2}{AC}" },
          { kind: "ans", tex: "{\\color{#ff4670}AC = \\dfrac{6.2}{\\cos 38°} \\approx 7.87\\;\\text{cm}}" }
        ] },
      { show: ["adj","opp","hyp","arc"], highlight: ["arc"],
        eqs: [
          { kind: "tag", text: "STEP 4: PART (C) — ANGLE BCA" },
          { kind: "hint", text: "the two acute angles sum to 90°." },
          { kind: "ans", tex: "{\\color{#fff067}\\angle BCA = 90° - 38° = 52°}" }
        ] }
    ]
  }
};

// ============================================================
// CONTROLLER
// ============================================================
var qs = new URLSearchParams(location.search);
var PRESET = qs.get("preset") || "label-sides";
var preset = PRESETS[PRESET] || PRESETS["label-sides"];

document.getElementById("title").textContent = preset.title.toUpperCase();
document.getElementById("footer").textContent = preset.footer || "";

var parts = preset.builder(preset.params);

var stepIdx = 0;
var stepEl = document.getElementById("equations");
var counterEl = document.getElementById("counter");
var prevBtn = document.getElementById("prev");
var nextBtn = document.getElementById("next");

function applyVisibility(step) {
  Object.keys(parts).forEach(function(k) {
    var el = parts[k];
    el.classList.remove("faded", "highlight", "hidden");
  });
  Object.keys(parts).forEach(function(k) {
    if (!step.show || step.show.indexOf(k) === -1) {
      parts[k].classList.add("hidden");
    }
  });
  if (step.fade) step.fade.forEach(function(k) { if (parts[k]) parts[k].classList.add("faded"); });
  if (step.highlight) step.highlight.forEach(function(k) { if (parts[k]) parts[k].classList.add("highlight"); });
}

function renderEqs(step) {
  stepEl.innerHTML = "";
  var grp = document.createElement("div"); grp.className = "eq-group";
  step.eqs.forEach(function(line, i) {
    var div = document.createElement("div");
    div.className = "eq-line";
    div.setAttribute("data-kind", line.kind);
    div.style.opacity = "0";
    div.style.transform = "translateY(4px)";
    div.style.transition = "opacity 0.45s ease " + (i*60) + "ms, transform 0.45s ease " + (i*60) + "ms";
    if (line.tex) tryRender(div, line.tex);
    else div.textContent = line.text;
    grp.appendChild(div);
    requestAnimationFrame(function() {
      div.style.opacity = "1";
      div.style.transform = "translateY(0)";
    });
  });
  stepEl.appendChild(grp);
}

function renderStep() {
  var step = preset.steps[stepIdx];
  applyVisibility(step);
  renderEqs(step);
  counterEl.textContent = (stepIdx + 1) + " / " + preset.steps.length;
  prevBtn.disabled = stepIdx === 0;
  nextBtn.disabled = stepIdx === preset.steps.length - 1;
}

prevBtn.onclick = function() { if (stepIdx > 0) { stepIdx--; renderStep(); } };
nextBtn.onclick = function() { if (stepIdx < preset.steps.length - 1) { stepIdx++; renderStep(); } };

renderStep();

// ===== Height reporter =====
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
