<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Exponential Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:24px; }
  .formula { font-size:16px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .controls { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px 12px; margin-bottom:12px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:6px; min-width:0; }
  .row .name { color:#fff067; font-weight:600; min-width:18px; }
  .row input[type=range] { flex:1; min-width:60px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:30px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#7a7875; }
  .curve { stroke:#fff067; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .asymptote { stroke:#ff4670; stroke-width:1; stroke-dasharray:4 4; opacity:0.6; }
  .yint { fill:#0fee89; }

  .readout {
    margin-top:10px; padding:8px 12px;
    background:#07090d; border:1px solid #141e2a; border-radius:6px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875;
    display:flex; justify-content:space-around; flex-wrap:wrap; gap:10px;
  }
  .readout .item .lbl { color:#7a7875; }
  .readout .ok { color:#0fee89; font-weight:600; }
  .readout .warn { color:#ff4670; font-weight:600; }
  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">a</span>
      <input type="range" id="a" min="-3" max="3" value="1" step="0.5"/>
      <span class="val" id="va">1</span>
    </div>
    <div class="row">
      <span class="name">b</span>
      <input type="range" id="b" min="0.5" max="4" value="2" step="0.5"/>
      <span class="val" id="vb">2</span>
    </div>
    <div class="row">
      <span class="name">c</span>
      <input type="range" id="c" min="-3" max="3" value="0" step="0.5"/>
      <span class="val" id="vc">0</span>
    </div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="plot-clip">
        <rect x="40" y="14" width="420" height="276"/>
      </clipPath>
    </defs>
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <text class="axis-title" x="250" y="312" text-anchor="middle">x</text>
    <text class="axis-title" x="32" y="20" text-anchor="middle">y</text>

    <g clip-path="url(#plot-clip)">
      <line class="asymptote" id="asym"/>
      <path class="curve" id="curvePath"/>
      <circle class="yint" id="yint" r="3"/>
    </g>
  </svg>

  <div class="readout">
    <span class="item"><span class="lbl">y-intercept:</span> <span class="ok" id="yintVal">—</span></span>
    <span class="item"><span class="lbl">asymptote:</span> <span class="ok" id="asymVal">—</span></span>
    <span class="item"><span class="lbl">behaviour:</span> <span id="behVal">—</span></span>
  </div>
  <p class="footer">y = a · bˣ + c · pink dashed line is the horizontal asymptote</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var XMIN = -4, XMAX = 4, YMIN = -8, YMAX = 8;
var PX_LEFT = 40, PX_RIGHT = 460;
var PX_TOP  = 14, PX_BOT   = 290;

function xPx(x) { return PX_LEFT + ((x - XMIN) / (XMAX - XMIN)) * (PX_RIGHT - PX_LEFT); }
function yPx(y) { return PX_BOT  - ((y - YMIN) / (YMAX - YMIN)) * (PX_BOT  - PX_TOP);  }

(function buildAxes() {
  var g = document.getElementById("grid");
  var t = document.getElementById("ticks");
  document.getElementById("xAxis").setAttribute("x1", PX_LEFT);
  document.getElementById("xAxis").setAttribute("x2", PX_RIGHT);
  document.getElementById("xAxis").setAttribute("y1", yPx(0));
  document.getElementById("xAxis").setAttribute("y2", yPx(0));
  document.getElementById("yAxis").setAttribute("x1", xPx(0));
  document.getElementById("yAxis").setAttribute("x2", xPx(0));
  document.getElementById("yAxis").setAttribute("y1", PX_TOP);
  document.getElementById("yAxis").setAttribute("y2", PX_BOT);
  for (var x = XMIN; x <= XMAX; x++) {
    var px = xPx(x);
    if (x !== 0) {
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "grid-line");
      line.setAttribute("x1", px); line.setAttribute("x2", px);
      line.setAttribute("y1", PX_TOP); line.setAttribute("y2", PX_BOT);
      g.appendChild(line);
    }
    var tl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tl.setAttribute("class", "axis-tick-label");
    tl.setAttribute("x", px); tl.setAttribute("y", yPx(0) + 14);
    tl.setAttribute("text-anchor", "middle");
    tl.textContent = x;
    t.appendChild(tl);
  }
  for (var y = YMIN; y <= YMAX; y += 2) {
    if (y === 0) continue;
    var py = yPx(y);
    var gl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    gl.setAttribute("class", "grid-line");
    gl.setAttribute("x1", PX_LEFT); gl.setAttribute("x2", PX_RIGHT);
    gl.setAttribute("y1", py); gl.setAttribute("y2", py);
    g.appendChild(gl);
    if (y % 4 === 0) {
      var tly = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tly.setAttribute("class", "axis-tick-label");
      tly.setAttribute("x", xPx(0) - 6); tly.setAttribute("y", py + 3);
      tly.setAttribute("text-anchor", "end");
      tly.textContent = y;
      t.appendChild(tly);
    }
  }
})();

var targetA = 1, displayA = 1;
var targetB = 2, displayB = 2;
var targetC = 0, displayC = 0;
var SPRING = 0.20;

function fmt(v) {
  var n = Math.round(v * 10) / 10;
  return (n === Math.floor(n)) ? n.toFixed(0) : n.toFixed(1);
}
function fmtSign(v) {
  if (Math.abs(v) < 0.01) return "";
  return (v > 0 ? "+ " : "- ") + fmt(Math.abs(v));
}

function tick() {
  displayA += (targetA - displayA) * SPRING;
  displayB += (targetB - displayB) * SPRING;
  displayC += (targetC - displayC) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  var aTex = fmt(displayA);
  var bTex = fmt(displayB);
  var cTex = fmtSign(displayC);
  tryRender(document.getElementById("formula"),
    "y = " + aTex + " \\times " + bTex + "^x \\;" + cTex);

  // sample
  var d = "";
  var SAMPLES = 240;
  var prev = false;
  for (var i = 0; i <= SAMPLES; i++) {
    var x = XMIN + (XMAX - XMIN) * (i / SAMPLES);
    var y = displayA * Math.pow(displayB, x) + displayC;
    if (!isFinite(y)) { prev = false; continue; }
    if (y > YMAX * 2 || y < YMIN * 2) { prev = false; continue; }
    var px = xPx(x);
    var py = yPx(Math.max(YMIN - 0.5, Math.min(YMAX + 0.5, y)));
    d += (prev ? " L " : "M ") + px + " " + py;
    prev = true;
  }
  document.getElementById("curvePath").setAttribute("d", d);

  // asymptote at y = c
  document.getElementById("asym").setAttribute("x1", PX_LEFT);
  document.getElementById("asym").setAttribute("x2", PX_RIGHT);
  document.getElementById("asym").setAttribute("y1", yPx(displayC));
  document.getElementById("asym").setAttribute("y2", yPx(displayC));

  // y-intercept marker
  var yint = displayA + displayC;
  document.getElementById("yint").setAttribute("cx", xPx(0));
  document.getElementById("yint").setAttribute("cy", yPx(yint));

  // readout
  document.getElementById("yintVal").textContent = "(0, " + fmt(targetA + targetC) + ")";
  document.getElementById("asymVal").textContent = "y = " + fmt(targetC);
  var beh = document.getElementById("behVal");
  if (Math.abs(targetA) < 0.01) {
    beh.textContent = "constant"; beh.className = "warn";
  } else if (targetA > 0 && targetB > 1) {
    beh.textContent = "growth"; beh.className = "ok";
  } else if (targetA > 0 && targetB < 1 && targetB > 0) {
    beh.textContent = "decay"; beh.className = "ok";
  } else if (targetA < 0 && targetB > 1) {
    beh.textContent = "negative growth"; beh.className = "warn";
  } else if (targetA < 0 && targetB < 1 && targetB > 0) {
    beh.textContent = "negative decay"; beh.className = "warn";
  } else if (Math.abs(targetB - 1) < 0.01) {
    beh.textContent = "constant (b = 1)"; beh.className = "warn";
  } else {
    beh.textContent = "—"; beh.className = "";
  }
}

document.getElementById("a").addEventListener("input", function(e) {
  targetA = parseFloat(e.target.value);
  document.getElementById("va").textContent = fmt(targetA);
});
document.getElementById("b").addEventListener("input", function(e) {
  targetB = parseFloat(e.target.value);
  document.getElementById("vb").textContent = fmt(targetB);
});
document.getElementById("c").addEventListener("input", function(e) {
  targetC = parseFloat(e.target.value);
  document.getElementById("vc").textContent = fmt(targetC);
});
tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
