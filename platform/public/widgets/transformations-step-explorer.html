<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Transformations · Step Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .panel { display:flex; flex-direction:column; gap:8px; padding:14px 4px 4px; border-top:1px solid #141e2a; margin-top:10px; min-height:120px; }
  .eq-row { font-size:15px; line-height:1.5; color:#f0eeea; }
  .eq-row.tag { font-family:'Geist Mono',monospace; font-size:10.5px; color:#fff067; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:2px; font-weight:600; }
  .eq-row.ans { font-weight:700; font-size:16.5px; }
  .eq-row .katex { font-size:1em; }
  .eq-row.fade-in { animation: fade-up 0.42s ease forwards; opacity:0; }
  @keyframes fade-up { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  .nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; padding-top:10px; border-top:1px solid #141e2a; }
  .nav-btn { background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:6px 12px; border-radius:5px; cursor:pointer; transition: all 0.12s ease; }
  .nav-btn:hover:not(:disabled) { color:#fff067; border-color:#3a4a5a; }
  .nav-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .step-count { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }
  .step-count .cur { color:#fff067; }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 1.5px currentColor); }
    50%      { filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 10px currentColor); }
  }
  .glow { animation: pulse-glow 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">WORKED EXAMPLE</span>
    <span class="meta" id="meta"></span>
  </div>

  <svg id="stage" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-grid"></g>
    <g id="g-axes"></g>
    <g id="g-ticks"></g>
    <g id="g-shifts"></g>
    <g id="g-object"></g>
    <g id="g-image"></g>
    <g id="g-highlights"></g>
  </svg>

  <div class="panel" id="panel"></div>

  <div class="nav">
    <button class="nav-btn" id="prev">← prev</button>
    <span class="step-count"><span class="cur" id="cur">1</span> / <span id="tot">5</span></span>
    <button class="nav-btn" id="next">next →</button>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  faint:  "#3a4a5a",
  grey:   "#7a7875",
  off:    "#f0eeea"
};

// ----- presets -----
var PRESETS = {
  "p1-translation-identify": {
    title: "WORKED EXAMPLE · IDENTIFY THE TRANSLATION",
    obj: [{x:1,y:1}, {x:4,y:1}, {x:2,y:3}],
    img: [{x:4,y:-1}, {x:7,y:-1}, {x:5,y:1}],
    labels: ['A','B','C'],
    range: { xmin:-1, xmax:8, ymin:-3, ymax:5 },
    steps: [
      {
        tag: "STEP 1 · WHAT WE'RE GIVEN",
        lines: [
          "Object $A(1,1),\\, B(4,1),\\, C(2,3)$",
          "Image $A'(4,-1),\\, B'(7,-1),\\, C'(5,1)$",
          "Find the single transformation that maps the blue triangle onto the pink one."
        ],
        highlight: null
      },
      {
        tag: "STEP 2 · TRY ONE VERTEX PAIR",
        lines: [
          "Shift $=$ image $-$ object.",
          "$A' - A = (4-1,\\; -1-1) = (3,\\, -2)$"
        ],
        highlight: 0
      },
      {
        tag: "STEP 3 · CHECK A SECOND PAIR",
        lines: [
          "$B' - B = (7-4,\\; -1-1) = (3,\\, -2)$",
          "Same shift. So far so good."
        ],
        highlight: 1
      },
      {
        tag: "STEP 4 · CHECK THE THIRD",
        lines: [
          "$C' - C = (5-2,\\; 1-3) = (3,\\, -2)$",
          "All three vertices shift by the same vector. This is a translation."
        ],
        highlight: 2
      },
      {
        tag: "ANSWER",
        ans: "\\boxed{\\text{Translation by } \\begin{pmatrix} 3 \\\\ -2 \\end{pmatrix}}",
        marks: "[B1 for \"translation\"; B1 for the correct column vector]",
        highlight: "all"
      }
    ]
  },
  "p2-translation-identify": {
    title: "WORKED EXAMPLE · IDENTIFY THE TRANSLATION",
    obj: [{x:1,y:2}, {x:3,y:2}, {x:1,y:5}],
    img: [{x:-3,y:5}, {x:-1,y:5}, {x:-3,y:8}],
    labels: ['P','Q','R'],
    range: { xmin:-5, xmax:5, ymin:0, ymax:9 },
    steps: [
      {
        tag: "STEP 1 · WHAT WE'RE GIVEN",
        lines: [
          "Object $P(1,2),\\, Q(3,2),\\, R(1,5)$",
          "Image $P'(-3,5),\\, Q'(-1,5),\\, R'(-3,8)$",
          "Find the single transformation that maps the blue triangle onto the pink one."
        ],
        highlight: null
      },
      {
        tag: "STEP 2 · TRY ONE VERTEX PAIR",
        lines: [
          "Shift $=$ image $-$ object.",
          "$P' - P = (-3-1,\\; 5-2) = (-4,\\, 3)$"
        ],
        highlight: 0
      },
      {
        tag: "STEP 3 · CHECK A SECOND PAIR",
        lines: [
          "$Q' - Q = (-1-3,\\; 5-2) = (-4,\\, 3)$",
          "Same shift."
        ],
        highlight: 1
      },
      {
        tag: "STEP 4 · CHECK THE THIRD",
        lines: [
          "$R' - R = (-3-1,\\; 8-5) = (-4,\\, 3)$",
          "All three match. It's a translation."
        ],
        highlight: 2
      },
      {
        tag: "ANSWER",
        ans: "\\boxed{\\text{Translation by } \\begin{pmatrix} -4 \\\\ 3 \\end{pmatrix}}",
        marks: "[B1 for \"translation\"; B1 for the correct column vector]",
        highlight: "all"
      }
    ]
  },
  "p3-reflection-identify": {
    title: "WORKED EXAMPLE · IDENTIFY THE REFLECTION",
    obj: [{x:2,y:1}, {x:5,y:1}, {x:2,y:3}],
    img: [{x:1,y:2}, {x:1,y:5}, {x:3,y:2}],
    labels: ['A','B','C'],
    range: { xmin:-1, xmax:7, ymin:-1, ymax:7 },
    mirror: { p1: {x:-1, y:-1}, p2: {x:7, y:7} },
    steps: [
      {
        tag: "STEP 1 · WHAT WE'RE GIVEN",
        lines: [
          "Object $A(2,1),\\, B(5,1),\\, C(2,3)$",
          "Image $A'(1,2),\\, B'(1,5),\\, C'(3,2)$",
          "The shape stays the same size, so this is NOT an enlargement."
        ],
        highlight: null
      },
      {
        tag: "STEP 2 · RULE OUT TRANSLATION",
        lines: [
          "Shift $A \\to A' = (1-2,\\; 2-1) = (-1,\\, 1)$",
          "Shift $B \\to B' = (1-5,\\; 5-1) = (-4,\\, 4)$",
          "Different shifts. Not a translation."
        ],
        highlight: null,
        showShifts: [0, 1]
      },
      {
        tag: "STEP 3 · TEST THE MIDPOINTS",
        lines: [
          "Reflection $\\Rightarrow$ midpoint of every $(A, A')$ pair lies on the mirror.",
          "Midpoint of $AA'$ $= (1.5,\\, 1.5)$",
          "Midpoint of $BB'$ $= (3,\\, 3)$",
          "Midpoint of $CC'$ $= (2.5,\\, 2.5)$",
          "All three midpoints fit the pattern $x = y$."
        ],
        highlight: "showMirror"
      },
      {
        tag: "STEP 4 · CHECK PERPENDICULAR DISTANCE",
        lines: [
          "Mirror line $y = x$. For each pair, the segment from object to image is perpendicular to the mirror, with equal distances on either side.",
          "That confirms a reflection in $y = x$."
        ],
        highlight: "showMirror",
        showShifts: [0, 1, 2]
      },
      {
        tag: "ANSWER",
        ans: "\\boxed{\\text{Reflection in the line } y = x}",
        marks: "[B1 for \"reflection\"; B1 for the equation of the mirror line]",
        highlight: "all"
      }
    ]
  }
};

function getPreset(){
  var params = new URLSearchParams(window.location.search);
  var key = params.get("preset") || "p1-translation-identify";
  return PRESETS[key] || PRESETS["p1-translation-identify"];
}

var PRESET = getPreset();
var STEP = 0;

// ----- world coordinates (per preset) -----
var SVG_W = 480, SVG_H = 320;
var X_MIN, X_MAX, Y_MIN, Y_MAX, UNIT, ORIGIN_PX;
function configureRange(){
  X_MIN = PRESET.range.xmin;
  X_MAX = PRESET.range.xmax;
  Y_MIN = PRESET.range.ymin;
  Y_MAX = PRESET.range.ymax;
  var pxPerX = SVG_W / (X_MAX - X_MIN);
  var pxPerY = SVG_H / (Y_MAX - Y_MIN);
  UNIT = Math.min(pxPerX, pxPerY);
  ORIGIN_PX = {
    x: (SVG_W - (X_MAX - X_MIN) * UNIT) / 2 - X_MIN * UNIT,
    y: SVG_H - (-Y_MIN) * UNIT - (SVG_H - (Y_MAX - Y_MIN) * UNIT) / 2
  };
}
function toSx(x){ return ORIGIN_PX.x + x * UNIT; }
function toSy(y){ return ORIGIN_PX.y - y * UNIT; }

// ----- KaTeX helpers -----
function tryRender(target, tex){
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else {
    setTimeout(function(){ tryRender(target, tex); }, 50);
  }
}
// Renders a string that mixes prose and inline math like "Shift $=$ image".
// Splits on $...$ boundaries; renders math segments via KaTeX, prose as text.
function renderMixed(target, str){
  target.innerHTML = "";
  if (typeof katex === "undefined"){
    setTimeout(function(){ renderMixed(target, str); }, 50);
    return;
  }
  var parts = str.split(/(\$[^$]+\$)/g);
  parts.forEach(function(part){
    if (!part) return;
    if (part.length >= 2 && part.charAt(0) === "$" && part.charAt(part.length - 1) === "$"){
      var span = document.createElement("span");
      var tex = part.slice(1, -1);
      try { katex.render(tex, span, { throwOnError:false, output:"html" }); }
      catch(e){ span.textContent = part; }
      target.appendChild(span);
    } else {
      target.appendChild(document.createTextNode(part));
    }
  });
}
function svgKaTeXLabel(parent, x, y, tex, color, align){
  align = align || "center";
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - 50);
  fo.setAttribute("y", y - 11);
  fo.setAttribute("width", 100);
  fo.setAttribute("height", 22);
  fo.style.overflow = "visible";
  fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px";
  div.style.display = "flex";
  div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host";
  div.style.color = color || COL.off;
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
}

// ----- drawing primitives -----
function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function drawGridAxes(){
  var gGrid = document.getElementById("g-grid");
  var gAxes = document.getElementById("g-axes");
  var gTicks = document.getElementById("g-ticks");
  clear(gGrid); clear(gAxes); clear(gTicks);
  for (var x = Math.ceil(X_MIN); x <= X_MAX; x++){
    var l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1", toSx(x)); l.setAttribute("x2", toSx(x));
    l.setAttribute("y1", toSy(Y_MIN)); l.setAttribute("y2", toSy(Y_MAX));
    l.setAttribute("stroke", "#141e2a"); l.setAttribute("stroke-width", 0.7);
    gGrid.appendChild(l);
  }
  for (var y = Math.ceil(Y_MIN); y <= Y_MAX; y++){
    var l2 = document.createElementNS("http://www.w3.org/2000/svg","line");
    l2.setAttribute("y1", toSy(y)); l2.setAttribute("y2", toSy(y));
    l2.setAttribute("x1", toSx(X_MIN)); l2.setAttribute("x2", toSx(X_MAX));
    l2.setAttribute("stroke", "#141e2a"); l2.setAttribute("stroke-width", 0.7);
    gGrid.appendChild(l2);
  }
  if (0 >= Y_MIN && 0 <= Y_MAX){
    var ax = document.createElementNS("http://www.w3.org/2000/svg","line");
    ax.setAttribute("x1", toSx(X_MIN)); ax.setAttribute("x2", toSx(X_MAX));
    ax.setAttribute("y1", toSy(0)); ax.setAttribute("y2", toSy(0));
    ax.setAttribute("stroke", COL.faint); ax.setAttribute("stroke-width", 1.2);
    gAxes.appendChild(ax);
  }
  if (0 >= X_MIN && 0 <= X_MAX){
    var ay = document.createElementNS("http://www.w3.org/2000/svg","line");
    ay.setAttribute("y1", toSy(Y_MIN)); ay.setAttribute("y2", toSy(Y_MAX));
    ay.setAttribute("x1", toSx(0)); ay.setAttribute("x2", toSx(0));
    ay.setAttribute("stroke", COL.faint); ay.setAttribute("stroke-width", 1.2);
    gAxes.appendChild(ay);
  }
  for (var xt = Math.ceil(X_MIN); xt <= X_MAX; xt++){
    if (xt === 0) continue;
    if (0 < Y_MIN || 0 > Y_MAX) continue;
    svgKaTeXLabel(gTicks, toSx(xt), toSy(0) + 11, String(xt), COL.grey);
  }
  for (var yt = Math.ceil(Y_MIN); yt <= Y_MAX; yt++){
    if (yt === 0) continue;
    if (0 < X_MIN || 0 > X_MAX) continue;
    svgKaTeXLabel(gTicks, toSx(0) - 12, toSy(yt), String(yt), COL.grey);
  }
}

function drawPoly(g, pts, fillCol, strokeCol, strokeW, opacity){
  var d = "M " + toSx(pts[0].x) + " " + toSy(pts[0].y);
  for (var i = 1; i < pts.length; i++) d += " L " + toSx(pts[i].x) + " " + toSy(pts[i].y);
  d += " Z";
  var path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d", d);
  path.setAttribute("fill", fillCol);
  path.setAttribute("stroke", strokeCol);
  path.setAttribute("stroke-width", strokeW || 2);
  path.setAttribute("stroke-linejoin","round");
  if (opacity != null) path.setAttribute("opacity", opacity);
  g.appendChild(path);
}

function drawVertexDot(g, pt, color, label, primeFlag, opacity){
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
  c.setAttribute("r", 3.5); c.setAttribute("fill", color);
  if (opacity != null) c.setAttribute("opacity", opacity);
  g.appendChild(c);
  var lblX = toSx(pt.x) + (primeFlag ? 12 : -12);
  var lblY = toSy(pt.y) - 10;
  svgKaTeXLabel(g, lblX, lblY, label, color, primeFlag ? "left" : "right");
}

function drawHighlightRing(g, pt, color){
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
  c.setAttribute("r", 10); c.setAttribute("fill", "none");
  c.setAttribute("stroke", color); c.setAttribute("stroke-width", 2);
  c.setAttribute("class", "glow");
  c.style.color = color;
  g.appendChild(c);
}

function drawArrow(g, fromPt, toPt, color, width, withHead, dashed){
  var x1 = toSx(fromPt.x), y1 = toSy(fromPt.y);
  var x2 = toSx(toPt.x),   y2 = toSy(toPt.y);
  var dx = x2 - x1, dy = y2 - y1;
  var L = Math.sqrt(dx*dx + dy*dy);
  if (L < 4) return;
  var ux = dx / L, uy = dy / L;
  var head = withHead ? 10 : 0;
  var bx = x2 - ux * head, by = y2 - uy * head;
  var ln = document.createElementNS("http://www.w3.org/2000/svg","line");
  ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
  ln.setAttribute("x2", bx); ln.setAttribute("y2", by);
  ln.setAttribute("stroke", color); ln.setAttribute("stroke-width", width);
  if (dashed) ln.setAttribute("stroke-dasharray", "5 4");
  ln.setAttribute("stroke-linecap", "round");
  g.appendChild(ln);
  if (withHead){
    var w = 5.5;
    var tri = document.createElementNS("http://www.w3.org/2000/svg","path");
    tri.setAttribute("d", "M " + x2 + " " + y2 +
      " L " + (x2 - ux*head + uy*w) + " " + (y2 - uy*head - ux*w) +
      " L " + (x2 - ux*head - uy*w) + " " + (y2 - uy*head + ux*w) + " Z");
    tri.setAttribute("fill", color);
    g.appendChild(tri);
  }
}

// ----- scene drawing per step -----
function drawScene(){
  var gObj = document.getElementById("g-object");
  var gImg = document.getElementById("g-image");
  var gHi  = document.getElementById("g-highlights");
  var gSh  = document.getElementById("g-shifts");
  clear(gObj); clear(gImg); clear(gHi); clear(gSh);

  var s = PRESET.steps[STEP];
  var hi = s.highlight;
  var fadeOther = (typeof hi === "number");

  // Optional mirror line for reflection presets
  if ((hi === "showMirror" || hi === "all") && PRESET.mirror){
    var dx = PRESET.mirror.p2.x - PRESET.mirror.p1.x;
    var dy = PRESET.mirror.p2.y - PRESET.mirror.p1.y;
    var len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0.001){
      var ux = dx / len, uy = dy / len, ext = 16;
      var ma = { x: PRESET.mirror.p1.x - ext * ux, y: PRESET.mirror.p1.y - ext * uy };
      var mb = { x: PRESET.mirror.p1.x + ext * ux, y: PRESET.mirror.p1.y + ext * uy };
      var line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1", toSx(ma.x)); line.setAttribute("y1", toSy(ma.y));
      line.setAttribute("x2", toSx(mb.x)); line.setAttribute("y2", toSy(mb.y));
      line.setAttribute("stroke", COL.yellow); line.setAttribute("stroke-width", 1.8);
      line.setAttribute("stroke-dasharray", "6 5");
      gHi.appendChild(line);
      // midpoint dots on the mirror
      PRESET.obj.forEach(function(p, i){
        var q = PRESET.img[i];
        var mid = { x: (p.x + q.x)/2, y: (p.y + q.y)/2 };
        var mp = document.createElementNS("http://www.w3.org/2000/svg","circle");
        mp.setAttribute("cx", toSx(mid.x)); mp.setAttribute("cy", toSy(mid.y));
        mp.setAttribute("r", 3); mp.setAttribute("fill", COL.yellow);
        mp.setAttribute("class", "glow"); mp.style.color = COL.yellow;
        gHi.appendChild(mp);
      });
    }
  }

  // Draw shapes — fade non-highlighted vertices when one is focused
  drawPoly(gObj, PRESET.obj, "rgba(0,171,250,0.10)", COL.blue, 2, fadeOther ? 0.5 : 1);
  drawPoly(gImg, PRESET.img, "rgba(255,70,112,0.10)", COL.pink, 2, fadeOther ? 0.5 : 1);

  PRESET.obj.forEach(function(p, i){
    var op = (fadeOther && i !== hi) ? 0.22 : 1;
    drawVertexDot(gObj, p, COL.blue, PRESET.labels[i], false, op);
  });
  PRESET.img.forEach(function(p, i){
    var op = (fadeOther && i !== hi) ? 0.22 : 1;
    drawVertexDot(gImg, p, COL.pink, PRESET.labels[i] + "'", true, op);
  });

  // Highlight rings + shift arrow for active pair
  if (typeof hi === "number"){
    drawHighlightRing(gHi, PRESET.obj[hi], COL.yellow);
    drawHighlightRing(gHi, PRESET.img[hi], COL.yellow);
    drawArrow(gSh, PRESET.obj[hi], PRESET.img[hi], COL.yellow, 2, true, false);
  } else if (hi === "all"){
    PRESET.img.forEach(function(p){
      drawHighlightRing(gHi, p, COL.green);
    });
    PRESET.obj.forEach(function(p, i){
      drawArrow(gSh, p, PRESET.img[i], COL.green, 1.6, true, true);
    });
  }

  // Optional explicit shift arrows for "showShifts" array
  if (Array.isArray(s.showShifts)){
    s.showShifts.forEach(function(i){
      drawArrow(gSh, PRESET.obj[i], PRESET.img[i], COL.yellow, 1.6, true, true);
    });
  }
}

// ----- panel text -----
function renderPanel(){
  var panel = document.getElementById("panel");
  panel.innerHTML = "";
  var s = PRESET.steps[STEP];
  var tag = document.createElement("div");
  tag.className = "eq-row tag";
  tag.textContent = s.tag;
  tag.style.animationDelay = "0ms";
  tag.classList.add("fade-in");
  panel.appendChild(tag);

  var delay = 80;
  if (s.lines){
    s.lines.forEach(function(line, i){
      var row = document.createElement("div");
      row.className = "eq-row fade-in";
      row.style.animationDelay = (delay + i * 60) + "ms";
      panel.appendChild(row);
      renderMixed(row, line);
    });
  }
  if (s.ans){
    var ansRow = document.createElement("div");
    ansRow.className = "eq-row ans fade-in";
    ansRow.style.animationDelay = (delay + (s.lines ? s.lines.length : 0) * 60) + "ms";
    ansRow.style.color = COL.green;
    panel.appendChild(ansRow);
    tryRender(ansRow, s.ans);
  }
  if (s.marks){
    var marks = document.createElement("div");
    marks.className = "eq-row tag fade-in";
    marks.style.color = COL.grey;
    marks.style.marginTop = "4px";
    marks.style.animationDelay = (delay + ((s.lines ? s.lines.length : 0) + (s.ans ? 1 : 0)) * 60) + "ms";
    marks.textContent = s.marks;
    panel.appendChild(marks);
  }
}

// ----- nav -----
function gotoStep(n){
  STEP = Math.max(0, Math.min(PRESET.steps.length - 1, n));
  document.getElementById("cur").textContent = String(STEP + 1);
  document.getElementById("prev").disabled = (STEP === 0);
  document.getElementById("next").disabled = (STEP === PRESET.steps.length - 1);
  drawScene();
  renderPanel();
  notifyHeight();
}

document.getElementById("prev").addEventListener("click", function(){ gotoStep(STEP - 1); });
document.getElementById("next").addEventListener("click", function(){ gotoStep(STEP + 1); });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft") gotoStep(STEP - 1);
  else if (e.key === "ArrowRight") gotoStep(STEP + 1);
});

// ----- height post-message -----
function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

// ----- init -----
configureRange();
document.getElementById("title").textContent = PRESET.title;
document.getElementById("tot").textContent = String(PRESET.steps.length);
drawGridAxes();
gotoStep(0);
setTimeout(notifyHeight, 200);
</script>
