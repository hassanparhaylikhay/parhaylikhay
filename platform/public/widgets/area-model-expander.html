<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Area Model Expander</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:16px 18px 18px; }
  .wrap {
    max-width:520px; margin:0 auto;
    border:1px solid #141e2a; border-radius:10px;
    background:#0b1118;
    padding:14px 16px 16px;
  }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; gap:10px; min-height:22px; }
  .formula { font-size:14px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .controls { display:grid; grid-template-columns:repeat(2,1fr); gap:10px 18px; margin-bottom:14px; padding:0 4px; }
  .slider-row { display:flex; align-items:center; gap:8px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .slider-row .name { color:#fff067; font-weight:600; min-width:14px; }
  .slider-row input[type=range] {
    flex:1; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .slider-row input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .slider-row .val { min-width:18px; text-align:right; color:#f0eeea; font-weight:600; }
  .slider-row.b .name, .slider-row.b input::-webkit-slider-thumb { color:#fff067; background:#fff067; }
  .slider-row.c .name, .slider-row.c input::-webkit-slider-thumb { color:#0fee89; background:#0fee89; }
  .slider-row.d .name, .slider-row.d input::-webkit-slider-thumb { color:#0fee89; background:#0fee89; }
  .slider-row.b .name { color:#fff067; }
  .slider-row.b input::-webkit-slider-thumb { background:#fff067; }
  .slider-row.c .name { color:#0fee89; }
  .slider-row.c input::-webkit-slider-thumb { background:#0fee89; }
  .slider-row.c input::-moz-range-thumb { background:#0fee89; }
  .slider-row.d .name { color:#0fee89; }
  .slider-row.d input::-webkit-slider-thumb { background:#0fee89; }
  .slider-row.d input::-moz-range-thumb { background:#0fee89; }

  svg { display:block; width:100%; height:auto; user-select:none; }

  .expansion {
    margin-top:10px; padding:10px 12px;
    background:#07090d; border:1px solid #141e2a; border-radius:6px;
    font-family:'Geist Mono',monospace; font-size:13px; color:#f0eeea;
    text-align:center; min-height:30px;
  }
  .expansion .katex { font-size:1em; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <div class="slider-row a"><span class="name">a</span><input type="range" id="sa" min="1" max="6" value="3" step="1"/><span class="val" id="va">3</span></div>
    <div class="slider-row b"><span class="name">b</span><input type="range" id="sb" min="1" max="6" value="2" step="1"/><span class="val" id="vb">2</span></div>
    <div class="slider-row c"><span class="name">c</span><input type="range" id="sc" min="1" max="6" value="2" step="1"/><span class="val" id="vc">2</span></div>
    <div class="slider-row d"><span class="name">d</span><input type="range" id="sd" min="1" max="6" value="3" step="1"/><span class="val" id="vd">3</span></div>
  </div>

  <svg viewBox="0 0 360 240" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <!-- background grid -->
    <g id="grid"></g>
    <!-- four sub-rectangles -->
    <rect id="rAC" x="40" y="40" fill="rgba(255,240,103,0.10)" stroke="#fff067" stroke-width="1.5"/>
    <rect id="rBC" x="40" y="40" fill="rgba(0,171,250,0.10)" stroke="#00abfa" stroke-width="1.5"/>
    <rect id="rAD" x="40" y="40" fill="rgba(15,238,137,0.10)" stroke="#0fee89" stroke-width="1.5"/>
    <rect id="rBD" x="40" y="40" fill="rgba(255,130,44,0.10)" stroke="#ff822c" stroke-width="1.5"/>
    <!-- area labels -->
    <text id="lAC" font-family="Geist Mono,monospace" font-size="14" fill="#fff067" font-weight="700" text-anchor="middle">ac</text>
    <text id="lBC" font-family="Geist Mono,monospace" font-size="14" fill="#00abfa" font-weight="700" text-anchor="middle">bc</text>
    <text id="lAD" font-family="Geist Mono,monospace" font-size="14" fill="#0fee89" font-weight="700" text-anchor="middle">ad</text>
    <text id="lBD" font-family="Geist Mono,monospace" font-size="14" fill="#ff822c" font-weight="700" text-anchor="middle">bd</text>
    <!-- side labels -->
    <text id="lA" font-family="Geist Mono,monospace" font-size="12" fill="#7a7875" text-anchor="middle">a</text>
    <text id="lB" font-family="Geist Mono,monospace" font-size="12" fill="#7a7875" text-anchor="middle">b</text>
    <text id="lC" font-family="Geist Mono,monospace" font-size="12" fill="#7a7875" text-anchor="middle">c</text>
    <text id="lD" font-family="Geist Mono,monospace" font-size="12" fill="#7a7875" text-anchor="middle">d</text>
  </svg>

  <div class="expansion" id="expansion"></div>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

(function renderHeadFormula() {
  tryRender(document.getElementById("formula"), "(a + b)(c + d) = ac + ad + bc + bd");
})();

// SVG layout: viewBox 360x240. Plot region (40, 40) to (340, 200), so 300 x 160.
// We split horizontally by (a, b) and vertically by (c, d). Each unit fills proportionally.
var PX_LEFT = 40, PX_TOP = 40, PX_W = 300, PX_H = 160;

function update() {
  var a = parseInt(document.getElementById("sa").value, 10);
  var b = parseInt(document.getElementById("sb").value, 10);
  var c = parseInt(document.getElementById("sc").value, 10);
  var d = parseInt(document.getElementById("sd").value, 10);

  document.getElementById("va").textContent = a;
  document.getElementById("vb").textContent = b;
  document.getElementById("vc").textContent = c;
  document.getElementById("vd").textContent = d;

  // pixel widths
  var totalW = a + b;
  var totalH = c + d;
  var aW = (a / totalW) * PX_W;
  var bW = (b / totalW) * PX_W;
  var cH = (c / totalH) * PX_H;
  var dH = (d / totalH) * PX_H;

  // top-left: a × c (yellow/ac)
  // top-right: b × c (blue/bc)
  // bottom-left: a × d (green/ad)
  // bottom-right: b × d (orange/bd)
  var rAC = document.getElementById("rAC");
  var rBC = document.getElementById("rBC");
  var rAD = document.getElementById("rAD");
  var rBD = document.getElementById("rBD");

  rAC.setAttribute("x", PX_LEFT);          rAC.setAttribute("y", PX_TOP);          rAC.setAttribute("width", aW); rAC.setAttribute("height", cH);
  rBC.setAttribute("x", PX_LEFT + aW);     rBC.setAttribute("y", PX_TOP);          rBC.setAttribute("width", bW); rBC.setAttribute("height", cH);
  rAD.setAttribute("x", PX_LEFT);          rAD.setAttribute("y", PX_TOP + cH);     rAD.setAttribute("width", aW); rAD.setAttribute("height", dH);
  rBD.setAttribute("x", PX_LEFT + aW);     rBD.setAttribute("y", PX_TOP + cH);     rBD.setAttribute("width", bW); rBD.setAttribute("height", dH);

  // labels: centred in each rectangle
  function setText(id, x, y, content) {
    var el = document.getElementById(id);
    el.setAttribute("x", x);
    el.setAttribute("y", y);
    el.textContent = content;
  }
  setText("lAC", PX_LEFT + aW / 2,         PX_TOP + cH / 2 + 5, (a * c));
  setText("lBC", PX_LEFT + aW + bW / 2,    PX_TOP + cH / 2 + 5, (b * c));
  setText("lAD", PX_LEFT + aW / 2,         PX_TOP + cH + dH / 2 + 5, (a * d));
  setText("lBD", PX_LEFT + aW + bW / 2,    PX_TOP + cH + dH / 2 + 5, (b * d));

  // side labels (outside the rectangle area)
  setText("lA", PX_LEFT + aW / 2,         PX_TOP - 8, "a = " + a);
  setText("lB", PX_LEFT + aW + bW / 2,    PX_TOP - 8, "b = " + b);
  setText("lC", PX_LEFT - 14,             PX_TOP + cH / 2 + 4, "c=" + c);
  setText("lD", PX_LEFT - 14,             PX_TOP + cH + dH / 2 + 4, "d=" + d);

  // expansion text
  var ac = a * c, bc = b * c, ad = a * d, bd = b * d;
  var total = ac + ad + bc + bd;
  var tex = "(" + a + " + " + b + ")(" + c + " + " + d + ") = " +
            "\\textcolor{#fff067}{" + ac + "} + " +
            "\\textcolor{#0fee89}{" + ad + "} + " +
            "\\textcolor{#00abfa}{" + bc + "} + " +
            "\\textcolor{#ff822c}{" + bd + "} = " + total;
  tryRender(document.getElementById("expansion"), tex);
}

["sa","sb","sc","sd"].forEach(function(id) {
  document.getElementById(id).addEventListener("input", update);
});
update();

// auto-resize parent iframe
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
