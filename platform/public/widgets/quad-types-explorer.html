<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quadrilateral Types Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:24px; }
  .formula { font-size:18px; color:#f0eeea; letter-spacing:0.5px; }
  .formula .katex { font-size:1em; }
  canvas { display:block; width:100%; height:auto; touch-action:none; cursor:default; }
  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>
  <canvas id="cv" width="560" height="340"></canvas>
  <p class="footer">drag A, B, C, or D to morph between quadrilateral types</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var BG       = "#0b1118";
var BLUE     = "#00abfa";
var YELLOW   = "#fff067";
var ORANGE   = "#ff822c";
var GREEN    = "#0fee89";
var PINK     = "#ff4670";
var GREY     = "#7a7875";
var EDGE     = "#3a4a5a";
var SOFTLINE = "#141e2a";
var PANEL    = "#1a2330";

var W = 560, H = 340;
var MARGIN = 30;

var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");

(function hidpi() {
  var dpr = window.devicePixelRatio || 1;
  cv.width  = W * dpr;
  cv.height = H * dpr;
  cv.style.maxWidth = W + "px";
  cv.style.width = "100%";
  cv.style.height = "auto";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

// Vertex order: A, B, C, D (CCW or CW; we maintain whichever the user starts with).
var verts = [
  { name:"A", x:180, y:100, color:BLUE   },
  { name:"B", x:380, y:100, color:YELLOW },
  { name:"C", x:380, y:280, color:GREEN  },
  { name:"D", x:180, y:280, color:ORANGE }
];

var dragging = -1;
var hover    = -1;

function dist(p, q) { var dx=p.x-q.x, dy=p.y-q.y; return Math.sqrt(dx*dx+dy*dy); }

function nearVertex(mx, my) {
  for (var i=0;i<4;i++) {
    var v = verts[i];
    var dx = mx-v.x, dy = my-v.y;
    if (dx*dx+dy*dy <= 14*14) return i;
  }
  return -1;
}

function getMouse(e) {
  var rect = cv.getBoundingClientRect();
  var sx = W/rect.width, sy = H/rect.height;
  var t = e.touches ? e.touches[0] : e;
  return { x:(t.clientX-rect.left)*sx, y:(t.clientY-rect.top)*sy };
}

// Detect self-intersection: do segments AB-CD or BC-DA cross? Or do new neighbour edges cross?
function segCross(a,b,c,d) {
  function ccw(p,q,r){ return (q.x-p.x)*(r.y-p.y) - (q.y-p.y)*(r.x-p.x); }
  var d1 = ccw(c,d,a), d2 = ccw(c,d,b), d3 = ccw(a,b,c), d4 = ccw(a,b,d);
  if (((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  return false;
}
function selfIntersects(vs) {
  // edges in order: 0-1, 1-2, 2-3, 3-0
  var e = [[0,1],[1,2],[2,3],[3,0]];
  for (var i=0;i<4;i++) {
    for (var j=i+1;j<4;j++) {
      // skip adjacent edges (share a vertex)
      if (e[i][0]===e[j][0]||e[i][0]===e[j][1]||e[i][1]===e[j][0]||e[i][1]===e[j][1]) continue;
      if (segCross(vs[e[i][0]],vs[e[i][1]],vs[e[j][0]],vs[e[j][1]])) return true;
    }
  }
  return false;
}

cv.addEventListener("mousedown", function(e) {
  var m = getMouse(e);
  var i = nearVertex(m.x, m.y);
  if (i>=0) { dragging = i; e.preventDefault(); }
});
cv.addEventListener("mousemove", function(e) {
  var m = getMouse(e);
  if (dragging<0) {
    hover = nearVertex(m.x, m.y);
    cv.style.cursor = hover>=0 ? "grab" : "default";
    return;
  }
  cv.style.cursor = "grabbing";
  var nx = Math.max(MARGIN, Math.min(W-MARGIN, m.x));
  var ny = Math.max(MARGIN, Math.min(H-MARGIN, m.y));
  var prev = { x:verts[dragging].x, y:verts[dragging].y };
  verts[dragging].x = nx;
  verts[dragging].y = ny;
  if (selfIntersects(verts)) {
    verts[dragging].x = prev.x;
    verts[dragging].y = prev.y;
  }
  e.preventDefault();
});
window.addEventListener("mouseup", function() { dragging = -1; cv.style.cursor = hover>=0 ? "grab" : "default"; });

cv.addEventListener("touchstart", function(e) {
  var m = getMouse(e);
  var i = nearVertex(m.x, m.y);
  if (i>=0) { dragging = i; e.preventDefault(); }
}, { passive:false });
cv.addEventListener("touchmove", function(e) {
  if (dragging<0) return;
  var m = getMouse(e);
  var nx = Math.max(MARGIN, Math.min(W-MARGIN, m.x));
  var ny = Math.max(MARGIN, Math.min(H-MARGIN, m.y));
  var prev = { x:verts[dragging].x, y:verts[dragging].y };
  verts[dragging].x = nx;
  verts[dragging].y = ny;
  if (selfIntersects(verts)) {
    verts[dragging].x = prev.x;
    verts[dragging].y = prev.y;
  }
  e.preventDefault();
}, { passive:false });
cv.addEventListener("touchend", function() { dragging = -1; });

// classification
var EPS_LEN = 5;     // px tolerance for equal lengths
var EPS_PAR = 0.04;  // tolerance for parallelism (sin of angle between edges)
var EPS_DEG = 3;     // tolerance for 90-degree

function sideLengths() {
  return [
    dist(verts[0], verts[1]), // AB
    dist(verts[1], verts[2]), // BC
    dist(verts[2], verts[3]), // CD
    dist(verts[3], verts[0])  // DA
  ];
}
function vec(p,q){ return { x:q.x-p.x, y:q.y-p.y }; }
function cross2(u,v){ return u.x*v.y - u.y*v.x; }
function dot2(u,v){ return u.x*v.x + u.y*v.y; }
function len2(u){ return Math.sqrt(u.x*u.x+u.y*u.y); }

function parallel(u,v) {
  var c = Math.abs(cross2(u,v));
  return c / (len2(u)*len2(v) + 1e-9) < EPS_PAR;
}

function interiorAngles() {
  var out = [];
  for (var i=0;i<4;i++) {
    var prev = verts[(i+3)%4], cur = verts[i], next = verts[(i+1)%4];
    var u = vec(cur, prev), v = vec(cur, next);
    var c = dot2(u,v) / (len2(u)*len2(v) + 1e-9);
    c = Math.max(-1, Math.min(1, c));
    out.push(Math.acos(c) * 180/Math.PI);
  }
  return out;
}

function classify() {
  var s = sideLengths();
  var ang = interiorAngles();
  var AB = vec(verts[0], verts[1]);
  var DC = vec(verts[3], verts[2]);
  var BC = vec(verts[1], verts[2]);
  var AD = vec(verts[0], verts[3]);

  var allRight = ang.every(function(a){ return Math.abs(a-90) < EPS_DEG; });
  var allEqual = Math.abs(s[0]-s[1])<EPS_LEN && Math.abs(s[1]-s[2])<EPS_LEN && Math.abs(s[2]-s[3])<EPS_LEN;
  var oppEqual = Math.abs(s[0]-s[2])<EPS_LEN && Math.abs(s[1]-s[3])<EPS_LEN;
  var par1 = parallel(AB, DC);   // AB || DC
  var par2 = parallel(BC, AD);   // BC || AD
  // adjacent pairs equal (kite): AB=AD & CB=CD, OR AB=BC & DA=DC
  var kite1 = Math.abs(s[0]-s[3])<EPS_LEN && Math.abs(s[1]-s[2])<EPS_LEN; // AB=DA, BC=CD
  var kite2 = Math.abs(s[0]-s[1])<EPS_LEN && Math.abs(s[2]-s[3])<EPS_LEN; // AB=BC, CD=DA

  if (allRight && allEqual) return { name:"SQUARE", color:PINK };
  if (allRight && oppEqual) return { name:"RECTANGLE", color:ORANGE };
  if (allEqual && par1 && par2) return { name:"RHOMBUS", color:GREEN };
  if (par1 && par2) return { name:"PARALLELOGRAM", color:YELLOW };
  if ((kite1 || kite2) && !(par1 && par2)) return { name:"KITE", color:BLUE };
  if ((par1 && !par2) || (par2 && !par1)) return { name:"TRAPEZIUM", color:ORANGE };
  return { name:"GENERAL QUADRILATERAL", color:GREY };
}

// equal-length grouping: returns array of group indices for each side (0,1,2,...)
// group index -1 means "alone".
function equalGroups(s) {
  var groups = [-1,-1,-1,-1];
  var nextGroup = 0;
  for (var i=0;i<4;i++) {
    if (groups[i]>=0) continue;
    var gAssigned = false;
    for (var j=i+1;j<4;j++) {
      if (groups[j]>=0) continue;
      if (Math.abs(s[i]-s[j])<EPS_LEN) {
        if (!gAssigned) { groups[i]=nextGroup; gAssigned=true; }
        groups[j]=nextGroup;
      }
    }
    if (gAssigned) nextGroup++;
  }
  return groups;
}

// parallel pair detection on edges: returns indices grouped (0,1,2,...) per pair.
function parallelGroups() {
  var edges = [
    vec(verts[0], verts[1]),
    vec(verts[1], verts[2]),
    vec(verts[2], verts[3]),
    vec(verts[3], verts[0])
  ];
  // possible parallel opposite pairs: (0,2), (1,3)
  var groups = [-1,-1,-1,-1];
  var g = 0;
  // pair 0 & 2
  if (parallel(edges[0], edges[2])) { groups[0]=g; groups[2]=g; g++; }
  if (parallel(edges[1], edges[3])) { groups[1]=g; groups[3]=g; g++; }
  return groups;
}

function drawTickMarks(p1, p2, count, color) {
  var mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
  var dx = p2.x-p1.x, dy = p2.y-p1.y;
  var L = Math.sqrt(dx*dx+dy*dy)+1e-9;
  var ux = dx/L, uy = dy/L;       // along edge
  var nx = -uy, ny = ux;          // normal
  var spacing = 4;
  var TICK = 5;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  for (var k=0;k<count;k++) {
    var off = (k - (count-1)/2) * spacing;
    var cx = mx + ux*off, cy = my + uy*off;
    ctx.beginPath();
    ctx.moveTo(cx + nx*TICK, cy + ny*TICK);
    ctx.lineTo(cx - nx*TICK, cy - ny*TICK);
    ctx.stroke();
  }
}

function drawParallelArrows(p1, p2, count, color) {
  // little chevrons at the midpoint pointing along the edge
  var mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
  var dx = p2.x-p1.x, dy = p2.y-p1.y;
  var L = Math.sqrt(dx*dx+dy*dy)+1e-9;
  var ux = dx/L, uy = dy/L;
  var nx = -uy, ny = ux;
  var size = 5;
  var spacing = 5;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (var k=0;k<count;k++) {
    var off = (k - (count-1)/2) * spacing;
    var cx = mx + ux*off, cy = my + uy*off;
    ctx.beginPath();
    // chevron pointing in +u direction
    ctx.moveTo(cx - ux*size + nx*size, cy - uy*size + ny*size);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx - ux*size - nx*size, cy - uy*size - ny*size);
    ctx.stroke();
  }
}

function backedText(text, x, y, color, size) {
  ctx.font = (size||11) + "px 'Geist Mono', monospace";
  var m = ctx.measureText(text);
  var pad = 3;
  ctx.fillStyle = "rgba(11, 17, 24, 0.85)";
  ctx.fillRect(x - m.width/2 - pad, y - (size||11)/2 - pad + 1, m.width + pad*2, (size||11) + pad*2 - 2);
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function drawVertexLabel(v, idx) {
  // place label outward from centroid
  var cx = (verts[0].x+verts[1].x+verts[2].x+verts[3].x)/4;
  var cy = (verts[0].y+verts[1].y+verts[2].y+verts[3].y)/4;
  var dx = v.x - cx, dy = v.y - cy;
  var L = Math.sqrt(dx*dx+dy*dy)+1e-9;
  var off = 16;
  var lx = v.x + (dx/L)*off;
  var ly = v.y + (dy/L)*off;
  ctx.font = "600 13px 'Geist', sans-serif";
  ctx.fillStyle = "rgba(11, 17, 24, 0.7)";
  var m = ctx.measureText(v.name);
  ctx.fillRect(lx - m.width/2 - 3, ly - 7, m.width + 6, 14);
  ctx.fillStyle = v.color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(v.name, lx, ly);
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0,0,W,H);

  // faint outline edges
  ctx.strokeStyle = EDGE;
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  ctx.lineTo(verts[1].x, verts[1].y);
  ctx.lineTo(verts[2].x, verts[2].y);
  ctx.lineTo(verts[3].x, verts[3].y);
  ctx.closePath();
  ctx.stroke();

  // softer fill
  ctx.fillStyle = "rgba(0, 171, 250, 0.06)";
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  ctx.lineTo(verts[1].x, verts[1].y);
  ctx.lineTo(verts[2].x, verts[2].y);
  ctx.lineTo(verts[3].x, verts[3].y);
  ctx.closePath();
  ctx.fill();

  var s = sideLengths();
  var lenGroups = equalGroups(s);
  var parGroups = parallelGroups();
  var sidePairs = [[0,1],[1,2],[2,3],[3,0]];
  var sideNames = ["AB","BC","CD","DA"];

  // ticks for equal sides
  for (var i=0;i<4;i++) {
    if (lenGroups[i] >= 0) {
      drawTickMarks(verts[sidePairs[i][0]], verts[sidePairs[i][1]], lenGroups[i]+1, GREEN);
    }
  }

  // parallel chevrons
  for (var k=0;k<4;k++) {
    if (parGroups[k] >= 0) {
      drawParallelArrows(verts[sidePairs[k][0]], verts[sidePairs[k][1]], parGroups[k]+1, GREEN);
    }
  }

  // length labels at each side midpoint, slightly offset toward the centroid's opposite direction
  var cx = (verts[0].x+verts[1].x+verts[2].x+verts[3].x)/4;
  var cy = (verts[0].y+verts[1].y+verts[2].y+verts[3].y)/4;
  for (var m=0;m<4;m++) {
    var p1 = verts[sidePairs[m][0]], p2 = verts[sidePairs[m][1]];
    var mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
    var dx = mx - cx, dy = my - cy;
    var L = Math.sqrt(dx*dx+dy*dy)+1e-9;
    var lx = mx + (dx/L)*14;
    var ly = my + (dy/L)*14;
    var label = sideNames[m] + " = " + Math.round(s[m]) + "px";
    backedText(label, lx, ly, "#c8c6be", 10);
  }

  // vertices: glow on hover, then dot
  for (var v=0; v<4; v++) {
    var vt = verts[v];
    if (v===dragging || v===hover) {
      ctx.beginPath();
      ctx.fillStyle = vt.color + "33";
      ctx.arc(vt.x, vt.y, 14, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.fillStyle = vt.color;
    ctx.arc(vt.x, vt.y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = BG;
    ctx.stroke();
  }
  // labels last so they sit on top
  for (var v2=0; v2<4; v2++) drawVertexLabel(verts[v2], v2);

  // heading
  var c = classify();
  tryRender(document.getElementById("formula"),
    "\\textcolor{" + c.color + "}{\\text{" + c.name + "}}");
}

function tick() {
  draw();
  requestAnimationFrame(tick);
}
tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
