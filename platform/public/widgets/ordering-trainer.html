<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ordering Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#07090d; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:22px 18px 26px; }
  .wrap { max-width:600px; margin:0 auto; }

  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .label { font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#fff067; }
  .step-pill { font-family:'Geist Mono',monospace; font-size:10.5px; color:#7a7875; letter-spacing:1.5px; text-transform:uppercase; }
  .step-pill b { color:#f0eeea; }

  .card { background:#0b1118; border:1px solid #141e2a; border-radius:12px; padding:22px 22px 20px; }

  .prompt { font-size:13.5px; color:#c8c6be; margin-bottom:6px; }
  .prompt b { color:#0fee89; font-weight:600; }
  .direction { font-family:'Geist Mono',monospace; font-size:10.5px; letter-spacing:1.8px; text-transform:uppercase; color:#7a7875; margin-bottom:14px; }
  .direction .small { color:#00abfa; font-weight:700; }
  .direction .big { color:#fff067; font-weight:700; }

  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0 4px; }
  @media (min-width:520px) { .tiles { grid-template-columns:repeat(4,1fr); } }
  .tile {
    appearance:none; cursor:pointer; font-family:inherit; font-size:18px; font-weight:600;
    background:#07090d; border:1px solid #141e2a; border-radius:8px;
    padding:18px 10px; color:#f0eeea;
    transition:border-color .12s, background .12s, color .12s, transform .08s;
    position:relative;
  }
  .tile:hover:not(:disabled) { border-color:#2a3a4a; background:#0b1118; }
  .tile:disabled { cursor:default; }
  .tile.picked { background:rgba(15,238,137,0.10); border-color:rgba(15,238,137,0.45); color:#0fee89; }
  .tile.wrong { background:rgba(255,70,112,0.12); border-color:rgba(255,70,112,0.55); color:#ff4670; }
  .tile-rank {
    position:absolute; top:6px; left:8px;
    font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:1.2px;
    color:#0fee89; font-weight:700;
  }
  .tile.wrong .tile-rank { color:#ff4670; }

  .picked-row {
    margin-top:14px; padding:12px 14px;
    background:#07090d; border:1px solid #141e2a; border-radius:8px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
    min-height:48px;
  }
  .picked-row .picked-item {
    background:rgba(0,171,250,0.10); border:1px solid rgba(0,171,250,0.32);
    border-radius:5px; padding:5px 10px; color:#00abfa; font-weight:600;
    font-size:14px;
  }
  .picked-row .picked-arrow { color:#3a4a5a; }

  .status { min-height:18px; font-size:12.5px; margin:10px 0 4px; font-family:'Geist Mono',monospace; color:#7a7875; }
  .status.ok { color:#0fee89; }
  .status.bad { color:#ff4670; }

  .controls { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .progress { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; }
  .progress b { color:#f0eeea; }
  .btns { margin-left:auto; display:flex; gap:8px; }
  .btn { appearance:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:5px; border:1px solid transparent; }
  .btn.primary { background:#00abfa; color:#07090d; }
  .btn.primary:hover { opacity:.88; }
  .btn.ghost { background:transparent; color:#7a7875; border-color:#141e2a; }
  .btn.ghost:hover { color:#f0eeea; border-color:#2a3a4a; }

  .reveal { margin-top:14px; padding-top:14px; border-top:1px solid #141e2a; }
  .reveal-line { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.5px; margin-bottom:8px; }
  .reveal.ok .reveal-line { color:#0fee89; }
  .reveal.bad .reveal-line { color:#ff4670; }
  .reveal-explain { font-size:13px; color:#c8c6be; line-height:1.55; }

  .done-card { text-align:center; padding:22px 18px; }
  .done-card .big { font-size:32px; font-weight:700; color:#f0eeea; letter-spacing:-0.5px; }
  .done-card .big .total { font-size:20px; color:#3a4a5a; font-weight:500; }
  .done-card .sub { font-size:13px; color:#7a7875; margin-top:6px; }
  .done-card .msg { font-size:13px; color:#0fee89; margin-top:10px; font-weight:500; }
  .done-card .kicker { display:inline-block; font-family:'Geist Mono',monospace; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:#0fee89; margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="label">ORDERING TRAINER · 6 ROUNDS</span>
    <span class="step-pill"><b id="step-num">1</b>/<span id="step-total">6</span></span>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
"use strict";

// Each round: { direction: "asc"|"desc", items: [{tex, value}, ...] }
// `value` is the numeric value used to determine the correct order.
var ROUNDS = [
  { direction: "asc", items: [
    { tex: "-7", value: -7 },
    { tex: "3", value: 3 },
    { tex: "0", value: 0 },
    { tex: "-2", value: -2 },
  ]},
  { direction: "asc", items: [
    { tex: "\\tfrac{3}{4}", value: 0.75 },
    { tex: "0.7", value: 0.7 },
    { tex: "78\\%", value: 0.78 },
    { tex: "\\tfrac{4}{5}", value: 0.8 },
  ]},
  { direction: "desc", items: [
    { tex: "\\tfrac{2}{5}", value: 0.4 },
    { tex: "0.5", value: 0.5 },
    { tex: "30\\%", value: 0.30 },
    { tex: "\\tfrac{1}{3}", value: 1/3 },
  ]},
  { direction: "asc", items: [
    { tex: "-1.5", value: -1.5 },
    { tex: "-1", value: -1 },
    { tex: "-1.2", value: -1.2 },
    { tex: "-0.8", value: -0.8 },
  ]},
  { direction: "asc", items: [
    { tex: "6.5", value: 6.5 },
    { tex: "\\tfrac{20}{3}", value: 20/3 },
    { tex: "7", value: 7 },
    { tex: "\\sqrt{50}", value: Math.sqrt(50) },
  ]},
  { direction: "desc", items: [
    { tex: "\\sqrt{40}", value: Math.sqrt(40) },
    { tex: "6", value: 6 },
    { tex: "\\tfrac{19}{3}", value: 19/3 },
    { tex: "\\pi + 3", value: Math.PI + 3 },
  ]},
];

function shuffleIndices(n) {
  var idx = [];
  for (var i = 0; i < n; i++) idx.push(i);
  for (var j = idx.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
  }
  return idx;
}

function correctOrder(round) {
  // Returns array of indices into round.items in the correct direction.
  var indexed = round.items.map(function(it, i) { return { i: i, v: it.value }; });
  indexed.sort(function(a, b) { return round.direction === "asc" ? a.v - b.v : b.v - a.v; });
  return indexed.map(function(x) { return x.i; });
}

var state = { idx: 0, score: 0, locked: false, picked: [], shuffled: [] };

var cardEl = document.getElementById("card");
var stepNumEl = document.getElementById("step-num");
var stepTotalEl = document.getElementById("step-total");
stepTotalEl.textContent = ROUNDS.length;

function renderRound() {
  if (state.idx >= ROUNDS.length) { renderDone(); return; }
  var round = ROUNDS[state.idx];
  stepNumEl.textContent = state.idx + 1;
  state.locked = false;
  state.picked = [];
  state.shuffled = shuffleIndices(round.items.length);

  var dirHtml = round.direction === "asc"
    ? '<span class="small">SMALLEST</span> → <span class="big">LARGEST</span>'
    : '<span class="big">LARGEST</span> → <span class="small">SMALLEST</span>';

  var tilesHtml = state.shuffled.map(function(origIdx) {
    return '<button class="tile" data-orig="' + origIdx + '"><span class="tile-rank" id="rank-' + origIdx + '"></span><span id="tex-' + origIdx + '"></span></button>';
  }).join("");

  cardEl.innerHTML =
    '<p class="prompt">Click each value in order, <b>' + (round.direction === "asc" ? "smallest first" : "largest first") + '</b>.</p>' +
    '<p class="direction">' + dirHtml + '</p>' +
    '<div class="tiles">' + tilesHtml + '</div>' +
    '<div class="picked-row" id="picked-row"><span class="picked-arrow">' + (round.direction === "asc" ? "↑ smallest first" : "↓ largest first") + '</span></div>' +
    '<p class="status" id="status">&nbsp;</p>' +
    '<div class="controls">' +
      '<span class="progress">Picked: <b id="picked-count">0</b> / <b>' + round.items.length + '</b></span>' +
      '<div class="btns"><button class="btn ghost" id="reset">Reset round</button></div>' +
    '</div>' +
    '<div id="reveal-slot"></div>';

  // Render KaTeX for each tile
  state.shuffled.forEach(function(origIdx) {
    var el = document.getElementById("tex-" + origIdx);
    var tex = round.items[origIdx].tex;
    function tryRender() {
      if (typeof katex !== "undefined") {
        try { katex.render(tex, el, { throwOnError: false }); } catch (e) { el.textContent = tex; }
      } else { setTimeout(tryRender, 50); }
    }
    tryRender();
  });

  // Wire tile clicks
  cardEl.querySelectorAll(".tile").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (state.locked || btn.disabled) return;
      var orig = parseInt(btn.getAttribute("data-orig"), 10);
      handlePick(orig, btn);
    });
  });

  document.getElementById("reset").addEventListener("click", resetRound);

  reportHeight();
}

function handlePick(orig, btn) {
  var round = ROUNDS[state.idx];
  var correctIdx = correctOrder(round);
  var nextExpected = correctIdx[state.picked.length];

  if (orig === nextExpected) {
    state.picked.push(orig);
    btn.disabled = true;
    btn.classList.add("picked");
    var rankEl = document.getElementById("rank-" + orig);
    if (rankEl) rankEl.textContent = "#" + state.picked.length;
    appendToPickedRow(round.items[orig].tex);
    document.getElementById("picked-count").textContent = state.picked.length;

    if (state.picked.length === round.items.length) {
      // Round complete
      state.locked = true;
      state.score++;
      revealRound(true);
    }
  } else {
    btn.classList.add("wrong");
    setStatus("Not next. Smaller before larger" + (round.direction === "desc" ? " — but we're going LARGEST first." : "."), "bad");
    setTimeout(function() { btn.classList.remove("wrong"); }, 600);
  }
}

function appendToPickedRow(tex) {
  var row = document.getElementById("picked-row");
  // Replace the placeholder arrow on first pick
  if (state.picked.length === 1) row.innerHTML = "";
  if (state.picked.length > 1) {
    var sep = document.createElement("span");
    sep.className = "picked-arrow";
    sep.textContent = "<";
    if (ROUNDS[state.idx].direction === "desc") sep.textContent = ">";
    row.appendChild(sep);
  }
  var item = document.createElement("span");
  item.className = "picked-item";
  if (typeof katex !== "undefined") {
    try { katex.render(tex, item, { throwOnError: false }); } catch (e) { item.textContent = tex; }
  } else item.textContent = tex;
  row.appendChild(item);
}

function setStatus(msg, cls) {
  var el = document.getElementById("status");
  if (!el) return;
  el.className = "status" + (cls ? " " + cls : "");
  el.textContent = msg || " ";
}

function resetRound() {
  if (state.locked) return;
  renderRound();
}

function revealRound(allCorrect) {
  var btn = document.createElement("button");
  btn.className = "btn primary";
  btn.id = "next";
  btn.textContent = state.idx < ROUNDS.length - 1 ? "Next round →" : "See result";

  var slot = document.getElementById("reveal-slot");
  slot.innerHTML =
    '<div class="reveal ok">' +
      '<p class="reveal-line">✓ ROUND COMPLETE</p>' +
      '<div class="controls" style="justify-content:flex-end"></div>' +
    '</div>';
  slot.querySelector(".controls").appendChild(btn);
  btn.addEventListener("click", function() {
    state.idx++;
    renderRound();
  });
  setStatus("Order locked in.", "ok");
  reportHeight();
}

function renderDone() {
  var pct = Math.round((state.score / ROUNDS.length) * 100);
  var msg = pct === 100 ? "Perfect — every list ordered without a stumble." :
            pct >= 80 ? "Strong. Negatives and mixed forms are landing." :
            pct >= 50 ? "Decent. Re-run the rounds you struggled on." :
            "Keep working. The number-line check is the safety net for negatives.";
  cardEl.innerHTML =
    '<div class="done-card">' +
      '<span class="kicker">SCORE</span>' +
      '<p class="big">' + state.score + '<span class="total"> / ' + ROUNDS.length + '</span></p>' +
      '<p class="sub">' + pct + '%</p>' +
      '<p class="msg">' + msg + '</p>' +
      '<div class="controls" style="justify-content:center;margin-top:14px"><button class="btn primary" id="retry">Retry</button></div>' +
    '</div>';
  document.getElementById("retry").addEventListener("click", function() {
    state = { idx: 0, score: 0, locked: false, picked: [], shuffled: [] };
    renderRound();
  });
  stepNumEl.textContent = ROUNDS.length;
  reportHeight();
}

renderRound();

// Auto-resize via postMessage
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.querySelector(".wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
