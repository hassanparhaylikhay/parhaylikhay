<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cubic Plotter</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:24px; }
  .formula { font-size:16px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .controls { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px 14px; margin-bottom:12px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; }
  .row .name { color:#fff067; font-weight:600; min-width:32px; }
  .row input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:36px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#7a7875; }
  .curve { stroke:#fff067; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .pt { fill:#0fee89; }

  .table-readout {
    margin-top:10px; padding:8px 10px;
    background:#07090d; border:1px solid #141e2a; border-radius:6px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#f0eeea;
    overflow-x:auto;
  }
  .table-readout table { width:100%; border-collapse:collapse; min-width:420px; }
  .table-readout th, .table-readout td { padding:5px 8px; text-align:center; }
  .table-readout th { color:#7a7875; font-weight:500; border-bottom:1px solid #1a2330; }
  .table-readout td { color:#f0eeea; }
  .table-readout .lbl { color:#fff067; }
  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">b</span>
      <input type="range" id="b" min="-5" max="5" value="-3" step="0.5"/>
      <span class="val" id="vb">-3</span>
    </div>
    <div class="row">
      <span class="name">c</span>
      <input type="range" id="c" min="-5" max="5" value="2" step="1"/>
      <span class="val" id="vc">2</span>
    </div>
  </div>

  <svg viewBox="0 0 480 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="plot-clip">
        <rect x="60" y="14" width="400" height="252"/>
      </clipPath>
    </defs>
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <text class="axis-title" x="260" y="290" text-anchor="middle">x</text>
    <text class="axis-title" x="48" y="20" text-anchor="middle">y</text>

    <g clip-path="url(#plot-clip)">
      <path class="curve" id="curvePath"/>
      <g id="ptsGroup"></g>
    </g>
  </svg>

  <div class="table-readout">
    <table>
      <thead><tr id="hdrX"></tr></thead>
      <tbody><tr id="rowY"></tr></tbody>
    </table>
  </div>
  <p class="footer">y = x³ + bx + c · table updates live</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var XMIN = -3, XMAX = 3;
var YMIN = -20, YMAX = 20;
var PX_LEFT = 60, PX_RIGHT = 460;
var PX_TOP  = 14, PX_BOT   = 266;

function xPx(x) { return PX_LEFT + ((x - XMIN) / (XMAX - XMIN)) * (PX_RIGHT - PX_LEFT); }
function yPx(y) { return PX_BOT  - ((y - YMIN) / (YMAX - YMIN)) * (PX_BOT  - PX_TOP);  }

(function buildAxes() {
  var g = document.getElementById("grid");
  var t = document.getElementById("ticks");
  document.getElementById("xAxis").setAttribute("x1", PX_LEFT);
  document.getElementById("xAxis").setAttribute("x2", PX_RIGHT);
  document.getElementById("xAxis").setAttribute("y1", yPx(0));
  document.getElementById("xAxis").setAttribute("y2", yPx(0));
  document.getElementById("yAxis").setAttribute("x1", xPx(0));
  document.getElementById("yAxis").setAttribute("x2", xPx(0));
  document.getElementById("yAxis").setAttribute("y1", PX_TOP);
  document.getElementById("yAxis").setAttribute("y2", PX_BOT);
  for (var x = XMIN; x <= XMAX; x++) {
    var px = xPx(x);
    if (x !== 0) {
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "grid-line");
      line.setAttribute("x1", px); line.setAttribute("x2", px);
      line.setAttribute("y1", PX_TOP); line.setAttribute("y2", PX_BOT);
      g.appendChild(line);
    }
    var tl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tl.setAttribute("class", "axis-tick-label");
    tl.setAttribute("x", px); tl.setAttribute("y", yPx(0) + 14);
    tl.setAttribute("text-anchor", "middle");
    tl.textContent = x;
    t.appendChild(tl);
  }
  for (var y = YMIN; y <= YMAX; y += 5) {
    if (y === 0) continue;
    var py = yPx(y);
    if (y % 10 === 0) {
      var gl = document.createElementNS("http://www.w3.org/2000/svg", "line");
      gl.setAttribute("class", "grid-line");
      gl.setAttribute("x1", PX_LEFT); gl.setAttribute("x2", PX_RIGHT);
      gl.setAttribute("y1", py); gl.setAttribute("y2", py);
      g.appendChild(gl);
      var tly = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tly.setAttribute("class", "axis-tick-label");
      tly.setAttribute("x", xPx(0) - 6); tly.setAttribute("y", py + 3);
      tly.setAttribute("text-anchor", "end");
      tly.textContent = y;
      t.appendChild(tly);
    }
  }
})();

var pts = document.getElementById("ptsGroup");
var hdrX = document.getElementById("hdrX");
var rowY = document.getElementById("rowY");
var XS = [-3, -2, -1, 0, 1, 2, 3];

(function buildPts() {
  // headers
  var th = document.createElement("th"); th.className = "lbl"; th.textContent = "x"; hdrX.appendChild(th);
  for (var i = 0; i < XS.length; i++) {
    var thx = document.createElement("th"); thx.textContent = XS[i]; hdrX.appendChild(thx);
  }
  var tdLbl = document.createElement("td"); tdLbl.className = "lbl"; tdLbl.textContent = "y"; rowY.appendChild(tdLbl);
  for (var j = 0; j < XS.length; j++) {
    var td = document.createElement("td"); td.id = "y-" + j; td.textContent = "0"; rowY.appendChild(td);
    var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("class", "pt");
    c.setAttribute("r", 3);
    c.setAttribute("id", "pt-" + j);
    pts.appendChild(c);
  }
})();

var targetB = -3, displayB = -3;
var targetC = 2,  displayC = 2;
var SPRING = 0.20;

function fmtSign(v) {
  // Render +b·x as "+ 3x" or "- 3x"
  var n = Math.round(v * 10) / 10;
  if (n === 0) return "";
  var sign = n > 0 ? "+ " : "- ";
  var mag = Math.abs(n);
  var m = (mag === Math.floor(mag)) ? mag.toFixed(0) : mag.toFixed(1);
  return sign + m;
}
function fmtConst(v) {
  var n = Math.round(v * 10) / 10;
  if (n === 0) return "";
  var sign = n > 0 ? "+ " : "- ";
  var mag = Math.abs(n);
  var m = (mag === Math.floor(mag)) ? mag.toFixed(0) : mag.toFixed(1);
  return sign + m;
}
function fmtVal(v) {
  var n = Math.round(v * 10) / 10;
  return (n === Math.floor(n)) ? n.toFixed(0) : n.toFixed(1);
}

function tick() {
  displayB += (targetB - displayB) * SPRING;
  displayC += (targetC - displayC) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  // formula head
  var bTerm = (Math.round(displayB*10)/10 === 0) ? "" : (fmtSign(displayB) + "x");
  var cTerm = (Math.round(displayC*10)/10 === 0) ? "" : fmtConst(displayC);
  tryRender(document.getElementById("formula"), "y = x^3 \\;" + bTerm + "\\; " + cTerm);

  // curve path: sample 121 points
  var d = "";
  for (var i = 0; i <= 120; i++) {
    var x = XMIN + (XMAX - XMIN) * (i / 120);
    var y = x*x*x + displayB * x + displayC;
    var px = xPx(x);
    var py = yPx(y);
    d += (i === 0 ? "M " : " L ") + px + " " + py;
  }
  document.getElementById("curvePath").setAttribute("d", d);

  // points
  for (var k = 0; k < XS.length; k++) {
    var xk = XS[k];
    var yk = xk*xk*xk + targetB * xk + targetC;
    document.getElementById("pt-" + k).setAttribute("cx", xPx(xk));
    document.getElementById("pt-" + k).setAttribute("cy", yPx(yk));
    document.getElementById("y-" + k).textContent = fmtVal(yk);
  }
}

document.getElementById("b").addEventListener("input", function(e) {
  targetB = parseFloat(e.target.value);
  document.getElementById("vb").textContent = fmtVal(targetB);
});
document.getElementById("c").addEventListener("input", function(e) {
  targetC = parseFloat(e.target.value);
  document.getElementById("vc").textContent = fmtVal(targetC);
});
tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
