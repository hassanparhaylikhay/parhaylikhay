<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Comprehensive Circle Theorems Step Explorer (4.7)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; min-height:22px; gap:10px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .step-num { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }

  .layout {
    display:grid; grid-template-columns: 1fr; gap:18px; align-items:start;
  }
  @media (min-width: 560px) {
    .layout { grid-template-columns: 360px 1fr; gap:22px; }
  }

  .stage-outer { width:100%; max-width:360px; margin:0 auto; aspect-ratio: 360 / 340; position:relative; }
  .stage { position:absolute; top:0; left:0; width:360px; height:340px; transform-origin: top left; overflow:hidden; border-radius:6px; }
  .draw-line { transition: width 0.7s cubic-bezier(0.4, 0.1, 0.4, 1); }
  .draw-fade { opacity:0; transition: opacity 0.35s ease; transition-delay: 0.25s; }
  .draw-fade.drawn { opacity:1; }

  .equations { display:flex; flex-direction:column; gap:14px; padding:4px 2px; }
  .eq-group { display:flex; flex-direction:column; gap:4px;
    opacity:0; transition: opacity 0.4s ease; transition-delay: 0.2s; }
  .eq-group.drawn { opacity:1; }
  .eq-line { font-family:'Geist Mono', monospace; line-height:1.5; }
  .eq-line[data-kind="tag"]    { font-size:11px; color:#7a7875; letter-spacing:0.4px; }
  .eq-line[data-kind="main"]   { font-size:14px; color:#fff067; }
  .eq-line[data-kind="ans"]    { font-size:17px; color:#0fee89; font-weight:700; }
  .eq-line[data-kind="ans-r"]  { font-size:17px; color:#ff4670; font-weight:700; }
  .eq-line[data-kind="reason"] { font-size:11px; color:#7a7875; margin-top:2px; }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:18px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:80px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl:disabled { opacity:0.3; cursor:not-allowed; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">step 0: AC = diameter, ∠CAB = 28°, tangent at C</span>
    <span class="step-num" id="counter">0 / 4</span>
  </div>
  <div class="layout">
    <div class="stage-outer" id="stage-outer">
      <div class="stage" id="stage"></div>
    </div>
    <div class="equations" id="equations"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="prev">← prev</button>
    <button class="ctl" id="next">next →</button>
  </div>
  <p class="footer">semicircle · same segment · alternate segment theorem</p>
</div>

<script>
"use strict";

// Diagram-only stage 360 × 340. Circle O = (180, 170), r = 95.
var O = { x: 180, y: 170 };
var R_d = 95;
function ptOnCircle(deg) {
  var r = deg * Math.PI / 180;
  return { x: O.x + R_d * Math.cos(r), y: O.y + R_d * Math.sin(r) };
}
var A = ptOnCircle(180);
var C = ptOnCircle(0);
var B = ptOnCircle(56);
var D = ptOnCircle(250);
var T = { x: C.x, y: C.y + 130 };

var stage      = document.getElementById("stage");
var stageOuter = document.getElementById("stage-outer");
var STAGE_W    = 360, STAGE_H = 340;
function fitStage() {
  var w = stageOuter.clientWidth;
  if (!w) return;
  stage.style.transform = "scale(" + (w / STAGE_W) + ")";
}
fitStage();
window.addEventListener("resize", fitStage);
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(stageOuter);

function setStyle(el, s) { for (var k in s) el.style[k] = s[k]; }
function makeNode(tag, style, dataStep, cls) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  setStyle(n, style);
  if (dataStep != null) n.dataset.step = String(dataStep);
  stage.appendChild(n);
  return n;
}
function lineEl(x1, y1, x2, y2, color, thickness, dashed, dataStep) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx*dx + dy*dy);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  var t = thickness || 2;
  var s = {
    position: "absolute",
    left: x1 + "px", top: y1 + "px",
    width: "0px", height: t + "px",
    transformOrigin: "0 50%",
    transform: "translateY(" + (-t/2) + "px) rotate(" + ang + "deg)"
  };
  if (dashed) {
    s.background = "transparent";
    s.borderTop = t + "px dashed " + color;
    s.height = "0px";
  } else {
    s.background = color;
  }
  var node = makeNode("div", s, dataStep, "draw-line");
  node._fullWidth = len;
  return node;
}
function dotEl(x, y, color, size, dataStep) {
  var sz = size || 7;
  return makeNode("div", {
    position: "absolute",
    left: (x - sz/2) + "px", top: (y - sz/2) + "px",
    width: sz + "px", height: sz + "px",
    borderRadius: "50%", background: color
  }, dataStep, "draw-fade");
}
function labelEl(x, y, text, color, fontSize, dataStep, opts) {
  opts = opts || {};
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px", top: y + "px",
    fontFamily: opts.font || "'Geist Mono', monospace",
    fontSize: (fontSize || 11) + "px",
    color: color, fontWeight: opts.weight || "700",
    whiteSpace: "nowrap", pointerEvents: "none"
  }, dataStep, "draw-fade");
  n.textContent = text;
  return n;
}
function tryRenderInto(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else { setTimeout(function() { tryRenderInto(target, tex); }, 50); }
}
function texEl(x, y, tex, color, fontSize, dataStep) {
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px", top: y + "px",
    fontSize: (fontSize || 14) + "px",
    color: color, whiteSpace: "nowrap", pointerEvents: "none"
  }, dataStep, "draw-fade");
  tryRenderInto(n, tex);
  return n;
}
function wedgeEl(cx, cy, size, fromConicDeg, sweepDeg, color, dataStep) {
  var maskInner = (size / 2) - 4;
  var maskOuter = maskInner + 2;
  return makeNode("div", {
    position: "absolute",
    left: (cx - size/2) + "px", top: (cy - size/2) + "px",
    width: size + "px", height: size + "px",
    borderRadius: "50%",
    background: "conic-gradient(from " + fromConicDeg + "deg, " + color + " 0deg " + sweepDeg + "deg, transparent " + sweepDeg + "deg)",
    WebkitMask: "radial-gradient(circle, transparent " + (maskInner-1) + "px, #000 " + maskInner + "px, #000 " + maskOuter + "px, transparent " + (maskOuter+1) + "px)",
    mask: "radial-gradient(circle, transparent " + (maskInner-1) + "px, #000 " + maskInner + "px, #000 " + maskOuter + "px, transparent " + (maskOuter+1) + "px)",
    pointerEvents: "none"
  }, dataStep, "draw-fade");
}
function unitVec(from, to) {
  var dx = to.x - from.x, dy = to.y - from.y;
  var L = Math.hypot(dx, dy);
  return { x: dx / L, y: dy / L };
}
function rightAngleMark(vx, vy, dirA, dirB, size, color, dataStep) {
  size = size || 12;
  var p1x = vx + size*dirA.x, p1y = vy + size*dirA.y;
  var fx  = vx + size*(dirA.x + dirB.x), fy = vy + size*(dirA.y + dirB.y);
  var p2x = vx + size*dirB.x, p2y = vy + size*dirB.y;
  lineEl(p1x, p1y, fx, fy, color, 1.6, false, dataStep);
  lineEl(fx, fy, p2x, p2y, color, 1.6, false, dataStep);
}

// ===== Always visible — circle outline =================================
makeNode("div", {
  position: "absolute",
  left: (O.x - R_d) + "px", top: (O.y - R_d) + "px",
  width: (2*R_d) + "px", height: (2*R_d) + "px",
  borderRadius: "50%",
  border: "1.5px solid #1a2330",
  pointerEvents: "none"
});

// ===== Step 0 — initial diagram ========================================
lineEl(A.x, A.y, C.x, C.y, "#00abfa", 2.5, false, 0);  // diameter AC
lineEl(A.x, A.y, B.x, B.y, "#7a7875", 2, false, 0);    // chord AB
lineEl(B.x, B.y, C.x, C.y, "#7a7875", 2, false, 0);    // chord BC
lineEl(A.x, A.y, D.x, D.y, "#7a7875", 2, false, 0);    // chord AD
lineEl(B.x, B.y, D.x, D.y, "#7a7875", 2, false, 0);    // chord BD
lineEl(C.x, 40, C.x, T.y, "#ff822c", 2.5, false, 0);   // tangent at C

wedgeEl(A.x, A.y, 60, 90, 28, "#fff067", 0);
texEl(A.x + 32, A.y - 4, "28\\degree", "#fff067", 13, 0);

dotEl(O.x, O.y, "#3a4a5a", 5, 0);
labelEl(O.x - 14, O.y - 18, "O", "#7a7875", 12, 0);

dotEl(A.x, A.y, "#fff067", 8, 0);
labelEl(A.x - 18, A.y - 8, "A", "#fff067", 14, 0);
dotEl(B.x, B.y, "#fff067", 8, 0);
labelEl(B.x - 4, B.y + 10, "B", "#fff067", 14, 0);
dotEl(C.x, C.y, "#fff067", 8, 0);
labelEl(C.x + 10, C.y - 8, "C", "#fff067", 14, 0);
dotEl(D.x, D.y, "#fff067", 8, 0);
labelEl(D.x - 18, D.y - 8, "D", "#fff067", 14, 0);
dotEl(T.x, T.y, "#fff067", 7, 0);
labelEl(T.x + 8, T.y - 6, "T", "#fff067", 14, 0);

// ===== Step 1 — (a) ∠ABC = 90° (semicircle) ===========================
(function() {
  var BA_u = unitVec(B, A);
  var BC_u = unitVec(B, C);
  rightAngleMark(B.x, B.y, BA_u, BC_u, 13, "#ff4670", 1);
})();
texEl(B.x - 16, B.y - 30, "90\\degree", "#ff4670", 12, 1);

// ===== Step 2 — (b) ∠ACB = 62° (yellow, intermediate) =================
wedgeEl(C.x, C.y, 56, 208, 62, "#fff067", 2);
texEl(C.x - 38, C.y + 4, "62\\degree", "#fff067", 12, 2);

// ===== Step 3 — (b) ∠ADB = 62° (green, by same-segment) ===============
wedgeEl(D.x, D.y, 50, 153, 62, "#0fee89", 3);
texEl(D.x + 4, D.y + 12, "62\\degree", "#0fee89", 12, 3);

// ===== Step 4 — (c) ∠BCT = 28° (green, by alt segment) ================
wedgeEl(C.x, C.y, 88, 180, 28, "#0fee89", 4);
texEl(C.x - 30, C.y + 42, "28\\degree", "#0fee89", 12, 4);

// ===== Equations panel (HTML flow) ====================================
function buildEquations(parentEl, groups) {
  groups.forEach(function(g) {
    var groupEl = document.createElement("div");
    groupEl.className = "eq-group draw-fade";
    groupEl.dataset.step = String(g.step);
    g.lines.forEach(function(line) {
      var lineEl = document.createElement("div");
      lineEl.className = "eq-line";
      lineEl.dataset.kind = line.kind || "main";
      if (line.tex) {
        var span = document.createElement("span");
        lineEl.appendChild(span);
        tryRenderInto(span, line.tex);
      } else {
        lineEl.textContent = line.text;
      }
      groupEl.appendChild(lineEl);
    });
    parentEl.appendChild(groupEl);
  });
}

buildEquations(document.getElementById("equations"), [
  { step: 1, lines: [
    { kind: "tag",    text: "(a)" },
    { kind: "ans-r",  tex:  "\\angle ABC = 90\\degree" },
    { kind: "reason", text: "(angle in semicircle)" }
  ]},
  { step: 2, lines: [
    { kind: "tag",    text: "(b)" },
    { kind: "main",   tex:  "\\angle ACB = 180\\degree - 90\\degree - 28\\degree = 62\\degree" },
    { kind: "reason", text: "(triangle angle sum)" }
  ]},
  { step: 3, lines: [
    { kind: "ans",    tex:  "\\angle ADB = \\angle ACB = 62\\degree" },
    { kind: "reason", text: "(angles in same segment)" }
  ]},
  { step: 4, lines: [
    { kind: "tag",    text: "(c)" },
    { kind: "ans",    tex:  "\\angle BCT = 28\\degree" },
    { kind: "reason", text: "(alternate segment theorem)" }
  ]}
]);

// ===== Step controller =================================================
var STEPS = [
  "step 0: AC = diameter, ∠CAB = 28°, tangent at C",
  "step 1 (a): ∠ABC = 90° (angle in semicircle)",
  "step 2 (b): ∠ACB = 62° (triangle angle sum)",
  "step 3 (b): ∠ADB = 62° (angles in same segment)",
  "step 4 (c): ∠BCT = 28° (alternate segment theorem)"
];
var step = 0, maxStep = STEPS.length - 1;
var titleEl   = document.getElementById("title");
var counterEl = document.getElementById("counter");
var prevBtn   = document.getElementById("prev");
var nextBtn   = document.getElementById("next");
var wrap      = document.getElementById("wrap");

function setStep(n) {
  step = Math.max(0, Math.min(maxStep, n));
  titleEl.textContent = STEPS[step];
  counterEl.textContent = step + " / " + maxStep;
  var els = wrap.querySelectorAll("[data-step]");
  for (var i = 0; i < els.length; i++) {
    var s = parseInt(els[i].dataset.step, 10);
    var el = els[i];
    if (s <= step) {
      el.classList.add("drawn");
      if (el._fullWidth != null) el.style.width = el._fullWidth + "px";
    } else {
      el.classList.remove("drawn");
      if (el._fullWidth != null) el.style.width = "0px";
    }
  }
  prevBtn.disabled = (step === 0);
  nextBtn.disabled = (step === maxStep);
  reportHeight();
}
prevBtn.onclick = function() { setStep(step - 1); };
nextBtn.onclick = function() { setStep(step + 1); };
setStep(0);

// ===== Height reporter =================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(wrap);
</script>
</body>
</html>
