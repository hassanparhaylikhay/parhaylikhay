<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Distance-Time Grapher</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:22px; }
  .formula { font-size:16px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .controls { display:flex; align-items:center; gap:14px; margin-bottom:12px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:48px; }
  .row input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:50px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#7a7875; }
  .dt-line { stroke:#fff067; stroke-width:2.5; fill:none; stroke-linecap:round; }
  .gradient-marker { stroke:#0fee89; stroke-width:1.5; stroke-dasharray:4 3; fill:none; }
  .gradient-label { font-family:'Geist Mono',monospace; font-size:11px; fill:#0fee89; font-weight:700; }

  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">speed</span>
      <input type="range" id="speed" min="10" max="100" value="60" step="5"/>
      <span class="val" id="vspeed">60 km/h</span>
    </div>
  </div>

  <svg viewBox="0 0 480 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <defs>
      <clipPath id="plot-clip">
        <rect x="50" y="20" width="380" height="240"/>
      </clipPath>
    </defs>
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <text class="axis-title" x="240" y="290" text-anchor="middle">time (hours)</text>
    <text class="axis-title" x="20" y="140" text-anchor="middle" transform="rotate(-90 20 140)">distance (km)</text>

    <g clip-path="url(#plot-clip)">
      <line class="dt-line" id="dtLine"/>
      <!-- gradient illustration: rise/run dashed triangle -->
      <line class="gradient-marker" id="riseLine"/>
      <line class="gradient-marker" id="runLine"/>
    </g>
    <text class="gradient-label" id="gradLabel" x="0" y="0" text-anchor="middle">gradient = speed</text>
  </svg>

  <p class="footer">drag the speed slider · steeper line means faster speed</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// Coordinate model: time 0..5 hours, distance 0..500 km
// 380 px / 5h = 76 px/h, 240 px / 500km = 0.48 px/km — but the math units
// here are different anyway (time in hours, distance in km). Pixel-per-unit
// equality only matters when the axes share units. For graphs in practical
// situations, we use a "natural scale" where the axes have different units.
var XMIN = 0, XMAX = 5, YMIN = 0, YMAX = 500;
var PX_LEFT = 50, PX_RIGHT = 430;
var PX_TOP  = 20, PX_BOT   = 260;
function xPx(x) { return PX_LEFT + ((x - XMIN) / (XMAX - XMIN)) * (PX_RIGHT - PX_LEFT); }
function yPx(y) { return PX_BOT  - ((y - YMIN) / (YMAX - YMIN)) * (PX_BOT  - PX_TOP);  }

(function buildAxes() {
  var g = document.getElementById("grid");
  var t = document.getElementById("ticks");
  document.getElementById("xAxis").setAttribute("x1", PX_LEFT);
  document.getElementById("xAxis").setAttribute("x2", PX_RIGHT);
  document.getElementById("xAxis").setAttribute("y1", yPx(0));
  document.getElementById("xAxis").setAttribute("y2", yPx(0));
  document.getElementById("yAxis").setAttribute("x1", xPx(0));
  document.getElementById("yAxis").setAttribute("x2", xPx(0));
  document.getElementById("yAxis").setAttribute("y1", PX_TOP);
  document.getElementById("yAxis").setAttribute("y2", PX_BOT);
  for (var x = XMIN; x <= XMAX; x++) {
    var px = xPx(x);
    if (x !== 0) {
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "grid-line");
      line.setAttribute("x1", px); line.setAttribute("x2", px);
      line.setAttribute("y1", PX_TOP); line.setAttribute("y2", PX_BOT);
      g.appendChild(line);
    }
    var tl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tl.setAttribute("class", "axis-tick-label");
    tl.setAttribute("x", px); tl.setAttribute("y", yPx(0) + 14);
    tl.setAttribute("text-anchor", "middle");
    tl.textContent = x;
    t.appendChild(tl);
  }
  for (var y = 100; y <= YMAX; y += 100) {
    var py = yPx(y);
    var gl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    gl.setAttribute("class", "grid-line");
    gl.setAttribute("x1", PX_LEFT); gl.setAttribute("x2", PX_RIGHT);
    gl.setAttribute("y1", py); gl.setAttribute("y2", py);
    g.appendChild(gl);
    var tly = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tly.setAttribute("class", "axis-tick-label");
    tly.setAttribute("x", xPx(0) - 6); tly.setAttribute("y", py + 3);
    tly.setAttribute("text-anchor", "end");
    tly.textContent = y;
    t.appendChild(tly);
  }
})();

var targetSpeed = 60, displaySpeed = 60;
var SPRING = 0.20;

function tick() {
  displaySpeed += (targetSpeed - displaySpeed) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  // formula uses TARGET for instant readout
  tryRender(document.getElementById("formula"), "\\text{speed} = \\textcolor{#fff067}{" + targetSpeed + "}\\text{ km/h}");

  // Line from (0,0) with slope = speed; clip to plot
  var s = displaySpeed;
  var endX = XMAX;
  var endY = s * endX;
  if (endY > YMAX) {
    // line hits the top edge before x=5
    endX = YMAX / s;
    endY = YMAX;
  }
  var ln = document.getElementById("dtLine");
  ln.setAttribute("x1", xPx(0));
  ln.setAttribute("y1", yPx(0));
  ln.setAttribute("x2", xPx(endX));
  ln.setAttribute("y2", yPx(endY));

  // Gradient marker: a small dashed right triangle around (1, s) showing rise/run
  var gx1 = 1, gy1 = s;          // bottom-left of triangle on the line
  var gx2 = 2, gy2 = s;          // run: go right 1
  var gy3 = s * gx2;             // rise: go up to (2, 2s)
  // Skip gradient marker if outside plot
  if (gy3 > YMAX) {
    document.getElementById("riseLine").style.display = "none";
    document.getElementById("runLine").style.display = "none";
    document.getElementById("gradLabel").style.display = "none";
  } else {
    document.getElementById("riseLine").style.display = "";
    document.getElementById("runLine").style.display = "";
    document.getElementById("gradLabel").style.display = "";
    var run = document.getElementById("runLine");
    run.setAttribute("x1", xPx(1)); run.setAttribute("y1", yPx(s));
    run.setAttribute("x2", xPx(2)); run.setAttribute("y2", yPx(s));
    var rise = document.getElementById("riseLine");
    rise.setAttribute("x1", xPx(2)); rise.setAttribute("y1", yPx(s));
    rise.setAttribute("x2", xPx(2)); rise.setAttribute("y2", yPx(2 * s));
    var lbl = document.getElementById("gradLabel");
    lbl.setAttribute("x", xPx(2.4));
    lbl.setAttribute("y", yPx(1.5 * s) + 3);
    lbl.textContent = "+" + targetSpeed + " km";
  }
}

document.getElementById("speed").addEventListener("input", function(e) {
  targetSpeed = parseInt(e.target.value, 10);
  document.getElementById("vspeed").textContent = targetSpeed + " km/h";
});
tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
