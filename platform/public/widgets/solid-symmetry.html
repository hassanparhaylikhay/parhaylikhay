<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solid Symmetry — Interactive + Plane Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
  .title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; }
  .hint { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }
  .stage { width:100%; aspect-ratio: 1.5; position:relative; border-radius:6px; cursor:grab; user-select:none; background:transparent; }
  .stage.dragging { cursor:grabbing; }
  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .gallery-bar { display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:10px; }
  .gallery-title { font-family:'Geist Mono',monospace; font-size:10.5px; color:#7a7875; letter-spacing:0.4px; text-transform:uppercase; }
  .clear-btn { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; background:transparent; border:1px solid #141e2a; border-radius:4px; padding:4px 8px; cursor:pointer; transition:color 0.12s, border-color 0.12s; }
  .clear-btn:hover { color:#fff067; border-color:#fff067; }
  .clear-btn[disabled] { opacity:0.35; cursor:default; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fit, minmax(86px, 1fr)); gap:10px; margin-top:8px; }
  .thumb { position:relative; border:1px solid #141e2a; border-radius:6px; padding:6px 4px 4px; background:#0b1118; cursor:pointer; transition:border-color 0.12s, background 0.12s; }
  .thumb:hover { border-color:#7a7875; }
  .thumb.selected { border-color:#fff067; background:rgba(255,240,103,0.04); }
  .thumb svg { display:block; width:100%; height:auto; }
  .thumb-label { font-family:'Geist Mono',monospace; font-size:9px; text-align:center; letter-spacing:0.3px; padding-top:2px; }
  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="title" id="title"></span>
    <span class="hint">drag to rotate · click a plane below</span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="gallery-bar">
    <span class="gallery-title" id="galleryTitle"></span>
    <button class="clear-btn" id="clearBtn" disabled>clear</button>
  </div>
  <div class="gallery" id="gallery"></div>
  <p class="footer" id="footer"></p>
</div>

<script>
"use strict";

var qs = new URLSearchParams(location.search);
var SHAPE = (qs.get("shape") || "cube").toLowerCase();

var COL = {
  edge:   "#00abfa",
  yellow: "#fff067",
  green:  "#0fee89",
  orange: "#ff822c",
  pink:   "#ff4670"
};

// Main view geometry
var W = 600, H = 400, MAIN_SCALE = 1.4;
// Thumbnail geometry. Pitch is POSITIVE so the camera looks slightly DOWN
// at the solid (back edges sit higher on screen than front edges) — that
// matches the conventional isometric drawing orientation and removes the
// Necker-cube ambiguity that flipped left/right while dragging.
var TW = 110, TH = 110, THUMB_SCALE = 0.45;
var THUMB_YAW = 28 * Math.PI / 180;
var THUMB_PITCH = 22 * Math.PI / 180;

// Main view rotation state (driven by drag) — same default orientation as
// the thumbnails so a freshly-loaded shape and the picked-thumb plane line
// up before the student starts dragging.
var yaw = 28 * Math.PI / 180;
var pitch = 22 * Math.PI / 180;

// Currently-selected plane (null = none, integer = plane index)
var selectedPlaneIdx = null;

function projectFn(yawAngle, pitchAngle, w, h, scale) {
  var cy = Math.cos(yawAngle), sy = Math.sin(yawAngle);
  var cx = Math.cos(pitchAngle), sx = Math.sin(pitchAngle);
  return function(p) {
    var x1 = p[0] * cy + p[2] * sy;
    var y1 = p[1];
    var z1 = -p[0] * sy + p[2] * cy;
    var y2 = y1 * cx - z1 * sx;
    var z2 = y1 * sx + z1 * cx;
    return { x: w / 2 + x1 * scale, y: h / 2 - y2 * scale, z: z2 };
  };
}

// === Solid library ====================================================
function rotZ(p, ang) {
  var c = Math.cos(ang), s = Math.sin(ang);
  return [c*p[0] - s*p[1], s*p[0] + c*p[1], p[2]];
}

function buildCube() {
  var s = 75;
  var v = [
    [-s,-s,-s],[ s,-s,-s],[ s, s,-s],[-s, s,-s],
    [-s,-s, s],[ s,-s, s],[ s, s, s],[-s, s, s]
  ];
  var e = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];
  var planes = [];
  // 3 axis-aligned: corners on the cube faces (no padding)
  planes.push({ polygon: [[0,-s,-s],[0, s,-s],[0, s, s],[0,-s, s]], color: COL.yellow, label: "axis-aligned ⊥ x" });
  planes.push({ polygon: [[-s, 0,-s],[ s, 0,-s],[ s, 0, s],[-s, 0, s]], color: COL.yellow, label: "axis-aligned ⊥ y" });
  planes.push({ polygon: [[-s,-s, 0],[ s,-s, 0],[ s, s, 0],[-s, s, 0]], color: COL.yellow, label: "axis-aligned ⊥ z" });
  // 6 diagonal: each contains a pair of opposite cube edges
  planes.push({ polygon: [[-s,-s,-s],[ s,-s, s],[ s, s, s],[-s, s,-s]], color: COL.green, label: "diagonal x=z" });
  planes.push({ polygon: [[-s,-s, s],[ s,-s,-s],[ s, s,-s],[-s, s, s]], color: COL.green, label: "diagonal x=−z" });
  planes.push({ polygon: [[-s,-s,-s],[ s, s,-s],[ s, s, s],[-s,-s, s]], color: COL.green, label: "diagonal x=y" });
  planes.push({ polygon: [[ s,-s,-s],[-s, s,-s],[-s, s, s],[ s,-s, s]], color: COL.green, label: "diagonal x=−y" });
  planes.push({ polygon: [[-s,-s,-s],[ s,-s,-s],[ s, s, s],[-s, s, s]], color: COL.green, label: "diagonal y=z" });
  planes.push({ polygon: [[-s, s,-s],[ s, s,-s],[ s,-s, s],[-s,-s, s]], color: COL.green, label: "diagonal y=−z" });
  return {
    vertices: v, edges: e, planes: planes, kind: "polyhedron",
    title: "CUBE — 9 PLANES OF SYMMETRY",
    galleryTitle: "ALL 9 PLANES (3 AXIS-ALIGNED · 6 DIAGONAL)",
    footer: "rotational axes: 3 of order 4 · 4 of order 3 · 6 of order 2"
  };
}

function buildCuboid() {
  var L = 100, Hh = 55, Ww = 70;
  var v = [
    [-L,-Hh,-Ww],[ L,-Hh,-Ww],[ L, Hh,-Ww],[-L, Hh,-Ww],
    [-L,-Hh, Ww],[ L,-Hh, Ww],[ L, Hh, Ww],[-L, Hh, Ww]
  ];
  var e = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];
  var planes = [
    { polygon: [[0,-Hh,-Ww],[0, Hh,-Ww],[0, Hh, Ww],[0,-Hh, Ww]], color: COL.yellow, label: "vertical ⊥ length" },
    { polygon: [[-L, 0,-Ww],[ L, 0,-Ww],[ L, 0, Ww],[-L, 0, Ww]], color: COL.green,  label: "horizontal" },
    { polygon: [[-L,-Hh, 0],[ L,-Hh, 0],[ L, Hh, 0],[-L, Hh, 0]], color: COL.orange, label: "vertical ⊥ width" }
  ];
  return {
    vertices: v, edges: e, planes: planes, kind: "polyhedron",
    title: "CUBOID — 3 PLANES OF SYMMETRY",
    galleryTitle: "ONE PLANE THROUGH EACH PAIR OF OPPOSITE FACE-CENTRES",
    footer: "all sides different → 3 planes, each rotational axis order 2"
  };
}

function buildPrism() {
  var s = 80, L = 90;
  var R = s / Math.sqrt(3);
  var tri = [[0, R, 0], [-s/2, -R/2, 0], [s/2, -R/2, 0]];
  var v = [];
  for (var i = 0; i < 3; i++) v.push([tri[i][0], tri[i][1], -L/2]);
  for (var j = 0; j < 3; j++) v.push([tri[j][0], tri[j][1],  L/2]);
  var e = [
    [0,1],[1,2],[2,0],
    [3,4],[4,5],[5,3],
    [0,3],[1,4],[2,5]
  ];
  // 3 axial planes — each contains the prism axis (z direction) and a
  // triangle line of symmetry. Geometrically: vertex → opposite-edge midpoint.
  // Vertex at (0, R), opposite-edge midpoint at (0, -R/2). Plane corners:
  //   (0, R, -L/2), (0, R, L/2), (0, -R/2, L/2), (0, -R/2, -L/2)
  var basePlane = [
    [0,  R, -L/2], [0,  R, L/2], [0, -R/2, L/2], [0, -R/2, -L/2]
  ];
  var planes = [];
  [0, 2*Math.PI/3, 4*Math.PI/3].forEach(function(ang, i) {
    planes.push({
      polygon: basePlane.map(function(p){ return rotZ(p, ang); }),
      color: COL.yellow,
      label: i === 0 ? "vertical (top vertex)" : i === 1 ? "vertical (left vertex)" : "vertical (right vertex)"
    });
  });
  // Horizontal mid-plane: covers the triangle exactly at z=0
  planes.push({
    polygon: [[0, R, 0], [-s/2, -R/2, 0], [s/2, -R/2, 0]],
    color: COL.green,
    label: "horizontal mid"
  });
  return {
    vertices: v, edges: e, planes: planes, kind: "polyhedron",
    title: "TRIANGULAR PRISM — 4 PLANES OF SYMMETRY",
    galleryTitle: "3 VERTICAL (CROSS-SECTION SYMMETRY LINES) + 1 HORIZONTAL MID-PLANE",
    footer: "principal axis through cross-section centres has rotational order 3"
  };
}

function buildCylinder() {
  var R = 65, Hh = 70;
  var N = 96;        // smooth ring resolution
  var ringTop = [];
  var ringBot = [];
  for (var i = 0; i < N; i++) {
    var a = i * 2 * Math.PI / N;
    ringTop.push([R * Math.cos(a),  Hh, R * Math.sin(a)]);
    ringBot.push([R * Math.cos(a), -Hh, R * Math.sin(a)]);
  }
  // Vertical axial plane: rectangle from (-R) to (+R) on x at y=±Hh, z=0.
  // The plane lives in the xy-plane (z=0); corners at the ring intersections.
  var planes = [
    {
      polygon: [[-R, -Hh, 0], [R, -Hh, 0], [R, Hh, 0], [-R, Hh, 0]],
      color: COL.yellow,
      label: "one of ∞ axial planes"
    },
    // Horizontal mid-plane: a circle (polygon) at y=0 of radius R
    {
      polygon: (function(){
        var pts = [];
        for (var m = 0; m < N; m++) {
          var ang = m * 2 * Math.PI / N;
          pts.push([R * Math.cos(ang), 0, R * Math.sin(ang)]);
        }
        return pts;
      })(),
      color: COL.green,
      label: "horizontal mid-plane"
    }
  ];
  return {
    kind: "cylinder",
    ringTop: ringTop,
    ringBot: ringBot,
    planes: planes,
    title: "CYLINDER — INFINITE AXIAL PLANES + 1 HORIZONTAL",
    galleryTitle: "EVERY VERTICAL PLANE THROUGH THE AXIS WORKS — PLUS ONE HORIZONTAL MID-PLANE",
    footer: "rotational axis through the centres has infinite order"
  };
}

function buildPyramid() {
  var s = 95, h = 110;
  var v = [
    [-s/2, -h/2, -s/2],
    [ s/2, -h/2, -s/2],
    [ s/2, -h/2,  s/2],
    [-s/2, -h/2,  s/2],
    [ 0,    h/2,  0]
  ];
  var e = [
    [0,1],[1,2],[2,3],[3,0],
    [0,4],[1,4],[2,4],[3,4]
  ];
  var apex = [0, h/2, 0];
  var planes = [
    // Mid-edge planes: triangle apex + 2 base-edge midpoints
    { polygon: [[-s/2, -h/2, 0], [ s/2, -h/2, 0], apex], color: COL.yellow, label: "mid-edge (W↔E)" },
    { polygon: [[ 0, -h/2, -s/2], [ 0, -h/2,  s/2], apex], color: COL.yellow, label: "mid-edge (N↔S)" },
    // Corner planes: triangle apex + 2 opposite base corners
    { polygon: [v[0], v[2], apex], color: COL.green, label: "corner-corner" },
    { polygon: [v[1], v[3], apex], color: COL.green, label: "corner-corner" }
  ];
  return {
    vertices: v, edges: e, planes: planes, kind: "polyhedron",
    title: "SQUARE-BASED PYRAMID — 4 PLANES OF SYMMETRY",
    galleryTitle: "2 THROUGH MIDPOINTS OF OPPOSITE EDGES + 2 THROUGH OPPOSITE BASE CORNERS",
    footer: "principal axis (apex → base centre) has rotational order 4"
  };
}

function buildCone() {
  var R = 65, h = 130;
  var N = 96;
  var ringBase = [];
  for (var i = 0; i < N; i++) {
    var a = i * 2 * Math.PI / N;
    ringBase.push([R * Math.cos(a), -h/2, R * Math.sin(a)]);
  }
  var apex = [0, h/2, 0];
  // Three sample axial planes (at 0°, 60°, and 30° around the axis), each a
  // triangle apex + 2 base-ring points at diametrically opposite angles.
  function axialAt(ang) {
    return [
      [R * Math.cos(ang), -h/2, R * Math.sin(ang)],
      [R * Math.cos(ang + Math.PI), -h/2, R * Math.sin(ang + Math.PI)],
      apex
    ];
  }
  var planes = [
    { polygon: axialAt(0), color: COL.yellow, label: "axial sample 1" },
    { polygon: axialAt(Math.PI / 3), color: COL.yellow, label: "axial sample 2" },
    { polygon: axialAt(2 * Math.PI / 3), color: COL.yellow, label: "axial sample 3" }
  ];
  return {
    kind: "cone",
    ringBase: ringBase,
    apex: apex,
    planes: planes,
    title: "CONE — INFINITE AXIAL PLANES",
    galleryTitle: "EVERY PLANE THROUGH THE AXIS WORKS — APEX FORBIDS A HORIZONTAL PLANE",
    footer: "rotational axis (apex → base centre) has infinite order"
  };
}

var BUILDERS = {
  cube: buildCube,
  cuboid: buildCuboid,
  prism: buildPrism,
  cylinder: buildCylinder,
  pyramid: buildPyramid,
  cone: buildCone
};
var spec = (BUILDERS[SHAPE] || buildCube)();

// === SVG helpers ======================================================
function el(tag, attrs) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function ringPath(projected) {
  // Smooth closed path through the projected ring points.
  if (!projected.length) return "";
  var d = "M " + projected[0].x.toFixed(2) + " " + projected[0].y.toFixed(2);
  for (var i = 1; i < projected.length; i++) {
    d += " L " + projected[i].x.toFixed(2) + " " + projected[i].y.toFixed(2);
  }
  d += " Z";
  return d;
}
function findExtremes(projected) {
  // Index of min and max screen.x. Returns {minIdx, maxIdx}.
  var minIdx = 0, maxIdx = 0;
  for (var i = 1; i < projected.length; i++) {
    if (projected[i].x < projected[minIdx].x) minIdx = i;
    if (projected[i].x > projected[maxIdx].x) maxIdx = i;
  }
  return { minIdx: minIdx, maxIdx: maxIdx };
}

// Render `spec` into an SVG using the given projection. `selectedIdx` is the
// plane index to draw translucent (or null).
function renderInto(svg, project, selectedIdx, edgeWidth) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  edgeWidth = edgeWidth || 1.6;

  if (spec.kind === "cylinder") {
    var topProj = spec.ringTop.map(project);
    var botProj = spec.ringBot.map(project);
    // Top ring as smooth path (closed)
    svg.appendChild(el("path", {
      d: ringPath(topProj),
      fill: "none",
      stroke: COL.edge,
      "stroke-width": edgeWidth,
      "stroke-linejoin": "round"
    }));
    // Bottom ring as smooth path (closed)
    svg.appendChild(el("path", {
      d: ringPath(botProj),
      fill: "none",
      stroke: COL.edge,
      "stroke-width": edgeWidth,
      "stroke-linejoin": "round"
    }));
    // Side silhouette: connect screen-x extremes of top ring to corresponding
    // bottom ring points (same angular index → same world x,z).
    var ext = findExtremes(topProj);
    [ext.minIdx, ext.maxIdx].forEach(function(idx) {
      var t = topProj[idx], b = botProj[idx];
      svg.appendChild(el("line", {
        x1: t.x, y1: t.y, x2: b.x, y2: b.y,
        stroke: COL.edge,
        "stroke-width": edgeWidth,
        "stroke-linecap": "round"
      }));
    });
  } else if (spec.kind === "cone") {
    var baseProj = spec.ringBase.map(project);
    var apexProj = project(spec.apex);
    // Base ring as smooth closed path
    svg.appendChild(el("path", {
      d: ringPath(baseProj),
      fill: "none",
      stroke: COL.edge,
      "stroke-width": edgeWidth,
      "stroke-linejoin": "round"
    }));
    // Side silhouette: 2 lines from apex to base-ring screen-x extremes
    var extC = findExtremes(baseProj);
    [extC.minIdx, extC.maxIdx].forEach(function(idx) {
      var p = baseProj[idx];
      svg.appendChild(el("line", {
        x1: apexProj.x, y1: apexProj.y, x2: p.x, y2: p.y,
        stroke: COL.edge,
        "stroke-width": edgeWidth,
        "stroke-linecap": "round"
      }));
    });
  } else {
    // Generic polyhedron: edges
    var pv = spec.vertices.map(project);
    spec.edges.forEach(function(pair) {
      var a = pv[pair[0]], b = pv[pair[1]];
      svg.appendChild(el("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: COL.edge,
        "stroke-width": edgeWidth,
        "stroke-linecap": "round"
      }));
    });
  }

  // Selected plane drawn ON TOP so it's clearly visible against the wireframe.
  if (selectedIdx != null) {
    var plane = spec.planes[selectedIdx];
    if (plane) {
      var pts = plane.polygon.map(project)
        .map(function(p){ return p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" ");
      svg.appendChild(el("polygon", {
        points: pts,
        fill: plane.color + "55",
        stroke: plane.color,
        "stroke-width": edgeWidth,
        "stroke-linejoin": "round"
      }));
    }
  }
}

// === Main interactive viewer ==========================================
var stage = document.getElementById("stage");
var mainSvg = el("svg", {
  viewBox: "0 0 " + W + " " + H,
  preserveAspectRatio: "xMidYMid meet"
});
stage.appendChild(mainSvg);

function redrawMain() {
  renderInto(mainSvg, projectFn(yaw, pitch, W, H, MAIN_SCALE), selectedPlaneIdx, 2);
}
redrawMain();

// Drag interaction
var dragging = false;
var lastX = 0, lastY = 0;
function onPointerDown(e) {
  dragging = true;
  stage.classList.add("dragging");
  var pt = e.touches ? e.touches[0] : e;
  lastX = pt.clientX;
  lastY = pt.clientY;
  e.preventDefault();
}
function onPointerMove(e) {
  if (!dragging) return;
  var pt = e.touches ? e.touches[0] : e;
  var dx = pt.clientX - lastX;
  var dy = pt.clientY - lastY;
  lastX = pt.clientX;
  lastY = pt.clientY;
  yaw += dx * 0.01;
  pitch += dy * 0.01;
  var lim = 85 * Math.PI / 180;
  if (pitch > lim) pitch = lim;
  if (pitch < -lim) pitch = -lim;
  redrawMain();
  e.preventDefault();
}
function onPointerUp() {
  dragging = false;
  stage.classList.remove("dragging");
}
stage.addEventListener("mousedown", onPointerDown);
window.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerUp);
stage.addEventListener("touchstart", onPointerDown, { passive: false });
stage.addEventListener("touchmove", onPointerMove, { passive: false });
stage.addEventListener("touchend", onPointerUp);

// === Plane gallery ====================================================
document.getElementById("title").textContent = spec.title;
document.getElementById("galleryTitle").textContent = spec.galleryTitle || "PLANES";
document.getElementById("footer").textContent = spec.footer || "";

var clearBtn = document.getElementById("clearBtn");
clearBtn.addEventListener("click", function() {
  selectPlane(null);
});

var thumbs = [];
var gallery = document.getElementById("gallery");

spec.planes.forEach(function(plane, idx) {
  var thumb = document.createElement("div");
  thumb.className = "thumb";
  var svg = el("svg", {
    viewBox: "0 0 " + TW + " " + TH,
    preserveAspectRatio: "xMidYMid meet"
  });
  thumb.appendChild(svg);
  renderInto(svg, projectFn(THUMB_YAW, THUMB_PITCH, TW, TH, THUMB_SCALE), idx, 1.2);
  var label = document.createElement("div");
  label.className = "thumb-label";
  label.style.color = plane.color;
  label.textContent = plane.label;
  thumb.appendChild(label);
  thumb.addEventListener("click", function() {
    selectPlane(idx === selectedPlaneIdx ? null : idx);
  });
  gallery.appendChild(thumb);
  thumbs.push(thumb);
});

function selectPlane(idx) {
  selectedPlaneIdx = idx;
  thumbs.forEach(function(t, i) {
    t.classList.toggle("selected", i === idx);
  });
  clearBtn.disabled = (idx == null);
  redrawMain();
}

// === Height reporter ==================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
