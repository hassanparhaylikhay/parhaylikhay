<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solid Symmetry — Interactive + Plane Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
  .title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; }
  .hint { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }
  .stage { width:100%; aspect-ratio: 1.5; position:relative; border-radius:6px; cursor:grab; user-select:none; touch-action:none; background:transparent; }
  .stage.dragging { cursor:grabbing; }
  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .gallery-title { margin-top:14px; font-family:'Geist Mono',monospace; font-size:10.5px; color:#7a7875; letter-spacing:0.4px; text-transform:uppercase; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fit, minmax(86px, 1fr)); gap:10px; margin-top:8px; }
  .thumb { position:relative; border:1px solid #141e2a; border-radius:6px; padding:6px 4px 4px; background:#0b1118; }
  .thumb svg { display:block; width:100%; height:auto; }
  .thumb-label { font-family:'Geist Mono',monospace; font-size:9px; text-align:center; letter-spacing:0.3px; padding-top:2px; }
  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="title" id="title"></span>
    <span class="hint">drag to rotate</span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="gallery-title" id="galleryTitle"></div>
  <div class="gallery" id="gallery"></div>
  <p class="footer" id="footer"></p>
</div>

<script>
"use strict";

var qs = new URLSearchParams(location.search);
var SHAPE = (qs.get("shape") || "cube").toLowerCase();

// Brand palette
var COL = {
  edge:   "#00abfa",
  yellow: "#fff067",
  green:  "#0fee89",
  orange: "#ff822c",
  pink:   "#ff4670",
  grey:   "#7a7875"
};

// Main view geometry
var W = 600, H = 400;
var SCALE = 1.4;

// Thumb geometry
var TW = 110, TH = 110;
var THUMB_SCALE = 0.45;
var THUMB_YAW = 28 * Math.PI / 180;
var THUMB_PITCH = -22 * Math.PI / 180;

// Main view rotation state (driven by drag)
var yaw = 28 * Math.PI / 180;
var pitch = -22 * Math.PI / 180;

// Project a 3D point given current yaw/pitch into screen coords + camera-z.
// Convention: +x right, +y up (in math), +z toward viewer. Screen y is down,
// so we flip via H/2 - y'*SCALE.
function projectFn(yawAngle, pitchAngle, w, h, scale) {
  var cy = Math.cos(yawAngle), sy = Math.sin(yawAngle);
  var cx = Math.cos(pitchAngle), sx = Math.sin(pitchAngle);
  return function(p) {
    var x1 = p[0] * cy + p[2] * sy;
    var y1 = p[1];
    var z1 = -p[0] * sy + p[2] * cy;
    var x2 = x1;
    var y2 = y1 * cx - z1 * sx;
    var z2 = y1 * sx + z1 * cx;
    return { x: w / 2 + x2 * scale, y: h / 2 - y2 * scale, z: z2 };
  };
}

// === Solid library ====================================================
// Each entry: { vertices, edges, planes, title, footer, planeLabels[] }
// Each plane: { polygon: [v0,v1,v2,...], color }

function rotZ(p, ang) {
  var c = Math.cos(ang), s = Math.sin(ang);
  return [c*p[0] - s*p[1], s*p[0] + c*p[1], p[2]];
}

function buildCube() {
  var s = 75;
  var v = [
    [-s,-s,-s],[ s,-s,-s],[ s, s,-s],[-s, s,-s],
    [-s,-s, s],[ s,-s, s],[ s, s, s],[-s, s, s]
  ];
  var e = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];
  var p = s + 4;  // plane corner pad
  var planes = [];
  // 3 axis-aligned (yellow): x=0, y=0, z=0
  planes.push({ polygon: [[0,-p,-p],[0, p,-p],[0, p, p],[0,-p, p]], color: COL.yellow, label: "axis-aligned ⊥ x" });
  planes.push({ polygon: [[-p, 0,-p],[ p, 0,-p],[ p, 0, p],[-p, 0, p]], color: COL.yellow, label: "axis-aligned ⊥ y" });
  planes.push({ polygon: [[-p,-p, 0],[ p,-p, 0],[ p, p, 0],[-p, p, 0]], color: COL.yellow, label: "axis-aligned ⊥ z" });
  // 6 diagonal (green): each contains a pair of opposite edges
  planes.push({ polygon: [[-s,-s,-s],[ s,-s, s],[ s, s, s],[-s, s,-s]], color: COL.green, label: "diagonal x=z" });
  planes.push({ polygon: [[-s,-s, s],[ s,-s,-s],[ s, s,-s],[-s, s, s]], color: COL.green, label: "diagonal x=−z" });
  planes.push({ polygon: [[-s,-s,-s],[ s, s,-s],[ s, s, s],[-s,-s, s]], color: COL.green, label: "diagonal x=y" });
  planes.push({ polygon: [[ s,-s,-s],[-s, s,-s],[-s, s, s],[ s,-s, s]], color: COL.green, label: "diagonal x=−y" });
  planes.push({ polygon: [[-s,-s,-s],[ s,-s,-s],[ s, s, s],[-s, s, s]], color: COL.green, label: "diagonal y=z" });
  planes.push({ polygon: [[-s, s,-s],[ s, s,-s],[ s,-s, s],[-s,-s, s]], color: COL.green, label: "diagonal y=−z" });
  return {
    vertices: v, edges: e, planes: planes,
    title: "CUBE — 9 PLANES OF SYMMETRY",
    galleryTitle: "ALL 9 PLANES (3 AXIS-ALIGNED + 6 DIAGONAL)",
    footer: "principal axes: 3 of order 4, 4 of order 3, 6 of order 2"
  };
}

function buildCuboid() {
  var L = 100, Hh = 55, Ww = 70;
  var v = [
    [-L,-Hh,-Ww],[ L,-Hh,-Ww],[ L, Hh,-Ww],[-L, Hh,-Ww],
    [-L,-Hh, Ww],[ L,-Hh, Ww],[ L, Hh, Ww],[-L, Hh, Ww]
  ];
  var e = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];
  var px = L + 4, py = Hh + 4, pz = Ww + 4;
  var planes = [
    { polygon: [[0,-py,-pz],[0, py,-pz],[0, py, pz],[0,-py, pz]], color: COL.yellow, label: "vertical ⊥ length" },
    { polygon: [[-px, 0,-pz],[ px, 0,-pz],[ px, 0, pz],[-px, 0, pz]], color: COL.green, label: "horizontal" },
    { polygon: [[-px,-py, 0],[ px,-py, 0],[ px, py, 0],[-px, py, 0]], color: COL.orange, label: "vertical ⊥ width" }
  ];
  return {
    vertices: v, edges: e, planes: planes,
    title: "CUBOID — 3 PLANES OF SYMMETRY",
    galleryTitle: "ONE PLANE THROUGH EACH PAIR OF OPPOSITE FACE-CENTRES",
    footer: "all sides different → exactly 3 planes; each rotational axis is order 2"
  };
}

function buildPrism() {
  var s = 80, L = 90;
  var R = s / Math.sqrt(3);
  var tri = [[0, R, 0], [-s/2, -R/2, 0], [s/2, -R/2, 0]];
  var v = [];
  for (var i = 0; i < 3; i++) v.push([tri[i][0], tri[i][1], -L/2]);
  for (var j = 0; j < 3; j++) v.push([tri[j][0], tri[j][1],  L/2]);
  var e = [
    [0,1],[1,2],[2,0],
    [3,4],[4,5],[5,3],
    [0,3],[1,4],[2,5]
  ];
  // 3 vertical planes (yellow): each contains the prism axis and a triangle line of symmetry
  var pad = 8;
  var topY = R + pad, botY = -R - pad;
  var basePlane = [[0, topY, -L/2 - 4], [0, topY, L/2 + 4], [0, botY, L/2 + 4], [0, botY, -L/2 - 4]];
  var planes = [];
  [0, 2*Math.PI/3, 4*Math.PI/3].forEach(function(ang) {
    planes.push({
      polygon: basePlane.map(function(p){ return rotZ(p, ang); }),
      color: COL.yellow,
      label: "vertical (" + Math.round(ang * 180 / Math.PI) + "°)"
    });
  });
  // 1 horizontal mid-plane (green) at z=0
  planes.push({
    polygon: [[-s/2 - pad, -R - pad, 0], [s/2 + pad, -R - pad, 0], [s/2 + pad, R + pad, 0], [-s/2 - pad, R + pad, 0]],
    color: COL.green,
    label: "horizontal mid"
  });
  return {
    vertices: v, edges: e, planes: planes,
    title: "TRIANGULAR PRISM — 4 PLANES OF SYMMETRY",
    galleryTitle: "3 VERTICAL (CROSS-SECTION SYMMETRY LINES) + 1 HORIZONTAL MID-PLANE",
    footer: "principal axis through cross-section centres has rotational order 3"
  };
}

function buildCylinder() {
  var R = 65, Hh = 70;
  var N = 32;
  var v = [];
  for (var i = 0; i < N; i++) {
    var a = i * 2 * Math.PI / N;
    v.push([R * Math.cos(a), Hh, R * Math.sin(a)]);
  }
  for (var j = 0; j < N; j++) {
    var b = j * 2 * Math.PI / N;
    v.push([R * Math.cos(b), -Hh, R * Math.sin(b)]);
  }
  var e = [];
  for (var k = 0; k < N; k++) {
    e.push([k, (k+1) % N]);
    e.push([N + k, N + ((k+1) % N)]);
  }
  e.push([0, N]);
  e.push([N/2 | 0, N + (N/2 | 0)]);
  // Vertical sample plane (yellow): yz plane (x=0) — example only; infinite exist
  var p = R + 8;
  var planes = [
    {
      polygon: [[0, Hh + 8, -p],[0, Hh + 8, p],[0, -Hh - 8, p],[0, -Hh - 8, -p]],
      color: COL.yellow,
      label: "one of ∞ axial planes"
    },
    // Horizontal mid-plane (green): approximate by polygon ring
    {
      polygon: (function(){
        var pts = [];
        for (var m = 0; m < N; m++) {
          var ang = m * 2 * Math.PI / N;
          pts.push([(R + 8) * Math.cos(ang), 0, (R + 8) * Math.sin(ang)]);
        }
        return pts;
      })(),
      color: COL.green,
      label: "horizontal mid-plane"
    }
  ];
  return {
    vertices: v, edges: e, planes: planes,
    title: "CYLINDER — INFINITE AXIAL PLANES + 1 HORIZONTAL",
    galleryTitle: "EVERY VERTICAL PLANE THROUGH THE AXIS WORKS — PLUS ONE HORIZONTAL MID-PLANE",
    footer: "rotational axis through the centres has infinite order"
  };
}

function buildPyramid() {
  var s = 95, h = 110;
  var v = [
    [-s/2, -h/2, -s/2],
    [ s/2, -h/2, -s/2],
    [ s/2, -h/2,  s/2],
    [-s/2, -h/2,  s/2],
    [ 0,    h/2,  0]
  ];
  var e = [
    [0,1],[1,2],[2,3],[3,0],
    [0,4],[1,4],[2,4],[3,4]
  ];
  var pad = 6;
  var apex = [0, h/2 + pad, 0];
  var planes = [
    // 2 mid-edge planes (yellow)
    { polygon: [[-s/2 - pad, -h/2 - pad, 0],[ s/2 + pad, -h/2 - pad, 0], apex], color: COL.yellow, label: "mid-edge (W↔E)" },
    { polygon: [[0, -h/2 - pad, -s/2 - pad],[0, -h/2 - pad,  s/2 + pad], apex], color: COL.yellow, label: "mid-edge (N↔S)" },
    // 2 corner planes (green)
    { polygon: [v[0], v[2], apex], color: COL.green, label: "corner-corner" },
    { polygon: [v[1], v[3], apex], color: COL.green, label: "corner-corner" }
  ];
  return {
    vertices: v, edges: e, planes: planes,
    title: "SQUARE-BASED PYRAMID — 4 PLANES OF SYMMETRY",
    galleryTitle: "2 THROUGH MIDPOINTS OF OPPOSITE EDGES + 2 THROUGH OPPOSITE BASE CORNERS",
    footer: "principal axis through apex and base centre has rotational order 4"
  };
}

function buildCone() {
  var R = 65, h = 130;
  var N = 36;
  var v = [];
  for (var i = 0; i < N; i++) {
    var a = i * 2 * Math.PI / N;
    v.push([R * Math.cos(a), -h/2, R * Math.sin(a)]);
  }
  v.push([0, h/2, 0]);
  var apexIdx = N;
  var e = [];
  for (var k = 0; k < N; k++) e.push([k, (k+1) % N]);
  e.push([0, apexIdx]);
  e.push([(N/2)|0, apexIdx]);
  var p = R + 8;
  var apex = [0, h/2 + 4, 0];
  var planes = [
    { polygon: [[0, -h/2 - 4, -p],[0, -h/2 - 4, p], apex], color: COL.yellow, label: "one of ∞ axial planes" },
    { polygon: [[-p, -h/2 - 4, 0],[ p, -h/2 - 4, 0], apex], color: COL.yellow, label: "another axial plane" },
    { polygon: (function(){
        var pts = [], r2 = R/Math.sqrt(2) + 1;
        return [[-r2, -h/2-4, -r2], [r2, -h/2-4, r2], apex];
      })(), color: COL.yellow, label: "axial through diagonal" }
  ];
  return {
    vertices: v, edges: e, planes: planes,
    title: "CONE — INFINITE AXIAL PLANES",
    galleryTitle: "EVERY PLANE THROUGH THE AXIS WORKS — APEX FORBIDS A HORIZONTAL PLANE",
    footer: "rotational axis through apex and base centre has infinite order"
  };
}

var BUILDERS = {
  cube: buildCube,
  cuboid: buildCuboid,
  prism: buildPrism,
  cylinder: buildCylinder,
  pyramid: buildPyramid,
  cone: buildCone
};

var spec = (BUILDERS[SHAPE] || buildCube)();

// === SVG helpers ======================================================
function el(tag, attrs) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

// Render the (edges + planes) of `spec` into a parent SVG, given a project fn.
// `withPlanes` — array of plane indices to draw (subset). If null: none.
function renderInto(svg, project, options) {
  options = options || {};
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  var planeIdxs = options.planeIdxs;
  var edgeColor = options.edgeColor || COL.edge;
  var edgeWidth = options.edgeWidth || 1.6;
  // Project all vertices
  var pv = spec.vertices.map(project);
  // Edges: just draw all as solid (no front/back distinction in 360 mode).
  spec.edges.forEach(function(pair) {
    var a = pv[pair[0]], b = pv[pair[1]];
    svg.appendChild(el("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: edgeColor,
      "stroke-width": edgeWidth,
      "stroke-linecap": "round"
    }));
  });
  // Planes: draw selected planes as translucent polygons. Each plane is split
  // by the depth of its centroid: if behind centroid of solid, draw before edges
  // (so front edges are on top); else draw after edges. To keep code simple,
  // draw all planes on top of edges with semi-transparent fill.
  if (planeIdxs && planeIdxs.length) {
    planeIdxs.forEach(function(idx) {
      var plane = spec.planes[idx];
      if (!plane) return;
      var pts = plane.polygon.map(project)
        .map(function(p){ return p.x + "," + p.y; }).join(" ");
      svg.appendChild(el("polygon", {
        points: pts,
        fill: plane.color + "44",
        stroke: plane.color,
        "stroke-width": 1.6,
        "stroke-linejoin": "round"
      }));
    });
  }
}

// === Main interactive viewer ==========================================
var stage = document.getElementById("stage");
var mainSvg = el("svg", {
  viewBox: "0 0 " + W + " " + H,
  preserveAspectRatio: "xMidYMid meet"
});
stage.appendChild(mainSvg);

function redrawMain() {
  var project = projectFn(yaw, pitch, W, H, SCALE);
  renderInto(mainSvg, project, { planeIdxs: null, edgeWidth: 2 });
}
redrawMain();

// Drag interaction
var dragging = false;
var lastX = 0, lastY = 0;

function onPointerDown(e) {
  dragging = true;
  stage.classList.add("dragging");
  var pt = e.touches ? e.touches[0] : e;
  lastX = pt.clientX;
  lastY = pt.clientY;
  e.preventDefault();
}
function onPointerMove(e) {
  if (!dragging) return;
  var pt = e.touches ? e.touches[0] : e;
  var dx = pt.clientX - lastX;
  var dy = pt.clientY - lastY;
  lastX = pt.clientX;
  lastY = pt.clientY;
  // Rotate: horizontal drag → yaw, vertical drag → pitch
  yaw += dx * 0.01;
  pitch += dy * 0.01;
  // Clamp pitch to ±85° to avoid gimbal weirdness
  var lim = 85 * Math.PI / 180;
  if (pitch > lim) pitch = lim;
  if (pitch < -lim) pitch = -lim;
  redrawMain();
  e.preventDefault();
}
function onPointerUp() {
  dragging = false;
  stage.classList.remove("dragging");
}
stage.addEventListener("mousedown", onPointerDown);
window.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerUp);
stage.addEventListener("touchstart", onPointerDown, { passive: false });
stage.addEventListener("touchmove", onPointerMove, { passive: false });
stage.addEventListener("touchend", onPointerUp);

// === Plane gallery (one thumbnail per plane) ==========================
document.getElementById("title").textContent = spec.title;
document.getElementById("galleryTitle").textContent = spec.galleryTitle || "PLANES";
document.getElementById("footer").textContent = spec.footer || "";

var gallery = document.getElementById("gallery");
spec.planes.forEach(function(plane, idx) {
  var thumb = document.createElement("div");
  thumb.className = "thumb";
  var svg = el("svg", {
    viewBox: "0 0 " + TW + " " + TH,
    preserveAspectRatio: "xMidYMid meet"
  });
  thumb.appendChild(svg);
  var project = projectFn(THUMB_YAW, THUMB_PITCH, TW, TH, THUMB_SCALE);
  renderInto(svg, project, { planeIdxs: [idx], edgeWidth: 1.2 });
  var label = document.createElement("div");
  label.className = "thumb-label";
  label.style.color = plane.color;
  label.textContent = plane.label;
  thumb.appendChild(label);
  gallery.appendChild(thumb);
});

// === Height reporter ==================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
