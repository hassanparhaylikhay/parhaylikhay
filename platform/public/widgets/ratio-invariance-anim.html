<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ratio invariance</title>
<style>
  html, body { margin:0; background:#0b1118; color:#c8c6be; font-family:'Geist Mono', ui-monospace, monospace; overflow:hidden; }
  .wrap { padding:10px 12px 12px; }
  .head { display:flex; justify-content:space-between; align-items:center; padding:2px 4px 8px; }
  .step-title { font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
  .meta { font-size:10px; color:#7a7875; }
  svg { display:block; width:100%; height:auto; }
  html.lesson-mode, body.lesson-mode { background: transparent; }
  .lesson-mode .head { display:none; }
  .lesson-mode .wrap { padding:0; }
</style>
</head>
<body>
<script>(function(){try{if(new URLSearchParams(location.search).get("lessonMode")==="1"){document.documentElement.classList.add("lesson-mode");document.body.classList.add("lesson-mode");}}catch(e){}})();</script>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">ONE ANGLE, ONE RATIO</span>
    <span class="meta">drag the corner · or just watch</span>
  </div>
  <svg id="stage" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
"use strict";

// ── config per ratio ────────────────────────────────────────────────────
var qs = new URLSearchParams(location.search);
var MODE = qs.get("ratio") || "sin";
var LESSON = qs.get("lessonMode") === "1";
var COL = { blue:"#00abfa", yellow:"#fff067", orange:"#ff822c", green:"#0fee89", pink:"#ff4670", grey:"#7a7875", faint:"#3a4a5a", off:"#c8c6be", white:"#f0eeea", bg:"#0b1118" };

var ANGLE = Math.PI / 6;                      // 30 degrees, fixed: that is the whole point
var CFG = {
  sin: { header: "sin 30° = opposite ÷ hypotenuse", top: "opp", bot: "hyp" },
  cos: { header: "cos 30° = adjacent ÷ hypotenuse", top: "adj", bot: "hyp" },
  tan: { header: "tan 30° = opposite ÷ adjacent",   top: "opp", bot: "adj" },
}[MODE] || { header: "sin 30° = opposite ÷ hypotenuse", top: "opp", bot: "hyp" };

// side colours: active pair bright, third side dimmed
var SIDE_COL = { opp: COL.orange, adj: COL.blue, hyp: COL.pink };
var active = { opp: CFG.top === "opp" || CFG.bot === "opp", adj: CFG.top === "adj" || CFG.bot === "adj", hyp: CFG.top === "hyp" || CFG.bot === "hyp" };

// ── geometry ────────────────────────────────────────────────────────────
var V = { x: 96, y: 252 };                    // the 30-degree vertex
var UNIT = 26;                                // px per unit
var H_MIN = 5.4, H_MAX = 11.6;                // hypotenuse range in units
var hyp = 8.5;                                // current size (units)
var auto = true;
var t0 = performance.now();

var stage = document.getElementById("stage");
var NS = "http://www.w3.org/2000/svg";
function el(name, attrs) {
  var n = document.createElementNS(NS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function fmt(n, dp) { return n.toFixed(dp); }

function corners(h) {
  var adj = h * Math.cos(ANGLE) * UNIT, opp = h * Math.sin(ANGLE) * UNIT;
  return { A: { x: V.x + adj, y: V.y }, B: { x: V.x + adj, y: V.y - opp } };
}

function draw() {
  while (stage.firstChild) stage.removeChild(stage.firstChild);
  var c = corners(hyp);
  var adjU = hyp * Math.cos(ANGLE), oppU = hyp * Math.sin(ANGLE);

  // header
  var head = el("text", { x: 240, y: 30, "font-size": 15, "font-weight": 600, fill: COL.yellow, "text-anchor": "middle", "dominant-baseline": "middle", "font-family": "'Geist Mono',monospace" });
  head.textContent = CFG.header;
  stage.appendChild(head);

  // triangle
  stage.appendChild(el("polygon", {
    points: V.x + "," + V.y + " " + c.A.x + "," + c.A.y + " " + c.B.x + "," + c.B.y,
    fill: "rgba(240,238,234,0.05)", stroke: "#c8c6be", "stroke-width": 2.2, "stroke-linejoin": "round",
  }));

  // right-angle marker at A
  var m = 12;
  stage.appendChild(el("path", { d: "M " + (c.A.x - m) + " " + c.A.y + " L " + (c.A.x - m) + " " + (c.A.y - m) + " L " + c.A.x + " " + (c.A.y - m), fill: "none", stroke: COL.yellow, "stroke-width": 1.5, opacity: 0.9 }));

  // 30-degree wedge (static angle at V)
  var wp = "M " + V.x + " " + V.y;
  for (var i = 0; i <= 10; i++) {
    var a = -(ANGLE * i) / 10;
    wp += " L " + (V.x + 28 * Math.cos(a)) + " " + (V.y + 28 * Math.sin(a));
  }
  stage.appendChild(el("path", { d: wp + " Z", fill: "rgba(255,240,103,0.18)", stroke: COL.yellow, "stroke-width": 1.2 }));
  var th = el("text", { x: V.x + 40, y: V.y - 11, "font-size": 13, "font-weight": 600, fill: COL.yellow, "text-anchor": "start", "dominant-baseline": "middle", "font-family": "'Geist Mono',monospace" });
  th.textContent = "30°";
  stage.appendChild(th);

  // side labels with LIVE values
  function sideLabel(name, value, x, y, anchor) {
    var col = active[name] ? SIDE_COL[name] : COL.faint;
    var t = el("text", { x: x, y: y, "font-size": 13.5, "font-weight": 600, fill: col, "text-anchor": anchor, "dominant-baseline": "middle", "font-family": "'Geist Mono',monospace" });
    t.textContent = name + " " + fmt(value, 1);
    stage.appendChild(t);
  }
  sideLabel("adj", adjU, (V.x + c.A.x) / 2, V.y + 20, "middle");
  sideLabel("opp", oppU, c.A.x + 14, (c.A.y + c.B.y) / 2, "start");
  sideLabel("hyp", hyp, (V.x + c.B.x) / 2 - 14, (V.y + c.B.y) / 2 - 16, "middle");

  // the living equation: numbers churn, the quotient never moves
  var vals = { opp: oppU, adj: adjU, hyp: hyp };
  var a1 = vals[CFG.top], a2 = vals[CFG.bot];
  var eq = el("text", { x: 240, y: 300, "font-size": 16, "font-weight": 600, "text-anchor": "middle", "dominant-baseline": "middle", "font-family": "'Geist Mono',monospace" });
  var t1 = el("tspan", { fill: SIDE_COL[CFG.top] }); t1.textContent = fmt(a1, 1);
  var t2 = el("tspan", { fill: COL.off }); t2.textContent = " ÷ ";
  var t3 = el("tspan", { fill: SIDE_COL[CFG.bot] }); t3.textContent = fmt(a2, 1);
  var t4 = el("tspan", { fill: COL.off }); t4.textContent = " = ";
  var t5 = el("tspan", { fill: COL.green, "font-size": 18 }); t5.textContent = fmt(a1 / a2, 2);
  eq.appendChild(t1); eq.appendChild(t2); eq.appendChild(t3); eq.appendChild(t4); eq.appendChild(t5);
  stage.appendChild(eq);

  // drag handle at B, pulsing until touched
  var hit = el("circle", { cx: c.B.x, cy: c.B.y, r: 16, fill: "transparent", style: "cursor:grab" });
  stage.appendChild(hit);
  var dot = el("circle", { cx: c.B.x, cy: c.B.y, r: 6.5, fill: COL.yellow, stroke: COL.bg, "stroke-width": 2, "pointer-events": "none" });
  if (auto) {
    var pulse = el("animate", { attributeName: "r", values: "6.5;9;6.5", dur: "1.8s", repeatCount: "indefinite" });
    dot.appendChild(pulse);
  }
  stage.appendChild(dot);
}

// ── autonomous breathing + drag takeover ────────────────────────────────
function tick(now) {
  if (auto) {
    var t = (now - t0) / 1000;
    hyp = (H_MIN + H_MAX) / 2 + ((H_MAX - H_MIN) / 2) * Math.sin(t * (2 * Math.PI / 7));
    draw();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

var dragging = false;
function ptFromEvent(e) {
  var r = stage.getBoundingClientRect();
  var scale = 480 / r.width;
  return { x: (e.clientX - r.left) * scale, y: (e.clientY - r.top) * scale };
}
stage.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  stage.setPointerCapture(e.pointerId);
  dragging = true;
  auto = false;
  onDrag(e);
});
stage.addEventListener("pointermove", function (e) { if (dragging) onDrag(e); });
stage.addEventListener("pointerup", function () { dragging = false; });
stage.addEventListener("pointercancel", function () { dragging = false; });
function onDrag(e) {
  var p = ptFromEvent(e);
  // distance from V along the hypotenuse direction sets the size
  var d = ((p.x - V.x) * Math.cos(ANGLE) + (V.y - p.y) * Math.sin(ANGLE)) / UNIT;
  hyp = Math.max(H_MIN, Math.min(H_MAX, d));
  draw();
}

// ── height reporting ────────────────────────────────────────────────────
function syncStageHeight() {
  if (stage.clientWidth > 0) stage.style.height = (stage.clientWidth * 320 / 480) + "px";
}
var lastReported = 0;
function reportHeight() {
  syncStageHeight();
  var wrap = document.getElementById("wrap");
  if (!wrap) return;
  var h = Math.ceil(wrap.getBoundingClientRect().height);
  if (Math.abs(h - lastReported) < 3) return;
  lastReported = h;
  if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
}
window.addEventListener("resize", reportHeight);
draw();
reportHeight();
</script>
</body>
</html>
