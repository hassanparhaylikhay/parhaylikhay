<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Composite Solids Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:13.5px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls {
    display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .row { display:flex; align-items:center; gap:8px; min-width:170px; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] {
    flex:1; min-width:60px; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .row .val { min-width:28px; text-align:right; color:#f0eeea; font-weight:600; }

  .toggle-row { display:flex; align-items:center; gap:8px; }
  .toggle-row .name { color:#fff067; font-weight:600; }
  .toggle-row select {
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px;
    padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer;
  }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .lbl-host { font-size:11.5px; line-height:1; font-family:'Geist Mono',monospace; font-weight:600; }
  .lbl-host .katex { font-size:1em; }
  .ellipse-hidden-join { fill: none; stroke:#7a7875; stroke-width:1.2; stroke-dasharray:4 3; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fV"></span>
    <span class="formula" id="fSA"></span>
  </div>

  <div class="controls">
    <div class="toggle-row">
      <span class="name">solid</span>
      <select id="kindSel">
        <option value="hemi-cone" selected>hemisphere + cone</option>
        <option value="cyl-cone">cylinder + cone</option>
        <option value="hemi-cyl">cylinder + dome</option>
      </select>
    </div>
    <div class="row">
      <span class="name">r</span>
      <input type="range" id="rSlider" min="1" max="6" value="3" step="0.1"/>
      <span class="val" id="rVal">3</span>
    </div>
    <div class="row">
      <span class="name" id="hLabel">h</span>
      <input type="range" id="hSlider" min="2" max="14" value="6" step="0.1"/>
      <span class="val" id="hVal">6</span>
    </div>
  </div>

  <svg id="svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="domeGrad" cx="38%" cy="32%" r="65%">
        <stop offset="0%" stop-color="rgba(255,70,112,0.55)"/>
        <stop offset="55%" stop-color="rgba(255,70,112,0.20)"/>
        <stop offset="100%" stop-color="rgba(255,70,112,0.05)"/>
      </radialGradient>
      <radialGradient id="hemiBottomGrad" cx="38%" cy="68%" r="65%">
        <stop offset="0%" stop-color="rgba(0,171,250,0.45)"/>
        <stop offset="60%" stop-color="rgba(0,171,250,0.18)"/>
        <stop offset="100%" stop-color="rgba(0,171,250,0.05)"/>
      </radialGradient>
      <linearGradient id="cylGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="rgba(0,171,250,0.10)"/>
        <stop offset="50%" stop-color="rgba(0,171,250,0.28)"/>
        <stop offset="100%" stop-color="rgba(0,171,250,0.10)"/>
      </linearGradient>
      <linearGradient id="coneGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="rgba(255,130,44,0.10)"/>
        <stop offset="50%" stop-color="rgba(255,130,44,0.28)"/>
        <stop offset="100%" stop-color="rgba(255,130,44,0.10)"/>
      </linearGradient>
    </defs>
    <g id="g-shape"></g>
  </svg>

  <p class="footer">drag r and h · faces at the join (dashed) cancel · only exposed faces count for SA</p>
</div>

<script>
"use strict";

var SVG_W = 480, SVG_H = 320;
var SCALE_R = 18;
var SCALE_H = 14;
var ELLIPSE_RATIO = 0.32;

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function texCoefPi(coef) {
  var v = Math.round(coef * 1000) / 1000;
  if (v === 0) return "0";
  if (v === 1) return "\\pi";
  return parseFloat(v.toFixed(3)).toString() + "\\pi";
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// KaTeX label inside SVG via foreignObject
function svgKaTeXLabel(parent, x, y, tex, color, alignment) {
  var fo = svgEl("foreignObject", {
    x: (x - 60), y: (y - 12), width: 120, height: 24,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "lbl-host";
  div.style.color = color || "#f0eeea";
  div.style.width = "100%";
  div.style.height = "100%";
  div.style.display = "flex";
  div.style.alignItems = "center";
  div.style.justifyContent = (alignment === "left" ? "flex-start" : alignment === "right" ? "flex-end" : "center");
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}

var state = {
  params:  { r: 3, h: 6 },
  display: { r: 3, h: 6 },
  kind:    "hemi-cone"
};
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005, rafScheduled = false;
function startSpring() { if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(springTick); } }
function springTick() {
  var moving = false;
  ["r","h"].forEach(function(k) {
    var d = state.params[k] - state.display[k];
    if (Math.abs(d) > SPRING_EPS) { state.display[k] += d * SPRING_FACTOR; moving = true; }
    else state.display[k] = state.params[k];
  });
  render();
  if (moving) requestAnimationFrame(springTick);
  else rafScheduled = false;
}

var fV = document.getElementById("fV");
var fSA = document.getElementById("fSA");
var gShape = document.getElementById("g-shape");

function render() {
  var r = state.display.r, hSec = state.display.h;
  var cx = SVG_W / 2;

  // Auto-scale every pixel dimension so the figure fits inside the SVG
  // vertically. Natural extent depends on composite type. After scaling,
  // rPx + hPx + hConePx (etc) are guaranteed to fit within SVG_H minus
  // PAD on each side.
  var PAD = 14;
  var available = SVG_H - 2 * PAD;
  var rPxNat   = r * SCALE_R;
  var hPxNat   = hSec * SCALE_H;
  var hConeNat = 1.5 * r * SCALE_H;   // used by cyl-cone

  var naturalH;
  if (state.kind === "hemi-cone")     naturalH = rPxNat + hPxNat;     // hemisphere + cone
  else if (state.kind === "cyl-cone") naturalH = hPxNat + hConeNat;   // cylinder + cone
  else                                 naturalH = hPxNat + rPxNat;     // cylinder + dome

  var fit  = (naturalH > available) ? available / naturalH : 1;
  var rPx     = rPxNat   * fit;
  var hPx     = hPxNat   * fit;
  var hConePx = hConeNat * fit;
  var ryPx    = rPx * ELLIPSE_RATIO;

  gShape.innerHTML = "";

  if (state.kind === "hemi-cone") {
    // Hemisphere dome curves DOWN; flat side faces UP, cone sits on it.
    // Pin the bottom of the hemisphere to (SVG_H - PAD), then place the
    // hemisphere centre rPx above that, then the cone apex hPx above that.
    var hemiCenterY = SVG_H - PAD - rPx;
    var coneApexY   = hemiCenterY - hPx;
    var leftX  = cx - rPx;
    var rightX = cx + rPx;

    // Hemisphere bottom (dome) — half disk pointing down with blue gradient
    var hemiD =
      "M" + leftX + " " + hemiCenterY +
      " A" + rPx + " " + rPx + " 0 0 0 " + rightX + " " + hemiCenterY +
      " Z";
    gShape.appendChild(svgEl("path", {
      d: hemiD, fill: "url(#hemiBottomGrad)",
      stroke: "#00abfa", "stroke-width": 2, "stroke-linejoin": "round"
    }));

    // Cone (orange gradient, foreshortened ellipse base)
    var coneD =
      "M" + cx + " " + coneApexY +
      " L" + leftX + " " + hemiCenterY +
      " A" + rPx + " " + ryPx + " 0 0 0 " + rightX + " " + hemiCenterY +
      " Z";
    gShape.appendChild(svgEl("path", {
      d: coneD, fill: "url(#coneGrad)",
      stroke: "#ff822c", "stroke-width": 2, "stroke-linejoin": "round"
    }));

    // Hidden join: dashed grey ellipse at the equator
    gShape.appendChild(svgEl("ellipse", {
      "class": "ellipse-hidden-join",
      cx: cx, cy: hemiCenterY, rx: rPx, ry: ryPx
    }));

    // Slant line (pink) from cone apex to right edge of base
    gShape.appendChild(svgEl("line", {
      x1: cx, y1: coneApexY, x2: rightX, y2: hemiCenterY,
      stroke: "#ff4670", "stroke-width": 1.5
    }));

    // Labels (KaTeX)
    svgKaTeXLabel(gShape, cx + rPx/2 + 4, hemiCenterY + ryPx + 16,
      "r = " + fmtNum(r), "#fff067", "left");
    svgKaTeXLabel(gShape, cx - 18, (hemiCenterY + coneApexY)/2,
      "h = " + fmtNum(hSec), "#ff822c", "right");

    // Volume + SA
    var l = Math.sqrt(r*r + hSec*hSec);
    var Vcoef  = (2/3) * r*r*r + (1/3) * r*r * hSec;
    var SAcoef = 2 * r*r + r * l;
    tryRender(fV,
      "{\\color{#00abfa}V_{\\text{hemi}}} + {\\color{#ff822c}V_{\\text{cone}}} = \\tfrac{2}{3}\\pi r^{3} + \\tfrac{1}{3}\\pi r^{2} h = " +
      "{\\color{#fff067}" + texCoefPi(Vcoef) + "}\\;\\text{cm}^{3}");
    tryRender(fSA,
      "\\text{SA} = {\\color{#00abfa}2\\pi r^{2}} + {\\color{#ff822c}\\pi r l} = " +
      "{\\color{#fff067}" + texCoefPi(SAcoef) + "}\\;\\text{cm}^{2}\\;\\;(l=" + fmtNum(l) + ")");
  } else if (state.kind === "cyl-cone") {
    // ===== Cylinder (bottom) + Cone (top) =====
    var hCone = 1.5 * r;                // cm value (for the label)
    var cylBottomY = SVG_H - PAD;
    var cylTopY    = cylBottomY - hPx;
    var coneApexY  = cylTopY - hConePx;
    var leftX = cx - rPx, rightX = cx + rPx;

    // Cylinder body (blue gradient)
    var cylD =
      "M" + leftX + " " + cylTopY +
      " L" + leftX + " " + cylBottomY +
      " A" + rPx + " " + ryPx + " 0 0 0 " + rightX + " " + cylBottomY +
      " L" + rightX + " " + cylTopY +
      " A" + rPx + " " + ryPx + " 0 0 1 " + leftX + " " + cylTopY + " Z";
    gShape.appendChild(svgEl("path", {
      d: cylD, fill: "url(#cylGrad)",
      stroke: "#00abfa", "stroke-width": 2, "stroke-linejoin": "round"
    }));

    // Cone on top (orange gradient)
    var coneD =
      "M" + cx + " " + coneApexY +
      " L" + leftX + " " + cylTopY +
      " A" + rPx + " " + ryPx + " 0 0 0 " + rightX + " " + cylTopY +
      " Z";
    gShape.appendChild(svgEl("path", {
      d: coneD, fill: "url(#coneGrad)",
      stroke: "#ff822c", "stroke-width": 2, "stroke-linejoin": "round"
    }));

    // Bottom ellipse (visible cylinder base) — yellow accent
    gShape.appendChild(svgEl("ellipse", {
      cx: cx, cy: cylBottomY, rx: rPx, ry: ryPx,
      fill: "rgba(255,240,103,0.18)", stroke: "#fff067", "stroke-width": 1.6
    }));
    // Hidden join (dashed)
    gShape.appendChild(svgEl("ellipse", {
      "class": "ellipse-hidden-join",
      cx: cx, cy: cylTopY, rx: rPx, ry: ryPx
    }));

    // Slant line on cone (pink)
    gShape.appendChild(svgEl("line", {
      x1: cx, y1: coneApexY, x2: rightX, y2: cylTopY,
      stroke: "#ff4670", "stroke-width": 1.5
    }));

    // Labels (KaTeX)
    svgKaTeXLabel(gShape, cx + rPx + 18, cylBottomY,
      "r = " + fmtNum(r), "#fff067", "left");
    svgKaTeXLabel(gShape, cx - 18, (cylTopY + cylBottomY)/2,
      "h_{\\text{cyl}} = " + fmtNum(hSec), "#00abfa", "right");
    svgKaTeXLabel(gShape, cx - 18, (cylTopY + coneApexY)/2,
      "h_{\\text{cone}} = " + fmtNum(hCone), "#ff822c", "right");

    // Computations
    var l = Math.sqrt(r*r + hCone*hCone);
    var Vcoef = r*r*hSec + (1/3)*r*r*hCone;
    var SAcoef = 2*r*hSec + r*l + r*r;  // cyl curved + cone curved + cyl bottom
    tryRender(fV,
      "{\\color{#00abfa}V_{\\text{cyl}}} + {\\color{#ff822c}V_{\\text{cone}}} = \\pi r^{2} h_{\\text{cyl}} + \\tfrac{1}{3}\\pi r^{2} h_{\\text{cone}} = " +
      "{\\color{#fff067}" + texCoefPi(Vcoef) + "}\\;\\text{cm}^{3}");
    tryRender(fSA,
      "\\text{SA} = {\\color{#00abfa}2\\pi r h_{\\text{cyl}}} + {\\color{#ff822c}\\pi r l} + {\\color{#fff067}\\pi r^{2}} = " +
      "{\\color{#ff4670}" + texCoefPi(SAcoef) + "}\\;\\text{cm}^{2}");
  } else {
    // ===== Cylinder (bottom) + Hemisphere DOME (top) =====
    // Dome is a true 3D-looking dome via radial gradient + foreshortened equator hint.
    var cylBottomY = SVG_H - PAD;
    var cylTopY    = cylBottomY - hPx;
    var domeTopY   = cylTopY - rPx;
    var leftX = cx - rPx, rightX = cx + rPx;

    // Cylinder body (blue gradient)
    var cylD =
      "M" + leftX + " " + cylTopY +
      " L" + leftX + " " + cylBottomY +
      " A" + rPx + " " + ryPx + " 0 0 0 " + rightX + " " + cylBottomY +
      " L" + rightX + " " + cylTopY +
      " A" + rPx + " " + ryPx + " 0 0 1 " + leftX + " " + cylTopY + " Z";
    gShape.appendChild(svgEl("path", {
      d: cylD, fill: "url(#cylGrad)",
      stroke: "#00abfa", "stroke-width": 2, "stroke-linejoin": "round"
    }));

    // Dome: half-circle path with pink radial gradient — front half above the equator
    // The dome is a hemisphere oriented with curved side UP; the cut face is the bottom (glued to cylinder top).
    var domeD =
      "M" + leftX + " " + cylTopY +
      " A" + rPx + " " + rPx + " 0 0 1 " + rightX + " " + cylTopY;
    gShape.appendChild(svgEl("path", {
      d: domeD + " Z",
      fill: "url(#domeGrad)",
      stroke: "#ff4670", "stroke-width": 2, "stroke-linejoin": "round"
    }));
    // Equator suggestion: a thin dashed ellipse at the dome's "back" so it reads as 3D
    gShape.appendChild(svgEl("ellipse", {
      cx: cx, cy: cylTopY, rx: rPx, ry: ryPx * 0.5,
      fill: "none", stroke: "#ff4670", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.5
    }));

    // Bottom ellipse (visible cylinder base) — yellow
    gShape.appendChild(svgEl("ellipse", {
      cx: cx, cy: cylBottomY, rx: rPx, ry: ryPx,
      fill: "rgba(255,240,103,0.18)", stroke: "#fff067", "stroke-width": 1.6
    }));
    // Hidden join (dashed)
    gShape.appendChild(svgEl("ellipse", {
      "class": "ellipse-hidden-join",
      cx: cx, cy: cylTopY, rx: rPx, ry: ryPx
    }));

    // Labels
    svgKaTeXLabel(gShape, cx + rPx + 18, cylBottomY,
      "r = " + fmtNum(r), "#fff067", "left");
    svgKaTeXLabel(gShape, cx - 18, (cylTopY + cylBottomY)/2,
      "h_{\\text{cyl}} = " + fmtNum(hSec), "#00abfa", "right");
    svgKaTeXLabel(gShape, cx + rPx + 14, (cylTopY + domeTopY)/2 + 4,
      "r", "#ff4670", "left");

    // Computations
    var Vcoef = r*r*hSec + (2/3)*r*r*r;
    var SAcoef = 2*r*hSec + 2*r*r + r*r;  // cyl curved + dome curved + cyl bottom
    tryRender(fV,
      "{\\color{#00abfa}V_{\\text{cyl}}} + {\\color{#ff4670}V_{\\text{dome}}} = \\pi r^{2} h_{\\text{cyl}} + \\tfrac{2}{3}\\pi r^{3} = " +
      "{\\color{#fff067}" + texCoefPi(Vcoef) + "}\\;\\text{cm}^{3}");
    tryRender(fSA,
      "\\text{SA} = {\\color{#00abfa}2\\pi r h_{\\text{cyl}}} + {\\color{#ff4670}2\\pi r^{2}} + {\\color{#fff067}\\pi r^{2}} = " +
      "{\\color{#ff822c}" + texCoefPi(SAcoef) + "}\\;\\text{cm}^{2}");
  }
}

function updateLabelsForKind() {
  var hLab = document.getElementById("hLabel");
  if (state.kind === "hemi-cone") hLab.textContent = "h_cone";
  else if (state.kind === "cyl-cone") hLab.textContent = "h_cyl";
  else hLab.textContent = "h_cyl";
}

document.getElementById("rSlider").addEventListener("input", function() {
  state.params.r = parseFloat(this.value);
  document.getElementById("rVal").textContent = fmtNum(state.params.r);
  startSpring();
});
document.getElementById("hSlider").addEventListener("input", function() {
  state.params.h = parseFloat(this.value);
  document.getElementById("hVal").textContent = fmtNum(state.params.h);
  startSpring();
});
document.getElementById("kindSel").addEventListener("change", function() {
  state.kind = this.value;
  updateLabelsForKind();
  render();
});

updateLabelsForKind();
render();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
