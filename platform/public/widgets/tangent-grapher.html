<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tangent Grapher</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:10px; min-height:24px; }
  .formula { font-size:16px; color:#f0eeea; }
  .formula .katex { font-size:1em; }

  .controls { display:flex; gap:14px; align-items:center; margin-bottom:12px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .row .name { color:#fff067; font-weight:600; min-width:60px; }
  .row input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:40px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#7a7875; }
  .curve { stroke:#fff067; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .tangent { stroke:#0fee89; stroke-width:2.2; fill:none; }
  .touch { fill:#ff4670; stroke:#ff4670; }
  .rise { stroke:#00abfa; stroke-width:1.5; stroke-dasharray:3 3; }
  .run  { stroke:#00abfa; stroke-width:1.5; stroke-dasharray:3 3; }
  .rise-lbl, .run-lbl { font-family:'Geist Mono',monospace; font-size:10px; fill:#00abfa; }

  .readout {
    margin-top:10px; padding:10px 12px;
    background:#07090d; border:1px solid #141e2a; border-radius:6px;
    font-family:'Geist Mono',monospace; font-size:13px; color:#f0eeea;
    display:flex; justify-content:space-around; flex-wrap:wrap; gap:10px;
  }
  .readout .item .lbl { color:#7a7875; }
  .readout .grad { color:#0fee89; font-weight:600; }
  .readout .pt { color:#ff4670; font-weight:600; }
  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">point x</span>
      <input type="range" id="x0" min="-3" max="3" value="2" step="0.25"/>
      <span class="val" id="vx">2</span>
    </div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="plot-clip">
        <rect x="40" y="14" width="420" height="276"/>
      </clipPath>
    </defs>
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <text class="axis-title" x="250" y="312" text-anchor="middle">x</text>
    <text class="axis-title" x="32" y="20" text-anchor="middle">y</text>

    <g clip-path="url(#plot-clip)">
      <path class="curve" id="curvePath"/>
      <line class="tangent" id="tanLine"/>
      <line class="run" id="runLine"/>
      <line class="rise" id="riseLine"/>
      <text class="run-lbl" id="runLbl"></text>
      <text class="rise-lbl" id="riseLbl"></text>
      <circle class="touch" id="touchDot" r="4"/>
    </g>
  </svg>

  <div class="readout">
    <span class="item"><span class="lbl">touch point:</span> <span class="pt" id="ptVal">(2, 4)</span></span>
    <span class="item"><span class="lbl">rise / run:</span> <span class="grad" id="rrVal">8 / 2</span></span>
    <span class="item"><span class="lbl">gradient:</span> <span class="grad" id="gVal">4</span></span>
  </div>
  <p class="footer">curve y = x² · green tangent kisses the curve at the red point</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var XMIN = -3, XMAX = 3, YMIN = -2, YMAX = 10;
var PX_LEFT = 40, PX_RIGHT = 460;
var PX_TOP  = 14, PX_BOT   = 290;

function xPx(x) { return PX_LEFT + ((x - XMIN) / (XMAX - XMIN)) * (PX_RIGHT - PX_LEFT); }
function yPx(y) { return PX_BOT  - ((y - YMIN) / (YMAX - YMIN)) * (PX_BOT  - PX_TOP);  }

(function buildAxes() {
  var g = document.getElementById("grid");
  var t = document.getElementById("ticks");
  document.getElementById("xAxis").setAttribute("x1", PX_LEFT);
  document.getElementById("xAxis").setAttribute("x2", PX_RIGHT);
  document.getElementById("xAxis").setAttribute("y1", yPx(0));
  document.getElementById("xAxis").setAttribute("y2", yPx(0));
  document.getElementById("yAxis").setAttribute("x1", xPx(0));
  document.getElementById("yAxis").setAttribute("x2", xPx(0));
  document.getElementById("yAxis").setAttribute("y1", PX_TOP);
  document.getElementById("yAxis").setAttribute("y2", PX_BOT);
  for (var x = XMIN; x <= XMAX; x++) {
    var px = xPx(x);
    if (x !== 0) {
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "grid-line");
      line.setAttribute("x1", px); line.setAttribute("x2", px);
      line.setAttribute("y1", PX_TOP); line.setAttribute("y2", PX_BOT);
      g.appendChild(line);
    }
    var tl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tl.setAttribute("class", "axis-tick-label");
    tl.setAttribute("x", px); tl.setAttribute("y", yPx(0) + 14);
    tl.setAttribute("text-anchor", "middle");
    tl.textContent = x;
    t.appendChild(tl);
  }
  for (var y = YMIN; y <= YMAX; y += 2) {
    if (y === 0) continue;
    var py = yPx(y);
    var gl = document.createElementNS("http://www.w3.org/2000/svg", "line");
    gl.setAttribute("class", "grid-line");
    gl.setAttribute("x1", PX_LEFT); gl.setAttribute("x2", PX_RIGHT);
    gl.setAttribute("y1", py); gl.setAttribute("y2", py);
    g.appendChild(gl);
    var tly = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tly.setAttribute("class", "axis-tick-label");
    tly.setAttribute("x", xPx(0) - 6); tly.setAttribute("y", py + 3);
    tly.setAttribute("text-anchor", "end");
    tly.textContent = y;
    t.appendChild(tly);
  }
})();

function curveY(x) { return x * x; }
function tangentSlope(x) { return 2 * x; }

// draw curve once
(function drawCurve() {
  var d = "";
  for (var i = 0; i <= 240; i++) {
    var x = XMIN + (XMAX - XMIN) * (i / 240);
    var y = curveY(x);
    var py = yPx(Math.max(YMIN - 0.5, Math.min(YMAX + 0.5, y)));
    d += (i === 0 ? "M " : " L ") + xPx(x) + " " + py;
  }
  document.getElementById("curvePath").setAttribute("d", d);
})();

var targetX0 = 2, displayX0 = 2;
var SPRING = 0.20;

function fmt(v) {
  var n = Math.round(v * 100) / 100;
  return (n === Math.floor(n)) ? n.toFixed(0) : n.toFixed(2);
}

function tick() {
  displayX0 += (targetX0 - displayX0) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  var x0 = displayX0;
  var y0 = curveY(x0);
  var m = tangentSlope(x0);

  // tangent line: y = m(x - x0) + y0
  // extend across visible x range (clamping to plot region)
  var xL = XMIN, xR = XMAX;
  var yL = m * (xL - x0) + y0;
  var yR = m * (xR - x0) + y0;
  document.getElementById("tanLine").setAttribute("x1", xPx(xL));
  document.getElementById("tanLine").setAttribute("y1", yPx(yL));
  document.getElementById("tanLine").setAttribute("x2", xPx(xR));
  document.getElementById("tanLine").setAttribute("y2", yPx(yR));

  // touch point
  document.getElementById("touchDot").setAttribute("cx", xPx(x0));
  document.getElementById("touchDot").setAttribute("cy", yPx(y0));

  // rise/run triangle: choose two points on tangent, run = 1 unit
  var run = 1;
  var rise = m * run;
  // place triangle to the right of the touch point, but flip if we'd go off-grid
  var bx0 = x0;
  var bx1 = x0 + run;
  if (bx1 > XMAX - 0.3) { bx1 = x0; bx0 = x0 - run; }
  var by0 = m * (bx0 - x0) + y0;
  var by1 = m * (bx1 - x0) + y0;

  // run line (horizontal at the lower of the two y-values)
  var runY = Math.min(by0, by1);
  document.getElementById("runLine").setAttribute("x1", xPx(bx0));
  document.getElementById("runLine").setAttribute("x2", xPx(bx1));
  document.getElementById("runLine").setAttribute("y1", yPx(runY));
  document.getElementById("runLine").setAttribute("y2", yPx(runY));

  // rise line (vertical at the right side, going to the higher y-value)
  var riseX = (by0 < by1) ? bx1 : bx0;
  document.getElementById("riseLine").setAttribute("x1", xPx(riseX));
  document.getElementById("riseLine").setAttribute("x2", xPx(riseX));
  document.getElementById("riseLine").setAttribute("y1", yPx(by0));
  document.getElementById("riseLine").setAttribute("y2", yPx(by1));

  // labels
  document.getElementById("runLbl").setAttribute("x", xPx(0.5 * (bx0 + bx1)));
  document.getElementById("runLbl").setAttribute("y", yPx(runY) + 12);
  document.getElementById("runLbl").setAttribute("text-anchor", "middle");
  document.getElementById("runLbl").textContent = "run = " + fmt(run);

  document.getElementById("riseLbl").setAttribute("x", xPx(riseX) + 4);
  document.getElementById("riseLbl").setAttribute("y", yPx(0.5 * (by0 + by1)));
  document.getElementById("riseLbl").textContent = "rise = " + fmt(rise);

  // formula
  tryRender(document.getElementById("formula"),
    "\\text{tangent at } x = " + fmt(x0) + ":\\;\\; y = " + fmt(m) + "x \\;" + (y0 - m*x0 >= 0 ? "+" : "-") + "\\; " + fmt(Math.abs(y0 - m*x0)));

  // readout
  document.getElementById("ptVal").textContent = "(" + fmt(x0) + ", " + fmt(y0) + ")";
  document.getElementById("rrVal").textContent = fmt(rise) + " / " + fmt(run);
  document.getElementById("gVal").textContent = fmt(m);
}

document.getElementById("x0").addEventListener("input", function(e) {
  targetX0 = parseFloat(e.target.value);
  document.getElementById("vx").textContent = fmt(targetX0);
});
tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
