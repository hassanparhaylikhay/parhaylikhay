<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Angle Rules Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:6px; min-height:22px; }
  .formula { font-size:16px; color:#f0eeea; text-align:center; }
  .formula .katex { font-size:1em; }
  .hint { display:flex; align-items:center; justify-content:center; min-height:16px; margin-bottom:8px; font-size:12.5px; color:#7a7875; }
  .hint .katex { font-size:1em; }

  .controls { display:flex; align-items:center; gap:14px; margin-bottom:12px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:48px; }
  .row input[type=range] { flex:1; min-width:80px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:50px; text-align:right; color:#f0eeea; font-weight:600; }

  .row select {
    appearance:none; -webkit-appearance:none;
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a;
    border-radius:6px; padding:5px 24px 5px 9px;
    font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:500;
    cursor:pointer; outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4 L5 7 L8 4' stroke='%23c8c6be' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 7px center;
  }
  .row select:focus { border-color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }

  .parallel-line { stroke:#3a4a5a; stroke-width:2.5; fill:none; }
  .transversal { stroke:#00abfa; stroke-width:2.5; fill:none; stroke-linecap:round; }
  .intersection-dot { fill:#7a7875; }

  .angle-arc { fill-opacity:0.18; stroke-width:1.6; transition:fill 0.15s, stroke 0.15s, fill-opacity 0.15s; }
  .angle-arc.faded { fill:#3a4a5a; fill-opacity:0.1; stroke:#3a4a5a; }
  .angle-label { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; transition:fill 0.15s; }
  .angle-label.faded { fill:#7a7875; }

  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>
  <div class="hint" id="hint"></div>

  <div class="controls">
    <div class="row" style="flex:0 0 auto;">
      <span class="name">rule</span>
      <select id="mode">
        <option value="all">All angles</option>
        <option value="corr">Corresponding (F-shape)</option>
        <option value="alt">Alternate (Z-shape)</option>
        <option value="coint">Co-interior (C-shape)</option>
        <option value="vert">Vertically opposite</option>
      </select>
    </div>
    <div class="row">
      <span class="name">angle</span>
      <input type="range" id="angle" min="30" max="150" value="65" step="1"/>
      <span class="val" id="vangle">65 deg</span>
    </div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#3a4a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- two parallel lines -->
    <line class="parallel-line" id="lineTop"    x1="50" y1="80"  x2="425" y2="80"  marker-end="url(#arrow)"/>
    <line class="parallel-line" id="lineBottom" x1="50" y1="240" x2="425" y2="240" marker-end="url(#arrow)"/>

    <!-- transversal -->
    <line class="transversal" id="transversal"/>

    <!-- 8 angle arcs and labels: arcs[0..3] at top, arcs[4..7] at bottom -->
    <g id="arcs"></g>
    <g id="labels"></g>

    <!-- intersection dots on top of arcs -->
    <circle class="intersection-dot" id="dotTop"    r="2.5"/>
    <circle class="intersection-dot" id="dotBottom" r="2.5"/>
  </svg>

  <p class="footer">drag the slider · pick a rule from the dropdown</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// Brand colors
var C_YELLOW = "#fff067";
var C_GREEN  = "#0fee89";
var C_PINK   = "#ff4670";
var C_ORANGE = "#ff822c";
var C_BLUE   = "#00abfa";
var C_FADE   = "#3a4a5a";

// Geometry constants
var TOP_Y = 80, BOT_Y = 240;
var SEP = BOT_Y - TOP_Y;       // 160
var X_CENTER = 240;            // visual centre of the figure (between 50 and 430)
var X_MIN = 50, X_MAX = 430;
var ARC_R = 26;
var LABEL_R = 40;

// Build arc and label DOM
var arcsRoot   = document.getElementById("arcs");
var labelsRoot = document.getElementById("labels");
var arcEls = [];
var lblEls = [];
for (var i = 0; i < 8; i++) {
  var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("class", "angle-arc");
  arcsRoot.appendChild(p);
  arcEls.push(p);

  var t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("class", "angle-label");
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("dominant-baseline", "central");
  labelsRoot.appendChild(t);
  lblEls.push(t);
}

// State — URL params let a lesson embed an iframe locked to one rule.
//   ?mode=corr|alt|coint|vert|all  (initial rule)
//   ?lock=1                        (hide the rule selector — angle slider stays)
var qs = new URLSearchParams(location.search);
var initialMode = qs.get("mode") || "all";
var lockMode = qs.get("lock") === "1";

var targetAngle = parseInt(qs.get("angle"), 10);
if (isNaN(targetAngle)) targetAngle = 65;
var displayAngle = targetAngle;
var SPRING = 0.18;
var mode = initialMode;

var modeSel = document.getElementById("mode");
modeSel.value = initialMode;
if (lockMode) {
  // Hide just the rule row; keep the angle slider so the manipulative still
  // animates as the student drags.
  modeSel.parentNode.style.display = "none";
}
document.getElementById("angle").value = targetAngle;
document.getElementById("vangle").textContent = targetAngle + " deg";

document.getElementById("angle").addEventListener("input", function(e) {
  targetAngle = parseInt(e.target.value, 10);
  document.getElementById("vangle").textContent = targetAngle + " deg";
});
modeSel.addEventListener("change", function(e) {
  mode = e.target.value;
});

function tick() {
  displayAngle += (targetAngle - displayAngle) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

// Build an SVG wedge path from math-frame angle a1 to a2 (radians, with
// 0 = +x, pi/2 pointing UP on screen). SVG y grows downward, so we negate
// the y component when placing endpoints. With that mapping, a counter
// clockwise sweep in math frame is also visually counterclockwise on screen,
// which corresponds to SVG sweep-flag = 0.
function arcPath(cx, cy, r, a1, a2) {
  var d = a2 - a1;
  while (d < 0) d += 2 * Math.PI;
  while (d >= 2 * Math.PI) d -= 2 * Math.PI;
  var largeArc = d > Math.PI ? 1 : 0;
  var x1 = cx + r * Math.cos(a1);
  var y1 = cy - r * Math.sin(a1);
  var x2 = cx + r * Math.cos(a2);
  var y2 = cy - r * Math.sin(a2);
  return "M " + cx + " " + cy + " L " + x1 + " " + y1 +
         " A " + r + " " + r + " 0 " + largeArc + " 0 " + x2 + " " + y2 + " Z";
}

function labelPos(cx, cy, r, a1, a2) {
  var mid = (a1 + a2) / 2;
  // Handle wraparound: if a2 < a1, midpoint should be on the other side
  var d = a2 - a1;
  while (d < 0) d += 2 * Math.PI;
  if (d > Math.PI) {
    // shouldn't happen for our sub-180 angles, but safe
  }
  return { x: cx + r * Math.cos(mid), y: cy - r * Math.sin(mid) };
}

function draw() {
  var alpha = displayAngle;          // degrees, the "transversal vs. rightward parallel" angle at top
  var alphaRad = alpha * Math.PI / 180;

  // Geometry: the transversal makes angle alpha with the rightward parallel
  // ray at the top intersection. Going DOWN along the transversal in SVG
  // coords, we move (cos alpha, +sin alpha) per unit. To drop by SEP in the
  // y direction we need SEP/sin(alpha) along the transversal, which yields a
  // horizontal offset of SEP * cos(alpha) / sin(alpha) = SEP / tan(alpha).
  //
  // To keep the figure centred between X_MIN and X_MAX even at extreme
  // angles, place the top and bottom intersections symmetrically about
  // X_CENTER:
  //   topX = X_CENTER - dx/2,  botX = X_CENTER + dx/2,  where dx = SEP/tan(alpha).
  var dx = SEP / Math.tan(alphaRad);
  var topX = X_CENTER - dx / 2;
  var botX = X_CENTER + dx / 2;

  // Compute the two endpoints of the transversal extended past both intersections.
  // Direction (svg) of the transversal going DOWN-right (when alpha acute):
  //   dx_svg = cos(alpha), dy_svg = sin(alpha)  (alpha measured up from +x in math = down from +x in svg... let me re-derive)
  // Set: at the top intersection, the parallel line goes along +x. The angle
  // BELOW the parallel line (between the +x ray and the transversal going DOWN)
  // is alpha. In SVG (y down), "down" = +y direction. So going from the top
  // intersection, the transversal-going-down direction has:
  //   dx_svg =  cos(alpha)    [horizontal component]
  //   dy_svg = +sin(alpha)    [downward in svg]
  // For alpha = 90 -> straight down. For alpha = 60 -> down-right.
  // For alpha = 120 -> cos(120)=-0.5 -> down-left. Good.
  var dxs = Math.cos(alphaRad);
  var dys = Math.sin(alphaRad);
  // Length scale to extend transversal a bit past both lines:
  var extend = 30;
  var topPt = { x: topX - extend * dxs, y: TOP_Y - extend * dys };
  var botPt = { x: botX + extend * dxs, y: BOT_Y + extend * dys };

  var trans = document.getElementById("transversal");
  trans.setAttribute("x1", topPt.x);
  trans.setAttribute("y1", topPt.y);
  trans.setAttribute("x2", botPt.x);
  trans.setAttribute("y2", botPt.y);

  document.getElementById("dotTop").setAttribute("cx", topX);
  document.getElementById("dotTop").setAttribute("cy", TOP_Y);
  document.getElementById("dotBottom").setAttribute("cx", botX);
  document.getElementById("dotBottom").setAttribute("cy", BOT_Y);

  // -----------------------------------------------------------------
  // Angle wedges around each intersection, in MATH-frame angles where 0 = +x
  // and angle increases counterclockwise (in svg, where y is flipped, that
  // remains visually counterclockwise on screen).
  //
  // At each intersection there are 4 rays:
  //   r0: rightward along the parallel       math angle  0
  //   r3: transversal going UP               math angle  pi - alpha
  //   r2: leftward along the parallel        math angle  pi
  //   r1: transversal going DOWN             math angle  2*pi - alpha   ( = -alpha )
  //
  // Wedge sweeps (counterclockwise from one ray to the next):
  //   idx 0 (upper-right): r0 to r3   sweep = pi - alpha
  //   idx 3 (upper-left):  r3 to r2   sweep = alpha
  //   idx 2 (lower-left):  r2 to r1   sweep = pi - alpha
  //   idx 1 (lower-right): r1 to r0   sweep = alpha
  //
  // Both intersections have the same layout because the transversal hits
  // both parallel lines at the same angle.
  //   idx 4..7 mirror idx 0..3 at the bottom intersection.
  //
  // Pair pickings used below:
  //   Corresponding (F-shape):     idx 1 and idx 5      both equal alpha
  //   Alternate interior (Z):      idx 1 and idx 7      both equal alpha
  //   Co-interior (C):             idx 1 and idx 4      sum to 180 deg
  //   Vertically opposite top:     idx 1 and idx 3      both equal alpha
  //   Vertically opposite bottom:  idx 5 and idx 7      both equal alpha
  // -----------------------------------------------------------------

  var alphaDeg  = alpha;
  var betaDeg   = 180 - alpha;

  // Wedge config: { cx, cy, fromAngle, toAngle, valueDeg, ringIdx }
  // Math-frame angles, going counterclockwise.
  var TWO_PI = 2 * Math.PI;
  var aRad = alphaRad;
  var bRad = Math.PI - alphaRad;

  var wedges = [
    // TOP intersection
    { cx: topX, cy: TOP_Y, a1: 0,                 a2: Math.PI - aRad,    val: betaDeg  }, // 0 upper-right
    { cx: topX, cy: TOP_Y, a1: -aRad,             a2: 0,                 val: alphaDeg }, // 1 lower-right (sweep -alpha -> 0 = alpha)
    { cx: topX, cy: TOP_Y, a1: Math.PI,           a2: TWO_PI - aRad,     val: betaDeg  }, // 2 lower-left
    { cx: topX, cy: TOP_Y, a1: Math.PI - aRad,    a2: Math.PI,           val: alphaDeg }, // 3 upper-left
    // BOTTOM intersection (same layout)
    { cx: botX, cy: BOT_Y, a1: 0,                 a2: Math.PI - aRad,    val: betaDeg  }, // 4 upper-right
    { cx: botX, cy: BOT_Y, a1: -aRad,             a2: 0,                 val: alphaDeg }, // 5 lower-right
    { cx: botX, cy: BOT_Y, a1: Math.PI,           a2: TWO_PI - aRad,     val: betaDeg  }, // 6 lower-left
    { cx: botX, cy: BOT_Y, a1: Math.PI - aRad,    a2: Math.PI,           val: alphaDeg }  // 7 upper-left
  ];

  // Color assignment per mode
  // Default: faded
  var colors = new Array(8).fill(null);
  var activePairs = [];   // for heading

  if (mode === "all") {
    // alternate yellow/green/pink/orange around each intersection
    var ring = [C_YELLOW, C_GREEN, C_PINK, C_ORANGE];
    for (var i = 0; i < 8; i++) colors[i] = ring[i % 4];
  } else if (mode === "corr") {
    // pair (1, 5) = both alpha (F-shape)
    colors[1] = C_YELLOW;
    colors[5] = C_YELLOW;
    activePairs = [[1, 5]];
  } else if (mode === "alt") {
    // pair (1, 7) is alternate interior, both alpha
    colors[1] = C_GREEN;
    colors[7] = C_GREEN;
    activePairs = [[1, 7]];
  } else if (mode === "coint") {
    // pair (1, 4) is same side of transversal, between parallels, alpha + (pi-alpha) = pi
    colors[1] = C_PINK;
    colors[4] = C_PINK;
    activePairs = [[1, 4]];
  } else if (mode === "vert") {
    // top pair (1, 3) orange; bottom pair (5, 7) blue
    colors[1] = C_ORANGE;
    colors[3] = C_ORANGE;
    colors[5] = C_BLUE;
    colors[7] = C_BLUE;
    activePairs = [[1, 3], [5, 7]];
  }

  // Render arcs and labels
  for (var k = 0; k < 8; k++) {
    var w = wedges[k];
    var arc = arcEls[k];
    var lbl = lblEls[k];
    arc.setAttribute("d", arcPath(w.cx, w.cy, ARC_R, w.a1, w.a2));
    var lp = labelPos(w.cx, w.cy, LABEL_R, w.a1, w.a2);
    lbl.setAttribute("x", lp.x);
    lbl.setAttribute("y", lp.y);
    lbl.textContent = Math.round(w.val) + "°";

    if (colors[k]) {
      arc.classList.remove("faded");
      arc.setAttribute("fill", colors[k]);
      arc.setAttribute("stroke", colors[k]);
      arc.setAttribute("fill-opacity", "0.22");
      lbl.classList.remove("faded");
      lbl.setAttribute("fill", colors[k]);
    } else {
      arc.classList.add("faded");
      arc.setAttribute("fill", "#3a4a5a");
      arc.setAttribute("stroke", "#3a4a5a");
      arc.setAttribute("fill-opacity", "0.10");
      lbl.classList.add("faded");
      lbl.setAttribute("fill", "#7a7875");
    }
  }

  // Heading
  var headTex;
  var hintTex = "";
  var aShow = Math.round(alphaDeg);
  var bShow = Math.round(betaDeg);

  if (mode === "all") {
    headTex = "\\text{Two parallel lines cut by a transversal}";
  } else if (mode === "corr") {
    // both highlighted angles equal alpha
    headTex = "\\text{Corresponding: } \\textcolor{#fff067}{a} = \\textcolor{#fff067}{b}"
            + "\\quad (" + aShow + "^\\circ = " + aShow + "^\\circ)";
  } else if (mode === "alt") {
    headTex = "\\text{Alternate: } \\textcolor{#0fee89}{a} = \\textcolor{#0fee89}{b}"
            + "\\quad (" + aShow + "^\\circ = " + aShow + "^\\circ)";
  } else if (mode === "coint") {
    headTex = "\\text{Co-interior: } \\textcolor{#ff4670}{a} + \\textcolor{#ff4670}{b} = 180^\\circ";
    hintTex = "\\textcolor{#ff4670}{" + aShow + "^\\circ} + \\textcolor{#ff4670}{" + bShow + "^\\circ} = 180^\\circ";
  } else if (mode === "vert") {
    headTex = "\\text{Vertically opposite: } \\textcolor{#ff822c}{a} = \\textcolor{#ff822c}{b}";
    hintTex = "\\text{top pair } " + aShow + "^\\circ \\text{,  bottom pair } " + aShow + "^\\circ";
  }

  tryRender(document.getElementById("formula"), headTex);
  if (hintTex) {
    tryRender(document.getElementById("hint"), hintTex);
  } else {
    document.getElementById("hint").textContent = "";
  }
}

tick();

// Resize reporter
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
// Re-report after KaTeX renders
setTimeout(reportHeight, 200);
setTimeout(reportHeight, 600);
</script>
</body>
</html>
