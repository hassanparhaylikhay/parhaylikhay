<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SSS Construction Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:22px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .step-num { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }

  .stage-outer {
    width:100%;
    max-width:440px;
    margin:0 auto;
    aspect-ratio: 440 / 340;
    position:relative;
  }
  .stage {
    position:absolute;
    top:0; left:0;
    width:440px;
    height:340px;
    transform-origin: top left;
    overflow:hidden;
    border-radius:6px;
  }

  /* Animation CSS */
  .draw-line {
    transition: width 0.7s cubic-bezier(0.4, 0.1, 0.4, 1);
  }

  .draw-arc {
    clip-path: polygon(0% 0%, 0% 0%, 0% 50%, 0% 50%);
    transition: clip-path 1s cubic-bezier(0.4, 0.1, 0.4, 1);
  }
  .draw-arc.drawn {
    clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 0% 50%);
  }

  .draw-fade {
    opacity: 0;
    transition: opacity 0.35s ease;
    transition-delay: 0.35s;
  }
  .draw-fade.drawn { opacity: 1; }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:80px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl:disabled { opacity:0.3; cursor:not-allowed; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">step 0 — start</span>
    <span class="step-num" id="counter">0 / 5</span>
  </div>
  <div class="stage-outer" id="stage-outer">
    <div class="stage" id="stage"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="prev">← prev</button>
    <button class="ctl" id="next">next →</button>
  </div>
  <p class="footer" id="footer">construct triangle PQR</p>
</div>

<script>
"use strict";

// --- Triangle parameters (configurable via URL params) ----------------
var qs = new URLSearchParams(window.location.search);
var SIDE_PQ = parseFloat(qs.get("pq")) || 8;
var SIDE_PR = parseFloat(qs.get("pr")) || 6;
var SIDE_QR = parseFloat(qs.get("qr")) || 7;
var MEASURE = (qs.get("measure") || "").toLowerCase();  // "qpr", "pqr", "prq" or ""

// Auto-pick a scale that keeps the base within ~330px so the diagram fits the
// 440-wide stage with margin on each side.
var BASE_TARGET_PX = 330;
var SCALE = Math.min(36, BASE_TARGET_PX / SIDE_PQ);

var P = { x: 30, y: 290 };
var Q = { x: P.x + SIDE_PQ * SCALE, y: P.y };
var d = (SIDE_PQ * SIDE_PQ + SIDE_PR * SIDE_PR - SIDE_QR * SIDE_QR) / (2 * SIDE_PQ);
var h = Math.sqrt(SIDE_PR * SIDE_PR - d * d);
var R = { x: P.x + d * SCALE, y: P.y - h * SCALE };
var PR_px = SIDE_PR * SCALE;
var QR_px = SIDE_QR * SCALE;

function fmtNum(x) {
  // Drop a trailing ".0" if present
  return (Math.round(x * 100) / 100).toString();
}

function angleAt(apex, sideEnd1, sideEnd2) {
  var v1x = sideEnd1.x - apex.x, v1y = sideEnd1.y - apex.y;
  var v2x = sideEnd2.x - apex.x, v2y = sideEnd2.y - apex.y;
  var dot = v1x * v2x + v1y * v2y;
  var m1 = Math.sqrt(v1x * v1x + v1y * v1y);
  var m2 = Math.sqrt(v2x * v2x + v2y * v2y);
  return Math.acos(Math.max(-1, Math.min(1, dot / (m1 * m2)))) * 180 / Math.PI;
}

// --- Stage scaling ----------------------------------------------------
var stage = document.getElementById("stage");
var stageOuter = document.getElementById("stage-outer");
var STAGE_W = 440, STAGE_H = 340;

function fitStage() {
  var w = stageOuter.clientWidth;
  if (!w) return;
  var s = w / STAGE_W;
  stage.style.transform = "scale(" + s + ")";
}
fitStage();
window.addEventListener("resize", fitStage);
if (window.ResizeObserver) {
  new ResizeObserver(fitStage).observe(stageOuter);
}

// --- DOM builders -----------------------------------------------------
function setStyle(el, s) { for (var k in s) el.style[k] = s[k]; }

function makeNode(tag, style, dataStep, cls) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  setStyle(n, style);
  if (dataStep != null) n.dataset.step = String(dataStep);
  stage.appendChild(n);
  return n;
}

// Straight line from (x1,y1) to (x2,y2) using a rotated thin div.
// Animated by transitioning the `width` from 0 to its full length.
function lineEl(x1, y1, x2, y2, color, thickness, dashed, dataStep) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  var t = thickness || 2;
  var s = {
    position: "absolute",
    left: x1 + "px",
    top: y1 + "px",
    width: "0px",
    height: t + "px",
    transformOrigin: "0 50%",
    transform: "translateY(" + (-t / 2) + "px) rotate(" + ang + "deg)"
  };
  if (dashed) {
    s.background = "transparent";
    s.borderTop = t + "px dashed " + color;
    s.height = "0px";
  } else {
    s.background = color;
  }
  var node = makeNode("div", s, dataStep, "draw-line");
  node._fullWidth = len;
  return node;
}

// Filled circle dot of size px at (x,y). Fades in on draw.
function dotEl(x, y, color, size, dataStep) {
  var sz = size || 7;
  return makeNode("div", {
    position: "absolute",
    left: (x - sz / 2) + "px",
    top: (y - sz / 2) + "px",
    width: sz + "px",
    height: sz + "px",
    borderRadius: "50%",
    background: color
  }, dataStep, "draw-fade");
}

// Upper-half arc of a circle of radius r centred at (cx,cy).
// The 2r x 2r div has a border-radius:50% border; the .draw-arc
// clip-path animates from a degenerate left-edge polygon to the
// full upper-half rectangle, sweeping the visible arc left-to-right.
function arcUpperEl(cx, cy, r, color, thickness, dashed, dataStep) {
  var t = thickness || 1.5;
  return makeNode("div", {
    position: "absolute",
    left: (cx - r) + "px",
    top: (cy - r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    borderRadius: "50%",
    border: t + "px " + (dashed ? "dashed" : "solid") + " " + color,
    pointerEvents: "none"
  }, dataStep, "draw-arc");
}

// Filled angular wedge centred at (cx, cy) of radius r.
// fromConicDeg = angle (conic, 0=top, CW) where the visible wedge starts.
// sweepDeg     = angular extent of the wedge.
function wedgeEl(cx, cy, r, fromConicDeg, sweepDeg, color, dataStep) {
  return makeNode("div", {
    position: "absolute",
    left: (cx - r) + "px",
    top: (cy - r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    borderRadius: "50%",
    background: "conic-gradient(from " + fromConicDeg + "deg, " + color + " 0deg, " + color + " " + sweepDeg + "deg, transparent " + sweepDeg + "deg, transparent 360deg)",
    pointerEvents: "none"
  }, dataStep, "draw-fade");
}

function labelEl(x, y, text, color, fontSize, dataStep, opts) {
  opts = opts || {};
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px",
    top: y + "px",
    fontFamily: "'Geist Mono', monospace",
    fontSize: (fontSize || 11) + "px",
    color: color,
    fontWeight: opts.weight || "700",
    whiteSpace: "nowrap",
    pointerEvents: "none"
  }, dataStep, "draw-fade");
  n.textContent = text;
  return n;
}

// === Build the construction ==========================================

// Reference rule (faint, always visible)
makeNode("div", {
  position: "absolute",
  left: P.x + "px",
  top: P.y + "px",
  width: (SIDE_PQ * SCALE) + "px",
  height: "0",
  borderTop: "1px solid #1a2330"
});

// Step 1 — base PQ
lineEl(P.x, P.y, Q.x, Q.y, "#00abfa", 2.5, false, 1);
dotEl(P.x, P.y, "#0fee89", 8, 1);
dotEl(Q.x, Q.y, "#0fee89", 8, 1);
labelEl(P.x - 16, P.y + 8, "P", "#0fee89", 14, 1);
labelEl(Q.x + 8, Q.y + 8, "Q", "#0fee89", 14, 1);
labelEl((P.x + Q.x) / 2 - 22, P.y + 18, fmtNum(SIDE_PQ) + " cm", "#00abfa", 12, 1, { weight: "600" });

// Step 2 — arc 1 from P
arcUpperEl(P.x, P.y, PR_px, "#fff067", 1.6, true, 2);
labelEl(8, 32, "arc 1: r = " + fmtNum(SIDE_PR) + " cm", "#fff067", 11, 2, { weight: "600" });

// Step 3 — arc 2 from Q
arcUpperEl(Q.x, Q.y, QR_px, "#ff822c", 1.6, true, 3);
labelEl(330, 32, "arc 2: r = " + fmtNum(SIDE_QR) + " cm", "#ff822c", 11, 3, { weight: "600" });

// Step 4 — mark intersection R
dotEl(R.x, R.y, "#ff4670", 10, 4);
labelEl(R.x - 6, R.y - 24, "R", "#ff4670", 14, 4);

// Step 5 — join PR and QR
lineEl(P.x, P.y, R.x, R.y, "#00abfa", 2.5, false, 5);
lineEl(Q.x, Q.y, R.x, R.y, "#00abfa", 2.5, false, 5);

// Step 6 (optional) — measure the requested angle
var measureAngleVal = null;
var measureLabel = "";
if (MEASURE === "qpr" || MEASURE === "rpq") {
  measureAngleVal = angleAt(P, Q, R);
  // Wedge centred at P. From PR direction (conic angle) sweeping CW to PQ direction.
  var fromConic = Math.atan2(R.x - P.x, -(R.y - P.y)) * 180 / Math.PI;
  var sweep = measureAngleVal;
  wedgeEl(P.x, P.y, 28, fromConic, sweep, "#fff06738", 6);
  // Label position along the bisector of the wedge
  var mid = fromConic + sweep / 2;
  var midRad = mid * Math.PI / 180;
  var lx = P.x + 38 * Math.sin(midRad) - 14;
  var ly = P.y - 38 * Math.cos(midRad) - 8;
  labelEl(lx, ly, Math.round(measureAngleVal) + "°", "#fff067", 13, 6);
  labelEl(P.x + 60, P.y - 44, "∠QPR ≈ " + Math.round(measureAngleVal) + "°", "#fff067", 11, 6, { weight: "600" });
  measureLabel = "step 6 — measure ∠QPR with a protractor";
} else if (MEASURE === "pqr" || MEASURE === "rqp") {
  measureAngleVal = angleAt(Q, P, R);
  var fromConic2 = Math.atan2(P.x - Q.x, -(P.y - Q.y)) * 180 / Math.PI;
  var sweep2 = measureAngleVal;
  wedgeEl(Q.x, Q.y, 28, fromConic2, sweep2, "#fff06738", 6);
  var mid2 = fromConic2 + sweep2 / 2;
  var midRad2 = mid2 * Math.PI / 180;
  var lx2 = Q.x + 38 * Math.sin(midRad2) - 14;
  var ly2 = Q.y - 38 * Math.cos(midRad2) - 8;
  labelEl(lx2, ly2, Math.round(measureAngleVal) + "°", "#fff067", 13, 6);
  labelEl(Q.x - 130, Q.y - 44, "∠PQR ≈ " + Math.round(measureAngleVal) + "°", "#fff067", 11, 6, { weight: "600" });
  measureLabel = "step 6 — measure ∠PQR with a protractor";
} else if (MEASURE === "prq" || MEASURE === "qrp") {
  measureAngleVal = angleAt(R, P, Q);
  var fromConic3 = Math.atan2(P.x - R.x, -(P.y - R.y)) * 180 / Math.PI;
  var sweep3 = measureAngleVal;
  wedgeEl(R.x, R.y, 22, fromConic3, sweep3, "#fff06738", 6);
  var mid3 = fromConic3 + sweep3 / 2;
  var midRad3 = mid3 * Math.PI / 180;
  var lx3 = R.x + 32 * Math.sin(midRad3) - 14;
  var ly3 = R.y - 32 * Math.cos(midRad3) - 8;
  labelEl(lx3, ly3, Math.round(measureAngleVal) + "°", "#fff067", 13, 6);
  labelEl(R.x + 18, R.y + 18, "∠PRQ ≈ " + Math.round(measureAngleVal) + "°", "#fff067", 11, 6, { weight: "600" });
  measureLabel = "step 6 — measure ∠PRQ with a protractor";
}

// === Step controller =================================================

var STEPS = [
  "step 0 — start",
  "step 1 — draw base PQ = " + fmtNum(SIDE_PQ) + " cm",
  "step 2 — set compass to " + fmtNum(SIDE_PR) + " cm, swing arc from P",
  "step 3 — set compass to " + fmtNum(SIDE_QR) + " cm, swing arc from Q",
  "step 4 — the two arcs cross at R",
  "step 5 — join PR and QR to complete the triangle"
];
if (measureLabel) STEPS.push(measureLabel);

var step = 0;
var maxStep = STEPS.length - 1;

var titleEl = document.getElementById("title");
var counterEl = document.getElementById("counter");
var prevBtn = document.getElementById("prev");
var nextBtn = document.getElementById("next");

function setStep(n) {
  step = Math.max(0, Math.min(maxStep, n));
  titleEl.textContent = STEPS[step];
  counterEl.textContent = step + " / " + maxStep;
  var els = stage.querySelectorAll("[data-step]");
  for (var i = 0; i < els.length; i++) {
    var s = parseInt(els[i].dataset.step, 10);
    var el = els[i];
    if (s <= step) {
      el.classList.add("drawn");
      if (el._fullWidth != null) el.style.width = el._fullWidth + "px";
    } else {
      el.classList.remove("drawn");
      if (el._fullWidth != null) el.style.width = "0px";
    }
  }
  prevBtn.disabled = (step === 0);
  nextBtn.disabled = (step === maxStep);
}

prevBtn.onclick = function() { setStep(step - 1); };
nextBtn.onclick = function() { setStep(step + 1); };

// Footer text reflects the current parameters
document.getElementById("footer").textContent =
  "construct triangle PQR (PQ = " + fmtNum(SIDE_PQ) +
  " cm, PR = " + fmtNum(SIDE_PR) +
  " cm, QR = " + fmtNum(SIDE_QR) + " cm)" +
  (measureLabel ? " — and measure ∠" + MEASURE.toUpperCase() : "");

setStep(0);

// === Height reporter =================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
