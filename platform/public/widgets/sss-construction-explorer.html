<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SSS Construction Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:22px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .step-num { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .stage-wrap { display:flex; justify-content:center; }
  .stage {
    position:relative;
    width:360px;
    height:270px;
    overflow:hidden;
    border-radius:6px;
  }

  .controls { display:flex; gap:6px; justify-content:center; margin-top:14px; align-items:center; flex-wrap:wrap; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11px; font-weight:600;
    padding:6px 10px; border-radius:6px; cursor:pointer; min-width:38px;
    transition: color 0.12s, border-color 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl.play { color:#0fee89; border-color:#0fee89; }
  button.ctl.play:hover:not(:disabled) { color:#0fee89; border-color:#0fee89; background:#0fee8910; }
  button.ctl:disabled { opacity:0.3; cursor:not-allowed; }

  .dots { display:flex; gap:5px; margin-left:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#141e2a; transition: background 0.12s; }
  .dot.on { background:#fff067; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">step 0 — start</span>
    <span class="step-num" id="counter">0 / 5</span>
  </div>
  <div class="stage-wrap">
    <div class="stage" id="stage"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="reset" title="reset">⟲</button>
    <button class="ctl" id="prev">prev</button>
    <button class="ctl play" id="play">▶ play</button>
    <button class="ctl" id="next">next</button>
    <div class="dots" id="dots"></div>
  </div>
  <p class="footer">construct triangle PQR (PQ = 8 cm, PR = 6 cm, QR = 7 cm) — step through the construction</p>
</div>

<script>
"use strict";

// Triangle parameters in cm
var SIDE_PQ = 8, SIDE_PR = 6, SIDE_QR = 7;
var SCALE = 30;  // px per cm

// Compute geometry (P at left, Q at right; R above the base)
var P = { x: 40, y: 220 };
var Q = { x: P.x + SIDE_PQ * SCALE, y: P.y };
var d = (SIDE_PQ * SIDE_PQ + SIDE_PR * SIDE_PR - SIDE_QR * SIDE_QR) / (2 * SIDE_PQ);
var h = Math.sqrt(SIDE_PR * SIDE_PR - d * d);
var R = { x: P.x + d * SCALE, y: P.y - h * SCALE };
var PR_px = SIDE_PR * SCALE;
var QR_px = SIDE_QR * SCALE;

var stage = document.getElementById("stage");

function setStyle(el, s) { for (var k in s) el.style[k] = s[k]; }

function makeNode(tag, style, dataStep) {
  var n = document.createElement(tag);
  setStyle(n, style);
  if (dataStep != null) n.dataset.step = String(dataStep);
  stage.appendChild(n);
  return n;
}

// Straight line from (x1,y1) to (x2,y2) using a rotated thin div
function lineEl(x1, y1, x2, y2, color, thickness, dashed, dataStep) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  var t = thickness || 2;
  var s = {
    position: "absolute",
    left: x1 + "px",
    top: y1 + "px",
    width: len + "px",
    height: t + "px",
    transformOrigin: "0 50%",
    transform: "translateY(" + (-t / 2) + "px) rotate(" + ang + "deg)"
  };
  if (dashed) {
    s.background = "transparent";
    s.borderTop = t + "px dashed " + color;
    s.height = "0";
  } else {
    s.background = color;
  }
  return makeNode("div", s, dataStep);
}

// Filled circle dot of radius r at (x,y)
function dotEl(x, y, color, size, dataStep) {
  var s = size || 7;
  return makeNode("div", {
    position: "absolute",
    left: (x - s / 2) + "px",
    top: (y - s / 2) + "px",
    width: s + "px",
    height: s + "px",
    borderRadius: "50%",
    background: color
  }, dataStep);
}

// Upper-half arc of a circle of radius r centred at (cx,cy)
function arcUpperEl(cx, cy, r, color, thickness, dashed, dataStep) {
  var t = thickness || 1.5;
  return makeNode("div", {
    position: "absolute",
    left: (cx - r) + "px",
    top: (cy - r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    borderRadius: "50%",
    border: t + "px " + (dashed ? "dashed" : "solid") + " " + color,
    clipPath: "polygon(0% 0%, 100% 0%, 100% 50%, 0% 50%)",
    pointerEvents: "none"
  }, dataStep);
}

// Text label
function labelEl(x, y, text, color, fontSize, dataStep, opts) {
  opts = opts || {};
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px",
    top: y + "px",
    fontFamily: "'Geist Mono', monospace",
    fontSize: (fontSize || 11) + "px",
    color: color,
    fontWeight: opts.weight || "700",
    whiteSpace: "nowrap",
    pointerEvents: "none"
  }, dataStep);
  n.textContent = text;
  return n;
}

// === Build the construction ============================================

// STEP 0: empty stage with a faint reference rule mark (always visible)
makeNode("div", {
  position: "absolute",
  left: P.x + "px",
  top: P.y + "px",
  width: (SIDE_PQ * SCALE) + "px",
  height: "0",
  borderTop: "1px solid #1a2330"
});

// STEP 1: draw the base PQ
lineEl(P.x, P.y, Q.x, Q.y, "#00abfa", 2, false, 1);
dotEl(P.x, P.y, "#0fee89", 7, 1);
dotEl(Q.x, Q.y, "#0fee89", 7, 1);
labelEl(P.x - 14, P.y + 6, "P", "#0fee89", 13, 1);
labelEl(Q.x + 6, Q.y + 6, "Q", "#0fee89", 13, 1);
labelEl((P.x + Q.x) / 2 - 18, P.y + 16, "8 cm", "#00abfa", 11, 1, { weight: "600" });

// STEP 2: arc from P with radius 6 cm
arcUpperEl(P.x, P.y, PR_px, "#fff067", 1.5, true, 2);
labelEl(P.x + 60, P.y - 100, "arc 1: r = 6", "#fff067", 10, 2, { weight: "600" });

// STEP 3: arc from Q with radius 7 cm
arcUpperEl(Q.x, Q.y, QR_px, "#ff822c", 1.5, true, 3);
labelEl(Q.x - 130, Q.y - 100, "arc 2: r = 7", "#ff822c", 10, 3, { weight: "600" });

// STEP 4: mark intersection R
dotEl(R.x, R.y, "#ff4670", 9, 4);
labelEl(R.x - 4, R.y - 20, "R", "#ff4670", 13, 4);

// STEP 5: draw PR and QR
lineEl(P.x, P.y, R.x, R.y, "#00abfa", 2, false, 5);
lineEl(Q.x, Q.y, R.x, R.y, "#00abfa", 2, false, 5);

// === Step controller ===================================================

var STEPS = [
  "step 0 — start",
  "step 1 — draw base PQ = 8 cm",
  "step 2 — set compass to 6 cm, swing arc from P",
  "step 3 — set compass to 7 cm, swing arc from Q",
  "step 4 — the two arcs cross at R",
  "step 5 — join PR and QR to complete the triangle"
];

var step = 0;
var maxStep = STEPS.length - 1;
var playTimer = null;

var titleEl = document.getElementById("title");
var counterEl = document.getElementById("counter");
var dotsEl = document.getElementById("dots");
var prevBtn = document.getElementById("prev");
var nextBtn = document.getElementById("next");
var resetBtn = document.getElementById("reset");
var playBtn = document.getElementById("play");

// Build dot indicators
for (var i = 0; i <= maxStep; i++) {
  var d = document.createElement("div");
  d.className = "dot";
  dotsEl.appendChild(d);
}
var dotEls = dotsEl.querySelectorAll(".dot");

function setStep(n) {
  step = Math.max(0, Math.min(maxStep, n));
  titleEl.textContent = STEPS[step];
  counterEl.textContent = step + " / " + maxStep;
  var els = stage.querySelectorAll("[data-step]");
  for (var i = 0; i < els.length; i++) {
    var s = parseInt(els[i].dataset.step, 10);
    els[i].style.display = (s <= step) ? "" : "none";
  }
  prevBtn.disabled = (step === 0);
  nextBtn.disabled = (step === maxStep);
  for (var j = 0; j < dotEls.length; j++) {
    if (j === step) dotEls[j].classList.add("on");
    else dotEls[j].classList.remove("on");
  }
}

function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  playBtn.textContent = "▶ play";
}

prevBtn.onclick = function() { stopPlay(); setStep(step - 1); };
nextBtn.onclick = function() { stopPlay(); setStep(step + 1); };
resetBtn.onclick = function() { stopPlay(); setStep(0); };
playBtn.onclick = function() {
  if (playTimer) { stopPlay(); return; }
  if (step >= maxStep) setStep(0);
  playBtn.textContent = "❚❚ pause";
  playTimer = setInterval(function() {
    if (step >= maxStep) { stopPlay(); return; }
    setStep(step + 1);
  }, 1100);
};

setStep(0);

// === Height reporter ====================================================

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
