<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SSS Construction Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:22px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .step-num { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }

  .stage-outer {
    width:100%;
    max-width:440px;
    margin:0 auto;
    aspect-ratio: 440 / 340;
    position:relative;
  }
  .stage {
    position:absolute;
    top:0; left:0;
    width:440px;
    height:340px;
    transform-origin: top left;
    overflow:hidden;
    border-radius:6px;
  }

  /* Animation CSS */
  .draw-line {
    width: 0;
    transition: width 0.7s cubic-bezier(0.4, 0.1, 0.4, 1);
  }
  .draw-line.drawn { width: var(--draw-len); }

  .draw-arc {
    clip-path: polygon(0% 0%, 0% 0%, 0% 50%, 0% 50%);
    transition: clip-path 1s cubic-bezier(0.4, 0.1, 0.4, 1);
  }
  .draw-arc.drawn {
    clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 0% 50%);
  }

  .draw-fade {
    opacity: 0;
    transition: opacity 0.35s ease;
    transition-delay: 0.35s;
  }
  .draw-fade.drawn { opacity: 1; }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:80px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl:disabled { opacity:0.3; cursor:not-allowed; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title">step 0 — start</span>
    <span class="step-num" id="counter">0 / 5</span>
  </div>
  <div class="stage-outer" id="stage-outer">
    <div class="stage" id="stage"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="prev">← prev</button>
    <button class="ctl" id="next">next →</button>
  </div>
  <p class="footer">construct triangle PQR (PQ = 8 cm, PR = 6 cm, QR = 7 cm)</p>
</div>

<script>
"use strict";

// --- Triangle parameters and geometry ---------------------------------
var SIDE_PQ = 8, SIDE_PR = 6, SIDE_QR = 7;
var SCALE = 36;  // px per cm

var P = { x: 30, y: 290 };
var Q = { x: P.x + SIDE_PQ * SCALE, y: P.y };
var d = (SIDE_PQ * SIDE_PQ + SIDE_PR * SIDE_PR - SIDE_QR * SIDE_QR) / (2 * SIDE_PQ);
var h = Math.sqrt(SIDE_PR * SIDE_PR - d * d);
var R = { x: P.x + d * SCALE, y: P.y - h * SCALE };
var PR_px = SIDE_PR * SCALE;
var QR_px = SIDE_QR * SCALE;

// --- Stage scaling ----------------------------------------------------
var stage = document.getElementById("stage");
var stageOuter = document.getElementById("stage-outer");
var STAGE_W = 440, STAGE_H = 340;

function fitStage() {
  var w = stageOuter.clientWidth;
  if (!w) return;
  var s = w / STAGE_W;
  stage.style.transform = "scale(" + s + ")";
}
fitStage();
window.addEventListener("resize", fitStage);
if (window.ResizeObserver) {
  new ResizeObserver(fitStage).observe(stageOuter);
}

// --- DOM builders -----------------------------------------------------
function setStyle(el, s) { for (var k in s) el.style[k] = s[k]; }

function makeNode(tag, style, dataStep, cls) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  setStyle(n, style);
  if (dataStep != null) n.dataset.step = String(dataStep);
  stage.appendChild(n);
  return n;
}

// Straight line from (x1,y1) to (x2,y2) using a rotated thin div.
// Animated by transitioning the `width` from 0 to its full length.
function lineEl(x1, y1, x2, y2, color, thickness, dashed, dataStep) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  var t = thickness || 2;
  var s = {
    position: "absolute",
    left: x1 + "px",
    top: y1 + "px",
    height: t + "px",
    transformOrigin: "0 50%",
    transform: "translateY(" + (-t / 2) + "px) rotate(" + ang + "deg)"
  };
  if (dashed) {
    s.background = "transparent";
    s.borderTop = t + "px dashed " + color;
    s.height = "0";
  } else {
    s.background = color;
  }
  s["--draw-len"] = len + "px";
  return makeNode("div", s, dataStep, "draw-line");
}

// Filled circle dot of size px at (x,y). Fades in on draw.
function dotEl(x, y, color, size, dataStep) {
  var sz = size || 7;
  return makeNode("div", {
    position: "absolute",
    left: (x - sz / 2) + "px",
    top: (y - sz / 2) + "px",
    width: sz + "px",
    height: sz + "px",
    borderRadius: "50%",
    background: color
  }, dataStep, "draw-fade");
}

// Upper-half arc of a circle of radius r centred at (cx,cy).
// The 2r x 2r div has a border-radius:50% border; the .draw-arc
// clip-path animates from a degenerate left-edge polygon to the
// full upper-half rectangle, sweeping the visible arc left-to-right.
function arcUpperEl(cx, cy, r, color, thickness, dashed, dataStep) {
  var t = thickness || 1.5;
  return makeNode("div", {
    position: "absolute",
    left: (cx - r) + "px",
    top: (cy - r) + "px",
    width: (2 * r) + "px",
    height: (2 * r) + "px",
    borderRadius: "50%",
    border: t + "px " + (dashed ? "dashed" : "solid") + " " + color,
    pointerEvents: "none"
  }, dataStep, "draw-arc");
}

function labelEl(x, y, text, color, fontSize, dataStep, opts) {
  opts = opts || {};
  var n = makeNode("div", {
    position: "absolute",
    left: x + "px",
    top: y + "px",
    fontFamily: "'Geist Mono', monospace",
    fontSize: (fontSize || 11) + "px",
    color: color,
    fontWeight: opts.weight || "700",
    whiteSpace: "nowrap",
    pointerEvents: "none"
  }, dataStep, "draw-fade");
  n.textContent = text;
  return n;
}

// === Build the construction ==========================================

// Reference rule (faint, always visible)
makeNode("div", {
  position: "absolute",
  left: P.x + "px",
  top: P.y + "px",
  width: (SIDE_PQ * SCALE) + "px",
  height: "0",
  borderTop: "1px solid #1a2330"
});

// Step 1 — base PQ
lineEl(P.x, P.y, Q.x, Q.y, "#00abfa", 2.5, false, 1);
dotEl(P.x, P.y, "#0fee89", 8, 1);
dotEl(Q.x, Q.y, "#0fee89", 8, 1);
labelEl(P.x - 16, P.y + 8, "P", "#0fee89", 14, 1);
labelEl(Q.x + 8, Q.y + 8, "Q", "#0fee89", 14, 1);
labelEl((P.x + Q.x) / 2 - 22, P.y + 18, "8 cm", "#00abfa", 12, 1, { weight: "600" });

// Step 2 — arc 1 from P
arcUpperEl(P.x, P.y, PR_px, "#fff067", 1.6, true, 2);
labelEl(P.x + 50, P.y - 130, "arc 1: r = 6 cm", "#fff067", 11, 2, { weight: "600" });

// Step 3 — arc 2 from Q
arcUpperEl(Q.x, Q.y, QR_px, "#ff822c", 1.6, true, 3);
labelEl(Q.x - 168, Q.y - 130, "arc 2: r = 7 cm", "#ff822c", 11, 3, { weight: "600" });

// Step 4 — mark intersection R
dotEl(R.x, R.y, "#ff4670", 10, 4);
labelEl(R.x - 6, R.y - 24, "R", "#ff4670", 14, 4);

// Step 5 — join PR and QR
lineEl(P.x, P.y, R.x, R.y, "#00abfa", 2.5, false, 5);
lineEl(Q.x, Q.y, R.x, R.y, "#00abfa", 2.5, false, 5);

// === Step controller =================================================

var STEPS = [
  "step 0 — start",
  "step 1 — draw base PQ = 8 cm",
  "step 2 — set compass to 6 cm, swing arc from P",
  "step 3 — set compass to 7 cm, swing arc from Q",
  "step 4 — the two arcs cross at R",
  "step 5 — join PR and QR to complete the triangle"
];

var step = 0;
var maxStep = STEPS.length - 1;

var titleEl = document.getElementById("title");
var counterEl = document.getElementById("counter");
var prevBtn = document.getElementById("prev");
var nextBtn = document.getElementById("next");

function setStep(n) {
  step = Math.max(0, Math.min(maxStep, n));
  titleEl.textContent = STEPS[step];
  counterEl.textContent = step + " / " + maxStep;
  var els = stage.querySelectorAll("[data-step]");
  for (var i = 0; i < els.length; i++) {
    var s = parseInt(els[i].dataset.step, 10);
    if (s <= step) els[i].classList.add("drawn");
    else els[i].classList.remove("drawn");
  }
  prevBtn.disabled = (step === 0);
  nextBtn.disabled = (step === maxStep);
}

prevBtn.onclick = function() { setStep(step - 1); };
nextBtn.onclick = function() { setStep(step + 1); };

setStep(0);

// === Height reporter =================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
