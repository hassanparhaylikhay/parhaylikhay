<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Static Graph</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }

  /* Single-shape layout */
  .wrap-single { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .formula-head { display:flex; justify-content:center; margin-bottom:10px; min-height:24px; }
  .formula-head .lbl { color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; margin-right:8px; align-self:center; }
  .formula-head .eq { color:#0fee89; font-size:16px; }
  .formula-head .eq .katex { font-size:1em; }

  /* Gallery layout */
  .wrap-gallery { max-width:696px; margin:0 auto; }
  .gallery-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:14px; }
  .card { background:#0b1118; border:1px solid #141e2a; border-radius:8px; padding:12px 10px; }
  .card .eq-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:6px; min-height:22px; }
  .card .eq-row .eq { color:#0fee89; font-size:13px; }
  .card .eq-row .eq .katex { font-size:1em; }
  .card .eq-row .nval { color:#7a7875; font-family:'Geist Mono',monospace; font-size:10px; }
  .card .feat { color:#7a7875; font-family:'Geist Mono',monospace; font-size:10px; text-align:center; margin-top:6px; line-height:1.35; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#7a7875; }
  .curve { stroke:#fff067; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

// ===== KaTeX render helper =====
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// ===== Catmull-Rom → cubic Bezier path =====
// Produces a smooth curve through all sample points. Input: [{x, y}, ...].
// Skips segments where either endpoint is null (used to break at asymptotes / domain edges).
function catmullRomPath(points) {
  if (points.length < 2) return "";
  let d = "";
  let started = false;
  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i];
    const p2 = points[i + 1];
    if (!p1 || !p2) { started = false; continue; }
    const p0 = points[i - 1] || p1;
    const p3 = points[i + 2] || p2;
    if (!started) { d += "M " + p1.x.toFixed(2) + " " + p1.y.toFixed(2); started = true; }
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += " C " + c1x.toFixed(2) + " " + c1y.toFixed(2) +
         ", " + c2x.toFixed(2) + " " + c2y.toFixed(2) +
         ", " + p2.x.toFixed(2) + " " + p2.y.toFixed(2);
  }
  return d;
}

// ===== Shape definitions =====
// Each shape provides: TeX label (with `${a}` placeholder for formula generation),
// f(a, x), domain bounds, and whether it has two branches (split at x=0).
const SHAPES = {
  lin:   { feat: "line through origin",                f: (a,x) => a*x,                       texPattern: "y = ${a}x",            galleryTex: "y = x",                domain: [-3, 3], split: false, firstQuadrantOnly: false },
  sq:    { feat: "parabola, vertex at origin",         f: (a,x) => a*x*x,                     texPattern: "y = ${a}x^2",          galleryTex: "y = x^2",              domain: [-3, 3], split: false, firstQuadrantOnly: false },
  cub:   { feat: "S-curve, inflection at origin",      f: (a,x) => a*x*x*x,                   texPattern: "y = ${a}x^3",          galleryTex: "y = x^3",              domain: [-3, 3], split: false, firstQuadrantOnly: false },
  sqrt:  { feat: "x ≥ 0 only, rises and flattens",     f: (a,x) => x < 0 ? NaN : a*Math.sqrt(x), texPattern: "y = ${a}\\sqrt{x}",  galleryTex: "y = \\sqrt{x}",        domain: [0, 4],  split: false, firstQuadrantOnly: true  },
  rec:   { feat: "two branches in Q1 and Q3",          f: (a,x) => Math.abs(x) < 0.001 ? NaN : a/x,        texPattern: "y = \\dfrac{${a}}{x}",   galleryTex: "y = \\dfrac{1}{x}",   domain: [-4, 4], split: true,  firstQuadrantOnly: false },
  rec2:  { feat: "two branches both above x-axis",     f: (a,x) => Math.abs(x) < 0.001 ? NaN : a/(x*x),    texPattern: "y = \\dfrac{${a}}{x^2}", galleryTex: "y = \\dfrac{1}{x^2}", domain: [-4, 4], split: true,  firstQuadrantOnly: false },
  const: { feat: "horizontal line at y = 1",           f: (a,x) => a,                         texPattern: "y = ${a}",             galleryTex: "y = 1",                domain: [-3, 3], split: false, firstQuadrantOnly: false },
};

const SHAPE_ORDER = ["lin", "sq", "cub", "sqrt", "rec", "rec2", "const"];

function fmtA(a) {
  const n = Math.round(a * 10) / 10;
  return (n === Math.floor(n)) ? n.toFixed(0) : n.toFixed(1);
}

function texFor(shape, a) {
  return SHAPES[shape].texPattern.replace("${a}", fmtA(a));
}

// ===== Build SVG for a single shape =====
// `large` = section-graph format (480×320, 50 px/unit, x [-4,4], y [-2.5, 2.5] for centred-axis shapes).
// `mini`  = grid card format (170×140, 20 px/unit, x [-2.5, 2.5], y [-2, 2]).
// firstQuadrantOnly shapes get an L-shaped axis at left/bottom and a [0, max] range.

function buildSVG(shape, a, format) {
  const sh = SHAPES[shape];
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("xmlns", NS);

  let plotW, plotH, marginL, marginR, marginT, marginB;
  let xMin, xMax, yMin, yMax, pxPerUnit;

  if (format === "large") {
    plotW = 400; plotH = 200; marginL = 50; marginR = 30; marginT = 20; marginB = 30;
    pxPerUnit = 50; // 50 px = 1 unit on both axes
    if (sh.firstQuadrantOnly) {
      xMin = 0; xMax = 4; yMin = 0; yMax = 3;
      plotW = (xMax - xMin) * pxPerUnit; plotH = (yMax - yMin) * pxPerUnit;
    } else {
      xMin = -4; xMax = 4; yMin = -2; yMax = 2;
      plotW = (xMax - xMin) * pxPerUnit; plotH = (yMax - yMin) * pxPerUnit;
    }
  } else {
    // Mini cards: keep total viewBox identical for every shape so the
    // SVG scales by the same factor in every grid cell — otherwise the
    // stroke appears thicker on shapes with smaller plot dims.
    marginL = 22; marginR = 12; marginT = 14; marginB = 14;
    if (sh.firstQuadrantOnly) {
      xMin = 0; xMax = 3.5; yMin = 0; yMax = 2;
      pxPerUnit = 40; // 3.5 × 40 = 140 wide, 2 × 40 = 80 tall
    } else {
      xMin = -3.5; xMax = 3.5; yMin = -2; yMax = 2;
      pxPerUnit = 20; // 7 × 20 = 140 wide, 4 × 20 = 80 tall
    }
    plotW = (xMax - xMin) * pxPerUnit; plotH = (yMax - yMin) * pxPerUnit;
  }

  const totalW = marginL + plotW + marginR;
  const totalH = marginT + plotH + marginB;
  svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);

  const xPx = (x) => marginL + (x - xMin) * pxPerUnit;
  const yPx = (y) => marginT + plotH - (y - yMin) * pxPerUnit;

  // Gridlines + tick labels
  const grid = document.createElementNS(NS, "g");
  grid.setAttribute("class", "grid-line");
  grid.setAttribute("fill", "none");
  // Vertical gridlines at integer x
  for (let xi = Math.ceil(xMin); xi <= Math.floor(xMax); xi++) {
    if (xi === 0 && !sh.firstQuadrantOnly) continue;
    if (sh.firstQuadrantOnly && xi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(xi)); ln.setAttribute("x2", xPx(xi));
    ln.setAttribute("y1", yPx(yMax)); ln.setAttribute("y2", yPx(yMin));
    grid.appendChild(ln);
  }
  // Horizontal gridlines at integer y
  for (let yi = Math.ceil(yMin); yi <= Math.floor(yMax); yi++) {
    if (yi === 0 && !sh.firstQuadrantOnly) continue;
    if (sh.firstQuadrantOnly && yi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(xMin)); ln.setAttribute("x2", xPx(xMax));
    ln.setAttribute("y1", yPx(yi)); ln.setAttribute("y2", yPx(yi));
    grid.appendChild(ln);
  }
  svg.appendChild(grid);

  // Axes
  const axisX = document.createElementNS(NS, "line");
  axisX.setAttribute("class", "axis-line");
  axisX.setAttribute("x1", xPx(xMin)); axisX.setAttribute("x2", xPx(xMax));
  const axisY = document.createElementNS(NS, "line");
  axisY.setAttribute("class", "axis-line");
  axisY.setAttribute("y1", yPx(yMax)); axisY.setAttribute("y2", yPx(yMin));
  if (sh.firstQuadrantOnly) {
    axisX.setAttribute("y1", yPx(0)); axisX.setAttribute("y2", yPx(0));
    axisY.setAttribute("x1", xPx(0)); axisY.setAttribute("x2", xPx(0));
  } else {
    axisX.setAttribute("y1", yPx(0)); axisX.setAttribute("y2", yPx(0));
    axisY.setAttribute("x1", xPx(0)); axisY.setAttribute("x2", xPx(0));
  }
  svg.appendChild(axisX);
  svg.appendChild(axisY);

  // Tick labels (only on large format; mini is too small for legible labels)
  if (format === "large") {
    for (let xi = Math.ceil(xMin); xi <= Math.floor(xMax); xi++) {
      if (xi === 0) continue;
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "axis-tick-label");
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("x", xPx(xi));
      t.setAttribute("y", yPx(0) + (sh.firstQuadrantOnly ? 14 : 14));
      t.textContent = String(xi);
      svg.appendChild(t);
    }
    for (let yi = Math.ceil(yMin); yi <= Math.floor(yMax); yi++) {
      if (yi === 0 && !sh.firstQuadrantOnly) continue;
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "axis-tick-label");
      t.setAttribute("text-anchor", "end");
      t.setAttribute("x", xPx(sh.firstQuadrantOnly ? 0 : 0) - 6);
      t.setAttribute("y", yPx(yi) + 3);
      t.textContent = String(yi);
      svg.appendChild(t);
    }
    if (sh.firstQuadrantOnly) {
      const t0 = document.createElementNS(NS, "text");
      t0.setAttribute("class", "axis-tick-label");
      t0.setAttribute("text-anchor", "end");
      t0.setAttribute("x", xPx(0) - 6);
      t0.setAttribute("y", yPx(0) + 3);
      t0.textContent = "0";
      svg.appendChild(t0);
    }
    // Axis titles
    const xt = document.createElementNS(NS, "text");
    xt.setAttribute("class", "axis-title");
    xt.setAttribute("x", xPx(xMax) + 8);
    xt.setAttribute("y", yPx(0) + 4);
    xt.textContent = "x";
    svg.appendChild(xt);
    const yt = document.createElementNS(NS, "text");
    yt.setAttribute("class", "axis-title");
    yt.setAttribute("x", xPx(0));
    yt.setAttribute("y", yPx(yMax) - 8);
    yt.setAttribute("text-anchor", "middle");
    yt.textContent = "y";
    svg.appendChild(yt);
  }

  // Curve(s) — sample 250 points per branch and convert to smooth Catmull-Rom Bezier
  function buildBranch(branchXMin, branchXMax) {
    const N = 250;
    const points = [];
    for (let i = 0; i <= N; i++) {
      const x = branchXMin + (branchXMax - branchXMin) * (i / N);
      const y = sh.f(a, x);
      if (!isFinite(y) || y > yMax || y < yMin) {
        points.push(null); // gap
        continue;
      }
      points.push({ x: xPx(x), y: yPx(y) });
    }
    // Split into contiguous runs of non-null points and emit a path per run.
    const segments = [];
    let cur = [];
    for (const p of points) {
      if (p === null) {
        if (cur.length >= 2) segments.push(cur);
        cur = [];
      } else {
        cur.push(p);
      }
    }
    if (cur.length >= 2) segments.push(cur);
    const out = [];
    for (const seg of segments) {
      const d = catmullRomPath(seg);
      const pathEl = document.createElementNS(NS, "path");
      pathEl.setAttribute("class", "curve");
      pathEl.setAttribute("d", d);
      out.push(pathEl);
    }
    return out;
  }

  // Clip path so curves don't escape the plot rect
  const defs = document.createElementNS(NS, "defs");
  const clip = document.createElementNS(NS, "clipPath");
  const clipId = "clip-" + Math.random().toString(36).slice(2);
  clip.setAttribute("id", clipId);
  const clipRect = document.createElementNS(NS, "rect");
  clipRect.setAttribute("x", xPx(xMin));
  clipRect.setAttribute("y", yPx(yMax));
  clipRect.setAttribute("width", plotW);
  clipRect.setAttribute("height", plotH);
  clip.appendChild(clipRect);
  defs.appendChild(clip);
  svg.appendChild(defs);

  const curveGroup = document.createElementNS(NS, "g");
  curveGroup.setAttribute("clip-path", `url(#${clipId})`);
  if (sh.split) {
    const eps = 0.02;
    buildBranch(xMin, -eps).forEach(p => curveGroup.appendChild(p));
    buildBranch(eps, xMax).forEach(p => curveGroup.appendChild(p));
  } else {
    buildBranch(xMin, xMax).forEach(p => curveGroup.appendChild(p));
  }
  svg.appendChild(curveGroup);

  return svg;
}

// ===== Page-level layouts =====

function renderSingle(shape, a) {
  const root = document.getElementById("root");
  const wrap = document.createElement("div");
  wrap.className = "wrap-single";
  wrap.id = "wrap";

  const head = document.createElement("div");
  head.className = "formula-head";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = "Example:";
  const eq = document.createElement("span");
  eq.className = "eq";
  head.appendChild(lbl); head.appendChild(eq);
  wrap.appendChild(head);

  const svg = buildSVG(shape, a, "large");
  wrap.appendChild(svg);
  root.appendChild(wrap);

  tryRender(eq, texFor(shape, a));
}

function renderGallery() {
  const root = document.getElementById("root");
  const wrap = document.createElement("div");
  wrap.className = "wrap-gallery";
  wrap.id = "wrap";
  const grid = document.createElement("div");
  grid.className = "gallery-grid";
  wrap.appendChild(grid);
  root.appendChild(wrap);

  for (const shapeId of SHAPE_ORDER) {
    const card = document.createElement("div");
    card.className = "card";
    const eqRow = document.createElement("div");
    eqRow.className = "eq-row";
    const eq = document.createElement("span");
    eq.className = "eq";
    eqRow.appendChild(eq);
    card.appendChild(eqRow);
    const svg = buildSVG(shapeId, 1, "mini");
    card.appendChild(svg);
    const feat = document.createElement("div");
    feat.className = "feat";
    feat.textContent = SHAPES[shapeId].feat;
    card.appendChild(feat);
    grid.appendChild(card);
    tryRender(eq, SHAPES[shapeId].galleryTex);
  }
}

// ===== Boot =====
const params = new URLSearchParams(window.location.search);
const layout = params.get("layout") || "single";
if (layout === "gallery") {
  renderGallery();
} else {
  const shape = params.get("shape") || "rec";
  const a = parseFloat(params.get("a") || "2");
  if (!SHAPES[shape]) { document.getElementById("root").textContent = "unknown shape"; }
  else renderSingle(shape, a);
}

// ===== iframe height reporting =====
let lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    const wrap = document.getElementById("wrap");
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    const padTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const padBot = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const h = Math.ceil(rect.height + padTop + padBot);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
// Also report after KaTeX renders (it can change wrap height)
setTimeout(reportHeight, 200);
setTimeout(reportHeight, 600);
</script>
</body>
</html>
