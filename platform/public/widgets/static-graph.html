<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Static Graph</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }

  /* Single-shape layout */
  .wrap-single { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .formula-head { display:flex; justify-content:center; margin-bottom:10px; min-height:24px; }
  .formula-head .lbl { color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; margin-right:8px; align-self:center; }
  .formula-head .eq { color:#0fee89; font-size:16px; }
  .formula-head .eq .katex { font-size:1em; }

  /* Gallery layout */
  .wrap-gallery { max-width:696px; margin:0 auto; }
  .gallery-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:14px; }
  .card { background:#0b1118; border:1px solid #141e2a; border-radius:8px; padding:12px 10px; }
  .card .eq-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:6px; min-height:22px; }
  .card .eq-row .eq { color:#0fee89; font-size:13px; }
  .card .eq-row .eq .katex { font-size:1em; }
  .card .feat { color:#7a7875; font-family:'Geist Mono',monospace; font-size:10px; text-align:center; margin-top:6px; line-height:1.35; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#7a7875; }
  .curve { stroke:#fff067; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .asymptote { stroke:#ff4670; stroke-width:1; stroke-dasharray:4 4; opacity:0.6; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

function catmullRomPath(points) {
  if (points.length < 2) return "";
  let d = "";
  let started = false;
  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i];
    const p2 = points[i + 1];
    if (!p1 || !p2) { started = false; continue; }
    const p0 = points[i - 1] || p1;
    const p3 = points[i + 2] || p2;
    if (!started) { d += "M " + p1.x.toFixed(2) + " " + p1.y.toFixed(2); started = true; }
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += " C " + c1x.toFixed(2) + " " + c1y.toFixed(2) +
         ", " + c2x.toFixed(2) + " " + c2y.toFixed(2) +
         ", " + p2.x.toFixed(2) + " " + p2.y.toFixed(2);
  }
  return d;
}

function fmt(v) {
  const n = Math.round(v * 100) / 100;
  if (n === Math.floor(n)) return n.toFixed(0);
  return String(n);
}
function fmtSign(v) {
  if (Math.abs(v) < 0.001) return "";
  return (v > 0 ? "+" : "-") + fmt(Math.abs(v));
}

// ===== Shape definitions =====
// Each shape provides:
//   feat       — short feature line for the gallery card
//   f(p, x)    — function value, p is the params object (always contains p.a, sometimes p.h, p.k, p.b, p.r, p.r1, p.r2, p.r3)
//   texFn(p)   — TeX string for the example header (uses params)
//   galleryTex — fixed canonical TeX shown in the 7-shape gallery (a = 1)
//   split      — true if curve has two branches (don't draw across x = 0)
//   firstQuadrantOnly — true if domain is x ≥ 0 (sqrt)
//   asymptote  — optional function asymptoteY(p) returning y-value of horizontal asymptote (for shifted shapes)
//   range      — optional { xMin, xMax, yMin, yMax, pxX, pxY } for shape-specific plot dims (overrides format defaults)
const SHAPES = {
  lin:   { feat: "line through origin",                f: (p,x) => p.a*x,                                 texFn: p => "y = " + fmt(p.a) + "x",                                galleryTex: "y = x",          split: false, firstQuadrantOnly: false },
  sq:    { feat: "parabola, vertex at origin",         f: (p,x) => p.a*x*x,                               texFn: p => "y = " + fmt(p.a) + "x^2",                              galleryTex: "y = x^2",        split: false, firstQuadrantOnly: false },
  cub:   { feat: "S-curve, inflection at origin",      f: (p,x) => p.a*x*x*x,                             texFn: p => "y = " + fmt(p.a) + "x^3",                              galleryTex: "y = x^3",        split: false, firstQuadrantOnly: false },
  sqrt:  { feat: "x ≥ 0 only, rises and flattens",     f: (p,x) => x < 0 ? NaN : p.a*Math.sqrt(x),        texFn: p => "y = " + fmt(p.a) + "\\sqrt{x}",                        galleryTex: "y = \\sqrt{x}",  split: false, firstQuadrantOnly: true },
  rec:   { feat: "two branches in Q1 and Q3",          f: (p,x) => Math.abs(x) < 0.001 ? NaN : p.a/x,     texFn: p => "y = \\dfrac{" + fmt(p.a) + "}{x}",                     galleryTex: "y = \\dfrac{1}{x}",   split: true,  firstQuadrantOnly: false },
  rec2:  { feat: "two branches both above x-axis",     f: (p,x) => Math.abs(x) < 0.001 ? NaN : p.a/(x*x), texFn: p => "y = \\dfrac{" + fmt(p.a) + "}{x^2}",                   galleryTex: "y = \\dfrac{1}{x^2}", split: true,  firstQuadrantOnly: false },
  const: { feat: "horizontal line at y = 1",           f: (p,x) => p.a,                                   texFn: p => "y = " + fmt(p.a),                                      galleryTex: "y = 1",          split: false, firstQuadrantOnly: false },

  // Parameterized shapes for sketching lessons (2.11)
  quad: {
    feat: "parabola, vertex (h, k)",
    f: (p, x) => p.a * (x - p.h) * (x - p.h) + p.k,
    texFn: p => "y = " + (p.a === 1 ? "" : (p.a === -1 ? "-" : fmt(p.a))) + "(x " + fmtSign(-p.h) + ")^2 " + fmtSign(p.k),
    split: false, firstQuadrantOnly: false,
    range: { xMin: -2, xMax: 6, yMin: -10, yMax: 6, pxX: 50, pxY: 25 }
  },
  cubic_factored: {
    feat: "cubic with three roots",
    f: (p, x) => (x - p.r1) * (x - p.r2) * (x - p.r3),
    texFn: p => "y = (x " + fmtSign(-p.r1) + ")(x " + fmtSign(-p.r2) + ")(x " + fmtSign(-p.r3) + ")",
    split: false, firstQuadrantOnly: false,
    range: { xMin: -4, xMax: 4, yMin: -10, yMax: 10, pxX: 45, pxY: 18 }
  },
  recip_shifted: {
    feat: "shifted reciprocal",
    f: (p, x) => Math.abs(x) < 0.001 ? NaN : p.a / x + p.b,
    texFn: p => "y = \\dfrac{" + fmt(p.a) + "}{x} " + fmtSign(p.b),
    asymptoteY: p => p.b,
    split: true, firstQuadrantOnly: false,
    range: { xMin: -4, xMax: 4, yMin: -3, yMax: 5, pxX: 50, pxY: 30 }
  },
  exp_shifted: {
    feat: "shifted exponential",
    f: (p, x) => p.a * Math.pow(p.r, x) + p.b,
    texFn: p => "y = " + fmt(p.a) + " \\cdot " + fmt(p.r) + "^x " + fmtSign(p.b),
    asymptoteY: p => p.b,
    split: false, firstQuadrantOnly: false,
    range: { xMin: -3, xMax: 3, yMin: -2, yMax: 8, pxX: 60, pxY: 28 }
  }
};

const SHAPE_ORDER = ["lin", "sq", "cub", "sqrt", "rec", "rec2", "const"];

// ===== Build SVG for a single shape =====
function buildSVG(shape, p, format) {
  const sh = SHAPES[shape];
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("xmlns", NS);

  let plotW, plotH, marginL, marginR, marginT, marginB;
  let xMin, xMax, yMin, yMax, pxX, pxY;

  if (format === "large") {
    marginL = 50; marginR = 30; marginT = 20; marginB = 30;
    if (sh.range) {
      xMin = sh.range.xMin; xMax = sh.range.xMax;
      yMin = sh.range.yMin; yMax = sh.range.yMax;
      pxX  = sh.range.pxX;  pxY  = sh.range.pxY;
    } else if (sh.firstQuadrantOnly) {
      xMin = 0; xMax = 4; yMin = 0; yMax = 3;
      pxX = 50; pxY = 50;
    } else {
      xMin = -4; xMax = 4; yMin = -2; yMax = 2;
      pxX = 50; pxY = 50;
    }
    plotW = (xMax - xMin) * pxX;
    plotH = (yMax - yMin) * pxY;
  } else {
    // Mini cards (gallery only) — only for the 7 base shapes; new params shapes never appear in gallery.
    marginL = 22; marginR = 12; marginT = 14; marginB = 14;
    if (sh.firstQuadrantOnly) {
      xMin = 0; xMax = 3.5; yMin = 0; yMax = 2; pxX = 40; pxY = 40;
    } else {
      xMin = -3.5; xMax = 3.5; yMin = -2; yMax = 2; pxX = 20; pxY = 20;
    }
    plotW = (xMax - xMin) * pxX;
    plotH = (yMax - yMin) * pxY;
  }

  const totalW = marginL + plotW + marginR;
  const totalH = marginT + plotH + marginB;
  svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);

  const xPx = (x) => marginL + (x - xMin) * pxX;
  const yPx = (y) => marginT + plotH - (y - yMin) * pxY;

  // Gridlines
  const grid = document.createElementNS(NS, "g");
  for (let xi = Math.ceil(xMin); xi <= Math.floor(xMax); xi++) {
    if (xi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(xi)); ln.setAttribute("x2", xPx(xi));
    ln.setAttribute("y1", yPx(yMax)); ln.setAttribute("y2", yPx(yMin));
    grid.appendChild(ln);
  }
  for (let yi = Math.ceil(yMin); yi <= Math.floor(yMax); yi++) {
    if (yi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(xMin)); ln.setAttribute("x2", xPx(xMax));
    ln.setAttribute("y1", yPx(yi)); ln.setAttribute("y2", yPx(yi));
    grid.appendChild(ln);
  }
  svg.appendChild(grid);

  // Axes — drawn at the edge for firstQuadrantOnly, through origin otherwise.
  const axisX = document.createElementNS(NS, "line");
  axisX.setAttribute("class", "axis-line");
  axisX.setAttribute("x1", xPx(xMin)); axisX.setAttribute("x2", xPx(xMax));
  const axisY = document.createElementNS(NS, "line");
  axisY.setAttribute("class", "axis-line");
  axisY.setAttribute("y1", yPx(yMax)); axisY.setAttribute("y2", yPx(yMin));
  // x-axis at y = 0 (in data) clamped to plot bounds
  const xAxisY = (yMin <= 0 && yMax >= 0) ? yPx(0) : yPx(yMin);
  const yAxisX = (xMin <= 0 && xMax >= 0) ? xPx(0) : xPx(xMin);
  axisX.setAttribute("y1", xAxisY); axisX.setAttribute("y2", xAxisY);
  axisY.setAttribute("x1", yAxisX); axisY.setAttribute("x2", yAxisX);
  svg.appendChild(axisX);
  svg.appendChild(axisY);

  // Asymptote line (red dashed) if shape declares one
  if (sh.asymptoteY) {
    const ay = sh.asymptoteY(p);
    if (ay >= yMin && ay <= yMax) {
      const aLine = document.createElementNS(NS, "line");
      aLine.setAttribute("class", "asymptote");
      aLine.setAttribute("x1", xPx(xMin));
      aLine.setAttribute("x2", xPx(xMax));
      aLine.setAttribute("y1", yPx(ay));
      aLine.setAttribute("y2", yPx(ay));
      svg.appendChild(aLine);
    }
  }

  // Tick labels (large format only)
  if (format === "large") {
    for (let xi = Math.ceil(xMin); xi <= Math.floor(xMax); xi++) {
      if (xi === 0) continue;
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "axis-tick-label");
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("x", xPx(xi));
      t.setAttribute("y", xAxisY + 14);
      t.textContent = String(xi);
      svg.appendChild(t);
    }
    // Y ticks at every other integer if range > 6, else at every integer
    const yStep = (yMax - yMin) > 6 ? 2 : 1;
    for (let yi = Math.ceil(yMin / yStep) * yStep; yi <= yMax; yi += yStep) {
      if (yi === 0 && !sh.firstQuadrantOnly) continue;
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "axis-tick-label");
      t.setAttribute("text-anchor", "end");
      t.setAttribute("x", yAxisX - 6);
      t.setAttribute("y", yPx(yi) + 3);
      t.textContent = String(yi);
      svg.appendChild(t);
    }
    if (sh.firstQuadrantOnly) {
      const t0 = document.createElementNS(NS, "text");
      t0.setAttribute("class", "axis-tick-label");
      t0.setAttribute("text-anchor", "end");
      t0.setAttribute("x", yAxisX - 6);
      t0.setAttribute("y", xAxisY + 3);
      t0.textContent = "0";
      svg.appendChild(t0);
    }
    // Axis titles
    const xt = document.createElementNS(NS, "text");
    xt.setAttribute("class", "axis-title");
    xt.setAttribute("x", xPx(xMax) + 8);
    xt.setAttribute("y", xAxisY + 4);
    xt.textContent = "x";
    svg.appendChild(xt);
    const yt = document.createElementNS(NS, "text");
    yt.setAttribute("class", "axis-title");
    yt.setAttribute("x", yAxisX);
    yt.setAttribute("y", yPx(yMax) - 8);
    yt.setAttribute("text-anchor", "middle");
    yt.textContent = "y";
    svg.appendChild(yt);
  }

  // Curve(s)
  function buildBranch(branchXMin, branchXMax) {
    const N = 250;
    const points = [];
    for (let i = 0; i <= N; i++) {
      const x = branchXMin + (branchXMax - branchXMin) * (i / N);
      const y = sh.f(p, x);
      if (!isFinite(y) || y > yMax || y < yMin) {
        points.push(null);
        continue;
      }
      points.push({ x: xPx(x), y: yPx(y) });
    }
    const segments = [];
    let cur = [];
    for (const pt of points) {
      if (pt === null) { if (cur.length >= 2) segments.push(cur); cur = []; }
      else cur.push(pt);
    }
    if (cur.length >= 2) segments.push(cur);
    const out = [];
    for (const seg of segments) {
      const d = catmullRomPath(seg);
      const pathEl = document.createElementNS(NS, "path");
      pathEl.setAttribute("class", "curve");
      pathEl.setAttribute("d", d);
      out.push(pathEl);
    }
    return out;
  }

  const defs = document.createElementNS(NS, "defs");
  const clip = document.createElementNS(NS, "clipPath");
  const clipId = "clip-" + Math.random().toString(36).slice(2);
  clip.setAttribute("id", clipId);
  const clipRect = document.createElementNS(NS, "rect");
  clipRect.setAttribute("x", xPx(xMin));
  clipRect.setAttribute("y", yPx(yMax));
  clipRect.setAttribute("width", plotW);
  clipRect.setAttribute("height", plotH);
  clip.appendChild(clipRect);
  defs.appendChild(clip);
  svg.appendChild(defs);

  const curveGroup = document.createElementNS(NS, "g");
  curveGroup.setAttribute("clip-path", `url(#${clipId})`);
  if (sh.split) {
    const eps = 0.02;
    buildBranch(xMin, -eps).forEach(el => curveGroup.appendChild(el));
    buildBranch(eps, xMax).forEach(el => curveGroup.appendChild(el));
  } else {
    buildBranch(xMin, xMax).forEach(el => curveGroup.appendChild(el));
  }
  svg.appendChild(curveGroup);

  return svg;
}

// ===== Page-level layouts =====

function renderSingle(shape, p) {
  const root = document.getElementById("root");
  const wrap = document.createElement("div");
  wrap.className = "wrap-single";
  wrap.id = "wrap";

  const head = document.createElement("div");
  head.className = "formula-head";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = "Example:";
  const eq = document.createElement("span");
  eq.className = "eq";
  head.appendChild(lbl); head.appendChild(eq);
  wrap.appendChild(head);

  const svg = buildSVG(shape, p, "large");
  wrap.appendChild(svg);
  root.appendChild(wrap);

  tryRender(eq, SHAPES[shape].texFn(p));
}

function renderGallery() {
  const root = document.getElementById("root");
  const wrap = document.createElement("div");
  wrap.className = "wrap-gallery";
  wrap.id = "wrap";
  const grid = document.createElement("div");
  grid.className = "gallery-grid";
  wrap.appendChild(grid);
  root.appendChild(wrap);

  for (const shapeId of SHAPE_ORDER) {
    const card = document.createElement("div");
    card.className = "card";
    const eqRow = document.createElement("div");
    eqRow.className = "eq-row";
    const eq = document.createElement("span");
    eq.className = "eq";
    eqRow.appendChild(eq);
    card.appendChild(eqRow);
    const svg = buildSVG(shapeId, { a: 1 }, "mini");
    card.appendChild(svg);
    const feat = document.createElement("div");
    feat.className = "feat";
    feat.textContent = SHAPES[shapeId].feat;
    card.appendChild(feat);
    grid.appendChild(card);
    tryRender(eq, SHAPES[shapeId].galleryTex);
  }
}

// ===== Boot =====
const urlParams = new URLSearchParams(window.location.search);
const layout = urlParams.get("layout") || "single";
if (layout === "gallery") {
  renderGallery();
} else {
  const shape = urlParams.get("shape") || "rec";
  if (!SHAPES[shape]) {
    document.getElementById("root").textContent = "unknown shape: " + shape;
  } else {
    // Read every possible param into the params object; shapes pick what they need.
    const p = {
      a: parseFloat(urlParams.get("a") || "2"),
      b: parseFloat(urlParams.get("b") || "0"),
      h: parseFloat(urlParams.get("h") || "0"),
      k: parseFloat(urlParams.get("k") || "0"),
      r: parseFloat(urlParams.get("r") || "2"),
      r1: parseFloat(urlParams.get("r1") || "-1"),
      r2: parseFloat(urlParams.get("r2") || "1"),
      r3: parseFloat(urlParams.get("r3") || "2")
    };
    renderSingle(shape, p);
  }
}

// ===== iframe height reporting =====
let lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    const wrap = document.getElementById("wrap");
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    const padTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const padBot = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const h = Math.ceil(rect.height + padTop + padBot);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
setTimeout(reportHeight, 200);
setTimeout(reportHeight, 600);
</script>
</body>
</html>
