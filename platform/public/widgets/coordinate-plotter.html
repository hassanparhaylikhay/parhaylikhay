<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Coordinate Plotter</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }
  .head { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; min-height:24px; }
  .formula { color:#0fee89; font-size:16px; }
  .formula .katex { font-size:1em; }

  .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:8px; padding:0 6px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; }
  .row .name { color:#fff067; font-weight:600; min-width:18px; }
  .row input[type=range] { flex:1; min-width:60px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:24px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:11px; fill:#7a7875; font-weight:600; }
  .quad-lbl { font-family:'Geist Mono',monospace; font-size:14px; fill:#3a4a5a; font-weight:600; }
  .pt { fill:#fff067; }
  .pt-shadow { fill:rgba(255,240,103,0.2); }
  .ref-line { stroke:#fff067; stroke-width:1; stroke-dasharray:3 4; opacity:0.6; }

  .readout { margin-top:10px; padding:10px 14px; background:#07090d; border:1px solid #141e2a; border-radius:8px; text-align:center; font-family:'Geist Mono',monospace; font-size:13px; color:#f0eeea; }
  .readout .lbl { color:#7a7875; }
  .readout .val { color:#fff067; font-weight:600; }
  .readout .quad { color:#0fee89; font-weight:600; margin-left:14px; }
  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="formula" id="formula"></span>
  </div>
  <div class="controls">
    <div class="row"><span class="name">x</span><input type="range" id="x" min="-6" max="6" value="3" step="1"/><span class="val" id="vx">3</span></div>
    <div class="row"><span class="name">y</span><input type="range" id="y" min="-4" max="4" value="2" step="1"/><span class="val" id="vy">2</span></div>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <text class="axis-title" x="464" y="164" text-anchor="end">x</text>
    <text class="axis-title" x="244" y="14" text-anchor="middle">y</text>
    <g id="quadLabels"></g>
    <line class="ref-line" id="refX"/>
    <line class="ref-line" id="refY"/>
    <circle class="pt-shadow" id="ptShadow" r="11"/>
    <circle class="pt" id="pt" r="5"/>
  </svg>

  <div class="readout">
    <span class="lbl">point:</span> <span class="val" id="ptVal">(3, 2)</span>
    <span class="quad" id="quadVal">Q1</span>
  </div>
  <p class="footer">drag x and y · the dashed lines show how the coordinates project onto each axis</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

const PLOT = { xMin: -6, xMax: 6, yMin: -4, yMax: 4, pxPerUnit: 35, ml: 40, mr: 30, mt: 20, mb: 30 };
function plotW() { return (PLOT.xMax - PLOT.xMin) * PLOT.pxPerUnit; }
function plotH() { return (PLOT.yMax - PLOT.yMin) * PLOT.pxPerUnit; }
function xPx(x) { return PLOT.ml + (x - PLOT.xMin) * PLOT.pxPerUnit; }
function yPx(y) { return PLOT.mt + plotH() - (y - PLOT.yMin) * PLOT.pxPerUnit; }

(function buildAxes() {
  const NS = "http://www.w3.org/2000/svg";
  const grid = document.getElementById("grid");
  const ticks = document.getElementById("ticks");
  const ql = document.getElementById("quadLabels");
  for (let xi = Math.ceil(PLOT.xMin); xi <= Math.floor(PLOT.xMax); xi++) {
    if (xi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(xi)); ln.setAttribute("x2", xPx(xi));
    ln.setAttribute("y1", yPx(PLOT.yMax)); ln.setAttribute("y2", yPx(PLOT.yMin));
    grid.appendChild(ln);
  }
  for (let yi = Math.ceil(PLOT.yMin); yi <= Math.floor(PLOT.yMax); yi++) {
    if (yi === 0) continue;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(PLOT.xMin)); ln.setAttribute("x2", xPx(PLOT.xMax));
    ln.setAttribute("y1", yPx(yi)); ln.setAttribute("y2", yPx(yi));
    grid.appendChild(ln);
  }
  document.getElementById("xAxis").setAttribute("x1", xPx(PLOT.xMin));
  document.getElementById("xAxis").setAttribute("x2", xPx(PLOT.xMax));
  document.getElementById("xAxis").setAttribute("y1", yPx(0));
  document.getElementById("xAxis").setAttribute("y2", yPx(0));
  document.getElementById("yAxis").setAttribute("x1", xPx(0));
  document.getElementById("yAxis").setAttribute("x2", xPx(0));
  document.getElementById("yAxis").setAttribute("y1", yPx(PLOT.yMax));
  document.getElementById("yAxis").setAttribute("y2", yPx(PLOT.yMin));
  for (let xi = Math.ceil(PLOT.xMin); xi <= Math.floor(PLOT.xMax); xi++) {
    if (xi === 0) continue;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "axis-tick-label"); t.setAttribute("text-anchor", "middle");
    t.setAttribute("x", xPx(xi)); t.setAttribute("y", yPx(0) + 14);
    t.textContent = String(xi);
    ticks.appendChild(t);
  }
  for (let yi = Math.ceil(PLOT.yMin); yi <= Math.floor(PLOT.yMax); yi++) {
    if (yi === 0) continue;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "axis-tick-label"); t.setAttribute("text-anchor", "end");
    t.setAttribute("x", xPx(0) - 6); t.setAttribute("y", yPx(yi) + 3);
    t.textContent = String(yi);
    ticks.appendChild(t);
  }
  // Quadrant labels
  const quads = [
    { lbl: "Q1", x: PLOT.xMax - 0.6, y: PLOT.yMax - 0.5 },
    { lbl: "Q2", x: PLOT.xMin + 0.6, y: PLOT.yMax - 0.5 },
    { lbl: "Q3", x: PLOT.xMin + 0.6, y: PLOT.yMin + 0.5 },
    { lbl: "Q4", x: PLOT.xMax - 0.6, y: PLOT.yMin + 0.5 }
  ];
  for (const q of quads) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "quad-lbl"); t.setAttribute("text-anchor", "middle");
    t.setAttribute("x", xPx(q.x)); t.setAttribute("y", yPx(q.y));
    t.textContent = q.lbl;
    ql.appendChild(t);
  }
})();

let targetX = 3, targetY = 2;
let displayX = 3, displayY = 2;
const SPRING = 0.25;

function quadrant(x, y) {
  if (x === 0 && y === 0) return "origin";
  if (y === 0) return "x-axis";
  if (x === 0) return "y-axis";
  if (x > 0 && y > 0) return "Q1";
  if (x < 0 && y > 0) return "Q2";
  if (x < 0 && y < 0) return "Q3";
  return "Q4";
}

function tick() {
  displayX += (targetX - displayX) * SPRING;
  displayY += (targetY - displayY) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  const px = xPx(displayX), py = yPx(displayY);
  document.getElementById("pt").setAttribute("cx", px);
  document.getElementById("pt").setAttribute("cy", py);
  document.getElementById("ptShadow").setAttribute("cx", px);
  document.getElementById("ptShadow").setAttribute("cy", py);
  // Reference dashed lines from point to axes
  document.getElementById("refX").setAttribute("x1", px);
  document.getElementById("refX").setAttribute("y1", py);
  document.getElementById("refX").setAttribute("x2", px);
  document.getElementById("refX").setAttribute("y2", yPx(0));
  document.getElementById("refY").setAttribute("x1", px);
  document.getElementById("refY").setAttribute("y1", py);
  document.getElementById("refY").setAttribute("x2", xPx(0));
  document.getElementById("refY").setAttribute("y2", py);
  tryRender(document.getElementById("formula"), "(" + targetX + ",\\; " + targetY + ")");
  document.getElementById("ptVal").textContent = "(" + targetX + ", " + targetY + ")";
  document.getElementById("quadVal").textContent = quadrant(targetX, targetY);
}

document.getElementById("x").addEventListener("input", e => {
  targetX = parseInt(e.target.value, 10);
  document.getElementById("vx").textContent = targetX;
});
document.getElementById("y").addEventListener("input", e => {
  targetY = parseInt(e.target.value, 10);
  document.getElementById("vy").textContent = targetY;
});
tick();

let lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    const wrap = document.getElementById("wrap");
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    const padTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const padBot = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const h = Math.ceil(rect.height + padTop + padBot);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
setTimeout(reportHeight, 200);
</script>
</body>
</html>
