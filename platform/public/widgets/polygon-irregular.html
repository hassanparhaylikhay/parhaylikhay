<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Irregular Polygon Angles</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:12px 16px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:8px; }
  .formula { font-size:14px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls { display:flex; align-items:center; gap:14px; margin-bottom:8px; padding:0 4px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap; }
  .mode-row { display:flex; align-items:center; gap:8px; }
  .mode-row .name { color:#fff067; font-weight:600; }
  .mode-row select { background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px; padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer; }
  .mode-row select:focus { border-color:#00abfa; }
  button.reset {
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a;
    border-radius:4px; padding:4px 10px; font-family:'Geist Mono',monospace;
    font-size:11px; cursor:pointer; outline:none;
  }
  button.reset:hover { border-color:#00abfa; }

  svg { display:block; width:100%; height:auto; user-select:none; touch-action:none; overflow:hidden; }

  .poly-side { stroke:#00abfa; stroke-width:2.5; fill:#00abfa10; stroke-linejoin:round; stroke-linecap:round; pointer-events:none; }
  .poly-vertex { fill:#fff067; cursor:grab; }
  .poly-vertex.dragging { cursor:grabbing; }
  .poly-hit { fill:transparent; cursor:grab; }

  .interior-arc { fill:#0fee8920; stroke:#0fee89; stroke-width:1.5; pointer-events:none; }
  .exterior-arc { fill:#ff467020; stroke:#ff4670; stroke-width:1.5; pointer-events:none; }
  .ext-extension { stroke:#7a7875; stroke-width:1; stroke-dasharray:3 3; fill:none; pointer-events:none; }
  .interior-label { font-family:'Geist Mono',monospace; font-size:10px; fill:#0fee89; font-weight:600; pointer-events:none; }
  .exterior-label { font-family:'Geist Mono',monospace; font-size:10px; fill:#ff4670; font-weight:600; pointer-events:none; }

  .tally {
    margin-top:6px; font-family:'Geist Mono',monospace; font-size:11px;
    color:#c8c6be; padding:0 4px; word-break:break-word; line-height:1.45;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .tally .text { text-align:center; flex:1 1 auto; min-width:0; }
  .tally svg.ext-cue-svg { width:56px; height:56px; flex:0 0 56px; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fSum"></span>
  </div>

  <div class="controls">
    <div class="mode-row">
      <span class="name">show</span>
      <select id="mode">
        <option value="interior">interior angles</option>
        <option value="exterior">exterior angles</option>
        <option value="both" selected>both</option>
      </select>
    </div>
    <button class="reset" id="resetBtn">reset shape</button>
  </div>

  <svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <g id="extensions"></g>
    <g id="extArcs"></g>
    <g id="intArcs"></g>
    <polygon id="poly" class="poly-side"/>
    <g id="vertices"></g>
    <g id="hitTargets"></g>
    <g id="intLabels"></g>
    <g id="extLabels"></g>
  </svg>

  <div class="tally" id="tally"></div>
  <p class="footer">drag any yellow vertex to deform the polygon &middot; the sum stays constant</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

var SVG_NS = "http://www.w3.org/2000/svg";
var ARC_R_INT = 22;
var ARC_R_EXT = 18;
var LBL_R_INT = 32;
var LBL_R_EXT = 36;
var EXT_LEN = 28;

var INITIAL = [
  { x: 240, y: 50  },
  { x: 380, y: 110 },
  { x: 340, y: 240 },
  { x: 180, y: 250 },
  { x: 90,  y: 130 }
];

var qp = new URLSearchParams(window.location.search);
var qpMode = qp.get("mode");
var qpLock = qp.get("lock") === "1";

var pts = INITIAL.map(function(p) { return { x: p.x, y: p.y }; });
var n = pts.length;
var mode = (qpMode === "interior" || qpMode === "exterior" || qpMode === "both") ? qpMode : "both";

function fmt(v) {
  var rounded = Math.round(v * 10) / 10;
  if (Math.abs(rounded - Math.round(rounded)) < 1e-9) return String(Math.round(rounded));
  return rounded.toFixed(1);
}

function makeEl(tag, attrs) {
  var el = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
  return el;
}
function clearChildren(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function arcPathSigned(cx, cy, r, a1, sweep) {
  var x1 = cx + r * Math.cos(a1);
  var y1 = cy + r * Math.sin(a1);
  var a2 = a1 + sweep;
  var x2 = cx + r * Math.cos(a2);
  var y2 = cy + r * Math.sin(a2);
  var largeArc = Math.abs(sweep) > Math.PI ? 1 : 0;
  var sweepFlag = sweep > 0 ? 1 : 0;
  return "M " + cx + " " + cy +
         " L " + x1.toFixed(2) + " " + y1.toFixed(2) +
         " A " + r + " " + r + " 0 " + largeArc + " " + sweepFlag + " " +
         x2.toFixed(2) + " " + y2.toFixed(2) + " Z";
}

function sweepThrough(a1, a2, dirX, dirY) {
  var d = a2 - a1;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d <= -Math.PI) d += 2 * Math.PI;
  var midA = a1 + d / 2;
  var dot = Math.cos(midA) * dirX + Math.sin(midA) * dirY;
  if (dot >= 0) return d;
  return d > 0 ? d - 2 * Math.PI : d + 2 * Math.PI;
}

function centroid(points) {
  var cx = 0, cy = 0;
  for (var i = 0; i < points.length; i++) { cx += points[i].x; cy += points[i].y; }
  return { x: cx / points.length, y: cy / points.length };
}

// Returns true if every consecutive turn in `points` has the same sign,
// i.e. the polygon is strictly convex. Treats near-collinear triples as
// invalid (we want a strict-positive minimum interior margin so the
// drag can't sneak past 180° via a vanishing cross product).
function isConvex(points) {
  var sign = 0;
  var len = points.length;
  for (var i = 0; i < len; i++) {
    var a = points[i];
    var b = points[(i + 1) % len];
    var c = points[(i + 2) % len];
    var cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
    if (Math.abs(cross) < 1) return false; // too close to straight
    var s = cross > 0 ? 1 : -1;
    if (sign === 0) sign = s;
    else if (s !== sign) return false;
  }
  return true;
}

// Live "exterior angles sum to 360°" cue: rim circle = 360° total, n
// continuous boundary rays from centre through the rim and a few px
// beyond, small inner angle-marker arc per sector. Sector proportions
// reflect the current vertex angles. Rebuilt on every draw().
function buildExteriorCue(anglesRad) {
  var pw = 56, ph = 56, cx = pw / 2, cy = ph / 2;
  var R = 19;
  var EXT = 5;
  var MARKER_R = 7;
  var svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + pw + " " + ph);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("width", String(pw));
  svg.setAttribute("height", String(ph));
  var COL = "#ff4670";

  svg.appendChild(makeEl("circle", {
    cx: cx, cy: cy, r: R,
    fill: "none", stroke: COL, "stroke-width": "1.4"
  }));

  var ang = -Math.PI / 2;
  for (var j = 0; j < anglesRad.length; j++) {
    var a1 = ang;
    var a2 = ang + anglesRad[j];

    var rx = cx + Math.cos(a1) * (R + EXT);
    var ry = cy + Math.sin(a1) * (R + EXT);
    svg.appendChild(makeEl("line", {
      x1: cx, y1: cy,
      x2: rx.toFixed(2), y2: ry.toFixed(2),
      stroke: COL, "stroke-width": "1.3", "stroke-linecap": "round"
    }));

    var ix0 = cx + Math.cos(a1) * MARKER_R;
    var iy0 = cy + Math.sin(a1) * MARKER_R;
    var ix1 = cx + Math.cos(a2) * MARKER_R;
    var iy1 = cy + Math.sin(a2) * MARKER_R;
    var rad = a2 - a1;
    var largeArc = rad > Math.PI ? 1 : 0;
    svg.appendChild(makeEl("path", {
      d: "M " + ix0.toFixed(2) + " " + iy0.toFixed(2) +
         " A " + MARKER_R + " " + MARKER_R + " 0 " + largeArc + " 1 " +
         ix1.toFixed(2) + " " + iy1.toFixed(2),
      fill: "none", stroke: COL, "stroke-width": "1.1", "stroke-linecap": "round"
    }));
    ang = a2;
  }
  svg.appendChild(makeEl("circle", { cx: cx, cy: cy, r: "1.3", fill: "#7a7875" }));
  return svg;
}

function draw() {
  var sumInteriorTarget = (n - 2) * 180;

  var modeLabel = (mode === "interior") ? "Interior" : (mode === "exterior" ? "Exterior" : "Interior + exterior");
  var sumLine;
  if (mode === "interior") {
    sumLine = "(n - 2) \\times 180\\degree = (\\textcolor{#fff067}{" + n + "} - 2) \\times 180\\degree = \\textcolor{#0fee89}{" + sumInteriorTarget + "\\degree}";
  } else if (mode === "exterior") {
    sumLine = "\\text{Exterior sum} = \\textcolor{#ff4670}{360\\degree} \\;\\text{(any convex polygon)}";
  } else {
    sumLine = "\\text{Interior sum} = \\textcolor{#0fee89}{" + sumInteriorTarget + "\\degree}\\quad\\cdot\\quad\\text{Exterior sum} = \\textcolor{#ff4670}{360\\degree}";
  }
  tryRender(document.getElementById("fSum"), sumLine);

  document.getElementById("poly").setAttribute(
    "points", pts.map(function(p) { return p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" ")
  );

  var vg = document.getElementById("vertices");
  var hg = document.getElementById("hitTargets");
  clearChildren(vg);
  clearChildren(hg);
  for (var i = 0; i < n; i++) {
    vg.appendChild(makeEl("circle", {
      cx: pts[i].x, cy: pts[i].y, r: 5, class: "poly-vertex", "data-idx": String(i)
    }));
    // larger transparent hit target on top for easier touch dragging
    hg.appendChild(makeEl("circle", {
      cx: pts[i].x, cy: pts[i].y, r: 14, class: "poly-hit", "data-idx": String(i)
    }));
  }

  var intArcG = document.getElementById("intArcs");
  var extArcG = document.getElementById("extArcs");
  var extG = document.getElementById("extensions");
  var intLG = document.getElementById("intLabels");
  var extLG = document.getElementById("extLabels");
  clearChildren(intArcG); clearChildren(extArcG); clearChildren(extG);
  clearChildren(intLG); clearChildren(extLG);

  var c = centroid(pts);
  var showInterior = (mode === "interior" || mode === "both");
  var showExterior = (mode === "exterior" || mode === "both");

  var intSum = 0;
  var extSum = 0;
  var intParts = [];
  var extParts = [];
  var extRads = [];

  for (var j = 0; j < n; j++) {
    var prev = pts[(j - 1 + n) % n];
    var cur  = pts[j];
    var next = pts[(j + 1) % n];

    var ax = prev.x - cur.x, ay = prev.y - cur.y;
    var bx = next.x - cur.x, by = next.y - cur.y;
    var aLen = Math.hypot(ax, ay) || 1;
    var bLen = Math.hypot(bx, by) || 1;
    var aNx = ax / aLen, aNy = ay / aLen;
    var bNx = bx / bLen, bNy = by / bLen;
    var aAng = Math.atan2(aNy, aNx);
    var bAng = Math.atan2(bNy, bNx);

    // Inward direction at this vertex: toward centroid (works for convex).
    var inX = c.x - cur.x, inY = c.y - cur.y;
    var inLen = Math.hypot(inX, inY) || 1;
    var inNx = inX / inLen, inNy = inY / inLen;

    var sweepInt = sweepThrough(aAng, bAng, inNx, inNy);
    var interiorDeg = Math.abs(sweepInt) * 180 / Math.PI;
    var exteriorDeg = 180 - interiorDeg;
    intSum += interiorDeg;
    extSum += exteriorDeg;
    intParts.push(fmt(interiorDeg));
    extParts.push(fmt(exteriorDeg));
    extRads.push(exteriorDeg * Math.PI / 180);

    if (showInterior) {
      intArcG.appendChild(makeEl("path", {
        d: arcPathSigned(cur.x, cur.y, ARC_R_INT, aAng, sweepInt),
        class: "interior-arc"
      }));
      var lx = cur.x + inNx * LBL_R_INT;
      var ly = cur.y + inNy * LBL_R_INT + 3;
      var lblI = makeEl("text", {
        x: lx.toFixed(2), y: ly.toFixed(2),
        "text-anchor": "middle", class: "interior-label"
      });
      lblI.textContent = fmt(interiorDeg) + "°";
      intLG.appendChild(lblI);
    }

    if (showExterior) {
      var extDx = -aNx, extDy = -aNy;
      var ex = cur.x + extDx * EXT_LEN;
      var ey = cur.y + extDy * EXT_LEN;
      extG.appendChild(makeEl("line", {
        x1: cur.x, y1: cur.y, x2: ex.toFixed(2), y2: ey.toFixed(2),
        class: "ext-extension"
      }));
      var extAng = Math.atan2(extDy, extDx);
      var refX = extDx + bNx, refY = extDy + bNy;
      var refLen = Math.hypot(refX, refY) || 1;
      var refNx = refX / refLen, refNy = refY / refLen;
      var sweepExt = sweepThrough(extAng, bAng, refNx, refNy);
      extArcG.appendChild(makeEl("path", {
        d: arcPathSigned(cur.x, cur.y, ARC_R_EXT, extAng, sweepExt),
        class: "exterior-arc"
      }));
      var lxE = cur.x + refNx * LBL_R_EXT;
      var lyE = cur.y + refNy * LBL_R_EXT + 3;
      var lblE = makeEl("text", {
        x: lxE.toFixed(2), y: lyE.toFixed(2),
        "text-anchor": "middle", class: "exterior-label"
      });
      lblE.textContent = fmt(exteriorDeg) + "°";
      extLG.appendChild(lblE);
    }
  }

  // Tally bar. Exterior mode also gets the live 360° cue glued
  // to the left of the calculation.
  var tallyEl = document.getElementById("tally");
  clearChildren(tallyEl);

  if (mode === "exterior") {
    var cueSvg = buildExteriorCue(extRads);
    cueSvg.setAttribute("class", "ext-cue-svg");
    tallyEl.appendChild(cueSvg);
  }

  var textEl = document.createElement("span");
  textEl.className = "text";
  if (mode === "interior") {
    textEl.innerHTML =
      "<span style=\"color:#0fee89\">Interior sum:</span> " +
      intParts.map(function(p) { return p + "°"; }).join(" + ") +
      " = <strong style=\"color:#0fee89\">" + fmt(intSum) + "°</strong>" +
      " &nbsp;&middot;&nbsp; target = " + sumInteriorTarget + "°";
  } else if (mode === "exterior") {
    textEl.innerHTML =
      "<span style=\"color:#ff4670\">Exterior sum:</span> " +
      extParts.map(function(p) { return p + "°"; }).join(" + ") +
      " = <strong style=\"color:#ff4670\">" + fmt(extSum) + "°</strong>" +
      " &nbsp;&middot;&nbsp; target = 360°";
  } else {
    textEl.innerHTML =
      "<span style=\"color:#0fee89\">Interior sum:</span> <strong>" + fmt(intSum) + "°</strong> " +
      "(target " + sumInteriorTarget + "°)" +
      " &nbsp;&middot;&nbsp; " +
      "<span style=\"color:#ff4670\">Exterior sum:</span> <strong>" + fmt(extSum) + "°</strong> " +
      "(target 360°)";
  }
  tallyEl.appendChild(textEl);
}

// Drag handling
var svg = document.getElementById("svg");
var dragIdx = -1;

function svgPoint(evt) {
  var pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  var ctm = svg.getScreenCTM();
  if (!ctm) return null;
  return pt.matrixTransform(ctm.inverse());
}

function startDrag(e) {
  var target = e.target;
  if (!target.dataset || target.dataset.idx === undefined) return;
  dragIdx = parseInt(target.dataset.idx, 10);
  if (target.classList) target.classList.add("dragging");
  e.preventDefault();
}

function moveDrag(e) {
  if (dragIdx < 0) return;
  var evt = (e.touches && e.touches[0]) ? e.touches[0] : e;
  var p = svgPoint(evt);
  if (!p) return;
  // Clamp inside viewbox with margin so vertices stay visible.
  var x = Math.max(20, Math.min(460, p.x));
  var y = Math.max(20, Math.min(300, p.y));
  // Reject drag positions that would push the polygon past a straight
  // line at any vertex (i.e. become concave / self-intersecting). The
  // vertex stays at its last valid spot until the cursor returns inside
  // the convex region.
  var oldX = pts[dragIdx].x, oldY = pts[dragIdx].y;
  pts[dragIdx].x = x;
  pts[dragIdx].y = y;
  if (!isConvex(pts)) {
    pts[dragIdx].x = oldX;
    pts[dragIdx].y = oldY;
    e.preventDefault();
    return;
  }
  draw();
  e.preventDefault();
}

function endDrag() {
  if (dragIdx >= 0) {
    var verts = document.querySelectorAll(".poly-vertex.dragging");
    for (var k = 0; k < verts.length; k++) verts[k].classList.remove("dragging");
  }
  dragIdx = -1;
}

svg.addEventListener("mousedown", startDrag);
svg.addEventListener("touchstart", function(e) {
  if (e.touches && e.touches[0]) {
    var t = e.touches[0];
    var el = document.elementFromPoint(t.clientX, t.clientY);
    if (el) startDrag({ target: el, preventDefault: function() { e.preventDefault(); } });
  }
}, { passive: false });
window.addEventListener("mousemove", moveDrag);
window.addEventListener("touchmove", moveDrag, { passive: false });
window.addEventListener("mouseup", endDrag);
window.addEventListener("touchend", endDrag);

document.getElementById("mode").addEventListener("change", function(e) {
  mode = e.target.value;
  draw();
});

document.getElementById("resetBtn").addEventListener("click", function() {
  pts = INITIAL.map(function(p) { return { x: p.x, y: p.y }; });
  draw();
});

// Apply URL params
document.getElementById("mode").value = mode;
if (qpLock) {
  var modeRow = document.querySelector(".mode-row");
  if (modeRow) modeRow.style.display = "none";
}

draw();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
}
</script>
</body>
</html>
