<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3D Step Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; min-height:22px; gap:10px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .step-num { font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875; letter-spacing:0.4px; }

  .layout { display:grid; grid-template-columns: 1fr; gap:18px; align-items:start; }
  @media (min-width: 560px) { .layout { grid-template-columns: 300px 1fr; gap:18px; } }

  .stage-outer { width:100%; max-width:300px; margin:0 auto; aspect-ratio: 300 / 280; position:relative; }
  .stage-outer svg { display:block; width:100%; height:100%; overflow:visible; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .equations { display:flex; flex-direction:column; gap:14px; padding:4px 2px; min-height:200px; }
  .eq-group { display:flex; flex-direction:column; gap:4px; opacity:0; transition: opacity 0.4s ease; }
  .eq-group.drawn { opacity:1; }
  .eq-line { font-family:'Geist Mono', monospace; line-height:1.5; }
  .eq-line[data-kind="tag"]    { font-size:11px; color:#7a7875; letter-spacing:0.4px; }
  .eq-line[data-kind="hint"]   { font-size:13px; color:#fff067; }
  .eq-line[data-kind="main"]   { font-size:14.5px; color:#f0eeea; }
  .eq-line[data-kind="ans"]    { font-size:17px; color:#f0eeea; font-weight:700; }
  .eq-line[data-kind="note"]   { font-size:11px; color:#7a7875; margin-top:4px; }
  .eq-line .katex { font-size:1em; }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:80px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button.ctl:hover:not(:disabled) { color:#fff067; border-color:#fff067; }
  button.ctl:disabled { opacity:0.3; cursor:not-allowed; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }

  .shape-part { transition: opacity 0.5s ease, fill 0.5s ease, stroke 0.5s ease, stroke-width 0.4s ease, filter 0.4s ease; }
  .shape-part.faded { opacity: 0.18; }
  .shape-part.hidden { opacity: 0; }
  /* Highlight: bright outline + drop-shadow glow keyed to the element's stroke colour */
  .shape-part.highlight {
    stroke-width: 3.5;
    filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 6px currentColor);
  }
  /* Pulse animation while highlighted to draw the eye */
  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 5px currentColor); }
    50%      { filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 10px currentColor); }
  }
  .shape-part.highlight { animation: pulse-glow 1.6s ease-in-out infinite; }
  /* Annotation overlays (measurement brackets, arrows): fade in/out with the step */
  .annotation { opacity: 0; transition: opacity 0.45s ease; }
  .annotation.shown { opacity: 1; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="title"></span>
    <span class="step-num" id="counter"></span>
  </div>
  <div class="layout">
    <div class="stage-outer">
      <svg id="stage" viewBox="0 0 300 280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hemiGrad" cx="38%" cy="32%" r="65%">
            <stop offset="0%" stop-color="rgba(0,171,250,0.50)"/>
            <stop offset="60%" stop-color="rgba(0,171,250,0.18)"/>
            <stop offset="100%" stop-color="rgba(0,171,250,0.05)"/>
          </radialGradient>
          <linearGradient id="cylGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="rgba(0,171,250,0.10)"/>
            <stop offset="50%" stop-color="rgba(0,171,250,0.30)"/>
            <stop offset="100%" stop-color="rgba(0,171,250,0.10)"/>
          </linearGradient>
          <linearGradient id="coneGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="rgba(255,130,44,0.10)"/>
            <stop offset="50%" stop-color="rgba(255,130,44,0.30)"/>
            <stop offset="100%" stop-color="rgba(255,130,44,0.10)"/>
          </linearGradient>
          <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="rgba(255,70,112,0.10)"/>
            <stop offset="50%" stop-color="rgba(255,70,112,0.30)"/>
            <stop offset="100%" stop-color="rgba(255,70,112,0.10)"/>
          </linearGradient>
        </defs>
        <g id="g-shape"></g>
        <g id="g-annotations"></g>
      </svg>
    </div>
    <div class="equations" id="equations"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="prev">← prev</button>
    <button class="ctl" id="next">next →</button>
  </div>
  <p class="footer" id="footer"></p>
</div>

<script>
"use strict";

var qs = new URLSearchParams(location.search);
var PRESET = qs.get("preset") || "frustum-vol";

var COL = {
  blue: "#00abfa", yellow: "#fff067", orange: "#ff822c",
  green: "#0fee89", pink: "#ff4670", grey: "#7a7875", faint: "#3a4a5a"
};

var SVG_W = 300, SVG_H = 280;
var ELLIPSE_RATIO = 0.32;

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function texCoefPi(coef) {
  var v = Math.round(coef * 1000) / 1000;
  if (v === 0) return "0";
  if (v === 1) return "\\pi";
  return parseFloat(v.toFixed(3)).toString() + "\\pi";
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, alignment) {
  var fo = svgEl("foreignObject", {
    x: (x - 50), y: (y - 11), width: 100, height: 22,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "lbl-host";
  div.style.color = color || "#f0eeea";
  div.style.width = "100%"; div.style.height = "100%";
  div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = (alignment === "left" ? "flex-start" : alignment === "right" ? "flex-end" : "center");
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}

// =====================================================================
// SHAPE BUILDERS — each returns a map of "part-name" → SVG element
// The current step decides which parts are shown / faded / hidden.
// =====================================================================
function buildFrustum(p) {
  // p: { R, H, h, r } where r = R * h/H (similar triangles)
  var TOP_PAD = 22, BOT_PAD = 28;
  var avail = SVG_H - TOP_PAD - BOT_PAD;
  var ryFrac = ELLIPSE_RATIO;
  var s = Math.min(avail / (p.H + p.R * ryFrac), 50 / Math.max(p.R, p.r));
  var Rpx = p.R * s, rpx = p.r * s, Hpx = p.H * s;
  var ryBig = Rpx * ryFrac, rySmall = rpx * ryFrac;
  var cx = SVG_W / 2;
  var apexY = TOP_PAD + ryBig * 0.3;
  var cutY = apexY + p.h * s;
  var botY = apexY + Hpx;
  var leftXBot = cx - Rpx, rightXBot = cx + Rpx;
  var leftXTop = cx - rpx, rightXTop = cx + rpx;

  var g = document.getElementById("g-shape");
  g.innerHTML = "";

  // Full cone outline (faint dashed)
  var fullCone = svgEl("path", {
    "class": "shape-part",
    d: "M " + cx + " " + apexY + " L " + leftXBot + " " + botY +
       " A " + Rpx + " " + ryBig + " 0 0 0 " + rightXBot + " " + botY + " Z",
    fill: "none", stroke: COL.faint, "stroke-width": 1.2, "stroke-dasharray": "3 3"
  });
  g.appendChild(fullCone);

  // Small cone (pink) — the tip being removed
  var smallCone = svgEl("path", {
    "class": "shape-part",
    d: "M " + cx + " " + apexY + " L " + leftXTop + " " + cutY +
       " A " + rpx + " " + rySmall + " 0 0 0 " + rightXTop + " " + cutY + " Z",
    fill: "url(#pinkGrad)", stroke: COL.pink, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(smallCone);

  // Frustum body (blue)
  var frustum = svgEl("path", {
    "class": "shape-part",
    d: "M " + leftXBot + " " + botY + " L " + leftXTop + " " + cutY +
       " A " + rpx + " " + rySmall + " 0 0 0 " + rightXTop + " " + cutY +
       " L " + rightXBot + " " + botY +
       " A " + Rpx + " " + ryBig + " 0 0 0 " + leftXBot + " " + botY + " Z",
    fill: "url(#cylGrad)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(frustum);

  // Top circle (yellow)
  var topCircle = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: cutY, rx: rpx, ry: rySmall,
    fill: "rgba(255,240,103,0.22)", stroke: COL.yellow, "stroke-width": 1.5
  });
  g.appendChild(topCircle);

  // Bottom ellipse (back half dashed)
  var botEllipse = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: botY, rx: Rpx, ry: ryBig,
    fill: "none", stroke: COL.blue, "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.7
  });
  g.appendChild(botEllipse);

  // Annular ring highlight (pink dashed when needed for SA step)
  var annulus = svgEl("path", {
    "class": "shape-part hidden",
    d: "M " + leftXTop + " " + cutY +
       " A " + rpx + " " + rySmall + " 0 0 1 " + rightXTop + " " + cutY +
       " A " + rpx + " " + rySmall + " 0 0 1 " + leftXTop + " " + cutY + " Z" +
       " M " + leftXBot + " " + botY +
       " A " + Rpx + " " + ryBig + " 0 0 1 " + rightXBot + " " + botY +
       " A " + Rpx + " " + ryBig + " 0 0 1 " + leftXBot + " " + botY + " Z",
    fill: "rgba(255,70,112,0.30)", "fill-rule": "evenodd",
    stroke: COL.pink, "stroke-width": 1.5
  });
  g.appendChild(annulus);

  // Labels
  svgKaTeXLabel(g, cx + Rpx + 14, botY + 6, "R = " + p.R, COL.blue, "left");
  svgKaTeXLabel(g, cx + rpx + 14, cutY, "r = " + p.r, COL.yellow, "left");
  svgKaTeXLabel(g, cx - 14, (cutY + botY)/2, "H - h", COL.blue, "right");
  svgKaTeXLabel(g, cx - 14, (apexY + cutY)/2, "h = " + p.h, COL.pink, "right");

  return { fullCone: fullCone, smallCone: smallCone, frustum: frustum, topCircle: topCircle, botEllipse: botEllipse, annulus: annulus };
}

function buildHemiCone(p) {
  // p: { r, h, l }  (cone height h; l can be derived)
  var TOP_PAD = 18, BOT_PAD = 18;
  var totalH = p.r + p.h;
  var availH = SVG_H - TOP_PAD - BOT_PAD;
  var s = availH / totalH;
  var rPx = p.r * s, hPx = p.h * s;
  var ryPx = rPx * ELLIPSE_RATIO;
  var cx = SVG_W / 2;
  var hemiCenterY = SVG_H - BOT_PAD - rPx;
  var coneApexY = hemiCenterY - hPx;
  var leftX = cx - rPx, rightX = cx + rPx;

  var g = document.getElementById("g-shape");
  g.innerHTML = "";

  // Hemisphere (blue dome facing down)
  var hemi = svgEl("path", {
    "class": "shape-part",
    d: "M " + leftX + " " + hemiCenterY +
       " A " + rPx + " " + rPx + " 0 0 0 " + rightX + " " + hemiCenterY + " Z",
    fill: "url(#hemiGrad)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(hemi);

  // Cone (orange)
  var cone = svgEl("path", {
    "class": "shape-part",
    d: "M " + cx + " " + coneApexY +
       " L " + leftX + " " + hemiCenterY +
       " A " + rPx + " " + ryPx + " 0 0 0 " + rightX + " " + hemiCenterY + " Z",
    fill: "url(#coneGrad)", stroke: COL.orange, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(cone);

  // Hidden join (dashed grey)
  var join = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: hemiCenterY, rx: rPx, ry: ryPx,
    fill: "none", stroke: COL.grey, "stroke-width": 1, "stroke-dasharray": "3 3"
  });
  g.appendChild(join);

  // Slant line
  var slant = svgEl("line", {
    "class": "shape-part",
    x1: cx, y1: coneApexY, x2: rightX, y2: hemiCenterY,
    stroke: COL.pink, "stroke-width": 1.5
  });
  g.appendChild(slant);

  // Labels
  svgKaTeXLabel(g, cx + rPx*0.5, hemiCenterY + ryPx + 16, "r = " + p.r, COL.yellow, "left");
  svgKaTeXLabel(g, cx - 14, (hemiCenterY + coneApexY)/2, "h = " + p.h, COL.orange, "right");
  if (p.l) svgKaTeXLabel(g, cx + rPx*0.6 + 12, (coneApexY + hemiCenterY)/2 - 6, "l = " + p.l, COL.pink, "left");

  return { hemi: hemi, cone: cone, join: join, slant: slant };
}

function buildConeOnCylinder(p) {
  // p: { r, hCyl, hCone, l }
  var TOP_PAD = 18, BOT_PAD = 22;
  var totalH = p.hCyl + p.hCone;
  var avail = SVG_H - TOP_PAD - BOT_PAD;
  var s = avail / totalH;
  var rPx = p.r * s, hCylPx = p.hCyl * s, hConePx = p.hCone * s;
  var ryPx = rPx * ELLIPSE_RATIO;
  var cx = SVG_W / 2;
  var cylBottomY = SVG_H - BOT_PAD;
  var cylTopY = cylBottomY - hCylPx;
  var coneApexY = cylTopY - hConePx;
  var leftX = cx - rPx, rightX = cx + rPx;

  var g = document.getElementById("g-shape");
  g.innerHTML = "";

  // Cylinder (blue)
  var cyl = svgEl("path", {
    "class": "shape-part",
    d: "M " + leftX + " " + cylTopY +
       " L " + leftX + " " + cylBottomY +
       " A " + rPx + " " + ryPx + " 0 0 0 " + rightX + " " + cylBottomY +
       " L " + rightX + " " + cylTopY +
       " A " + rPx + " " + ryPx + " 0 0 1 " + leftX + " " + cylTopY + " Z",
    fill: "url(#cylGrad)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(cyl);

  // Cone (orange)
  var cone = svgEl("path", {
    "class": "shape-part",
    d: "M " + cx + " " + coneApexY +
       " L " + leftX + " " + cylTopY +
       " A " + rPx + " " + ryPx + " 0 0 0 " + rightX + " " + cylTopY + " Z",
    fill: "url(#coneGrad)", stroke: COL.orange, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(cone);

  // Bottom ellipse (visible cylinder base, yellow)
  var botEllipse = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: cylBottomY, rx: rPx, ry: ryPx,
    fill: "rgba(255,240,103,0.18)", stroke: COL.yellow, "stroke-width": 1.5
  });
  g.appendChild(botEllipse);

  // Hidden join (dashed)
  var join = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: cylTopY, rx: rPx, ry: ryPx,
    fill: "none", stroke: COL.grey, "stroke-width": 1, "stroke-dasharray": "3 3"
  });
  g.appendChild(join);

  // Slant line on cone
  var slant = svgEl("line", {
    "class": "shape-part",
    x1: cx, y1: coneApexY, x2: rightX, y2: cylTopY,
    stroke: COL.pink, "stroke-width": 1.5
  });
  g.appendChild(slant);

  // Labels
  svgKaTeXLabel(g, cx + rPx + 14, cylBottomY, "r = " + p.r, COL.yellow, "left");
  svgKaTeXLabel(g, cx - 14, (cylTopY + cylBottomY)/2, "h_{\\text{cyl}} = " + p.hCyl, COL.blue, "right");
  svgKaTeXLabel(g, cx - 14, (cylTopY + coneApexY)/2, "h_{\\text{cone}} = " + p.hCone, COL.orange, "right");
  if (p.l) svgKaTeXLabel(g, cx + rPx*0.6 + 14, (coneApexY + cylTopY)/2 - 4, "l = " + p.l, COL.pink, "left");

  return { cyl: cyl, cone: cone, botEllipse: botEllipse, join: join, slant: slant };
}

function buildCuboidDrilled(p) {
  // p: { L, W, H, rh }  (rh = hole radius)
  var TOP_PAD = 18, BOT_PAD = 22;
  var avail = SVG_H - TOP_PAD - BOT_PAD;
  var maxDim = Math.max(p.L, p.W * 0.9 + p.H, p.W);
  var sc = Math.min(avail / (p.H + p.W * 0.5), (SVG_W - 60) / (p.L + p.W * 0.6));
  var dx = p.W * 0.6 * sc;
  var dy = -p.W * 0.45 * sc;
  var Lp = p.L * sc, Hp = p.H * sc;
  var ax = (SVG_W - Lp - dx) / 2;
  var ay = (SVG_H + Hp + Math.abs(dy)) / 2;
  var rPx = p.rh * sc;

  var g = document.getElementById("g-shape");
  g.innerHTML = "";

  // Back face (faint)
  var back = svgEl("path", {
    "class": "shape-part",
    d: "M " + (ax+dx) + " " + (ay+dy) + " L " + (ax+dx+Lp) + " " + (ay+dy) +
       " L " + (ax+dx+Lp) + " " + (ay+dy-Hp) + " L " + (ax+dx) + " " + (ay+dy-Hp) + " Z",
    fill: "rgba(0,171,250,0.06)", stroke: COL.faint, "stroke-width": 1, "stroke-dasharray": "3 3"
  });
  g.appendChild(back);

  // Top face (yellow)
  var top = svgEl("path", {
    "class": "shape-part",
    d: "M " + ax + " " + (ay-Hp) + " L " + (ax+Lp) + " " + (ay-Hp) +
       " L " + (ax+Lp+dx) + " " + (ay-Hp+dy) + " L " + (ax+dx) + " " + (ay-Hp+dy) + " Z",
    fill: "rgba(255,240,103,0.20)", stroke: COL.yellow, "stroke-width": 1.5
  });
  g.appendChild(top);

  // Right face
  var right = svgEl("path", {
    "class": "shape-part",
    d: "M " + (ax+Lp) + " " + ay + " L " + (ax+Lp) + " " + (ay-Hp) +
       " L " + (ax+Lp+dx) + " " + (ay-Hp+dy) + " L " + (ax+Lp+dx) + " " + (ay+dy) + " Z",
    fill: "rgba(255,130,44,0.16)", stroke: COL.orange, "stroke-width": 1.5
  });
  g.appendChild(right);

  // Front face (blue)
  var front = svgEl("path", {
    "class": "shape-part",
    d: "M " + ax + " " + ay + " L " + (ax+Lp) + " " + ay +
       " L " + (ax+Lp) + " " + (ay-Hp) + " L " + ax + " " + (ay-Hp) + " Z",
    fill: "rgba(0,171,250,0.18)", stroke: COL.blue, "stroke-width": 1.6
  });
  g.appendChild(front);

  // Cylindrical hole on top (pink)
  var holeXTop = ax + Lp/2 + dx/2;
  var holeYTop = ay - Hp + dy/2;
  var holeRyEll = rPx * 0.32;
  var holeCircle = svgEl("ellipse", {
    "class": "shape-part",
    cx: holeXTop, cy: holeYTop, rx: rPx, ry: holeRyEll,
    fill: "rgba(255,70,112,0.30)", stroke: COL.pink, "stroke-width": 1.5
  });
  g.appendChild(holeCircle);

  // Hole's inner walls (dashed pink lines)
  var holeWallL = svgEl("line", {
    "class": "shape-part",
    x1: holeXTop - rPx, y1: holeYTop, x2: holeXTop - rPx, y2: holeYTop + Hp,
    stroke: COL.pink, "stroke-width": 1.2, "stroke-dasharray": "3 3"
  });
  g.appendChild(holeWallL);
  var holeWallR = svgEl("line", {
    "class": "shape-part",
    x1: holeXTop + rPx, y1: holeYTop, x2: holeXTop + rPx, y2: holeYTop + Hp,
    stroke: COL.pink, "stroke-width": 1.2, "stroke-dasharray": "3 3"
  });
  g.appendChild(holeWallR);
  // Bottom dashed circle (hole exits the bottom)
  var holeBottom = svgEl("ellipse", {
    "class": "shape-part",
    cx: holeXTop, cy: holeYTop + Hp, rx: rPx, ry: holeRyEll,
    fill: "none", stroke: COL.pink, "stroke-width": 1, "stroke-dasharray": "3 3"
  });
  g.appendChild(holeBottom);

  // Labels
  svgKaTeXLabel(g, ax + Lp/2, ay + 12, "L = " + p.L, COL.blue, "center");
  svgKaTeXLabel(g, ax - 12, ay - Hp/2, "h = " + p.H, COL.blue, "right");
  svgKaTeXLabel(g, ax + Lp + dx/2 + 10, ay - Hp + dy/2 - 8, "W = " + p.W, COL.orange, "left");
  svgKaTeXLabel(g, holeXTop + rPx + 10, holeYTop, "r = " + p.rh, COL.pink, "left");

  return {
    cuboid: { back: back, top: top, right: right, front: front },
    hole: { circle: holeCircle, wallL: holeWallL, wallR: holeWallR, bottom: holeBottom }
  };
}

function buildSectorToCone(p) {
  // p: { sectorR, theta }
  // The sector and the cone share the SAME apex point. As we step from
  // sector → cone, the sector fades while the cone fades in over the same
  // space, reading visually as the sector rolling up.
  var sectorR = p.sectorR, theta = p.theta;
  var s = 14;
  var sectorRpx = sectorR * s;
  var cx = SVG_W / 2;

  // Cone derived geometry
  var coneR_cm  = sectorR * theta / 360;
  var coneRpx   = coneR_cm * s;
  var coneRyPx  = coneRpx * ELLIPSE_RATIO;
  var coneH_cm  = Math.sqrt(sectorR * sectorR - coneR_cm * coneR_cm);
  var coneHPx   = coneH_cm * s;

  // Apex sits above the centre. The sector arc reaches y = apexY + sectorRpx;
  // the cone base reaches y = apexY + coneHPx. We'll fit BOTH inside the SVG
  // by using the LARGER vertical extent.
  var TOP_PAD = 22, BOT_PAD = 28;
  var maxExtent = Math.max(sectorRpx, coneHPx);
  var avail = SVG_H - TOP_PAD - BOT_PAD;
  if (maxExtent > avail) {
    var k = avail / maxExtent;
    sectorRpx *= k; coneRpx *= k; coneRyPx *= k; coneHPx *= k;
  }
  var apexY = TOP_PAD;
  var sectorArcY = apexY + sectorRpx;
  var coneBaseY  = apexY + coneHPx;

  // Sector arc endpoints. Math angles measured CCW from +x; SVG y is down,
  // so an angle of 90° in math (cos=0, sin=1) maps to y = apexY + r — i.e.
  // STRAIGHT DOWN on screen. For a sector centred straight down spanning θ:
  //   leftAngle  = 90° + θ/2  (visually left of the down axis)
  //   rightAngle = 90° − θ/2  (visually right)
  function ptFromApex(deg, r) {
    var rad = deg * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: apexY + r * Math.sin(rad) };
  }
  var leftAngle  = 90 + theta/2;
  var rightAngle = 90 - theta/2;
  var pLeft  = ptFromApex(leftAngle,  sectorRpx);
  var pRight = ptFromApex(rightAngle, sectorRpx);
  var large  = (theta > 180) ? 1 : 0;

  var g = document.getElementById("g-shape");
  g.innerHTML = "";

  // Sector (yellow fan, apex up, arc opens down).
  // Both endpoints sit below the apex at the same y. The arc has to bulge
  // FURTHER down (away from the apex) — i.e. through the bottom of the
  // circle centred at the apex. Going from pLeft (lower-left) through the
  // bottom to pRight (lower-right) is visually counter-clockwise around
  // the apex, so sweep-flag = 0. With sweep-flag = 1 SVG would draw the
  // arc on the OTHER possible circle, producing a bow-tie / arrow shape.
  var sector = svgEl("path", {
    "class": "shape-part",
    d: "M " + cx + " " + apexY +
       " L " + pLeft.x.toFixed(2) + " " + pLeft.y.toFixed(2) +
       " A " + sectorRpx + " " + sectorRpx + " 0 " + large + " 0 " +
       pRight.x.toFixed(2) + " " + pRight.y.toFixed(2) + " Z",
    fill: "rgba(255,240,103,0.20)", stroke: COL.yellow, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(sector);

  // Cone body — same apex point. Drawn on top, hidden initially.
  var coneBody = svgEl("path", {
    "class": "shape-part hidden",
    d: "M " + cx + " " + apexY +
       " L " + (cx - coneRpx) + " " + coneBaseY +
       " A " + coneRpx + " " + coneRyPx + " 0 0 0 " + (cx + coneRpx) + " " + coneBaseY + " Z",
    fill: "url(#coneGrad)", stroke: COL.orange, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(coneBody);

  // Cone base ellipse (yellow, full ellipse — front + back)
  var coneBase = svgEl("ellipse", {
    "class": "shape-part hidden",
    cx: cx, cy: coneBaseY, rx: coneRpx, ry: coneRyPx,
    fill: "rgba(255,240,103,0.20)", stroke: COL.yellow, "stroke-width": 1.5
  });
  g.appendChild(coneBase);

  // Sector R label along the LEFT slant edge (from apex to pLeft)
  svgKaTeXLabel(g,
    (cx + pLeft.x) / 2 - 14, (apexY + pLeft.y) / 2,
    "R = " + p.sectorR, COL.yellow, "right");
  // θ label inside the sector, near the apex
  svgKaTeXLabel(g, cx + 14, apexY + 22, p.theta + "°", COL.green, "left");

  return { sector: sector, coneBody: coneBody, coneBase: coneBase };
}

// 5.5 review's comprehensive composite: cylinder on top of a hemisphere,
// with a small cylindrical hole drilled all the way down through the
// cylinder (the hole stops at the hemisphere's flat side, doesn't enter
// the dome).
function buildHemiCylDrilled(p) {
  // p: { R, hCyl, r }  (R = cylinder/hemi radius, r = drill radius)
  var R = p.R, hCyl = p.hCyl, r = p.r;
  var TOP_PAD = 18, BOT_PAD = 28;
  var totalH = hCyl + R; // cylinder + dome
  var avail = SVG_H - TOP_PAD - BOT_PAD;
  var s = Math.min(avail / totalH, 14);
  var Rpx = R * s, rPx = r * s, hCylPx = hCyl * s;
  var ryOuter = Rpx * ELLIPSE_RATIO;
  var ryInner = rPx * ELLIPSE_RATIO;
  var cx = SVG_W / 2;
  var cylTopY = TOP_PAD + ryOuter * 0.3;
  var cylBottomY = cylTopY + hCylPx;
  var hemiCenterY = cylBottomY;        // centre of dome equator (= cylinder bottom)
  var leftXOuter = cx - Rpx, rightXOuter = cx + Rpx;

  var g = document.getElementById("g-shape");
  g.innerHTML = "";

  // Hemisphere dome (faces DOWN, below the cylinder)
  var hemi = svgEl("path", {
    "class": "shape-part",
    d: "M " + leftXOuter + " " + hemiCenterY +
       " A " + Rpx + " " + Rpx + " 0 0 0 " + rightXOuter + " " + hemiCenterY + " Z",
    fill: "url(#hemiGrad)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(hemi);

  // Cylinder body (blue gradient)
  var cyl = svgEl("path", {
    "class": "shape-part",
    d: "M " + leftXOuter + " " + cylTopY +
       " L " + leftXOuter + " " + cylBottomY +
       " A " + Rpx + " " + ryOuter + " 0 0 0 " + rightXOuter + " " + cylBottomY +
       " L " + rightXOuter + " " + cylTopY +
       " A " + Rpx + " " + ryOuter + " 0 0 1 " + leftXOuter + " " + cylTopY + " Z",
    fill: "url(#cylGrad)", stroke: COL.blue, "stroke-width": 2, "stroke-linejoin": "round"
  });
  g.appendChild(cyl);

  // Cylinder top — annulus (outer ellipse minus the hole circle)
  // Use a path with even-odd fill so the inner ellipse cuts a hole.
  var cylTop = svgEl("path", {
    "class": "shape-part",
    d: "M " + (cx - Rpx) + " " + cylTopY +
       " A " + Rpx + " " + ryOuter + " 0 0 0 " + (cx + Rpx) + " " + cylTopY +
       " A " + Rpx + " " + ryOuter + " 0 0 0 " + (cx - Rpx) + " " + cylTopY + " Z " +
       " M " + (cx - rPx) + " " + cylTopY +
       " A " + rPx + " " + ryInner + " 0 0 0 " + (cx + rPx) + " " + cylTopY +
       " A " + rPx + " " + ryInner + " 0 0 0 " + (cx - rPx) + " " + cylTopY + " Z",
    "fill-rule": "evenodd",
    fill: "rgba(255,240,103,0.18)", stroke: COL.yellow, "stroke-width": 1.5
  });
  g.appendChild(cylTop);

  // The hole's top opening (pink solid ellipse) — sits inside the annulus
  var holeTop = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: cylTopY, rx: rPx, ry: ryInner,
    fill: "rgba(255,70,112,0.30)", stroke: COL.pink, "stroke-width": 1.5
  });
  g.appendChild(holeTop);

  // Hole's inner wall — two vertical dashed pink lines from top to cylinder bottom
  var holeWallL = svgEl("line", {
    "class": "shape-part",
    x1: cx - rPx, y1: cylTopY, x2: cx - rPx, y2: cylBottomY,
    stroke: COL.pink, "stroke-width": 1.4, "stroke-dasharray": "3 3"
  });
  g.appendChild(holeWallL);
  var holeWallR = svgEl("line", {
    "class": "shape-part",
    x1: cx + rPx, y1: cylTopY, x2: cx + rPx, y2: cylBottomY,
    stroke: COL.pink, "stroke-width": 1.4, "stroke-dasharray": "3 3"
  });
  g.appendChild(holeWallR);
  // A grouping wrapper so highlight ["holeWall"] hits both lines.
  // (Done via the flatParts walker — both keys are leaf elements; we'll
  // expose them under the names "holeWallL" / "holeWallR" and reference
  // each in the preset's highlight list.)

  // Hole's bottom disc — sits at the bottom of the cylinder (= top of
  // hemisphere flat side). Inside the well, this small disc is exposed.
  var holeBottom = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: cylBottomY, rx: rPx, ry: ryInner,
    fill: "rgba(255,70,112,0.20)", stroke: COL.pink, "stroke-width": 1.4, "stroke-dasharray": "3 2"
  });
  g.appendChild(holeBottom);

  // Hidden join (dashed grey ellipse where cylinder meets hemisphere)
  var join = svgEl("ellipse", {
    "class": "shape-part",
    cx: cx, cy: cylBottomY, rx: Rpx, ry: ryOuter,
    fill: "none", stroke: COL.grey, "stroke-width": 1, "stroke-dasharray": "4 3"
  });
  g.appendChild(join);

  // Labels
  svgKaTeXLabel(g, cx + Rpx + 14, (cylTopY + cylBottomY)/2, "h_{\\text{cyl}} = " + p.hCyl, COL.blue, "left");
  svgKaTeXLabel(g, cx + rPx + 12, cylTopY - 4, "r = " + p.r, COL.pink, "left");
  svgKaTeXLabel(g, cx - Rpx*0.5, hemiCenterY + Rpx + 16, "R = " + p.R, COL.yellow, "center");

  return {
    hemi: hemi, cyl: cyl, cylTop: cylTop,
    holeTop: holeTop, holeWallL: holeWallL, holeWallR: holeWallR,
    holeBottom: holeBottom, join: join
  };
}

          { kind: "tag", text: "STEP 4: CONE HEIGHT (PYTHAGORAS)" },
          { kind: "main", tex: "h = \\sqrt{l^{2} - r^{2}} = \\sqrt{64 - \\tfrac{25}{9}} = \\tfrac{\\sqrt{551}}{3}" }
        ]
      },
      {
        show: ["coneBody", "coneBase"],
        highlight: ["coneBody"],
        eqs: [
          { kind: "tag", text: "STEP 5: VOLUME" },
          { kind: "main", tex: "V = \\tfrac{1}{3}\\pi r^{2} h = \\tfrac{1}{3}\\pi \\cdot \\tfrac{25}{9} \\cdot \\tfrac{\\sqrt{551}}{3}" },
          { kind: "ans", tex: "\\approx 22.7\\;\\text{cm}^{3}" }
        ]
      }
    ]
  },
  "hemicyl-drilled": {
    title: "Cylinder + hemisphere with a drilled hole",
    builder: buildHemiCylDrilled,
    params: { R: 5, hCyl: 8, r: 1 },
    footer: "comprehensive composite · volume by sum/subtract · SA face-by-face",
    steps: [
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        eqs: [
          { kind: "tag", text: "STEP 1: THE COMPOSITE SOLID" },
          { kind: "hint", text: "cylinder (top, R=5, h=8) + hemisphere dome (bottom, r=5)" },
          { kind: "note", text: "a small cylindrical hole (r=1) is drilled through the cylinder; it stops at the hemisphere's flat side" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        highlight: ["cyl"],
        eqs: [
          { kind: "tag", text: "STEP 2: CYLINDER VOLUME" },
          { kind: "main", tex: "V_\\text{cyl} = \\pi R^{2} h = \\pi(25)(8) = 200\\pi" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        highlight: ["hemi"],
        eqs: [
          { kind: "tag", text: "STEP 3: HEMISPHERE VOLUME" },
          { kind: "main", tex: "V_\\text{hemi} = \\tfrac{2}{3}\\pi R^{3} = \\tfrac{2}{3}\\pi(125) = \\tfrac{250\\pi}{3}" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        highlight: ["holeTop", "holeWallL", "holeWallR", "holeBottom"],
        eqs: [
          { kind: "tag", text: "STEP 4: SUBTRACT THE DRILLED HOLE" },
          { kind: "main", tex: "V_\\text{hole} = \\pi r^{2} h_\\text{cyl} = \\pi(1)(8) = 8\\pi" },
          { kind: "main", tex: "V = 200\\pi + \\tfrac{250\\pi}{3} - 8\\pi = \\tfrac{826\\pi}{3}" },
          { kind: "ans", tex: "\\approx 275.3\\pi\\;\\text{cm}^{3}" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        fade: ["join"],
        highlight: ["cyl"],
        eqs: [
          { kind: "tag", text: "STEP 5: SA — CYLINDER CURVED" },
          { kind: "hint", text: "cylinder bottom + hemisphere flat are GLUED → cancel" },
          { kind: "main", tex: "2\\pi R h = 2\\pi(5)(8) = 80\\pi" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        fade: ["join"],
        highlight: ["hemi"],
        eqs: [
          { kind: "tag", text: "STEP 6: SA — HEMISPHERE CURVED" },
          { kind: "main", tex: "2\\pi R^{2} = 2\\pi(25) = 50\\pi" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        fade: ["join"],
        highlight: ["cylTop"],
        eqs: [
          { kind: "tag", text: "STEP 7: SA — CYLINDER TOP (ANNULUS)" },
          { kind: "hint", text: "outer top minus the hole's circle" },
          { kind: "main", tex: "\\pi R^{2} - \\pi r^{2} = 25\\pi - \\pi = 24\\pi" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        fade: ["join"],
        highlight: ["holeWallL", "holeWallR"],
        eqs: [
          { kind: "tag", text: "STEP 8: SA — INNER WALL OF THE HOLE" },
          { kind: "main", tex: "2\\pi r h_\\text{cyl} = 2\\pi(1)(8) = 16\\pi" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom", "join"],
        fade: ["join"],
        highlight: ["holeBottom"],
        eqs: [
          { kind: "tag", text: "STEP 9: SA — HOLE BOTTOM (TINY EXPOSED DISC)" },
          { kind: "hint", text: "the hole hits the hemisphere's flat side — that little disc is exposed inside the well" },
          { kind: "main", tex: "\\pi r^{2} = \\pi(1)^{2} = \\pi" }
        ]
      },
      {
        show: ["cyl", "hemi", "cylTop", "holeTop", "holeWallL", "holeWallR", "holeBottom"],
        eqs: [
          { kind: "tag", text: "STEP 10: SUM EVERY EXPOSED SURFACE" },
          { kind: "main", tex: "\\text{SA} = 80\\pi + 50\\pi + 24\\pi + 16\\pi + \\pi" },
          { kind: "ans", tex: "= 171\\pi\\;\\text{cm}^{2}" }
        ]
      }
    ]
  }
};

// =====================================================================
// RUNTIME
// =====================================================================
var preset = PRESETS[PRESET] || PRESETS["frustum-vol"];
document.getElementById("title").textContent = preset.title;
document.getElementById("footer").textContent = preset.footer || "";

// Build the shape
var parts = preset.builder(preset.params);

// Flatten parts (some builders return nested groups, e.g. cuboid/hole groups)
function flattenParts(p) {
  var out = {};
  for (var k in p) {
    if (p[k] && p[k].setAttribute) {
      out[k] = p[k];
    } else if (p[k] && typeof p[k] === "object") {
      // Sub-group — promote children with the parent name as prefix
      for (var kk in p[k]) {
        out[k + "." + kk] = p[k][kk];
        out[k] = p[k]; // also keep the group reference for show/hide all
      }
    }
  }
  return out;
}
var flatParts = flattenParts(parts);

// Walk a part name, calling cb on every leaf SVG element it covers
// (handles both individual parts and groups returned by builders).
function eachLeaf(name, cb) {
  var el = flatParts[name];
  if (el && el.classList) { cb(el); return; }
  // Group: visit every member with that prefix
  Object.keys(flatParts).forEach(function(kk) {
    if (kk.indexOf(name + ".") === 0 && flatParts[kk].classList) cb(flatParts[kk]);
  });
}

function setVisibility(showList, fadeList, highlightList) {
  showList = showList || [];
  fadeList = fadeList || [];
  highlightList = highlightList || [];
  // Reset every leaf to hidden, no highlight
  for (var k in flatParts) {
    var el = flatParts[k];
    if (!el || !el.classList) continue;
    el.classList.remove("faded", "highlight");
    el.classList.add("hidden");
  }
  showList.forEach(function(name) {
    eachLeaf(name, function(el) { el.classList.remove("hidden", "faded"); });
  });
  fadeList.forEach(function(name) {
    eachLeaf(name, function(el) { el.classList.remove("hidden"); el.classList.add("faded"); });
  });
  highlightList.forEach(function(name) {
    eachLeaf(name, function(el) {
      el.classList.remove("hidden", "faded");
      el.classList.add("highlight");
      // Make the drop-shadow `currentColor` match the element's stroke
      var stroke = el.getAttribute("stroke");
      if (stroke && stroke !== "none") el.style.color = stroke;
    });
  });
}

var stepIdx = 0;
var equationsEl = document.getElementById("equations");
var counterEl = document.getElementById("counter");
var prevBtn = document.getElementById("prev");
var nextBtn = document.getElementById("next");

function renderStep() {
  var step = preset.steps[stepIdx];
  if (!step) return;
  setVisibility(step.show, step.fade, step.highlight);
  equationsEl.innerHTML = "";
  step.eqs.forEach(function(eq) {
    var line = document.createElement("div");
    line.className = "eq-line";
    line.dataset.kind = eq.kind;
    if (eq.tex) {
      tryRender(line, eq.tex);
    } else {
      line.textContent = eq.text;
    }
    equationsEl.appendChild(line);
  });
  // fade-in cascade
  Array.prototype.forEach.call(equationsEl.children, function(el, i) {
    setTimeout(function() { el.classList.add("drawn"); }, 60 * i);
  });
  Array.prototype.forEach.call(equationsEl.children, function(el) {
    var g = document.createElement("div");
    g.className = "eq-group drawn";
  });
  counterEl.textContent = (stepIdx + 1) + " / " + preset.steps.length;
  prevBtn.disabled = stepIdx === 0;
  nextBtn.disabled = stepIdx === preset.steps.length - 1;
  reportHeight();
}

prevBtn.onclick = function() { if (stepIdx > 0) { stepIdx--; renderStep(); } };
nextBtn.onclick = function() { if (stepIdx < preset.steps.length - 1) { stepIdx++; renderStep(); } };

renderStep();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
