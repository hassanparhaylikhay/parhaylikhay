<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Two Reflections Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }

  .picker { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .picker .pname { font-family:'Geist Mono',monospace; font-size:10.5px; color:#7a7875; letter-spacing:0.5px; text-transform:uppercase; min-width:90px; }
  .picker .pname.m1 { color:#fff067; }
  .picker .pname.m2 { color:#0fee89; }
  .preset-btn { background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:4px 9px; border-radius:4px; cursor:pointer; transition: all 0.12s ease; }
  .preset-btn:hover { color:#f0eeea; border-color:#3a4a5a; }
  .preset-btn.m1.active { background:rgba(255,240,103,0.06); color:#fff067; border-color:#fff067; }
  .preset-btn.m2.active { background:rgba(15,238,137,0.06); color:#0fee89; border-color:#0fee89; }

  #stage { display:block; width:100%; height:auto; user-select:none; overflow:visible; touch-action:none; cursor:default; }
  #stage.grabbing { cursor:grabbing; }
  #stage.hover-grab { cursor:grab; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .ms-strip { display:flex; align-items:center; gap:14px; padding:10px 14px; margin-top:10px; background:rgba(0,171,250,0.04); border:1px solid rgba(0,171,250,0.18); border-radius:8px; }
  .ms-strip .tag { font-family:'Geist Mono',monospace; font-size:10px; color:#00abfa; letter-spacing:0.5px; text-transform:uppercase; font-weight:600; }
  .ms-strip .eq { font-size:15px; color:#f0eeea; }
  .ms-strip .eq .katex { font-size:1em; }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 1.5px currentColor); }
    50%      { filter: drop-shadow(0 0 5px currentColor) drop-shadow(0 0 8px currentColor); }
  }
  .handle { animation: pulse-glow 1.8s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">TWO REFLECTIONS</span>
    <span class="meta">drag the handles or pick a preset</span>
  </div>

  <div class="picker">
    <span class="pname m1">first mirror</span>
    <span id="picker-m1"></span>
  </div>
  <div class="picker">
    <span class="pname m2">second mirror</span>
    <span id="picker-m2"></span>
  </div>

  <svg id="stage" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-grid"></g>
    <g id="g-axes"></g>
    <g id="g-ticks"></g>
    <g id="g-mirrors"></g>
    <g id="g-object"></g>
    <g id="g-inter"></g>
    <g id="g-final"></g>
    <g id="g-centre"></g>
    <g id="g-handles"></g>
  </svg>

  <div class="ms-strip">
    <span class="tag">single equivalent transformation</span>
    <span class="eq" id="eq-display"></span>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:"#00abfa", yellow:"#fff067", orange:"#ff822c", green:"#0fee89",
  pink:"#ff4670", faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

// world
var SVG_W = 480, SVG_H = 320;
var X_MIN = -7, X_MAX = 9, Y_MIN = -5, Y_MAX = 5;
var pxPerX = SVG_W / (X_MAX - X_MIN);
var pxPerY = SVG_H / (Y_MAX - Y_MIN);
var UNIT = Math.min(pxPerX, pxPerY);
var ORIGIN_PX = {
  x: (SVG_W - (X_MAX - X_MIN) * UNIT) / 2 - X_MIN * UNIT,
  y: SVG_H - (-Y_MIN) * UNIT - (SVG_H - (Y_MAX - Y_MIN) * UNIT) / 2
};
function toSx(x){ return ORIGIN_PX.x + x * UNIT; }
function toSy(y){ return ORIGIN_PX.y - y * UNIT; }
function fromSx(sx){ return (sx - ORIGIN_PX.x) / UNIT; }
function fromSy(sy){ return (ORIGIN_PX.y - sy) / UNIT; }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function clampMath(p){ return { x: clamp(p.x, X_MIN + 0.5, X_MAX - 0.5), y: clamp(p.y, Y_MIN + 0.5, Y_MAX - 0.5) }; }
function snapHalf(v){ return Math.round(v * 2) / 2; }

var OBJ = [ {x:2,y:1}, {x:4,y:1}, {x:2,y:2} ];
var LABELS = ['A','B','C'];

// preset definitions
var PRESETS = {
  "y0":  { label: "y = 0", p1:{x:-5,y:0}, p2:{x:5,y:0} },
  "x0":  { label: "x = 0", p1:{x:0,y:-4}, p2:{x:0,y:4} },
  "yx":  { label: "y = x", p1:{x:-4,y:-4}, p2:{x:4,y:4} },
  "ynx": { label: "y = -x", p1:{x:-4,y:4}, p2:{x:4,y:-4} },
  "y1":  { label: "y = 1", p1:{x:-5,y:1}, p2:{x:5,y:1} },
  "x2":  { label: "x = 2", p1:{x:2,y:-4}, p2:{x:2,y:4} }
};

// State: target (P) and display (D), each with two mirrors.
// presetKey is null whenever user drags a handle; set whenever a preset chip is clicked.
var P = {
  M1: { p1: clone(PRESETS.y0.p1), p2: clone(PRESETS.y0.p2), preset: "y0" },
  M2: { p1: clone(PRESETS.yx.p1), p2: clone(PRESETS.yx.p2), preset: "yx" }
};
var D = {
  M1: { p1: clone(PRESETS.y0.p1), p2: clone(PRESETS.y0.p2) },
  M2: { p1: clone(PRESETS.yx.p1), p2: clone(PRESETS.yx.p2) }
};
function clone(p){ return { x: p.x, y: p.y }; }

var SPRING = 0.22, EPS = 0.005;
var raf = null;

// math
function reflectPtLine(p, a, b){
  var dx = b.x - a.x, dy = b.y - a.y;
  var L = dx*dx + dy*dy;
  if (L < 1e-6) return p;
  var t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / L;
  var fx = a.x + t * dx, fy = a.y + t * dy;
  return { x: 2*fx - p.x, y: 2*fy - p.y };
}
function lineIntersection(a1, a2, b1, b2){
  var x1=a1.x,y1=a1.y,x2=a2.x,y2=a2.y,x3=b1.x,y3=b1.y,x4=b2.x,y4=b2.y;
  var denom = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
  if (Math.abs(denom) < 1e-6) return null;
  var t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / denom;
  return { x: x1 + t*(x2-x1), y: y1 + t*(y2-y1) };
}
function dist2(a, b){ var dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; }

// KaTeX
function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}
function svgKaTeXLabel(parent, x, y, tex, color, align){
  align = align || "center";
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - 50); fo.setAttribute("y", y - 11);
  fo.setAttribute("width", 100); fo.setAttribute("height", 22);
  fo.style.overflow = "visible"; fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "22px"; div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host"; div.style.color = color || COL.off;
  fo.appendChild(div); parent.appendChild(fo);
  tryRender(div, tex);
}

function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

function drawGridAxes(){
  var gG = document.getElementById("g-grid");
  var gA = document.getElementById("g-axes");
  var gT = document.getElementById("g-ticks");
  clear(gG); clear(gA); clear(gT);
  for (var x = Math.ceil(X_MIN); x <= X_MAX; x++){
    var l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1", toSx(x)); l.setAttribute("x2", toSx(x));
    l.setAttribute("y1", toSy(Y_MIN)); l.setAttribute("y2", toSy(Y_MAX));
    l.setAttribute("stroke", "#141e2a"); l.setAttribute("stroke-width", 0.7);
    gG.appendChild(l);
  }
  for (var y = Math.ceil(Y_MIN); y <= Y_MAX; y++){
    var l2 = document.createElementNS("http://www.w3.org/2000/svg","line");
    l2.setAttribute("y1", toSy(y)); l2.setAttribute("y2", toSy(y));
    l2.setAttribute("x1", toSx(X_MIN)); l2.setAttribute("x2", toSx(X_MAX));
    l2.setAttribute("stroke", "#141e2a"); l2.setAttribute("stroke-width", 0.7);
    gG.appendChild(l2);
  }
  var ax = document.createElementNS("http://www.w3.org/2000/svg","line");
  ax.setAttribute("x1", toSx(X_MIN)); ax.setAttribute("x2", toSx(X_MAX));
  ax.setAttribute("y1", toSy(0)); ax.setAttribute("y2", toSy(0));
  ax.setAttribute("stroke", COL.faint); ax.setAttribute("stroke-width", 1.2);
  gA.appendChild(ax);
  var ay = document.createElementNS("http://www.w3.org/2000/svg","line");
  ay.setAttribute("y1", toSy(Y_MIN)); ay.setAttribute("y2", toSy(Y_MAX));
  ay.setAttribute("x1", toSx(0)); ay.setAttribute("x2", toSx(0));
  ay.setAttribute("stroke", COL.faint); ay.setAttribute("stroke-width", 1.2);
  gA.appendChild(ay);
  for (var xt = Math.ceil(X_MIN); xt <= X_MAX; xt++){
    if (xt === 0) continue;
    svgKaTeXLabel(gT, toSx(xt), toSy(0) + 11, String(xt), COL.grey);
  }
  for (var yt = Math.ceil(Y_MIN); yt <= Y_MAX; yt++){
    if (yt === 0) continue;
    svgKaTeXLabel(gT, toSx(0) - 12, toSy(yt), String(yt), COL.grey);
  }
}

function drawMirrorLine(g, a, b, color){
  var dx = b.x - a.x, dy = b.y - a.y;
  var len = Math.sqrt(dx*dx + dy*dy);
  if (len < 0.001) return;
  var ux = dx/len, uy = dy/len, ext = 16;
  var p = { x: a.x - ext * ux, y: a.y - ext * uy };
  var q = { x: a.x + ext * ux, y: a.y + ext * uy };
  var line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1", toSx(p.x)); line.setAttribute("y1", toSy(p.y));
  line.setAttribute("x2", toSx(q.x)); line.setAttribute("y2", toSy(q.y));
  line.setAttribute("stroke", color); line.setAttribute("stroke-width", 1.8);
  line.setAttribute("stroke-dasharray", "6 5");
  line.setAttribute("opacity", 0.85);
  g.appendChild(line);
}
function drawPoly(g, pts, fillCol, strokeCol, w, dashed){
  var d = "M " + toSx(pts[0].x) + " " + toSy(pts[0].y);
  for (var i = 1; i < pts.length; i++) d += " L " + toSx(pts[i].x) + " " + toSy(pts[i].y);
  d += " Z";
  var path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d", d); path.setAttribute("fill", fillCol);
  path.setAttribute("stroke", strokeCol); path.setAttribute("stroke-width", w || 2);
  path.setAttribute("stroke-linejoin","round");
  if (dashed) path.setAttribute("stroke-dasharray","5 4");
  g.appendChild(path);
}
function drawVertexDot(g, pt, color, label, side){
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
  c.setAttribute("r", 3.5); c.setAttribute("fill", color);
  g.appendChild(c);
  var ox = (side === "right") ? 14 : -14;
  svgKaTeXLabel(g, toSx(pt.x) + ox, toSy(pt.y) - 10, label, color, "center");
}

function drawHandle(g, pt, fillCol, ringCol){
  var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx", toSx(pt.x)); c.setAttribute("cy", toSy(pt.y));
  c.setAttribute("r", 6.5); c.setAttribute("fill", fillCol);
  c.setAttribute("stroke", ringCol || "#0b1118");
  c.setAttribute("stroke-width", ringCol ? 1.5 : 1.5);
  c.setAttribute("class", "handle"); c.style.color = fillCol;
  g.appendChild(c);
}

function drawScene(){
  var gM = document.getElementById("g-mirrors");
  var gO = document.getElementById("g-object");
  var gIn = document.getElementById("g-inter");
  var gF = document.getElementById("g-final");
  var gC = document.getElementById("g-centre");
  var gH = document.getElementById("g-handles");
  clear(gM); clear(gO); clear(gIn); clear(gF); clear(gC); clear(gH);

  drawMirrorLine(gM, D.M1.p1, D.M1.p2, COL.yellow);
  drawMirrorLine(gM, D.M2.p1, D.M2.p2, COL.green);

  var INT = OBJ.map(function(p){ return reflectPtLine(p, D.M1.p1, D.M1.p2); });
  var FIN = INT.map(function(p){ return reflectPtLine(p, D.M2.p1, D.M2.p2); });

  drawPoly(gIn, INT, "rgba(255,130,44,0.06)", COL.orange, 1.6, true);
  drawPoly(gO, OBJ, "rgba(0,171,250,0.10)", COL.blue, 2);
  drawPoly(gF, FIN, "rgba(255,70,112,0.10)", COL.pink, 2);

  OBJ.forEach(function(p,i){ drawVertexDot(gO, p, COL.blue, LABELS[i]); });
  INT.forEach(function(p,i){
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", toSx(p.x)); c.setAttribute("cy", toSy(p.y));
    c.setAttribute("r", 3); c.setAttribute("fill", COL.orange);
    c.setAttribute("opacity", 0.85);
    gIn.appendChild(c);
    svgKaTeXLabel(gIn, toSx(p.x) + 14, toSy(p.y) - 10, LABELS[i] + "'", COL.orange, "center");
  });
  FIN.forEach(function(p,i){ drawVertexDot(gF, p, COL.pink, LABELS[i] + "''", "right"); });

  // 4 mirror handles
  drawHandle(gH, D.M1.p1, COL.yellow);
  drawHandle(gH, D.M1.p2, COL.yellow);
  drawHandle(gH, D.M2.p1, COL.green);
  drawHandle(gH, D.M2.p2, COL.green);

  // Centre dot follows the lerping mirrors (visual), but the readout text
  // uses the snapped target so it doesn't show diabolical decimals mid-flight.
  var eqDisp = composeReflections(D.M1, D.M2);
  var eqText = composeReflections(P.M1, P.M2);
  renderEquivalent(eqText);
  if (eqDisp.kind === "rotation" && eqDisp.centre){
    var dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("cx", toSx(eqDisp.centre.x)); dot.setAttribute("cy", toSy(eqDisp.centre.y));
    dot.setAttribute("r", 5); dot.setAttribute("fill", COL.blue);
    dot.setAttribute("stroke", "#0b1118"); dot.setAttribute("stroke-width", 1.5);
    gC.appendChild(dot);
  }
}

function composeReflections(M1, M2){
  var d1 = { x: M1.p2.x - M1.p1.x, y: M1.p2.y - M1.p1.y };
  var d2 = { x: M2.p2.x - M2.p1.x, y: M2.p2.y - M2.p1.y };
  var cross = d1.x * d2.y - d2.x * d1.y;
  if (Math.abs(cross) < 1e-6){
    var p = OBJ[0];
    var q = reflectPtLine(p, M1.p1, M1.p2);
    var r = reflectPtLine(q, M2.p1, M2.p2);
    return { kind: "translation", tx: r.x - p.x, ty: r.y - p.y };
  }
  var centre = lineIntersection(M1.p1, M1.p2, M2.p1, M2.p2);
  var a1 = Math.atan2(d1.y, d1.x);
  var a2 = Math.atan2(d2.y, d2.x);
  var theta = (a2 - a1) * 180 / Math.PI;
  while (theta > 90) theta -= 180;
  while (theta <= -90) theta += 180;
  var rotAngle = 2 * theta;
  return { kind: "rotation", centre: centre, angle: rotAngle };
}

function fmtInt(v){
  // round to nearest int, but accept halves
  var r = Math.round(v * 2) / 2;
  if (Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
  return r.toFixed(1);
}
function renderEquivalent(eq){
  var el = document.getElementById("eq-display");
  el.innerHTML = "";
  if (eq.kind === "translation"){
    tryRender(el, "\\text{Translation by } \\begin{pmatrix} " + fmtInt(eq.tx) + " \\\\ " + fmtInt(eq.ty) + " \\end{pmatrix}");
  } else {
    var deg = Math.round(eq.angle);
    var dir = deg >= 0 ? "anticlockwise" : "clockwise";
    if (deg === 0){
      tryRender(el, "\\text{Identity (no overall change)}");
    } else {
      tryRender(el, "\\text{Rotation, } " + Math.abs(deg) + "° \\text{ " + dir + ", centre } (" + fmtInt(eq.centre.x) + ", " + fmtInt(eq.centre.y) + ")");
    }
  }
}

// hit-test against display positions
function hitTest(m){
  var H2 = 0.6 * 0.6;
  if (dist2(m, D.M1.p1) < H2) return { kind: "M1.p1" };
  if (dist2(m, D.M1.p2) < H2) return { kind: "M1.p2" };
  if (dist2(m, D.M2.p1) < H2) return { kind: "M2.p1" };
  if (dist2(m, D.M2.p2) < H2) return { kind: "M2.p2" };
  return null;
}
function applyDrag(info, m){
  var s = clampMath({ x: snapHalf(m.x), y: snapHalf(m.y) });
  if (info.kind === "M1.p1"){ P.M1.p1 = s; P.M1.preset = null; }
  else if (info.kind === "M1.p2"){ P.M1.p2 = s; P.M1.preset = null; }
  else if (info.kind === "M2.p1"){ P.M2.p1 = s; P.M2.preset = null; }
  else if (info.kind === "M2.p2"){ P.M2.p2 = s; P.M2.preset = null; }
  updateActiveChips(); kick();
}

// pointer dispatch
var stage = document.getElementById("stage");
var dragInfo = null;
function svgPt(e){
  var pt = stage.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}
function evMath(e){ var sp = svgPt(e); return { x: fromSx(sp.x), y: fromSy(sp.y) }; }
stage.addEventListener("pointerdown", function(e){
  var info = hitTest(evMath(e));
  if (!info) return;
  e.preventDefault();
  dragInfo = info;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("grabbing");
});
stage.addEventListener("pointermove", function(e){
  if (!dragInfo){
    var hit = hitTest(evMath(e));
    if (hit) stage.classList.add("hover-grab"); else stage.classList.remove("hover-grab");
    return;
  }
  e.preventDefault();
  applyDrag(dragInfo, evMath(e));
});
function endDrag(e){
  if (!dragInfo) return;
  dragInfo = null;
  try { stage.releasePointerCapture(e.pointerId); } catch(_){}
  stage.classList.remove("grabbing");
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", function(){ stage.classList.remove("hover-grab"); });

// spring
function settled(){
  return Math.abs(P.M1.p1.x - D.M1.p1.x) < EPS && Math.abs(P.M1.p1.y - D.M1.p1.y) < EPS
      && Math.abs(P.M1.p2.x - D.M1.p2.x) < EPS && Math.abs(P.M1.p2.y - D.M1.p2.y) < EPS
      && Math.abs(P.M2.p1.x - D.M2.p1.x) < EPS && Math.abs(P.M2.p1.y - D.M2.p1.y) < EPS
      && Math.abs(P.M2.p2.x - D.M2.p2.x) < EPS && Math.abs(P.M2.p2.y - D.M2.p2.y) < EPS;
}
function lerpPt(t, d){ d.x += (t.x - d.x) * SPRING; d.y += (t.y - d.y) * SPRING; }
function step(){
  lerpPt(P.M1.p1, D.M1.p1); lerpPt(P.M1.p2, D.M1.p2);
  lerpPt(P.M2.p1, D.M2.p1); lerpPt(P.M2.p2, D.M2.p2);
  drawScene();
  if (!settled()) raf = requestAnimationFrame(step);
  else {
    raf = null;
    D.M1.p1 = clone(P.M1.p1); D.M1.p2 = clone(P.M1.p2);
    D.M2.p1 = clone(P.M2.p1); D.M2.p2 = clone(P.M2.p2);
    drawScene();
  }
}
function kick(){ if (raf == null) raf = requestAnimationFrame(step); notifyHeight(); }

// pickers
function makePicker(hostId, klass, mirrorObj){
  var host = document.getElementById(hostId);
  host.innerHTML = "";
  Object.keys(PRESETS).forEach(function(k){
    var b = document.createElement("button");
    b.className = "preset-btn " + klass + (mirrorObj.preset === k ? " active" : "");
    b.textContent = PRESETS[k].label;
    b.dataset.key = k;
    b.onclick = function(){
      mirrorObj.preset = k;
      mirrorObj.p1 = clone(PRESETS[k].p1);
      mirrorObj.p2 = clone(PRESETS[k].p2);
      updateActiveChips();
      kick();
    };
    host.appendChild(b);
  });
}
function updateActiveChips(){
  ["picker-m1", "picker-m2"].forEach(function(hostId, idx){
    var mirror = idx === 0 ? P.M1 : P.M2;
    document.querySelectorAll("#" + hostId + " .preset-btn").forEach(function(b){
      if (b.dataset.key === mirror.preset) b.classList.add("active");
      else b.classList.remove("active");
    });
  });
}
makePicker("picker-m1", "m1", P.M1);
makePicker("picker-m2", "m2", P.M2);

function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

drawGridAxes();
drawScene();
setTimeout(notifyHeight, 200);
</script>
