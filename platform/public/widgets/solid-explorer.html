<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solid Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; min-height:22px; }
  .name { font-family:'Geist Mono',monospace; font-size:13px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .stage { position:relative; width:100%; height:300px; perspective:900px; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; }
  .stage.grabbing { cursor:grabbing; }
  .scene { position:absolute; top:50%; left:50%; transform-style:preserve-3d; transform:translate(-50%,-50%); }

  .footer { margin-top:6px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="name" id="name">CUBE</span>
    <span class="meta">drag to rotate</span>
  </div>
  <div class="stage" id="stage">
    <div class="scene" id="scene"></div>
  </div>
  <p class="footer">3D wireframe: drag with mouse or finger to spin</p>
</div>

<script>
"use strict";

var params = new URLSearchParams(window.location.search);
var SHAPE = (params.get("shape") || "cube").toLowerCase();

var SHAPE_NAMES = {
  cube: "CUBE",
  cuboid: "CUBOID",
  prism: "TRIANGULAR PRISM",
  pyramid: "SQUARE PYRAMID",
  cylinder: "CYLINDER",
  cone: "CONE",
  sphere: "SPHERE",
  hemisphere: "HEMISPHERE",
  frustum: "FRUSTUM"
};
var SHAPE_COLORS = {
  cube:       "#00abfa",
  cuboid:     "#fff067",
  prism:      "#0fee89",
  pyramid:    "#ff822c",
  cylinder:   "#ff4670",
  cone:       "#00abfa",
  sphere:     "#fff067",
  hemisphere: "#0fee89",
  frustum:    "#ff822c"
};
var COLOR = SHAPE_COLORS[SHAPE] || "#00abfa";
var nameEl = document.getElementById("name");
nameEl.textContent = SHAPE_NAMES[SHAPE] || SHAPE.toUpperCase();
nameEl.style.color = COLOR;

var scene = document.getElementById("scene");

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

function makeFace(w, h, transform, opts) {
  opts = opts || {};
  var d = document.createElement("div");
  d.style.cssText =
    "position:absolute;left:50%;top:50%;width:" + w + "px;height:" + h + "px;" +
    "margin-left:" + (-w/2) + "px;margin-top:" + (-h/2) + "px;" +
    "background:" + (opts.fill || hexToRgba(COLOR, 0.06)) + ";" +
    (opts.border === false ? "" : "border:1.5px solid " + COLOR + ";") +
    (opts.clipPath ? "clip-path:" + opts.clipPath + ";outline:1.5px solid " + COLOR + ";outline-offset:-1px;background:" + (opts.fill || hexToRgba(COLOR, 0.06)) + ";" : "") +
    (opts.borderRadius ? "border-radius:" + opts.borderRadius + ";" : "") +
    (opts.borderTop ? "border-top:1px solid " + opts.borderTop + ";border-left:none;border-right:none;border-bottom:none;background:transparent;" : "") +
    (opts.borderColor ? "border:1.5px solid " + opts.borderColor + ";" : "") +
    "transform:" + transform + ";";
  scene.appendChild(d);
  return d;
}

// ── Shape builders ─────────────────────────────────────────────────────

function buildCube() {
  var s = 110;
  // 6 faces using simple translate + rotate
  makeFace(s, s, "translateZ(" + (s/2) + "px)");                            // front
  makeFace(s, s, "translateZ(" + (-s/2) + "px) rotateY(180deg)");           // back
  makeFace(s, s, "translateX(" + (s/2) + "px) rotateY(90deg)");             // right
  makeFace(s, s, "translateX(" + (-s/2) + "px) rotateY(-90deg)");           // left
  makeFace(s, s, "translateY(" + (-s/2) + "px) rotateX(90deg)");            // top
  makeFace(s, s, "translateY(" + (s/2) + "px) rotateX(-90deg)");            // bottom
}

function buildCuboid() {
  var w = 140, h = 90, d = 70;
  makeFace(w, h, "translateZ(" + (d/2) + "px)");
  makeFace(w, h, "translateZ(" + (-d/2) + "px) rotateY(180deg)");
  makeFace(d, h, "translateX(" + (w/2) + "px) rotateY(90deg)");
  makeFace(d, h, "translateX(" + (-w/2) + "px) rotateY(-90deg)");
  makeFace(w, d, "translateY(" + (-h/2) + "px) rotateX(90deg)");
  makeFace(w, d, "translateY(" + (h/2) + "px) rotateX(-90deg)");
}

function buildPrism() {
  // Equilateral triangle cross-section (side s), prism length L along x-axis.
  var s = 120, L = 130;
  var ht = s * Math.sqrt(3) / 2;       // altitude of equilateral
  var R  = s / Math.sqrt(3);            // circumradius (apex distance from centroid)
  var a  = ht / 3;                      // apothem (inradius, side-mid distance from centroid)

  // Two triangular caps
  // Right cap (x = +L/2, normal +x). Bounding-box centre offset from centroid by ht/6 along local +y.
  // Apex at face local (0, -ht/2). Translation must shift bounding-box-centre so centroid lands on x-axis.
  // For the right cap with rotateY(+90), face normal goes from +z to +x. Local +y stays world +y.
  // Bounding-box centre lands at world: (+L/2, -ht/6, 0)
  makeFace(s, ht, "translate3d(" + (L/2) + "px," + (-ht/6) + "px,0px) rotateY(90deg)",
           {clipPath: "polygon(50% 0%, 0% 100%, 100% 100%)"});
  makeFace(s, ht, "translate3d(" + (-L/2) + "px," + (-ht/6) + "px,0px) rotateY(-90deg)",
           {clipPath: "polygon(50% 0%, 0% 100%, 100% 100%)"});

  // Three rectangular faces, each L x s.
  // Bottom face (centred at world (0, +a, 0), normal +y). Use rotateX(-90).
  makeFace(L, s, "translate3d(0px," + a + "px,0px) rotateX(-90deg)");
  // Upper-right face: rotate the bottom face by +120 around the prism axis (world x).
  makeFace(L, s, "rotateX(120deg) translate3d(0px," + a + "px,0px) rotateX(-90deg)");
  // Upper-left face: rotate by -120.
  makeFace(L, s, "rotateX(-120deg) translate3d(0px," + a + "px,0px) rotateX(-90deg)");
}

function buildPyramid() {
  var s = 120, H = 130;
  var L = Math.sqrt((s/2)*(s/2) + H*H);   // slant height
  var alpha = Math.atan2(s/2, H);          // tilt from vertical
  var alphaDeg = alpha * 180 / Math.PI;

  // Base: square of side s at world y = +H/2
  makeFace(s, s, "translate3d(0px," + (H/2) + "px,0px) rotateX(-90deg)");

  // Triangular sides — built so that all four apexes coincide at (0, -H/2, 0).
  // For each side, transform = rotateY(theta) translate3d(0, 0, +s/4) rotateX(-alpha)
  // CSS reads right-to-left: rotateX first (tilts the face), then translate3d (places centre
  // at z=+s/4 in front of axis), then rotateY (rotates the placed face around y by theta).
  // Apex of face (local 0,-L/2,0) → after rotateX(-alpha): (0, -L/2 cos a, +L/2 sin a)
  //   → after translate(0,0,+s/4): (0, -L/2 cos a, s/4 + L/2 sin a)
  //   With cos a = H/L, sin a = (s/2)/L: → (0, -H/2, s/4 + s/4) = (0, -H/2, s/2). Hmm, want (0, -H/2, 0). Need translate(0, 0, -s/4) instead.
  // Actually let me redo: for the FRONT face (theta=0), bottom edge midpoint should be at world (0, +H/2, +s/2).
  //   Bottom-edge midpoint in face local: (0, +L/2). After rotateX(-alpha): (0, +L/2 cos a, -L/2 sin a) = (0, +H/2, -s/4).
  //   After translate(tx,0,tz): (tx, +H/2, tz - s/4). Want = (0, +H/2, +s/2). So tx=0, tz=+s/2 + s/4 = +3s/4. Hmm nope.
  // Let me redo using rotateX(+alpha) instead of -alpha. With +alpha: apex (0,-L/2,0) → (0, -L/2 cos a, -L/2 sin a) = (0, -H/2, -s/4).
  //   Want apex at (0, -H/2, 0). So translate by (0, 0, +s/4). After translate: (0, -H/2, 0). ✓
  //   Bottom-edge midpoint after rotateX(+alpha): (0, +L/2 cos a, +L/2 sin a) = (0, +H/2, +s/4). After translate: (0, +H/2, +s/2). ✓
  //   So front-face transform: translate3d(0,0,+s/4) rotateX(+alpha). Outward normal: face normal +z after +alpha rotation → (0, +sin a, cos a) — has +z and +y component, "down-and-out". That's wrong for the FRONT face (we want normal up-and-out, since the face tilts back from vertical).
  //   Hmm. Actually with my y-axis convention (world +y is DOWN in screen), outward normal for front pyramid face should have NEGATIVE y component (pointing UP in screen, away from the base) and POSITIVE z (toward viewer).
  //   With rotateX(+alpha) on +z → (0, sin(+alpha), cos(+alpha)). Wait formula (x,y,z)→(x, y*cos - z*sin, y*sin + z*cos) for rotateX(theta). For (0,0,1) and theta=+alpha: (0, -sin(alpha), cos(alpha)). So normal y-comp is -sin a (negative, pointing UP in screen). ✓ Good.
  //   So front-face transform is: translate3d(0,0,+s/4) rotateX(+alpha) — with +alpha not -alpha.
  // But also for the back face (theta=180), we need rotateY(180) wrapping so the face faces backward.
  // Use rotateY(theta) outermost: transform = rotateY(theta) translate3d(0,0,+s/4) rotateX(+alpha).
  function pyramidSide(theta) {
    var t =
      "rotateY(" + theta + "deg) " +
      "translate3d(0px,0px," + (s/4) + "px) " +
      "rotateX(" + alphaDeg + "deg)";
    makeFace(s, L, t, {clipPath: "polygon(50% 0%, 0% 100%, 100% 100%)"});
  }
  pyramidSide(0);
  pyramidSide(90);
  pyramidSide(180);
  pyramidSide(-90);
}

function buildCylinder() {
  var r = 70, h = 130, N = 32;
  // Top + bottom ellipses
  makeFace(r*2, r*2, "translate3d(0px," + (-h/2) + "px,0px) rotateX(90deg)",
           {borderRadius: "50%"});
  makeFace(r*2, r*2, "translate3d(0px," + (h/2) + "px,0px) rotateX(90deg)",
           {borderRadius: "50%"});
  // Vertical slats around the curved side
  var slatW = 2 * Math.PI * r / N + 2;
  for (var i = 0; i < N; i++) {
    var theta = (i / N) * 360;
    var rad = theta * Math.PI / 180;
    var x = Math.cos(rad) * r;
    var z = Math.sin(rad) * r;
    var d = document.createElement("div");
    d.style.cssText =
      "position:absolute;left:50%;top:50%;width:" + slatW + "px;height:" + h + "px;" +
      "margin-left:" + (-slatW/2) + "px;margin-top:" + (-h/2) + "px;" +
      "background:" + hexToRgba(COLOR, 0.05) + ";" +
      "border-left:0.5px solid " + hexToRgba(COLOR, 0.7) + ";" +
      "border-right:0.5px solid " + hexToRgba(COLOR, 0.7) + ";" +
      "transform:translate3d(" + x + "px,0px," + z + "px) rotateY(" + (90 - theta) + "deg);";
    scene.appendChild(d);
  }
}

function buildCone() {
  var r = 75, H = 140, N = 32;
  var L = Math.sqrt(r*r + H*H);
  var alpha = Math.atan2(r, H);
  var alphaDeg = alpha * 180 / Math.PI;

  // Base ellipse
  makeFace(r*2, r*2, "translate3d(0px," + (H/2) + "px,0px) rotateX(90deg)",
           {borderRadius: "50%"});
  // N triangular slats meeting at apex (0, -H/2, 0)
  // Same pattern as pyramid: rotateY(theta) translate3d(0,0,r/2) rotateX(+alpha)
  // Apex (0, -L/2) → rotateX(+alpha): (0, -L/2 cos a, -L/2 sin a) = (0, -H/2, -r/2)
  // Then translate(0,0,r/2): (0, -H/2, 0). ✓
  // Then rotateY(theta) leaves apex on y-axis.
  var slatW = 2 * Math.PI * r / N + 2;
  for (var i = 0; i < N; i++) {
    var theta = (i / N) * 360;
    var t =
      "rotateY(" + theta + "deg) " +
      "translate3d(0px,0px," + (r/2) + "px) " +
      "rotateX(" + alphaDeg + "deg)";
    makeFace(slatW, L, t,
             {clipPath: "polygon(50% 0%, 0% 100%, 100% 100%)",
              fill: hexToRgba(COLOR, 0.05)});
  }
}

function buildSphere() {
  var r = 80;
  var rings = 7;
  for (var i = 0; i < rings; i++) {
    var phi = -90 + (i + 0.5) * (180 / rings);
    var rad = phi * Math.PI / 180;
    var rr = r * Math.cos(rad);
    var yy = r * Math.sin(rad);
    if (rr < 4) continue;
    makeFace(rr*2, rr*2,
             "translate3d(0px," + yy + "px,0px) rotateX(90deg)",
             {borderRadius: "50%", borderColor: hexToRgba(COLOR, 0.55), fill: "transparent"});
  }
  for (var j = 0; j < 8; j++) {
    var theta = (j / 8) * 180;
    makeFace(r*2, r*2,
             "rotateY(" + theta + "deg)",
             {borderRadius: "50%", borderColor: hexToRgba(COLOR, 0.55), fill: "transparent"});
  }
}

function buildHemisphere() {
  var r = 80;
  // Flat base (full circle, lying horizontal at y = 0)
  makeFace(r*2, r*2, "rotateX(90deg)", {borderRadius: "50%"});

  // Top latitude rings (only top half: phi from -90 to 0)
  var rings = 6;
  for (var i = 0; i < rings; i++) {
    var phi = -90 + (i + 0.5) * (90 / rings);
    var rad = phi * Math.PI / 180;
    var rr = r * Math.cos(rad);
    var yy = r * Math.sin(rad);
    if (rr < 4) continue;
    makeFace(rr*2, rr*2,
             "translate3d(0px," + yy + "px,0px) rotateX(90deg)",
             {borderRadius: "50%", borderColor: hexToRgba(COLOR, 0.55), fill: "transparent"});
  }
  // Longitude meridians: full circles clipped to top half only.
  for (var j = 0; j < 8; j++) {
    var theta = (j / 8) * 180;
    var d = document.createElement("div");
    d.style.cssText =
      "position:absolute;left:50%;top:50%;width:" + (r*2) + "px;height:" + (r*2) + "px;" +
      "margin-left:" + (-r) + "px;margin-top:" + (-r) + "px;" +
      "border-radius:50%;" +
      "border:1px solid " + hexToRgba(COLOR, 0.55) + ";" +
      "background:transparent;" +
      "clip-path:polygon(0% 0%, 100% 0%, 100% 50%, 0% 50%);" +
      "transform:rotateY(" + theta + "deg);";
    scene.appendChild(d);
  }
}

function buildFrustum() {
  var r1 = 50, r2 = 85, h = 130, N = 32;
  var L = Math.sqrt(h*h + (r2-r1)*(r2-r1));
  var slantA = Math.atan2(r2 - r1, h) * 180 / Math.PI;

  makeFace(r1*2, r1*2, "translate3d(0px," + (-h/2) + "px,0px) rotateX(90deg)",
           {borderRadius: "50%"});
  makeFace(r2*2, r2*2, "translate3d(0px," + (h/2) + "px,0px) rotateX(90deg)",
           {borderRadius: "50%"});

  // Slats — each is a thin strip slanted by slantA, at midpoint between r1 (top) and r2 (bottom).
  // Strip's centre at world ((r1+r2)/2 cos(theta), 0, (r1+r2)/2 sin(theta))
  // Use the same composition as cylinder slat but with rotateX(slantA) added:
  // transform: translate3d(x_mid, 0, z_mid) rotateY(90 - theta) rotateX(slantA)
  // After rotateX(slantA), face's local +y tilts inward at top, outward at bottom — matching the frustum shape (top is narrower).
  var midR = (r1 + r2) / 2;
  var slatW = 2 * Math.PI * midR / N + 2;
  for (var i = 0; i < N; i++) {
    var theta = (i / N) * 360;
    var rad = theta * Math.PI / 180;
    var x = Math.cos(rad) * midR;
    var z = Math.sin(rad) * midR;
    var d = document.createElement("div");
    d.style.cssText =
      "position:absolute;left:50%;top:50%;width:" + slatW + "px;height:" + L + "px;" +
      "margin-left:" + (-slatW/2) + "px;margin-top:" + (-L/2) + "px;" +
      "background:" + hexToRgba(COLOR, 0.05) + ";" +
      "border-left:0.5px solid " + hexToRgba(COLOR, 0.7) + ";" +
      "border-right:0.5px solid " + hexToRgba(COLOR, 0.7) + ";" +
      "transform:translate3d(" + x + "px,0px," + z + "px) rotateY(" + (90 - theta) + "deg) rotateX(" + slantA + "deg);";
    scene.appendChild(d);
  }
}

var BUILDERS = {
  cube: buildCube,
  cuboid: buildCuboid,
  prism: buildPrism,
  pyramid: buildPyramid,
  cylinder: buildCylinder,
  cone: buildCone,
  sphere: buildSphere,
  hemisphere: buildHemisphere,
  frustum: buildFrustum
};
(BUILDERS[SHAPE] || buildCube)();

// ── Drag-to-rotate + auto-spin ────────────────────────────────────────
var rotX = -20, rotY = 25;
var dragging = false;
var lastX = 0, lastY = 0;
var lastInteractAt = Date.now();
var stage = document.getElementById("stage");

function applyRotation() {
  scene.style.transform = "translate(-50%,-50%) rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
}
applyRotation();

function onDown(clientX, clientY) {
  dragging = true; lastX = clientX; lastY = clientY;
  stage.classList.add("grabbing");
  lastInteractAt = Date.now();
}
function onMove(clientX, clientY) {
  if (!dragging) return;
  var dx = clientX - lastX, dy = clientY - lastY;
  rotY += dx * 0.5;
  rotX -= dy * 0.5;
  rotX = Math.max(-89, Math.min(89, rotX));
  lastX = clientX; lastY = clientY;
  lastInteractAt = Date.now();
  applyRotation();
}
function onUp() {
  dragging = false;
  stage.classList.remove("grabbing");
  lastInteractAt = Date.now();
}
stage.addEventListener("mousedown", function(e) { e.preventDefault(); onDown(e.clientX, e.clientY); });
window.addEventListener("mousemove", function(e) { onMove(e.clientX, e.clientY); });
window.addEventListener("mouseup", onUp);
stage.addEventListener("touchstart", function(e) {
  if (e.touches.length === 1) { e.preventDefault(); onDown(e.touches[0].clientX, e.touches[0].clientY); }
}, { passive: false });
stage.addEventListener("touchmove", function(e) {
  if (e.touches.length === 1) { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }
}, { passive: false });
stage.addEventListener("touchend", onUp);

function tick() {
  var idleMs = Date.now() - lastInteractAt;
  if (!dragging && idleMs > 2000) {
    rotY += 0.25;
    applyRotation();
  }
  requestAnimationFrame(tick);
}
tick();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
</script>
</body>
</html>
