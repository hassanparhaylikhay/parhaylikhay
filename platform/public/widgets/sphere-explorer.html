<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sphere Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .formulas { display:flex; flex-direction:column; gap:4px; align-items:center; margin-bottom:10px; }
  .formula { font-size:14.5px; color:#f0eeea; line-height:1.3; }
  .formula .katex { font-size:1em; }

  .controls {
    display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:0 4px;
    font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; flex-wrap:wrap;
  }
  .row { display:flex; align-items:center; gap:8px; min-width:200px; flex:1; }
  .row .name { color:#fff067; font-weight:600; min-width:14px; }
  .row input[type=range] {
    flex:1; min-width:80px; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff067; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; background:#fff067; cursor:pointer; border:0;
  }
  .row .val { min-width:28px; text-align:right; color:#f0eeea; font-weight:600; }

  .toggle-row { display:flex; align-items:center; gap:8px; }
  .toggle-row .name { color:#fff067; font-weight:600; }
  .toggle-row select {
    background:#141e2a; color:#f0eeea; border:1px solid #3a4a5a; border-radius:4px;
    padding:3px 6px; font-family:'Geist Mono',monospace; font-size:11px; outline:none; cursor:pointer;
  }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="formulas">
    <span class="formula" id="fV"></span>
    <span class="formula" id="fSA"></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">r</span>
      <input type="range" id="rSlider" min="1" max="8" value="4" step="0.1"/>
      <span class="val" id="rVal">4</span>
    </div>
    <div class="toggle-row">
      <span class="name">solid</span>
      <select id="kindSel">
        <option value="sphere" selected>full sphere</option>
        <option value="hemi">hemisphere</option>
      </select>
    </div>
    <div class="toggle-row">
      <span class="name">show</span>
      <select id="modeSel">
        <option value="pi" selected>in terms of π</option>
        <option value="dec">decimal</option>
      </select>
    </div>
  </div>

  <svg id="svg" viewBox="0 0 480 240" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="rgba(0,171,250,0.55)"/>
        <stop offset="60%" stop-color="rgba(0,171,250,0.18)"/>
        <stop offset="100%" stop-color="rgba(0,171,250,0.05)"/>
      </radialGradient>
    </defs>
    <g id="g-shape"></g>
  </svg>

  <p class="footer">drag the radius · toggle full sphere or hemisphere · V and SA update live</p>
</div>

<script>
"use strict";

var SVG_W = 480, SVG_H = 240;
var SCALE = 18;

function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n) {
  if (!isFinite(n)) return "—";
  var v = Math.round(n * 100) / 100;
  if (v === 0) return "0";
  return parseFloat(v.toFixed(2)).toString();
}
function texCoefPi(coef) {
  var v = Math.round(coef * 1000) / 1000;
  if (v === 0) return "0";
  if (v === 1) return "\\pi";
  if (v === -1) return "-\\pi";
  return parseFloat(v.toFixed(3)).toString() + "\\pi";
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, alignment) {
  var fo = svgEl("foreignObject", {
    x: (x - 60), y: (y - 12), width: 120, height: 24,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "lbl-host";
  div.style.color = color || "#f0eeea";
  div.style.width = "100%"; div.style.height = "100%";
  div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = (alignment === "left" ? "flex-start" : alignment === "right" ? "flex-end" : "center");
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}

var state = {
  params:  { r: 4 },
  display: { r: 4 },
  kind: "sphere",
  mode: "pi"
};
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005, rafScheduled = false;
function startSpring() { if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(springTick); } }
function springTick() {
  var d = state.params.r - state.display.r;
  if (Math.abs(d) > SPRING_EPS) {
    state.display.r += d * SPRING_FACTOR;
    render();
    requestAnimationFrame(springTick);
  } else {
    state.display.r = state.params.r;
    render();
    rafScheduled = false;
  }
}

var fV  = document.getElementById("fV");
var fSA = document.getElementById("fSA");
var gShape = document.getElementById("g-shape");

function render() {
  var r = state.display.r;
  var rPx = r * SCALE;
  var cx = SVG_W / 2;
  var cy = SVG_H / 2 + 8;

  gShape.innerHTML = "";

  if (state.kind === "sphere") {
    // Full sphere: a circle with radial gradient + outline + radius arrow
    gShape.appendChild(svgEl("circle", {
      cx: cx, cy: cy, r: rPx,
      fill: "url(#sphereGrad)",
      stroke: "#00abfa", "stroke-width": 2
    }));
    // Equator ellipse hint (thin dashed)
    gShape.appendChild(svgEl("ellipse", {
      cx: cx, cy: cy, rx: rPx, ry: rPx * 0.32,
      fill: "none", stroke: "#3a4a5a", "stroke-width": 1, "stroke-dasharray": "3 3"
    }));
    // Radius line (pink)
    gShape.appendChild(svgEl("line", {
      x1: cx, y1: cy, x2: cx + rPx * 0.7071, y2: cy - rPx * 0.7071,
      stroke: "#ff4670", "stroke-width": 2
    }));
    svgKaTeXLabel(gShape, cx + rPx * 0.45, cy - rPx * 0.42 - 10,
      "r = " + fmtNum(r), "#ff4670", "center");
    gShape.appendChild(svgEl("circle", { cx: cx, cy: cy, r: 2.5, fill: "#7a7875" }));
  } else {
    // Hemisphere: upper half-disk with a dashed flat-bottom ellipse for the cut
    var topY = cy - rPx;
    // Half-disk path: arc from left to right across the top
    var d = "M" + (cx - rPx) + " " + cy +
            " A" + rPx + " " + rPx + " 0 0 1 " + (cx + rPx) + " " + cy +
            " Z";
    gShape.appendChild(svgEl("path", {
      d: d,
      fill: "url(#sphereGrad)",
      stroke: "#00abfa", "stroke-width": 2, "stroke-linejoin": "round"
    }));
    // Flat bottom ellipse (the cut) — yellow
    gShape.appendChild(svgEl("ellipse", {
      cx: cx, cy: cy, rx: rPx, ry: rPx * 0.32,
      fill: "rgba(255,240,103,0.18)",
      stroke: "#fff067", "stroke-width": 2
    }));
    // Radius line (pink)
    gShape.appendChild(svgEl("line", {
      x1: cx, y1: cy, x2: cx + rPx * 0.7071, y2: cy - rPx * 0.7071,
      stroke: "#ff4670", "stroke-width": 2
    }));
    svgKaTeXLabel(gShape, cx + rPx * 0.45, cy - rPx * 0.42 - 10,
      "r = " + fmtNum(r), "#ff4670", "center");
    gShape.appendChild(svgEl("circle", { cx: cx, cy: cy, r: 2.5, fill: "#7a7875" }));
  }

  // Formulas
  var Vcoef, SAcoef;
  if (state.kind === "sphere") {
    Vcoef = (4/3) * r * r * r;
    SAcoef = 4 * r * r;
    if (state.mode === "pi") {
      tryRender(fV,
        "{\\color{#00abfa}V} = \\tfrac{4}{3}\\pi r^{3} = " +
        "{\\color{#00abfa}" + texCoefPi(Vcoef) + "}\\;\\text{cm}^{3}");
      tryRender(fSA,
        "{\\color{#ff822c}\\text{SA}} = 4\\pi r^{2} = " +
        "{\\color{#ff822c}" + texCoefPi(SAcoef) + "}\\;\\text{cm}^{2}");
    } else {
      tryRender(fV,
        "{\\color{#00abfa}V} = \\tfrac{4}{3}\\pi r^{3} = " +
        "{\\color{#00abfa}" + fmtNum(Vcoef * Math.PI) + "}\\;\\text{cm}^{3}");
      tryRender(fSA,
        "{\\color{#ff822c}\\text{SA}} = 4\\pi r^{2} = " +
        "{\\color{#ff822c}" + fmtNum(SAcoef * Math.PI) + "}\\;\\text{cm}^{2}");
    }
  } else {
    Vcoef = (2/3) * r * r * r;
    SAcoef = 3 * r * r;
    if (state.mode === "pi") {
      tryRender(fV,
        "{\\color{#00abfa}V} = \\tfrac{2}{3}\\pi r^{3} = " +
        "{\\color{#00abfa}" + texCoefPi(Vcoef) + "}\\;\\text{cm}^{3}");
      tryRender(fSA,
        "\\text{SA} = {\\color{#ff822c}2\\pi r^{2}} + {\\color{#fff067}\\pi r^{2}} = 3\\pi r^{2} = " +
        "{\\color{#ff4670}" + texCoefPi(SAcoef) + "}\\;\\text{cm}^{2}");
    } else {
      tryRender(fV,
        "{\\color{#00abfa}V} = \\tfrac{2}{3}\\pi r^{3} = " +
        "{\\color{#00abfa}" + fmtNum(Vcoef * Math.PI) + "}\\;\\text{cm}^{3}");
      tryRender(fSA,
        "{\\color{#ff4670}\\text{SA}} = 3\\pi r^{2} = " +
        "{\\color{#ff4670}" + fmtNum(SAcoef * Math.PI) + "}\\;\\text{cm}^{2}");
    }
  }
}

document.getElementById("rSlider").addEventListener("input", function() {
  state.params.r = parseFloat(this.value);
  document.getElementById("rVal").textContent = fmtNum(state.params.r);
  startSpring();
});
document.getElementById("kindSel").addEventListener("change", function() {
  state.kind = this.value; render();
});
document.getElementById("modeSel").addEventListener("change", function() {
  state.mode = this.value; render();
});

render();

var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
