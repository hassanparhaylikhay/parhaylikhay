<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pythagoras — Three Squares</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }

  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .eq-bar { display:flex; flex-direction:column; gap:4px; align-items:center; padding:6px 0 10px; border-bottom:1px solid #141e2a; margin-bottom:8px; }
  .eq-symbolic { font-size:18px; }
  .eq-numeric  { font-size:16px; }
  .eq-symbolic .katex, .eq-numeric .katex { font-size:1em; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:visible; touch-action:none; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:13px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }
  .area-host { font-family:'Geist Mono',monospace; font-weight:700; line-height:1; }
  .area-host .katex { font-size:1em; }

  .controls { display:flex; flex-direction:column; gap:8px; padding:10px 4px 0; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .name { font-weight:600; min-width:18px; }
  .row .name.a { color:#00abfa; }
  .row .name.b { color:#ff822c; }
  .row input[type=range] {
    flex:1; appearance:none; -webkit-appearance:none;
    height:3px; background:#141e2a; border-radius:2px; outline:none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%; cursor:pointer; border:0;
  }
  .row input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%; cursor:pointer; border:0;
  }
  .row.a-row input[type=range]::-webkit-slider-thumb { background:#00abfa; }
  .row.a-row input[type=range]::-moz-range-thumb { background:#00abfa; }
  .row.b-row input[type=range]::-webkit-slider-thumb { background:#ff822c; }
  .row.b-row input[type=range]::-moz-range-thumb { background:#ff822c; }
  .row .val { min-width:36px; text-align:right; color:#f0eeea; font-weight:600; font-size:12.5px; }

  .hint { display:flex; gap:10px; align-items:center; padding:6px 4px 0; font-family:'Geist Mono',monospace; font-size:10.5px; color:#7a7875; letter-spacing:0.3px; }
  .hint .dot { display:inline-block; width:8px; height:8px; border-radius:50%; }

  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; text-align:center; letter-spacing:0.4px; }

  .vertex-handle {
    cursor:grab; transition: r 0.15s ease;
  }
  .vertex-handle:active { cursor:grabbing; }
  .vertex-handle:hover { r:9; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">PYTHAGORAS · THREE-SQUARES PROOF</span>
    <span class="meta" id="meta">drag · or use sliders</span>
  </div>

  <div class="eq-bar">
    <div class="eq-symbolic" id="eqSym"></div>
    <div class="eq-numeric"  id="eqNum"></div>
  </div>

  <svg id="stage" viewBox="0 0 480 380" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="gridA" patternUnits="userSpaceOnUse" width="1" height="1">
        <rect width="1" height="1" fill="none" stroke="#00abfa" stroke-width="0.04" opacity="0.55"/>
      </pattern>
      <pattern id="gridB" patternUnits="userSpaceOnUse" width="1" height="1">
        <rect width="1" height="1" fill="none" stroke="#ff822c" stroke-width="0.04" opacity="0.55"/>
      </pattern>
      <pattern id="gridC" patternUnits="userSpaceOnUse" width="1" height="1">
        <rect width="1" height="1" fill="none" stroke="#ff4670" stroke-width="0.04" opacity="0.55"/>
      </pattern>
    </defs>
    <g id="g-figure"></g>
    <g id="g-labels"></g>
    <g id="g-handles"></g>
  </svg>

  <div class="controls">
    <div class="row a-row">
      <span class="name a">a</span>
      <input type="range" id="aSlider" min="2" max="6" step="0.1" value="4"/>
      <span class="val" id="aVal"></span>
    </div>
    <div class="row b-row">
      <span class="name b">b</span>
      <input type="range" id="bSlider" min="2" max="6" step="0.1" value="3"/>
      <span class="val" id="bVal"></span>
    </div>
  </div>

  <div class="hint">
    <span class="dot" style="background:#00abfa"></span><span>blue square has area <span id="ahint"></span></span>
    <span class="dot" style="background:#ff822c"></span><span>orange has <span id="bhint"></span></span>
    <span class="dot" style="background:#ff4670"></span><span>pink has <span id="chint"></span></span>
  </div>

  <p class="footer" id="footer">drag a vertex of the triangle to reshape it · the three squares update live</p>
</div>

<script>
"use strict";

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  green:  "#0fee89",
  pink:   "#ff4670",
  faint:  "#3a4a5a",
  grey:   "#7a7875",
  off:    "#f0eeea"
};

// ===== Helpers =====
function svgEl(tag, attrs) {
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function fmtNum(n, dp) {
  if (!isFinite(n)) return "—";
  if (dp == null) dp = 2;
  var v = +n.toFixed(dp);
  return parseFloat(v.toFixed(dp)).toString();
}
function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}
function svgKaTeXLabel(parent, x, y, tex, color, alignment, fontSizePx) {
  var W = 120, H = 28;
  var fo = svgEl("foreignObject", {
    x: (x - W/2), y: (y - H/2), width: W, height: H,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "lbl-host";
  if (fontSizePx) div.style.fontSize = fontSizePx + "px";
  div.style.color = color || COL.off;
  div.style.width = "100%"; div.style.height = "100%";
  div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = (alignment === "left" ? "flex-start" : alignment === "right" ? "flex-end" : "center");
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}
function svgAreaLabel(parent, cx, cy, tex, color, fontSizePx) {
  var W = 110, H = 36;
  var fo = svgEl("foreignObject", {
    x: (cx - W/2), y: (cy - H/2), width: W, height: H,
    style: "overflow:visible; pointer-events:none"
  });
  var div = document.createElement("div");
  div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
  div.className = "area-host";
  div.style.fontSize = (fontSizePx || 16) + "px";
  div.style.color = color;
  div.style.width = "100%"; div.style.height = "100%";
  div.style.display = "flex"; div.style.alignItems = "center"; div.style.justifyContent = "center";
  fo.appendChild(div);
  parent.appendChild(fo);
  tryRender(div, tex);
  return fo;
}

// ===== State (target + display, spring lerp) =====
var SVG_W = 480, SVG_H = 380;
var params  = { a: 4.0, b: 3.0 };
var display = { a: 4.0, b: 3.0 };
var SPRING_FACTOR = 0.22, SPRING_EPS = 0.005;

var stage   = document.getElementById("stage");
var gFigure = document.getElementById("g-figure");
var gLabels = document.getElementById("g-labels");
var gHandles = document.getElementById("g-handles");

// Math→SVG transform: math (mx, my) → SVG (ox + s*mx, oy - s*my)
// ox, oy = SVG coords of P_a (origin / right-angle vertex of triangle).
function computeLayout(a, b) {
  // bbox in math coords:
  //   x ∈ [-b, a+b]   width  = a + 2b
  //   y ∈ [-a, a+b]   height = 2a + b
  var PAD = 32;
  var natW = a + 2*b;
  var natH = 2*a + b;
  var s = Math.min((SVG_W - 2*PAD) / natW, (SVG_H - 2*PAD) / natH);
  // centre the bbox at SVG centre
  // bbox math centre: ((-b + a+b)/2, (-a + a+b)/2) = (a/2, b/2)
  var ox = SVG_W/2 - s * (a/2);
  var oy = SVG_H/2 + s * (b/2);
  return { s: s, ox: ox, oy: oy };
}
function toSvg(mx, my, layout) {
  return { x: layout.ox + layout.s * mx, y: layout.oy - layout.s * my };
}

// ===== Render =====
function render() {
  var a = display.a, b = display.b;
  var c = Math.sqrt(a*a + b*b);
  var L = computeLayout(a, b);

  // clear groups
  gFigure.innerHTML = "";
  gLabels.innerHTML = "";
  gHandles.innerHTML = "";

  var Pa = toSvg(0, 0, L);
  var Pb = toSvg(0, b, L);
  var Pc = toSvg(a, 0, L);

  // ----- Square on a (along base, hangs below) -----
  // math vertices: (0,0), (a,0), (a,-a), (0,-a)
  var sqA = [
    toSvg(0, 0, L), toSvg(a, 0, L), toSvg(a, -a, L), toSvg(0, -a, L)
  ];
  drawSquare(gFigure, sqA, COL.blue, "url(#gridA)", L.s);

  // ----- Square on b (left of vertical leg) -----
  // math vertices: (0,0), (-b,0), (-b,b), (0,b)
  var sqB = [
    toSvg(0, 0, L), toSvg(-b, 0, L), toSvg(-b, b, L), toSvg(0, b, L)
  ];
  drawSquare(gFigure, sqB, COL.orange, "url(#gridB)", L.s);

  // ----- Square on c (hypotenuse, outward = (b, a)/c rotated -90 from edge dir P_c→P_b) -----
  // math vertices: (a, 0), (0, b), (b, a+b), (a+b, a)
  var sqC = [
    toSvg(a, 0, L), toSvg(0, b, L), toSvg(b, a+b, L), toSvg(a+b, a, L)
  ];
  drawSquare(gFigure, sqC, COL.pink, "url(#gridC)", L.s);

  // ----- Triangle on top of everything (so the right-angle marker is visible) -----
  var triPath = "M " + Pa.x + " " + Pa.y +
                " L " + Pc.x + " " + Pc.y +
                " L " + Pb.x + " " + Pb.y + " Z";
  gFigure.appendChild(svgEl("path", {
    d: triPath,
    fill: "rgba(255,240,103,0.10)",
    stroke: COL.yellow,
    "stroke-width": 2,
    "stroke-linejoin": "round"
  }));

  // Right-angle marker at P_a — small square inside the triangle
  var rmSize = Math.min(0.45 * L.s, 18);
  var rm = [
    { x: Pa.x + rmSize, y: Pa.y },
    { x: Pa.x + rmSize, y: Pa.y - rmSize },
    { x: Pa.x,          y: Pa.y - rmSize }
  ];
  gFigure.appendChild(svgEl("path", {
    d: "M " + Pa.x + " " + Pa.y +
       " L " + rm[0].x + " " + rm[0].y +
       " L " + rm[1].x + " " + rm[1].y +
       " L " + rm[2].x + " " + rm[2].y + " Z",
    fill: "none", stroke: COL.yellow, "stroke-width": 1.5, opacity: 0.7
  }));

  // ----- Side labels (a, b, c) on triangle edges -----
  // Side a (base): midpoint between P_a and P_c, label INSIDE triangle (above midpoint)
  var midA = { x: (Pa.x + Pc.x)/2, y: (Pa.y + Pc.y)/2 };
  svgKaTeXLabel(gLabels, midA.x, midA.y - 12,
    "{\\color{" + COL.blue + "}a = " + fmtNum(a) + "}", null, "center", 12);

  // Side b (vertical): midpoint, label INSIDE triangle (right of mid)
  var midB = { x: (Pa.x + Pb.x)/2, y: (Pa.y + Pb.y)/2 };
  svgKaTeXLabel(gLabels, midB.x + 16, midB.y,
    "{\\color{" + COL.orange + "}b = " + fmtNum(b) + "}", null, "center", 12);

  // Side c (hypotenuse): midpoint, label INSIDE triangle (toward P_a side)
  var midC = { x: (Pb.x + Pc.x)/2, y: (Pb.y + Pc.y)/2 };
  // inward direction from midC toward P_a:
  var inv = { x: Pa.x - midC.x, y: Pa.y - midC.y };
  var invLen = Math.sqrt(inv.x*inv.x + inv.y*inv.y) || 1;
  var inOff = 14;
  svgKaTeXLabel(gLabels,
    midC.x + inv.x/invLen * inOff,
    midC.y + inv.y/invLen * inOff,
    "{\\color{" + COL.pink + "}c = " + fmtNum(c) + "}", null, "center", 12);

  // ----- Area labels CENTRED inside each square -----
  // Square a centre (math): (a/2, -a/2)
  var cA = toSvg(a/2, -a/2, L);
  svgAreaLabel(gLabels, cA.x, cA.y,
    "{\\color{" + COL.blue + "}a^{2} = " + fmtNum(a*a, 1) + "}", COL.blue, Math.min(18, 6 + a*1.6));

  // Square b centre (math): (-b/2, b/2)
  var cB = toSvg(-b/2, b/2, L);
  svgAreaLabel(gLabels, cB.x, cB.y,
    "{\\color{" + COL.orange + "}b^{2} = " + fmtNum(b*b, 1) + "}", COL.orange, Math.min(18, 6 + b*1.6));

  // Square c centre (math): centre of (a,0),(0,b),(b,a+b),(a+b,a) = ((2a+2b)/4, (2a+2b)/4)
  // = ((a+b)/2, (a+b)/2)
  var cC = toSvg((a+b)/2, (a+b)/2, L);
  svgAreaLabel(gLabels, cC.x, cC.y,
    "{\\color{" + COL.pink + "}c^{2} = " + fmtNum(c*c, 1) + "}", COL.pink, Math.min(18, 6 + c*1.4));

  // ----- Drag handles on P_b (top of vertical leg → drives b) and P_c (right end of base → drives a) -----
  gHandles.appendChild(svgEl("circle", {
    "class": "vertex-handle", id: "handle-b",
    cx: Pb.x, cy: Pb.y, r: 7,
    fill: COL.orange, stroke: "#0b1118", "stroke-width": 2
  }));
  gHandles.appendChild(svgEl("circle", {
    "class": "vertex-handle", id: "handle-c",
    cx: Pc.x, cy: Pc.y, r: 7,
    fill: COL.blue, stroke: "#0b1118", "stroke-width": 2
  }));
}

function drawSquare(parent, pts, color, gridFill, scale) {
  var d = "M " + pts[0].x + " " + pts[0].y;
  for (var i = 1; i < pts.length; i++) d += " L " + pts[i].x + " " + pts[i].y;
  d += " Z";

  // Translucent fill
  parent.appendChild(svgEl("path", {
    d: d,
    fill: hexToRgba(color, 0.18),
    stroke: color, "stroke-width": 2,
    "stroke-linejoin": "round"
  }));

  // Grid overlay (clipped to the square via fill rule). We use a clipPath approach:
  // create a clipPath referencing the square, then a <rect> filled with the pattern, scaled.
  // For simplicity here we just draw faint grid lines parallel to the square's edges.
  // Edge0: pts[0]→pts[1] is one side; edge3: pts[0]→pts[3] is the perpendicular side.
  var v1 = { x: (pts[1].x - pts[0].x), y: (pts[1].y - pts[0].y) };
  var v2 = { x: (pts[3].x - pts[0].x), y: (pts[3].y - pts[0].y) };
  var sideLenPx = Math.sqrt(v1.x*v1.x + v1.y*v1.y);
  var unitsPerSide = sideLenPx / scale;
  var nLines = Math.round(unitsPerSide);
  if (nLines >= 2 && nLines <= 12) {
    for (var k = 1; k < nLines; k++) {
      var t = k / nLines;
      // Line parallel to v2, offset along v1
      var p0 = { x: pts[0].x + v1.x * t, y: pts[0].y + v1.y * t };
      var p1 = { x: p0.x + v2.x, y: p0.y + v2.y };
      parent.appendChild(svgEl("line", {
        x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y,
        stroke: color, "stroke-width": 0.6, opacity: 0.35
      }));
      // Line parallel to v1, offset along v2
      var q0 = { x: pts[0].x + v2.x * t, y: pts[0].y + v2.y * t };
      var q1 = { x: q0.x + v1.x, y: q0.y + v1.y };
      parent.appendChild(svgEl("line", {
        x1: q0.x, y1: q0.y, x2: q1.x, y2: q1.y,
        stroke: color, "stroke-width": 0.6, opacity: 0.35
      }));
    }
  }
}

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

// ===== Equation bar =====
var eqSymEl = document.getElementById("eqSym");
var eqNumEl = document.getElementById("eqNum");
function renderEquationBar() {
  var a = display.a, b = display.b;
  var c2 = a*a + b*b;
  tryRender(eqSymEl,
    "{\\color{" + COL.blue + "}a^{2}}" +
    " + {\\color{" + COL.orange + "}b^{2}}" +
    " = {\\color{" + COL.pink + "}c^{2}}");
  tryRender(eqNumEl,
    "{\\color{" + COL.blue + "}" + fmtNum(a*a, 2) + "}" +
    " + {\\color{" + COL.orange + "}" + fmtNum(b*b, 2) + "}" +
    " = {\\color{" + COL.pink + "}" + fmtNum(c2, 2) + "}");
}

// ===== Hint chips =====
var ahint = document.getElementById("ahint");
var bhint = document.getElementById("bhint");
var chint = document.getElementById("chint");
function renderHints() {
  var a = display.a, b = display.b;
  var c2 = a*a + b*b;
  tryRender(ahint, fmtNum(a*a, 2));
  tryRender(bhint, fmtNum(b*b, 2));
  tryRender(chint, fmtNum(c2, 2));
}

// ===== Slider wiring =====
var aSlider = document.getElementById("aSlider");
var bSlider = document.getElementById("bSlider");
var aVal = document.getElementById("aVal");
var bVal = document.getElementById("bVal");

function syncSliderLabels() {
  aVal.textContent = fmtNum(display.a, 1);
  bVal.textContent = fmtNum(display.b, 1);
}
aSlider.addEventListener("input", function() {
  params.a = parseFloat(aSlider.value);
  kickSpring();
});
bSlider.addEventListener("input", function() {
  params.b = parseFloat(bSlider.value);
  kickSpring();
});
function syncSlidersToParams() {
  aSlider.value = params.a;
  bSlider.value = params.b;
}

// ===== Spring lerp =====
var rafId = null;
function kickSpring() {
  if (rafId) return;
  rafId = requestAnimationFrame(tick);
}
function tick() {
  display.a += (params.a - display.a) * SPRING_FACTOR;
  display.b += (params.b - display.b) * SPRING_FACTOR;
  if (Math.abs(params.a - display.a) < SPRING_EPS) display.a = params.a;
  if (Math.abs(params.b - display.b) < SPRING_EPS) display.b = params.b;
  render();
  renderEquationBar();
  renderHints();
  syncSliderLabels();
  if (display.a !== params.a || display.b !== params.b) {
    rafId = requestAnimationFrame(tick);
  } else {
    rafId = null;
  }
}

// ===== Drag handles =====
var dragging = null;  // "a" or "b" or null

function svgPointFromEvent(evt) {
  var rect = stage.getBoundingClientRect();
  var clientX = evt.clientX != null ? evt.clientX : (evt.touches && evt.touches[0].clientX);
  var clientY = evt.clientY != null ? evt.clientY : (evt.touches && evt.touches[0].clientY);
  var x = (clientX - rect.left) * (SVG_W / rect.width);
  var y = (clientY - rect.top)  * (SVG_H / rect.height);
  return { x: x, y: y };
}

stage.addEventListener("pointerdown", function(evt) {
  var t = evt.target;
  if (t.id === "handle-b") { dragging = "b"; stage.setPointerCapture(evt.pointerId); }
  else if (t.id === "handle-c") { dragging = "a"; stage.setPointerCapture(evt.pointerId); }
});
stage.addEventListener("pointermove", function(evt) {
  if (!dragging) return;
  var pt = svgPointFromEvent(evt);
  var L = computeLayout(display.a, display.b);
  // mathX = (svgX - ox)/s ; mathY = (oy - svgY)/s
  var mathX = (pt.x - L.ox) / L.s;
  var mathY = (L.oy - pt.y) / L.s;
  if (dragging === "a") {
    var newA = Math.max(2, Math.min(6, mathX));
    params.a = newA;
    display.a = newA;  // direct, not springy, while dragging
  } else if (dragging === "b") {
    var newB = Math.max(2, Math.min(6, mathY));
    params.b = newB;
    display.b = newB;
  }
  syncSlidersToParams();
  render();
  renderEquationBar();
  renderHints();
  syncSliderLabels();
});
stage.addEventListener("pointerup",   function(evt) { dragging = null; });
stage.addEventListener("pointercancel",function(evt) { dragging = null; });

// ===== Initial render =====
render();
renderEquationBar();
renderHints();
syncSliderLabels();

// ===== Height reporter =====
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
