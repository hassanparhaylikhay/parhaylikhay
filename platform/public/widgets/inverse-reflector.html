<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inverse Reflector</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 14px; }
  .head { display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:10px; }
  .head .eq { font-size:14px; }
  .head .eq.f { color:#fff067; }
  .head .eq.fi { color:#0fee89; }
  .head .eq .katex { font-size:1em; }

  .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:10px; padding:0 6px; font-family:'Geist Mono',monospace; font-size:11.5px; color:#7a7875; }
  .row { display:flex; align-items:center; gap:8px; min-width:0; }
  .row .name { color:#fff067; font-weight:600; min-width:24px; }
  .row input[type=range] { flex:1; min-width:60px; appearance:none; -webkit-appearance:none; height:3px; background:#141e2a; border-radius:2px; outline:none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff067; cursor:pointer; border:0; }
  .row .val { min-width:36px; text-align:right; color:#f0eeea; font-weight:600; }

  svg { display:block; width:100%; height:auto; user-select:none; overflow:hidden; }
  .axis-line { stroke:#3a4a5a; stroke-width:1; }
  .grid-line { stroke:#1a2330; stroke-width:1; stroke-dasharray:2 4; }
  .axis-tick-label { font-family:'Geist Mono',monospace; font-size:9.5px; fill:#7a7875; }
  .axis-title { font-family:'Geist Mono',monospace; font-size:10px; fill:#7a7875; }
  .yx-line { stroke:#7a7875; stroke-width:1; stroke-dasharray:3 4; opacity:0.55; }
  .curve-f { stroke:#fff067; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .curve-fi { stroke:#0fee89; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .legend { display:flex; gap:14px; justify-content:center; margin-top:8px; flex-wrap:wrap; font-family:'Geist Mono',monospace; font-size:11px; }
  .legend .item { display:inline-flex; align-items:center; gap:6px; color:#7a7875; }
  .legend .swatch { width:14px; height:2px; border-radius:1px; }
  .legend .f .swatch { background:#fff067; }
  .legend .fi .swatch { background:#0fee89; }
  .legend .yx .swatch { background:#7a7875; }
  .footer { margin-top:8px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="eq f"><span id="eqF"></span></span>
    <span class="eq fi"><span id="eqFi"></span></span>
  </div>

  <div class="controls">
    <div class="row">
      <span class="name">a</span>
      <input type="range" id="a" min="-3" max="4" value="2" step="1"/>
      <span class="val" id="va">2</span>
    </div>
    <div class="row">
      <span class="name">b</span>
      <input type="range" id="b" min="-5" max="5" value="-1" step="1"/>
      <span class="val" id="vb">-1</span>
    </div>
  </div>

  <svg viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="svg">
    <g id="grid"></g>
    <line class="axis-line" id="xAxis"/>
    <line class="axis-line" id="yAxis"/>
    <g id="ticks"></g>
    <text class="axis-title" x="468" y="184" text-anchor="end">x</text>
    <text class="axis-title" x="178" y="14" text-anchor="middle">y</text>
    <line class="yx-line" id="yxLine"/>
    <path class="curve-f" id="pathF"/>
    <path class="curve-fi" id="pathFi"/>
  </svg>

  <div class="legend">
    <span class="item f"><span class="swatch"></span>f(x)</span>
    <span class="item fi"><span class="swatch"></span>f⁻¹(x)</span>
    <span class="item yx"><span class="swatch"></span>y = x</span>
  </div>
  <p class="footer">drag a or b · f and f⁻¹ are mirror images across y = x</p>
</div>

<script>
"use strict";

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false }); }
    catch (e) { target.textContent = tex; }
  } else {
    setTimeout(function() { tryRender(target, tex); }, 50);
  }
}

// Equal pixels per unit. x and y both in [-5, 5].
const XMIN = -5, XMAX = 5, YMIN = -5, YMAX = 5;
const PX = 36;
const PX_LEFT = 30, PX_TOP = 20;
const plotW = (XMAX - XMIN) * PX;
const plotH = (YMAX - YMIN) * PX;
const PX_RIGHT = PX_LEFT + plotW;
const PX_BOT   = PX_TOP + plotH;

function xPx(x) { return PX_LEFT + (x - XMIN) * PX; }
function yPx(y) { return PX_BOT - (y - YMIN) * PX; }

// Build axes + gridlines
(function buildAxes() {
  const grid = document.getElementById("grid");
  for (let i = Math.ceil(XMIN); i <= Math.floor(XMAX); i++) {
    if (i === 0) continue;
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", xPx(i)); ln.setAttribute("x2", xPx(i));
    ln.setAttribute("y1", PX_TOP); ln.setAttribute("y2", PX_BOT);
    grid.appendChild(ln);
  }
  for (let i = Math.ceil(YMIN); i <= Math.floor(YMAX); i++) {
    if (i === 0) continue;
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("class", "grid-line");
    ln.setAttribute("x1", PX_LEFT); ln.setAttribute("x2", PX_RIGHT);
    ln.setAttribute("y1", yPx(i)); ln.setAttribute("y2", yPx(i));
    grid.appendChild(ln);
  }
  document.getElementById("xAxis").setAttribute("x1", PX_LEFT);
  document.getElementById("xAxis").setAttribute("x2", PX_RIGHT);
  document.getElementById("xAxis").setAttribute("y1", yPx(0));
  document.getElementById("xAxis").setAttribute("y2", yPx(0));
  document.getElementById("yAxis").setAttribute("x1", xPx(0));
  document.getElementById("yAxis").setAttribute("x2", xPx(0));
  document.getElementById("yAxis").setAttribute("y1", PX_TOP);
  document.getElementById("yAxis").setAttribute("y2", PX_BOT);
  // y = x dashed line
  document.getElementById("yxLine").setAttribute("x1", xPx(XMIN));
  document.getElementById("yxLine").setAttribute("y1", yPx(XMIN));
  document.getElementById("yxLine").setAttribute("x2", xPx(XMAX));
  document.getElementById("yxLine").setAttribute("y2", yPx(XMAX));
  // Axis tick labels
  const tg = document.getElementById("ticks");
  for (let i = Math.ceil(XMIN); i <= Math.floor(XMAX); i++) {
    if (i === 0) continue;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "axis-tick-label");
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("x", xPx(i));
    t.setAttribute("y", yPx(0) + 14);
    t.textContent = String(i);
    tg.appendChild(t);
  }
  for (let i = Math.ceil(YMIN); i <= Math.floor(YMAX); i++) {
    if (i === 0) continue;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "axis-tick-label");
    t.setAttribute("text-anchor", "end");
    t.setAttribute("x", xPx(0) - 6);
    t.setAttribute("y", yPx(i) + 3);
    t.textContent = String(i);
    tg.appendChild(t);
  }
})();

function fmtSign(v) {
  if (Math.abs(v) < 0.001) return "";
  return v > 0 ? " + " + v : " - " + Math.abs(v);
}
function fmtA(a) { return a === 1 ? "" : (a === -1 ? "-" : String(a)); }

let targetA = 2, displayA = 2;
let targetB = -1, displayB = -1;
const SPRING = 0.20;

function buildLine(slope, intercept) {
  // y = slope*x + intercept; need to clip endpoints to plot box.
  // Collect intersection points with the plot box.
  const pts = [];
  // x = XMIN
  let y = slope * XMIN + intercept;
  if (y >= YMIN && y <= YMAX) pts.push({ x: XMIN, y: y });
  // x = XMAX
  y = slope * XMAX + intercept;
  if (y >= YMIN && y <= YMAX) pts.push({ x: XMAX, y: y });
  // y = YMIN
  if (Math.abs(slope) > 1e-9) {
    let x = (YMIN - intercept) / slope;
    if (x >= XMIN && x <= XMAX) pts.push({ x: x, y: YMIN });
  }
  // y = YMAX
  if (Math.abs(slope) > 1e-9) {
    let x = (YMAX - intercept) / slope;
    if (x >= XMIN && x <= XMAX) pts.push({ x: x, y: YMAX });
  }
  if (pts.length < 2) return "";
  // Sort by x and take endpoints
  pts.sort((p, q) => p.x - q.x);
  const p1 = pts[0]; const p2 = pts[pts.length - 1];
  return "M " + xPx(p1.x).toFixed(2) + " " + yPx(p1.y).toFixed(2) +
         " L " + xPx(p2.x).toFixed(2) + " " + yPx(p2.y).toFixed(2);
}

function tick() {
  displayA += (targetA - displayA) * SPRING;
  displayB += (targetB - displayB) * SPRING;
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  // Curves animate against displayA/displayB; equations track targetA/targetB so the readout doesn't trail.
  if (Math.abs(displayA) < 0.05) {
    document.getElementById("pathF").setAttribute("d", buildLine(0, displayB));
    document.getElementById("pathFi").setAttribute("d", "");
  } else {
    const slopeF = displayA;
    const interceptF = displayB;
    const slopeI = 1 / displayA;
    const interceptI = -displayB / displayA;
    document.getElementById("pathF").setAttribute("d", buildLine(slopeF, interceptF));
    document.getElementById("pathFi").setAttribute("d", buildLine(slopeI, interceptI));
  }

  // Render equations from target values (snap to integer immediately)
  if (targetA === 0) {
    tryRender(document.getElementById("eqF"), "f(x) = " + targetB + " \\quad \\text{(constant — no inverse)}");
    tryRender(document.getElementById("eqFi"), "f^{-1}(x) = \\text{undefined}");
    return;
  }
  const fTex = "f(x) = " + fmtA(targetA) + "x" + fmtSign(targetB);
  let fiTex;
  if (targetA === 1) {
    fiTex = "f^{-1}(x) = x" + fmtSign(-targetB);
  } else if (targetA === -1) {
    fiTex = "f^{-1}(x) = -x" + fmtSign(-targetB);
  } else {
    const numerator = "x" + fmtSign(-targetB);
    fiTex = "f^{-1}(x) = \\dfrac{" + numerator.trim() + "}{" + targetA + "}";
  }
  tryRender(document.getElementById("eqF"), fTex);
  tryRender(document.getElementById("eqFi"), fiTex);
}

document.getElementById("a").addEventListener("input", function(e) {
  targetA = parseInt(e.target.value, 10);
  document.getElementById("va").textContent = targetA;
});
document.getElementById("b").addEventListener("input", function(e) {
  targetB = parseInt(e.target.value, 10);
  document.getElementById("vb").textContent = targetB;
});
tick();

let lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    const wrap = document.getElementById("wrap");
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    const padTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const padBot = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const h = Math.ceil(rect.height + padTop + padBot);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
setTimeout(reportHeight, 200);
setTimeout(reportHeight, 600);
</script>
</body>
</html>
