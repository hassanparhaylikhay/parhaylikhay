<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tree Diagram Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 16px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 18px 16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:14px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:11px; color:#fff067; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; letter-spacing:0.4px; }
  .bag-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .col-pill { display:flex; align-items:center; gap:6px; padding:4px 6px 4px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); }
  .col-pill .swatch { width:10px; height:10px; border-radius:50%; }
  .col-pill .count { font-family:'Geist Mono',monospace; font-size:13px; font-weight:700; min-width:14px; text-align:center; }
  .col-pill .btn { background:transparent; border:0; color:inherit; font-family:'Geist Mono',monospace; font-size:14px; font-weight:700; line-height:1; padding:2px 8px; border-radius:4px; cursor:pointer; opacity:0.55; transition: opacity 0.12s ease; }
  .col-pill .btn:hover:not(:disabled) { opacity:1; }
  .col-pill .btn:disabled { opacity:0.15; cursor:not-allowed; }

  .targets { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .tgt-btn { background:#0b1118; border:1px solid #141e2a; color:#7a7875; font-family:'Geist Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:0.4px; padding:6px 10px; border-radius:5px; cursor:pointer; transition: all 0.12s ease; }
  .tgt-btn:hover { color:#f0eeea; border-color:#3a4a5a; }
  .tgt-btn.active { color:#0fee89; border-color:#0fee89; background:rgba(15,238,137,0.06); }

  #tree { display:block; width:100%; height:auto; user-select:none; overflow:visible; }
  .lbl-host { font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; line-height:1; }
  .lbl-host .katex { font-size:1em; }

  .formula-strip { display:flex; align-items:center; gap:14px; padding:11px 14px; margin-top:10px; background:rgba(15,238,137,0.04); border:1px solid rgba(15,238,137,0.20); border-radius:8px; }
  .formula-strip .tag { font-family:'Geist Mono',monospace; font-size:10px; color:#0fee89; letter-spacing:0.5px; text-transform:uppercase; font-weight:600; flex:0 0 auto; }
  .formula-strip .eq { font-size:16px; color:#f0eeea; overflow:hidden; }
  .formula-strip .eq .katex { font-size:1em; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title" id="head-title">TWO-STAGE EXPERIMENT</span>
    <span class="meta" id="head-meta">tap a target outcome</span>
  </div>

  <div class="bag-row" id="bag-row">
    <span class="col-pill" style="color:#ff4670">
      <span class="swatch" style="background:#ff4670"></span>
      <button class="btn" data-c="red" data-act="minus">−</button>
      <span class="count" id="count-red">3</span>
      <button class="btn" data-c="red" data-act="plus">+</button>
    </span>
    <span class="col-pill" style="color:#00abfa">
      <span class="swatch" style="background:#00abfa"></span>
      <button class="btn" data-c="blue" data-act="minus">−</button>
      <span class="count" id="count-blue">5</span>
      <button class="btn" data-c="blue" data-act="plus">+</button>
    </span>
  </div>

  <div class="targets" id="targets"></div>

  <svg id="tree" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <g id="g-branches"></g>
    <g id="g-nodes"></g>
    <g id="g-branch-labels"></g>
    <g id="g-end-labels"></g>
  </svg>

  <div class="formula-strip">
    <span class="tag" id="formula-tag">probability</span>
    <span class="eq" id="formula"></span>
  </div>
</div>

<script>
"use strict";

var COL = {
  blue:"#00abfa", pink:"#ff4670", yellow:"#fff067", green:"#0fee89",
  faint:"#3a4a5a", grey:"#7a7875", off:"#f0eeea"
};

var state = {
  red: 3, blue: 5,
  mode: "with",         // "with" or "without"
  targetId: "both-red"
};
var MAX_PER = 8;
var MIN_TOTAL = 2;

// Targets cover the four end-points of a two-draw tree.
// Each end is RR, RB, BR, BB.
var TARGETS = [
  { id:"both-red",     label:"both red",        match:["RR"],        teX:"\\text{both red}" },
  { id:"both-blue",    label:"both blue",       match:["BB"],        teX:"\\text{both blue}" },
  { id:"exactly-one",  label:"exactly one red", match:["RB","BR"],   teX:"\\text{exactly one red}" },
  { id:"at-least-one", label:"at least one red",match:["RR","RB","BR"], teX:"\\text{at least one red}" },
  { id:"none-red",     label:"no reds",         match:["BB"],        teX:"\\text{no reds}" }
];

function total(){ return state.red + state.blue; }
function activeTarget(){ return TARGETS.filter(function(t){return t.id===state.targetId;})[0]; }

function gcd(a, b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a; }
function tryRender(target, tex){
  if (typeof katex !== "undefined"){
    try { katex.render(tex, target, { throwOnError:false, output:"html" }); }
    catch(e){ target.textContent = tex; }
  } else setTimeout(function(){ tryRender(target, tex); }, 50);
}
function svgKaTeXLabel(parent, x, y, tex, color, align, width){
  align = align || "center";
  width = width || 100;
  var fo = document.createElementNS("http://www.w3.org/2000/svg","foreignObject");
  fo.setAttribute("x", x - width/2); fo.setAttribute("y", y - 10);
  fo.setAttribute("width", width); fo.setAttribute("height", 20);
  fo.style.overflow = "visible"; fo.style.pointerEvents = "none";
  var div = document.createElement("div");
  div.style.height = "20px"; div.style.display = "flex"; div.style.alignItems = "center";
  div.style.justifyContent = align === "left" ? "flex-start" : (align === "right" ? "flex-end" : "center");
  div.className = "lbl-host"; div.style.color = color || COL.off;
  fo.appendChild(div); parent.appendChild(fo);
  tryRender(div, tex);
}
function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }

// Returns a TeX-formatted fraction (e.g. "\\dfrac{3}{8}") given (num, den) with simplification.
function fracTex(num, den){
  if (den === 0) return "\\text{undefined}";
  if (num === 0) return "0";
  if (num === den) return "1";
  var g = gcd(num, den);
  return "\\dfrac{" + (num/g) + "}{" + (den/g) + "}";
}
function fracTexNoSimp(num, den){
  if (den === 0) return "\\text{undef}";
  if (num === 0) return "0";
  return "\\dfrac{" + num + "}{" + den + "}";
}

// Compute the four endpoints {key, p, parts}
// parts: an array of [num, den] for the multiplication
function buildEndpoints(){
  var R = state.red, B = state.blue, N = R + B;
  if (N === 0) return null;
  var with_ = state.mode === "with";
  // Stage 1 probabilities
  var s1R = { num:R, den:N };
  var s1B = { num:B, den:N };
  function s2(stage1Key){
    if (with_){
      return {
        R: { num:R, den:N },
        B: { num:B, den:N }
      };
    } else {
      // Without replacement: after stage 1 we have N-1 total. If stage 1 was R we have R-1 reds remaining.
      if (stage1Key === "R"){
        return {
          R: { num: Math.max(0, R-1), den: N-1 },
          B: { num: B,                 den: N-1 }
        };
      } else {
        return {
          R: { num: R,                 den: N-1 },
          B: { num: Math.max(0, B-1), den: N-1 }
        };
      }
    }
  }
  var s2_after_R = s2("R");
  var s2_after_B = s2("B");
  return [
    { key:"RR", parts:[s1R, s2_after_R.R] },
    { key:"RB", parts:[s1R, s2_after_R.B] },
    { key:"BR", parts:[s1B, s2_after_B.R] },
    { key:"BB", parts:[s1B, s2_after_B.B] }
  ].map(function(e){
    var pNum = e.parts[0].num * e.parts[1].num;
    var pDen = e.parts[0].den * e.parts[1].den;
    return { key:e.key, parts:e.parts, pNum:pNum, pDen:pDen };
  });
}

// ----- Tree rendering -----
function colourOf(letter){ return letter === "R" ? COL.pink : COL.blue; }
function nameOf(letter){ return letter === "R" ? "R" : "B"; }

function drawTree(){
  var gB = document.getElementById("g-branches");
  var gN = document.getElementById("g-nodes");
  var gBL = document.getElementById("g-branch-labels");
  var gEL = document.getElementById("g-end-labels");
  clear(gB); clear(gN); clear(gBL); clear(gEL);

  var endpoints = buildEndpoints();
  var target = activeTarget();

  // Coordinates
  var X0 = 40, X1 = 195, X2 = 360;
  var Y_TOP = 50, Y_BOT = 270;
  var Y_S1_R = 100, Y_S1_B = 220;
  var Y_S2 = [60, 140, 180, 260]; // RR, RB, BR, BB

  // Stage 1 branches: root → R, root → B
  var rootY = 160;

  function isHighlight(key){
    return target && target.match.indexOf(key) >= 0;
  }
  // A stage-1 branch is highlighted if ANY of its leaves are in the target.
  function isHighlightStage1(letter){
    if (!target) return false;
    return target.match.some(function(k){ return k[0] === letter; });
  }

  function drawLine(g, x1, y1, x2, y2, color, highlight){
    var ln = document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
    ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
    ln.setAttribute("stroke", color);
    ln.setAttribute("stroke-width", highlight ? 2.6 : 1.6);
    ln.setAttribute("stroke-linecap", "round");
    ln.setAttribute("opacity", highlight ? 1 : 0.45);
    g.appendChild(ln);
  }

  // root
  var rootDot = document.createElementNS("http://www.w3.org/2000/svg","circle");
  rootDot.setAttribute("cx", X0); rootDot.setAttribute("cy", rootY);
  rootDot.setAttribute("r", 5);
  rootDot.setAttribute("fill", "#3a4a5a");
  rootDot.setAttribute("stroke", "#0b1118"); rootDot.setAttribute("stroke-width", 1);
  gN.appendChild(rootDot);

  // Stage 1 branch to R
  drawLine(gB, X0, rootY, X1, Y_S1_R, COL.pink, isHighlightStage1("R"));
  // Stage 1 branch to B
  drawLine(gB, X0, rootY, X1, Y_S1_B, COL.blue, isHighlightStage1("B"));

  // Stage 1 nodes (R and B)
  function drawStageNode(g, x, y, letter){
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y);
    c.setAttribute("r", 11);
    c.setAttribute("fill", letter === "R" ? "rgba(255,70,112,0.18)" : "rgba(0,171,250,0.18)");
    c.setAttribute("stroke", colourOf(letter)); c.setAttribute("stroke-width", 1.5);
    g.appendChild(c);
    svgKaTeXLabel(g, x, y, letter, colourOf(letter), "center", 30);
  }
  drawStageNode(gN, X1, Y_S1_R, "R");
  drawStageNode(gN, X1, Y_S1_B, "B");

  // Stage 1 branch labels (probabilities)
  // Mid of segment from (X0,rootY) to (X1, Y_S1_R), offset up
  function midLabel(g, x1, y1, x2, y2, label, color, sideOffsetY){
    var mx = (x1 + x2) / 2 - 4;
    var my = (y1 + y2) / 2 + (sideOffsetY || 0);
    svgKaTeXLabel(g, mx, my, label, color, "center", 90);
  }
  if (endpoints){
    var s1R = endpoints[0].parts[0]; // num/den for stage1=R
    var s1B = endpoints[2].parts[0];
    midLabel(gBL, X0, rootY, X1, Y_S1_R, fracTexNoSimp(s1R.num, s1R.den), COL.pink, -14);
    midLabel(gBL, X0, rootY, X1, Y_S1_B, fracTexNoSimp(s1B.num, s1B.den), COL.blue,  14);
  }

  // Stage 2 branches and nodes
  function drawStage2(stage1Letter, stage1NodeY, indices){
    // indices: [topIdx, botIdx]  pointing into endpoints
    var topEP = endpoints[indices[0]];
    var botEP = endpoints[indices[1]];
    // Branch to R (top) and branch to B (bottom) from stage1 node
    var topY = Y_S2[indices[0]];
    var botY = Y_S2[indices[1]];
    drawLine(gB, X1, stage1NodeY, X2, topY, COL.pink, isHighlight(topEP.key));
    drawLine(gB, X1, stage1NodeY, X2, botY, COL.blue, isHighlight(botEP.key));
    // End nodes
    drawStageNode(gN, X2, topY, "R");
    drawStageNode(gN, X2, botY, "B");
    // Stage 2 probabilities mid-segments
    midLabel(gBL, X1, stage1NodeY, X2, topY, fracTexNoSimp(topEP.parts[1].num, topEP.parts[1].den), COL.pink, -14);
    midLabel(gBL, X1, stage1NodeY, X2, botY, fracTexNoSimp(botEP.parts[1].num, botEP.parts[1].den), COL.blue,  14);
    // End labels (outcome + multiplied probability)
    function endLabel(g, x, y, ep){
      var hl = isHighlight(ep.key);
      var outcomeColor = hl ? COL.green : COL.grey;
      // outcome key (RR, RB, etc.)
      svgKaTeXLabel(g, x + 38, y - 8,
        "{\\color{" + outcomeColor + "}\\text{" + ep.key + "}}",
        outcomeColor, "center", 50);
      // probability
      if (ep.pDen > 0){
        var probTex = fracTex(ep.pNum, ep.pDen);
        var col = hl ? COL.green : "#7a7875";
        svgKaTeXLabel(g, x + 38, y + 10, probTex, col, "center", 70);
      }
    }
    endLabel(gEL, X2, topY, topEP);
    endLabel(gEL, X2, botY, botEP);
  }

  if (endpoints){
    drawStage2("R", Y_S1_R, [0, 1]); // RR, RB
    drawStage2("B", Y_S1_B, [2, 3]); // BR, BB
  }
}

function renderFormula(){
  var endpoints = buildEndpoints();
  var target = activeTarget();
  var tagEl = document.getElementById("formula-tag");
  tagEl.textContent = "P(" + target.label + ")";
  var el = document.getElementById("formula");
  el.innerHTML = "";
  if (!endpoints){
    tryRender(el, "\\text{empty bag}");
    return;
  }
  // Filter endpoints in target.match
  var matched = endpoints.filter(function(e){ return target.match.indexOf(e.key) >= 0; });
  if (matched.length === 0){
    tryRender(el, "P(\\,) = 0");
    return;
  }
  // Build the expression:  P = (n1*n2)/(d1*d2)  [for each matched path, then summed]
  // For a single path: just show n1/d1 × n2/d2 = product/denProduct = simplified
  // For multiple paths: show sum of path products = total/totalDen = simplified
  var parts = matched.map(function(e){
    return "\\dfrac{" + e.parts[0].num + "}{" + e.parts[0].den + "} \\times \\dfrac{" + e.parts[1].num + "}{" + e.parts[1].den + "}";
  });
  // Sum of numerators / common denominator
  var totalNum = matched.reduce(function(s, e){ return s + e.pNum; }, 0);
  var totalDen = matched[0].pDen;
  // All matched have same pDen by construction (s1.den * s2.den is the same for all four endpoints in both with and without modes).
  var tex;
  if (matched.length === 1){
    tex = "P({\\color{#0fee89}" + target.teX + "}) = " + parts[0] + " = " + fracTex(totalNum, totalDen);
  } else {
    tex = "P({\\color{#0fee89}" + target.teX + "}) = " + parts.join(" + ") + " = " + fracTex(totalNum, totalDen);
  }
  // Decimal
  var dec = totalNum / totalDen;
  var decStr;
  if (Math.abs(dec - Math.round(dec * 100) / 100) < 1e-9){
    decStr = (Math.round(dec * 100) / 100).toString();
  } else if (Math.abs(dec - Math.round(dec * 1000) / 1000) < 1e-9){
    decStr = (Math.round(dec * 1000) / 1000).toString();
  } else {
    decStr = dec.toFixed(4);
  }
  tex += " \\approx " + decStr;
  tryRender(el, tex);
}

function buildTargets(){
  var host = document.getElementById("targets");
  host.innerHTML = "";
  TARGETS.forEach(function(t){
    var b = document.createElement("button");
    b.className = "tgt-btn" + (state.targetId === t.id ? " active" : "");
    b.textContent = t.label;
    b.addEventListener("click", function(){
      state.targetId = t.id;
      render();
    });
    host.appendChild(b);
  });
}

function syncCounts(){
  document.getElementById("count-red").textContent = state.red;
  document.getElementById("count-blue").textContent = state.blue;
}

function render(){
  buildTargets();
  syncCounts();
  drawTree();
  renderFormula();
  notifyHeight();
}

// Wire +/- buttons
document.querySelectorAll(".col-card .btn").forEach(function(b){
  b.addEventListener("click", function(){
    var c = b.dataset.c;
    var act = b.dataset.act;
    if (act === "plus"){
      if (state[c] < MAX_PER && total() < MAX_PER * 2){
        state[c]++;
        render();
      }
    } else {
      if (state[c] > 0 && total() - 1 >= MIN_TOTAL){
        state[c]--;
        render();
      }
    }
  });
});
// Mode is locked by URL param: ?mode=with or ?mode=without. No UI toggle.
(function(){
  var params = new URLSearchParams(window.location.search);
  var m = params.get("mode");
  if (m === "with" || m === "without") state.mode = m;
  // Title reflects the locked mode so the student knows which world they are in.
  var title = state.mode === "without"
    ? "TREE · WITHOUT REPLACEMENT"
    : "TREE · WITH REPLACEMENT";
  document.getElementById("head-title").textContent = title;
})();

function notifyHeight(){
  var h = document.getElementById("wrap").offsetHeight + 30;
  if (window.parent && window.parent !== window){
    window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  }
}
window.addEventListener("resize", notifyHeight);

render();
setTimeout(notifyHeight, 200);
</script>
</body>
</html>
