<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sector → Cone Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:14px 16px 16px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; min-height:22px; gap:10px; }
  .step-title { font-family:'Geist Mono',monospace; font-size:12px; color:#fff067; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
  .meta { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; letter-spacing:0.4px; }

  .stage-outer {
    width:100%;
    max-width:480px;
    margin:0 auto;
    aspect-ratio: 480 / 360;
    position:relative;
  }
  .stage {
    position:absolute;
    inset:0;
    perspective:1200px;
    overflow:hidden;
    border-radius:6px;
  }
  .scene {
    position:absolute;
    left:50%; top:50%;
    width:0; height:0;
    transform-style: preserve-3d;
    /* Folded (cone) state: tilted 3D view */
    transform: rotateX(-22deg) rotateY(28deg);
    transition: transform 1.6s cubic-bezier(0.4, 0.1, 0.4, 1);
  }
  /* Flat state: top-down view */
  .stage.is-flat .scene { transform: rotateX(0deg) rotateY(0deg); }

  /* Slats and the base circle: each has its own transform with the same transition */
  .face {
    position:absolute;
    transform-style: preserve-3d;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
  }

  .controls { display:flex; gap:8px; justify-content:center; margin-top:14px; align-items:center; }
  button.ctl {
    background:#0b1118; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:12px; font-weight:600;
    padding:8px 18px; border-radius:6px; cursor:pointer; min-width:120px;
    transition: color 0.12s, border-color 0.12s;
  }
  button.ctl:hover { color:#fff067; border-color:#fff067; }

  .footer { margin-top:10px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="step-title">SECTOR → CONE · LIVE FOLD</span>
    <span class="meta" id="state-text">FLAT SECTOR</span>
  </div>
  <div class="stage-outer">
    <div class="stage" id="stage">
      <div class="scene" id="scene"></div>
    </div>
  </div>
  <div class="controls">
    <button class="ctl" id="toggle">fold →</button>
  </div>
  <p class="footer">click to fold the flat sector into a cone — and click again to unroll it back</p>
</div>

<script>
"use strict";

var COL = {
  blue:   "#00abfa",
  yellow: "#fff067",
  orange: "#ff822c",
  pink:   "#ff4670",
  faint:  "#3a4a5a"
};

function fillOf(hex, alpha) {
  alpha = alpha == null ? 0.18 : alpha;
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}
function setStyle(el, s) { for (var k in s) el.style[k] = s[k]; }

// Cone parameters: same defaults as the Cambridge example (slant 8, base
// circumference = 10π/3 → base radius = 5/3). We pick a stage-friendly
// rendering by using "natural" cm values that fit nicely.
var rCm = 4;        // cone base radius for visual rendering
var hCm = 9;        // cone height
var slantCm = Math.sqrt(rCm * rCm + hCm * hCm);  // = √97

// Stage size (matches the perspective + 480x360 aspect ratio used by net-unfolder)
var STAGE_W = 480, STAGE_H = 360;

var scene = document.getElementById("scene");
var stage = document.getElementById("stage");

// Auto-scale so the unrolled sector + base circle fit in the stage with margin.
// The unrolled net spans: width ≈ 2 × slant × sin(α/2), height ≈ slant + 2r + gap.
// Use the same conservative scale as net-unfolder.
var scale = Math.min(420 / (2 * slantCm), 320 / (slantCm + 2 * rCm + 10));
var r = rCm * scale, H = hCm * scale, slant = slantCm * scale;

// Cone half-angle (between axis and slant edge) — slat's tilt from vertical when folded
var alphaCone = Math.atan2(r, H) * 180 / Math.PI;
// Sector angle for the unrolled net (360° × r / slant)
var sectorAngleDeg = (2 * Math.PI * r / slant) * 180 / Math.PI;

// Centre the net vertically: net spans from -yOff to -yOff + slant + 2r
var yOff = (slant + 2 * r) / 2;

var N = 36;
var slatW = 2 * Math.PI * r / N + 1.5;  // small overlap to avoid hairline gaps
var allParts = [];

// ===== Build the cone slats =====
for (var i = 0; i < N; i++) {
  var thetaDeg = (i + 0.5) / N * 360;
  var thetaRad = thetaDeg * Math.PI / 180;
  var alphaDeg = (i + 0.5) / N * sectorAngleDeg - sectorAngleDeg / 2;
  var alphaRad = alphaDeg * Math.PI / 180;

  var slat = document.createElement("div");
  slat.className = "face cone-slat";
  setStyle(slat, {
    position: "absolute",
    left: (-slatW / 2) + "px",
    top: (-slant / 2) + "px",
    width: slatW + "px",
    height: slant + "px",
    background: fillOf(COL.blue, 0.20),
    clipPath: "polygon(50% 0%, 0% 100%, 100% 100%)",
    outline: "0.5px solid " + COL.blue,
    outlineOffset: "-0.5px",
    transition: "transform 1.6s cubic-bezier(0.4, 0.1, 0.4, 1), background 1.6s ease, outline-color 1.6s ease"
  });

  // Folded transform: slat sits on the cone's curved surface
  var foldedTx = r * Math.cos(thetaRad) / 2;
  var foldedTz = r * Math.sin(thetaRad) / 2;
  slat.dataset.folded3d =
    "translate3d(" + foldedTx + "px,0px," + foldedTz + "px) " +
    "rotateY(" + (-thetaDeg) + "deg) rotateZ(" + (-alphaCone) + "deg)";

  // Flat transform: slat sits in the unrolled sector
  var flatTx = Math.sin(alphaRad) * slant / 2;
  var flatTy = -yOff + Math.cos(alphaRad) * slant / 2;
  slat.dataset.flat3d =
    "translate3d(" + flatTx + "px," + flatTy + "px,0px) rotateZ(" + (-alphaDeg) + "deg)";

  // Start in the FLAT state (this is the reverse of the net-unfolder)
  slat.style.transform = slat.dataset.flat3d;
  scene.appendChild(slat);
  allParts.push(slat);
}

// ===== Build the base circle =====
var baseCircle = document.createElement("div");
baseCircle.className = "face cone-base";
setStyle(baseCircle, {
  position: "absolute",
  left: (-r) + "px",
  top: (-r) + "px",
  width: (2 * r) + "px",
  height: (2 * r) + "px",
  borderRadius: "50%",
  border: "1.5px solid " + COL.yellow,
  background: fillOf(COL.yellow, 0.20),
  transition: "transform 1.6s cubic-bezier(0.4, 0.1, 0.4, 1)"
});
baseCircle.dataset.folded3d = "translate3d(0px," + (H / 2) + "px,0px) rotateX(90deg)";
baseCircle.dataset.flat3d   = "translate3d(0px," + (-yOff + slant + r) + "px,0px) rotateX(0deg)";
// Start in the FLAT state
baseCircle.style.transform = baseCircle.dataset.flat3d;
scene.appendChild(baseCircle);
allParts.push(baseCircle);

// ===== Toggle controller =====
var toggleBtn = document.getElementById("toggle");
var stateEl = document.getElementById("state-text");

// Start in the flat (sector) state, since the lesson is showing how a
// SECTOR ROLLS INTO a cone — opposite of the net-unfolder.
var isFlat = true;
stage.classList.add("is-flat");

function setView(flat) {
  isFlat = flat;
  if (flat) {
    stage.classList.add("is-flat");
    toggleBtn.textContent = "fold →";
    stateEl.textContent = "FLAT SECTOR";
    allParts.forEach(function(el) { el.style.transform = el.dataset.flat3d; });
  } else {
    stage.classList.remove("is-flat");
    toggleBtn.textContent = "← unfold";
    stateEl.textContent = "FOLDED CONE";
    allParts.forEach(function(el) { el.style.transform = el.dataset.folded3d; });
  }
}
toggleBtn.onclick = function() { setView(!isFlat); };

// ===== Height reporter =====
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var hh = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(hh - lastReported) < 3) return;
    lastReported = hh;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: hh }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
