<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Area Grid Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:16px 18px 18px; }

  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; }
  .kicker { font-family:'Geist Mono',monospace; font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:#fff067; font-weight:600; }
  .pill { font-family:'Geist Mono',monospace; font-size:10px; color:#7a7875; border:1px solid #141e2a; border-radius:14px; padding:3px 10px; letter-spacing:0.4px; }

  .selector { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .selector button {
    flex:1; min-width:90px;
    background:#07090d; border:1px solid #141e2a; color:#7a7875;
    font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:600;
    padding:8px 8px; border-radius:6px; cursor:pointer;
    letter-spacing:0.4px;
    transition: color 0.12s, border-color 0.12s;
  }
  .selector button:hover { color:#00abfa; border-color:#00abfa; }
  .selector button.active { color:#00abfa; border-color:#00abfa; background:#0d1822; }

  .stage {
    display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:stretch;
  }

  .square-wrap {
    background:#07090d; border:1px solid #141e2a; border-radius:8px;
    padding:14px; display:flex; flex-direction:column; align-items:center;
  }
  .square-cap {
    font-family:'Geist Mono',monospace; font-size:10.5px; color:#7a7875;
    letter-spacing:0.5px; text-transform:uppercase; margin-bottom:10px; text-align:center;
  }
  .square {
    width:100%; aspect-ratio:1; max-width:280px;
    background: rgba(0,171,250,0.08);
    border: 2px solid #00abfa;
    position: relative;
    overflow: hidden;
  }
  .square .grid {
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.6s ease;
  }
  .square .grid.shown { opacity: 1; }
  .square .label-mid {
    position:absolute; left:50%; top:50%; transform:translate(-50%, -50%);
    font-family:'Geist Mono',monospace; font-size:13px; color:#00abfa;
    font-weight:700; text-align:center; pointer-events:none;
    background:#0b1118; padding:4px 8px; border-radius:4px;
    transition: opacity 0.4s ease;
  }
  .square.gridded .label-mid { opacity:0; }

  .info {
    background:#07090d; border:1px solid #141e2a; border-radius:8px;
    padding:14px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .info h4 {
    font-family:'Geist Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:1.4px; text-transform:uppercase; color:#7a7875;
  }
  .info .step { font-size:13px; color:#c8c6be; line-height:1.5; }
  .info .step .katex { font-size:1.05em; }
  .info .answer {
    font-family:'Geist Mono',monospace; font-size:14px; color:#0fee89;
    font-weight:700; padding:8px 10px;
    background:#0a1a14; border:1px solid rgba(15,238,137,0.25); border-radius:5px;
    text-align:center; min-height:40px; display:flex; align-items:center; justify-content:center;
  }
  .info .ticker {
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
    text-align:center;
  }
  .info .ticker b { color:#fff067; font-weight:700; }

  .reveal-row { display:flex; justify-content:center; margin-top:14px; }
  .reveal-btn {
    background:#0b1118; border:1.5px solid #00abfa; color:#00abfa;
    font-family:'Geist Mono',monospace; font-size:12.5px; font-weight:700;
    padding:10px 22px; border-radius:6px; cursor:pointer; letter-spacing:0.5px;
    transition: background 0.12s, color 0.12s;
  }
  .reveal-btn:hover { background:#00abfa; color:#07090d; }
  .reveal-btn.on { background:#00abfa; color:#07090d; }

  .footer { margin-top:14px; font-family:'Geist Mono',monospace; font-size:10px; color:#3a4a5a; text-align:center; letter-spacing:0.4px; }

  @media (max-width: 540px) {
    .stage { grid-template-columns: 1fr; }
    .square { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <span class="kicker">AREA = LENGTH SQUARED</span>
    <span class="pill">pick a pair, then reveal the grid</span>
  </div>
  <div class="selector" id="selector">
    <button data-pair="mm-cm">mm² ↔ cm²</button>
    <button data-pair="cm-m" class="active">cm² ↔ m²</button>
    <button data-pair="m-km">m² ↔ km²</button>
  </div>
  <div class="stage">
    <div class="square-wrap">
      <div class="square-cap" id="squareCap">1 m × 1 m square</div>
      <div class="square" id="square">
        <div class="grid" id="grid"></div>
        <div class="label-mid" id="labelMid">1 m²</div>
      </div>
    </div>
    <div class="info">
      <h4>linear conversion</h4>
      <div class="step" id="stepLinear"></div>
      <h4>square both sides</h4>
      <div class="step" id="stepSquared"></div>
      <div class="answer" id="answer"></div>
      <p class="ticker" id="ticker">small squares revealed: <b id="tickerNum">0</b></p>
    </div>
  </div>
  <div class="reveal-row">
    <button class="reveal-btn" id="revealBtn">reveal grid</button>
  </div>
  <p class="footer">visual proof of why area conversion uses the SQUARE of the linear factor</p>
</div>

<script>
"use strict";

// All 3 pairs use the same big-square visual (representing the larger unit).
// gridLines = how many divisions per side we DRAW (visually). The actual
// "smallCount" reflects the real number of small units in the big one.
var PAIRS = {
  "mm-cm": {
    big: "1 cm",
    bigArea: "1 cm²",
    bigSq: "1 cm × 1 cm",
    smallUnit: "mm",
    linearFactor: 10,
    gridLines: 10,
    drawTrueGrid: true,
    linearTex: "1\\;\\text{cm} = 10\\;\\text{mm}",
    squaredTex: "1\\;\\text{cm}^2 = (10\\;\\text{mm})^2 = 10 \\times 10 = 100\\;\\text{mm}^2",
    answerTex: "1\\;\\text{cm}^2 = 100\\;\\text{mm}^2",
    smallCount: 100,
    gridLineColor: "rgba(0,171,250,0.5)",
    note: ""
  },
  "cm-m": {
    big: "1 m",
    bigArea: "1 m²",
    bigSq: "1 m × 1 m",
    smallUnit: "cm",
    linearFactor: 100,
    gridLines: 100,
    drawTrueGrid: true,
    linearTex: "1\\;\\text{m} = 100\\;\\text{cm}",
    squaredTex: "1\\;\\text{m}^2 = (100\\;\\text{cm})^2 = 100 \\times 100 = 10\\,000\\;\\text{cm}^2",
    answerTex: "1\\;\\text{m}^2 = 10\\,000\\;\\text{cm}^2",
    smallCount: 10000,
    gridLineColor: "rgba(0,171,250,0.35)",
    note: ""
  },
  "m-km": {
    big: "1 km",
    bigArea: "1 km²",
    bigSq: "1 km × 1 km",
    smallUnit: "m",
    linearFactor: 1000,
    gridLines: 10,
    drawTrueGrid: false,
    linearTex: "1\\;\\text{km} = 1000\\;\\text{m}",
    squaredTex: "1\\;\\text{km}^2 = (1000\\;\\text{m})^2 = 1000 \\times 1000 = 1\\,000\\,000\\;\\text{m}^2",
    answerTex: "1\\;\\text{km}^2 = 1\\,000\\,000\\;\\text{m}^2",
    smallCount: 1000000,
    gridLineColor: "rgba(0,171,250,0.45)",
    note: "(grid drawn with 10 lines per side; each cell shown stands for a 100 m × 100 m block — 10 000 of those make 1 km²)"
  }
};

var state = { pair: "cm-m", revealed: false, tickerAnimToken: 0 };

var sq          = document.getElementById("square");
var grid        = document.getElementById("grid");
var labelMid    = document.getElementById("labelMid");
var capEl       = document.getElementById("squareCap");
var stepLinear  = document.getElementById("stepLinear");
var stepSquared = document.getElementById("stepSquared");
var answerEl    = document.getElementById("answer");
var revealBtn   = document.getElementById("revealBtn");
var tickerNum   = document.getElementById("tickerNum");
var selector    = document.getElementById("selector");

function tryRender(target, tex) {
  if (typeof katex !== "undefined") {
    try { katex.render(tex, target, { throwOnError: false, output: "html" }); }
    catch (e) { target.textContent = tex; }
  } else { setTimeout(function() { tryRender(target, tex); }, 50); }
}

function applyPair() {
  var p = PAIRS[state.pair];
  capEl.textContent = p.bigSq + " square";
  labelMid.textContent = p.bigArea;
  // Update the grid background pattern using TWO orthogonal repeating-linear-gradients.
  // Each line is 1px solid; cells are equal size.
  var lines = p.gridLines;
  grid.style.background =
    "linear-gradient(to right, " + p.gridLineColor + " 1px, transparent 1px)," +
    "linear-gradient(to bottom, " + p.gridLineColor + " 1px, transparent 1px)";
  grid.style.backgroundSize = (100 / lines) + "% " + (100 / lines) + "%";
  tryRender(stepLinear, p.linearTex);
  tryRender(stepSquared, p.squaredTex);
  tryRender(answerEl, p.answerTex);
  tickerNum.textContent = "0";
  state.revealed = false;
  grid.classList.remove("shown");
  sq.classList.remove("gridded");
  revealBtn.classList.remove("on");
  revealBtn.textContent = "reveal grid";
  // Update active selector button
  var btns = selector.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("active", btns[i].dataset.pair === state.pair);
  }
  reportHeight();
}

function animateTicker(target, durationMs) {
  state.tickerAnimToken++;
  var token = state.tickerAnimToken;
  var start = performance.now();
  var from = parseInt((tickerNum.textContent || "0").replace(/[^0-9]/g, ""), 10) || 0;
  function tick(now) {
    if (token !== state.tickerAnimToken) return;
    var t = Math.min(1, (now - start) / durationMs);
    // ease-out cubic
    var eased = 1 - Math.pow(1 - t, 3);
    var v = Math.floor(from + (target - from) * eased);
    tickerNum.textContent = v.toLocaleString();
    if (t < 1) requestAnimationFrame(tick); else tickerNum.textContent = target.toLocaleString();
  }
  requestAnimationFrame(tick);
}

function toggleReveal() {
  state.revealed = !state.revealed;
  if (state.revealed) {
    grid.classList.add("shown");
    sq.classList.add("gridded");
    revealBtn.classList.add("on");
    revealBtn.textContent = "hide grid";
    var p = PAIRS[state.pair];
    animateTicker(p.smallCount, 900);
  } else {
    grid.classList.remove("shown");
    sq.classList.remove("gridded");
    revealBtn.classList.remove("on");
    revealBtn.textContent = "reveal grid";
    animateTicker(0, 350);
  }
}

selector.addEventListener("click", function(e) {
  var btn = e.target.closest("button[data-pair]");
  if (!btn) return;
  state.pair = btn.dataset.pair;
  applyPair();
});
revealBtn.addEventListener("click", toggleReveal);

applyPair();

// === Height reporter ====================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
