<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Area Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b1118; color:#c8c6be; font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body { padding:14px 18px 16px; }
  .wrap { max-width:696px; margin:0 auto; border:1px solid #141e2a; border-radius:10px; background:#0b1118; padding:24px 22px 20px; }

  .header {
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
    letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:18px;
  }

  .square-stage {
    display:flex; justify-content:center; padding:4px;
  }
  .square {
    width:100%; max-width:300px; aspect-ratio:1;
    background: rgba(0,171,250,0.07);
    border: 2px solid #00abfa;
    position: relative;
    cursor: pointer;
    user-select:none;
    transition: background 0.18s, transform 0.12s;
  }
  .square:hover { background: rgba(0,171,250,0.10); }
  .square:active { transform: scale(0.992); }
  .grid {
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.7s ease;
  }
  .grid.shown { opacity: 1; }

  .center-label {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:'Geist Mono',monospace; font-size:18px; font-weight:700;
    color:#00abfa; letter-spacing:0.5px; pointer-events:none;
    transition: opacity 0.4s ease;
    text-align:center; line-height:1.4;
  }
  .center-label .small { font-size:11px; color:#7a7875; font-weight:500; letter-spacing:1px; display:block; margin-top:6px; }
  .square.gridded .center-label { opacity:0; }

  .equation-line {
    text-align:center; margin-top:22px;
    font-family:'Geist Mono',monospace; font-size:15px; color:#f0eeea;
    line-height:1.6; min-height:24px;
  }
  .equation-line .ans { color:#0fee89; font-weight:700; }
  .equation-line .small { display:block; font-size:11px; color:#7a7875; margin-top:4px; letter-spacing:0.4px; }

  .pair-row {
    display:flex; gap:6px; justify-content:center; margin-top:18px; flex-wrap:wrap;
  }
  .pair-row .pair {
    font-family:'Geist Mono',monospace; font-size:11px; color:#7a7875;
    padding:6px 12px; border-radius:14px;
    border:1px solid #141e2a; background:transparent;
    cursor:pointer; user-select:none; letter-spacing:0.4px;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .pair-row .pair:hover { color:#00abfa; border-color:#3a4a5a; }
  .pair-row .pair.active { color:#00abfa; border-color:#00abfa; background: rgba(0,171,250,0.08); }

  .footer {
    margin-top:14px; font-family:'Geist Mono',monospace; font-size:10px;
    color:#3a4a5a; text-align:center; letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="header">AREA = LENGTH SQUARED</div>
  <div class="square-stage">
    <div class="square" id="square">
      <div class="grid" id="grid"></div>
      <div class="center-label" id="centerLabel">
        <span id="bigArea">1 m²</span>
        <span class="small" id="hint">tap to reveal</span>
      </div>
    </div>
  </div>
  <div class="equation-line" id="equation"></div>
  <div class="pair-row" id="pairRow">
    <span class="pair" data-pair="mm-cm">mm² ↔ cm²</span>
    <span class="pair active" data-pair="cm-m">cm² ↔ m²</span>
  </div>
  <div class="footer" id="footer">tap the square to reveal the grid</div>
</div>

<script>
"use strict";

var PAIRS = {
  "mm-cm": {
    big: "1 cm²",
    linearFactor: 10,
    gridLines: 10,
    afterEquation: '1 cm² = 10 × 10 = <span class="ans">100 mm²</span>',
    smallCount: 100,
    smallUnit: "mm²"
  },
  "cm-m": {
    big: "1 m²",
    linearFactor: 100,
    gridLines: 100,
    afterEquation: '1 m² = 100 × 100 = <span class="ans">10,000 cm²</span>',
    smallCount: 10000,
    smallUnit: "cm²"
  }
};

var state = { pair: "cm-m", revealed: false, animToken: 0 };

var sq          = document.getElementById("square");
var grid        = document.getElementById("grid");
var bigArea     = document.getElementById("bigArea");
var hint        = document.getElementById("hint");
var equationEl  = document.getElementById("equation");
var pairRow     = document.getElementById("pairRow");

function applyPair() {
  var p = PAIRS[state.pair];
  bigArea.textContent = p.big;
  // Grid background pattern
  grid.style.background =
    "linear-gradient(to right, rgba(0,171,250,0.42) 1px, transparent 1px)," +
    "linear-gradient(to bottom, rgba(0,171,250,0.42) 1px, transparent 1px)";
  grid.style.backgroundSize = (100 / p.gridLines) + "% " + (100 / p.gridLines) + "%";
  // Reset reveal
  state.revealed = false;
  grid.classList.remove("shown");
  sq.classList.remove("gridded");
  hint.textContent = "tap to reveal";
  renderEquation(0);
  // Update pair switches
  var btns = pairRow.querySelectorAll(".pair");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("active", btns[i].dataset.pair === state.pair);
  }
  reportHeight();
}

function renderEquation(count) {
  var p = PAIRS[state.pair];
  if (count === 0) {
    // Hide equation until reveal
    equationEl.innerHTML = '<span style="color:#3a4a5a">' + p.big + ' = ?</span>';
  } else {
    equationEl.innerHTML = p.afterEquation +
      '<span class="small">small ' + p.smallUnit + ' counted: ' + count.toLocaleString() + '</span>';
  }
}

function animateTicker(target, durationMs) {
  state.animToken++;
  var token = state.animToken;
  var start = performance.now();
  function tick(now) {
    if (token !== state.animToken) return;
    var t = Math.min(1, (now - start) / durationMs);
    var eased = 1 - Math.pow(1 - t, 3);
    var v = Math.floor(target * eased);
    renderEquation(v);
    if (t < 1) requestAnimationFrame(tick); else renderEquation(target);
  }
  requestAnimationFrame(tick);
}

function toggleReveal() {
  state.revealed = !state.revealed;
  if (state.revealed) {
    grid.classList.add("shown");
    sq.classList.add("gridded");
    animateTicker(PAIRS[state.pair].smallCount, 950);
  } else {
    grid.classList.remove("shown");
    sq.classList.remove("gridded");
    state.animToken++;
    renderEquation(0);
  }
}

sq.addEventListener("click", toggleReveal);
pairRow.addEventListener("click", function(e) {
  var pairEl = e.target.closest("[data-pair]");
  if (!pairEl) return;
  state.pair = pairEl.dataset.pair;
  applyPair();
});

applyPair();

// === Height reporter ====================================================
var lastReported = 0, reportScheduled = false;
function reportHeight() {
  if (reportScheduled) return;
  reportScheduled = true;
  requestAnimationFrame(function() {
    reportScheduled = false;
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var bodyPadTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    var bodyPadBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(rect.height + bodyPadTop + bodyPadBottom);
    if (Math.abs(h - lastReported) < 3) return;
    lastReported = h;
    if (window.parent !== window) window.parent.postMessage({ type: "pl-widget-resize", height: h }, "*");
  });
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById("wrap"));
</script>
</body>
</html>
