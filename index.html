<!DOCTYPE html>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #0d1216;
      color: #b4b2a9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    .page { max-width: 1080px; margin: 0 auto; padding: 40px 20px 60px; }

    /* ── Header ── */
    header { margin-bottom: 44px; }
    .logo { font-size: 26px; font-weight: 700; color: #00abfa; letter-spacing: -0.5px; margin-bottom: 5px; }
    .tagline { font-size: 13px; color: #3a5060; }

    /* ── Unit section ── */
    .unit { margin-bottom: 40px; }
    .unit-header {
      display: flex; align-items: baseline; gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a2535;
    }
    .unit-num { font-size: 11px; font-weight: 600; font-family: 'Courier New', monospace; color: #3a5060; }
    .unit-title { font-size: 15px; font-weight: 600; color: #d0cec6; }
    .unit-count { font-size: 11px; color: #2a3a48; margin-left: auto; }

    /* ── Card grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    /* ── Card ── */
    a.card {
      display: flex; flex-direction: column;
      background: #0b1824;
      border: 1px solid #1a2e40;
      border-radius: 8px;
      text-decoration: none;
      overflow: hidden;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    }
    a.card:hover {
      transform: translateY(-3px);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      display: block;
      flex-shrink: 0;
    }
    .thumb svg { width: 100%; height: 100%; display: block; }

    .card-body { padding: 10px 11px 11px; }
    .card-name { font-size: 12px; color: #c8c6be; line-height: 1.4; font-weight: 500; }
  </style>
</head>
